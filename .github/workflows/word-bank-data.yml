name: Word bank data

# Builds the Word Bank expansion from 한국어기초사전 (NIKL, CC BY-SA 2.0 KR) on
# GitHub's runners (Claude Code's sandbox can't reach the dataset host).
# A push touching scripts/word-bank/** runs the dry build: stats + samples in
# the log and build/words.json as an artifact. Nothing is written to the DB.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/word-bank/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q huggingface_hub pandas pyarrow
      - name: Build word list (dry)
        run: python scripts/word-bank/build.py
      - uses: actions/upload-artifact@v4
        with: { name: words, path: build/words.json }
