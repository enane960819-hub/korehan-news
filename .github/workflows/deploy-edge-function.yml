name: Deploy Edge Function

# Deploys a Supabase Edge Function from GitHub's runners. Runs on manual
# dispatch, or automatically on a push to main that touches the function
# (put "[invoke]" in the commit message to also test-invoke it).
# (Claude Code's
# sandbox can't reach api.supabase.com). Optionally invokes it once with
# the service-role key and prints the response — a real end-to-end test.
#
# Requires repo secret SUPABASE_ACCESS_TOKEN (supabase.com → Account →
# Access Tokens). Nothing else: the service-role key is fetched at run
# time with that token and masked in logs.

on:
  workflow_dispatch:
    inputs:
      function:
        description: 'Function name (folder under supabase/functions)'
        required: true
        default: 'daily-article-draft'
      invoke:
        description: 'Invoke once after deploy (builds one real draft for daily-article-draft)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'supabase/functions/daily-article-draft/**'
      - '.github/workflows/deploy-edge-function.yml'

env:
  PROJECT_REF: samghztrdvtxmrmawneu
  FUNCTION: ${{ github.event.inputs.function || 'daily-article-draft' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repo secret SUPABASE_ACCESS_TOKEN is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          case "$FUNCTION" in
            *[!a-z0-9-]*|"") echo "::error::Invalid function name: $FUNCTION"; exit 1 ;;
          esac
          test -f "supabase/functions/$FUNCTION/index.ts" || { echo "::error::supabase/functions/$FUNCTION/index.ts not found"; exit 1; }

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # verify_jwt comes from supabase/config.toml per function.
        run: supabase functions deploy "$FUNCTION" --project-ref "$PROJECT_REF"

      - name: Invoke once
        # Manual run with invoke=true, or a push whose commit message has "[invoke]".
        if: ${{ github.event.inputs.invoke == 'true' || contains(github.event.head_commit.message, '[invoke]') }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Supabase projects can hold both legacy JWT keys (service_role) and
        # new sb_secret_ keys; the function's SUPABASE_SERVICE_ROLE_KEY may be
        # either. Try every non-public key, log only name + HTTP status.
        run: |
          KEYS=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json --reveal 2>/dev/null \
                 || supabase projects api-keys --project-ref "$PROJECT_REF" -o json)
          echo "Key names: $(echo "$KEYS" | jq -r '[.[] | "\(.name)(\(.type // "legacy"))"] | join(", ")')"
          echo "Invoking $FUNCTION (can take 1-2 min)…"
          for row in $(echo "$KEYS" | jq -r '.[] | select((.name|test("anon|publishable"))|not) | @base64'); do
            NAME=$(echo "$row" | base64 -d | jq -r '.name')
            KEY=$(echo "$row" | base64 -d | jq -r '.api_key')
            [ -z "$KEY" ] || [ "$KEY" = "null" ] && continue
            echo "::add-mask::$KEY"
            CODE=$(curl -sS -m 170 -o /tmp/resp.json -w '%{http_code}' -X POST \
              "https://$PROJECT_REF.supabase.co/functions/v1/$FUNCTION" \
              -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
            echo "key=$NAME → HTTP $CODE"
            if [ "$CODE" != "401" ]; then
              cat /tmp/resp.json; echo
              [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ] && exit 0
              exit 1
            fi
          done
          echo "::error::every key got 401"; exit 1
