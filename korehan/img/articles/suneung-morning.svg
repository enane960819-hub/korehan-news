<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfeaf8"/>
      <stop offset="1" stop-color="#f6efe4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="1040" cy="150" r="58" fill="#fbe3b5"/>
  <circle cx="1040" cy="150" r="40" fill="#f9d48a"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity=".9">
    <ellipse cx="220" cy="120" rx="70" ry="22"/><ellipse cx="260" cy="104" rx="40" ry="22"/>
    <ellipse cx="760" cy="90" rx="60" ry="18"/><ellipse cx="790" cy="78" rx="34" ry="18"/>
  </g>

  <!-- airplane, paused -->
  <g transform="translate(470 120) rotate(-6)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#ffffff" stroke="#a7b3c9" stroke-width="4"/>
    <path d="M70 18 L 120 18 L 80 78 L 56 78 Z" fill="#c9d4e6"/>
    <path d="M78 16 L 118 16 L 88 -36 L 66 -36 Z" fill="#c9d4e6"/>
    <path d="M10 14 L 0 -22 L 20 -22 L 36 10 Z" fill="#c9d4e6"/>
    <circle cx="160" cy="16" r="5" fill="#a7b3c9"/><circle cx="142" cy="16" r="5" fill="#a7b3c9"/><circle cx="124" cy="16" r="5" fill="#a7b3c9"/>
  </g>
  <circle cx="712" cy="116" r="30" fill="#e58c6e"/>
  <rect x="700" y="100" width="8" height="32" rx="3" fill="#fffaf5"/>
  <rect x="716" y="100" width="8" height="32" rx="3" fill="#fffaf5"/>

  <!-- school building -->
  <rect x="150" y="250" width="620" height="320" rx="8" fill="#f4e3cf"/>
  <rect x="150" y="250" width="620" height="26" fill="#d9b48f"/>
  <rect x="380" y="190" width="160" height="80" rx="8" fill="#e9cfb2"/>
  <!-- clock at 8:10 -->
  <circle cx="460" cy="230" r="42" fill="#fffaf5" stroke="#8c6a4f" stroke-width="7"/>
  <g stroke="#8c6a4f" stroke-width="5" stroke-linecap="round">
    <path d="M460 196 v6 M460 258 v6 M426 230 h6 M488 230 h6"/>
  </g>
  <path d="M460 230 L 443 240" stroke="#5b4636" stroke-width="7" stroke-linecap="round"/>
  <path d="M460 230 L 487 214" stroke="#5b4636" stroke-width="5" stroke-linecap="round"/>
  <circle cx="460" cy="230" r="5" fill="#5b4636"/>
  <!-- windows -->
  <g fill="#cfe0f2" stroke="#fffaf5" stroke-width="5">
    <rect x="190" y="310" width="80" height="64" rx="6"/><rect x="300" y="310" width="80" height="64" rx="6"/>
    <rect x="540" y="310" width="80" height="64" rx="6"/><rect x="650" y="310" width="80" height="64" rx="6"/>
    <rect x="190" y="410" width="80" height="64" rx="6"/><rect x="300" y="410" width="80" height="64" rx="6"/>
    <rect x="540" y="410" width="80" height="64" rx="6"/><rect x="650" y="410" width="80" height="64" rx="6"/>
  </g>
  <rect x="410" y="420" width="100" height="150" rx="6" fill="#c99b74"/>
  <path d="M460 420 V570" stroke="#b38660" stroke-width="5"/>

  <!-- gate and wall -->
  <rect x="80" y="540" width="250" height="40" rx="6" fill="#d9c2a8"/>
  <rect x="590" y="540" width="250" height="40" rx="6" fill="#d9c2a8"/>
  <rect x="330" y="500" width="22" height="90" rx="4" fill="#bfa688"/>
  <rect x="568" y="500" width="22" height="90" rx="4" fill="#bfa688"/>

  <!-- road -->
  <rect x="0" y="590" width="1200" height="210" fill="#e8dccd"/>
  <rect x="0" y="660" width="1200" height="70" fill="#b9bfcc"/>
  <g fill="#f4f6fa"><rect x="40" y="692" width="70" height="8" rx="4"/><rect x="180" y="692" width="70" height="8" rx="4"/><rect x="320" y="692" width="70" height="8" rx="4"/><rect x="460" y="692" width="70" height="8" rx="4"/></g>

  <!-- police car (no text) -->
  <g transform="translate(430 600)">
    <path d="M30 60 L 60 22 Q 70 10 90 10 L 190 10 Q 208 10 220 24 L 246 60 Z" fill="#ffffff" stroke="#9aa6bd" stroke-width="4"/>
    <rect x="0" y="56" width="290" height="60" rx="20" fill="#ffffff" stroke="#9aa6bd" stroke-width="4"/>
    <rect x="0" y="78" width="290" height="16" fill="#4f74b8"/>
    <path d="M78 54 L 96 24 L 138 24 L 138 54 Z M150 54 L 150 24 L 196 24 L 216 54 Z" fill="#cfe0f2"/>
    <rect x="118" y="-6" width="56" height="16" rx="6" fill="#e5656b"/>
    <rect x="146" y="-6" width="28" height="16" rx="6" fill="#4f74b8"/>
    <circle cx="66" cy="116" r="26" fill="#4b5568"/><circle cx="66" cy="116" r="11" fill="#c9d0dc"/>
    <circle cx="226" cy="116" r="26" fill="#4b5568"/><circle cx="226" cy="116" r="11" fill="#c9d0dc"/>
    <!-- speed lines -->
    <path d="M-20 70 h-50 M-14 92 h-70 M-24 112 h-40" stroke="#c3cadb" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- cheering juniors (faceless) with pennants -->
  <g>
    <rect x="96" y="610" width="34" height="74" rx="16" fill="#8c9ab8"/><circle cx="113" cy="592" r="17" fill="#8c9ab8"/>
    <path d="M128 620 L 150 560" stroke="#8c9ab8" stroke-width="8" stroke-linecap="round"/>
    <path d="M150 560 L 186 572 L 152 590 Z" fill="#f2a7a0"/>
    <rect x="160" y="616" width="34" height="68" rx="16" fill="#b9a3c4"/><circle cx="177" cy="598" r="16" fill="#b9a3c4"/>
    <path d="M190 626 L 214 574" stroke="#b9a3c4" stroke-width="8" stroke-linecap="round"/>
    <path d="M214 574 L 248 588 L 214 604 Z" fill="#f7d98b"/>
    <rect x="224" y="612" width="34" height="72" rx="16" fill="#a3aecb"/><circle cx="241" cy="594" r="16" fill="#a3aecb"/>
    <path d="M226 626 L 206 582 M256 626 L 276 582" stroke="#a3aecb" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- gifts: yeot sticks and chapssal-tteok -->
  <g transform="translate(930 560)">
    <ellipse cx="110" cy="170" rx="130" ry="20" fill="#d8c8b4"/>
    <rect x="10" y="80" width="200" height="86" rx="12" fill="#f2a7a0"/>
    <rect x="96" y="80" width="28" height="86" fill="#fbd9cf"/>
    <path d="M110 80 q-40 -40 -60 -10 q20 18 60 10 Z M110 80 q40 -40 60 -10 q-20 18 -60 10 Z" fill="#e58c6e"/>
    <g>
      <rect x="-60" y="20" width="22" height="150" rx="10" fill="#c98e5e" transform="rotate(-12 -49 95)"/>
      <rect x="-30" y="16" width="22" height="154" rx="10" fill="#b57a4c" transform="rotate(-4 -19 93)"/>
      <rect x="-60" y="40" width="22" height="8" rx="4" fill="#e3b78f" transform="rotate(-12 -49 95)"/>
    </g>
  </g>
  <g>
    <ellipse cx="880" cy="760" rx="34" ry="22" fill="#fbf7ef" stroke="#e8dfd1" stroke-width="4"/>
    <ellipse cx="940" cy="768" rx="34" ry="22" fill="#fbf7ef" stroke="#e8dfd1" stroke-width="4"/>
    <ellipse cx="910" cy="740" rx="34" ry="22" fill="#fbf7ef" stroke="#e8dfd1" stroke-width="4"/>
    <circle cx="902" cy="734" r="3" fill="#e8dfd1"/>
  </g>
</svg>
