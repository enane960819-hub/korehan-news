    <path d="M700 585 c 12 -10, 26 -4, 20 8"/>
    <path d="M1010 640 c 14 -10, 28 0, 18 12 c -6 6, -14 2, -10 -4"/>
    <path d="M150 700 c 12 -12, 28 -6, 22 8"/>
