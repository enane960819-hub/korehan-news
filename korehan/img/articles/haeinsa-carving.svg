  <!-- carving knife -->
  <!-- tip rests on the board where carving stopped; handle rises up-right -->
  <g transform="translate(705 642) rotate(-35)">
    <path d="M0 0 L 30 -10 L 118 -12 L 118 12 L 30 6 Z" fill="#d7dde3"/>
    <path d="M0 0 L 30 6 L 118 12 L 118 2 Z" fill="#c3cad2"/>
    <rect x="116" y="-16" width="24" height="32" rx="4" fill="#b7bcc3"/>
    <rect x="138" y="-20" width="172" height="40" rx="18" fill="#7a4e33"/>
    <rect x="150" y="-12" width="148" height="8" rx="4" fill="#956446" opacity=".8"/>
