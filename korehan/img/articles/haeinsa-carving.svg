      <rect x="510" y="624" width="26" height="14" rx="3"/><rect x="510" y="646" width="26" height="14" rx="3"/><rect x="510" y="668" width="26" height="14" rx="3"/><rect x="510" y="690" width="26" height="14" rx="3"/>
      <rect x="552" y="624" width="26" height="14" rx="3"/><rect x="552" y="646" width="26" height="14" rx="3"/><rect x="552" y="668" width="26" height="14" rx="3"/><rect x="552" y="690" width="26" height="14" rx="3"/>
      <rect x="594" y="624" width="26" height="14" rx="3"/><rect x="594" y="646" width="26" height="14" rx="3"/><rect x="594" y="668" width="26" height="14" rx="3"/>
      <rect x="636" y="624" width="26" height="14" rx="3"/><rect x="636" y="646" width="26" height="14" rx="3"/>
