<style>
/* Public profile — dark (mockup ① 2026-10-29), same palette as Shop / Word Bank */
html, html body, html body.mobile-light { background:#0a1631 linear-gradient(180deg,#0d1b3d,#0a1631 900px) no-repeat !important; color:#e2e8f0; }
.pf { max-width:1150px; margin:0 auto; padding:20px 16px 70px; font-family:'DM Sans','Noto Sans KR',system-ui,sans-serif; box-sizing:border-box; }
.pf *, .pf *::before, .pf *::after { box-sizing:border-box; }
.pf-msg { text-align:center; padding:60px 20px; color:#94a3b8; font-size:14px; }
.pf-msg h2 { font:900 20px 'Noto Serif KR',serif; color:#fff; margin:0 0 6px; }
.pf-msg a { color:#93c5fd; font-weight:700; }
.pf-head { display:flex; gap:18px; align-items:center; background:linear-gradient(135deg,#172554,#312e81); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:20px; }
.pf-av { width:72px; height:72px; flex:none; border-radius:50%; background:#fff; color:#1e3a8a; font:900 30px 'Noto Serif KR',serif; display:flex; align-items:center; justify-content:center; }

.pf-name { margin:0; font:900 26px 'Noto Serif KR',serif; color:#fff; overflow-wrap:anywhere; line-height:1.2; }

.pf-tier.t-silver { background:#64748b; } .pf-tier.t-gold { background:#ca8a04; } .pf-tier.t-plat { background:#0e7490; } .pf-tier.t-diamond { background:#6d28d9; }
.pf-tier svg, .pf-tier i { width:14px; height:14px; }
.pf-acts { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.pf-btn { border:1px solid transparent; border-radius:999px; padding:9px 16px; font:800 12.5px 'DM Sans',sans-serif; display:inline-flex; gap:6px; align-items:center; cursor:pointer; text-decoration:none; line-height:1.1; transition:background .15s,border-color .15s; }
.pf-btn svg, .pf-btn i { width:15px; height:15px; }
.pf-b1 { background:#2563eb; color:#fff; } .pf-b1:hover { background:#1d4ed8; }
.pf-b2 { background:#1e293b; color:#e2e8f0; border-color:#334155; } .pf-b2:hover { background:#273449; }
.pf-b2.on { background:#be185d; border-color:#be185d; color:#fff; }
.pf-b2.on svg { fill:currentColor; }
.pf-btn[disabled] { opacity:.6; cursor:default; }
.pf-btn:focus-visible { outline:2px solid #93c5fd; outline-offset:2px; }

.pf-st b { display:block; font:900 22px 'DM Sans',sans-serif; color:#fff; }

.pf-grid { display:grid; grid-template-columns:1.25fr 1fr; gap:16px; margin-top:16px; align-items:start; }
.pf-box { background:#111c33; border:1px solid #1f2d4d; border-radius:14px; padding:14px; min-width:0; }
.pf-bt { font:800 12px 'DM Sans',sans-serif; letter-spacing:.08em; color:#93c5fd; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; text-transform:uppercase; }
.pf-bt .pf-sub { color:#94a3b8; letter-spacing:.04em; text-transform:none; font-weight:700; display:inline-flex; align-items:center; gap:4px; }
.pf-bt svg, .pf-bt i { width:13px; height:13px; }
.pf-link { border:0; background:none; color:#94a3b8; font:800 12px 'DM Sans',sans-serif; cursor:pointer; padding:2px 0; letter-spacing:.04em; }
.pf-link:hover { color:#cbd5e1; }
.pf-room-wrap { max-width:560px; margin:0 auto; }
.pf-rtabs { display:flex; gap:8px; overflow-x:auto; padding:0 0 10px; scrollbar-width:none; }
.pf-rtabs::-webkit-scrollbar { display:none; }
.pf-rtabs button { flex:none; padding:7px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:#e2e8f0; font:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
.pf-rtabs button.on { background:#fbbf24; border-color:#fbbf24; color:#1a1300; }
.pf-room-msg { aspect-ratio:10/9; border-radius:12px; background:#0b1426; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; color:#94a3b8; font-size:13px; }
.pf-badges { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
.pf-bd { background:#0b1426; border-radius:10px; padding:10px 6px 9px; text-align:center; font-size:10.5px; color:#cbd5e1; line-height:1.25; min-width:0; }
.pf-bd-ic { display:flex; justify-content:center; margin-bottom:4px; height:30px; align-items:center; }
.pf-bd-ic svg { width:30px; height:30px; }
.pf-bd.lock { color:#64748b; }
.pf-bd.lock .pf-bd-ic { filter:grayscale(1); opacity:.45; }
.pf-bd-n { overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.pf-bar { height:5px; border-radius:9px; background:#1f2d4d; margin-top:5px; overflow:hidden; }
.pf-bar i { display:block; height:100%; background:#38bdf8; border-radius:9px; }
.pf-bd small { display:block; font-size:9.5px; color:#64748b; margin-top:3px; }
.pf-none { font-size:12.5px; color:#94a3b8; padding:6px 0; }
.pf-gb { margin-top:16px; }
.pf-gb-list { display:flex; flex-direction:column; gap:2px; }
.pf-gb-e { font-size:12.5px; padding:6px 0; line-height:1.5; color:#e2e8f0; border-bottom:1px solid rgba(255,255,255,.05); overflow-wrap:anywhere; }
.pf-gb-e:last-child { border-bottom:0; }
.pf-gb-e a { color:#7dd3fc; font-weight:800; text-decoration:none; }
.pf-gb-e a:hover { text-decoration:underline; }
.pf-gb-e time { color:#64748b; font-size:11px; margin-left:6px; }
.pf-gb-form { display:flex; gap:6px; margin-top:10px; }
.pf-gb-form input { flex:1; min-width:0; background:#0b1426; border:1px solid #1f2d4d; border-radius:8px; padding:9px 10px; color:#e2e8f0; font:13px 'DM Sans','Noto Sans KR',sans-serif; }
.pf-gb-form input::placeholder { color:#64748b; }
.pf-gb-form input:focus { outline:0; border-color:#3b82f6; }
.pf-gb-note { font-size:12px; color:#94a3b8; margin-top:10px; padding:9px 10px; background:#0b1426; border-radius:8px; }
.pf-gb-note a { color:#93c5fd; font-weight:700; }
@media (max-width:860px) {
  .pf-head { flex-wrap:wrap; }
  .pf-stats { margin-left:0; width:100%; justify-content:space-between; gap:8px; padding-top:12px; border-top:1px solid rgba(255,255,255,.1); }
  .pf-st { text-align:center; flex:1; }
  .pf-grid { grid-template-columns:1fr; }
}
@media (max-width:480px) {
  .pf { padding:14px 16px 110px; }
  .pf-head { padding:16px; gap:14px; }
  .pf-av { width:58px; height:58px; font-size:24px; }
  .pf-name { font-size:21px; }
  .pf-st b { font-size:19px; }
  .pf-st span { font-size:9px; letter-spacing:.06em; }
  .pf-btn { padding:8px 13px; }
}

<script>
// Public profile page (dark redesign, mockup ① 2026-10-29)
//
// URL: /korehan-profile.html?user=<uuid>  (or ?u= short form; none = your own)
//   - Header: avatar, name, tier (khXPTier, same as My Page), Add friend +
//     Like room (or "Edit your profile" on your own), stats.
//   - Their room, read-only (get_public_room → js/features/room-view.js).
//   - Badges: earned + the 3 closest with progress ("see all" expands).
//     Earned ids come from get_public_badges; your own view also merges
//     this browser's list. Progress uses the public user_stats numbers.
//   - Guestbook: public read, friend-only write (post_guestbook RPC).
(function () {
  var sb;
  var currentUser = null;          // signed-in viewer
  var profile = null;              // host (target user) row from user_stats
  var hostId = null;
  var friendshipState = 'none';    // none | pending_out | pending_in | friends | self | blocked
  var likes = null;                // { count, liked } or null when unavailable
  var earnedIds = null;            // array of badge ids or null (unknown)
  var badgesOpen = false;
  var gbEntries = [], gbAuthors = {};

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function ic(n) { return '<i data-lucide="' + n + '" aria-hidden="true"></i>'; }
  function icons() { if (typeof renderKhLucideIcons === 'function') { try { renderKhLucideIcons(); } catch (_) {} } }
  function timeAgo(iso) {
    if (!iso) return '';
    var ms = Date.now() - new Date(iso).getTime();
    if (ms < 60000) return 'just now';
    var m = Math.floor(ms / 60000); if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
    var d = Math.floor(h / 24); if (d < 7) return d + 'd ago';
    return new Date(iso).toLocaleDateString();
  }
  function getTargetUserId() {
    var p = new URLSearchParams(location.search);
    return (p.get('user') || p.get('u') || '').trim();
  }
  function isSelf() { return friendshipState === 'self'; }

  async function loadProfile() {
    sb = (typeof getSupa === 'function') ? getSupa() : null;
    if (!sb) { showError(); return; }
    hostId = getTargetUserId();
    if (!hostId) {
      var me = await waitForSession();
      if (!me) { showError('Sign in to see your profile', 'Your profile shows your level, streak, room and guestbook. <a href="#" onclick="if(typeof openAuthModal===\'function\'){openAuthModal(\'login\');}return false;">Sign in</a>, or open a friend\'s profile from <a href="korehan-friends.html">Friends</a>.'); return; }
      hostId = me.id;
      try { history.replaceState(null, '', location.pathname + '?u=' + encodeURIComponent(hostId)); } catch (_) {}
    } else {
      await waitForSession();
    }
    try { currentUser = (typeof supaUser !== 'undefined' && supaUser) ? supaUser : null; } catch (_) { currentUser = null; }

    var r = await sb.from('user_stats')
      .select('user_id, display_name, xp, streak, articles_read, words_saved, fill_done, quizzes_done')
      .eq('user_id', hostId)
      .maybeSingle();
    if ((r.error || !r.data) && !currentUser) {
      // Learner stats are readable by signed-in learners only.
      showError('Sign in to see this profile', '<a href="#" onclick="if(typeof openAuthModal===\'function\'){openAuthModal(\'login\');}return false;">Sign in</a> to see their room, badges and guestbook.');
      return;
    }
    if (r.error || !r.data) { showError(); return; }
    profile = r.data;
    // Live streak from daily activity (user_stats.streak can be stale).
    if (typeof khActivityStreak === 'function') {
      var liveStreak = await khActivityStreak(hostId);
      if (typeof liveStreak === 'number') profile.streak = liveStreak;
    }

    if (currentUser && currentUser.id === hostId) friendshipState = 'self';
    else if (currentUser) friendshipState = await resolveFriendshipState(currentUser.id, hostId);

    var res = await Promise.all([
      sb.rpc('get_room_likes', { p_owner: hostId }),
      sb.rpc('get_public_badges', { p_user: hostId }),
      loadGuestbook()
    ]);
    likes = (res[0] && !res[0].error && res[0].data) ? res[0].data : null;
    earnedIds = (res[1] && !res[1].error && Array.isArray(res[1].data)) ? res[1].data : null;
    if (isSelf()) {
      var local = (typeof getEarnedBadges === 'function') ? getEarnedBadges() : {};
      var set = {};
      (earnedIds || []).forEach(function (id) { set[id] = 1; });
      Object.keys(local || {}).forEach(function (id) { if (local[id]) set[id] = 1; });
      earnedIds = Object.keys(set);
    }
    render();
    loadRoom();
  }

  async function loadGuestbook() {
    var gb = await sb.from('guestbook')
      .select('id, author_id, message, created_at')
      .eq('host_id', hostId)
      .order('created_at', { ascending: false })
      .limit(50);
    gbEntries = (gb && gb.data) || [];
    var ids = Array.from(new Set(gbEntries.map(function (e) { return e.author_id; })));
    gbAuthors = {};
    if (ids.length) {
      var us = await sb.from('user_stats').select('user_id, display_name').in('user_id', ids);
      ((us && us.data) || []).forEach(function (u) { gbAuthors[u.user_id] = u.display_name; });
    }
  }

  async function resolveFriendshipState(meId, otherId) {
    try {
      var bl = await sb.from('user_blocks').select('id').eq('blocker_id', meId).eq('blocked_id', otherId).maybeSingle();
      if (bl && bl.data) return 'blocked';
    } catch (_) {}
    try {
      var lo = meId < otherId ? meId : otherId;
      var hi = meId < otherId ? otherId : meId;
      var fr = await sb.from('friendships').select('id').eq('low_id', lo).eq('high_id', hi).maybeSingle();
      if (fr && fr.data) return 'friends';
    } catch (_) {}
    try {
      var pend = await sb.from('friend_requests')
        .select('id, sender_id, recipient_id, status')
        .or('and(sender_id.eq.' + meId + ',recipient_id.eq.' + otherId + '),and(sender_id.eq.' + otherId + ',recipient_id.eq.' + meId + ')')
        .eq('status', 'pending');
      var rows = (pend && pend.data) || [];
      if (rows.find(function (x) { return x.sender_id === meId; })) return 'pending_out';
      if (rows.find(function (x) { return x.recipient_id === meId; })) return 'pending_in';
    } catch (_) {}
    return 'none';
  }

  function stat(key) {
    var p = profile || {};
    if (key === 'streak') {
      return p.streak || 0;
    }
    return Number(p[key]) || 0;
  }

  function render() {
    $('pf-loading').hidden = true;
    $('pf-error').hidden = true;
    var root = $('pf-root');
    root.hidden = false;
    var name = profile.display_name || 'Learner';
    var initial = (name.match(/\S/) || ['?'])[0];
    var tier = (typeof khXPTier === 'function') ? khXPTier(profile.xp || 0) : { label: 'Bronze', cls: 'bronze' };
    var defIds = {}; ((typeof BADGE_DEFS !== 'undefined') ? BADGE_DEFS : []).forEach(function (b) { defIds[b.id] = 1; });
    var nBadges = earnedIds ? earnedIds.filter(function (id) { return defIds[id]; }).length : 0;

    root.innerHTML =
      '<section class="pf-head" aria-label="Profile">'
      +   '<div class="pf-av" aria-hidden="true">' + esc(initial) + '</div>'
      +   '<div class="pf-id"><h1 class="pf-name">' + esc(name) + '</h1>'
      +     '<span class="pf-tier t-' + esc(tier.cls) + '">' + ic('medal') + esc(tier.label) + ' · ' + (profile.xp || 0).toLocaleString() + ' XP</span>'
      +     '<div class="pf-acts" id="pf-acts">' + renderActions() + '</div></div>'
      +   '<div class="pf-stats">'
      +     '<div class="pf-st"><b>' + stat('streak') + '</b><span>Day streak</span></div>'
      +     '<div class="pf-st"><b>' + stat('articles_read') + '</b><span>Articles</span></div>'
      +     '<div class="pf-st"><b>' + stat('words_saved') + '</b><span>Words</span></div>'
      +     '<div class="pf-st"><b>' + nBadges + '</b><span>Badges</span></div>'
      +   '</div>'
      + '</section>'
      + '<div class="pf-grid">'
      +   '<section class="pf-box" aria-label="Room">'
      +     '<div class="pf-bt"><span>' + esc(isSelf() ? 'Your room' : name + '\'s room') + '</span><span class="pf-sub">'
      +       (isSelf() && likes ? ic('heart') + ' ' + likes.count + (likes.count === 1 ? ' like' : ' likes') + ' · ' : '') + 'read-only</span></div>'
      +     '<div class="pf-room-wrap"><div id="pf-room" class="pf-room-msg">Loading room…</div></div>'
      +     (isSelf() ? '<div style="text-align:center;margin-top:10px"><a class="pf-btn pf-b2" href="korehan-mypage.html#mp-miniroom-section">' + ic('pencil') + 'Decorate in My Room</a></div>' : '')
      +   '</section>'
      +   '<section class="pf-box" aria-label="Badges and guestbook">'
      +     '<div id="pf-badges">' + renderBadges() + '</div>'
      +     '<div class="pf-gb" id="pf-gb">' + renderGuestbook() + '</div>'
      +   '</section>'
      + '</div>';
    icons();
    if (isSelf() && typeof khBadgesReady === 'function') khBadgesReady();
  }

  async function loadRoom() {
    var host = $('pf-room');
    if (!host) return;
    var r = null;
    try { r = await sb.rpc('get_public_room', { p_user: hostId }); } catch (_) { r = null; }
    if (!r || r.error) { host.textContent = 'This room can\'t be shown right now.'; return; }
    if (!r.data) { host.textContent = isSelf() ? 'Your room is empty — decorate it in My Room.' : 'This learner hasn\'t set up a room yet.'; return; }
    var d = r.data;
    host.className = '';
    host.textContent = '';
    // One tab per room (get_public_room returns only the rooms this learner's plan shows).
    var rooms = (d.prefs && Array.isArray(d.prefs.rooms) && d.prefs.rooms.length) ? d.prefs.rooms
      : [{ id: 'main', name: 'Room', theme: d.prefs && d.prefs.room_theme }];
    var mainId = rooms[0].id;
    var showRoom = async function (i) {
      var room = rooms[i] || rooms[0];
      var tabs = document.getElementById('pf-room-tabs');
      if (tabs) tabs.querySelectorAll('button').forEach(function (b, j) { b.classList.toggle('on', j === i); b.setAttribute('aria-selected', j === i ? 'true' : 'false'); });
      var layout = (Array.isArray(d.layout) ? d.layout : []).filter(function (e) { return e && (e.room || mainId) === room.id; });
      host.className = ''; host.textContent = ''; host.removeAttribute('style');
      if (window.khRoomView) {
        await khRoomView.render(host, {
          layout: layout, owned: d.owned, theme: d.prefs && d.prefs.theme,
          roomTheme: room.theme, avatar: d.prefs && d.prefs.avatar,
          emptyText: isSelf() ? 'This room is empty — decorate it in My Room.' : 'Nothing placed in this room yet.'
        });
      }
    };
    if (rooms.length > 1) {
      var bar = document.createElement('div');
      bar.id = 'pf-room-tabs'; bar.className = 'pf-rtabs'; bar.setAttribute('role', 'tablist');
      bar.innerHTML = rooms.map(function (rm, i) {
        return '<button type="button" role="tab" data-i="' + i + '">' + esc(rm.name || ('Room ' + (i + 1))) + '</button>';
      }).join('');
      host.parentNode.insertBefore(bar, host);
      bar.addEventListener('click', function (e) { var b = e.target.closest('button[data-i]'); if (b) showRoom(Number(b.dataset.i)); });
    }
    await showRoom(0);
    // Character as profile picture (owner's choice, items filtered on the server).
    if (window.khAvatar && d.prefs && d.prefs.avatar && d.prefs.avatar.profile) khAvatar.setFace(document.querySelector('.pf-av'), d.prefs.avatar);
  }

  // ── Header actions ──────────────────────────────────────────────
  function likeBtn() {
    if (!likes) return '';
    var on = !!likes.liked;
    return '<button type="button" class="pf-btn pf-b2' + (on ? ' on' : '') + '" onclick="khPfLike(this)" aria-pressed="' + on + '">'
      + ic('heart') + (on ? 'Liked' : 'Like room') + ' · ' + (likes.count || 0) + '</button>';
  }
  function renderActions() {
    if (!currentUser) {
      return '<button type="button" class="pf-btn pf-b1" onclick="if(typeof openAuthModal===\'function\')openAuthModal(\'login\')">' + ic('user-plus') + 'Sign in to add friend</button>'
        + (likes ? '<span class="pf-btn pf-b2" style="cursor:default">' + ic('heart') + 'Room likes · ' + (likes.count || 0) + '</span>' : '');
    }
    if (isSelf()) return '<a class="pf-btn pf-b2" href="korehan-mypage.html">' + ic('pencil') + 'Edit your profile</a>';
    if (friendshipState === 'blocked') return '<button type="button" class="pf-btn pf-b2" onclick="khPfUnblock(this)">Unblock</button>';
    var block = '<button type="button" class="pf-btn pf-b2" onclick="khPfBlock(this)" title="Block this user" aria-label="Block this user">' + ic('ban') + '</button>';
    var main;
    if (friendshipState === 'friends') main = '<button type="button" class="pf-btn pf-b2" disabled>' + ic('users') + 'Friends</button>';
    else if (friendshipState === 'pending_out') main = '<button type="button" class="pf-btn pf-b2" disabled>' + ic('clock') + 'Request sent</button>';
    else if (friendshipState === 'pending_in') main = '<button type="button" class="pf-btn pf-b1" onclick="khPfAcceptIncoming()">' + ic('user-check') + 'Accept request</button>';
    else main = '<button type="button" class="pf-btn pf-b1" onclick="khPfAddFriend(this)">' + ic('user-plus') + 'Add friend</button>';
    return main + likeBtn() + block;
  }
  function refreshActions() {
    var el = $('pf-acts'); if (el) el.innerHTML = renderActions();
    var gb = $('pf-gb'); if (gb) gb.innerHTML = renderGuestbook();
    icons();
  }

  // ── Badges ──────────────────────────────────────────────────────
  // Progress toward a badge from the host's public numbers (or, on your
  // own profile, the same counters My Page uses).
  function badgeProgress(b) {
    if (isSelf() && typeof getBadgeProgress === 'function') {
      var g = getBadgeProgress(b);
      if (g && isFinite(g.pct)) {
        var m = /(\d+)\s*\/\s*(\d+)/.exec(g.label || '');
        return { pct: g.pct, label: m ? Math.min(+m[1], +m[2]) + ' / ' + m[2] : g.label };
      }
      return null;
    }
    var mm = /^(read|word|xp|streak)_(\d+)$/.exec(b.id);
    if (!mm) return null;
    var cur = { read: stat('articles_read'), word: stat('words_saved'), xp: Number(profile.xp) || 0, streak: stat('streak') }[mm[1]];
    var max = +mm[2];
    return { pct: cur / max * 100, label: Math.min(cur, max) + ' / ' + max };
  }
  function badgeTile(b, prog) {
    var lock = !!prog;
    return '<div class="pf-bd' + (lock ? ' lock' : '') + '" title="' + esc(b.name + ' — ' + (b.desc || '')) + '">'
      + '<div class="pf-bd-ic" aria-hidden="true">' + (b.icon || '') + '</div>'
      + '<div class="pf-bd-n">' + esc(b.name) + '</div>'
      + (lock ? '<div class="pf-bar"><i style="width:' + Math.max(3, Math.min(100, Math.round(prog.pct))) + '%"></i></div><small>' + esc(prog.label) + '</small>' : '')
      + '</div>';
  }
  function renderBadges() {
    var defs = (typeof BADGE_DEFS !== 'undefined') ? BADGE_DEFS : [];
    if (!defs.length) return '<div class="pf-bt"><span>Badges</span></div><div class="pf-none">Badges couldn\'t load.</div>';
    if (!earnedIds) return '<div class="pf-bt"><span>Badges</span></div><div class="pf-none">Badges will show here soon.</div>';
    var got = {}; earnedIds.forEach(function (id) { got[id] = 1; });
    var earned = defs.filter(function (b) { return got[b.id]; });
    var next = defs.filter(function (b) { return !got[b.id]; })
      .map(function (b) { return { b: b, p: badgeProgress(b) }; })
      .filter(function (x) { return x.p && x.p.pct < 100; })
      .sort(function (a, z) { return z.p.pct - a.p.pct; });
    var showEarned = badgesOpen ? earned : earned.slice(0, 8);
    var showNext = badgesOpen ? next : next.slice(0, 3);
    var more = earned.length > 8 || next.length > 3;
    var html = '<div class="pf-bt"><span>Badges · ' + earned.length + ' / ' + defs.length + '</span>'
      + (more ? '<button type="button" class="pf-link" onclick="khPfBadges()" aria-expanded="' + badgesOpen + '">' + (badgesOpen ? 'show less' : 'see all →') + '</button>' : '') + '</div>';
    if (!showEarned.length && !showNext.length) return html + '<div class="pf-none">No badges yet.</div>';
    if (!earned.length) html += '<div class="pf-none" style="margin-bottom:8px">No badges yet — closest ones:</div>';
    return html + '<div class="pf-badges">'
      + showEarned.map(function (b) { return badgeTile(b, null); }).join('')
      + showNext.map(function (x) { return badgeTile(x.b, x.p); }).join('')
      + '</div>';
  }
  window.khPfBadges = function () { badgesOpen = !badgesOpen; var el = $('pf-badges'); if (el) el.innerHTML = renderBadges(); };
  // Badges catch up from the server (korehan-shared.js khBadgeServerSync).
  window.addEventListener('kh-badges-changed', function () {
    if (!profile || !isSelf()) return;
    var local = (typeof getEarnedBadges === 'function') ? getEarnedBadges() : {};
    var set = {}; (earnedIds || []).forEach(function (id) { set[id] = 1; });
    Object.keys(local || {}).forEach(function (id) { if (local[id]) set[id] = 1; });
    earnedIds = Object.keys(set);
    var el = $('pf-badges'); if (el) el.innerHTML = renderBadges();
  });

  // ── Guestbook ───────────────────────────────────────────────────
  function renderGuestbook() {
    var list = gbEntries.length
      ? '<div class="pf-gb-list">' + gbEntries.map(function (e) {
          return '<div class="pf-gb-e"><a href="korehan-profile.html?user=' + encodeURIComponent(e.author_id) + '">' + esc(gbAuthors[e.author_id] || 'Learner') + ':</a> '
            + esc(e.message) + '<time datetime="' + esc(e.created_at) + '">' + timeAgo(e.created_at) + '</time></div>';
        }).join('') + '</div>'
      : '<div class="pf-none">No messages yet.' + (friendshipState === 'friends' ? ' Be the first!' : '') + '</div>';
    var form;
    if (!currentUser) form = '<div class="pf-gb-note"><a href="#" onclick="if(typeof openAuthModal===\'function\')openAuthModal(\'login\');return false;">Sign in</a> to leave a message.</div>';
    else if (isSelf()) form = '<div class="pf-gb-note">This is your wall — friends can post here.</div>';
    else if (friendshipState !== 'friends') form = '<div class="pf-gb-note">Only friends can write on this wall.</div>';
    else form = '<form class="pf-gb-form" onsubmit="khPfSubmitGuestbook(event)">'
      + '<label for="pf-gb-text" class="kh-sr-only">Message</label>'
      + '<input id="pf-gb-text" maxlength="500" placeholder="Write something nice in Korean…" required autocomplete="off">'
      + '<button type="submit" class="pf-btn pf-b1">Post</button></form>';
    return '<div class="pf-bt"><span>Guestbook</span></div>' + list + form;
  }

  function showError(title, bodyHtml) {
    $('pf-loading').hidden = true;
    $('pf-root').hidden = true;
    var box = $('pf-error');
    if (title) {
      box.children[0].textContent = title;
      box.children[1].innerHTML = bodyHtml || '';
    }
    box.hidden = false;
  }
  // Resolves with the signed-in user once the shared auth check has run
  // (window._sessionChecked), or null when signed out / after ~6 s.
  function waitForSession() {
    return new Promise(function (resolve) {
      var t0 = Date.now();
      (function check() {
        var u = (typeof supaUser !== 'undefined' && supaUser) ? supaUser : null;
        if (u) return resolve(u);
        if (window._sessionChecked || Date.now() - t0 > 6000) return resolve(null);
        setTimeout(check, 100);
      })();
    });
  }
  window.addEventListener('kh-auth-signed-in', function () {
    if (!$('pf-error').hidden) { $('pf-error').hidden = true; $('pf-loading').hidden = false; loadProfile(); }
  });

  // ── Action handlers ────────────────────────────────────────────
  window.khPfLike = async function (btn) {
    if (!currentUser || isSelf() || !likes) return;
    if (btn) btn.disabled = true;
    try {
      var r = await sb.rpc('toggle_room_like', { p_owner: hostId });
      if (r.error || !r.data || !r.data.ok) throw r.error || new Error((r.data && r.data.error) || 'like_failed');
      likes = { count: r.data.count, liked: r.data.liked };
    } catch (e) {
      if (typeof toast === 'function') toast('Couldn\'t update the like — try again.');
    }
    refreshActions();
  };

  window.khPfAddFriend = async function (btn) {
    if (!currentUser) return;
    if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
    try {
      var r = await sb.rpc('send_friend_request', { p_target: hostId });
      if (r.error) throw r.error;
      var status = r.data && r.data.status;
      if (status === 'accepted' || status === 'already_friends') friendshipState = 'friends';
      else if (status === 'sent' || status === 'already_pending') friendshipState = 'pending_out';
      refreshActions();
    } catch (e) {
      console.warn('add friend failed', e);
      refreshActions();
    }
  };

  window.khPfBlock = async function (btn) {
    if (!currentUser || !hostId) return;
    var ok = (typeof khConfirm === 'function')
      ? await khConfirm('Block this user?', 'They won\'t be able to send you friend requests, post on your wall, or see your room. Any friendship is removed.', { okLabel: 'Block', destructive: true })
      : confirm('Block this user?');
    if (!ok) return;
    if (btn) btn.disabled = true;
    try {
      var r = await sb.rpc('block_user', { p_target: hostId, p_reason: null });
      if (r.error || (r.data && !r.data.ok)) throw r.error || new Error((r.data && r.data.error) || 'block_failed');
      friendshipState = 'blocked';
    } catch (e) { console.warn('block failed', e); }
    refreshActions();
  };

  window.khPfUnblock = async function (btn) {
    if (!currentUser || !hostId) return;
    if (btn) btn.disabled = true;
    try {
      var r = await sb.rpc('unblock_user', { p_target: hostId });
      if (r.error || (r.data && !r.data.ok)) throw r.error || new Error('unblock_failed');
      friendshipState = 'none';
    } catch (e) { console.warn('unblock failed', e); }
    refreshActions();
  };

  window.khPfAcceptIncoming = async function () {
    if (!currentUser) return;
    try {
      var pend = await sb.from('friend_requests')
        .select('id').eq('sender_id', hostId).eq('recipient_id', currentUser.id).eq('status', 'pending')
        .maybeSingle();
      if (!pend || !pend.data) return;
      var r = await sb.rpc('accept_friend_request', { p_request_id: pend.data.id });
      if (r.error) throw r.error;
      friendshipState = 'friends';
      refreshActions();
    } catch (e) { console.warn('accept failed', e); }
  };

  window.khPfSubmitGuestbook = async function (ev) {
    ev.preventDefault();
    var inp = $('pf-gb-text');
    if (!inp) return;
    var msg = inp.value.trim();
    if (!msg) return;
    var btn = ev.target.querySelector('button[type="submit"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Posting…'; }
    try {
      var r = await sb.rpc('post_guestbook', { p_host: hostId, p_message: msg });
      if (r.error || (r.data && r.data.ok === false)) throw r.error || new Error((r.data && r.data.error) || 'post_failed');
      await loadGuestbook();
      var gb = $('pf-gb'); if (gb) gb.innerHTML = renderGuestbook();
      icons();
    } catch (e) {
      console.warn('guestbook post failed', e);
      if (typeof toast === 'function') toast('Couldn\'t post — try again.');
      if (btn) { btn.disabled = false; btn.textContent = 'Post'; }
    }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', loadProfile);
  else loadProfile();
})();
</script>
</body>
</html>
