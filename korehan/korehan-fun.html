<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<link rel="preconnect" href="https://samghztrdvtxmrmawneu.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Playground — KoreHani</title>
  <link rel="stylesheet" href="korehan-shared.css?v=20261030dm">
  <style>
    /* Playground (mockup 2026-10-29 ③) — dark like Shop / Word Bank / Reporter Cards; gradient tiles kept. */
    html, html body, html body.mobile-light{background:#0a1631 linear-gradient(180deg,#0d1b3d,#0a1631 900px) no-repeat !important;color:#e2e8f0}
    body{margin:0;font-family:'DM Sans','Noto Sans KR',-apple-system,sans-serif}
    .wrap{max-width:1180px;margin:0 auto;padding:26px 24px 60px;position:relative;z-index:2}
    .pg-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .pg-head h1{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:32px;font-weight:900;line-height:1.15;color:#fff;display:inline-flex;align-items:center;gap:10px}
    .pg-head p{margin:5px 0 0;color:#94a3b8;font-size:13.5px;line-height:1.55;max-width:560px}
    .pg-today{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;font-size:12.5px;color:#cbd5e1;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
    .pg-today b{color:#fbbf24;font-weight:800}
    .pg-today .kh-ui-icon{width:14px;height:14px;vertical-align:-2px;color:#fbbf24}
    .pg-today small{display:block;width:100%;font-size:11px;color:#94a3b8;margin-top:-6px}
    .pg-chip{position:absolute;top:10px;right:10px;z-index:3;display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;background:rgba(0,0,0,.35);color:#fff;padding:4px 9px;border-radius:999px;backdrop-filter:blur(3px)}
    .pg-chip .kh-ui-icon{width:12px;height:12px}
    .pg-chip.off{opacity:.65}
    .pg-done{position:absolute;top:10px;left:10px;z-index:3;display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;background:#16a34a;color:#fff;padding:4px 9px;border-radius:999px}
    .pg-done .kh-ui-icon{width:12px;height:12px}
    .fun-game-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
    .fun-game-card{display:block;border-radius:18px;overflow:hidden;text-decoration:none;color:#fff;transition:.25s transform,.25s box-shadow;position:relative;aspect-ratio:4/3}
    .fun-game-card:hover{transform:translateY(-5px);box-shadow:0 20px 40px rgba(0,0,0,.25)}

    /* Cover = full card */
    .fun-cover{position:absolute;inset:0;overflow:hidden}
    /* Overlay gradient + text at bottom */
    .fun-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.7) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px;z-index:2}
    .fun-title{font-size:18px;font-weight:900;line-height:1.2;margin-bottom:3px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
    .fun-sub{font-size:11px;font-weight:700;color:rgba(255,255,255,.7);text-shadow:0 1px 4px rgba(0,0,0,.3)}

    /* ── Animated covers ── */
    /* Word Drop: falling letters */
    .cv-worddrop{background:linear-gradient(135deg,#059669,#0d9488)}
    .cv-worddrop .fl{position:absolute;font-size:20px;font-weight:900;color:rgba(255,255,255,.15);animation:fall linear infinite;font-family:'Noto Sans KR',sans-serif}
    @keyframes fall{0%{transform:translateY(-30px)}100%{transform:translateY(300px)}}

    /* Chosung: blinking consonants */
    .cv-chosung{background:linear-gradient(135deg,#7c3aed,#ec4899)}
    .cv-chosung .ch{position:absolute;font-size:32px;font-weight:900;color:rgba(255,255,255,.12);animation:choPulse 2s ease-in-out infinite;font-family:'Noto Sans KR',sans-serif}
    @keyframes choPulse{0%,100%{opacity:.08;transform:scale(.9)}50%{opacity:.2;transform:scale(1.1)}}

    /* Memory: flipping cards */
    .cv-memory{background:linear-gradient(135deg,#0891b2,#6366f1)}
    .cv-memory .mc{position:absolute;width:36px;height:48px;border-radius:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);animation:memFlip 3s ease-in-out infinite;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:rgba(255,255,255,.25)}
    @keyframes memFlip{0%,100%{transform:rotateY(0)}50%{transform:rotateY(180deg)}}

    /* Hangul Tetris: falling blocks */
    .cv-sentorder{background:linear-gradient(135deg,#fbbf24,#f97316)}
    .cv-sentorder .sw{position:absolute;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.85);font-size:13px;font-weight:800;font-family:'Noto Sans KR',sans-serif;animation:soDrift 4s ease-in-out infinite}
    @keyframes soDrift{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
    .cv-dictation{background:linear-gradient(135deg,#34d399,#06b6d4)}
    .cv-dictation .dw{position:absolute;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);color:rgba(255,255,255,.9);font-size:14px;font-weight:900;animation:dwPulse 2.6s ease-in-out infinite}
    @keyframes dwPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.18);opacity:1}}
    .cv-tetris{background:linear-gradient(135deg,#d946ef,#f97316)}
    .cv-tetris .tb{position:absolute;width:32px;height:32px;border-radius:6px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);animation:tFall linear infinite;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:rgba(255,255,255,.2);font-family:'Noto Sans KR',sans-serif}
    @keyframes tFall{0%{transform:translateY(-40px)}100%{transform:translateY(300px)}}

    /* OX Quiz: floating O and X */
    .cv-ox{background:linear-gradient(135deg,#dc2626,#2563eb)}
    .cv-ox .oxf{position:absolute;font-size:28px;font-weight:900;animation:oxFloat 4s ease-in-out infinite}
    @keyframes oxFloat{0%,100%{transform:translateY(0) rotate(0deg);opacity:.15}50%{transform:translateY(-15px) rotate(10deg);opacity:.3}}

    /* Name Generator: sparkle */
    .cv-name{background:linear-gradient(135deg,#1d4ed8,#7c3aed)}
    .cv-name .sp{position:absolute;font-size:18px;animation:sparkle 2.5s ease-in-out infinite}
    @keyframes sparkle{0%,100%{opacity:.1;transform:scale(.7)}50%{opacity:.35;transform:scale(1.2)}}

    /* World Cup: pulsing */
    @keyframes wpPulse{0%,100%{opacity:.12;transform:scale(.8) rotate(-5deg)}50%{opacity:.28;transform:scale(1.15) rotate(5deg)}}

    /* Fortune: glow */
    @keyframes fGlow{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:.6;transform:scale(1.3)}}

    @media(max-width:900px){.fun-game-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:700px){.fun-game-grid{grid-template-columns:repeat(2,1fr);gap:10px}.wrap{padding:18px 16px 44px}.pg-head h1{font-size:26px}.pg-head p{font-size:12.5px}.pg-today{width:100%;box-sizing:border-box;gap:10px 14px}.fun-game-card{aspect-ratio:1/1;border-radius:14px}.fun-overlay{padding:10px 12px}.fun-title{font-size:14px;margin-bottom:1px}.fun-sub{font-size:10px}.pg-chip,.pg-done{font-size:9.5px;padding:3px 7px;top:8px}.pg-chip{right:8px}.pg-done{left:8px}}
  </style>
</head>
<body>
  <div id="kh-header"></div>
  <main class="wrap">
    <div class="pg-head">
      <div>
        <h1><i data-lucide="gamepad-2" class="kh-ui-icon" style="width:30px;height:30px" aria-hidden="true"></i><span>Playground</span></h1>
        <p>Quick games with real Korean. Finish a game with at least one right answer to earn XP; a rewarded game also counts toward your streak.</p>
      </div>
      <div class="pg-today" id="pg-today" style="display:none"></div>
    </div>
    <section id="fun-game-grid" class="fun-game-grid"></section>
  </main>
  <div id="kh-footer"></div>

<script src="js/core/user-analytics.js?v=20261014a"></script>

<script src="js/core/emoji-icons.js?v=20261029t"></script>
  <script>
(function(){
  // Inline-SVG wrapper for decorative card animations. The emoji sweep
  // landed in PR #7S covered the individual game pages, but the hub
  // (this file) still painted emoji into each card's animation overlay.
  // PR #7AJ swaps those emojis for `KH_ICON_*` SVGs from `js/core/icons.js`.
  // Returns an empty string if the named icon isn't in the catalog, so
  // the layout stays intact even when no SVG replacement exists.
  function _hubIcon(name, size, color, opacity){
    var ico = (window['KH_ICON_' + String(name).toUpperCase()]) || '';
    if (!ico) return '';
    var sty = 'display:inline-flex;align-items:center;justify-content:center;'
            + 'width:' + size + 'px;height:' + size + 'px;color:' + (color||'currentColor') + ';'
            + 'opacity:' + (opacity != null ? opacity : 1);
    return '<span style="' + sty + '">' + ico + '</span>';
  }

  var games = [
    {id:'word-drop',gid:'worddrop',title:'Word Drop',sub:'Type before they fall',href:'korehan-fun-worddrop.html',cv:'cv-worddrop',
     anim:function(){var w=['친구','학교','사랑','음식','여행','커피','영화','행복'];var h='';for(var i=0;i<8;i++)h+='<div class="fl" style="left:'+((i*13+5)%90)+'%;animation-duration:'+(2.5+i*.4)+'s;animation-delay:-'+(i*.6)+'s">'+w[i]+'</div>';return h;}},
    {id:'chosung-quiz',gid:'chosung',title:'Chosung Quiz',sub:'Guess from consonants',href:'korehan-fun-chosung.html',cv:'cv-chosung',
     anim:function(){var c=['ㅎㄱ','ㅊㄱ','ㅅㄹ','ㅇㅅ','ㅎㅂ','ㄱㅈ','ㅇㅎ'];var h='';for(var i=0;i<7;i++)h+='<div class="ch" style="left:'+(8+i*13)+'%;top:'+(10+((i*17)%60))+'%;animation-delay:'+(i*.3)+'s;font-size:'+(24+i%3*6)+'px">'+c[i]+'</div>';return h;}},
    {id:'memory-match',gid:'memory',title:'Memory Match',sub:'Flip & match pairs',href:'korehan-fun-memory.html',cv:'cv-memory',
     anim:function(){var t=['가','나','A','B','다','C','라','D','마','E','바','F'];var h='';for(var i=0;i<12;i++){var r=Math.floor(i/4),col=i%4;h+='<div class="mc" style="left:'+(12+col*22)+'%;top:'+(12+r*32)+'%;animation-delay:'+(i*.25)+'s">'+t[i]+'</div>';}return h;}},
    {id:'hangul-tetris',gid:'hangul-tetris',title:'Hangul Tetris',sub:'Build Korean syllables',href:'korehan-fun-hangul-tetris.html',cv:'cv-tetris',
     anim:function(){var j=['ㅎ','ㅏ','ㄴ','ㄱ','ㅜ','ㄹ','ㅁ','ㅣ'];var h='';for(var i=0;i<8;i++)h+='<div class="tb" style="left:'+((i*14+3)%85)+'%;animation-duration:'+(2+i*.3)+'s;animation-delay:-'+(i*.5)+'s">'+j[i]+'</div>';return h;}},
    {id:'sentence-order',gid:'sentence-order',title:'Sentence Order',sub:'Build sentences in order',href:'korehan-fun-sentence-order.html',cv:'cv-sentorder',
     anim:function(){var w=['저는','한국어를','배워요','오늘','날씨가','좋아요','커피','한 잔','주세요'];var h='';for(var i=0;i<9;i++)h+='<div class="sw" style="left:'+(8+(i%3)*32)+'%;top:'+(12+Math.floor(i/3)*30)+'%;animation-delay:'+(i*.25)+'s">'+w[i]+'</div>';return h;}},
    {id:'dictation',gid:'dictation',title:'Dictation',sub:'Listen & type Korean',href:'korehan-fun-dictation.html',cv:'cv-dictation',
     anim:function(){
       // Dictation card: headphones / volume SVG plus the existing
       // ♪♫◐◑ Unicode music glyphs (not emoji — those are kept).
       var ico=['volume','headphones','music'];
       var glyphs=['♪','♫','◐','◑'];
       var h='';
       for(var i=0;i<8;i++){
         var cell;
         if (i % 2 === 0) cell = _hubIcon(ico[(i/2)%ico.length], 18, 'rgba(255,255,255,.9)', .85);
         else cell = '<span style="color:rgba(255,255,255,.85);font-size:14px;font-weight:900">'+glyphs[i%glyphs.length]+'</span>';
         h+='<div class="dw" style="left:'+(8+(i%4)*22)+'%;top:'+(14+Math.floor(i/4)*40)+'%;animation-delay:'+(i*.32)+'s">'+cell+'</div>';
       }
       return h;
     }},
    {id:'ox-quiz',gid:'ox',title:'Korea OX Quiz',sub:'True or false?',href:'korehan-fun-ox.html',cv:'cv-ox',
     anim:function(){
       // OX card: alternating CHECK (✓ for the ⭕ side) and X icons.
       // The actual game retains ⭕/❌ on the click targets (those are
       // functional and stay per #7S decision); decoration here is SVG.
       var h='';
       for(var i=0;i<6;i++){
         var name = i % 2 === 0 ? 'check' : 'x';
         var color = i % 2 === 0 ? '#86efac' : '#fca5a5';
         var sz = 22 + (i%3)*8;
         h+='<div class="oxf" style="left:'+(8+i*16)+'%;top:'+(15+((i*20)%55))+'%;animation-delay:'+(i*.5)+'s">'+_hubIcon(name, sz, color, .25)+'</div>';
       }
       return h;
     }},
    {id:'name-generator',gid:'name',title:'Korean Name Generator',sub:'Get your Korean name',href:'korehan-fun-name.html',cv:'cv-name',
     anim:function(){
       // Name-generator card: alternating SPARKLE + STAR SVGs and the
       // existing 가/나/한/이 hangul syllables (those are text, kept).
       var slots=['sparkle','syl-가','sparkle','syl-나','star','syl-한','sparkle','syl-이'];
       var h='';
       for(var i=0;i<8;i++){
         var v=slots[i];
         var cell;
         if (v.indexOf('syl-')===0) cell='<span style="color:rgba(255,255,255,.85);font-size:18px;font-weight:900;font-family:\'Noto Sans KR\',sans-serif">'+v.slice(4)+'</span>';
         else cell=_hubIcon(v, 16, '#c4b5fd', .85);
         h+='<div class="sp" style="left:'+(5+i*12)+'%;top:'+(10+((i*19)%65))+'%;animation-delay:'+(i*.35)+'s">'+cell+'</div>';
       }
       return h;
     }}
  ];

  // Rewards: khGameComplete(gid) → award_xp 'game_complete' (korehan-shared.js,
  // 20261029_playground_game_rewards.sql): one grant per game per KST day,
  // at most daily_cap rewarded games a day. Every game page, the Name
  // Generator included, calls it, so every tile shows the reward. The amount
  // and the cap are read from xp_config / coin_reward_config (both readable
  // by the client); 10 XP / 5 games are the fallbacks.
  var reward = { xp: 10, cap: 5 };
  var today = null; // { doneIds:{gid:1}, xp, played, words } for a signed-in learner

  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); }

  function render(){
    var el=document.getElementById('fun-game-grid');if(!el)return;
    var capped = !!(today && today.played >= reward.cap);
    el.innerHTML=games.map(function(g){
      var done = !!(today && today.doneIds[g.gid]);
      var chip = (capped && !done)
        ? '<span class="pg-chip off" title="You already earned XP from ' + reward.cap + ' games today">Daily limit reached</span>'
        : '<span class="pg-chip"' + (today ? '' : ' title="Log in to earn XP"') + '><i data-lucide="zap" class="kh-ui-icon" aria-hidden="true"></i>+' + reward.xp + ' XP</span>';
      return '<a class="fun-game-card" href="'+g.href+'" aria-label="'+esc(g.title)+(done?' (done today)':'')+'">'
        +'<div class="fun-cover '+g.cv+'">'+g.anim()+'</div>'
        +(done ? '<span class="pg-done"><i data-lucide="check" class="kh-ui-icon" aria-hidden="true"></i>Done today</span>' : '')
        +chip
        +'<div class="fun-overlay">'
        +'<div class="fun-title">'+g.title+'</div>'
        +'<div class="fun-sub">'+g.sub+'</div>'
        +'</div></a>';
    }).join('');
    renderToday();
  }

  function renderToday(){
    var box = document.getElementById('pg-today'); if (!box) return;
    if (!today) { box.style.display = 'none'; box.innerHTML = ''; return; }
    box.style.display = '';
    box.innerHTML = '<span><i data-lucide="zap" class="kh-ui-icon" aria-hidden="true"></i> Today: <b>+' + today.xp + ' XP</b> from games</span>'
      + '<span>' + Math.min(today.played, reward.cap) + ' / ' + reward.cap + ' rewarded</span>'
      + (today.words != null ? '<span>' + today.words + (today.words === 1 ? ' new word' : ' new words') + '</span>' : '');
  }

  function kstDayStartIso(){
    var day = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
    return new Date(day + 'T00:00:00+09:00').toISOString();
  }

  async function waitForAuth(){
    if (typeof supaUser !== 'undefined' && supaUser) return supaUser;
    await new Promise(function(resolve){
      var done = false;
      function finish(){ if (done) return; done = true; resolve(); }
      window.addEventListener('kh-auth-signed-in', finish);
      var poll = setInterval(function(){ if (supaUser || window._sessionChecked) { clearInterval(poll); finish(); } }, 100);
      setTimeout(function(){ clearInterval(poll); finish(); }, 8000);
    });
    return (typeof supaUser !== 'undefined') ? supaUser : null;
  }

  async function loadRewardConfig(sb){
    try {
      var r = await Promise.all([
        sb.from('xp_config').select('xp_amount,is_active').eq('action_key', 'game_complete').maybeSingle(),
        sb.from('coin_reward_config').select('daily_cap').eq('action_key', 'game_complete').maybeSingle()
      ]);
      if (!r[0].error && r[0].data && r[0].data.is_active !== false && Number(r[0].data.xp_amount) > 0) reward.xp = Number(r[0].data.xp_amount);
      if (!r[1].error && r[1].data && Number(r[1].data.daily_cap) > 0) reward.cap = Number(r[1].data.daily_cap);
    } catch (_) {}
  }

  // The learner's own game rewards today (xp_log is owner-readable) and the
  // words they saved from a game today (user_saved_words.source_kind, e.g.
  // 'memory_game' from Memory Match).
  async function loadToday(sb, user){
    var since = kstDayStartIso();
    var r = await Promise.all([
      sb.from('xp_log').select('xp_amount,meta,created_at').eq('user_id', user.id).eq('action_key', 'game_complete').gte('created_at', since),
      sb.from('user_saved_words').select('id', { count: 'exact', head: true }).eq('user_id', user.id).ilike('source_kind', '%game%').gte('created_at', since)
    ]);
    if (r[0].error) return null;
    var t = { doneIds: {}, xp: 0, played: 0, words: null };
    (r[0].data || []).forEach(function(row){
      var cid = String((row.meta && row.meta.content_id) || '');
      if (cid.indexOf('game:') === 0) t.doneIds[cid.slice(5)] = 1;
      t.xp += Number(row.xp_amount || 0);
      t.played++;
    });
    if (!r[1].error && typeof r[1].count === 'number') t.words = r[1].count;
    return t;
  }

  async function refresh(){
    var sb = (typeof getSupa === 'function') ? getSupa() : null;
    if (!sb) return;
    await loadRewardConfig(sb);
    render();
    var user = await waitForAuth();
    if (!user) { today = null; render(); return; }
    try { today = await loadToday(sb, user); } catch (_) { today = null; }
    render();
  }

  // Hero "Surprise me" picks a random game so the header has a real
  // CTA, not just decoration.
  window.khPlaygroundSurprise = function(){
    if (!games.length) return;
    var pick = games[Math.floor(Math.random() * games.length)];
    if (pick && pick.href) location.href = pick.href;
  };
  function start(){ render(); refresh(); }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);
  else start();
  // Coming back from a game via the Back button (bfcache): pick up the new reward.
  window.addEventListener('pageshow', function(e){ if (e.persisted) refresh(); });
})();
</script>
