<style>
body{margin:0;background:#050b15;color:#e0f2fe;font-family:'Happy Monkey','Jua','DM Sans','Noto Sans KR',Inter,sans-serif;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
.back{display:inline-flex;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#94a3b8;text-decoration:none;font-size:12px;font-weight:700;margin-bottom:8px}
.game-header{display:flex;justify-content:space-between;align-items:center;padding:8px 0;flex-shrink:0}
.game-title{font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}
.stat{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.stat-val{color:#7dd3fc}
.game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.cat-badge{font-size:11px;font-weight:800;padding:4px 12px;border-radius:999px;background:rgba(96,165,250,.15);color:#60a5fa;text-transform:uppercase;letter-spacing:.08em}
.q-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:28px 24px;text-align:center;width:100%;max-width:460px}
.q-text{font-size:20px;font-weight:800;line-height:1.5;color:#fff;font-family:'Noto Sans KR',sans-serif}
.timer-wrap{width:100%;max-width:460px;height:5px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.timer-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#2563eb,#7dd3fc);transition:width .1s linear}
.timer-bar.danger{background:linear-gradient(90deg,#ef4444,#fbbf24)}
.ox-btns{display:flex;gap:16px;width:100%;max-width:460px}
.ox-btn{flex:1;padding:20px;border:3px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(255,255,255,.03);font-size:48px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.ox-btn:active{transform:scale(.95)}
.ox-btn.o:hover{border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08)}
.ox-btn.x:hover{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08)}
.ox-btn.correct{border-color:#4ade80;background:rgba(74,222,128,.2);animation:btnPop .3s ease}
.ox-btn.wrong{border-color:#ef4444;background:rgba(239,68,68,.2);animation:btnShake .3s ease}
@keyframes btnPop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes btnShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.exp-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 18px;width:100%;max-width:460px;text-align:center;font-size:13px;color:#94a3b8;line-height:1.5;display:none}
.exp-card .answer{font-size:16px;font-weight:900;margin-bottom:6px}
.exp-card .answer.yes{color:#4ade80}
.exp-card .answer.no{color:#ef4444}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,11,21,.95);z-index:10;padding:20px}
.big-btn{padding:16px 40px;border:none;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:18px;font-weight:900;cursor:pointer;font-family:inherit;margin-top:20px;box-shadow:0 8px 32px rgba(37,99,235,.4)}
@media(max-width:500px){.q-text{font-size:17px}.ox-btn{font-size:36px;padding:16px}}
#kh-daily-mission,#vocab-admin-bar,.mobile-bottom-nav,.mobile-sticky-study,#kh-header,#kh-footer{display:none!important}
</style>

{q:'한국의 국기 이름은 태극기이다',a:true,cat:'culture',exp:'The Korean flag is called Taegeukgi (태극기).'},
{q:'서울의 인구는 약 1000만 명이다',a:true,cat:'geography',exp:'Seoul has approximately 9.7 million people.'},

{q:'김밥에는 보통 식초밥을 사용한다',a:false,cat:'food',exp:'Kimbap uses sesame oil rice, not vinegared rice like sushi.'},
{q:'한국에서 술을 따를 때 한 손으로 따라도 된다',a:false,cat:'etiquette',exp:'Pour with two hands or support your pouring arm for elders.'},
{q:'한국에서 어른 앞에서 고개를 돌려 술을 마시는 것이 예의이다',a:true,cat:'etiquette',exp:'Turn away from elders when drinking as a sign of respect.'},

{q:'한국어에는 높임말 단계가 7개 있다',a:true,cat:'language',exp:'Korean has 7 speech levels (격식/비격식 합쳐서).'},

{q:'한국 지하철에서는 음식을 먹을 수 있다',a:false,cat:'daily',exp:'Eating on the subway is generally prohibited and frowned upon.'},
{q:'K-pop 연습생 기간은 보통 1개월 정도이다',a:false,cat:'kpop',exp:'K-pop trainees typically train for 2-7 years before debut.'},
{q:'한국 드라마는 보통 16부작이다',a:true,cat:'kpop',exp:'Most K-dramas are 16 episodes (some 12 or 20).'},
{q:'조선 시대는 약 500년간 지속되었다',a:true,cat:'history',exp:'Joseon dynasty lasted from 1392-1897 (505 years).'},
{q:'한글날은 10월 9일이다',a:true,cat:'history',exp:'Hangul Day celebrates the creation of the Korean alphabet.'},
{q:'한국에서 선배에게 반말을 써도 괜찮다',a:false,cat:'etiquette',exp:'You must use 존댓말 with seniors unless they give permission.'},
{q:'불고기는 구운 고기라는 뜻이다',a:true,cat:'food',exp:'불 (fire) + 고기 (meat) = grilled/fire meat.'},
{q:'한국에서 집에 들어갈 때 신발을 벗는다',a:true,cat:'etiquette',exp:'Shoes are always removed before entering a Korean home.'},
{q:'한국의 인터넷 속도는 세계 최하위이다',a:false,cat:'daily',exp:'South Korea consistently ranks among the fastest internet speeds globally.'},
{q:'한국에서 혈액형으로 성격을 판단하는 문화가 있다',a:true,cat:'culture',exp:'Blood type personality theory is popular in Korea.'},
{q:'세종대왕은 조선의 3대 왕이다',a:false,cat:'history',exp:'Sejong the Great was the 4th king of Joseon.'},
{q:'한국에서 찜질방은 대중목욕탕이다',a:true,cat:'culture',exp:'Jjimjilbang is a Korean bathhouse/spa.'},
{q:'한국어에서 "감사합니다"는 반말이다',a:false,cat:'language',exp:'"감사합니다" is formal/polite speech (존댓말).'},
{q:'한국에서 생일에 미역국을 먹는다',a:true,cat:'food',exp:'Koreans eat seaweed soup (미역국) on birthdays.'},
{q:'한국은 OECD 회원국이다',a:true,cat:'daily',exp:'South Korea joined the OECD in 1996.'},
{q:'한국의 전통 난방 시스템은 온돌이다',a:true,cat:'culture',exp:'Ondol is the traditional underfloor heating system.'},
{q:'한국에서 가위바위보를 할 때 "가위바위보"라고 외친다',a:true,cat:'culture',exp:'The Korean version is called 가위바위보.'},
{q:'BTS의 팬덤 이름은 BLINK이다',a:false,cat:'kpop',exp:'BTS fans are called ARMY. BLINK is BLACKPINK\'s fandom.'},
{q:'한국에서 번호 없는 소주잔으로 건배할 때 어른보다 낮게 잔을 부딪혀야 한다',a:true,cat:'etiquette',exp:'Clink your glass lower than an elder\'s as a sign of respect.'},
{q:'대한민국의 공식 영어 이름은 Republic of Korea이다',a:true,cat:'daily',exp:'The official name is Republic of Korea (ROK).'},
{q:'한국에서 빼빼로 데이는 12월 11일이다',a:false,cat:'culture',exp:'Pepero Day is November 11 (11/11 — sticks look like Pepero).'},
];
var CAT_LABEL={food:'Food',etiquette:'Etiquette',culture:'Culture',history:'History',language:'Language',kpop:'K-pop',geography:'Geography',daily:'Daily Life'};
var score=0,streak=0,maxStreak=0,lives=3,qIdx=0,correctCount=0,totalAnswered=0;
var timer=null,timerStart=0,timeLimit=15000,locked=false;
var shuffled=[];
var bestScore=parseInt(localStorage.getItem('kh_ox_best')||'0');

function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

window.startGame=function(){
  document.getElementById('start-screen').style.display='none';
  document.getElementById('end-screen').style.display='none';
  score=0;streak=0;maxStreak=0;lives=3;qIdx=0;correctCount=0;totalAnswered=0;locked=false;
  shuffled=shuffle(Q);
  updateUI();
  showQuestion();
};

function showQuestion(){
  if(qIdx>=shuffled.length||lives<=0){endGame();return;}
  var q=shuffled[qIdx];
  document.getElementById('g-question').textContent=q.q;
  document.getElementById('g-cat').textContent=CAT_LABEL[q.cat]||q.cat;
  document.getElementById('exp-card').style.display='none';
  document.getElementById('btn-o').className='ox-btn o';
  document.getElementById('btn-x').className='ox-btn x';
  locked=false;
  startTimer();
}

function startTimer(){
  timerStart=Date.now();
  var bar=document.getElementById('timer-bar');
  bar.style.width='100%';bar.className='timer-bar';
  if(timer)clearInterval(timer);
  timer=setInterval(function(){
    var e=Date.now()-timerStart;var pct=Math.max(0,100-(e/timeLimit*100));
    bar.style.width=pct+'%';
    if(pct<30)bar.className='timer-bar danger';
    if(e>=timeLimit){clearInterval(timer);if(!locked)answer(null);}
  },50);
}

window.answer=function(picked){
  if(locked)return;
  locked=true;
  clearInterval(timer);
  var q=shuffled[qIdx];
  var isCorrect=picked===q.a;
  totalAnswered++;
  var btnO=document.getElementById('btn-o');
  var btnX=document.getElementById('btn-x');

  if(picked===null){
    // timeout
    isCorrect=false;
    btnO.className='ox-btn o';btnX.className='ox-btn x';
  } else if(picked===true){
    btnO.className='ox-btn o '+(isCorrect?'correct':'wrong');
  } else {
    btnX.className='ox-btn x '+(isCorrect?'correct':'wrong');
  }
  // highlight correct
  if(q.a===true)btnO.className='ox-btn o correct';
  else btnX.className='ox-btn x correct';

  if(isCorrect){
    correctCount++;streak++;
    if(streak>maxStreak)maxStreak=streak;
    score+=10+Math.min(streak*5,50);
  } else {
    streak=0;lives--;
  }
  updateUI();
  showExp(q,isCorrect);
  qIdx++;
  setTimeout(showQuestion,2200);
};

function showExp(q,isCorrect){
  var el=document.getElementById('exp-card');
  el.style.display='block';
  el.innerHTML='<div class="answer '+(isCorrect?'yes':'no')+'">'+(isCorrect?'✅ Correct!':'❌ Wrong!')+'</div>'+q.exp;
}

function updateUI(){
  document.getElementById('g-score').textContent=score;
  document.getElementById('g-streak').textContent=streak;
  document.getElementById('g-lives').textContent=lives;
}

function endGame(){
  clearInterval(timer);
  if(score>bestScore){bestScore=score;localStorage.setItem('kh_ox_best',String(bestScore));}
  var pct=totalAnswered?Math.round(correctCount/totalAnswered*100):0;
  var emoji=pct>=80?'🏆':pct>=60?'⭐':pct>=40?'👍':'💪';
  document.getElementById('end-emoji').textContent=emoji;
  document.getElementById('end-score').textContent=score+' pts';
  document.getElementById('end-stats').textContent=correctCount+'/'+totalAnswered+' correct · max streak '+maxStreak+' · '+pct+'%';
  document.getElementById('end-best').textContent='Best: '+bestScore+' pts';
  document.getElementById('end-screen').style.display='flex';
}
})();
</script>
