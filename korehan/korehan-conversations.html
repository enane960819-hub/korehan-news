<style>
/* Conversations (mockup F, 2026-10-28) — light reading page; the role-play
   and done screens use the dark study surface. */
body{background:#f6f8fc}
html body.cv-dark{background:#0a1631 !important}
.cv-wrap{max-width:760px;margin:0 auto;padding:18px 16px 120px;font-family:'DM Sans','Noto Sans KR',sans-serif;color:#0f172a}
.cv-h1{font-size:26px;font-weight:800;margin:0}
.cv-hs{font-size:13px;color:#64748b;margin:3px 0 0}
.cv-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.cv-chips::-webkit-scrollbar{display:none}
.cv-chip{flex-shrink:0;font:inherit;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid #e2e8f0;color:#475569;cursor:pointer}
.cv-chip.on{background:#0f172a;color:#fff;border-color:#0f172a}
.cv-pick{display:block;width:100%;text-align:left;margin-top:14px;padding:16px;border-radius:18px;border:0;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;font:inherit;cursor:pointer}
.cv-pick small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;font-weight:800}
.cv-pick b{display:block;font-size:17px;margin:4px 0 2px}
.cv-pick .ko{display:block;font-family:'Noto Sans KR',sans-serif;font-size:12.5px;opacity:.85}
.cv-pick-go{display:inline-block;margin-top:10px;background:#fff;color:#1e3a8a;font-size:12.5px;font-weight:800;padding:7px 13px;border-radius:10px}
.cv-list{margin-top:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media(min-width:720px){.cv-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cv-card{min-width:0;display:flex;gap:11px;align-items:center;padding:12px 13px;border-radius:16px;background:#fff;border:1px solid #e8edf4;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
.cv-card:hover{border-color:#bfdbfe;box-shadow:0 6px 18px rgba(15,23,42,.06)}
.cv-av2{position:relative;width:46px;height:40px;flex-shrink:0;display:inline-block}
.cv-av2 i{position:absolute;width:30px;height:30px;border-radius:50%;border:2px solid #fff;font-style:normal;font-size:12px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans KR',sans-serif}
.cv-av2 i:first-child{left:0;top:0}.cv-av2 i:last-child{right:0;bottom:0}
.cv-av2.sm{transform:scale(.85)}
.cv-ct{flex:1;min-width:0}
.cv-ct b{display:block;font-size:14px;line-height:1.3}
.cv-ct .ko{display:block;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cv-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cv-meta em{font-style:normal;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:7px;background:#f1f5f9;color:#475569}
.cv-meta .ban,.cv-lv .ban{background:#fef3c7;color:#92400e}
.cv-meta .jon,.cv-lv .jon{background:#e0e7ff;color:#3730a3}
.cv-meta .mix,.cv-lv .mix{background:#fce7f3;color:#9d174d}
.cv-st{font-size:11px;font-weight:800;flex-shrink:0;padding:4px 9px;border-radius:8px}
.cv-st.new{background:#eff6ff;color:#1d4ed8}.cv-st.done{background:#dcfce7;color:#15803d}.cv-st.prog{background:#fef3c7;color:#92400e}
.cv-empty{padding:30px 10px;text-align:center;color:#64748b;font-size:13px}
/* conversation */
.cv-head{background:#fff;border:1px solid #e8edf4;border-radius:18px;padding:14px 16px}
.cv-back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;font:inherit;font-size:12.5px;font-weight:700;color:#64748b;cursor:pointer}
.cv-back svg{width:15px;height:15px}
.cv-title{font-size:20px;font-weight:800;margin:6px 0 2px;line-height:1.3}
.cv-ko{font-family:'Noto Sans KR',sans-serif;font-size:13px;color:#64748b;margin:0}
.cv-spk{display:flex;gap:8px;margin-top:11px}
.cv-sp{flex:1;min-width:0;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:#f8fafc;border:1px solid #edf1f6}
.cv-sp i{width:30px;height:30px;border-radius:50%;font-style:normal;font-size:12px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Noto Sans KR',sans-serif}
.cv-sp b{display:block;font-size:13px;font-family:'Noto Sans KR',sans-serif}.cv-sp small{display:block;font-size:11px;color:#64748b}
.cv-lv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:12px;color:#475569}
.cv-lv span{font-weight:800;padding:3px 8px;border-radius:8px}
.cv-ctrl{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
.cv-ctrl button{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;color:#334155;cursor:pointer}
.cv-ctrl button.on,.cv-ctrl button:first-child{background:#2563eb;color:#fff;border-color:#2563eb}
.cv-ctrl svg{width:14px;height:14px}
.cv-chat{padding:8px 0}
.cv-ln{display:flex;gap:8px;margin-bottom:10px;align-items:flex-end}
.cv-ln.r{flex-direction:row-reverse}
.cv-ln > i{width:28px;height:28px;border-radius:50%;font-style:normal;font-size:11px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Noto Sans KR',sans-serif}
.cv-bb{max-width:80%;text-align:left;padding:9px 13px;border-radius:16px;background:#fff;border:1px solid #e8edf4;font-family:'Noto Sans KR',sans-serif;font-size:15px;line-height:1.6;color:#0f172a;cursor:pointer;transition:box-shadow .15s}
.cv-ln.r .cv-bb{background:#2563eb;color:#fff;border-color:#2563eb}
.cv-who{display:none}
.cv-bb small{display:block;font-family:'DM Sans',sans-serif;font-size:12px;color:#64748b;margin-top:3px;line-height:1.4}
.cv-ln.r .cv-bb small{color:rgba(255,255,255,.8)}
.cv-chat[data-english="off"] .cv-bb small,.cv-chat[data-english="tap"] .cv-bb:not(.show-en) small{display:none}
.cv-bb u{text-decoration:none;background:#fef3c7;color:#92400e;border-radius:4px;padding:0 2px}
.cv-ln.r .cv-bb u{background:rgba(250,204,21,.32);color:#fff}
/* hover-word spans inside the blue bubble inherited the dark word colour */
.cv-ln.r .cv-bb u *,.cv-ln.r .cv-bb .kh-word,.cv-ln.r .cv-bb .kh-hover-word{color:#fff !important}
.cv-bb.play{box-shadow:0 0 0 3px rgba(37,99,235,.28)}
.cv-dock{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid #e5e9f0;padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.cv-dock > *{max-width:728px;margin-left:auto;margin-right:auto}
.cv-steps{display:flex;gap:4px;margin-bottom:9px}.cv-steps span{flex:1;height:5px;border-radius:9px;background:#e2e8f0}.cv-steps span.on{background:#2563eb}
.cv-dock-row{display:flex;gap:8px}
.cv-next{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px;border-radius:13px;border:0;background:#2563eb;color:#fff;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.cv-next svg{width:16px;height:16px}
.cv-sec-btn{display:flex;align-items:center;gap:6px;justify-content:center;flex:0 0 32%;padding:13px;border-radius:13px;border:0;background:#f1f5f9;color:#334155;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.cv-sec-btn svg{width:16px;height:16px}
.cv-sec{margin-top:14px}
.cv-sec h2{font-size:16px;margin:0}.cv-sec > p{font-size:12.5px;color:#64748b;margin:3px 0 10px}
.cv-kx{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:#fff;border:1px solid #e8edf4;margin-bottom:8px}
.cv-kx-say{width:34px;height:34px;flex-shrink:0;border-radius:50%;border:0;background:#eff6ff;color:#2563eb;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cv-kx-say svg{width:16px;height:16px}
.cv-kx-tx b{display:block;font-family:'Noto Sans KR',sans-serif;font-size:15.5px}
.cv-kx-tx span{display:block;font-size:12.5px;color:#475569;margin-top:1px}
.cv-kx-tx small{display:block;font-family:'Noto Sans KR',sans-serif;font-size:12.5px;color:#64748b;margin-top:6px;line-height:1.5}
.cv-kx-tx small i{font-style:normal;font-weight:700;color:#334155}
.cv-kx-tx u{text-decoration:none;background:#fef3c7;color:#92400e;border-radius:4px;padding:0 2px}
.cv-gr{padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #e8edf4;margin-top:8px}
.cv-gr b{display:block;font-family:'Noto Sans KR',sans-serif;font-size:14px}.cv-gr span{display:block;font-size:12.5px;color:#475569;margin-top:2px;line-height:1.5}
/* role-play + done (dark) */
.cv-rp{min-height:calc(100vh - 60px);max-width:none;background:linear-gradient(180deg,#0d1b3d,#0a1631);color:#e2e8f0;padding:16px 16px 60px;font-family:'DM Sans','Noto Sans KR',sans-serif}
.cv-rp > *{max-width:560px;margin-left:auto;margin-right:auto}
.cv-rp-top{display:flex;align-items:center;gap:10px}
.cv-x{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#cbd5e1;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.cv-x svg{width:16px;height:16px}
.cv-bar{flex:1;height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.cv-bar div{height:100%;background:linear-gradient(90deg,#60a5fa,#a78bfa);border-radius:9px}
.cv-rp-top span{font-size:12px;color:rgba(255,255,255,.6);font-weight:700}
.cv-rp-eb{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7dd3fc;font-weight:800;margin-top:16px}
.cv-rp-q{font-size:16px;font-weight:800;color:#fff;margin-top:6px}
.cv-rp-ctx{margin-top:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.cv-rp-ctx .cv-ln{margin:0}
.cv-rp-ctx .cv-bb{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);color:#fff}
.cv-rp-ctx .cv-bb small{color:rgba(255,255,255,.55)}
.cv-rp-you{text-align:right;font-size:11.5px;color:#93c5fd;font-weight:700;margin:8px 0 4px}
.cv-rp-opts{display:grid;gap:8px}
.cv-opt{text-align:left;padding:13px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-family:'Noto Sans KR',sans-serif;font-size:15px;color:#e2e8f0;cursor:pointer;line-height:1.5}
.cv-opt small{display:block;font-family:'DM Sans',sans-serif;font-size:11.5px;color:rgba(255,255,255,.5);margin-top:2px}
.cv-opt.ok{background:rgba(16,185,129,.18);border-color:rgba(52,211,153,.6);color:#a7f3d0}
.cv-opt.bad{background:rgba(239,68,68,.14);border-color:rgba(248,113,113,.5);color:#fecaca}
.cv-opt:disabled{cursor:default}
.cv-why{margin-top:10px;padding:11px 12px;border-radius:13px;background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.3);font-size:13px;color:#fde68a;line-height:1.55}
.cv-why b{color:#fff}
.cv-rp-say{margin-top:10px;display:flex;gap:8px}
.cv-rp-say button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:12px;border:0;font:inherit;font-size:13px;font-weight:800;background:rgba(255,255,255,.08);color:#cbd5e1;cursor:pointer}
.cv-rp-say svg{width:15px;height:15px}
.cv-next.wide{margin-top:12px}
.cv-dn{text-align:center;padding-top:20px}
.cv-ring{width:108px;height:108px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}
.cv-ring div{width:88px;height:88px;border-radius:50%;background:#0c1838;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:800;color:#fff}
.cv-dn h2{font-size:20px;color:#fff;margin:0}.cv-dn p{font-size:13px;color:rgba(255,255,255,.6);margin:3px 0 0}
.cv-box{margin-top:16px;padding:13px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.cv-box h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7dd3fc;margin:0 0 6px}
.cv-ex{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px}
.cv-ex:last-of-type{border-bottom:0}
.cv-ex b{font-family:'Noto Sans KR',sans-serif;color:#fff;flex-shrink:0}.cv-ex span{flex:1;min-width:0;color:rgba(255,255,255,.55);font-size:12px}
.cv-ex em{font-style:normal;font-size:10px;padding:2px 7px;border-radius:7px;background:rgba(52,211,153,.16);color:#6ee7b7;flex-shrink:0}
.cv-save{display:block;width:100%;margin-top:10px;padding:11px;border-radius:12px;background:rgba(124,58,237,.35);border:1px solid rgba(167,139,250,.6);color:#fff;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.cv-save:disabled{opacity:.7;cursor:default}
.cv-nextc{display:flex;width:100%;gap:10px;align-items:center;margin-top:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:inherit;font:inherit;text-align:left;cursor:pointer}
.cv-nextc b{display:block;font-size:13.5px;color:#fff}.cv-nextc small{font-size:11.5px;color:rgba(255,255,255,.5)}
.cv-nextc .cv-av2 i{border-color:#13224a}
</style>
</head>
