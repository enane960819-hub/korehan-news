<style>
/* ── Tab Bar ── */
/* Conv tab bar / cf-tab styles superseded by .kh-filter-bar /
   .kh-filter-pill in shared.css (May 2026 unification). The class
   names stay in the markup as JS hooks (e.g. #cat-pills .cf-tab
   selectors), but their visual now comes from the unified pill. */

/* ── Page Layout ── */
.conv-page-container{max-width:1280px;margin:0 auto;padding:20px 24px 60px;}
.conv-two-col{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;}
.conv-two-col > div{min-width:0;}
@media(max-width:980px){.conv-two-col{grid-template-columns:1fr;}}

/* ── Card Grid ── */
.conv-cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}

/* ── Search ── */
/* .conv-search replaced by .kh-page-search — kept as a comment so
   future search anchors moving back here remember which shared
   component handles the styling now. */

/* ── Netflix-style category rails (All filter) ──
   When the All tab is active, conversations group into horizontally
   scrolling rows by category — same visual rhythm as the All News
   rails. Each rail has its own header + "See all" link that flips the
   filter to that category. */
/* When the page renders rails (conv-rails class on the cards grid)
   we need every ancestor up to the rail-scroll to be width-bounded —
   otherwise the flex-row of fixed-width cards stretches its parents
   instead of overflowing, and the global `html, body { overflow-x:
   hidden }` from shared.css just clips that overflow so the user sees
   no scrollbar and can't swipe sideways. min-width:0 + explicit 100%
   width on each container forces overflow-x:auto to actually engage. */
.conv-rails{display:flex!important;flex-direction:column;gap:28px;width:100%;min-width:0;}
.conv-cards-grid.conv-rails{grid-template-columns:none!important;max-width:none!important;}
.cv-rail{min-width:0;width:100%;}
.cv-rail-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;padding:0 2px;}
.cv-rail-title{font-size:18px;font-weight:900;color:#0f172a;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;font-family:'DM Sans','Noto Sans KR',sans-serif;}
.cv-rail-title .cv-icon{font-size:18px;}
.cv-rail-more{font-size:12px;font-weight:700;color:#64748b;cursor:pointer;background:none;border:none;padding:4px 0;font-family:inherit;}
.cv-rail-more:hover{color:#0f172a;}
.cv-rail-scroll{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;padding:4px 4px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;min-width:0;width:100%;overscroll-behavior-x:contain;cursor:grab;user-select:none;-webkit-user-select:none;}
.cv-rail-scroll:active{cursor:grabbing;}
.cv-rail-scroll::-webkit-scrollbar{height:6px;}
.cv-rail-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}
/* Cards inside a rail get a fixed width so they tile neatly. */
.cv-rail-scroll > .cc2{flex:0 0 280px;scroll-snap-align:start;min-width:0;}
@media(max-width:760px){
  .conv-rails{gap:22px;}
  .cv-rail-head{margin-bottom:10px;}
  .cv-rail-title{font-size:15px;}
  .cv-rail-scroll{gap:10px;padding:2px 2px 12px;}
  .cv-rail-scroll > .cc2{flex:0 0 240px;}
}

/* ── Card — KakaoTalk Chat Preview ── */
.cc2{border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;border:none;display:flex;flex-direction:column;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.cc2:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.15);}
/* Card header: situation description + level badge.
   Speaker names + avatars used to live here (e.g. "지수 & 민호" with two
   round initials) but they were just decorative — the situation
   description carries the actual signal a learner needs to pick the right
   conversation. So the header now puts the English context up front and
   keeps only a level pill on the right. */
.cc2-head{padding:16px 16px 12px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid #f0f4fa;}
.cc2-head-info{flex:1;min-width:0;}
.cc2-ctx{font-size:14px;color:#0f172a;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.cc2-ctx-loading{color:#94a3b8;font-weight:500;font-style:italic;}
.cc2-tag{font-size:9px;font-weight:800;padding:3px 8px;border-radius:20px;flex-shrink:0;letter-spacing:.02em;}
.badge-b{background:#dcfce7;color:#15803d;}
.badge-i{background:#fef9c3;color:#92400e;}
.badge-a{background:#fee2e2;color:#b91c1c;}
/* Chat bubble previews */
.cc2-bubbles{padding:12px 16px 14px;flex:1;display:flex;flex-direction:column;gap:8px;}
.cc2-bub{padding:8px 12px;border-radius:14px;font-size:13px;font-family:'Noto Sans KR',sans-serif;line-height:1.5;max-width:85%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cc2-bub-l{background:#f1f5f9;color:#334155;border-bottom-left-radius:4px;align-self:flex-start;}
.cc2-bub-r{background:#2563eb;color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
/* Card footer */
.cc2-footer{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f0f4fa;}
.cc2-vocab-count{font-size:11px;color:#64748b;font-weight:600;}
.cc2-study-btn{font-size:11px;font-weight:800;color:#2563eb;background:none;border:1.5px solid #bfdbfe;border-radius:20px;padding:4px 14px;cursor:pointer;font-family:inherit;transition:all .12s;}
.cc2-study-btn:hover{background:#eff6ff;}

/* ── DETAIL OVERLAY ──
   Single-column reader, mirrors the article layout: header → tabs →
   selected section. The old 2-column desktop split (chat on left, study
   notes on right) made the page feel like two competing columns instead
   of one focused study flow, so we collapsed it. The mobile-only tab
   strip became the global tab strip. */
/* Mobile-scroll fix (Audit 2026-05-18, item #8). Three changes:
   1. -webkit-overflow-scrolling:touch — restores iOS Safari momentum
      scrolling on the overlay (older WebKit needs the hint).
   2. overscroll-behavior:contain — stops the scroll chain bouncing
      out to the page body when the overlay reaches its top/bottom.
   3. .detail-panel allows its own vertical scroll (overflow:hidden auto)
      bounded by max-height, so tall analysis content can scroll inside
      the panel even when the overlay scroller fights it on iOS. */
.detail-overlay{position:fixed;inset:0;background:rgba(5,12,24,.72);z-index:5000;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.detail-overlay.hidden{display:none;}
.detail-panel{width:100%;max-width:780px;background:#fff;border-radius:28px;overflow:hidden auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 40px);box-shadow:0 32px 80px rgba(5,12,24,.3);display:flex;flex-direction:column;animation:panelIn .22s cubic-bezier(.22,1,.36,1);}
@keyframes panelIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.dp-left{background:#fff;display:flex;flex-direction:column;}
.dp-left-head{background:linear-gradient(135deg,#1d4ed8 0%,#3b82f6 100%);padding:22px 24px 18px;position:relative;}
.dp-left-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.7);margin-bottom:6px;}
.dp-left-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:#fff;margin:0 0 4px;}
.dp-left-sub{font-size:13px;color:rgba(255,255,255,.75);}
.detail-close{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:inherit;line-height:1;}
.detail-close:hover{background:rgba(255,255,255,.28);}
/* Floating close — desktop hides it (in-panel close is enough). Shown
   only on mobile where the in-panel close was unreliable on iOS. */
.detail-close-floating{display:none;position:fixed;top:calc(env(safe-area-inset-top, 0px) + 12px);right:14px;width:44px;height:44px;border-radius:999px;background:rgba(15,23,42,.82);color:#fff;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;align-items:center;justify-content:center;z-index:5100;font-family:inherit;padding:0;box-shadow:0 6px 20px rgba(0,0,0,.25);}
.dp-pills{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px 12px;border-bottom:1px solid #f0f4fa;}
.dp-pill{font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;}
.dp-pill-blue{background:#eff6ff;color:#1d4ed8;}
.dp-pill-gray{background:#f1f5f9;color:#475569;}
.dp-pill-green{background:#dcfce7;color:#15803d;}
.dp-pill-pink{background:#fce7f3;color:#be185d;}
.dp-pill-amber{background:#fef9c3;color:#92400e;}
.dp-chat-area{padding:20px 24px 24px;background:linear-gradient(180deg,#f8fbff 0%,#f8fafc 100%);}
.dp-date-sep{text-align:center;margin-bottom:18px;}
.dp-date-sep span{display:inline-block;padding:6px 14px;border-radius:999px;background:#e2e8f0;color:#64748b;font-size:11px;font-weight:700;}
.dp-msg-row{display:flex;margin-bottom:12px;align-items:flex-end;gap:10px;}
.dp-msg-row.left{justify-content:flex-start;}
.dp-msg-row.right{justify-content:flex-end;}
.dp-avatar{width:36px;height:36px;border-radius:12px;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:2px solid #bfdbfe;}
.dp-bubble-group{max-width:74%;}
.dp-who{font-size:11px;font-weight:700;color:#64748b;margin-bottom:5px;}
.dp-bubble{border-radius:20px;padding:11px 15px;font-size:14px;line-height:1.6;font-family:'Noto Sans KR',sans-serif;position:relative;cursor:pointer;}
.dp-msg-row.left .dp-bubble{background:#fff;color:#0f172a;border:1px solid #e2e8f0;border-bottom-left-radius:6px;box-shadow:0 4px 12px rgba(15,23,42,.06);}
.dp-msg-row.right .dp-bubble{background:#2563eb;color:#fff;border-bottom-right-radius:6px;}
.dp-bubble-en{font-size:12px;color:#64748b;padding:4px 15px 0;line-height:1.5;display:none;}
.dp-msg-row.right .dp-bubble-en{text-align:right;color:#64748b;}
.dp-bubble-en.show{display:block;}

/* Phase 2: per-bubble save-phrase star. Sits beside the bubble so
   the tap target doesn't conflict with the existing
   tap-to-reveal-EN behaviour on the bubble itself. */
.dp-bubble-row{display:flex;align-items:center;gap:6px;}
.dp-bubble-row-right{justify-content:flex-end;}
.dp-bubble-save{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1px solid #e2e8f0;background:#fff;color:#94a3b8;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;font-family:inherit;transition:background .12s,color .12s,transform .12s,border-color .12s;padding:0;}
.dp-bubble-save:hover{background:#fff7ed;color:#f59e0b;border-color:#fcd34d;transform:scale(1.08);}
.dp-bubble-save.is-saved{background:#fef3c7;color:#b45309;border-color:#fcd34d;}
.dp-bubble-save.is-saved:hover{background:#fde68a;}
.dp-time{font-size:10px;color:#94a3b8;margin-top:4px;padding:0 3px;}
.dp-msg-row.right .dp-time{text-align:right;}
.dp-cast-bar{display:flex;flex-wrap:wrap;gap:10px;padding:14px 24px;border-bottom:1px solid #f0f4fa;background:#fff;}
.dp-cast-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#f8fafc;border:1px solid #e2e8f0;min-width:0;flex:1;}
.dp-cast-meta{min-width:0;}
.dp-cast-meta strong{display:block;font-size:12px;color:#0f172a;}
.dp-cast-meta span{display:block;font-size:11px;color:#64748b;line-height:1.4;}
.dp-inline-note{margin-top:7px;font-size:12px;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe;padding:7px 11px;border-radius:12px;line-height:1.5;}
.dp-narration{display:flex;align-items:center;gap:10px;padding:6px 4px;margin:2px 0;}
.dp-narration::before,.dp-narration::after{content:'';flex:1;height:1px;background:#e2e8f0;}
.dp-narration-text{font-style:italic;color:#64748b;font-size:13px;line-height:1.6;text-align:center;white-space:pre-wrap;padding:0 4px;}
.dp-cta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 24px 20px;background:#fff;border-top:1px solid #f0f4fa;}
.dp-cta-btn{padding:12px;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:all .15s;}
.dp-cta-primary{background:#2563eb;color:#fff;}
.dp-cta-primary:hover{background:#1d4ed8;}
.dp-cta-secondary{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;}
.dp-cta-secondary:hover{background:#dbeafe;}

/* ── Study Panel (Breakdown) ──
   Now lives below the chat (single column), not in a side pane. We
   keep the .dp-right wrapper class for backward compatibility but it
   no longer has its own scroll viewport — the page itself scrolls. */
.dp-right{background:#fff;display:flex;flex-direction:column;}
.dp-right-head{padding:18px 24px 14px;border-bottom:1px solid #e8eef7;background:#fff;display:none;}
.dp-right-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#2563eb;margin-bottom:6px;}
.dp-right-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:#0f172a;margin:0;}
.dp-study-sections{padding:18px 20px 24px;display:flex;flex-direction:column;gap:14px;}
.dp-study-card{background:#fff;border-radius:16px;border:1px solid #e2e8f0;padding:20px;box-shadow:0 2px 6px rgba(15,23,42,.04);}
.dp-study-card-title{font-size:15px;font-weight:800;color:#0f172a;margin:0 0 16px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em;}
.dp-study-card-title .admin-add-btn{margin-left:auto;font-size:11px;font-weight:700;color:#2563eb;background:none;border:1px solid #bfdbfe;border-radius:8px;padding:3px 10px;cursor:pointer;}
.dp-vocab-list{display:flex;flex-direction:column;gap:8px;}
.dp-vocab-item{display:grid;grid-template-columns:90px 80px 1fr auto;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#f8fafc;transition:background .12s;border:1px solid transparent;}
.dp-vocab-item:hover{background:#f0f5ff;border-color:#dbeafe;}
.dp-vi-ko{font-family:'Noto Sans KR',sans-serif;font-size:17px;font-weight:800;color:#1e3a5f;}
.dp-vi-rom{font-size:12px;color:#94a3b8;font-style:italic;}
.dp-vi-en{font-size:14px;color:#475569;font-weight:500;}
.dp-vi-save{font-size:12px;font-weight:700;color:#2563eb;background:#eff6ff;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-family:inherit;transition:all .12s;flex-shrink:0;}
.dp-vi-save:hover{background:#dbeafe;}
.dp-vi-save.saved{background:#2563eb;color:#fff;}
.dp-vi-del{font-size:11px;color:#94a3b8;background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:4px;}
.dp-vi-del:hover{color:#dc2626;background:#fee2e2;}
.dp-grammar-list{display:flex;flex-direction:column;gap:8px;}
.dp-grammar-item{padding:14px 16px;border-radius:12px;background:#f8fafc;font-size:14px;line-height:1.65;color:#334155;position:relative;border:1px solid transparent;}
.dp-grammar-item:hover{border-color:#e2e8f0;}
.dp-grammar-item strong{color:#1e3a5f;font-weight:800;font-size:15px;}
.dp-grammar-item .dp-gi-del{position:absolute;right:8px;top:8px;font-size:10px;color:#94a3b8;background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:4px;display:none;}
.dp-grammar-item:hover .dp-gi-del{display:block;}
.dp-grammar-item .dp-gi-del:hover{color:#dc2626;background:#fee2e2;}

/* ── Key Expressions — prominent amber highlight ── */
.dp-keyexpr-card{background:linear-gradient(135deg,#fffbeb,#fef9c3);border:1.5px solid #fde68a;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(146,64,14,.08);}
.dp-keyexpr-item{display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.8);margin-bottom:8px;border:1px solid rgba(253,230,138,.5);}
.dp-keyexpr-item:last-child{margin-bottom:0;}
.dp-keyexpr-ko{font-family:'Noto Sans KR',sans-serif;font-size:17px;font-weight:800;color:#92400e;}
.dp-keyexpr-en{font-size:14px;color:#a16207;font-weight:500;flex:1;}
.dp-keyexpr-star{color:#f59e0b;font-size:14px;flex-shrink:0;}
.dp-keywords{display:flex;flex-wrap:wrap;gap:6px;}
.dp-keyword{display:inline-block;padding:6px 12px;border-radius:8px;background:#f0f5ff;font-size:12px;font-weight:600;color:#2563eb;cursor:pointer;transition:all .12s;border:none;}
.dp-keyword:hover{background:#dbeafe;}

/* ── Practice tab drills ── */
/* Drill picker (replaces the old stack-of-5-cards layout). Horizontal
   pill row that scrolls on mobile when the labels overflow. The
   active pill goes solid blue; disabled drills (no data) dim out. */
.dp-pr-shell{padding:18px 18px 22px;}
/* Practice card on mobile — give it a min-height so the empty
   white between the bottom of the drill content and the bottom of
   the viewport is INSIDE the card (intentional breathing room),
   not below it (orphaned content). Owner-reported '카드는 ㅈㄴ 큰데
   공간활용 안되는 이슈'.
   220px accounts for the conv reader's top tabs + Practice card
   title row + step strip. Result: card always reaches near the
   bottom of the viewport, content inside aligned to the top. */
@media(max-width:900px){
  .dp-pr-shell{min-height:calc(100vh - 220px);padding-bottom:32px;}
}
/* Progress strip — visual indicator only, no clicks. Shows 5 drill
   step labels separated by › chevrons. Active step is solid blue,
   completed steps are checked green, skipped (no data) are dim.
   Replaces the old chip picker since the linear flow now drives
   which drill is active, not the user. */
/* Steps strip — horizontal scroll, fade right edge so users see
   there's more. Without the fade the last tab looked clipped and
   users assumed broken layout (owner-reported '문제들 다 짤려보이는
   이슈'). The wrapping container gives us the fade pseudo-elements;
   the inner .dp-pr-steps still scrolls horizontally as before. */
.dp-pr-steps-wrap{position:relative;margin:0 -4px 14px;}
.dp-pr-steps-wrap::after{content:'';position:absolute;top:0;bottom:0;right:0;width:24px;pointer-events:none;background:linear-gradient(to right, transparent, #fff 90%);}
.dp-pr-steps{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:2px 4px 8px;scrollbar-width:none;cursor:grab;}
.dp-pr-steps:active{cursor:grabbing;}
.dp-pr-steps::-webkit-scrollbar{display:none;}
.dp-pr-step{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:#f1f5f9;border:1px solid #e2e8f0;color:#94a3b8;font-size:11px;font-weight:700;font-family:inherit;white-space:nowrap;flex-shrink:0;}
.dp-pr-step.is-active{background:linear-gradient(135deg,#2563eb,#1d4ed8);border-color:transparent;color:#fff;box-shadow:0 4px 10px rgba(37,99,235,.25);}
.dp-pr-step.is-done{background:#dcfce7;border-color:#bbf7d0;color:#15803d;}
.dp-pr-step.is-skip{opacity:.35;}
.dp-pr-step .kh-ui-icon{width:13px;height:13px;}
.dp-pr-step-sep{color:#cbd5e1;font-weight:700;flex-shrink:0;}
.dp-pr-stage{}
.dp-pr-stage-preview{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:6px 0;}
.dp-pr-stage-blurb{font-size:13px;color:#475569;line-height:1.55;}
.dp-pr-empty{font-size:13px;color:#94a3b8;padding:8px 0;}
.dp-pr-progress{font-size:11px;font-weight:700;color:#64748b;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px;}
.dp-pr-done{font-size:15px;font-weight:800;color:#15803d;margin-bottom:12px;}
.dp-pr-start{display:inline-block;padding:9px 18px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .12s;}
.dp-pr-start:hover{background:#1d4ed8;}
.dp-pr-start.dp-pr-secondary{background:#fff;color:#475569;border:1.5px solid #e2e8f0;}
.dp-pr-start.dp-pr-secondary:hover{background:#f8fafc;border-color:#cbd5e1;color:#334155;}
/* Expression Match */
/* Interleaved grid: pills render in order L0 R0 L1 R1 …; each grid row's
   height is the max of its two pills, so the left and right columns stay
   visually balanced even when English wraps to two lines and Korean
   doesn't. min-height keeps pills tap-friendly on mobile (~44pt). */
.dp-pr-em-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-bottom:6px;align-items:stretch;}
.dp-pr-pill{padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0;font-size:13px;color:#0f172a;cursor:pointer;font-family:inherit;text-align:left;transition:background .12s,border-color .12s,opacity .12s;line-height:1.4;font-weight:600;min-height:48px;display:flex;align-items:center;}
.dp-pr-pill:hover:not(:disabled){background:#eff6ff;border-color:#bfdbfe;}
.dp-pr-pill.sel{background:#dbeafe;border-color:#2563eb;color:#1d4ed8;}
.dp-pr-pill.wrong{background:#fee2e2;border-color:#ef4444;color:#b91c1c;}
.dp-pr-pill.locked{background:#dcfce7;border-color:#22c55e;color:#15803d;opacity:.55;cursor:default;}
/* Vocab in Context + Reply Check share the option list pattern */
.dp-pr-prompt{font-size:15px;color:#0f172a;line-height:1.65;background:#f8fbff;border:1px solid #dbeafe;border-radius:12px;padding:14px 16px;margin-bottom:14px;font-family:'Noto Sans KR',sans-serif;}
.dp-pr-mark{background:rgba(251,191,36,.45);padding:1px 4px;border-radius:4px;font-weight:800;}
.dp-pr-prompt-row{font-size:14px;color:#0f172a;line-height:1.6;background:#f8fbff;border:1px solid #dbeafe;border-radius:12px;padding:12px 14px;margin-bottom:8px;font-family:'Noto Sans KR',sans-serif;}
.dp-pr-who{font-size:12px;font-weight:700;color:#2563eb;margin-right:4px;}
.dp-pr-cue{font-size:12px;color:#64748b;margin:8px 0 10px;}
.dp-pr-opt-list{display:flex;flex-direction:column;gap:8px;}
.dp-pr-opt{padding:11px 14px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;text-align:left;line-height:1.5;color:#0f172a;transition:background .12s,border-color .12s;}
.dp-pr-opt:hover:not(:disabled){background:#f8fbff;border-color:#bfdbfe;}
/* Comprehension Quiz */
.dp-pr-q{padding:0;}
.dp-pr-q-progress{font-size:11px;font-weight:700;color:#64748b;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;}
.dp-pr-q-text{font-size:14px;color:#0f172a;line-height:1.55;font-weight:700;margin-bottom:12px;}
.dp-pr-q-options{display:flex;flex-direction:column;gap:8px;}
.dp-pr-q-opt{padding:11px 14px;background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;text-align:left;line-height:1.5;color:#0f172a;transition:all .12s;font-weight:600;}
.dp-pr-q-opt:hover:not(:disabled){background:#eff6ff;border-color:#bfdbfe;}
.dp-pr-q-opt-right{background:#dcfce7 !important;border-color:#22c55e !important;color:#15803d !important;}
.dp-pr-q-opt-wrong{background:#fee2e2 !important;border-color:#ef4444 !important;color:#b91c1c !important;}
.dp-pr-q-opt-dim{opacity:.45;}
.dp-pr-q-fb{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.55;}
.dp-pr-q-fb.is-right{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;}
.dp-pr-q-fb.is-wrong{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;}
.dp-pr-result{text-align:center;padding:18px 0;}
.dp-pr-result-score{font-size:36px;font-weight:900;color:#2563eb;line-height:1;margin-bottom:6px;}
.dp-pr-result-sub{font-size:13px;color:#64748b;}
/* Sentence Build */
.dp-pr-build-wrap{display:flex;flex-direction:column;gap:10px;}
.dp-pr-build-hint{font-size:13px;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 12px;line-height:1.5;}
.dp-pr-build-tray{min-height:48px;border:1.5px dashed #bfdbfe;border-radius:12px;padding:9px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#f8fbff;}
.dp-pr-build-pool{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0;}
.dp-pr-empty-inline{font-size:12px;color:#94a3b8;}
.dp-pr-chip{padding:8px 14px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;color:#0f172a;font-family:'Noto Serif KR',serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .12s;}
.dp-pr-chip:hover{background:#f8fbff;border-color:#bfdbfe;}
.dp-pr-chip-on{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border-color:transparent;}
.dp-pr-chip-on:hover{filter:brightness(1.05);}
.dp-pr-build-actions{display:flex;gap:8px;margin-top:4px;}
.dp-pr-build-actions .dp-pr-start{flex:1;}
.dp-pr-build-actions .dp-pr-secondary{background:#fff;color:#475569;border:1.5px solid #e2e8f0;}
.dp-pr-build-actions .dp-pr-secondary:hover{background:#f8fafc;border-color:#cbd5e1;}
.dp-pr-build-actions .dp-pr-start[disabled]{opacity:.4;cursor:not-allowed;}
.dp-pr-opt.correct{background:#dcfce7;border-color:#22c55e;color:#15803d;font-weight:700;}
.dp-pr-opt.wrong{background:#fee2e2;border-color:#ef4444;color:#b91c1c;font-weight:700;}
.dp-pr-opt:disabled{cursor:default;}
/* Study Room deep-dive CTA */
.dp-pr-deep{background:var(--cream,#FAF6F0)!important;border:1px solid var(--border,#d4dce8)!important;color:var(--navy,#0d1b35);padding:18px 18px 16px!important;border-radius:14px!important;}
.dp-pr-deep .dp-pr-deep-eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gray,#445566);margin-bottom:8px;}
.dp-pr-deep .dp-pr-deep-title{font-size:18px;font-weight:900;color:var(--navy,#0d1b35);margin-bottom:6px;font-family:'Playfair Display',serif;line-height:1.25;}
.dp-pr-deep .dp-pr-deep-sub{font-size:13px;color:var(--gray,#445566);line-height:1.55;margin-bottom:14px;}
.dp-pr-deep .dp-pr-deep-btn{width:100%;padding:13px 16px;background:var(--navy,#0d1b35);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:transform .12s,background .12s;min-height:48px;}
.dp-pr-deep .dp-pr-deep-btn:hover{transform:translateY(-1px);background:#13284d;}

/* Mobile tap targets — Samsung browser on Android was losing some taps on
   small chips. Bump everything to >=44px and add inline padding. */
@media (max-width: 768px) {
  .dp-pr-opt{padding:14px 16px;font-size:14px;min-height:48px;line-height:1.45;}
  .dp-pr-chip{padding:12px 16px;font-size:15px;min-height:44px;}
  .dp-pr-build-tray{padding:11px 12px;gap:8px;}
  .dp-pr-build-pool{gap:8px;}
}

/* ── Character Avatar ── */
.kh-char-av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;flex-shrink:0;overflow:hidden;}
.kh-char-av img{width:100%;height:100%;object-fit:cover;display:block;}
.dp-msg-row.right .dp-who{text-align:right;}
.dp-study-card-title svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;}
.cc2-cast-avatars{display:flex;gap:4px;flex-shrink:0;}
.cc2-cast-avatars .kh-char-av{border:2px solid #fff;}
.cc2-cast-avatars .kh-char-av+.kh-char-av{margin-left:-8px;}

/* ── Tab strip — visible at every breakpoint ──
   Mirrors the article reader's .art-tabs so a learner gets the same
   "Read / Vocab / Grammar / Practice" rail no matter which content
   type they're in. Sticky so it stays reachable while scrolling
   through long conversations or study lists. */
.detail-panel .dp-mobile-tabs{
  display:flex;
  position:sticky; top:0; z-index:15;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:0 6px;
}
.detail-panel .dp-mobile-tab{
  flex:1; padding:12px 2px;
  background:transparent; border:0;
  border-bottom:2px solid transparent;
  color:#64748b; font-size:13px; font-weight:800;
  cursor:pointer; font-family:inherit;
  transition:color .15s, border-color .15s;
}
.detail-panel .dp-mobile-tab.on{
  color:#0f172a; border-bottom-color:#2563eb;
}

/* Per-tab visibility — only the matching section is shown so the
   learner focuses on one thing at a time. "read" → chat + cta;
   the other tabs → just their study card. */
.detail-panel.dp-mobile-tab-read     .dp-right{display:none!important;}
.detail-panel.dp-mobile-tab-analysis .dp-left,
.detail-panel.dp-mobile-tab-practice .dp-left{display:none!important;}
.detail-panel.dp-mobile-tab-analysis .dp-right [data-study="practice"]{display:none!important;}
.detail-panel.dp-mobile-tab-practice .dp-right [data-study]:not([data-study="practice"]){display:none!important;}

/* ── Mobile ≤900px ── */
@media(max-width:900px){
  .conv-two-col{grid-template-columns:1fr!important;}
  #conv-sidebar{display:none!important;}
  .conv-cards-grid{grid-template-columns:1fr!important;gap:12px!important;max-width:500px!important;}

  /* Article-style immersive reader on mobile — edge-to-edge content
     instead of a popup-feeling modal card. */
  .detail-overlay{
    padding:0!important;
    background:#fff!important;
  }
  .detail-panel{
    border-radius:0!important;
    box-shadow:none!important;
    max-width:none!important;
  }
  /* In-panel close stays hidden on mobile — the floating one outside the
     scrolling panel is the reliable target on iOS. */
  .detail-close{ display:none!important; }
  .detail-close-floating{ display:flex; }
}

/* ── Mobile ≤600px — stacked vocab, bigger text ── */
@media(max-width:600px){
  .conv-page-container{padding:0 16px 60px!important;}
  .conv-tab-bar{padding:0 16px!important;}
  .conv-cards-grid{grid-template-columns:1fr!important;gap:12px!important;max-width:none!important;}
  /* Edge-to-edge on narrow screens — article-style full-page reader */
  .detail-panel{border-radius:0!important;}
  /* Stack vocab items vertically on narrow screens */
  .dp-vocab-item{grid-template-columns:1fr!important;gap:2px!important;padding:14px 16px!important;position:relative!important;}
  .dp-vi-save{position:absolute!important;top:12px!important;right:12px!important;}
  .dp-vi-ko{font-size:18px!important;}
  .dp-vi-en{font-size:14px!important;}
  .dp-grammar-item{font-size:14px!important;padding:14px 16px!important;}
  .dp-grammar-item strong{font-size:16px!important;}
  .dp-keyexpr-ko{font-size:18px!important;}
  .dp-keyexpr-en{font-size:14px!important;}
}
</style>

<script>
// ═══════════════════════════════════════════════════════════════
// KoreHani Character System
// Shared registry — same characters used in Articles, Conversations, Stories.
// Add a character entry when you have the image and profile ready.
// ═══════════════════════════════════════════════════════════════
var KH_CHARACTERS = {
  // Example (uncomment and fill when ready):
  // 'han': { slug:'han', name:'Han', name_ko:'한', role:'Journalist', img:'reporters/han.jpg', color:'#2255a4' },
  // 'soo': { slug:'soo', name:'Soo', name_ko:'수', role:'Office Worker', img:'reporters/soo.jpg', color:'#0891b2' },
};

var _CHAR_PALETTE = ['#2255a4','#0891b2','#059669','#b45309','#7c3aed','#c2410c','#1e7e5e','#1d4ed8'];
function _charInitialColor(name) {
  var h = 0;
  for (var i = 0; i < (name||'').length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return _CHAR_PALETTE[Math.abs(h) % _CHAR_PALETTE.length];
}

// 기본 기자 목록 (admin의 DEF_CHAR_REPORTERS와 동일 — DB 접근 없이 동작)
var _DEF_REPORTERS = [
  {id:'cr1',  name:'박서진', role:'기자',        image:'https://picsum.photos/seed/cr1/200/200',  color:'#2563eb'},
  {id:'cr2',  name:'김지원', role:'특파원',      image:'https://picsum.photos/seed/cr2/200/200',  color:'#7c3aed'},
  {id:'cr4',  name:'최유나', role:'기자',        image:'https://picsum.photos/seed/cr4/200/200',  color:'#db2777'},
  {id:'cr6',  name:'한소희', role:'뷰티·트래블 에디터', image:'https://picsum.photos/seed/cr6/200/200',  color:'#0891b2'},
  {id:'cr8',  name:'신지은', role:'사회·환경 전문기자', image:'https://picsum.photos/seed/cr8/200/200',  color:'#16a34a'},
  {id:'cr9',  name:'강태양', role:'국제·외교 기자',     image:'https://picsum.photos/seed/cr9/200/200',  color:'#4338ca'},
  {id:'cr10', name:'류하늘', role:'문화·라이프 기자',   image:'https://picsum.photos/seed/cr10/200/200', color:'#c026d3'},
];

// 기자 캐릭터 맵 — 기본값으로 초기화, DB에서 최신 데이터로 덮어씀
var _reporterMap = {};
_DEF_REPORTERS.forEach(function(r){ _reporterMap[r.id] = r; });

async function _loadReporters() {
  var sb = getSupa();
  if (!sb) return;
  try {
    var res = await sb.from('character_reporters').select('id, data').order('updated_at', {ascending: true});
    if (!res.error && res.data && res.data.length) {
      res.data.forEach(function(row) {
        var r = row.data || row;
        if (r && r.id) _reporterMap[r.id] = r;
      });
    }
  } catch(e) {}
}

// Build name → character object lookup so resolveConversationCast can
// pull the cast/role avatars from DB. Stored on window to share with
// any other surface that needs the same map.
window._khCastByName = {};
async function _loadCharacterPools() {
  var sb = getSupa();
  if (!sb) return;
  try {
    var calls = [
      sb.from('cast_characters').select('name, image_url, age_band, gender').eq('active', true),
      sb.from('role_characters').select('name, image_url, role, age_band, gender').eq('active', true)
    ];
    var results = await Promise.all(calls);
    var byName = {};
    var cast = results[0] && results[0].data || [];
    var roles = results[1] && results[1].data || [];
    cast.forEach(function(c) {
      if (!c || !c.name) return;
      byName[c.name] = {
        slug: c.name, name: c.name, name_ko: c.name,
        img: c.image_url || null, role: '',
        color: _charInitialColor(c.name)
      };
    });
    roles.forEach(function(c) {
      if (!c || !c.name) return;
      // Role NPCs take precedence when both pools have the same name
      // (rare — but cast names are deduped via slug, role names aren't).
      byName[c.name] = {
        slug: c.name, name: c.name, name_ko: c.name,
        img: c.image_url || null, role: c.role || '',
        color: _charInitialColor(c.name)
      };
      // Also key by role title so a conv whose `who` is literally
      // "의사" still maps to the role NPC's avatar.
      if (c.role && !byName[c.role]) byName[c.role] = byName[c.name];
    });
    window._khCastByName = byName;
  } catch(e) {}
}
function _reporterFromMap(id) {
  var r = _reporterMap[id];
  if (!r) return null;
  return { slug: r.id, name: r.name, name_ko: r.name, role: r.role || '', img: r.image || null, color: r.color || _charInitialColor(r.name) };
}

// Returns { left, right } character objects for a conversation
function resolveConversationCast(c) {
  var d = c || {};
  // Support explicit slug fields stored on the conversation data
  var leftSlug  = d.cast_left_slug  || d.left_slug  || null;
  var rightSlug = d.cast_right_slug || d.right_slug || null;
  var leftChar  = (leftSlug  && (KH_CHARACTERS[leftSlug]  || _reporterFromMap(leftSlug)))  || null;
  var rightChar = (rightSlug && (KH_CHARACTERS[rightSlug] || _reporterFromMap(rightSlug))) || null;
  // Extract first speaker names from messages
  var msgs = d.msgs || [];
  var leftMsg  = msgs.find(function(m){ return m.s === 'l'; });
  var rightMsg = msgs.find(function(m){ return m.s === 'r' || m.s === 'right'; });
  var leftName  = (leftMsg  && (leftMsg.who  || leftMsg.name)) || 'A';
  var rightName = (rightMsg && (rightMsg.who || rightMsg.name)) || 'B';
  // After speaker migration most rows match cast_characters /
  // role_characters by Korean name. Cache populated by
  // _loadCharacterPools(); falls back to color-circle when missing.
  var castMap = window._khCastByName || {};
  if (!leftChar  && castMap[leftName])  leftChar  = castMap[leftName];
  if (!rightChar && castMap[rightName]) rightChar = castMap[rightName];
  var left = leftChar || {
    slug: leftSlug || 'left',
    name: leftName, name_ko: leftName,
    role: 'Speaker A', img: null,
    color: _charInitialColor(leftName)
  };
  var right = rightChar || {
    slug: rightSlug || 'right',
    name: rightName, name_ko: rightName,
    role: 'Speaker B', img: null,

// ── Phase 2: saved phrases (per-message ★ button) ──────────────
// Backed by the user_saved_phrases table from the Phase 2 schema
// migration. Cached per-conv so re-renders + star toggles don't
// re-query, and so first paint shows the correct ★/☆ state.
//
//   _khPhraseSavedByConv[convId] = Set of saved msg_idx integers
//   _khPhraseSavedRowByKey[convId+'|'+msgIdx] = row.id (for delete)
var _khPhraseSavedByConv     = Object.create(null);
var _khPhraseSavedRowByKey   = Object.create(null);

function _khPhraseSupa() {
  return (typeof getSupa === 'function') ? getSupa() : null;
}

async function khPhraseLoadForConv(convId) {
  var key = String(convId == null ? '' : convId);
  _khPhraseSavedByConv[key] = _khPhraseSavedByConv[key] || new Set();
  if (typeof supaUser === 'undefined' || !supaUser || !key) return;
  var sb = _khPhraseSupa();
  if (!sb) return;
  try {
    var r = await sb.from('user_saved_phrases')
      .select('id,msg_idx')
      .eq('user_id', supaUser.id)
      .eq('source_type', 'conversation')
      .eq('source_id', key);
    var set = new Set();
    (r && r.data || []).forEach(function (row) {
      if (typeof row.msg_idx === 'number') {
        set.add(row.msg_idx);
        _khPhraseSavedRowByKey[key + '|' + row.msg_idx] = row.id;
      }
    });
    _khPhraseSavedByConv[key] = set;
  } catch (_) {}
}

function khPhraseIsSaved(convId, msgIdx) {
  var key = String(convId == null ? '' : convId);
  var set = _khPhraseSavedByConv[key];
  return !!(set && set.has(msgIdx));
}

async function khPhraseSaveToggle(convId, msgIdx, btn) {
  if (typeof supaUser === 'undefined' || !supaUser) {
    if (typeof openAuthModal === 'function') openAuthModal('signin');
    return;
  }
  var sb = _khPhraseSupa();
  if (!sb) return;
  var key = String(convId == null ? '' : convId);
  if (!_khPhraseSavedByConv[key]) await khPhraseLoadForConv(key);
  var set = _khPhraseSavedByConv[key] || new Set();
  var willSave = !set.has(msgIdx);
  // Need the actual ko text — read from the current conv's msgs.
  var conv = (typeof CONVS !== 'undefined' && CONVS) ? CONVS.find(function (x) { return String(x._id) === key || String(x.id) === key; }) : null;
  var msg  = conv && conv.msgs ? conv.msgs[msgIdx] : null;
  var ko   = msg ? (msg.txt || '') : '';
  var en   = msg ? (msg.en || msg.note || '') : '';
  if (!ko) return;
  try {
    if (willSave) {
      var insertR = await sb.from('user_saved_phrases').insert({
        user_id:     supaUser.id,
        source_type: 'conversation',
        source_id:   key,
        msg_idx:     msgIdx,
        ko:          ko,
        en:          en,
      }).select('id').single();
      if (insertR && insertR.data && insertR.data.id) {
        _khPhraseSavedRowByKey[key + '|' + msgIdx] = insertR.data.id;
      }
      set.add(msgIdx);
    } else {
      // Prefer composite-key delete so the upsert/delete behaves the
      // same regardless of whether the cache has the row id.
      await sb.from('user_saved_phrases').delete()
        .eq('user_id',     supaUser.id)
        .eq('source_type', 'conversation')
        .eq('source_id',   key)
        .eq('msg_idx',     msgIdx);
      set.delete(msgIdx);
      delete _khPhraseSavedRowByKey[key + '|' + msgIdx];
    }
    _khPhraseSavedByConv[key] = set;
  } catch (_) { return; }
  // Sync the button visual state without re-rendering the whole
  // conversation (avoids losing scroll position).
  if (btn) {
    btn.classList.toggle('is-saved', willSave);
    btn.textContent = willSave ? '★' : '☆';
  }
}

// Group the filtered list by category and render each as a horizontal
// rail. Each rail's "See all" flips the top tab to that category and
// re-renders, dropping back into the flat grid for that bucket.
function _renderConvRails(list) {
  var grid = document.getElementById('conv-cards-grid');
  if (!grid) return;
  // The flat grid uses `display:grid;grid-template-columns:repeat(3,1fr)`
  // — that breaks the column flow we want for rails, so swap it off and
  // back on as needed.
  grid.classList.add('conv-rails');
  grid.style.display = 'flex';

  var byCat = {};
  list.forEach(function(c) {
    var k = c.cat || 'everyday';
    (byCat[k] = byCat[k] || []).push(c);
  });

  var html = '';
  CAT_RAIL_ORDER.forEach(function(cat) {
    var items = byCat[cat];
    if (!items || !items.length) return;
    var icon = CAT_ICON[cat] || '';

    html += '<div class="cv-rail" data-cat="' + cat + '">'
      + '<div class="cv-rail-head">'
      +   '<div class="cv-rail-title">' + (icon ? '<span class="cv-icon">' + icon + '</span>' : '') + escapeHtml(label) + '</div>'
      +   '<button class="cv-rail-more" onclick="_jumpToConvCat(\'' + cat + '\')">See all &rsaquo;</button>'
      + '</div>'
      + '<div class="cv-rail-scroll">'
      + items.slice(0, 12).map(_renderOneCard).join('')
      + '</div>'
      + '</div>';
  });

  // Anything in unexpected categories still renders so it's discoverable.
  Object.keys(byCat).forEach(function(cat) {
    if (CAT_RAIL_ORDER.indexOf(cat) >= 0) return;
    var items = byCat[cat];
    html += '<div class="cv-rail" data-cat="' + cat + '">'
      + '<div class="cv-rail-head"><div class="cv-rail-title">' + escapeHtml(cat) + '</div></div>'
      + '<div class="cv-rail-scroll">' + items.slice(0, 12).map(_renderOneCard).join('') + '</div>'
      + '</div>';
  });

  grid.innerHTML = html || '<p style="color:#64748b;font-size:14px;padding:20px 0">No conversations yet.</p>';

var CAT_GRAD = {

  work:'linear-gradient(135deg,#334155,#64748b)',
  friends:'linear-gradient(135deg,#065f46,#10b981)',

  dating:'linear-gradient(135deg,#9d174d,#ec4899)'
};
var CAT_EN = {everyday:'Everyday',work:'Workplace',friends:'Friends',family:'Family',dating:'Dating'};
// Order + emoji icon for the All-view rails. Listed in the order we
// want rails to appear on screen.
var CAT_RAIL_ORDER = ['everyday','work','friends','family','dating'];
var CAT_ICON = {everyday:'☕',work:'💼',friends:'👋',family:'👨‍👩‍👧',dating:'💖'};

function _renderOneCard(c) {
  // ri (index in CONVS) is still used as the data-ctx-target hook for
  // the async translator's in-place card update — that path matches by
  // index inside the same render pass and is fine.
  // The CLICK dispatch, however, switched to id-based lookup. openDetail
  // (idx) was racing against the DB refresh path that replaces CONVS in
  // place — even when ids matched in order, rendered cards carried stale
  // integer indices that could land on a different conversation if CONVS
  // got resorted between render and click. ("conversations 아무거나 막
  // 눌리고" was the symptom.) Looking up by _id at click time means any
  // future array mutation can't misroute the tap.
  var ri = CONVS.indexOf(c);
  var convIdJs = String(c && c._id || '').replace(/'/g,"\\'");
  var ctxRaw = c.ctx || '';
  // English context drives the card now (speakers + avatars are gone).
  // _ctxEn() returns the cached English version if we have one and a
  // marker like 'pending' otherwise — the async translator below will
  // fill it in and re-render this card in place.
  var ctxState = _ctxEn(c);
  var ctxText = ctxState.text;
  var isPending = ctxState.pending;
  var ctxClass = 'cc2-ctx' + (isPending ? ' cc2-ctx-loading' : '');
  var ctxHtml = ctxText
    ? '<div class="' + ctxClass + '" data-ctx-target="' + ri + '">' + escapeHtml(ctxText) + '</div>'
    : '<div class="cc2-ctx cc2-ctx-loading" data-ctx-target="' + ri + '">No description</div>';

  // Chat bubble previews (max 3 lines from preview data)
  var bubblesHtml = '';
  if (c.preview && c.preview.length) {
    bubblesHtml = '<div class="cc2-bubbles">';
    c.preview.slice(0, 3).forEach(function(p) {
      var isLeft = (p.who === (c.preview[0] && c.preview[0].who));
      var side = isLeft ? 'cc2-bub-l' : 'cc2-bub-r';
      bubblesHtml += '<div class="cc2-bub '+side+'">'+escapeHtml(p.txt||'')+'</div>';
    });
    bubblesHtml += '</div>';
  }

  // Vocab count
  var vocabCount = c._vocabCount || 0;
  var vocabLabel = vocabCount ? '📚 ' + vocabCount + ' key words' : '';

  // Kick off the translation lazily (only when we don't already have it)
  if (isPending && ctxRaw) _translateCtxAsync(c, ri);

  // data-conv-id + delegated click (registered once at the grid level
   // below) instead of inline onclick — inline onclick was failing
   // silently for some users (cards rendered, taps did nothing). The
   // delegated handler also survives in-place card updates that
   // replace innerHTML.
   return '<div class="cc2" data-conv-id="'+convIdJs+'" role="button" tabindex="0">'
    +'<div class="cc2-head">'
      +'<div class="cc2-head-info">'
        + ctxHtml
      +'</div>'
      +'<span class="cc2-tag '+LVL_CLS[c.lvl]+'">'+lvlLabel(c.lvl)+'</span>'
    +'</div>'
    +bubblesHtml
    +'<div class="cc2-footer">'
      +'<span class="cc2-vocab-count">'+vocabLabel+'</span>'
      +'<span class="cc2-study-btn">Study →</span>'
    +'</div>'
  +'</div>';
}

// ─── Context translation (Korean → English) ─────────────────────
// We cache results in localStorage keyed by the source string so a
// page reload doesn't re-spend Claude calls on the same descriptions.
var _CTX_CACHE_KEY = 'kh_conv_ctx_en_v1';
var _ctxCache = (function(){
  try { return JSON.parse(localStorage.getItem(_CTX_CACHE_KEY) || '{}') || {}; }
  catch(_) { return {}; }
})();
function _saveCtxCache() {
  try { localStorage.setItem(_CTX_CACHE_KEY, JSON.stringify(_ctxCache)); } catch(_) {}
}
// Returns { text, pending } — text is what to show right now, pending
// flags that we're translating in the background.
function _ctxEn(c) {
  var raw = (c && c.ctx) || '';
  if (!raw) return { text: '', pending: false };
  // Already English (no Korean characters) → just use as-is
  if (!/[ㄱ-힝]/.test(raw)) return { text: raw, pending: false };
  // Author already provided an English version
  if (c.ctx_en) return { text: c.ctx_en, pending: false };
  if (_ctxCache[raw]) {
    c.ctx_en = _ctxCache[raw];
    return { text: c.ctx_en, pending: false };
  }
  // Show the Korean text greyed out until the translation lands.
  return { text: raw, pending: true };
}
var _ctxInflight = {};
var _ctxBatchQueue = [];
var _ctxBatchTimer = null;

// Per-card lazy translator — collects cards needing translation into a
// queue, then fires ONE batched Haiku call instead of N separate calls
// per page render. With 12 cards rendered at once, this drops 12 API
// calls to 1 (≈92% reduction in token burn for the conversations page,
// which used to be the biggest auto-fire leak on the site).
function _translateCtxAsync(c, idx) {
  var raw = (c && c.ctx) || '';
  if (!raw || _ctxCache[raw] || _ctxInflight[raw]) return;
  // Gate behind signed-in users. Anonymous traffic used to fire this
  // Haiku call per card (multiplied to 12+ per page load before the
  // batch refactor); now anonymous visitors just see the Korean ctx
  // as fallback. Signed-in users still warm the localStorage cache.
  if (typeof supaUser === 'undefined' || !supaUser) return;
  _ctxInflight[raw] = true;
  _ctxBatchQueue.push({ c: c, idx: idx, raw: raw });
  if (_ctxBatchTimer) return;
  // 80ms debounce window catches every card rendered in the same tick
  // (a paginated grid renders synchronously, so the timer fires once
  // after the whole batch is queued).
  _ctxBatchTimer = setTimeout(function() {
    _ctxBatchTimer = null;
    var batch = _ctxBatchQueue.splice(0);
    _flushCtxBatch(batch);
  }, 80);
}

function _flushCtxBatch(batch) {
  if (!batch.length) return;
  // Dedupe by raw text in case two cards share the same ctx string.
  var seen = {};
  var unique = batch.filter(function(b) {
    if (seen[b.raw]) return false;
    seen[b.raw] = true;
    return true;
  });
  var prompt = 'Translate each Korean situation description to natural, concise English (one sentence each, no quotes, no extra commentary). Return ONLY a JSON array of strings IN THE SAME ORDER. No markdown, no preamble.\n\nInputs:\n'
    + unique.map(function(b, i) { return (i + 1) + '. ' + b.raw; }).join('\n');
  callClaude({
    feature: 'conv-ctx-translate-batch',
    model: 'claude-haiku-4-5-20251001',
    max_tokens: Math.max(400, unique.length * 60),
    messages: [{ role: 'user', content: prompt }]
  }).then(function(r) {
    var rawTxt = ((r.content || []).map(function(b){return b.text||'';}).join('')).trim();
    var s = rawTxt.indexOf('['), e = rawTxt.lastIndexOf(']');
    if (s < 0 || e <= s) throw new Error('JSON not found in batch response');
    var arr = JSON.parse(rawTxt.slice(s, e + 1));
    // Map results back to ALL queued items (not just unique) so cards
    // that share a ctx string both get patched.
    var byRaw = {};
    unique.forEach(function(b, i) { byRaw[b.raw] = (arr[i] || '').trim(); });
    batch.forEach(function(b) {
      var en = byRaw[b.raw];
      if (!en) return;
      _ctxCache[b.raw] = en;
      b.c.ctx_en = en;
      document.querySelectorAll('[data-ctx-target="' + b.idx + '"]').forEach(function(el) {
        el.classList.remove('cc2-ctx-loading');
        el.textContent = en;
      });
      var detailTitle = document.querySelector('[data-ctx-detail="' + b.idx + '"]');
      if (detailTitle) detailTitle.textContent = en;
    });
    _saveCtxCache();
  }).catch(function(err){ console.warn('[conv-ctx-batch] failed:', err); })
    .then(function() {
      batch.forEach(function(b) { delete _ctxInflight[b.raw]; });
    });
}

function _appendConvCards() {
  var grid = document.getElementById('conv-cards-grid');
  if (!grid) return;
  var batch = _convFilteredList.slice(_convShown, _convShown + _convPageSize);
  grid.insertAdjacentHTML('beforeend', batch.map(_renderOneCard).join(''));
  _convShown += batch.length;

  // 더보기 버튼
  var oldMore = document.getElementById('conv-load-more');
  if (oldMore) oldMore.remove();
  if (_convShown < _convFilteredList.length) {
    var remaining = _convFilteredList.length - _convShown;
    var btn = document.createElement('div');
    btn.id = 'conv-load-more';
    btn.style.cssText = 'grid-column:1/-1;text-align:center;padding:16px 0';
    btn.innerHTML = '<button onclick="_appendConvCards()" style="background:#2563eb;color:#fff;border:none;border-radius:10px;padding:10px 28px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">More (' + remaining + ') →</button>';
    grid.parentElement.appendChild(btn);
  }
}

// Highlight key expressions in bubble text
// Drop vocab entries already covered by key_expressions[]. The AI
// sometimes emits the same multi-word chunk (e.g. "화를 내다") in BOTH
// c.vocab[] and c.key_expressions[]; surfacing it twice (Vocabulary
// card AND Key Expressions card) was the same dup bug we fixed in
// stories. Whitespace-stripped compare so "화를 내다" in vocab matches
// "화를내다" in key_expressions and vice versa.
function _convVocabFilteredByKeyExprs(c) {
  var vocab = Array.isArray(c && c.vocab) ? c.vocab : [];
  var keyExprs = Array.isArray(c && c.key_expressions) ? c.key_expressions : [];
  if (!keyExprs.length) return vocab;
  var keyExprSet = Object.create(null);
  keyExprs.forEach(function(k){
    if (k && k.ko) keyExprSet[String(k.ko).replace(/\s+/g, '')] = 1;
  });
  return vocab.filter(function(v){
    if (!v || !v.ko) return true;
    return !keyExprSet[String(v.ko).replace(/\s+/g, '')];
  });
}

function highlightKeyExprs(text, keyExprs) {
  if (!keyExprs || !keyExprs.length) return escapeHtml(text);
  var escaped = escapeHtml(text);
  keyExprs.forEach(function(e) {
    if (!e.ko) return;
    var re = new RegExp('(' + e.ko.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'g');
    escaped = escaped.replace(re, '<span style="background:rgba(251,191,36,.45);padding:1px 3px;border-radius:4px;font-weight:700;cursor:help" title="' + (e.en||'').replace(/"/g,'&quot;') + '">$1</span>');
  });
  return escaped;
}

// id-keyed entry point used by the card click handler. Resolves the
// _id to a CURRENT index in CONVS so feed-style swipe nav keeps
// working, then delegates to openDetail. Falls back to no-op when
// the id isn't in CONVS (rare: deleted while the card was visible).
function openDetailById(convId) {
  if (!convId) return;
  var idx = -1;
  for (var i = 0; i < CONVS.length; i++) {
    if (CONVS[i] && String(CONVS[i]._id) === String(convId)) { idx = i; break; }
  }
  if (idx < 0) {
    console.warn('[conv] openDetailById: convId not in CONVS', convId);
    return;
  }
  // Defer openDetail to the next animation frame so the synchronous
  // tap handler returns immediately. Owner-reported page-unresponsive
  // dialog was partly caused by sync work inside openDetail running
  // on the same tick as the click — Chrome flagged the page as
  // non-responsive before the loading overlay even painted. Splitting
  // those guarantees the overlay shows up instantly and any further
  // hang at least happens AFTER the spinner is visible.
  (window.requestAnimationFrame || function(fn){ setTimeout(fn, 0); })(function () {
    Promise.resolve().then(function () { return openDetail(idx); }).catch(function (err) {
      console.error('[conv] openDetail crashed:', err);
      var panel = document.getElementById('detail-panel');
      var overlay = document.getElementById('detail-overlay');
      if (panel) panel.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;width:100%;background:#fff;border-radius:28px"><div style="text-align:center;padding:40px"><div style="font-size:15px;font-weight:700;color:#334155;margin-bottom:6px">Please try again in a moment</div><div style="font-size:13px;color:#64748b;margin-bottom:16px">Cannot load conversation. Refresh the page or pick another one.</div><button onclick="closeDetail()" style="padding:10px 20px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">← Back to list</button></div></div>';
      if (overlay) overlay.classList.remove('hidden');
    });
  });
}
window.openDetailById = openDetailById;

// Delegated click handler — survives innerHTML replacement, doesn't
// depend on inline onclick being correctly escaped or window-global
// at parse time, and works for keyboard activation too.
(function _khWireConvCardClicks() {
  function handle(e) {
    var card = e.target && e.target.closest && e.target.closest('.cc2[data-conv-id]');
    if (!card) return;
    // Don't hijack clicks on inner interactive elements (save buttons etc.)
    var inner = e.target.closest('button, a, [data-no-card-click]');
    if (inner && card.contains(inner)) return;
    var id = card.getAttribute('data-conv-id');
    if (!id) return;
    e.preventDefault();
    openDetailById(id);
  }
  document.addEventListener('click', handle);
  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var card = e.target && e.target.closest && e.target.closest('.cc2[data-conv-id]');
    if (!card) return;
    e.preventDefault();
    var id = card.getAttribute('data-conv-id');
    if (id) openDetailById(id);
  });
})();

// Pointer-based drag-to-scroll fallback for the category rails. Native
// overflow-x:auto produces a scrollbar but some users reported the
// scrollbar didn't drag the content — likely a stacking/pointer-events
// regression we couldn't reproduce. This adds an explicit click-and-
// drag handler on the rail container that scrolls programmatically, so
// the rail is always navigable regardless of the native scrollbar.
(function _khWireRailDragScroll() {
  var active = null;
  var startX = 0;
  var startScroll = 0;
  var moved = false;
  document.addEventListener('pointerdown', function(e) {
    var rail = e.target && e.target.closest && e.target.closest('.cv-rail-scroll');
    if (!rail) return;
    // Only left mouse / touch / pen — ignore right click etc.
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    active = rail;
    startX = e.clientX;
    startScroll = rail.scrollLeft;
    moved = false;
    rail.style.cursor = 'grabbing';
  }, { passive: true });
  document.addEventListener('pointermove', function(e) {
    if (!active) return;
    var dx = e.clientX - startX;
    if (Math.abs(dx) > 4) moved = true;
    active.scrollLeft = startScroll - dx;
  }, { passive: true });
  function end() {
    if (!active) return;
    active.style.cursor = '';
    // If the pointer moved meaningfully, suppress the upcoming click so
    // a drag doesn't open a card.
    if (moved) {
      var swallow = function(e) {
        e.stopPropagation();
        e.preventDefault();
        document.removeEventListener('click', swallow, true);
      };
      document.addEventListener('click', swallow, true);
    }
    active = null;
  }
  document.addEventListener('pointerup', end, { passive: true });
  document.addEventListener('pointercancel', end, { passive: true });
})();

async function openDetail(idx) {
  var c = CONVS[idx];

  _convDetailIdx = idx;

  // /korehan-conversations.html?id=X surface THIS conversation's
  // title / intro / image instead of the generic placeholder.
  try {
    if (typeof khUpdatePageMeta === 'function') {
      khUpdatePageMeta({
        title:       (c.title || 'Conversation') + ' — KoreHani',
        description: String(c.intro_en || c.intro || c.subtitle || c.title_en || c.title || '').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0, 155),
        image:       (c.thumb && /^https?:\/\//.test(c.thumb)) ? c.thumb

      });

  } catch(_) {}
  // Reuse the article reader's immersive chrome (header/footer/bottom
  // nav hide) — shared.js CSS rules on body.kh-reading-page cover the
  // whole page, not just the article route.
  document.body.classList.add('kh-reading-page');
  // Make sure the "Next conversation" pill exists once the reader
  // chrome is active — its CSS selector is body.kh-reading-page scoped.
  if (typeof _ensureConvNextPill === 'function') _ensureConvNextPill();
  // First Journey: 대화 읽기 퀘스트 체크
  if (typeof _fjIsComplete === 'function' && !_fjIsComplete('convo')) {
    if (typeof _fjMarkDone === 'function') _fjMarkDone('convo');
  }

  // Show loading overlay immediately
  var overlay = document.getElementById('detail-overlay');
  var panel = document.getElementById('detail-panel');
  if (!c._loaded) {
    panel.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;width:100%;background:#fff;border-radius:28px"><div style="text-align:center;padding:40px"><div style="font-size:32px;margin-bottom:12px;animation:spin 1s linear infinite">⏳</div><div style="font-size:15px;font-weight:700;color:#334155">Loading conversation…</div></div></div>';

    // forwarding to the fixed overlay's overflow-y:auto scroller,
    // owner-reported as "convo 스크롤 그냥 스크롤 자체가 안됨".
    document.body.style.overflow = 'hidden';

  // 상세 데이터 아직 안 로드됐으면 DB에서 가져오기. Wrap the await in a
  // Promise.race against a 10-second timeout so a stalled Supabase
  // call (RLS edge case, slow LTE) can't pin the reader on the
  // "Loading conversation…" spinner forever — owner-reported as
  // "한참 있다 켜지면 무한로딩 걸림". We still let it succeed up to
  // the deadline; only beyond that do we fall through to the
  // "not available" UI below.
  if (!c._loaded && c._id) {
    try {
      var sb = getSupa();
      var loadPromise = sb.from('conversations_data').select('*').eq('id', c._id).maybeSingle();
      var timeoutPromise = new Promise(function (_, reject) {
        setTimeout(function () { reject(new Error('conv-detail-load timeout')); }, 10000);
      });
      var res = await Promise.race([loadPromise, timeoutPromise]);
      if (res.error) { console.warn('conv load error:', res.error); }
      var row = res.data;
      if (row && row.data) {
        var d = row.data;
        c.msgs = d.msgs || [];
        c.vocab = d.vocab || [];
        c.grammar = d.grammar || [];
        c.mission = d.mission || [];
        c.key_expressions = d.key_expressions || [];
        c.thumb = d.thumb || c.thumb;
        c.topic = d.topic || c.topic;
        c.name = d.name || c.name;

    enrichFromCache('conversation', Object.assign({}, c, {id: c._id})).then(function(enriched) {

  // _restoreConvMobileTab() swaps to the user's preferred tab if
  // they'd picked one earlier.
  panelEl.classList.remove('dp-mobile-tab-analysis', 'dp-mobile-tab-practice');
  panelEl.classList.add('dp-mobile-tab-read');
  if (typeof _restoreConvMobileTab === 'function') _restoreConvMobileTab();

  document.getElementById('detail-overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';

  // Auto-fire the first practice drill (linear flow). Same call as
  // the renderStudyNotes path uses; defer to next tick so the DOM
  // is fully painted.
  setTimeout(function() { try { convPracticeAutoStart(); } catch(_) {} }, 0);

  // 저장된 단어 상태 복원 (비동기)
  restoreSaveButtons('detail-overlay');
}

    +(grammar||isAdm ? '<div class="dp-study-card" data-study="grammar"><div class="dp-study-card-title">'+_IC.pen+' Expressions'+addGrammarBtn+'</div><div class="dp-grammar-list" id="dp-grammar-list">'+(grammar||'')+'</div></div>' : '')
