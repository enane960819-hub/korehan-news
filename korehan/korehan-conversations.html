<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversations — KoreHan News</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@400;600;700&family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="korehan-shared.css">
<style>
/* ── CONVERSATIONS PAGE ──────────────────────────────── */
/* Hero */
.conv-page-hero{
  background:#0f172a;
  padding:52px 24px 48px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.conv-page-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 120%, rgba(37,99,235,.45) 0%, transparent 70%);
  pointer-events:none;
}
.conv-page-hero-inner{position:relative;z-index:1;max-width:700px;margin:0 auto;}
.conv-page-hero-tag{display:inline-flex;align-items:center;gap:7px;background:rgba(37,99,235,.22);border:1px solid rgba(99,149,255,.35);border-radius:999px;padding:5px 14px;font-size:11px;font-weight:700;color:rgba(255,255,255,.75);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;}
.conv-page-hero h1{font-family:'Playfair Display',serif;font-size:clamp(30px,5vw,52px);font-weight:900;color:#fff;margin:0 0 14px;line-height:1.1;}
.conv-page-hero h1 em{font-style:normal;color:#60a5fa;}
.conv-page-hero p{font-size:15px;color:rgba(255,255,255,.55);margin:0 auto;max-width:480px;line-height:1.65;}
.conv-hero-stats{display:flex;justify-content:center;gap:32px;margin-top:28px;}
.conv-hero-stat{text-align:center;}
.conv-hero-stat-n{font-size:26px;font-weight:900;color:#fff;line-height:1;}
.conv-hero-stat-l{font-size:11px;color:rgba(255,255,255,.4);margin-top:4px;font-weight:600;}

/* Category tiles */
.conv-cats{background:#fff;border-bottom:1px solid #e8eef7;overflow-x:auto;scrollbar-width:none;}
.conv-cats::-webkit-scrollbar{display:none;}
.conv-cats-inner{display:flex;gap:0;max-width:1280px;margin:0 auto;}
.conv-cat-tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:16px 28px;cursor:pointer;border:none;background:none;font-family:inherit;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.conv-cat-tile:hover{background:#f8faff;border-bottom-color:#bfdbfe;}
.conv-cat-tile.on{border-bottom-color:#2563eb;background:#f0f7ff;}
.conv-cat-tile.on .cct-icon{transform:scale(1.12);}
.cct-icon{font-size:24px;transition:transform .18s;}
.cct-label{font-size:12px;font-weight:800;color:#334155;}
.conv-cat-tile.on .cct-label{color:#1d4ed8;}
.cct-count{font-size:10px;color:#94a3b8;font-weight:600;}

/* Level selector */
.conv-level-bar{background:#f8fafc;border-bottom:1px solid #e8eef7;padding:10px 24px;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;}
.conv-level-bar::-webkit-scrollbar{display:none;}
.conv-level-label{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#94a3b8;margin-right:4px;white-space:nowrap;}
.cf-pill{padding:6px 15px;border-radius:999px;border:1.5px solid #e2e8f0;background:transparent;color:#64748b;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
.cf-pill.on,.cf-pill:hover{background:#0f172a;color:#fff;border-color:#0f172a;}

/* Cards */
.conv-page-container{max-width:1280px;margin:0 auto;padding:28px 24px 72px;}
.conv-result-label{font-size:12px;color:#94a3b8;font-weight:700;margin-bottom:16px;letter-spacing:.04em;}
.conv-cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}

.cc2{background:#fff;border-radius:22px;border:1px solid #e8eef7;overflow:hidden;cursor:pointer;
  box-shadow:0 1px 8px rgba(15,23,42,.05);
  transition:box-shadow .2s,transform .2s;
  display:flex;flex-direction:column;}
.cc2:hover{transform:translateY(-4px);box-shadow:0 16px 48px rgba(15,23,42,.12);}

/* Card top accent bar */
.cc2-accent{height:4px;flex-shrink:0;}
.cat-everyday .cc2-accent{background:linear-gradient(90deg,#3b82f6,#60a5fa);}
.cat-work     .cc2-accent{background:linear-gradient(90deg,#6366f1,#818cf8);}
.cat-friends  .cc2-accent{background:linear-gradient(90deg,#10b981,#34d399);}
.cat-family   .cc2-accent{background:linear-gradient(90deg,#f59e0b,#fbbf24);}
.cat-dating   .cc2-accent{background:linear-gradient(90deg,#ec4899,#f472b6);}

.cc2-body{padding:18px 20px 16px;flex:1;display:flex;flex-direction:column;}
.cc2-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cc2-cat-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:3px 10px;border-radius:999px;}
.cat-everyday .cc2-cat-tag{background:#eff6ff;color:#1d4ed8;}
.cat-work     .cc2-cat-tag{background:#eef2ff;color:#4338ca;}
.cat-friends  .cc2-cat-tag{background:#ecfdf5;color:#059669;}
.cat-family   .cc2-cat-tag{background:#fffbeb;color:#b45309;}
.cat-dating   .cc2-cat-tag{background:#fdf2f8;color:#be185d;}
.cc2-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;}
.badge-b{background:#dcfce7;color:#15803d;}
.badge-i{background:#fef9c3;color:#92400e;}
.badge-a{background:#fee2e2;color:#b91c1c;}

.cc2-scene{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;}
.cc2-avi{width:46px;height:46px;border-radius:16px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid #e2e8f0;}
.cc2-scene-info{flex:1;min-width:0;}
.cc2-name{font-size:15px;font-weight:900;color:#0f172a;line-height:1.3;margin-bottom:3px;}
.cc2-ctx{font-size:12px;color:#64748b;line-height:1.4;}

/* Chat preview */
.cc2-chat{background:#f8fafc;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.cc2-bub{max-width:85%;padding:7px 12px;border-radius:14px;font-size:12.5px;line-height:1.55;font-family:'Noto Sans KR',sans-serif;}
.cc2-bub.l{background:#fff;color:#0f172a;border:1px solid #e2e8f0;border-bottom-left-radius:3px;align-self:flex-start;}
.cc2-bub.r{background:#2563eb;color:#fff;border-bottom-right-radius:3px;align-self:flex-end;}

/* Vocab hint chips */
.cc2-vocab-hints{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;margin-bottom:16px;}
.cc2-vocab-chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;background:#f1f5f9;color:#475569;font-family:'Noto Sans KR',sans-serif;}

/* CTA button */
.cc2-cta{display:flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:12px;
  background:#0f172a;color:#fff;
  font-size:13px;font-weight:800;font-family:inherit;
  border:none;cursor:pointer;width:100%;
  transition:background .15s;}
.cc2:hover .cc2-cta{background:#1d4ed8;}
.cc2-foot-meta{display:flex;align-items:center;justify-content:space-between;padding:0 2px 12px;font-size:11px;color:#94a3b8;font-weight:600;}

/* Detail overlay — unchanged structure but tweaked */
.detail-overlay{position:fixed;inset:0;background:rgba(5,12,24,.65);backdrop-filter:blur(6px);z-index:400;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;overflow-y:auto;}
.detail-overlay.hidden{display:none;}
.detail-panel{width:100%;max-width:1100px;background:#f8fafc;border-radius:28px;overflow:hidden;box-shadow:0 32px 80px rgba(5,12,24,.3);display:grid;grid-template-columns:1.2fr .85fr;min-height:600px;animation:panelIn .22s cubic-bezier(.22,1,.36,1);}
@keyframes panelIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.dp-left{background:#fff;display:flex;flex-direction:column;}
.dp-left-head{background:linear-gradient(135deg,#1d4ed8 0%,#3b82f6 100%);padding:22px 24px 18px;position:relative;}
.dp-left-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.7);margin-bottom:6px;}
.dp-left-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:#fff;margin:0 0 4px;}
.dp-left-sub{font-size:13px;color:rgba(255,255,255,.75);}
.detail-close{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:inherit;line-height:1;}
.detail-close:hover{background:rgba(255,255,255,.28);}
.dp-pills{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px 12px;border-bottom:1px solid #f0f4fa;}
.dp-pill{font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;}
.dp-pill-blue{background:#eff6ff;color:#1d4ed8;}
.dp-pill-gray{background:#f1f5f9;color:#475569;}
.dp-pill-green{background:#dcfce7;color:#15803d;}
.dp-pill-pink{background:#fce7f3;color:#be185d;}
.dp-pill-amber{background:#fef9c3;color:#92400e;}
.dp-chat-area{flex:1;padding:20px 24px 16px;background:linear-gradient(180deg,#f8fbff 0%,#f8fafc 100%);overflow-y:auto;max-height:420px;}
.dp-date-sep{text-align:center;margin-bottom:18px;}
.dp-date-sep span{display:inline-block;padding:6px 14px;border-radius:999px;background:#e2e8f0;color:#64748b;font-size:11px;font-weight:700;}
.dp-msg-row{display:flex;margin-bottom:12px;align-items:flex-end;gap:10px;}
.dp-msg-row.left{justify-content:flex-start;}
.dp-msg-row.right{justify-content:flex-end;}
.dp-avatar{width:36px;height:36px;border-radius:12px;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:2px solid #bfdbfe;}
.dp-bubble-group{max-width:74%;}
.dp-who{font-size:11px;font-weight:700;color:#64748b;margin-bottom:5px;}
.dp-bubble{border-radius:20px;padding:11px 15px;font-size:14px;line-height:1.6;font-family:'Noto Sans KR',sans-serif;}
.dp-msg-row.left .dp-bubble{background:#fff;color:#0f172a;border:1px solid #e2e8f0;border-bottom-left-radius:6px;box-shadow:0 4px 12px rgba(15,23,42,.06);}
.dp-msg-row.right .dp-bubble{background:#2563eb;color:#fff;border-bottom-right-radius:6px;}
.dp-time{font-size:10px;color:#94a3b8;margin-top:4px;padding:0 3px;}
.dp-msg-row.right .dp-time{text-align:right;}
.dp-inline-note{margin-top:7px;font-size:12px;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe;padding:7px 11px;border-radius:12px;line-height:1.5;}
.dp-cta-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px 24px 20px;background:#fff;border-top:1px solid #f0f4fa;}
@media(max-width:600px){.dp-cta-row{grid-template-columns:1fr 1fr;}}
.dp-cta-btn{padding:12px;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:all .15s;}
.dp-cta-primary{background:#2563eb;color:#fff;}
.dp-cta-primary:hover{background:#1d4ed8;}
.dp-cta-secondary{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;}
.dp-cta-secondary:hover{background:#dbeafe;}
.dp-right{background:#f8fafc;display:flex;flex-direction:column;border-left:1px solid #e8eef7;overflow-y:auto;}
.dp-right-head{padding:22px 24px 16px;border-bottom:1px solid #e8eef7;background:#fff;}
.dp-right-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#2563eb;margin-bottom:6px;}
.dp-right-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:#0f172a;margin:0;}
.dp-study-sections{padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.dp-study-card{background:#fff;border-radius:20px;border:1px solid #e8eef7;padding:18px 20px;box-shadow:0 2px 12px rgba(15,23,42,.04);}
.dp-study-card-title{font-size:14px;font-weight:800;color:#0f172a;margin:0 0 12px;display:flex;align-items:center;gap:7px;}
.dp-vocab-list{display:flex;flex-direction:column;gap:8px;}
.dp-vocab-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:#f8fafc;border:1px solid #e8eef7;transition:background .12s;}
.dp-vocab-item:hover{background:#eff6ff;border-color:#bfdbfe;}
.dp-vi-ko{font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;color:#1d4ed8;min-width:90px;}
.dp-vi-rom{font-size:11px;color:#94a3b8;font-style:italic;min-width:80px;flex-shrink:0;}
.dp-vi-en{font-size:12px;color:#334155;flex:1;}
.dp-vi-save{font-size:10px;font-weight:700;color:#64748b;background:none;border:1px solid #e2e8f0;border-radius:999px;padding:3px 10px;cursor:pointer;font-family:inherit;transition:all .12s;flex-shrink:0;}
.dp-vi-save:hover{border-color:#2563eb;color:#2563eb;}
.dp-vi-save.saved{background:#2563eb;border-color:#2563eb;color:#fff;}
.dp-grammar-list{display:flex;flex-direction:column;gap:9px;}
.tts-bubble{cursor:pointer;position:relative;}
.tts-bubble:hover{opacity:.88;}
.tts-bubble:active{transform:scale(.97);}
.dp-tts-icon{font-size:11px;margin-left:6px;opacity:0;transition:opacity .15s;vertical-align:middle;}
.tts-bubble:hover .dp-tts-icon{opacity:.7;}
.tts-bubble.tts-playing .dp-tts-icon{opacity:1;animation:tts-pulse .6s infinite alternate;}
@keyframes tts-pulse{from{opacity:.4}to{opacity:1}}
@keyframes rpBubbleIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dp-grammar-item{padding:10px 14px;border-radius:12px;background:#f8fafc;border:1px solid #e8eef7;font-size:13px;line-height:1.6;color:#334155;}
.dp-grammar-item strong{color:#1d4ed8;font-weight:800;}
.dp-keywords{display:flex;flex-wrap:wrap;gap:7px;}
.dp-keyword{display:inline-block;padding:7px 13px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;font-size:12px;font-weight:700;color:#334155;cursor:pointer;transition:all .12s;}
.dp-keyword:hover{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8;}

/* Key Expressions */
.dp-expr-list{display:flex;flex-direction:column;gap:8px;}
.dp-expr-item{border-left:3px solid #3b82f6;border-radius:0 12px 12px 0;padding:9px 13px;background:#f8fbff;}
.dp-expr-txt{font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;color:#0f172a;margin-bottom:3px;line-height:1.5;}
.dp-expr-note{font-size:11px;color:#64748b;line-height:1.4;}

/* Inline edit modal */
.ie-modal{background:#f8fbff;border-radius:22px;width:100%;max-width:1180px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.28);margin:auto;border:1px solid #dbe4f0;}
.ie-modal-grid{display:grid;grid-template-columns:1.2fr .9fr;min-height:80vh;}
@media(max-width:820px){.ie-modal-grid{grid-template-columns:1fr;min-height:unset;}}
.ie-left{background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;}
.ie-right{background:#f8fbff;display:flex;flex-direction:column;overflow-y:auto;max-height:90vh;}
.ie-header{padding:20px 22px;background:linear-gradient(135deg,#2550b7,#3a72ea);color:#fff;position:relative;flex-shrink:0;}
.ie-chat-area{flex:1;overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:10px;background:#f8fbff;min-height:250px;}
.ie-add-bar{padding:12px 16px;background:#fff;border-top:1px solid #e5ecf5;flex-shrink:0;}
.ie-edit-bub-l{background:#fff;color:#0f172a;border:1px solid #e2e8f0;border-bottom-left-radius:4px;}
.ie-edit-bub-r{background:#2563eb;color:#fff;border-bottom-right-radius:4px;}
.ie-bub-actions{display:flex;gap:4px;margin-top:4px;}
.ie-bub-btn{background:#f1f5f9;border:none;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;color:#64748b;font-family:inherit;}
.ie-bub-del{background:#fee2e2;color:#b91c1c;}
.ie-list-row{display:grid;gap:5px;align-items:center;}
.ie-list-row input{padding:6px 9px;border:1px solid #e2e8f0;border-radius:7px;font-size:12px;font-family:inherit;box-sizing:border-box;background:#fbfdff;}
.ie-list-row input:focus{outline:none;border-color:#2563eb;}
.ie-del-btn{background:#fee2e2;border:none;border-radius:7px;padding:6px 9px;font-size:12px;cursor:pointer;color:#b91c1c;}
.ie-add-row-btn{margin-top:6px;background:#f0f7ff;color:#2563eb;border:1.5px dashed #bfdbfe;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;}

/* Responsive */
@media(max-width:900px){
  .conv-cards-grid{grid-template-columns:1fr}
  .detail-panel{grid-template-columns:1fr}
  .dp-right{border-left:none;border-top:1px solid #e8eef7}
}
@media(max-width:600px){
  .conv-page-hero{padding:36px 16px 32px;}
  .conv-hero-stats{gap:20px;}
  .conv-cat-tile{padding:12px 18px;}
  .detail-panel{border-radius:20px}
  .conv-page-container{padding:20px 16px 60px;}
}

/* ── Override shared.css mobile dark theme (Mobile redesign patch v3) ─────
   shared.css @media(max-width:900px) forces dark navy backgrounds/text on
   body, .cc2, .detail-panel, etc. Conversations page is light-themed only. */
@media(max-width:900px){
  body{background:#f0f2f7 !important;color:#0d1b2e !important;}
  body .conv-cats{background:#fff !important;border-bottom-color:#e8eef7 !important;}
  body .conv-level-bar{background:#f8fafc !important;border-bottom-color:#e8eef7 !important;}
  body .conv-page-container{background:transparent !important;padding:20px 16px 72px !important;max-width:100% !important;}
  body .cc2{background:#fff !important;border-color:#e8eef7 !important;color:#0f172a !important;box-shadow:0 1px 8px rgba(15,23,42,.05) !important;border-radius:22px !important;}
  body .cc2-name{color:#0f172a !important;}
  body .cc2-ctx{color:#64748b !important;}
  body .cc2-bub.l{background:#fff !important;color:#0f172a !important;border-color:#e2e8f0 !important;}
  body .cc2-bub.r{background:#2563eb !important;color:#fff !important;}
  body .cc2-vocab-chip{background:#f1f5f9 !important;color:#475569 !important;}
  body .cc2-cta{background:#0f172a !important;color:#fff !important;}
  body .cc2:hover .cc2-cta{background:#1d4ed8 !important;}
  body .cf-pill{background:transparent !important;border-color:#e2e8f0 !important;color:#64748b !important;}
  body .cf-pill.on{background:#0f172a !important;color:#fff !important;border-color:#0f172a !important;}
  body .conv-cat-tile{background:none !important;color:#334155 !important;}
  body .conv-cat-tile.on{background:#f0f7ff !important;}
  body .cct-label{color:#334155 !important;}
  body .conv-cat-tile.on .cct-label{color:#1d4ed8 !important;}
  /* Detail panel */
  body .detail-panel{border-radius:22px !important;}
  body .dp-left{background:#fff !important;}
  body .dp-right{background:#f8fafc !important;}
  body .dp-left-head,body .dp-right-head{background:unset !important;border-color:#e8eef7 !important;}
  body .dp-chat-area{background:linear-gradient(180deg,#f8fbff 0%,#f8fafc 100%) !important;max-height:340px !important;}
  body .dp-msg-row.left .dp-bubble{background:#fff !important;color:#0f172a !important;border-color:#e2e8f0 !important;}
  body .dp-msg-row.right .dp-bubble{background:#2563eb !important;color:#fff !important;}
  body .dp-study-card{background:#fff !important;border-color:#e8eef7 !important;color:#0f172a !important;}
  body .dp-left-title,body .dp-right-title{color:#0f172a !important;}
}
</style>
</head>
<body>
<div id="kh-header"></div>

<!-- HERO -->
<div class="conv-page-hero">
  <div class="conv-page-hero-inner">
    <div class="conv-page-hero-tag">💬 KoreHan Conversations</div>
    <h1>Pick a scene.<br><em>Speak real Korean.</em></h1>
    <p>KakaoTalk-style conversations from daily Korean life — with vocab, grammar, quizzes, and role play built in.</p>
    <div class="conv-hero-stats">
      <div class="conv-hero-stat"><div class="conv-hero-stat-n" id="stat-total">—</div><div class="conv-hero-stat-l">Conversations</div></div>
      <div class="conv-hero-stat"><div class="conv-hero-stat-n" id="stat-words">—</div><div class="conv-hero-stat-l">Vocab Words</div></div>
      <div class="conv-hero-stat"><div class="conv-hero-stat-n">3</div><div class="conv-hero-stat-l">Study Modes</div></div>
    </div>
  </div>
</div>

<!-- CATEGORY TILES -->
<div class="conv-cats">
  <div class="conv-cats-inner" id="cat-pills">

    <button class="conv-cat-tile" data-cat="work"><span class="cct-icon">💼</span><span class="cct-label">Workplace</span><span class="cct-count" id="cnt-work">—</span></button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="korehan-shared.js"></script>
<script>
var CONVS = [];  // DB에서 로드

const LVL_LABEL = {b:'Beginner',i:'Intermediate',a:'Advanced'};
const LVL_CLS   = {b:'badge-b',i:'badge-i',a:'badge-a'};
const CAT_PILL  = {everyday:'dp-pill-blue',work:'dp-pill-gray',friends:'dp-pill-green',family:'dp-pill-amber',dating:'dp-pill-pink'};

var CAT_ICON = {everyday:'🏠',work:'💼',friends:'👫',family:'👨‍👩‍👧',dating:'💌'};
var CAT_NAME = {everyday:'Everyday',work:'Workplace',friends:'Friends',family:'Family',dating:'Dating'};

function updateCounts() {
  var total = CONVS.length;
  var words = CONVS.reduce(function(s,c){ return s + (c.vocab ? c.vocab.length : 0); }, 0);
  var el = document.getElementById('stat-total'); if(el) el.textContent = total;
  var ew = document.getElementById('stat-words'); if(ew) ew.textContent = words;
  ['all','everyday','work','friends','family','dating'].forEach(function(cat) {
    var el = document.getElementById('cnt-' + cat);
    if (!el) return;
    var n = cat === 'all' ? total : CONVS.filter(function(c){ return c.cat === cat; }).length;
    el.textContent = n + (n === 1 ? ' scene' : ' scenes');
  });
}

function renderCards(catF, lvlF) {
  var grid = document.getElementById('conv-cards-grid');
  var label = document.getElementById('conv-result-label');
  var list = CONVS.filter(function(c) {
    return (catF === 'all' || c.cat === catF) && (lvlF === 'all' || c.lvl === lvlF);
  });

  if (label) label.textContent = list.length ? list.length + ' conversation' + (list.length > 1 ? 's' : '') : '';

  if (!list.length) {
    grid.innerHTML = CONVS.length === 0
      ? '<div style="grid-column:1/-1;text-align:center;padding:80px 20px"><div style="font-size:48px;margin-bottom:16px">💬</div><div style="font-size:18px;font-weight:800;color:#0f172a;margin-bottom:8px">No conversations yet</div><div style="font-size:13px;color:#94a3b8">Add some via Admin → Conversations or use the AI Generator</div></div>'
      : '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#94a3b8;font-size:14px;font-weight:600;">No conversations match this filter</div>';
    return;
  }

  grid.innerHTML = list.map(function(c) {
    var ri = CONVS.indexOf(c);
    var catCls = 'cat-' + (c.cat || 'everyday');
    var catLabel = CAT_NAME[c.cat] || c.catLabel || '';

    // 2 preview bubbles only
    var prev = c.msgs.slice(0, 2).map(function(m) {
      return '<div class="cc2-bub ' + m.s + '">' + m.txt + '</div>';
    }).join('');

    // up to 4 vocab hint chips
    var chips = (c.vocab || []).slice(0, 4).map(function(v) {
      return '<span class="cc2-vocab-chip">' + v.ko + '</span>';
    }).join('');

    return '<div class="cc2 ' + catCls + '" onclick="openDetail(' + ri + ')">'
      + '<div class="cc2-accent"></div>'
      + '<div class="cc2-body">'
        + '<div class="cc2-meta">'
          + '<span class="cc2-cat-tag">' + catLabel + '</span>'
          + '<span class="cc2-badge ' + LVL_CLS[c.lvl] + '">' + LVL_LABEL[c.lvl] + '</span>'
        + '</div>'
        + '<div class="cc2-scene">'
          + '<div class="cc2-avi">' + c.avi + '</div>'
          + '<div class="cc2-scene-info">'
            + '<div class="cc2-name">' + c.name + '</div>'
            + '<div class="cc2-ctx">' + c.ctx + '</div>'
          + '</div>'
        + '</div>'
        + '<div class="cc2-chat">' + prev + '</div>'
        + (chips ? '<div class="cc2-vocab-hints">' + chips + '</div>' : '')
        + '<div class="cc2-foot-meta">'
          + '<span>' + (c.vocab ? c.vocab.length : 0) + ' key words</span>'
          + '<span>Tap to study →</span>'
        + '</div>'
        + '<button class="cc2-cta">Study this conversation →</button>'
      + '</div>'
    + '</div>';
  }).join('');
}

function openDetail(idx) {
  var c = CONVS[idx];
  window._currentConv = c;

  // ── 데일리 미션 + 읽기 기록 추적 ──────────────────────
  if (typeof dmTrackArticle === 'function') dmTrackArticle();
  if (supaUser && typeof getSupa === 'function') {
    try {
      var _sb = getSupa();
      if (_sb && c._id) {
        _sb.rpc('log_read_event', {
          p_user_id:      supaUser.id,
          p_content_type: 'conversation',
          p_content_id:   String(c._id),
          p_title:        c.name || '',
          p_level:        c.lvl  || '',
          p_category:     c.cat  || '',
          p_completed:    false
        }).catch(function(){});
      }
    } catch(e) {}
  }

  // 캐시에서 vocab/grammar 보강 (비동기, 완료되면 Study Notes 업데이트)
  if (typeof enrichFromCache === 'function' && c._id && (!c.vocab || !c.vocab.length)) {
    enrichFromCache('conversation', Object.assign({}, c, {id: c._id})).then(function(enriched) {
      // enriched.data에 있는 vocab/grammar를 c에 병합
      if (enriched && enriched.data) {
        if (enriched.data.vocab && !c.vocab.length) {
          c.vocab = enriched.data.vocab;
          c.grammar = enriched.data.grammar || [];
          c.mission = enriched.data.mission || [];
          window._currentConv = c;
          renderStudyNotes(c);
        }
      }
    }).catch(function(){});
  }
  var now = new Date();
  var h = now.getHours(), m = now.getMinutes();

  var msgs = c.msgs.map(function(msg, i) {
    var min = String((m + i) % 60).padStart(2,'0');
    var hr  = (h % 12) || 12;
    var ap  = h < 12 ? 'AM' : 'PM';
    var time = hr + ':' + min + ' ' + ap;
    var note = msg.note ? '<div class="dp-inline-note">💡 '+msg.note+'</div>' : '';
    var txt = msg.txt || '';
    var safe = txt.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    if (msg.s === 'l') {
      return '<div class="dp-msg-row left">'
        +'<div class="dp-avatar">'+c.avi+'</div>'
        +'<div class="dp-bubble-group">'
          +'<div class="dp-who">'+msg.who+'</div>'
          +'<div class="dp-bubble tts-bubble" onclick="playMsgTTS(\''+safe+'\')" title="Click to listen">'+txt+'<span class="dp-tts-icon">🔊</span></div>'
          +'<div class="dp-time">'+time+'</div>'
          +note
        +'</div></div>';
    } else {
      return '<div class="dp-msg-row right">'
        +'<div class="dp-bubble-group">'
          +'<div class="dp-bubble tts-bubble" onclick="playMsgTTS(\''+safe+'\')" title="Click to listen">'+txt+'<span class="dp-tts-icon">🔊</span></div>'
          +'<div class="dp-time">'+time+'</div>'
          +note
        +'</div></div>';
    }
  }).join('');

  var vocab = c.vocab.map(function(v) {
    var _sk=(v.ko||'').split('"').join('&quot;'),_sr=(v.rom||'').split('"').join('&quot;'),_se=(v.en||'').split('"').join('&quot;');
    return '<div class="dp-vocab-item" data-ko="'+_sk+'" data-rom="'+_sr+'" data-en="'+_se+'">'
      +'<span class="dp-vi-ko">'+v.ko+'</span>'
      +'<span class="dp-vi-rom">'+v.rom+'</span>'
      +'<span class="dp-vi-en">'+v.en+'</span>'
      +'<button class="dp-vi-save" onclick="toggleSave(this)">+ Save</button>'
      +'</div>';
  }).join('');

  var grammar = (c.grammar||[]).map(function(g) {
    return '<div class="dp-grammar-item"><strong>'+g.point+'</strong> — '+g.ex+'</div>';
  }).join('');

  var mission = (c.mission||[]).map(function(m) {
    return '<div class="dp-grammar-item">🎯 '+(m.task||m)+'</div>';
  }).join('');

  var expMsgs = (c.msgs||[]).filter(function(m){ return m.note && m.note.trim(); }).slice(0,4);
  if (!expMsgs.length) expMsgs = (c.msgs||[]).filter(function(m){ return m.txt && m.txt.length > 4; }).slice(0,3);
  var expressions = expMsgs.map(function(m){
    return '<div class="dp-expr-item"><div class="dp-expr-txt">'+m.txt+'</div>'+(m.note?'<div class="dp-expr-note">'+m.note+'</div>':'')+'</div>';
  }).join('');

  var pills = '<span class="dp-pill dp-pill-blue">'+LVL_LABEL[c.lvl]+'</span>'
    +'<span class="dp-pill '+(CAT_PILL[c.cat]||'dp-pill-gray')+'">'+c.catLabel+'</span>'
    +'<span class="dp-pill dp-pill-gray">'+c.topic+'</span>';

  document.getElementById('detail-panel').innerHTML =
    '<div class="dp-left">'
      +'<div class="dp-left-head">'
        +'<button class="detail-close" onclick="closeDetail()">✕</button>'
        +'<div class="dp-left-eyebrow">Conversation</div>'
        +'<div class="dp-left-title">'+c.name+'</div>'
        +'<div class="dp-left-sub">'+c.ctx+'</div>'
      +'</div>'
      +'<div class="dp-pills">'+pills+'</div>'
      +'<div class="dp-chat-area">'
        +'<div class="dp-date-sep"><span>Today</span></div>'
        +msgs
      +'</div>'
      +'<div class="dp-cta-row">'        +'<button class="dp-cta-btn dp-cta-secondary" onclick="closeDetail()">← All</button>'        +(window._isAdmin ? '<button class="dp-cta-btn" style="background:#f1f5f9;color:#334155" onclick="editCurrentConv()">✏️ Edit</button>'                          + '<button class="dp-cta-btn" style="background:#fee2e2;color:#b91c1c" onclick="deleteCurrentConv()">🗑 Delete</button>' : '')        +'<button class="dp-cta-btn dp-cta-secondary" onclick="startBlankQuiz()">✏️ Blank Fill</button>'
      +'<button class="dp-cta-btn dp-cta-secondary" onclick="startOrderQuiz()">🔀 Word Order</button>'
      +'<button class="dp-cta-btn dp-cta-primary" onclick="startRolePlay()">🎭 Role Play</button>'
      +'</div>'
    +'</div>'
    +'<div class="dp-right">'
      +'<div class="dp-right-head"><div class="dp-right-label">Study Notes</div><div class="dp-right-title">Conversation Breakdown</div></div>'
      +'<div class="dp-study-sections" id="dp-study-sections">'
        +'<div class="dp-study-card"><div class="dp-study-card-title"><span>📚</span> Key Vocabulary</div><div class="dp-vocab-list">'+vocab+'</div></div>'
        +(grammar ? '<div class="dp-study-card"><div class="dp-study-card-title"><span>✏️</span> Grammar Points</div><div class="dp-grammar-list">'+grammar+'</div></div>' : '')
        +'<div class="dp-study-card"><div class="dp-study-card-title"><span>💬</span> Key Expressions</div><div class="dp-expr-list">'+(expressions||'<span style="color:#94a3b8;font-size:13px">—</span>')+'</div></div>'
        +(mission ? '<div class="dp-study-card"><div class="dp-study-card-title"><span>🎯</span> Practice Mission</div><div class="dp-grammar-list">'+mission+'</div></div>' : '')
      +'</div>'
    +'</div>';

  document.getElementById('detail-overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';

  // 저장된 단어 상태 복원 (비동기)
  restoreSaveButtons('detail-overlay');
}

// 캐시 enrichment 후 Study Notes만 업데이트
function renderStudyNotes(c) {
  var el = document.getElementById('dp-study-sections');
  if (!el) return;
  var vocab = (c.vocab||[]).map(function(v) {
    var _sk=(v.ko||'').split('"').join('&quot;'),_sr=(v.rom||'').split('"').join('&quot;'),_se=(v.en||'').split('"').join('&quot;');
    return '<div class="dp-vocab-item" data-ko="'+_sk+'" data-rom="'+_sr+'" data-en="'+_se+'">'
      +'<span class="dp-vi-ko">'+v.ko+'</span>'
      +'<span class="dp-vi-rom">'+v.rom+'</span>'
      +'<span class="dp-vi-en">'+v.en+'</span>'
      +'<button class="dp-vi-save" onclick="toggleSave(this)">+ Save</button>'
      +'</div>';
  }).join('');
  var grammar = (c.grammar||[]).map(function(g) {
    return '<div class="dp-grammar-item"><strong>'+(g.point||'')+'</strong> — '+(g.ex||g.en||'')+'</div>';
  }).join('');
  var mission = (c.mission||[]).map(function(m){ return '<div class="dp-grammar-item">🎯 '+(m.task||m)+'</div>'; }).join('');
  var expMsgs2 = (c.msgs||[]).filter(function(m){ return m.note && m.note.trim(); }).slice(0,4);
  if (!expMsgs2.length) expMsgs2 = (c.msgs||[]).filter(function(m){ return m.txt && m.txt.length > 4; }).slice(0,3);
  var expressions2 = expMsgs2.map(function(m){
    return '<div class="dp-expr-item"><div class="dp-expr-txt">'+m.txt+'</div>'+(m.note?'<div class="dp-expr-note">'+m.note+'</div>':'')+'</div>';
  }).join('');
  el.innerHTML =
    '<div class="dp-study-card"><div class="dp-study-card-title"><span>📚</span> Key Vocabulary</div><div class="dp-vocab-list">'+(vocab||'<span style="color:#94a3b8;font-size:13px">단어 데이터 없음</span>')+'</div></div>'
    +(grammar ? '<div class="dp-study-card"><div class="dp-study-card-title"><span>✏️</span> Grammar Points</div><div class="dp-grammar-list">'+grammar+'</div></div>' : '')
    +'<div class="dp-study-card"><div class="dp-study-card-title"><span>💬</span> Key Expressions</div><div class="dp-expr-list">'+(expressions2||'<span style="color:#94a3b8;font-size:13px">—</span>')+'</div></div>'
    +(mission ? '<div class="dp-study-card"><div class="dp-study-card-title"><span>🎯</span> Practice Mission</div><div class="dp-grammar-list">'+mission+'</div></div>' : '');
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.add('hidden');
  document.body.style.overflow = '';
}

// ── TTS ──────────────────────────────────────────────────────
var _ttsAudio = null;
function playMsgTTS(text) {
  if (!text) return;
  // 이미 재생 중이면 멈춤
  if (_ttsAudio) { _ttsAudio.pause(); _ttsAudio = null; }
  // 재생 중 버블 표시 초기화
  document.querySelectorAll('.tts-bubble.tts-playing').forEach(function(el){ el.classList.remove('tts-playing'); });
  // 클릭된 버블 찾기 (이벤트 target에서 closest)
  var bubble = event && event.currentTarget;
  if (bubble) bubble.classList.add('tts-playing');
  var audio = new Audio('/tts?t=' + encodeURIComponent(text));
  _ttsAudio = audio;
  audio.onended = function() {
    if (bubble) bubble.classList.remove('tts-playing');
    _ttsAudio = null;
  };
  audio.onerror = function() {
    if (bubble) bubble.classList.remove('tts-playing');
    _ttsAudio = null;
  };
  audio.play().catch(function(){});
}
async function toggleSave(btn) {
  var isSaved = btn.classList.contains('saved');
  // 단어 정보는 부모 .dp-vocab-item에서 읽음
  var item = btn.closest('.dp-vocab-item') || btn.closest('.dp-vocab-item2');
  var ko  = (item && item.dataset.ko)  || btn.dataset.ko  || '';
  var rom = (item && item.dataset.rom) || btn.dataset.rom || '';
  var en  = (item && item.dataset.en)  || btn.dataset.en  || '';

  if (!ko) {
    // fallback: 이전 방식 — 그냥 UI 토글
    btn.classList.toggle('saved');
    btn.textContent = btn.classList.contains('saved') ? '✓ Saved' : '+ Save';
    return;
  }

  if (!supaUser) { if (typeof openAuthModal === 'function') openAuthModal('signin'); return; }

  if (isSaved) {
    if (typeof dbRemoveWord === 'function') await dbRemoveWord(ko);
    btn.classList.remove('saved');
    btn.textContent = '+ Save';
  } else {
    if (typeof dbSaveWord === 'function') await dbSaveWord(ko, rom, en);
    if (typeof dmTrackWord === 'function') dmTrackWord();
    btn.classList.add('saved');
    btn.textContent = '✓ Saved';
  }
}

var activeCat = 'all', activeLvl = 'all';
document.addEventListener('DOMContentLoaded', async function() {
  // ── DB에서 conversations 로드 ──────────────────────────
  var grid = document.getElementById('conv-cards-grid');
  if (grid) grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#94a3b8;font-size:14px">⏳ 불러오는 중...</div>';

  try {
    var sb = getSupa();
    var { data, error } = await sb.from('conversations_data')
      .select('*')
      .order('created_at', {ascending: false});

    if (error) throw error;

    if (data && data.length) {
      // DB 데이터를 CONVS 형식으로 변환
      CONVS = data.map(function(row) {
        var d = row.data || {};
        // data 객체가 있으면 그대로, 없으면 row 자체에서 구성
        return Object.assign({
          _id: row.id,
          name: row.name || '',
          ctx:  row.ctx  || '',
          cat:  row.cat  || 'everyday',
          lvl:  row.lvl  || 'b',
          avi:  '💬',
          catLabel: '',
          msgs: [],
          vocab: [],
          grammar: [],
          mission: []
        }, d, {_id: row.id});
      });
    }
  } catch(e) {
    console.warn('DB 로드 실패, 내장 샘플 사용:', e.message);
    // fallback: 빈 상태 유지 (CONVS = [])
  }

  // 로드 완료 후 렌더
  renderCards(activeCat, activeLvl);

  // URL ?open=N → 해당 인덱스 자동 오픈
  // ?id=DB_ID 또는 ?open=INDEX 로 특정 대화 자동 오픈
  var _params = new URLSearchParams(window.location.search);
  var _openId  = _params.get('id');
  var _openIdx = _params.get('open');
  if (_openId) {
    var _targetIdx = CONVS.findIndex(function(c){ return String(c._id) === String(_openId); });
    if (_targetIdx >= 0) setTimeout(function(){ openDetail(_targetIdx); }, 80);
  } else if (_openIdx !== null && CONVS[parseInt(_openIdx)]) {
    setTimeout(function(){ openDetail(parseInt(_openIdx)); }, 80);
  }
  updateCounts();
  var catBar = document.getElementById('cat-pills');
  var lvlPills = document.getElementById('lvl-pills');
  catBar.querySelectorAll('[data-cat]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      catBar.querySelectorAll('[data-cat]').forEach(function(b){b.classList.remove('on');});
      btn.classList.add('on');
      activeCat = btn.dataset.cat;
      renderCards(activeCat, activeLvl);
    });
  });
  lvlPills.querySelectorAll('.cf-pill[data-lvl]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      lvlPills.querySelectorAll('.cf-pill[data-lvl]').forEach(function(b){b.classList.remove('on');});
      btn.classList.add('on');
      activeLvl = btn.dataset.lvl;
      renderCards(activeCat, activeLvl);
    });
  });
  var params = new URLSearchParams(window.location.search);
  var cp = params.get('cat');
  if (cp) { var t = catBar.querySelector('[data-cat="'+cp+'"]'); if(t) t.click(); }
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDetail(); });

// ── BLANK FILL QUIZ ──────────────────────────────────────────
function startBlankQuiz() {
  var c = window._currentConv;
  if (!c) return;
  var msgs = (c.msgs || []);
  if (!msgs.length) { alert('No messages found'); return; }

  var vocab = (c.vocab || []).filter(function(v){ return v.ko && v.ko.length > 1; });
  if (!vocab.length) { alert('No vocabulary data found'); return; }

  var questions = msgs.slice(0, 6).map(function(msg) {
    var text = msg.txt || msg.text || '';
    var used = vocab.find(function(v){ return text.includes(v.ko); });
    if (!used) return null;
    return { original: text, word: used.ko, en: used.en, who: msg.who||msg.name||'' };
  }).filter(Boolean).slice(0, 4);

  if (!questions.length) {
    // 단어가 대화에 없으면 단순 vocab 빈칸
    questions = vocab.slice(0, 4).map(function(v) {
      return { original: 'What does this mean? → ' + v.en, word: v.ko, en: v.en, who: '' };
    });
  }

  showQuizModal('blank', questions, c.name || '');
}

// ── ORDER QUIZ ────────────────────────────────────────────────
function startOrderQuiz() {
  var c = window._currentConv;
  if (!c) return;
  var msgs = (c.msgs || []).slice(0, 6);
  if (msgs.length < 3) { alert('Conversation is too short for this quiz'); return; }

  var questions = [];
  // 3개씩 슬라이딩 윈도우로 순서 맞추기
  for (var i = 0; i + 2 < msgs.length; i++) {
    var group = msgs.slice(i, i+3);
    questions.push({ msgs: group });
    if (questions.length >= 3) break;
  }

  showQuizModal('order', questions, c.name || '');
}

// ── QUIZ MODAL ────────────────────────────────────────────────
var _quizAnswers = [];
var _quizScore = 0;
var _quizTotal = 0;
var _quizMode = '';
var _quizQuestions = [];
var _quizCurrent = 0;

function showQuizModal(mode, questions, title) {
  _quizMode = mode;
  _quizQuestions = questions;
  _quizCurrent = 0;
  _quizScore = 0;
  _quizTotal = questions.length;

  var overlay = document.getElementById('quiz-overlay');

}

function renderQuizQuestion() {
  var overlay = document.getElementById('quiz-overlay');
  var q = _quizQuestions[_quizCurrent];
  var progress = (_quizCurrent / _quizTotal * 100).toFixed(0);

  var inner = '<div style="background:#fff;border-radius:24px;max-width:520px;width:100%;box-shadow:0 32px 80px rgba(15,23,42,.25);overflow:hidden;">'
    + '<div style="background:linear-gradient(135deg,#1d4ed8,#3b82f6);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;">'
    + '<div style="color:#fff;">'
    + '<div style="font-size:11px;font-weight:700;opacity:.8;letter-spacing:.08em;text-transform:uppercase;">' + (_quizMode==='blank'?'빈칸 채우기':'순서 맞추기') + '</div>'
    + '<div style="font-size:15px;font-weight:700;margin-top:2px">' + (_quizCurrent+1) + ' / ' + _quizTotal + '</div>'
    + '</div>'
    + '<button onclick="closeQuiz()" style="background:none;border:none;color:rgba(255,255,255,.7);font-size:22px;cursor:pointer;line-height:1;">✕</button>'
    + '</div>'
    + '<div style="height:4px;background:#e2e8f0;"><div style="height:4px;background:#3b82f6;width:'+progress+'%;transition:width .3s"></div></div>';

    inner += renderBlankQ(q);
  } else {
    inner += renderOrderQ(q);
  }

  inner += '</div>';

}

function renderBlankQ(q) {
  var displayed = q.original.replace(q.word, '<span style="background:#dbeafe;color:#1d4ed8;border-radius:6px;padding:2px 10px;font-weight:700;">＿＿＿</span>');
  // 보기 만들기: 정답 + 오답 2개
  var allVocab = (window._currentConv && window._currentConv.data && window._currentConv.data.vocab) || [];
  var wrongs = allVocab.filter(function(v){ return v.ko !== q.word; }).slice(0,2).map(function(v){ return v.ko; });
  if (wrongs.length < 2) wrongs = ['아니요','그렇지만'].slice(0, 2-wrongs.length).concat(wrongs);
  var choices = [q.word].concat(wrongs).sort(function(){ return Math.random()-.5; });

  return '<div style="padding:24px 22px;">'
    + (q.who ? '<div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:8px;">💬 ' + q.who + '</div>' : '')
    + '<div style="font-size:16px;line-height:1.8;background:#f8fafc;border-radius:12px;padding:14px 16px;margin-bottom:18px;font-family:\'Noto Sans KR\',sans-serif;">' + displayed + '</div>'
    + '<div style="font-size:12px;color:#94a3b8;margin-bottom:10px;">( ' + q.en + ' )  ← 힌트</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'
    + choices.map(function(ch){
        return '<button onclick="checkBlank(\''+ch.replace(/'/g,"\\'")+'\')" style="padding:12px;border-radius:12px;border:2px solid #e2e8f0;background:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:\'Noto Sans KR\',sans-serif;transition:all .12s;" onmouseover="this.style.borderColor=\'#3b82f6\'" onmouseout="this.style.borderColor=\'#e2e8f0\'">'
          + ch + '</button>';
      }).join('')
    + '</div></div>';
}

function renderOrderQ(q) {
  var shuffled = q.msgs.slice().sort(function(){ return Math.random()-.5; });
  var html = '<div style="padding:24px 22px;">'
    + '<div style="font-size:13px;font-weight:700;color:#1d4ed8;margin-bottom:14px;">대화 순서를 맞춰보세요 👆</div>'
    + '<div id="order-list" style="display:flex;flex-direction:column;gap:8px;">';

  shuffled.forEach(function(msg, i) {
    html += '<div class="order-item" data-index="' + i + '" data-txt="' + (msg.txt||msg.text||'').replace(/"/g,'&quot;') + '" '
      + 'style="background:#fff;border:2px solid #e2e8f0;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:grab;user-select:none;font-family:\'Noto Sans KR\',sans-serif;"'
      + ' draggable="true" ontouchstart="orderTouch(event,this)" ondragstart="orderDrag(event,this)" ondragover="event.preventDefault()" ondrop="orderDrop(event,this)">'
      + '<span style="font-size:18px;opacity:.4">⠿</span>'
      + '<div><div style="font-size:11px;font-weight:700;color:#64748b;">' + (msg.who||msg.name||'') + '</div>'
      + '<div style="font-size:14px;margin-top:2px;">' + (msg.txt||msg.text||'') + '</div></div>'
      + '</div>';
  });

  html += '</div>'
    + '<button onclick="checkOrder()" style="width:100%;margin-top:16px;padding:13px;border-radius:14px;background:#2563eb;color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;">확인 →</button>'
    + '</div>';

  return html;
}

var _dragSrc = null;
function orderDrag(e, el) { _dragSrc = el; e.dataTransfer.effectAllowed = 'move'; }
function orderDrop(e, el) {
  e.preventDefault();
  if (_dragSrc === el) return;
  var list = document.getElementById('order-list');
  var items = Array.from(list.children);
  var srcIdx = items.indexOf(_dragSrc);
  var tgtIdx = items.indexOf(el);
  if (srcIdx < tgtIdx) list.insertBefore(_dragSrc, el.nextSibling);
  else list.insertBefore(_dragSrc, el);
}

// 터치 드래그 (모바일)
var _touchEl = null, _touchClone = null;
function orderTouch(e, el) {
  _touchEl = el;
  e.target.style.opacity = '.5';
  document.addEventListener('touchmove', onTouchMove, {passive:false});
  document.addEventListener('touchend', onTouchEnd, {once:true});
}
function onTouchMove(e) {
  e.preventDefault();
  var t = e.touches[0];
  var list = document.getElementById('order-list');
  if (!list) return;
  Array.from(list.children).forEach(function(item) {
    var r = item.getBoundingClientRect();
    if (t.clientY > r.top && t.clientY < r.bottom && item !== _touchEl) {
      var midY = r.top + r.height/2;
      if (t.clientY < midY) list.insertBefore(_touchEl, item);
      else list.insertBefore(_touchEl, item.nextSibling);
    }
  });
}
function onTouchEnd(e) {
  if (_touchEl) _touchEl.style.opacity = '1';
  document.removeEventListener('touchmove', onTouchMove);
}

function checkBlank(choice) {
  var q = _quizQuestions[_quizCurrent];
  var correct = choice === q.word;
  if (correct) _quizScore++;
  showFeedback(correct, q.word, nextQuizQuestion);
}

function checkOrder() {
  var q = _quizQuestions[_quizCurrent];
  var list = document.getElementById('order-list');
  if (!list) return;
  var items = Array.from(list.children);
  var correct = true;
  q.msgs.forEach(function(msg, i) {
    var itemTxt = items[i] && (items[i].dataset.txt || '');
    if (itemTxt !== (msg.txt || msg.text || '')) correct = false;
  });
  if (correct) _quizScore++;
  showFeedback(correct, null, nextQuizQuestion);
}

function showFeedback(correct, answer, next) {
  var overlay = document.getElementById('quiz-overlay');
  var inner = overlay.querySelector('div');
  if (!inner) return;
  var fb = document.createElement('div');
  fb.style.cssText = 'padding:20px 22px;background:' + (correct?'#f0fdf4':'#fef2f2') + ';border-top:1px solid ' + (correct?'#bbf7d0':'#fecaca') + ';text-align:center;';
  fb.innerHTML = '<div style="font-size:28px;">' + (correct?'🎉':'😅') + '</div>'
    + '<div style="font-size:16px;font-weight:700;color:' + (correct?'#15803d':'#b91c1c') + ';margin:6px 0">' + (correct?'정답!':'틀렸어요') + '</div>'
    + (answer && !correct ? '<div style="font-size:14px;color:#64748b;">정답: <b>' + answer + '</b></div>' : '')
    + '<button onclick="nextQuizQuestion()" style="margin-top:14px;padding:10px 24px;border-radius:12px;background:#2563eb;color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">다음 →</button>';

  // 기존 버튼 비활성화
  inner.querySelectorAll('button:not([onclick="closeQuiz()"])').forEach(function(b){ b.disabled=true; b.style.opacity='.5'; });
  inner.appendChild(fb);
}

function nextQuizQuestion() {
  _quizCurrent++;
  if (_quizCurrent >= _quizTotal) {
    showQuizResult();
  } else {
    renderQuizQuestion();
  }
}

function retryQuiz() {

// ── ROLE PLAY ─────────────────────────────────────────────────

function startRolePlay() {

  var msgs = (c.msgs || []);

function beginRolePlay(side) {
  var c = window._currentConv;
  _rpMsgs = (c.msgs || []);
  _rpSide = side;
  _rpStep = 0;
  _rpScore = 0;
  renderRolePlayStep();
}

// MC 선택지 생성: 정답 + 다른 대화의 문장 3개 (문맥 이해 필요)
function rpGenChoices(correctTxt) {
  var pool = _rpMsgs
    .map(function(m){ return m.txt || ''; })
    .filter(function(t){ return t && t !== correctTxt; });
  // shuffle
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  var choices = [correctTxt].concat(pool.slice(0, 3));
  // shuffle choices
  for (var a = choices.length - 1; a > 0; a--) {
    var b = Math.floor(Math.random() * (a + 1));
    var tc = choices[a]; choices[a] = choices[b]; choices[b] = tc;
  }
  return choices;
}

function renderRolePlayStep() {
  var overlay = document.getElementById('rp-overlay');
  overlay.style.display = 'flex';
  var c = window._currentConv;
  var total = _rpMsgs.length;
  var progress = Math.round((_rpStep / total) * 100);

  // 채팅 히스토리 (지금까지 확정된 메시지들)
  var history = '';
  for (var i = 0; i < _rpStep; i++) {
    var m = _rpMsgs[i];
    var isMe = m.s === _rpSide;
    var bstyle = isMe
      ? 'background:#7c3aed;color:#fff;margin-left:auto;border-radius:18px 18px 4px 18px;'
      : 'background:#f1f5f9;color:#0f172a;margin-right:auto;border-radius:18px 18px 18px 4px;';
    history += '<div style="max-width:78%;padding:10px 14px;font-size:14px;line-height:1.6;margin-bottom:6px;font-family:\'Noto Sans KR\',sans-serif;' + bstyle + '">'
      + (m.txt || '') + '</div>';
  }

  var currentMsg = _rpMsgs[_rpStep];
  var bottomArea = '';

  if (!currentMsg) {
    // 완료
    var pct = total > 0 ? Math.round(_rpScore / Math.ceil(total / 2) * 100) : 0;
    if (pct > 100) pct = 100;
    bottomArea = '<div style="text-align:center;padding:16px 0 8px;">'
      + '<div style="font-size:40px;margin-bottom:8px;">' + (pct >= 80 ? '🏆' : pct >= 50 ? '👍' : '📚') + '</div>'
      + '<div style="font-size:17px;font-weight:900;color:#0f172a;margin-bottom:4px;">롤플레이 완료!</div>'
      + '<div style="font-size:13px;color:#7c3aed;font-weight:700;margin-bottom:14px;">내 정답률 ' + pct + '%</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">'
      + '<button onclick="beginRolePlay(_rpSide)" style="padding:11px;border-radius:12px;border:1px solid #e2e8f0;background:#f8fafc;color:#334155;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">🔄 다시 하기</button>'
      + '<button onclick="closeRolePlay()" style="padding:11px;border-radius:12px;background:#7c3aed;color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">✓ 완료</button>'
      + '</div></div>';

  } else if (currentMsg.s !== _rpSide) {
    // 상대방 차례 → 자동 표시 + TTS + 계속 버튼
    var npcTxt = currentMsg.txt || '';
    history += '<div style="max-width:78%;padding:10px 14px;font-size:14px;line-height:1.6;margin-bottom:6px;font-family:\'Noto Sans KR\',sans-serif;background:#f1f5f9;color:#0f172a;margin-right:auto;border-radius:18px 18px 18px 4px;animation:rpBubbleIn .25s ease;">'
      + npcTxt + '</div>';
    _rpStep++;
    // TTS 자동 재생
    if (npcTxt) {
      var npcAudio = new Audio('/tts?t=' + encodeURIComponent(npcTxt));
      npcAudio.play().catch(function(){});
    }
    bottomArea = '<button onclick="rpNext()" style="width:100%;padding:12px;border-radius:14px;background:#7c3aed;color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:12px;">내 차례 →</button>';

  } else {
    // 내 차례 → 4지선다
    var correctTxt = currentMsg.txt || '';
    var choices = rpGenChoices(correctTxt);
    var myTurn = Math.ceil(_rpStep / 2) + 1;
    bottomArea = '<div style="margin-top:10px;">'
      + '<div style="font-size:11px;font-weight:700;color:#7c3aed;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em;">내 대사를 고르세요 (' + myTurn + '번째 차례)</div>'
      + '<div style="display:flex;flex-direction:column;gap:8px;">'
      + choices.map(function(ch, ci) {
          var safeC = ch.replace(/'/g, "\\'");
          var safeA = correctTxt.replace(/'/g, "\\'");
          return '<button onclick="rpChoose(this,\'' + safeC + '\',\'' + safeA + '\')" '
            + 'style="padding:11px 14px;border-radius:14px;border:2px solid #e2e8f0;background:#fff;font-size:14px;font-family:\'Noto Sans KR\',sans-serif;cursor:pointer;text-align:left;line-height:1.5;transition:all .15s;" '
            + 'onmouseover="if(!this.dataset.done)this.style.borderColor=\'#7c3aed\'" '
            + 'onmouseout="if(!this.dataset.done)this.style.borderColor=\'#e2e8f0\'">'
            + ch + '</button>';
        }).join('')
      + '</div></div>';
  }

  overlay.innerHTML = '<div style="background:#fff;border-radius:24px;max-width:520px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(15,23,42,.25);overflow:hidden;">'

function rpChoose(btn, chosen, correct) {
  // 모든 버튼 비활성화
  var allBtns = btn.parentElement.querySelectorAll('button');
  allBtns.forEach(function(b){ b.dataset.done = '1'; b.style.cursor = 'default'; });

  var isCorrect = chosen === correct;
  if (isCorrect) {
    _rpScore++;
    btn.style.background = '#f0fdf4';
    btn.style.borderColor = '#22c55e';
    btn.style.color = '#15803d';
    // TTS 재생
    var audio = new Audio('/tts?t=' + encodeURIComponent(chosen));
    audio.play().catch(function(){});
  } else {
    btn.style.background = '#fef2f2';
    btn.style.borderColor = '#f87171';
    btn.style.color = '#b91c1c';
    // 정답 표시
    allBtns.forEach(function(b){
      if (b.textContent.trim() === correct) {
        b.style.background = '#f0fdf4';
        b.style.borderColor = '#22c55e';
        b.style.color = '#15803d';
      }
    });
    // 정답 TTS 재생
    var audioC = new Audio('/tts?t=' + encodeURIComponent(correct));
    audioC.play().catch(function(){});
  }

  _rpStep++;
  // 내 답변을 히스토리에 추가하고 다음 NPC 차례로
  setTimeout(function(){ renderRolePlayStep(); }, isCorrect ? 900 : 1400);
}

function rpNext() {
  renderRolePlayStep();
}

}

// AI re-analyze from current bubbles
async function ieAIAnalyze() {
  var btn = document.getElementById('ie-ai-btn');
  if (!window._editMsgs || !window._editMsgs.length) { alert('Add messages first'); return; }
  var msgsText = window._editMsgs.map(function(m){ return (m.s==='l'?'A':'B')+': '+m.txt; }).join('\n');
  var lvl = document.getElementById('ie-lvl').value;
  var lvlMap = {s:'Starter',b:'Beginner',i:'Intermediate',a:'Advanced'};
  btn.disabled = true;
  btn.textContent = '⏳ Analyzing...';
  var prompt = 'Korean conversation ('+lvlMap[lvl]+' level):\n\n'+msgsText
    +'\n\nReturn ONLY valid JSON, no markdown:\n{"vocab":[{"ko":"","rom":"","en":""}],"grammar":[{"point":"","ex":""}],"mission":["task1","task2","task3"]}'
    +'\n\n5-7 vocab words, 2-3 grammar patterns, 3 practice missions.';
  try {
    var resp = await callClaude({feature:'conv_analyze', model:'claude-haiku-4-5-20251001', max_tokens:1500, messages:[{role:'user',content:prompt}]});
    var raw = resp.content.map(function(b){ return b.text||''; }).join('');
    raw = raw.replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/\s*```$/,'').trim();
    var parsed = JSON.parse(raw);
    window._editVocab   = parsed.vocab   || [];
    window._editGrammar = parsed.grammar || [];
    window._editMission = parsed.mission || [];
    ieRenderVocab(); ieRenderGrammar(); ieRenderMission();
    btn.disabled = false; btn.textContent = '✅ Done (re-run)'; btn.style.background = '#059669';
    setTimeout(function(){ btn.textContent = '✨ AI Re-analyze'; btn.style.background = '#7c3aed'; }, 3000);
  } catch(e) {
    btn.disabled = false; btn.textContent = '✨ AI Re-analyze';
    var err = document.getElementById('ie-error');
    err.textContent = 'AI error: ' + (e.message||String(e)); err.style.display = 'block';
  }
}

async function saveInlineEdit(rowId) {
  var errEl = document.getElementById('ie-error');
  errEl.style.display = 'none';
  try {
    if (!window._editMsgs || !window._editMsgs.length) throw new Error('Add at least one message');
    var name = document.getElementById('ie-name').value.trim();
    if (!name) throw new Error('Enter a conversation name');
    var catVal = document.getElementById('ie-cat').value;
    var catLabelMap = {everyday:'Everyday',work:'Workplace',friends:'Friends',family:'Family',dating:'Dating'};
    var updatedData = Object.assign({}, window._currentConv, {
      name:     name,
      ctx:      document.getElementById('ie-ctx').value.trim(),
      avi:      document.getElementById('ie-avi').value.trim() || '💬',
      cat:      catVal,
      lvl:      document.getElementById('ie-lvl').value,
      catLabel: catLabelMap[catVal] || catVal,
      msgs:     window._editMsgs,
      vocab:    ieCollectVocab(),
      grammar:  ieCollectGrammar(),
      mission:  ieCollectMission(),
    });
    var sb = getSupa();
    var { error } = await sb.from('conversations_data').update({
      data: updatedData, name: updatedData.name, ctx: updatedData.ctx, cat: updatedData.cat, lvl: updatedData.lvl,
    }).eq('id', rowId);
    if (error) throw error;
    var idx = CONVS.findIndex(function(x){ return x._id === rowId; });
    if (idx >= 0) CONVS[idx] = Object.assign({}, updatedData, {_id: rowId});
    window._currentConv = Object.assign({}, updatedData, {_id: rowId});
    document.getElementById('conv-inline-edit').remove();
    showConvToast('✅ Saved!');
    renderCards(activeCat, activeLvl);
    var newIdx = CONVS.findIndex(function(x){ return x._id === rowId; });
    if (newIdx >= 0) openDetail(newIdx);
  } catch(e) {
    errEl.textContent = e.message || String(e);
    errEl.style.display = 'block';
  }
}

function showConvToast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#0f172a;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:700;z-index:99999;font-family:inherit';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2500);
}


function closeInlineEdit() { var e = document.getElementById('conv-inline-edit'); if(e) e.remove(); }
</script>

<script>
(function(){
  function patchLabels(){
    document.querySelectorAll('.dp-cta-btn').forEach(function(btn){
      if (btn.textContent.indexOf('빈칸') !== -1) btn.textContent = '✏️ Blank Fill';
      if (btn.textContent.indexOf('순서') !== -1) btn.textContent = '🔀 Word Order';
    });
  }
  document.addEventListener('DOMContentLoaded', patchLabels);

  window.toggleSave = async function(btn) {
    var item = btn.closest('.dp-vocab-item');
    if (!item) return;
    var ko = (item.querySelector('.dp-vi-ko')||{}).textContent || '';
    var rom = (item.querySelector('.dp-vi-rom')||{}).textContent || '';
    var en = (item.querySelector('.dp-vi-en')||{}).textContent || '';
    btn.classList.toggle('saved');
    btn.textContent = btn.classList.contains('saved') ? '✓ Saved' : '+ Save';
    try {
      if (!window.getSupa) return;
      var sb = getSupa(); if (!sb) return;
      var sessionRes = await sb.auth.getSession();
      var user = sessionRes && sessionRes.data && sessionRes.data.session && sessionRes.data.session.user;
      if (!user) {
        var key = 'kh_saved_words_guest';
        var arr = JSON.parse(localStorage.getItem(key) || '[]');
        if (btn.classList.contains('saved')) {
          if (!arr.find(function(x){ return x.word_ko === ko; })) arr.push({ word_ko: ko, word_rom: rom, word_en: en });
        } else {
          arr = arr.filter(function(x){ return x.word_ko !== ko; });
        }
        localStorage.setItem(key, JSON.stringify(arr));
        return;
      }
      if (btn.classList.contains('saved')) {
        await sb.from('saved_words').upsert({ user_id: user.id, word_ko: ko, word_rom: rom, word_en: en }, { onConflict: 'user_id,word_ko' });
      } else {
        await sb.from('saved_words').delete().eq('user_id', user.id).eq('word_ko', ko);
      }
    } catch (e) { console.warn('save vocab failed', e); }
  };

  window.startOrderQuiz = function() {
    var c = window._currentConv;
    if (!c) return;
    var msgs = (c.msgs || []).slice(0, 10);
    if (!msgs.length) { alert('No conversation lines found.'); return; }
    var questions = [];
    msgs.forEach(function(msg) {
      var raw = (msg.txt || msg.text || '').trim();
      if (!raw) return;
      var sentence = raw.split(/[.!?]/)[0].trim();
      var words = sentence.split(/\s+/).filter(Boolean);
      if (words.length < 2 || words.length > 6) return;
      questions.push({ sentence: sentence, words: words, who: msg.who || msg.name || '' });
    });
    if (!questions.length) { alert('No usable sentence for word order quiz.'); return; }
    window._orderAttempt = 0;
    showQuizModal('order', questions.slice(0, 4), c.name || '');
  };

  window.renderOrderQ = function(q) {
    var shuffled = q.words.slice().sort(function(){ return Math.random() - .5; });
    q._shuffled = shuffled; q._selected = [];
    var html = '<div style="padding:24px 22px;">'
      + '<div style="font-size:13px;font-weight:800;color:#1d4ed8;margin-bottom:8px;">Word Order Quiz</div>'
      + (q.who ? '<div style="font-size:12px;color:#64748b;margin-bottom:14px;">Line from <b>' + q.who + '</b></div>' : '')
      + '<div style="font-size:13px;color:#64748b;line-height:1.65;margin-bottom:14px;">Tap the chunks in the correct Korean word order.</div>'
      + '<div id="order-answer" style="min-height:64px;border:2px dashed #cfe0ff;background:#f8fbff;border-radius:14px;padding:12px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;"></div>'
      + '<div id="order-bank" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;">';
    shuffled.forEach(function(word, i){
      html += '<button type="button" id="order-word-' + i + '" onclick="pickOrderWord(' + i + ')" style="padding:12px 14px;border-radius:14px;border:1.5px solid #dbe6f7;background:#fff;color:#0f172a;font-size:15px;font-weight:800;cursor:pointer;font-family:\'Noto Sans KR\',sans-serif;">' + word + '</button>';
    });
    html += '</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;">'
      + '<button onclick="resetOrderSelection()" style="padding:11px 16px;border-radius:12px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;">Reset</button>'
      + '<button onclick="checkOrder()" style="padding:11px 18px;border-radius:12px;background:#2563eb;color:#fff;border:none;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;">Check answer</button>'
      + '</div></div>';
    return html;
  };

  window.pickOrderWord = function(idx){
    var q = _quizQuestions[_quizCurrent]; if (!q) return;
    q._selected = q._selected || []; if (q._selected.indexOf(idx) !== -1) return;
    q._selected.push(idx); renderOrderSelection();
  };
  window.renderOrderSelection = function(){
    var q = _quizQuestions[_quizCurrent]; if (!q) return;
    var answerEl = document.getElementById('order-answer'); if (!answerEl) return;
    var selectedWords = (q._selected || []).map(function(i){ return q._shuffled[i]; });
    answerEl.innerHTML = selectedWords.length ? selectedWords.map(function(word){ return '<span style="display:inline-flex;padding:9px 12px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:14px;font-weight:800;">' + word + '</span>'; }).join('') : '<div style="font-size:13px;color:#94a3b8;">Your answer will appear here.</div>';
    (q._shuffled || []).forEach(function(_, i){
      var btn = document.getElementById('order-word-' + i); if (!btn) return;
      var used = (q._selected || []).indexOf(i) !== -1; btn.disabled = used; btn.style.opacity = used ? '.45' : '1';
    });
  };
  window.resetOrderSelection = function(){ var q = _quizQuestions[_quizCurrent]; if (!q) return; q._selected = []; renderOrderSelection(); };
  window.analyzeWordUnit = function(word){
    word = String(word || '').trim();
    if (/(은|는)$/.test(word)) return { text: word, role: 'topic' };
    if (/(이|가)$/.test(word)) return { text: word, role: 'subject' };
    if (/(을|를)$/.test(word)) return { text: word, role: 'object' };
    if (/(에|에서|에게|한테|로|으로|부터|까지)$/.test(word)) return { text: word, role: 'adverbial' };
    if (/(다|요|니다|했다|한다|해요|했어요|이에요|예요|입니다)$/.test(word)) return { text: word, role: 'predicate' };
    return { text: word, role: 'other' };
  };
  window.detectOrderMistakes = function(correctWords, answerWords){
    var mistakes = []; if (!answerWords.length) return [{ code: 'empty_answer' }];
    var answerAnalysis = answerWords.map(analyzeWordUnit);
    var predIdx = answerAnalysis.findIndex(function(x){ return x.role === 'predicate'; });
    if (predIdx !== -1 && predIdx !== answerAnalysis.length - 1) mistakes.push({ code: 'predicate_not_final' });
    answerAnalysis.forEach(function(unit, idx){
      if (unit.role === 'object' && predIdx !== -1 && idx > predIdx) mistakes.push({ code: 'object_after_predicate', word: unit.text });
      if ((unit.role === 'topic' || unit.role === 'subject') && idx > 0) mistakes.push({ code: 'topic_subject_late', word: unit.text });
      if (unit.role === 'adverbial' && predIdx !== -1 && idx > predIdx) mistakes.push({ code: 'adverbial_after_predicate', word: unit.text });
    });
    if (!mistakes.length && answerWords.join(' ') !== correctWords.join(' ')) mistakes.push({ code: 'far_from_expected' });
    return mistakes;
  };
  window.buildAttemptSpecificExplanation = function(correctWords, answerWords){
    window._orderAttempt = (window._orderAttempt || 0) + 1;
    var mistakes = detectOrderMistakes(correctWords, answerWords), lines = [];
    mistakes.forEach(function(m){
      if (m.code === 'empty_answer') lines.push('You need to place the chunks in an order before checking.');
      if (m.code === 'predicate_not_final') lines.push('In Korean, the predicate usually comes at the end of the sentence.');
      if (m.code === 'object_after_predicate') lines.push((m.word || 'The object') + ' has an object marker, so it should usually come before the predicate.');
      if (m.code === 'topic_subject_late') lines.push((m.word || 'The topic/subject') + ' usually appears earlier in the sentence.');
      if (m.code === 'adverbial_after_predicate') lines.push((m.word || 'That chunk') + ' works better before the predicate in normal Korean word order.');
      if (m.code === 'far_from_expected') lines.push('A more natural Korean order is topic/subject → object/adverbial → predicate.');
    });
    if (window._orderAttempt >= 2) lines.push('Basic pattern: subject or topic first, object in the middle, and the verb or adjective at the end.');
    return lines.filter(function(v,i,a){ return a.indexOf(v)===i; }).slice(0,2).join('<br>');
  };

  var origShowQuizModal = window.showQuizModal;
  window.showQuizModal = function(mode, questions, title){
    if (mode === 'order') window._orderAttempt = 0;
    origShowQuizModal(mode, questions, title);
    if (mode === 'order') setTimeout(function(){ try { renderOrderSelection(); } catch(e){} }, 0);
  };

  window.checkOrder = function() {
    var q = _quizQuestions[_quizCurrent]; if (!q) return;
    var answer = (q._selected || []).map(function(i){ return q._shuffled[i]; });
    var correctWords = q.words || [];
    var correct = answer.join(' ') === correctWords.join(' ');
    if (correct) _quizScore++;
    var explanation = correct ? '' : buildAttemptSpecificExplanation(correctWords, answer);
    showFeedback(correct, null, nextQuizQuestion, explanation, correctWords.join(' '));
  };

  window.showFeedback = function(correct, answer, next, explanation, correctSentence) {
    var overlay = document.getElementById('quiz-overlay');
    var inner = overlay.querySelector('div'); if (!inner) return;
    var fb = document.createElement('div');
    fb.style.cssText = 'padding:20px 22px;background:' + (correct?'#f0fdf4':'#fef2f2') + ';border-top:1px solid ' + (correct?'#bbf7d0':'#fecaca') + ';text-align:center;';
    fb.innerHTML = '<div style="font-size:28px;">' + (correct?'🎉':'😅') + '</div>'
      + '<div style="font-size:16px;font-weight:800;color:' + (correct?'#15803d':'#b91c1c') + ';margin:6px 0">' + (correct?'Correct!':'Not quite.') + '</div>'
      + (answer && !correct ? '<div style="font-size:14px;color:#64748b;">Answer: <b>' + answer + '</b></div>' : '')
      + (correctSentence && !correct ? '<div style="font-size:14px;color:#475569;margin-top:6px;">Correct order: <b>' + correctSentence + '</b></div>' : '')
      + (explanation && !correct ? '<div style="margin-top:12px;padding:12px 14px;background:#fff;border:1px solid #fecaca;border-radius:12px;font-size:13px;line-height:1.7;color:#7f1d1d;text-align:left;"><b style="display:block;margin-bottom:4px;">Why this order works</b>' + explanation + '</div>' : '')
      + '<button onclick="nextQuizQuestion()" style="margin-top:14px;padding:10px 24px;border-radius:12px;background:#2563eb;color:#fff;border:none;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;">Next</button>';
    inner.querySelectorAll('button:not([onclick="closeQuiz()"])').forEach(function(b){ b.disabled=true; b.style.opacity='.5'; });
    inner.appendChild(fb);
  };

  window.showQuizResult = function() {
    var overlay = document.getElementById('quiz-overlay');
    var pct = Math.round(_quizScore / _quizTotal * 100);
    var emoji = pct >= 80 ? '🏆' : pct >= 60 ? '👍' : '📚';

    // 데일리 미션 퀴즈 카운트
    if (typeof dmTrackQuiz === 'function') dmTrackQuiz();
    if (supaUser && typeof getSupa === 'function') {
      try {
        var _sb = getSupa();
        var _s = window._currentStory;
        if (_sb && _s) {
          _sb.rpc('log_quiz_result', {
            p_user_id:      supaUser.id,
            p_quiz_type:    'story_blank',
            p_content_type: 'story',
            p_content_id:   String(_s.id || ''),
            p_is_correct:   pct >= 60
          }).catch(function(){});
          // 퀴즈까지 풀었으면 completed=true
          _sb.rpc('log_read_event', {
            p_user_id:      supaUser.id,
            p_content_type: 'story',
            p_content_id:   String(_s.id || ''),
            p_title:        _s.title || '',
            p_level:        _s.lvl   || '',
            p_category:     _s.mood  || '',
            p_completed:    true
          }).catch(function(){});
        }
      } catch(e) {}
    }
    overlay.innerHTML = '<div style="background:#fff;border-radius:24px;max-width:400px;width:100%;padding:40px 32px;text-align:center;box-shadow:0 32px 80px rgba(15,23,42,.25);">'
      + '<div style="font-size:56px;margin-bottom:12px">' + emoji + '</div>'
      + '<div style="font-size:24px;font-weight:900;color:#0f172a;margin-bottom:6px">' + _quizScore + ' / ' + _quizTotal + ' correct</div>'
      + '<div style="font-size:15px;color:#64748b;margin-bottom:24px">' + (pct>=80?'Excellent work. You understood the conversation well.':pct>=60?'Nice work. A bit more practice will help.':'Read the conversation again and try one more time 💪') + '</div>'
      + '<div style="display:flex;gap:10px;justify-content:center;">'
      + '<button onclick="closeQuiz()" style="padding:12px 20px;border-radius:12px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">Close</button>'
      + '<button onclick="retryQuiz()" style="padding:12px 20px;border-radius:12px;background:#2563eb;color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">Try again</button>'
      + '</div></div>';
  };
})();
</script>
