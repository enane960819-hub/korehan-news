<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KoreHan Conversations</title>
<style>
body{
  font-family:Arial, sans-serif;
  background:#f4f6fb;
  margin:0;
  padding:40px;
}
.container{
  max-width:700px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.word{
  display:inline-block;
  padding:10px 14px;
  margin:6px;
  background:#e8eefc;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  user-select:none;
}
.word.used{
  opacity:.35;
}
#answer{
  min-height:60px;
  margin-top:20px;
  padding:14px;
  border:2px dashed #cdd8f2;
  border-radius:10px;
  background:#fbfcff;
  font-weight:bold;
}
#result{
  margin-top:20px;
  font-weight:bold;
}
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}
button{
  padding:10px 16px;
  border:none;
  border-radius:8px;
  background:#2a5db4;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button.secondary{
  background:#e7eefb;
  color:#23457f;
}
</style>
</head>
<body>

<div class="container">
  <h2>Arrange the Korean sentence</h2>
  <p>Tap the shuffled word blocks in the correct order.</p>

  <div id="words"></div>

  <div id="answer">Your answer will appear here.</div>

  <div class="actions">
    <button onclick="check()">Check Answer</button>
    <button class="secondary" onclick="resetQuiz()">Reset</button>
  </div>

  <div id="result"></div>
</div>

<script>
const correct = ["나는","사과를","좋아한다"];
let shuffled = [];
let user = [];

const wordsEl = document.getElementById("words");
const answerEl = document.getElementById("answer");
const resultEl = document.getElementById("result");

function shuffleArray(arr){
  return [...arr].sort(() => Math.random() - 0.5);
}

function renderWords(){
  wordsEl.innerHTML = "";
  shuffled.forEach((word, index) => {
    const el = document.createElement("div");
    el.className = "word" + (user.includes(index) ? " used" : "");
    el.innerText = word;
    el.onclick = () => addWord(index);
    wordsEl.appendChild(el);
  });
}

function addWord(index){
  if(user.includes(index)) return;
  user.push(index);
  renderAnswer();
  renderWords();
}

function renderAnswer(){
  if(!user.length){
    answerEl.innerText = "Your answer will appear here.";
    return;
  }
  answerEl.innerText = user.map(i => shuffled[i]).join(" ");
}

function resetQuiz(){
  shuffled = shuffleArray(correct);
  user = [];
  resultEl.innerText = "";
  renderWords();
  renderAnswer();
}

function check(){
  const answer = user.map(i => shuffled[i]);
  if(answer.join(" ") === correct.join(" ")){
    resultEl.innerText = "Correct!";
    resultEl.style.color = "#157347";
  } else {
    resultEl.innerText = "Wrong order. Korean structure: Subject + Object + Verb";
    resultEl.style.color = "#b42318";
  }
}

resetQuiz();
</script>

</body>
</html>
