<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversations — KoreHan News</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@400;600;700&family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="korehan-shared.css">
<style>
.conv-hero{background:linear-gradient(160deg,#1d4ed8 0%,#3b82f6 55%,#60a5fa 100%);padding:36px 0 80px;margin-bottom:-56px;}
.conv-hero-inner{max-width:1280px;margin:0 auto;padding:0 24px;}
.conv-hero-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.75);margin-bottom:10px;}
.conv-hero h1{font-family:'Playfair Display',serif;font-size:38px;font-weight:900;color:#fff;margin:0 0 10px;line-height:1.15;}
.conv-hero p{font-size:15px;color:rgba(255,255,255,.85);line-height:1.7;max-width:560px;margin:0;}
.conv-filter-bar{max-width:1280px;margin:0 auto;padding:20px 24px 28px;display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:2;}
.cf-pill{padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.3);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;}
.cf-pill.on,.cf-pill:hover{background:#fff;color:#1d4ed8;border-color:#fff;}
.cf-sep{flex-basis:100%;height:0;}
.conv-page-container{max-width:1280px;margin:0 auto;padding:0 24px 60px;}
.conv-cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.cc2{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;aspect-ratio:4/3;transition:transform .18s,box-shadow .18s;}
.cc2:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.2);}
.cc2-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
.cc2-overlay{position:absolute;inset:0;background:rgba(0,0,0,.38);}
.cc2-body{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center;}
.cc2-tags{display:flex;gap:5px;position:absolute;top:10px;left:10px;}
.cc2-tag{font-size:9px;font-weight:800;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em;}
.cc2-tag-cat{background:rgba(255,255,255,.18);color:#fff;}
.cc2-tag-lvl{color:#fff;}
.badge-b{background:rgba(34,197,94,.7);}
.badge-i{background:rgba(234,179,8,.65);}
.badge-a{background:rgba(239,68,68,.65);}
.cc2-title{font-size:16px;font-weight:900;color:#fff;line-height:1.35;text-shadow:0 2px 8px rgba(0,0,0,.5);max-width:90%;}

/* DETAIL OVERLAY */
.detail-overlay{position:fixed;inset:0;background:rgba(5,12,24,.72);z-index:5000;display:flex;align-items:center;justify-content:center;padding:20px 16px;overflow:hidden;}
.detail-overlay.hidden{display:none;}
.detail-panel{width:100%;max-width:1100px;height:90vh;background:#f8fafc;border-radius:28px;overflow:hidden;box-shadow:0 32px 80px rgba(5,12,24,.3);display:grid;grid-template-columns:1.2fr .85fr;animation:panelIn .22s cubic-bezier(.22,1,.36,1);}
@keyframes panelIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.dp-left{background:#fff;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.dp-left-head{background:linear-gradient(135deg,#1d4ed8 0%,#3b82f6 100%);padding:22px 24px 18px;position:relative;}
.dp-left-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.7);margin-bottom:6px;}
.dp-left-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:#fff;margin:0 0 4px;}
.dp-left-sub{font-size:13px;color:rgba(255,255,255,.75);}
.detail-close{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:inherit;line-height:1;}
.detail-close:hover{background:rgba(255,255,255,.28);}
.dp-pills{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px 12px;border-bottom:1px solid #f0f4fa;}
.dp-pill{font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;}
.dp-pill-blue{background:#eff6ff;color:#1d4ed8;}
.dp-pill-gray{background:#f1f5f9;color:#475569;}
.dp-pill-green{background:#dcfce7;color:#15803d;}
.dp-pill-pink{background:#fce7f3;color:#be185d;}
.dp-pill-amber{background:#fef9c3;color:#92400e;}
.dp-chat-area{flex:1;min-height:0;padding:20px 24px 80px;background:linear-gradient(180deg,#f8fbff 0%,#f8fafc 100%);overflow-y:auto;overscroll-behavior:contain;}
.dp-date-sep{text-align:center;margin-bottom:18px;}
.dp-date-sep span{display:inline-block;padding:6px 14px;border-radius:999px;background:#e2e8f0;color:#64748b;font-size:11px;font-weight:700;}
.dp-msg-row{display:flex;margin-bottom:12px;align-items:flex-end;gap:10px;}
.dp-msg-row.left{justify-content:flex-start;}
.dp-msg-row.right{justify-content:flex-end;}
.dp-avatar{width:36px;height:36px;border-radius:12px;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:2px solid #bfdbfe;}
.dp-bubble-group{max-width:74%;}
.dp-who{font-size:11px;font-weight:700;color:#64748b;margin-bottom:5px;}
.dp-bubble{border-radius:20px;padding:11px 15px;font-size:14px;line-height:1.6;font-family:'Noto Sans KR',sans-serif;position:relative;}
.dp-msg-row.left .dp-bubble{background:#fff;color:#0f172a;border:1px solid #e2e8f0;border-bottom-left-radius:6px;box-shadow:0 4px 12px rgba(15,23,42,.06);}
.dp-msg-row.right .dp-bubble{background:#2563eb;color:#fff;border-bottom-right-radius:6px;}
/* bubble tails removed for cleaner look */
.dp-bubble{cursor:pointer;}
.dp-bubble-en{font-size:12px;color:#64748b;padding:4px 15px 0;line-height:1.5;display:none;}
.dp-msg-row.right .dp-bubble-en{text-align:right;color:rgba(255,255,255,.55);}
.dp-bubble-en.show{display:block;}
.dp-time{font-size:10px;color:#94a3b8;margin-top:4px;padding:0 3px;}
.dp-msg-row.right .dp-time{text-align:right;}
.dp-cast-bar{display:flex;flex-wrap:wrap;gap:10px;padding:14px 24px;border-bottom:1px solid #f0f4fa;background:#fff;}
.dp-cast-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#f8fafc;border:1px solid #e2e8f0;min-width:0;flex:1;}
.dp-cast-meta{min-width:0;}
.dp-cast-meta strong{display:block;font-size:12px;color:#0f172a;}
.dp-cast-meta span{display:block;font-size:11px;color:#64748b;line-height:1.4;}
.dp-inline-note{margin-top:7px;font-size:12px;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe;padding:7px 11px;border-radius:12px;line-height:1.5;}
.dp-narration{display:flex;align-items:center;gap:10px;padding:6px 4px;margin:2px 0;}
.dp-narration::before,.dp-narration::after{content:'';flex:1;height:1px;background:#e2e8f0;}
.dp-narration-text{font-style:italic;color:#64748b;font-size:13px;line-height:1.6;text-align:center;white-space:pre-wrap;padding:0 4px;}
.dp-cta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 24px 20px;background:#fff;border-top:1px solid #f0f4fa;}
.dp-cta-btn{padding:12px;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:all .15s;}
.dp-cta-primary{background:#2563eb;color:#fff;}
.dp-cta-primary:hover{background:#1d4ed8;}
.dp-cta-secondary{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;}
.dp-cta-secondary:hover{background:#dbeafe;}
.dp-right{background:#f8fafc;display:flex;flex-direction:column;border-left:1px solid #e8eef7;overflow-y:auto;overscroll-behavior:contain;}
.dp-right-head{padding:22px 24px 16px;border-bottom:1px solid #e8eef7;background:#fff;}
.dp-right-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#2563eb;margin-bottom:6px;}
.dp-right-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:#0f172a;margin:0;}
.dp-study-sections{padding:18px 20px 90px;display:flex;flex-direction:column;gap:16px;}
.dp-study-card{background:#fff;border-radius:16px;border:1px solid #e2e8f0;padding:20px;box-shadow:0 1px 4px rgba(15,23,42,.04);}
.dp-study-card-title{font-size:13px;font-weight:800;color:#0f172a;margin:0 0 14px;display:flex;align-items:center;gap:7px;letter-spacing:-.01em;}
.dp-study-card-title .admin-add-btn{margin-left:auto;font-size:11px;font-weight:700;color:#2563eb;background:none;border:1px solid #bfdbfe;border-radius:8px;padding:3px 10px;cursor:pointer;}
.dp-vocab-list{display:flex;flex-direction:column;gap:6px;}
.dp-vocab-item{display:grid;grid-template-columns:80px 70px 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:#fafbfc;transition:background .12s;}
.dp-vocab-item:hover{background:#f0f5ff;}
.dp-vi-ko{font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:800;color:#1e3a5f;}
.dp-vi-rom{font-size:11px;color:#94a3b8;font-style:italic;}
.dp-vi-en{font-size:13px;color:#475569;font-weight:500;}
.dp-vi-save{font-size:11px;font-weight:700;color:#2563eb;background:#eff6ff;border:none;border-radius:8px;padding:5px 12px;cursor:pointer;font-family:inherit;transition:all .12s;flex-shrink:0;}
.dp-vi-save:hover{background:#dbeafe;}
.dp-vi-save.saved{background:#2563eb;color:#fff;}
.dp-vi-del{font-size:11px;color:#94a3b8;background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:4px;}
.dp-vi-del:hover{color:#dc2626;background:#fee2e2;}
.dp-grammar-list{display:flex;flex-direction:column;gap:8px;}
.dp-grammar-item{padding:12px 14px;border-radius:10px;background:#fafbfc;font-size:13px;line-height:1.65;color:#334155;position:relative;}
.dp-grammar-item strong{color:#1e3a5f;font-weight:800;}
.dp-grammar-item .dp-gi-del{position:absolute;right:8px;top:8px;font-size:10px;color:#94a3b8;background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:4px;display:none;}
.dp-grammar-item:hover .dp-gi-del{display:block;}
/* Key Expressions */
.dp-keyexpr-card{background:linear-gradient(135deg,#fffbeb,#fef9c3);border:1px solid #fde68a;border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(146,64,14,.06);}
.dp-keyexpr-item{display:flex;align-items:baseline;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.7);margin-bottom:6px;border:1px solid rgba(253,230,138,.5);}
.dp-keyexpr-item:last-child{margin-bottom:0;}
.dp-keyexpr-ko{font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:800;color:#92400e;}
.dp-keyexpr-en{font-size:13px;color:#a16207;font-weight:500;flex:1;}
.dp-keyexpr-star{color:#f59e0b;font-size:14px;flex-shrink:0;}
.dp-grammar-item .dp-gi-del:hover{color:#dc2626;background:#fee2e2;}
.dp-keywords{display:flex;flex-wrap:wrap;gap:6px;}
.dp-keyword{display:inline-block;padding:6px 12px;border-radius:8px;background:#f0f5ff;font-size:12px;font-weight:600;color:#2563eb;cursor:pointer;transition:all .12s;border:none;}
.dp-keyword:hover{background:#dbeafe;}
/* Character Avatar */
.kh-char-av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;flex-shrink:0;overflow:hidden;}
.kh-char-av img{width:100%;height:100%;object-fit:cover;display:block;}
/* dp-who right alignment */
.dp-msg-row.right .dp-who{text-align:right;}
/* SVG icon in study card title */
.dp-study-card-title svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;}
/* card cast avatars */
.cc2-cast-avatars{display:flex;gap:4px;flex-shrink:0;}
.cc2-cast-avatars .kh-char-av{border:2px solid #fff;}
.cc2-cast-avatars .kh-char-av+.kh-char-av{margin-left:-8px;}
@media(max-width:900px){
  .conv-cards-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .detail-overlay{overflow-y:auto!important;align-items:flex-start!important;padding:10px!important;}
  .detail-panel{grid-template-columns:1fr;height:auto!important;max-height:none!important;border-radius:20px;}
  .dp-left{max-height:none!important;overflow:visible!important;}
  .dp-chat-area{max-height:none!important;overflow:visible!important;min-height:auto!important;}
  .dp-right{border-left:none;border-top:1px solid #e8eef7;overflow:visible!important;}
}
@media(max-width:600px){
  .conv-page-container{padding:0 10px 60px;}
  .conv-cards-grid{grid-template-columns:repeat(2,1fr);gap:8px;}
  .cc2{border-radius:12px;}
  .cc2-title{font-size:14px;}
  .conv-hero h1{font-size:28px}
  .detail-panel{border-radius:16px;}
}
</style>
</head>
<body>
<div id="kh-header"></div>
<div class="conv-hero">
  <div class="conv-hero-inner">
    <div class="conv-hero-eyebrow">KoreHan News</div>
    <h1>Real Korean Conversations</h1>
    <p>Read natural Korean dialogues between recurring characters. Each conversation covers real vocabulary, grammar patterns, and speech styles — all grounded in authentic contexts.</p>
  </div>
  <div class="conv-filter-bar" id="cat-pills">
    <button class="cf-pill on" data-cat="all">All</button>
    <button class="cf-pill" data-cat="everyday">Everyday</button>
    <button class="cf-pill" data-cat="work">Workplace</button>
    <button class="cf-pill" data-cat="friends">Friends</button>
    <button class="cf-pill" data-cat="family">Family</button>
    <button class="cf-pill" data-cat="dating">Dating</button>
  </div>
</div>
<div class="conv-page-container">
  <div class="conv-cards-grid" id="conv-cards-grid"></div>
</div>
<div class="detail-overlay hidden" id="detail-overlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-panel" id="detail-panel"></div>
</div>
<div id="kh-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="korehan-shared.js?v=20260404fix"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// KoreHan Character System
// Shared registry — same characters used in Articles, Conversations, Stories.
// Add a character entry when you have the image and profile ready.
// ═══════════════════════════════════════════════════════════════
var KH_CHARACTERS = {
  // Example (uncomment and fill when ready):
  // 'han': { slug:'han', name:'Han', name_ko:'한', role:'Journalist', img:'reporters/han.jpg', color:'#2255a4' },
  // 'soo': { slug:'soo', name:'Soo', name_ko:'수', role:'Office Worker', img:'reporters/soo.jpg', color:'#0891b2' },
};

var _CHAR_PALETTE = ['#2255a4','#0891b2','#059669','#b45309','#7c3aed','#c2410c','#1e7e5e','#1d4ed8'];
function _charInitialColor(name) {
  var h = 0;
  for (var i = 0; i < (name||'').length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return _CHAR_PALETTE[Math.abs(h) % _CHAR_PALETTE.length];
}

// 기본 기자 목록 (admin의 DEF_CHAR_REPORTERS와 동일 — DB 접근 없이 동작)
var _DEF_REPORTERS = [
  {id:'cr1',  name:'박서진', role:'사회부 기자',        image:'https://picsum.photos/seed/cr1/200/200',  color:'#2563eb'},
  {id:'cr2',  name:'김지원', role:'국제부 특파원',      image:'https://picsum.photos/seed/cr2/200/200',  color:'#7c3aed'},
  {id:'cr3',  name:'이민준', role:'경제부 에디터',      image:'https://picsum.photos/seed/cr3/200/200',  color:'#059669'},
  {id:'cr4',  name:'최유나', role:'문화부 기자',        image:'https://picsum.photos/seed/cr4/200/200',  color:'#db2777'},
  {id:'cr5',  name:'정우성', role:'정치부 선임기자',    image:'https://picsum.photos/seed/cr5/200/200',  color:'#dc2626'},
  {id:'cr6',  name:'한소희', role:'뷰티·트래블 에디터', image:'https://picsum.photos/seed/cr6/200/200',  color:'#0891b2'},
  {id:'cr7',  name:'오지훈', role:'스포츠부 기자',      image:'https://picsum.photos/seed/cr7/200/200',  color:'#ea580c'},
  {id:'cr8',  name:'신지은', role:'사회·환경 전문기자', image:'https://picsum.photos/seed/cr8/200/200',  color:'#16a34a'},
  {id:'cr9',  name:'강태양', role:'국제·외교 기자',     image:'https://picsum.photos/seed/cr9/200/200',  color:'#4338ca'},
  {id:'cr10', name:'류하늘', role:'문화·라이프 기자',   image:'https://picsum.photos/seed/cr10/200/200', color:'#c026d3'},
];

// 기자 캐릭터 맵 — 기본값으로 초기화, DB에서 최신 데이터로 덮어씀
var _reporterMap = {};
_DEF_REPORTERS.forEach(function(r){ _reporterMap[r.id] = r; });

async function _loadReporters() {
  var sb = getSupa();
  if (!sb) return;
  try {
    var res = await sb.from('character_reporters').select('id, data').order('updated_at', {ascending: true});
    if (!res.error && res.data && res.data.length) {
      res.data.forEach(function(row) {
        var r = row.data || row;
        if (r && r.id) _reporterMap[r.id] = r;
      });
    }
  } catch(e) {}
}
function _reporterFromMap(id) {
  var r = _reporterMap[id];
  if (!r) return null;
  return { slug: r.id, name: r.name, name_ko: r.name, role: r.role || '', img: r.image || null, color: r.color || _charInitialColor(r.name) };
}

// Returns { left, right } character objects for a conversation
function resolveConversationCast(c) {
  var d = c || {};
  // Support explicit slug fields stored on the conversation data
  var leftSlug  = d.cast_left_slug  || d.left_slug  || null;
  var rightSlug = d.cast_right_slug || d.right_slug || null;
  var leftChar  = (leftSlug  && (KH_CHARACTERS[leftSlug]  || _reporterFromMap(leftSlug)))  || null;
  var rightChar = (rightSlug && (KH_CHARACTERS[rightSlug] || _reporterFromMap(rightSlug))) || null;
  // Extract first speaker names from messages
  var msgs = d.msgs || [];
  var leftMsg  = msgs.find(function(m){ return m.s === 'l'; });
  var rightMsg = msgs.find(function(m){ return m.s === 'r' || m.s === 'right'; });
  var leftName  = (leftMsg  && (leftMsg.who  || leftMsg.name)) || 'A';
  var rightName = (rightMsg && (rightMsg.who || rightMsg.name)) || 'B';
  var left = leftChar || {
    slug: leftSlug || 'left',
    name: leftName, name_ko: leftName,
    role: 'Speaker A', img: null,
    color: _charInitialColor(leftName)
  };
  var right = rightChar || {
    slug: rightSlug || 'right',
    name: rightName, name_ko: rightName,
    role: 'Speaker B', img: null,
    color: _charInitialColor(rightName)
  };
  return { left: left, right: right };
}

// Renders a circular character avatar (image or initial fallback)
function renderCharacterAvatar(char, cls, size) {
  var sz  = size || 36;
  var nm  = (char && (char.name || char.name_ko)) || '?';
  var col = (char && char.color) || _charInitialColor(nm);
  var ini = nm.charAt(0).toUpperCase();
  var fs  = Math.round(sz * 0.38) + 'px';
  var base = 'class="kh-char-av' + (cls ? ' ' + cls : '') + '" '
    + 'style="width:' + sz + 'px;height:' + sz + 'px;background:' + col + ';font-size:' + fs + '"';
  if (char && char.img) {
    return '<div ' + base + '>'
      + '<img src="' + char.img + '" alt="' + escapeHtml(nm) + '" '
      + 'onerror="this.style.display=\'none\'">'
      + '<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:' + fs + '">' + ini + '</span>'
      + '</div>';
  }
  return '<div ' + base + '>' + ini + '</div>';
}

function characterDisplayName(char) {
  if (!char) return 'Character';
  return char.name || char.name_ko || 'Character';
}

function characterProfileUrl(slug) {
  return 'korehan-reporters.html' + (slug ? '#' + slug : '');
}

// ─── SVG Icon helpers ───────────────────────────────────────────
var _IC = {

var CONVS = [];  // DB에서 로드

const LVL_LABEL = {b:'Sprout',i:'Tree',a:'Forest'};
const LVL_CLS   = {b:'badge-b',i:'badge-i',a:'badge-a'};
const CAT_PILL  = {everyday:'dp-pill-blue',work:'dp-pill-gray',friends:'dp-pill-green',family:'dp-pill-amber',dating:'dp-pill-pink'};

function renderCards(catF, lvlF) {
  var grid = document.getElementById('conv-cards-grid');
  var list = CONVS.filter(function(c) {
    return (catF === 'all' || c.cat === catF) && (lvlF === 'all' || c.lvl === lvlF);
  });
  if (!list.length) {
    grid.innerHTML = CONVS.length === 0
      ? '<div style="grid-column:1/-1;text-align:center;padding:80px 20px"><div style="width:56px;height:56px;border-radius:16px;background:#eff6ff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">' + _IC.book + '</div><div style="font-size:17px;font-weight:800;color:#0f172a;margin-bottom:8px">No conversations yet</div><div style="font-size:13px;color:#64748b;max-width:340px;margin:0 auto;line-height:1.65">Conversations will appear here once they\'re added. Check back soon.</div></div>'
      : '<p style="color:#64748b;font-size:14px;grid-column:1/-1;padding:20px 0">No conversations in this category.</p>';
    return;
  }
  var CAT_GRAD = {
    everyday:'linear-gradient(135deg,#1e40af,#3b82f6)',
    work:'linear-gradient(135deg,#334155,#64748b)',
    friends:'linear-gradient(135deg,#065f46,#10b981)',
    family:'linear-gradient(135deg,#92400e,#f59e0b)',
    dating:'linear-gradient(135deg,#9d174d,#ec4899)'
  };
  var CAT_EN = {everyday:'Everyday',work:'Work',friends:'Friends',family:'Family',dating:'Dating'};
  grid.innerHTML = list.map(function(c) {
    var ri = CONVS.indexOf(c);
    var hasImg = c.thumb || c.image;
    var bgStyle = hasImg
      ? 'background-image:url('+escapeHtml(hasImg)+');'
      : 'background:'+(CAT_GRAD[c.cat] || CAT_GRAD.everyday)+';';
    var catLabel = CAT_EN[c.cat] || c.cat || '';
    var title = escapeHtml(c.ctx || c.name || '');
    return '<div class="cc2" onclick="openDetail('+ri+')">'
      +'<div class="cc2-bg" style="'+bgStyle+'"></div>'
      +'<div class="cc2-overlay"></div>'
      +'<div class="cc2-body">'
        +'<div class="cc2-tags">'
          +'<span class="cc2-tag cc2-tag-cat">'+catLabel+'</span>'
          +'<span class="cc2-tag '+LVL_CLS[c.lvl]+'">'+LVL_LABEL[c.lvl]+'</span>'
        +'</div>'
        +'<div class="cc2-title">'+title+'</div>'
      +'</div>'
    +'</div>';
  }).join('');
}

// Highlight key expressions in bubble text
function highlightKeyExprs(text, keyExprs) {
  if (!keyExprs || !keyExprs.length) return escapeHtml(text);
  var escaped = escapeHtml(text);
  keyExprs.forEach(function(e) {
    if (!e.ko) return;
    var re = new RegExp('(' + e.ko.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'g');
    escaped = escaped.replace(re, '<span style="background:rgba(251,191,36,.45);padding:1px 3px;border-radius:4px;font-weight:700;cursor:help" title="' + (e.en||'').replace(/"/g,'&quot;') + '">$1</span>');
  });
  return escaped;
}

function openDetail(idx) {
  var c = CONVS[idx];
  var cast = resolveConversationCast(c);
  window._currentConv = c;

  // ── 데일리 미션 + 읽기 기록 추적 ──────────────────────
  if (typeof dmTrackArticle === 'function') dmTrackArticle();
  if (supaUser && typeof getSupa === 'function') {
    try {
      var _sb = getSupa();
      if (_sb && c._id) {
        _sb.rpc('log_read_event', {
          p_user_id:      supaUser.id,
          p_content_type: 'conversation',
          p_content_id:   String(c._id),
          p_title:        c.name || '',
          p_level:        c.lvl  || '',
          p_category:     c.cat  || '',
          p_completed:    false
        }).catch(function(){});
      }
    } catch(e) {}
    if (typeof logActivity === 'function') {
      logActivity('read', { content_type:'conversation', content_id:String(c._id), content_title:c.name||'', metadata:{level:c.lvl||'',category:c.cat||''} });
    }
  }

  // 캐시에서 vocab/grammar 보강 (비동기, 완료되면 Study Notes 업데이트)
  if (typeof enrichFromCache === 'function' && c._id && (!c.vocab || !c.vocab.length)) {
    enrichFromCache('conversation', Object.assign({}, c, {id: c._id})).then(function(enriched) {
      // enriched.data에 있는 vocab/grammar를 c에 병합
      if (enriched && enriched.data) {
        if (enriched.data.vocab && !c.vocab.length) {
          c.vocab = enriched.data.vocab;
          c.grammar = enriched.data.grammar || [];
          c.mission = enriched.data.mission || [];
          window._currentConv = c;
          renderStudyNotes(c);
        }
      }
    }).catch(function(){});
  }
  var now = new Date();
  var h = now.getHours(), m = now.getMinutes();

  var msgs = c.msgs.map(function(msg, i) {
    var min = String((m + i) % 60).padStart(2,'0');
    var hr  = (h % 12) || 12;
    var ap  = h < 12 ? 'AM' : 'PM';
    var time = hr + ':' + min + ' ' + ap;
    var note = msg.note ? '<div class="dp-inline-note" style="display:flex;gap:6px;align-items:flex-start">' + _IC.key + '<span>'+escapeHtml(msg.note || '')+'</span></div>' : '';
    // 지문 (웹소설 스타일 나레이션)
    if (msg.s === 'n') {
      return '<div class="dp-narration"><span class="dp-narration-text">'+escapeHtml(msg.txt || '')+'</span></div>';
    }
    var enNote = msg.en || msg.note || '';
    var _keyExprs = c.key_expressions || [];
    if (msg.s === 'l') {
      return '<div class="dp-msg-row left">'
        + renderCharacterAvatar(cast.left, '', 36)
        +'<div class="dp-bubble-group">'
          +'<div class="dp-who">'+escapeHtml(msg.who || cast.left.name_ko || cast.left.name || '')+'</div>'
          +'<div class="dp-bubble" onclick="toggleBubbleEn(this)">'+highlightKeyExprs(msg.txt || '', _keyExprs)+'</div>'
          +(enNote ? '<div class="dp-bubble-en">'+escapeHtml(enNote)+'</div>' : '')
          +'<div class="dp-time">'+time+'</div>'
        +'</div></div>';
    } else {
      return '<div class="dp-msg-row right">'
        +'<div class="dp-bubble-group">'
          +'<div class="dp-who">'+escapeHtml(msg.who || cast.right.name_ko || cast.right.name || '')+'</div>'
          +'<div class="dp-bubble" onclick="toggleBubbleEn(this)">'+highlightKeyExprs(msg.txt || '', _keyExprs)+'</div>'
          +(enNote ? '<div class="dp-bubble-en">'+escapeHtml(enNote)+'</div>' : '')
          +'<div class="dp-time">'+time+'</div>'
        +'</div>'
        + renderCharacterAvatar(cast.right, '', 36)
        +'</div>';
    }
  }).join('');

  var vocab = c.vocab.map(function(v) {
    var _sk=(v.ko||'').split('"').join('&quot;'),_sr=(v.rom||'').split('"').join('&quot;'),_se=(v.en||'').split('"').join('&quot;');
    return '<div class="dp-vocab-item" data-ko="'+_sk+'" data-rom="'+_sr+'" data-en="'+_se+'">'
      +'<span class="dp-vi-ko">'+v.ko+'</span>'
      +'<span class="dp-vi-rom">'+v.rom+'</span>'
      +'<span class="dp-vi-en">'+v.en+'</span>'
      +'<button class="dp-vi-save" onclick="toggleSave(this)">+ Save</button>'
      +'</div>';
  }).join('');

  var grammar = (c.grammar||[]).map(function(g) {
    return '<div class="dp-grammar-item"><strong>'+escapeHtml(g.point || '')+'</strong> — '+escapeHtml(g.ex || g.en || '')+'</div>';
  }).join('');

  var mission = (c.mission||[]).map(function(m) {
    return '<div class="dp-grammar-item">'+_IC.target+' '+escapeHtml(m.task||m||'')+'</div>';
  }).join('');

  var keywords = c.vocab.map(function(v) {
    return '<span class="dp-keyword">'+escapeHtml(v.ko || '')+'</span>';
  }).join('');

  var initKeyExprs = (c.key_expressions||[]).map(function(e){
    return '<div class="dp-keyexpr-item"><span class="dp-keyexpr-star">⭐</span><span class="dp-keyexpr-ko">'+escapeHtml(e.ko||'')+'</span><span class="dp-keyexpr-en">'+escapeHtml(e.en||'')+'</span></div>';
  }).join('');
  var initKeyExprCard = initKeyExprs ? '<div class="dp-keyexpr-card"><div class="dp-study-card-title" style="color:#92400e">⭐ Key Expressions</div>'+initKeyExprs+'</div>' : '';

  var pills = '<span class="dp-pill dp-pill-blue">'+LVL_LABEL[c.lvl]+'</span>'
    +'<span class="dp-pill '+(CAT_PILL[c.cat]||'dp-pill-gray')+'">'+c.catLabel+'</span>'
    +(c.topic ? '<span class="dp-pill dp-pill-gray">'+c.topic+'</span>' : '');

  document.getElementById('detail-panel').innerHTML =
    '<div class="dp-left">'
      +'<div class="dp-left-head">'
        +'<button class="detail-close" onclick="closeDetail()">✕</button>'
        +'<div class="dp-left-eyebrow">Conversation</div>'
        +'<div class="dp-left-title">'+escapeHtml(c.name || '')+'</div>'
        +'<div class="dp-left-sub">'+escapeHtml(c.ctx || '')+'</div>'
      +'</div>'
      +'<div class="dp-cast-bar">'
        +'<a class="dp-cast-link" href="'+characterProfileUrl(cast.left.slug)+'">'
          + renderCharacterAvatar(cast.left, 'kh-character-avatar', 38)
          +'<div class="dp-cast-meta"><strong>'+characterDisplayName(cast.left)+'</strong><span>'+escapeHtml(cast.left.role||'')+'</span></div>'
        +'</a>'
        +'<a class="dp-cast-link" href="'+characterProfileUrl(cast.right.slug)+'">'
          + renderCharacterAvatar(cast.right, 'kh-character-avatar', 38)
          +'<div class="dp-cast-meta"><strong>'+characterDisplayName(cast.right)+'</strong><span>'+escapeHtml(cast.right.role||'')+'</span></div>'
        +'</a>'
      +'</div>'
      +'<div class="dp-pills">'+pills+'</div>'
      +'<div class="dp-chat-area">'
        +'<div class="dp-date-sep"><span>Today</span></div>'
        +msgs
      +'</div>'
      +'<div class="dp-cta-row">'
        +'<button class="dp-cta-btn dp-cta-secondary" onclick="closeDetail()" style="display:flex;align-items:center;justify-content:center;gap:6px">← Back</button>'
        +(window._isAdmin ? '<button class="dp-cta-btn" style="background:#f1f5f9;color:#334155;display:flex;align-items:center;justify-content:center;gap:5px" onclick="editCurrentConv()">'+_IC.pen+' Edit</button>'
                          + '<button class="dp-cta-btn" style="background:#fee2e2;color:#b91c1c" onclick="deleteCurrentConv()">Delete</button>' : '')
        +'<!-- Word Order & Blank Fill removed — studied in Study Room instead -->'
      +'</div>'
    +'</div>'
    +'<div class="dp-right">'
      +'<div class="dp-right-head"><div class="dp-right-label">Study Notes</div><div class="dp-right-title">Conversation Breakdown</div></div>'
      +'<div class="dp-study-sections" id="dp-study-sections">'
        +initKeyExprCard
        +'<div class="dp-study-card"><div class="dp-study-card-title">'+_IC.book+' Key Vocabulary</div><div class="dp-vocab-list">'+vocab+'</div></div>'
        +(grammar ? '<div class="dp-study-card"><div class="dp-study-card-title">'+_IC.pen+' Grammar Points</div><div class="dp-grammar-list">'+grammar+'</div></div>' : '')
        +(mission ? '<div class="dp-study-card"><div class="dp-study-card-title">'+_IC.target+' Practice Mission</div><div class="dp-grammar-list">'+mission+'</div></div>' : '')
      +'</div>'
    +'</div>';

  document.getElementById('detail-overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  document.documentElement.style.overflow = 'hidden';

  // 저장된 단어 상태 복원 (비동기)
  restoreSaveButtons('detail-overlay');
}

// 캐시 enrichment 후 Study Notes만 업데이트
function renderStudyNotes(c) {
  var el = document.getElementById('dp-study-sections');
  if (!el) return;
  var isAdm = window._isAdmin;
  var vocab = (c.vocab||[]).map(function(v, vi) {
    var _sk=(v.ko||'').split('"').join('&quot;'),_sr=(v.rom||'').split('"').join('&quot;'),_se=(v.en||'').split('"').join('&quot;');
    return '<div class="dp-vocab-item" data-ko="'+_sk+'" data-rom="'+_sr+'" data-en="'+_se+'">'
      +'<span class="dp-vi-ko">'+v.ko+'</span>'
      +'<span class="dp-vi-rom">'+v.rom+'</span>'
      +'<span class="dp-vi-en">'+v.en+'</span>'
      +'<button class="dp-vi-save" onclick="toggleSave(this)">+ Save</button>'
      +(isAdm ? '<button class="dp-vi-del" onclick="convDelVocab('+vi+')" title="삭제">✕</button>' : '')
      +'</div>';
  }).join('');
  var grammar = (c.grammar||[]).map(function(g, gi) {
    return '<div class="dp-grammar-item"><strong>'+escapeHtml(g.point||'')+'</strong> — '+escapeHtml(g.ex||g.en||'')
      +(isAdm ? '<button class="dp-gi-del" onclick="convDelGrammar('+gi+')" title="삭제">✕</button>' : '')
      +'</div>';
  }).join('');
  var keywords = (c.vocab||[]).map(function(v){ return '<span class="dp-keyword">'+escapeHtml(v.ko || '')+'</span>'; }).join('');
  var mission = (c.mission||[]).map(function(m){ return '<div class="dp-grammar-item">'+_IC.target+' '+escapeHtml(m.task||m||'')+'</div>'; }).join('');
  var addVocabBtn = isAdm ? '<button class="admin-add-btn" onclick="convAddVocab()">+ 단어 추가</button>' : '';
  var addGrammarBtn = isAdm ? '<button class="admin-add-btn" onclick="convAddGrammar()">+ 문법 추가</button>' : '';
  // Key Expressions
  var keyExprs = c.key_expressions || [];
  var keyExprHtml = keyExprs.length ? keyExprs.map(function(e){
    return '<div class="dp-keyexpr-item">'
      +'<span class="dp-keyexpr-star">⭐</span>'
      +'<span class="dp-keyexpr-ko">'+escapeHtml(e.ko||'')+'</span>'
      +'<span class="dp-keyexpr-en">'+escapeHtml(e.en||'')+'</span>'
      +'</div>';
  }).join('') : '';

  el.innerHTML =
    (keyExprHtml ? '<div class="dp-keyexpr-card"><div class="dp-study-card-title" style="color:#92400e">⭐ Key Expressions</div>'+keyExprHtml+'</div>' : '')
    +'<div class="dp-study-card"><div class="dp-study-card-title">'+_IC.book+' Key Vocabulary'+addVocabBtn+'</div><div class="dp-vocab-list" id="dp-vocab-list">'+(vocab||'<span style="color:#94a3b8;font-size:13px">No vocabulary data</span>')+'</div></div>'
    +(grammar||isAdm ? '<div class="dp-study-card"><div class="dp-study-card-title">'+_IC.pen+' Grammar Points'+addGrammarBtn+'</div><div class="dp-grammar-list" id="dp-grammar-list">'+(grammar||'')+'</div></div>' : '')
    +(mission ? '<div class="dp-study-card"><div class="dp-study-card-title">'+_IC.target+' Practice Mission</div><div class="dp-grammar-list">'+mission+'</div></div>' : '')
    +'<div class="dp-study-card"><div class="dp-study-card-title">🎧 Listening Quiz</div><div id="dp-listening-quiz"><button onclick="startConvListeningQuiz()" style="width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Start Listening Quiz</button></div></div>'
    +'<div style="height:80px"></div>';
}

// ── Bubble click → toggle English translation ──
function toggleBubbleEn(bubbleEl) {
  var en = bubbleEl.parentElement.querySelector('.dp-bubble-en');
  if (en) { en.classList.toggle('show'); return; }
  // No pre-rendered translation — try AI translation
  var txt = bubbleEl.textContent.trim();
  if (!txt) return;
  var div = document.createElement('div');
  div.className = 'dp-bubble-en show';
  div.textContent = 'Translating...';
  bubbleEl.parentElement.insertBefore(div, bubbleEl.nextElementSibling);
  callClaude({feature:'conv-translate',model:'claude-haiku-4-5-20251001',max_tokens:100,messages:[{role:'user',content:'Translate this Korean to natural English. Return ONLY the translation, nothing else:\n'+txt}]})
    .then(function(r){ div.textContent=(r.content||[]).map(function(c){return c.text||'';}).join('').trim()||txt; })
    .catch(function(){ div.textContent='(Translation unavailable)'; });
}

// ── Admin: vocab/grammar CRUD ──
function _convSaveData() {
  var c = window._currentConv; if (!c || !c._id) return;
  var sb = getSupa(); if (!sb) return;
  // conversations_data stores {data: {vocab, grammar, msgs, ...}} as JSONB
  var payload = {data: {name:c.name, ctx:c.ctx, cat:c.cat, lvl:c.lvl, avi:c.avi, thumb:c.thumb||null, msgs:c.msgs, vocab:c.vocab, grammar:c.grammar, mission:c.mission, cast_left_slug:c.cast_left_slug, cast_right_slug:c.cast_right_slug, key_expressions:c.key_expressions||[]}};
  sb.from('conversations_data').update(payload).eq('id',c._id)
    .then(function(r){ if(r.error) console.warn('conv save:',r.error.message); else if(typeof toast==='function') toast('Saved'); });
}
function convDelVocab(idx) {
  var c = window._currentConv; if (!c) return;
  c.vocab.splice(idx,1); renderStudyNotes(c); _convSaveData();
}
function convDelGrammar(idx) {
  var c = window._currentConv; if (!c) return;
  c.grammar.splice(idx,1); renderStudyNotes(c); _convSaveData();
}
function convAddVocab() {
  var ko = prompt('Korean word:'); if (!ko) return;
  var rom = prompt('Romanization (optional):') || '';
  var en = prompt('영어 뜻:') || '';
  var c = window._currentConv; if (!c) return;
  if (!c.vocab) c.vocab = [];
  c.vocab.push({ko:ko,rom:rom,en:en}); renderStudyNotes(c); _convSaveData();
}
function convAddGrammar() {
  var point = prompt('Grammar point (e.g. -(으)ㄹ까?):'); if (!point) return;
  var ex = prompt('설명 + 예문:') || '';
  var c = window._currentConv; if (!c) return;
  if (!c.grammar) c.grammar = [];
  c.grammar.push({point:point,ex:ex}); renderStudyNotes(c); _convSaveData();
}

// ── Listening Quiz for Conversations ──
function startConvListeningQuiz() {
  var c = window._currentConv;
  if (!c || !c.vocab || !c.vocab.length) { toast('No vocab data for quiz'); return; }
  var el = document.getElementById('dp-listening-quiz');
  if (!el) return;
  var items = c.vocab.slice(0,5);
  var qi = 0;
  function renderQ() {
    if (qi >= items.length) {
      el.innerHTML = '<div style="text-align:center;padding:16px"><div style="font-size:20px;font-weight:800;color:#16a34a;margin-bottom:6px">Quiz Complete!</div><div style="font-size:13px;color:#64748b">Great job practicing your listening!</div></div>';
      return;
    }
    var v = items[qi];
    var opts = items.map(function(x){return x.en;}).sort(function(){return Math.random()-.5;}).slice(0,3);
    if (opts.indexOf(v.en)<0) opts[Math.floor(Math.random()*3)] = v.en;
    el.innerHTML = '<div style="text-align:center;margin-bottom:12px"><div style="font-size:12px;color:#64748b;margin-bottom:8px">Listen and choose the correct meaning ('+(qi+1)+'/'+items.length+')</div>'
      +'<button onclick="if(typeof ttsSpeak===\'function\')ttsSpeak(\''+v.ko.replace(/'/g,"\\'")+'\')" style="padding:12px 24px;background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:12px;font-size:16px;cursor:pointer;font-family:inherit">🔊 Play</button></div>'
      +'<div style="display:flex;flex-direction:column;gap:6px">'+opts.map(function(o){
        return '<button onclick="checkListenAns(this,\''+o.replace(/'/g,"\\'")+'\',\''+v.en.replace(/'/g,"\\'")+'\','+qi+')" style="padding:10px 14px;background:#fafbfc;border:1px solid #e2e8f0;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;text-align:left">'+o+'</button>';
      }).join('')+'</div>';
  }
  window.checkListenAns = function(btn, picked, correct, idx) {
    if (picked===correct) { btn.style.background='#dcfce7'; btn.style.borderColor='#22c55e'; btn.style.fontWeight='700'; }

// ── BLANK FILL QUIZ ──────────────────────────────────────────
function startBlankQuiz() {
  var c = window._currentConv;
  if (!c) return;
  var msgs = (c.msgs || []);
  if (!msgs.length) { alert('No dialogue content found'); return; }

  var vocab = (c.vocab || []).filter(function(v){ return v.ko && v.ko.length > 1; });
  if (!vocab.length) { alert('No vocabulary data available'); return; }

  var questions = msgs.slice(0, 6).map(function(msg) {
    var text = msg.txt || msg.text || '';
    var used = vocab.find(function(v){ return text.includes(v.ko); });
    if (!used) return null;
    return { original: text, word: used.ko, en: used.en, who: msg.who||msg.name||'' };
  }).filter(Boolean).slice(0, 4);

  if (!questions.length) {
    // 단어가 대화에 없으면 단순 vocab 빈칸
    questions = vocab.slice(0, 4).map(function(v) {
      return { original: 'What does this mean? → ' + v.en, word: v.ko, en: v.en, who: '' };
    });
  }

  showQuizModal('blank', questions, c.name || '');
}

// ── ORDER QUIZ ────────────────────────────────────────────────
function startOrderQuiz() {
  var c = window._currentConv;
  if (!c) return;
  var msgs = (c.msgs || []).slice(0, 6);
  if (msgs.length < 3) { alert('Conversation is too short for this quiz'); return; }

  var questions = [];
  // 3개씩 슬라이딩 윈도우로 순서 맞추기
  for (var i = 0; i + 2 < msgs.length; i++) {
    var group = msgs.slice(i, i+3);
    questions.push({ msgs: group });
    if (questions.length >= 3) break;
  }

  showQuizModal('order', questions, c.name || '');
}

var _quizAnswers = [];
var _quizScore = 0;
var _quizTotal = 0;
var _quizMode = '';
var _quizQuestions = [];
var _quizCurrent = 0;

function showQuizModal(mode, questions, title) {
  _quizMode = mode;
  _quizQuestions = questions;
  _quizCurrent = 0;
  _quizScore = 0;
  _quizTotal = questions.length;

function renderQuizQuestion() {
  var overlay = document.getElementById('quiz-overlay');
  var q = _quizQuestions[_quizCurrent];
  var progress = (_quizCurrent / _quizTotal * 100).toFixed(0);

  var inner = '<div style="background:#fff;border-radius:24px;max-width:520px;width:100%;box-shadow:0 32px 80px rgba(15,23,42,.25);overflow:hidden;">'
    + '<div style="background:linear-gradient(135deg,#1d4ed8,#3b82f6);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;">'
    + '<div style="color:#fff;">'
    + '<div style="font-size:11px;font-weight:700;opacity:.8;letter-spacing:.08em;text-transform:uppercase;">' + (_quizMode==='blank'?'Blank Fill':'Word Order') + '</div>'
    + '<div style="font-size:15px;font-weight:700;margin-top:2px">' + (_quizCurrent+1) + ' / ' + _quizTotal + '</div>'
    + '</div>'
    + '<button onclick="closeQuiz()" style="background:none;border:none;color:rgba(255,255,255,.7);font-size:22px;cursor:pointer;line-height:1;">✕</button>'
    + '</div>'
    + '<div style="height:4px;background:#e2e8f0;"><div style="height:4px;background:#3b82f6;width:'+progress+'%;transition:width .3s"></div></div>';

    inner += renderBlankQ(q);
  } else {
    inner += renderOrderQ(q);
  }

  inner += '</div>';

function renderBlankQ(q) {
  var displayed = q.original.replace(q.word, '<span style="background:#dbeafe;color:#1d4ed8;border-radius:6px;padding:2px 10px;font-weight:700;">＿＿＿</span>');
  // 보기 만들기: 정답 + 오답 2개
  var allVocab = (window._currentConv && window._currentConv.data && window._currentConv.data.vocab) || [];
  var wrongs = allVocab.filter(function(v){ return v.ko !== q.word; }).slice(0,2).map(function(v){ return v.ko; });
  if (wrongs.length < 2) wrongs = ['아니요','그렇지만'].slice(0, 2-wrongs.length).concat(wrongs);
  var choices = [q.word].concat(wrongs).sort(function(){ return Math.random()-.5; });

  return '<div style="padding:24px 22px;">'
    + (q.who ? '<div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:8px;">💬 ' + q.who + '</div>' : '')
    + '<div style="font-size:16px;line-height:1.8;background:#f8fafc;border-radius:12px;padding:14px 16px;margin-bottom:18px;font-family:\'Noto Sans KR\',sans-serif;">' + displayed + '</div>'
    + '<div style="font-size:12px;color:#94a3b8;margin-bottom:10px;">( ' + q.en + ' )  ← hint</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'
    + choices.map(function(ch){
        return '<button onclick="checkBlank(\''+ch.replace(/'/g,"\\'")+'\')" style="padding:12px;border-radius:12px;border:2px solid #e2e8f0;background:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:\'Noto Sans KR\',sans-serif;transition:all .12s;" onmouseover="this.style.borderColor=\'#3b82f6\'" onmouseout="this.style.borderColor=\'#e2e8f0\'">'
          + ch + '</button>';
      }).join('')
    + '</div></div>';
}

function renderOrderQ(q) {
  var shuffled = q.msgs.slice().sort(function(){ return Math.random()-.5; });
  var html = '<div style="padding:24px 22px;">'
    + '<div style="font-size:13px;font-weight:700;color:#1d4ed8;margin-bottom:14px;">Drag to arrange in the correct order 👆</div>'
    + '<div id="order-list" style="display:flex;flex-direction:column;gap:8px;">';

  shuffled.forEach(function(msg, i) {
    html += '<div class="order-item" data-index="' + i + '" data-txt="' + (msg.txt||msg.text||'').replace(/"/g,'&quot;') + '" '
      + 'style="background:#fff;border:2px solid #e2e8f0;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:grab;user-select:none;font-family:\'Noto Sans KR\',sans-serif;"'
      + ' draggable="true" ontouchstart="orderTouch(event,this)" ondragstart="orderDrag(event,this)" ondragover="event.preventDefault()" ondrop="orderDrop(event,this)">'
      + '<span style="font-size:18px;opacity:.4">⠿</span>'
      + '<div><div style="font-size:11px;font-weight:700;color:#64748b;">' + (msg.who||msg.name||'') + '</div>'
      + '<div style="font-size:14px;margin-top:2px;">' + (msg.txt||msg.text||'') + '</div></div>'
      + '</div>';
  });

  html += '</div>'
    + '<button onclick="checkOrder()" style="width:100%;margin-top:16px;padding:13px;border-radius:14px;background:#2563eb;color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;">Check →</button>'
    + '</div>';

  return html;
}

var _dragSrc = null;
function orderDrag(e, el) { _dragSrc = el; e.dataTransfer.effectAllowed = 'move'; }
function orderDrop(e, el) {
  e.preventDefault();
  if (_dragSrc === el) return;
  var list = document.getElementById('order-list');
  var items = Array.from(list.children);
  var srcIdx = items.indexOf(_dragSrc);
  var tgtIdx = items.indexOf(el);
  if (srcIdx < tgtIdx) list.insertBefore(_dragSrc, el.nextSibling);
  else list.insertBefore(_dragSrc, el);
}

// 터치 드래그 (모바일)
var _touchEl = null, _touchClone = null;
function orderTouch(e, el) {
  _touchEl = el;
  e.target.style.opacity = '.5';
  document.addEventListener('touchmove', onTouchMove, {passive:false});
  document.addEventListener('touchend', onTouchEnd, {once:true});
}
function onTouchMove(e) {
  e.preventDefault();
  var t = e.touches[0];
  var list = document.getElementById('order-list');
  if (!list) return;
  Array.from(list.children).forEach(function(item) {
    var r = item.getBoundingClientRect();
    if (t.clientY > r.top && t.clientY < r.bottom && item !== _touchEl) {
      var midY = r.top + r.height/2;
      if (t.clientY < midY) list.insertBefore(_touchEl, item);
      else list.insertBefore(_touchEl, item.nextSibling);
    }
  });
}
function onTouchEnd(e) {
  if (_touchEl) _touchEl.style.opacity = '1';
  document.removeEventListener('touchmove', onTouchMove);
}

function checkBlank(choice) {
  var q = _quizQuestions[_quizCurrent];
  var correct = choice === q.word;
  if (correct) _quizScore++;
  showFeedback(correct, q.word, nextQuizQuestion);
}

function checkOrder() {
  var q = _quizQuestions[_quizCurrent];
  var list = document.getElementById('order-list');
  if (!list) return;
  var items = Array.from(list.children);
  var correct = true;
  q.msgs.forEach(function(msg, i) {
    var itemTxt = items[i] && (items[i].dataset.txt || '');
    if (itemTxt !== (msg.txt || msg.text || '')) correct = false;
  });
  if (correct) _quizScore++;
  showFeedback(correct, null, nextQuizQuestion);
}

  var fb = document.createElement('div');

    + '<label style="background:#2563eb;color:#fff;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap">📁 Upload<input type="file" id="ie-thumb-file" accept="image/*" style="display:none" onchange="uploadConvThumb(this)"></label>'
    + '</div>'
    + (c.thumb ? '<img src="'+escapeHtml(c.thumb)+'" style="margin-top:6px;max-height:80px;border-radius:8px;object-fit:cover">' : '')
    + '</label>'
    + '<label style="font-size:12px;font-weight:700;color:#374151;display:block;margin-bottom:14px">💬 Dialogue (A: left / B: right)<textarea id="ie-msgs" rows="6" style="display:block;width:100%;margin-top:4px;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;box-sizing:border-box;resize:vertical">' + msgsText.replace(/</g,'&lt;') + '</textarea></label>'
    + '<div id="ie-error" style="background:#fee2e2;border-radius:8px;padding:10px;color:#b91c1c;font-size:13px;display:none;margin-bottom:12px"></div>'
    + '<div style="display:flex;gap:10px;justify-content:flex-end">'
    + '<button onclick="closeInlineEdit()" style="background:#f1f5f9;color:#334155;border:none;border-radius:10px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Cancel</button>'
    + '<button onclick="saveInlineEdit(' + (c._id || 'null') + ')" style="background:#2563eb;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">💾 Save</button>'
    + '</div>'
    + '</div>';

  document.body.appendChild(overlay);
}

function inpField(id, label, val) {
  return '<label style="font-size:12px;font-weight:700;color:#374151;display:block;margin-bottom:14px">' + label
    + '<input id="' + id + '" value="' + String(val).replace(/"/g,'&quot;') + '" style="display:block;width:100%;margin-top:4px;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;box-sizing:border-box">'
    + '</label>';
}
function selField(id, label, vals, labels, cur) {
  return '<label style="font-size:12px;font-weight:700;color:#374151;display:block">' + label
    + '<select id="' + id + '" style="display:block;width:100%;margin-top:4px;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;box-sizing:border-box">'
    + vals.map(function(v,i){ return '<option value="'+v+'"'+(cur===v?' selected':'')+'>'+labels[i]+'</option>'; }).join('')
    + '</select></label>';
}

async function saveInlineEdit(rowId) {
  var errEl = document.getElementById('ie-error');
  errEl.style.display = 'none';
  try {
    var catVal = document.getElementById('ie-cat').value;
    var catLabelMap = {everyday:'Everyday',work:'Workplace',friends:'Friends',family:'Family',dating:'Dating'};
    var msgsText = document.getElementById('ie-msgs').value.trim();
    var msgs = msgsText.split('\n').filter(function(l){ return l.trim(); }).map(function(line){
      var isB = /^B:/i.test(line.trim());
      return {s: isB?'r':'l', who: isB?'B':'A', txt: line.replace(/^[AB]:\s*/i,'').trim()};
    });
    if (!msgs.length) throw new Error('Please enter dialogue content');

    var c = window._currentConv;
    var thumbVal = document.getElementById('ie-thumb').value.trim();
    var updatedData = Object.assign({}, c, {
      name:     document.getElementById('ie-name').value.trim(),
      ctx:      document.getElementById('ie-ctx').value.trim(),
      avi:      document.getElementById('ie-avi').value.trim() || '💬',
      cat:      catVal,
      lvl:      document.getElementById('ie-lvl').value,
      catLabel: catLabelMap[catVal] || catVal,
      thumb:    thumbVal || null,
      msgs:     msgs,
    });

    var sb = getSupa();
    var { error } = await sb.from('conversations_data').update({
      data: updatedData,
      name: updatedData.name,
      ctx:  updatedData.ctx,
      cat:  updatedData.cat,
      lvl:  updatedData.lvl,
    }).eq('id', rowId);
    if (error) throw error;

    // 로컬 CONVS 업데이트
    var idx = CONVS.findIndex(function(x){ return x._id === rowId; });
    if (idx >= 0) CONVS[idx] = Object.assign({}, updatedData, {_id: rowId});
    window._currentConv = Object.assign({}, updatedData, {_id: rowId});

    document.getElementById('conv-inline-edit').remove();
    showConvToast('✅ Saved!');
    renderCards(activeCat, activeLvl);
  } catch(e) {
    errEl.textContent = e.message || String(e);
    errEl.style.display = 'block';
  }
}

async function uploadConvThumb(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var sb = getSupa();
  if (!sb) { alert('Supabase not ready'); return; }
  var ext = file.name.split('.').pop().toLowerCase();
  var path = 'conversations/' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
  try {
    var { error } = await sb.storage.from('images').upload(path, file, { cacheControl:'3600', upsert:false });
    if (error) throw error;
    var { data: urlData } = sb.storage.from('images').getPublicUrl(path);
    var url = urlData && urlData.publicUrl;
    if (url) {
      document.getElementById('ie-thumb').value = url;
      showConvToast('✅ Uploaded');
    }
  } catch(e) {
    alert('Upload failed: ' + e.message);
  }
}

function showConvToast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#0f172a;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:700;z-index:99999;font-family:inherit';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2500);
}


function closeInlineEdit() { var e = document.getElementById('conv-inline-edit'); if(e) e.remove(); }
</script>

<script>
(function(){
  window.toggleSave = async function(btn) {
    var item = btn.closest('.dp-vocab-item');
    if (!item) return;
    var ko = (item.querySelector('.dp-vi-ko')||{}).textContent || '';
    var rom = (item.querySelector('.dp-vi-rom')||{}).textContent || '';
    var en = (item.querySelector('.dp-vi-en')||{}).textContent || '';
    btn.classList.toggle('saved');
    btn.textContent = btn.classList.contains('saved') ? '✓ Saved' : '+ Save';
    try {
      if (!window.getSupa) return;
      var sb = getSupa(); if (!sb) return;
      var sessionRes = await sb.auth.getSession();
      var user = sessionRes && sessionRes.data && sessionRes.data.session && sessionRes.data.session.user;
      if (!user) {
        var key = 'kh_saved_words_guest';
        var arr = JSON.parse(localStorage.getItem(key) || '[]');
        if (btn.classList.contains('saved')) {
          if (!arr.find(function(x){ return x.word_ko === ko; })) arr.push({ word_ko: ko, word_rom: rom, word_en: en });
        } else {
          arr = arr.filter(function(x){ return x.word_ko !== ko; });
        }
        localStorage.setItem(key, JSON.stringify(arr));
        return;
      }
      if (btn.classList.contains('saved')) {
        await sb.from('saved_words').upsert({ user_id: user.id, word_ko: ko, word_rom: rom, word_en: en }, { onConflict: 'user_id,word_ko' });
      } else {
        await sb.from('saved_words').delete().eq('user_id', user.id).eq('word_ko', ko);
      }
    } catch (e) { console.warn('save vocab failed', e); }
  };

  window.startOrderQuiz = function() {
    var c = window._currentConv;
    if (!c) return;
    var msgs = (c.msgs || []).slice(0, 10);
    if (!msgs.length) { alert('No conversation lines found.'); return; }
    var questions = [];
    msgs.forEach(function(msg) {
      var raw = (msg.txt || msg.text || '').trim();
      if (!raw) return;
      var sentence = raw.split(/[.!?]/)[0].trim();
      var words = sentence.split(/\s+/).filter(Boolean);
      if (words.length < 2 || words.length > 6) return;
      questions.push({ sentence: sentence, words: words, who: msg.who || msg.name || '' });
    });
    if (!questions.length) { alert('No usable sentence for word order quiz.'); return; }
    window._orderAttempt = 0;
    showQuizModal('order', questions.slice(0, 4), c.name || '');
  };

  window.renderOrderQ = function(q) {
    var shuffled = q.words.slice().sort(function(){ return Math.random() - .5; });
    q._shuffled = shuffled; q._selected = [];
    var html = '<div style="padding:24px 22px;">'
      + '<div style="font-size:13px;font-weight:800;color:#1d4ed8;margin-bottom:8px;">Word Order Quiz</div>'
      + (q.who ? '<div style="font-size:12px;color:#64748b;margin-bottom:14px;">Line from <b>' + q.who + '</b></div>' : '')
      + '<div style="font-size:13px;color:#64748b;line-height:1.65;margin-bottom:14px;">Tap the chunks in the correct Korean word order.</div>'
      + '<div id="order-answer" style="min-height:64px;border:2px dashed #cfe0ff;background:#f8fbff;border-radius:14px;padding:12px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;"></div>'
      + '<div id="order-bank" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;">';
    shuffled.forEach(function(word, i){
      html += '<button type="button" id="order-word-' + i + '" onclick="pickOrderWord(' + i + ')" style="padding:12px 14px;border-radius:14px;border:1.5px solid #dbe6f7;background:#fff;color:#0f172a;font-size:15px;font-weight:800;cursor:pointer;font-family:\'Noto Sans KR\',sans-serif;">' + word + '</button>';
    });
    html += '</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;">'
      + '<button onclick="resetOrderSelection()" style="padding:11px 16px;border-radius:12px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;">Reset</button>'
      + '<button onclick="checkOrder()" style="padding:11px 18px;border-radius:12px;background:#2563eb;color:#fff;border:none;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;">Check answer</button>'
      + '</div></div>';
    return html;
  };

  window.pickOrderWord = function(idx){
    var q = _quizQuestions[_quizCurrent]; if (!q) return;
    q._selected = q._selected || []; if (q._selected.indexOf(idx) !== -1) return;
    q._selected.push(idx); renderOrderSelection();
  };
  window.renderOrderSelection = function(){
    var q = _quizQuestions[_quizCurrent]; if (!q) return;
    var answerEl = document.getElementById('order-answer'); if (!answerEl) return;
    var selectedWords = (q._selected || []).map(function(i){ return q._shuffled[i]; });
    answerEl.innerHTML = selectedWords.length ? selectedWords.map(function(word){ return '<span style="display:inline-flex;padding:9px 12px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:14px;font-weight:800;">' + word + '</span>'; }).join('') : '<div style="font-size:13px;color:#94a3b8;">Your answer will appear here.</div>';
    (q._shuffled || []).forEach(function(_, i){
      var btn = document.getElementById('order-word-' + i); if (!btn) return;
      var used = (q._selected || []).indexOf(i) !== -1; btn.disabled = used; btn.style.opacity = used ? '.45' : '1';
    });
  };
  window.resetOrderSelection = function(){ var q = _quizQuestions[_quizCurrent]; if (!q) return; q._selected = []; renderOrderSelection(); };
  window.analyzeWordUnit = function(word){
    word = String(word || '').trim();
    if (/(은|는)$/.test(word)) return { text: word, role: 'topic' };
    if (/(이|가)$/.test(word)) return { text: word, role: 'subject' };
    if (/(을|를)$/.test(word)) return { text: word, role: 'object' };
    if (/(에|에서|에게|한테|로|으로|부터|까지)$/.test(word)) return { text: word, role: 'adverbial' };
    if (/(다|요|니다|했다|한다|해요|했어요|이에요|예요|입니다)$/.test(word)) return { text: word, role: 'predicate' };
    return { text: word, role: 'other' };
  };
  window.detectOrderMistakes = function(correctWords, answerWords){
    var mistakes = []; if (!answerWords.length) return [{ code: 'empty_answer' }];
    var answerAnalysis = answerWords.map(analyzeWordUnit);
    var predIdx = answerAnalysis.findIndex(function(x){ return x.role === 'predicate'; });
    if (predIdx !== -1 && predIdx !== answerAnalysis.length - 1) mistakes.push({ code: 'predicate_not_final' });
    answerAnalysis.forEach(function(unit, idx){
      if (unit.role === 'object' && predIdx !== -1 && idx > predIdx) mistakes.push({ code: 'object_after_predicate', word: unit.text });
      if ((unit.role === 'topic' || unit.role === 'subject') && idx > 0) mistakes.push({ code: 'topic_subject_late', word: unit.text });
      if (unit.role === 'adverbial' && predIdx !== -1 && idx > predIdx) mistakes.push({ code: 'adverbial_after_predicate', word: unit.text });
    });
    if (!mistakes.length && answerWords.join(' ') !== correctWords.join(' ')) mistakes.push({ code: 'far_from_expected' });
    return mistakes;
  };
  window.buildAttemptSpecificExplanation = function(correctWords, answerWords){
    window._orderAttempt = (window._orderAttempt || 0) + 1;
    var mistakes = detectOrderMistakes(correctWords, answerWords), lines = [];
    mistakes.forEach(function(m){
      if (m.code === 'empty_answer') lines.push('You need to place the chunks in an order before checking.');
      if (m.code === 'predicate_not_final') lines.push('In Korean, the predicate usually comes at the end of the sentence.');
      if (m.code === 'object_after_predicate') lines.push((m.word || 'The object') + ' has an object marker, so it should usually come before the predicate.');
      if (m.code === 'topic_subject_late') lines.push((m.word || 'The topic/subject') + ' usually appears earlier in the sentence.');
      if (m.code === 'adverbial_after_predicate') lines.push((m.word || 'That chunk') + ' works better before the predicate in normal Korean word order.');
      if (m.code === 'far_from_expected') lines.push('A more natural Korean order is topic/subject → object/adverbial → predicate.');
    });
    if (window._orderAttempt >= 2) lines.push('Basic pattern: subject or topic first, object in the middle, and the verb or adjective at the end.');
    return lines.filter(function(v,i,a){ return a.indexOf(v)===i; }).slice(0,2).join('<br>');
  };

  var origShowQuizModal = window.showQuizModal;
  window.showQuizModal = function(mode, questions, title){
    if (mode === 'order') window._orderAttempt = 0;
    origShowQuizModal(mode, questions, title);
    if (mode === 'order') setTimeout(function(){ try { renderOrderSelection(); } catch(e){} }, 0);
  };

  window.checkOrder = function() {
    var q = _quizQuestions[_quizCurrent]; if (!q) return;
    var answer = (q._selected || []).map(function(i){ return q._shuffled[i]; });
    var correctWords = q.words || [];
    var correct = answer.join(' ') === correctWords.join(' ');
    if (correct) _quizScore++;
    var explanation = correct ? '' : buildAttemptSpecificExplanation(correctWords, answer);
    showFeedback(correct, null, nextQuizQuestion, explanation, correctWords.join(' '));
  };

  window.showFeedback = function(correct, answer, next, explanation, correctSentence) {
    var overlay = document.getElementById('quiz-overlay');
    var inner = overlay.querySelector('div'); if (!inner) return;
    var fb = document.createElement('div');
    fb.style.cssText = 'padding:20px 22px;background:' + (correct?'#f0fdf4':'#fef2f2') + ';border-top:1px solid ' + (correct?'#bbf7d0':'#fecaca') + ';text-align:center;';
    fb.innerHTML = '<div style="font-size:28px;">' + (correct?'🎉':'😅') + '</div>'
      + '<div style="font-size:16px;font-weight:800;color:' + (correct?'#15803d':'#b91c1c') + ';margin:6px 0">' + (correct?'Correct!':'Not quite.') + '</div>'
      + (answer && !correct ? '<div style="font-size:14px;color:#64748b;">Answer: <b>' + answer + '</b></div>' : '')
      + (correctSentence && !correct ? '<div style="font-size:14px;color:#475569;margin-top:6px;">Correct order: <b>' + correctSentence + '</b></div>' : '')
      + (explanation && !correct ? '<div style="margin-top:12px;padding:12px 14px;background:#fff;border:1px solid #fecaca;border-radius:12px;font-size:13px;line-height:1.7;color:#7f1d1d;text-align:left;"><b style="display:block;margin-bottom:4px;">Why this order works</b>' + explanation + '</div>' : '')
      + '<button onclick="nextQuizQuestion()" style="margin-top:14px;padding:10px 24px;border-radius:12px;background:#2563eb;color:#fff;border:none;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;">Next</button>';
    inner.querySelectorAll('button:not([onclick="closeQuiz()"])').forEach(function(b){ b.disabled=true; b.style.opacity='.5'; });
    inner.appendChild(fb);
  };

  window.showQuizResult = function() {
    var overlay = document.getElementById('quiz-overlay');
    var pct = Math.round(_quizScore / _quizTotal * 100);
    var emoji = pct >= 80 ? '🏆' : pct >= 60 ? '👍' : '📚';

    // 데일리 미션 퀴즈 카운트
    if (typeof dmTrackQuiz === 'function') dmTrackQuiz();
    if (supaUser && typeof getSupa === 'function') {
      try {
        var _sb = getSupa();
        var _s = window._currentStory;
        if (_sb && _s) {
          _sb.rpc('log_quiz_result', {
            p_user_id:      supaUser.id,
            p_quiz_type:    'story_blank',
            p_content_type: 'story',
            p_content_id:   String(_s.id || ''),
            p_is_correct:   pct >= 60
          }).catch(function(){});
          // 퀴즈까지 풀었으면 completed=true
          _sb.rpc('log_read_event', {
            p_user_id:      supaUser.id,
            p_content_type: 'story',
            p_content_id:   String(_s.id || ''),
            p_title:        _s.title || '',
            p_level:        _s.lvl   || '',
            p_category:     _s.mood  || '',
            p_completed:    true
          }).catch(function(){});
        }
      } catch(e) {}
    }
    overlay.innerHTML = '<div style="background:#fff;border-radius:24px;max-width:400px;width:100%;padding:40px 32px;text-align:center;box-shadow:0 32px 80px rgba(15,23,42,.25);">'
      + '<div style="font-size:56px;margin-bottom:12px">' + emoji + '</div>'
      + '<div style="font-size:24px;font-weight:900;color:#0f172a;margin-bottom:6px">' + _quizScore + ' / ' + _quizTotal + ' correct</div>'
      + '<div style="font-size:15px;color:#64748b;margin-bottom:24px">' + (pct>=80?'Excellent work. You understood the conversation well.':pct>=60?'Nice work. A bit more practice will help.':'Read the conversation again and try one more time 💪') + '</div>'
      + '<div style="display:flex;gap:10px;justify-content:center;">'
      + '<button onclick="closeQuiz()" style="padding:12px 20px;border-radius:12px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">Close</button>'
      + '<button onclick="retryQuiz()" style="padding:12px 20px;border-radius:12px;background:#2563eb;color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">Try again</button>'
      + '</div></div>';
  };
})();
</script>
