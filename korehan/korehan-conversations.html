// ── Listening Quiz for Conversations ──
// ═══════════════════════════════════════════════════════════════
// PRACTICE TAB — three light comprehension drills
//   1) Expression Match     — pair Korean key_expressions ↔ English
//   2) Vocab in Context     — pick the meaning of a vocab word as it
//                             appeared inside a real dialogue line
//   3) Reply Check          — pick the natural reply to a given line
// All client-side, no Claude calls. Speaking work + the 4-step deep
// flow live in the Study Room (openConvStudy).
// ═══════════════════════════════════════════════════════════════

function _shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// Practice section: linear sequential progression.
// First drill auto-starts on render; each completion shows
// "Next drill →" that auto-launches the next available drill.
// After the last drill, the Study Room CTA replaces the stage so
// the user has one obvious next step instead of a pile of cards.
//
// The chip row at the top is now a progress indicator only
// (current/done/pending dots). Clicking is disabled — the user
// asked for guided flow, not a buffet picker.
var _CONV_PRACTICE_DRILLS = [
  { key:'em',    icon:'link-2',         label:'Expression Match', starter:'startExpressionMatch',  blurb:'Match each Korean expression to its English meaning.',           emptyMsg:'No key expressions for this conversation.',  has:function(c){ return (c.key_expressions||[]).length >= 2; } },
  { key:'vic',   icon:'library',        label:'Vocab in Context', starter:'startVocabInContext',   blurb:'Read a dialogue line, pick what the highlighted word means.',    emptyMsg:'No vocabulary for this conversation.',       has:function(c){ return (c.vocab||[]).filter(function(v){return v&&v.ko&&v.en;}).length > 0; } },
  { key:'rc',    icon:'message-circle', label:'Reply Check',      starter:'startReplyCheck',       blurb:'Choose the natural reply to each line.',                          emptyMsg:'Not enough dialogue lines for this drill.',  has:function(c){ return (c.msgs||[]).filter(function(m){return m&&(m.s==='l'||m.s==='r');}).length >= 4; } },
  // Comprehension drill removed — owner-feedback that 'who-said-what'
  // recall questions add noise on top of Reply Check + Vocab in
  // Context which already test understanding. Plus 'Generating
  // comprehension questions…' fired a Haiku call per learner per
  // conversation, padding cost without payoff.
  { key:'build', icon:'shuffle',        label:'Sentence Build',   starter:'startSentenceBuild',    blurb:'Rebuild a real line by tapping the chunks in order.',            emptyMsg:'No dialogue line long enough for this drill.', has:function(c){
      return (c.msgs||[]).some(function(m){
        if (!m||!m.txt||(m.s!=='l'&&m.s!=='r')) return false;
        var w = m.txt.replace(/[.!?。！？]/g,'').trim().split(/\s+/);
        return w.length >= 3 && w.length <= 9;
      });
    } },
];

// Drill state — module-level so handlers can read it across renders.
window._convPracticeQueue = [];   // ordered list of drill keys this conv has data for
window._convPracticeActive = '';
window._convPracticeDone   = {};  // map: key → true

function _convPracticeCardsHTML(c) {
  var queue = _CONV_PRACTICE_DRILLS.filter(function(d){ return d.has(c); }).map(function(d){ return d.key; });
  window._convPracticeQueue  = queue;
  window._convPracticeActive = queue[0] || '';
  window._convPracticeDone   = {};

  // Progress dots — visual indicator only, no click handlers.
  var dotsHTML = _CONV_PRACTICE_DRILLS.map(function(d) {
    var inQueue = queue.indexOf(d.key) >= 0;
    var cls = !inQueue ? ' is-skip'
            : (d.key === window._convPracticeActive ? ' is-active' : '');
    return '<div class="dp-pr-step' + cls + '" title="' + escapeHtml(d.label) + '">'
      + '<i data-lucide="' + d.icon + '" class="kh-ui-icon kh-ui-icon-sm" aria-hidden="true"></i>'
      + '<span>' + escapeHtml(d.label) + '</span>'
      + '</div>';
  }).join('<span class="dp-pr-step-sep" aria-hidden="true">›</span>');

  // Single stage container — renderConvPracticeStage paints whichever
  // drill is active. First drill auto-fires on the next tick.
  return ''
    + '<div class="dp-study-card dp-pr-shell" data-study="practice">'
    +   '<div class="dp-study-card-title" style="display:inline-flex;align-items:center;gap:6px"><i data-lucide="dumbbell" class="kh-ui-icon kh-ui-icon-sm" aria-hidden="true"></i><span>Practice</span></div>'
    +   '<div class="dp-pr-steps-wrap"><div class="dp-pr-steps">' + dotsHTML + '</div></div>'
    +   '<div id="dp-pr-stage" class="dp-pr-stage"><div class="dp-pr-empty">Loading…</div></div>'
    + '</div>';
}

// Linear practice flow:
//   - convPracticeStart(key): point #dp-pr-stage at a fresh drill mount
//     div (#dp-pr-<key>) and call the drill's start* function. The
//     start handlers were already targeting #dp-pr-<key>, so they
//     don't need to know about the linear flow at all.
//   - convPracticeAdvance(): called by each drill at completion.
//     Marks current drill done, walks the queue to the next one, and
//     auto-fires its starter. Last drill → swap stage to the
//     "Open in Study Room" CTA so the user has one obvious next step.
function convPracticeStart(key) {
  if (!key) return;
  var stage = document.getElementById('dp-pr-stage');
  if (!stage) return;
  window._convPracticeActive = key;
  stage.innerHTML = '<div id="dp-pr-' + key + '"></div>';
  // Update progress dots.
  document.querySelectorAll('.dp-pr-step').forEach(function(el) {
    var label = el.getAttribute('title') || '';
    el.classList.remove('is-active');
    var matched = false;
    _CONV_PRACTICE_DRILLS.forEach(function(d) {
      if (d.label === label) {
        if (d.key === key) { el.classList.add('is-active'); matched = true; }
        if (window._convPracticeDone[d.key]) el.classList.add('is-done');
      }
    });
    void matched;
  });
  if (typeof lucide !== 'undefined' && lucide.createIcons) { try { lucide.createIcons(); } catch(_) {} }
  // Find drill meta + invoke its start function.
  var meta = _CONV_PRACTICE_DRILLS.find(function(d){ return d.key === key; });
  if (meta && typeof window[meta.starter] === 'function') {
    try { window[meta.starter](); } catch(e) { console.warn('[conv-practice] start failed', e); }
  }
}

function convPracticeAdvance() {
  var queue = window._convPracticeQueue || [];
  var current = window._convPracticeActive;
  window._convPracticeDone[current] = true;
  var idx = queue.indexOf(current);
  var next = idx >= 0 ? queue[idx + 1] : null;
  if (next) {
    convPracticeStart(next);
  } else {
    convPracticeShowStudyRoomCTA();
  }
}

function convPracticeShowStudyRoomCTA() {
  var stage = document.getElementById('dp-pr-stage');
  if (!stage) return;
  // Mark every step done so the strip reads as fully-checked.
  document.querySelectorAll('.dp-pr-step').forEach(function(el) {
    el.classList.add('is-done');
    el.classList.remove('is-active');
  });
  stage.innerHTML =
      '<div class="dp-pr-deep" style="border:none;padding:8px 0">'
    +   '<div class="dp-pr-deep-eyebrow">All practice drills done 🎉</div>'
    +   '<div class="dp-pr-deep-title">Now go deeper in the Study Room</div>'
    +   '<div class="dp-pr-deep-sub">A 4-step guided flow — dialogue + flashcards + choose-response + sentence build.</div>'
    +   '<button class="dp-pr-deep-btn" onclick="goToStudyRoomConv()">Open in Study Room →</button>'
    + '</div>';
}

// First drill auto-fires after the practice card is rendered. Hook
// this in the same path that builds the conv detail panel.
function convPracticeAutoStart() {
  var first = (window._convPracticeQueue || [])[0];
  if (first) convPracticeStart(first);
}

function goToStudyRoomConv() {
  var c = window._currentConv;
  if (!c || !c._id) {
    if (typeof toast === 'function') toast('Conversation not loaded yet — try again in a moment.');
    return;
  }
  location.href = 'korehan-study-room.html?mode=conversation&id=' + encodeURIComponent(c._id);
}

// ── 1) Expression Match ─────────────────────────────────────
// Two columns of pills (Korean / English). Tap one from each side;
// correct pair locks in green and is removed, wrong pair flashes red
// and clears the selection. Finishes when every pair is locked.
var _emState = null;
function startExpressionMatch() {
  var c = window._currentConv; if (!c) return;
  var pairs = (c.key_expressions || []).filter(function(e){
    return e
      && typeof e.ko === 'string' && e.ko.trim()
      && typeof e.en === 'string' && e.en.trim();
  }).slice(0, 5);
  if (pairs.length < 2) {
    document.getElementById('dp-pr-em').innerHTML = '<div class="dp-pr-empty">Need at least 2 key expressions.</div>';
    return;
  }
  _emState = {
    pairs: pairs,
    leftSel: -1, rightSel: -1,
    leftOrder: _shuffle(pairs.map(function(_, i){ return i; })),
    rightOrder: _shuffle(pairs.map(function(_, i){ return i; })),
    locked: {} // index → true once that pair is matched
  };
  _emRender();
}
function _emRender() {
  var s = _emState; if (!s) return;
  // Interleave pills as (L0, R0, L1, R1, …) into a single 2-col grid.
  // Each grid ROW pairs one slot from each side so its height equals
  // max(L_height, R_height) — when English wraps to 2 lines but Korean
  // is 1 line, the Korean pill stretches to match, keeping columns
  // visually balanced.
  var rows = '';
  var nL = s.leftOrder.length;
  var nR = s.rightOrder.length;
  var rowCount = Math.max(nL, nR);
  for (var slot = 0; slot < rowCount; slot++) {
    if (slot < nL) {
      var li = s.leftOrder[slot];
      var lLocked = s.locked[li];
      var lSel = (s.leftSel === slot);
      var lCls = 'dp-pr-pill em-l' + (lLocked ? ' locked' : lSel ? ' sel' : '');
      rows += '<button class="' + lCls + '" data-side="l" data-slot="' + slot + '" data-idx="' + li + '" onclick="_emPick(\'l\',' + slot + ')"' + (lLocked ? ' disabled' : '') + '>'
        + escapeHtml(s.pairs[li].ko) + '</button>';
    } else {
      rows += '<span></span>';
    }
    if (slot < nR) {
      var ri = s.rightOrder[slot];
      var rLocked = s.locked[ri];
      var rSel = (s.rightSel === slot);
      var rCls = 'dp-pr-pill em-r' + (rLocked ? ' locked' : rSel ? ' sel' : '');
      rows += '<button class="' + rCls + '" data-side="r" data-slot="' + slot + '" data-idx="' + ri + '" onclick="_emPick(\'r\',' + slot + ')"' + (rLocked ? ' disabled' : '') + '>'
        + escapeHtml(s.pairs[ri].en) + '</button>';
    } else {
      rows += '<span></span>';
    }
  }
  var done = Object.keys(s.locked).length;
  var total = s.pairs.length;
  var doneBanner = (done === total)
    ? '<div class="dp-pr-done" style="display:inline-flex;align-items:center;gap:6px"><span>All matched!</span><i data-lucide="party-popper" class="kh-ui-icon kh-ui-icon-sm" style="color:#a78bfa" aria-hidden="true"></i></div>'
    : '<div class="dp-pr-progress">' + done + ' / ' + total + ' matched</div>';
  document.getElementById('dp-pr-em').innerHTML =
      doneBanner
    + '<div class="dp-pr-em-grid">' + rows + '</div>'
    + (done === total
        ? '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="dp-pr-start dp-pr-secondary" onclick="startExpressionMatch()">Play again</button><button class="dp-pr-start" onclick="convPracticeAdvance()">Next drill →</button></div>'
        : '');
}
window._emPick = function(side, slot) {
  var s = _emState; if (!s) return;
  if (side === 'l') s.leftSel = (s.leftSel === slot ? -1 : slot);
  else s.rightSel = (s.rightSel === slot ? -1 : slot);
  if (s.leftSel >= 0 && s.rightSel >= 0) {
    var li = s.leftOrder[s.leftSel];
    var ri = s.rightOrder[s.rightSel];
    if (li === ri) {
      s.locked[li] = true;
      s.leftSel = -1; s.rightSel = -1;
      _emRender();
    } else {
      // Wrong pair → flash red briefly, then clear selections.
      // We can't precisely target the original wrong pills after the
      // re-render (DOM was replaced), so we tag every still-selected
      // pill with .wrong and let the 600ms re-render clear it.
      _emRender();
      var board = document.getElementById('dp-pr-em');
      if (board) {
        var pills = board.querySelectorAll('.dp-pr-pill.sel');
        pills.forEach(function(p){ p.classList.add('wrong'); });
      }
      setTimeout(function(){
        s.leftSel = -1; s.rightSel = -1;
        _emRender();
      }, 600);
    }
  } else {
    _emRender();
  }
};

// ── 2) Vocab in Context ─────────────────────────────────────
// Walk through up to 5 vocab words. For each: find a real dialogue
// line that contains the word, highlight it, ask for the meaning.
// Distractors come from other vocab in the same conversation.
var _vicState = null;
function startVocabInContext() {
  var c = window._currentConv; if (!c) return;
  var vocab = (c.vocab || []).filter(function(v){ return v && v.ko && v.en; });
  if (!vocab.length) {
    document.getElementById('dp-pr-vic').innerHTML = '<div class="dp-pr-empty">No vocabulary available.</div>';
    return;
  }
  // Build the round list — prefer vocab words that actually appear in
  // the dialogue (so the highlight isn't a lie). Fallback: use the
  // word itself as the prompt sentence.
  var msgs = (c.msgs || []).filter(function(m){ return m && m.txt && (m.s === 'l' || m.s === 'r'); });
  var rounds = vocab.slice(0, 8).map(function(v) {
    var sentence = '';
    for (var i = 0; i < msgs.length; i++) {
      if (msgs[i].txt.indexOf(v.ko) !== -1) { sentence = msgs[i].txt; break; }
    }
    return { v: v, sentence: sentence };
  }).filter(function(r){ return r.sentence; });
  // If nothing matched, fall back to "isolated" prompts so the drill
  // still has something to show.
  if (!rounds.length) {
    rounds = vocab.slice(0, 5).map(function(v){ return { v: v, sentence: v.ko }; });
  }
  rounds = rounds.slice(0, 5);
  _vicState = { rounds: rounds, idx: 0, correct: 0, allEn: vocab.map(function(v){ return v.en; }) };
  _vicRender();
}
function _vicRender() {
  var s = _vicState; if (!s) return;
  var box = document.getElementById('dp-pr-vic'); if (!box) return;
  if (s.idx >= s.rounds.length) {
    box.innerHTML = '<div class="dp-pr-done">Done — ' + s.correct + ' / ' + s.rounds.length + ' correct</div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="dp-pr-start dp-pr-secondary" onclick="startVocabInContext()">Try again</button><button class="dp-pr-start" onclick="convPracticeAdvance()">Next drill →</button></div>';
    return;
  }
  var r = s.rounds[s.idx];
  var sentence = escapeHtml(r.sentence).replace(
    escapeHtml(r.v.ko),
    '<mark class="dp-pr-mark">' + escapeHtml(r.v.ko) + '</mark>'
);
  // Distractors: pick 2 other meanings, fall back to filler if fewer
  // unique ones exist.
  var pool = s.allEn.filter(function(en){ return en !== r.v.en; });
  var distractors = _shuffle(pool).slice(0, 2);
  var opts = _shuffle([r.v.en].concat(distractors));
  var optsHTML = opts.map(function(opt) {
    return '<button class="dp-pr-opt" onclick="_vicPick(this, ' + (opt === r.v.en ? '1' : '0') + ')">' + escapeHtml(opt) + '</button>';
  }).join('');
  box.innerHTML =
      '<div class="dp-pr-progress">' + (s.idx + 1) + ' / ' + s.rounds.length + '</div>'
    + '<div class="dp-pr-prompt">' + sentence + '</div>'
    + '<div class="dp-pr-opt-list">' + optsHTML + '</div>';
}
window._vicPick = function(btn, isCorrect) {
  var s = _vicState; if (!s) return;
  var box = document.getElementById('dp-pr-vic');
  if (!box) return;
  box.querySelectorAll('.dp-pr-opt').forEach(function(b){ b.disabled = true; });
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) {
    // Also mark the correct one so the learner sees what it was.
    var r = s.rounds[s.idx];
    box.querySelectorAll('.dp-pr-opt').forEach(function(b) {
      if (b.textContent === r.v.en) b.classList.add('correct');
    });
  } else {
    s.correct++;
  }
  setTimeout(function() { s.idx++; _vicRender(); }, 900);
};

// ── 3) Reply Check ──────────────────────────────────────────
// Look for L→R and R→L adjacency in msgs, build a pool of (prompt,
// reply) pairs, then quiz up to 3 of them. Distractors come from the
// other-side replies in the same dialogue (cheap, no Claude needed).
var _rcState = null;
function startReplyCheck() {
  var c = window._currentConv; if (!c) return;
  var msgs = (c.msgs || []).filter(function(m){ return m && m.txt && (m.s === 'l' || m.s === 'r'); });
  // Build adjacency pairs where speaker actually changes turn.
  var pairs = [];
  for (var i = 0; i < msgs.length - 1; i++) {
    if (msgs[i].s !== msgs[i+1].s) pairs.push({ prompt: msgs[i], reply: msgs[i+1] });
  }
  if (pairs.length < 2) {
    document.getElementById('dp-pr-rc').innerHTML = '<div class="dp-pr-empty">Not enough dialogue turns.</div>';
    return;
  }
  // Pool of all replies (used to source distractors).
  var allReplies = msgs.map(function(m){ return m.txt; });
  var rounds = _shuffle(pairs).slice(0, 3);
  _rcState = { rounds: rounds, idx: 0, correct: 0, allReplies: allReplies };
  _rcRender();
}
function _rcRender() {
  var s = _rcState; if (!s) return;
  var box = document.getElementById('dp-pr-rc'); if (!box) return;
  if (s.idx >= s.rounds.length) {
    box.innerHTML = '<div class="dp-pr-done">Done — ' + s.correct + ' / ' + s.rounds.length + ' correct</div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="dp-pr-start dp-pr-secondary" onclick="startReplyCheck()">Try again</button><button class="dp-pr-start" onclick="convPracticeAdvance()">Next drill →</button></div>';
    return;
  }
  var r = s.rounds[s.idx];
  var pool = s.allReplies.filter(function(t){ return t !== r.reply.txt && t !== r.prompt.txt; });
  var distractors = _shuffle(pool).slice(0, 2);
  // If we don't have 2 distinct distractors, pad with first-line
  // fragments so we always show 3 options.
  while (distractors.length < 2 && pool.length) distractors.push(pool[distractors.length % pool.length]);
  var opts = _shuffle([r.reply.txt].concat(distractors));
  var optsHTML = opts.map(function(opt) {
    return '<button class="dp-pr-opt" onclick="_rcPick(this, ' + (opt === r.reply.txt ? '1' : '0') + ')">' + escapeHtml(opt) + '</button>';
  }).join('');
  box.innerHTML =
      '<div class="dp-pr-progress">' + (s.idx + 1) + ' / ' + s.rounds.length + '</div>'
    + '<div class="dp-pr-prompt-row">'
    +   '<span class="dp-pr-who">' + escapeHtml(r.prompt.who || (r.prompt.s === 'l' ? 'A' : 'B')) + ':</span> '
    +   '<span class="dp-pr-prompt-txt">' + escapeHtml(r.prompt.txt) + '</span>'
    + '</div>'
    + '<div class="dp-pr-cue">Pick the natural reply:</div>'
    + '<div class="dp-pr-opt-list">' + optsHTML + '</div>';
}
window._rcPick = function(btn, isCorrect) {
  var s = _rcState; if (!s) return;
  var box = document.getElementById('dp-pr-rc');
  if (!box) return;
  box.querySelectorAll('.dp-pr-opt').forEach(function(b){ b.disabled = true; });
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) {
    var r = s.rounds[s.idx];
    box.querySelectorAll('.dp-pr-opt').forEach(function(b) {
      if (b.textContent === r.reply.txt) b.classList.add('correct');
    });
  } else {
    s.correct++;
  }
  setTimeout(function() { s.idx++; _rcRender(); }, 1100);
};

// ── 4) Comprehension Quiz — AI-generated multiple choice ────────
// Builds 3 questions about the conversation (who said what, why, what
// happens). Cached per-conversation in localStorage so the AI cost is
// one-time. Same pattern as KE situation quiz / article-study quiz.
var _cqState = null;
async function startComprehensionQuiz() {
  var c = window._currentConv; if (!c) return;
  var host = document.getElementById('dp-pr-comp'); if (!host) return;
  host.innerHTML = '<div class="dp-pr-empty">⏳ Generating comprehension questions…</div>';

  var dateKey = (typeof kstDateKey === 'function') ? kstDateKey() : new Date().toISOString().slice(0,10);
  var cacheKey = 'kh_conv_comp_v1_' + (c._id || 'noid') + '_' + dateKey;
  var quiz = null;
  try { var raw = localStorage.getItem(cacheKey); if (raw) quiz = JSON.parse(raw); } catch(_) {}

  if (!quiz) {
    if (typeof callClaude !== 'function') {
      host.innerHTML = '<div class="dp-pr-empty">Sign in to load AI quizzes.</div>'; return;
    }
    var dialogue = (c.msgs || []).filter(function(m){ return m && m.txt && (m.s === 'l' || m.s === 'r'); })
      .map(function(m){ return (m.who || (m.s === 'l' ? 'A' : 'B')) + ': ' + m.txt; }).join('\n');
    if (!dialogue) { host.innerHTML = '<div class="dp-pr-empty">No dialogue to quiz.</div>'; return; }
    try {
      var res = await callClaude({
        feature: 'conv-comprehension-quiz',
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 800,
        messages: [{ role: 'user', content:
          'You are a Korean teacher writing comprehension questions for an English-speaking learner.\n\n'
          + 'Dialogue:\n' + dialogue + '\n\n'
          + 'Write EXACTLY 3 multiple-choice comprehension questions IN ENGLISH about this dialogue. Mix question types:\n'
          + '  1. Factual (who said X / what happened)\n'
          + '  2. Inferential (why did A say Y / what does B mean)\n'
          + '  3. Detail (what specific word/phrase tells us Z)\n\n'
          + 'Each question has 4 plausible options; the correct one must be true to the dialogue. Wrong options should be plausible (related to topic, similar wording) but clearly wrong on close reading.\n\n'
          + 'Return ONLY JSON, no markdown:\n'
          + '{"questions":[{"q":"…","options":["correct","wrong1","wrong2","wrong3"],"correct":0,"explanation":"1 sentence why"}]}\n'
          + 'choices[0] is correct; the renderer shuffles. Keep each option under 14 English words.'
        }]
      });
      var txt = (res && res.content && res.content[0] && res.content[0].text) || '{}';
      txt = txt.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
      var s = txt.indexOf('{'), e = txt.lastIndexOf('}');
      if (s >= 0 && e > s) txt = txt.slice(s, e + 1);
      quiz = JSON.parse(txt);
      if (!quiz || !Array.isArray(quiz.questions) || !quiz.questions.length) throw new Error('bad quiz');
      try { localStorage.setItem(cacheKey, JSON.stringify(quiz)); } catch(_) {}
    } catch (err) {
      host.innerHTML = '<div class="dp-pr-empty">Quiz generation failed — try again later.</div>';
      return;
    }
  }
  _cqState = { qs: quiz.questions, idx: 0, correct: 0 };
  _cqRender();
}

function _cqRender() {
  var s = _cqState; if (!s) return;
  var host = document.getElementById('dp-pr-comp'); if (!host) return;
  if (s.idx >= s.qs.length) {
    host.innerHTML = '<div class="dp-pr-result">'
      + '<div class="dp-pr-result-score">' + s.correct + ' / ' + s.qs.length + '</div>'
      + '<div class="dp-pr-result-sub">Comprehension complete</div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px"><button class="dp-pr-start dp-pr-secondary" onclick="startComprehensionQuiz()">Try again</button><button class="dp-pr-start" onclick="convPracticeAdvance()">Next drill →</button></div>'
      + '</div>';
    return;
  }
  var q = s.qs[s.idx];
  // Shuffle options once per question, keep mapping back to original index
  if (!q._order) {
    q._order = q.options.map(function(_, i){ return i; });
    for (var i = q._order.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = q._order[i]; q._order[i] = q._order[j]; q._order[j] = t;
    }
  }
  host.innerHTML = '<div class="dp-pr-q">'
    + '<div class="dp-pr-q-progress">Question ' + (s.idx + 1) + ' / ' + s.qs.length + '</div>'
    + '<div class="dp-pr-q-text">' + escapeHtml(q.q) + '</div>'
    + '<div class="dp-pr-q-options">'
    + q._order.map(function(origIdx, slot) {
      return '<button class="dp-pr-q-opt" onclick="_cqAnswer(' + origIdx + ')">'
        + String.fromCharCode(65 + slot) + '. ' + escapeHtml(q.options[origIdx]) + '</button>';
    }).join('')
    + '</div>'
    + '<div id="dp-pr-q-fb"></div>'
    + '</div>';
}

function _cqAnswer(picked) {
  var s = _cqState; if (!s) return;
  var q = s.qs[s.idx];
  var right = picked === q.correct;
  if (right) s.correct++;
  document.querySelectorAll('.dp-pr-q-opt').forEach(function(b, slot) {
    b.disabled = true;
    var origIdx = q._order[slot];
    if (origIdx === q.correct) b.classList.add('dp-pr-q-opt-right');
    else if (origIdx === picked) b.classList.add('dp-pr-q-opt-wrong');
    else b.classList.add('dp-pr-q-opt-dim');
  });
  var fb = document.getElementById('dp-pr-q-fb');
  if (fb) fb.innerHTML = '<div class="dp-pr-q-fb' + (right ? ' is-right' : ' is-wrong') + '">'
    + '<b>' + (right ? '정답' : '오답') + '.</b> ' + escapeHtml(q.explanation || '')
    + '</div>';
  setTimeout(function() { s.idx++; _cqRender(); }, 1500);
}

// ── 5) Sentence Build — chunk reorder for one dialogue line ─────
// Picks the longest natural-sized line (3-9 words) and shuffles its
// chunks. Pre-selects the first word like the BM Build / dictation
// drill so the start anchor is unambiguous, plays TTS on each tap.
var _sbState = null;
function startSentenceBuild() {
  var c = window._currentConv; if (!c) return;
  var host = document.getElementById('dp-pr-build'); if (!host) return;
  // Prefer the longest 3-9 word line so the drill feels meaningful.
  var candidates = (c.msgs || []).filter(function(m) {
    if (!m || !m.txt || (m.s !== 'l' && m.s !== 'r')) return false;
    var w = m.txt.replace(/[.!?。！？]/g,'').trim().split(/\s+/);
    return w.length >= 3 && w.length <= 9;
  }).sort(function(a, b) {
    return b.txt.length - a.txt.length;
  });
  if (!candidates.length) { host.innerHTML = '<div class="dp-pr-empty">No suitable line.</div>'; return; }
  var line = candidates[0];
  var words = line.txt.replace(/[.!?。！？]/g,'').trim().split(/\s+/);
  var shuffled = _shuffle(words.map(function(w, i){ return { word: w, origIdx: i }; }));
  // Avoid the no-op shuffle.
  if (words.length > 1 && shuffled.every(function(o, i){ return o.word === words[i]; })) {
    var t = shuffled[0]; shuffled[0] = shuffled[shuffled.length-1]; shuffled[shuffled.length-1] = t;
  }
  // Move the first-word entry into the answer tray so the start is
  // anchored — same pattern as BM Build and Dictation Word Order.
  var answer = [];
  var anchorIdx = -1;
  for (var i = 0; i < shuffled.length; i++) {
    if (shuffled[i].word === words[0]) { anchorIdx = i; break; }
  }
  if (anchorIdx >= 0) answer.push(shuffled.splice(anchorIdx, 1)[0]);
  _sbState = {
    line: line, original: words, pool: shuffled, answer: answer,
    correctEn: line.en || ''
  };
  _sbRender();
}

function _sbRender() {
  var s = _sbState; if (!s) return;
  var host = document.getElementById('dp-pr-build'); if (!host) return;
  var poolHTML = s.pool.map(function(o, i) {
    return '<button class="dp-pr-chip" onclick="_sbPick(' + o.origIdx + ')">' + escapeHtml(o.word) + '</button>';
  }).join('');
  var ansHTML = s.answer.length
    ? s.answer.map(function(o, pos) {
        return '<button class="dp-pr-chip dp-pr-chip-on" onclick="_sbRemove(' + pos + ')">' + escapeHtml(o.word) + ' ×</button>';
      }).join('')
    : '<span class="dp-pr-empty-inline">Tap chunks below to build the line.</span>';
  var done = s.answer.length === s.original.length;
  host.innerHTML = '<div class="dp-pr-build-wrap">'
    + (s.correctEn ? '<div class="dp-pr-build-hint">' + escapeHtml(s.correctEn) + '</div>' : '')
    + '<div class="dp-pr-build-tray">' + ansHTML + '</div>'
    + '<div class="dp-pr-build-pool">' + poolHTML + '</div>'
    + '<div class="dp-pr-build-actions">'
    +   '<button class="dp-pr-start dp-pr-secondary" onclick="_sbReset()">Reset</button>'
    +   '<button class="dp-pr-start" ' + (done ? '' : 'disabled') + ' onclick="_sbCheck()">Check</button>'
    + '</div>'
    + '<div id="dp-pr-build-fb"></div>'
    + '</div>';
}

// Exposed on window so inline onclick="" attributes in the dynamically
// generated chip HTML can resolve them — Samsung browser on Android
// failed to find bare top-level function declarations from inline handlers.
window._sbPick = function(origIdx) {
  var s = _sbState; if (!s) return;
  var idx = -1;
  for (var i = 0; i < s.pool.length; i++) {
    if (s.pool[i].origIdx === origIdx) { idx = i; break; }
  }
  if (idx < 0) return;
  var picked = s.pool.splice(idx, 1)[0];
  s.answer.push(picked);
  try { if (typeof ttsSpeak === 'function') ttsSpeak(picked.word); } catch(_) {}
  _sbRender();
};

window._sbRemove = function(pos) {
  var s = _sbState; if (!s) return;
  if (pos <= 0) return; // can't remove the anchor
  var removed = s.answer.splice(pos, 1)[0];
  if (removed) s.pool.push(removed);
  try { if (removed && typeof ttsSpeak === 'function') ttsSpeak(removed.word); } catch(_) {}
  _sbRender();
};

window._sbReset = function() {
  var s = _sbState; if (!s) return;
  // Restore the start anchor; everything else goes back to the pool.
  var keep = s.answer.slice(0, 1);
  s.pool = s.pool.concat(s.answer.slice(1));
  s.answer = keep;
  _sbRender();
};

window._sbCheck = function() {
  var s = _sbState; if (!s) return;
  var ans = s.answer.map(function(o){ return o.word; });
  var ok = ans.join(' ') === s.original.join(' ');
  var fb = document.getElementById('dp-pr-build-fb');
  if (fb) {
    fb.innerHTML = (ok
      ? '<div class="dp-pr-q-fb is-right"><b>완벽해요!</b> ' + escapeHtml(s.original.join(' ')) + '</div>'
      : '<div class="dp-pr-q-fb is-wrong"><b>다시 한번.</b> 정답: ' + escapeHtml(s.original.join(' ')) + '</div>')
      // Always offer "Next" so the user isn't stranded; on wrong, they
      // can retry with Reset (button above) or move on.
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="dp-pr-start" onclick="convPracticeAdvance()">Next drill →</button></div>';
  }
  if (ok) {
    try { if (typeof ttsSpeak === 'function') ttsSpeak(s.original.join(' ')); } catch(_) {}
  }
};

function closeDetail() {
  document.getElementById('detail-overlay').classList.add('hidden');
  document.body.style.overflow = '';
  document.documentElement.style.overflow = '';
  document.body.classList.remove('kh-reading-page');
  document.body.classList.remove('kh-feed-pill-on');
  _convDetailIdx = -1;
  // _khLastConvScrollDy is reset implicitly when the panel reopens.
}

// Animated hand-off between conversations — mirrors _khSpaLoadArticle
// for the article reader. openDetail() handles loading + innerHTML, we
// just wrap it in a slide-out / slide-in pass so the modal visibly
// swaps content instead of flickering into the next one. Direction
// mirrors the article reader: 'forward' = new slides up from below,
// 'back' = slides down from above.
function _convNavigateTo(idx, direction) {
  var panel = document.getElementById('detail-panel');
  if (!panel) { openDetail(idx); return; }
  if (panel.classList.contains('kh-modal-leaving') || panel.classList.contains('kh-modal-leaving-back')) return;
  direction = direction === 'back' ? 'back' : 'forward';
  var leaveClass = direction === 'back' ? 'kh-modal-leaving-back' : 'kh-modal-leaving';
  var enterClass = direction === 'back' ? 'kh-modal-entering-back' : 'kh-modal-entering';
  panel.classList.add(leaveClass);
  setTimeout(function() {
    Promise.resolve(openDetail(idx)).then(function() {
      var p = document.getElementById('detail-panel');
      if (!p) return;
      p.classList.remove(leaveClass);
      p.classList.add(enterClass);
      setTimeout(function(){ p.classList.remove(enterClass); }, 340);
      // Reset the scroll container so the new conv starts at the top.
      p.scrollTop = 0;
      window.scrollTo(0, 0);
      // Pill starts hidden on new content until the user scrolls
      // through it; otherwise it'd linger from the previous conv.
      document.body.classList.remove('kh-feed-pill-on');
    });
  }, 220);
}

// Bottom-centered "Next" pill, same visual as the article reader's.
// Created once per session and reused — openDetail only needs to make
// sure it's mounted. Reveal is handled by the scroll listener below.
function _ensureConvNextPill() {
  if (document.getElementById('kh-conv-next-pill')) return;
  var pill = document.createElement('button');
  pill.id = 'kh-conv-next-pill';
  pill.type = 'button';
  pill.className = 'kh-next-pill';
  pill.setAttribute('aria-label', 'Next conversation');
  pill.innerHTML =
      '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>'
    + '<span>Next conversation</span>';
  pill.onclick = function(e) {
    e.preventDefault();
    if (_convDetailIdx < 0) return;
    var list = (_convFilteredList && _convFilteredList.length) ? _convFilteredList : CONVS;
    var current = CONVS[_convDetailIdx];
    var posInList = list.indexOf(current);
    var nextConv = list[posInList + 1];
    if (!nextConv) return;
    var realIdx = CONVS.indexOf(nextConv);
    if (realIdx >= 0) _convNavigateTo(realIdx, 'forward');
  };
  document.body.appendChild(pill);
}

// Reveal the pill once the user has scrolled 80% through the modal's
// scroll container. #detail-overlay is the overflowing ancestor on
// mobile (panel itself is fixed-height on desktop); we listen on both
// so the threshold fires in either layout.
(function hookConvPillReveal() {
  function update() {
    if (_convDetailIdx < 0) { document.body.classList.remove('kh-feed-pill-on'); return; }
    var panel = document.getElementById('detail-panel');
    var overlay = document.getElementById('detail-overlay');
    var ratio = 0;
    if (overlay && overlay.scrollHeight > overlay.clientHeight + 10) {
      ratio = (overlay.scrollTop + overlay.clientHeight) / overlay.scrollHeight;
    } else if (panel && panel.scrollHeight > panel.clientHeight + 10) {
      ratio = (panel.scrollTop + panel.clientHeight) / panel.scrollHeight;
    } else {
      // No scrollable content (short conversation) — just show the pill.
      ratio = 1;
    }
    document.body.classList.toggle('kh-feed-pill-on', ratio > 0.8);
  }
  ['scroll', 'touchmove'].forEach(function(ev) {
    document.addEventListener(ev, function(e) {
      if (_convDetailIdx < 0) return;
      var t = e.target;
      if (!t || !(t === document || t.id === 'detail-overlay' || t.id === 'detail-panel' || (t.closest && t.closest('#detail-panel')))) return;
      update();
    }, { passive: true });
  });
  // Also run once after a nav so pill visibility reflects the new
  // scroll state immediately rather than waiting for the user to flick.
  window._convPillSync = update;
})();

// TikTok / Reels style swipe navigation between conversations. Swipe
// up near the bottom of the detail panel → next conv in the currently
// filtered list; swipe down near the top → previous. Guards:
//   - swipe magnitude > 100px
//   - panel must be scrolled to the corresponding edge so a mid-
//     read flick doesn't yank you away
//   - only fires when a detail is open (body.kh-reading-page)
var _convDetailIdx = -1;
var _convSwipeStartY = 0;
var _convSwipeStartX = 0;
var _convSwipeStartT = 0;
var _convSwipeValid  = false;
(function hookConvFeedSwipe() {
  document.addEventListener('touchstart', function(e) {
    if (!document.body.classList.contains('kh-reading-page')) { _convSwipeValid = false; return; }
    // Track single-finger gestures only. Pinch-to-zoom on iPhone would
    // otherwise register 100+px of vertical drift as a swipe when one
    // finger lifts.
    if (!e.touches || e.touches.length !== 1) { _convSwipeValid = false; return; }
    _convSwipeStartY = e.touches[0].clientY;
    _convSwipeStartX = e.touches[0].clientX;
    _convSwipeStartT = Date.now();
    _convSwipeValid  = true;
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    if (!_convSwipeValid) return;
    _convSwipeValid = false;
    if (!document.body.classList.contains('kh-reading-page')) return;
    if (_convDetailIdx < 0) return;
    if (!e.changedTouches || !e.changedTouches.length) return;
    // Other fingers still on screen? Mid-pinch, skip.
    if (e.touches && e.touches.length > 0) return;
    var dy = _convSwipeStartY - e.changedTouches[0].clientY;
    var dx = e.changedTouches[0].clientX - _convSwipeStartX;
    var dt = Date.now() - _convSwipeStartT;
    if (dt > 600) return;
    if (Math.abs(dx) > Math.abs(dy) * 0.5) return;
    if (Math.abs(dy) < 100) return;
    var panel = document.getElementById('detail-panel');
    if (!panel) return;
    // On mobile the CSS at @media(max-width:900px) switches the
    // scroller from #detail-panel (overflow:visible) to the outer
    // #detail-overlay (overflow-y:auto). panel.scrollTop stays at 0
    // regardless of where the user scrolled, so the original
    // panel-only check silently blocked every mobile swipe. Now we
    // pick whichever container is actually scrollable.
    var overlay = document.getElementById('detail-overlay');
    var scroller = panel;
    if (overlay && overlay.scrollHeight > overlay.clientHeight + 10) scroller = overlay;
    // Short conversations: scrollHeight ≈ clientHeight, so both atTop
    // AND atBottom would be true — any 100px+ swipe in any direction
    // would auto-navigate. Owner reported "스크롤 자체가 안됨" because
    // every scroll attempt was being eaten by the swipe nav. Only
    // honor edge-flick navigation when there's enough content to
    // actually scroll through.
    if (scroller.scrollHeight <= scroller.clientHeight + 20) return;
    var atTop    = scroller.scrollTop < 60;
    var atBottom = (scroller.scrollTop + scroller.clientHeight) >= scroller.scrollHeight - 120;
    var list = (_convFilteredList && _convFilteredList.length) ? _convFilteredList : CONVS;
    var current = CONVS[_convDetailIdx];
    var posInList = list.indexOf(current);
    if (dy > 0 && atBottom) {
      var nextConv = list[posInList + 1];
      if (nextConv) {
        var realIdx = CONVS.indexOf(nextConv);
        if (realIdx >= 0) _convNavigateTo(realIdx, 'forward');
      }
    } else if (dy < 0 && atTop) {
      var prevConv = list[posInList - 1];
      if (prevConv) {
        var realIdx = CONVS.indexOf(prevConv);
        if (realIdx >= 0) _convNavigateTo(realIdx, 'back');
      }
    }
  }, { passive: true });
})();
async function toggleSave(btn) {
  var isSaved = btn.classList.contains('saved');
  // 단어 정보는 부모 .dp-vocab-item에서 읽음
  var item = btn.closest('.dp-vocab-item') || btn.closest('.dp-vocab-item2');
  var ko  = (item && item.dataset.ko)  || btn.dataset.ko  || '';
  var rom = (item && item.dataset.rom) || btn.dataset.rom || '';
  var en  = (item && item.dataset.en)  || btn.dataset.en  || '';

  if (!ko) {
    // fallback: 이전 방식 — 그냥 UI 토글
    btn.classList.toggle('saved');
    btn.textContent = btn.classList.contains('saved') ? '✓ Saved' : '+ Save';
    return;
  }

  if (!supaUser) { if (typeof openAuthModal === 'function') openAuthModal('signin'); return; }

  if (isSaved) {
    if (typeof dbRemoveWord === 'function') await dbRemoveWord(ko);
    btn.classList.remove('saved');
    btn.textContent = '+ Save';
  } else {
    if (typeof dbSaveWord === 'function') await dbSaveWord(ko, rom, en);
    // dmTrackWord() is already called inside dbSaveWord → trackActivityOnWordSave chain
    btn.classList.add('saved');
    btn.innerHTML = '<span style="display:inline-flex;align-items:center;justify-content:center;gap:5px"><i data-lucide="check" class="kh-ui-icon kh-ui-icon-sm" aria-hidden="true"></i><span>Saved</span></span>';
  }
}

var activeCat = 'all', activeLvl = 'all';

// ── Stale-While-Revalidate: 캐시 즉시 렌더 → 백그라운드 DB 갱신 ──
var _CONV_CACHE_KEY = 'kh_conv_list_v1';

function _convRowToObj(row) {
  return {
    _id:  row._id || row.id,
    name: row.name || '',
    ctx:  row.ctx  || '',
    cat:  row.cat  || 'everyday',
    lvl:  row.lvl  || 'b',
    catLabel: row.catLabel || '',
    topic: row.topic || '',
    thumb: row.thumb || null,
    preview: row.preview || [],
    _msgCount: row._msgCount || 0,
    _vocabCount: row._vocabCount || 0,
    cast_left_slug: row.cast_left_slug || null,
    cast_right_slug: row.cast_right_slug || null,
    msgs: [],
    vocab: [],
    grammar: [],
    mission: [],
    _loaded: false
  };
}

(function _initConvPage() {
  // ── 1단계: localStorage 캐시에서 즉시 렌더 (네트워크 0회) ──
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(_CONV_CACHE_KEY)); } catch(e) {}

  if (cached && cached.length) {
    CONVS = cached.map(_convRowToObj);
    renderCards(activeCat, activeLvl);
  }

  // ── 2단계: 백그라운드에서 DB 최신 데이터 로드 ──
  (async function() {
    // Supabase SDK는 sync <script>로 이미 로드됨
    if (!window.supabase) { await new Promise(function(r){setTimeout(r, 150);}); }

    // 기자 캐릭터는 카드 클릭(openDetail) 시에만 필요
    if (typeof _loadReporters === 'function') _loadReporters().catch(function(){});
    if (typeof _loadCharacterPools === 'function') _loadCharacterPools().catch(function(){});

    var grid = document.getElementById('conv-cards-grid');
    // 캐시가 없을 때만 로딩 표시 (캐시 있으면 이미 카드가 보임)
    if (!cached && grid) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#94a3b8;font-size:14px">\u23F3 Loading...</div>';
    }

    // Two-phase load to fix slow first paint:
    //  Phase 1 — fetch lightweight metadata (no `data` JSONB) and render
    //  cards immediately. With 50+ conversations the full `data` field
    //  was a multi-MB transfer that left the page on "⏳ Loading..." for
    //  many seconds on first visit (no localStorage cache yet).
    //  Phase 2 — fetch `data` in the background and enrich previews +
    //  vocab counts in place. Cards swap from "no preview" → "with
    //  preview" without re-blocking.
    try {
      var sb = getSupa();
      var metaRes = await sb.from('conversations_data')
        .select('id,name,ctx,cat,lvl')
        .order('created_at', {ascending: false});

      if (metaRes.error) throw metaRes.error;

      if (metaRes.data && metaRes.data.length) {
        var basicConvs = metaRes.data.map(function(row) {
          return _convRowToObj({
            _id: row.id, name: row.name || '', ctx: row.ctx || '',
            cat: row.cat, lvl: row.lvl,
            topic: '', thumb: null,
            preview: [], _msgCount: 0, _vocabCount: 0,
            cast_left_slug: null, cast_right_slug: null
          });
        });

        var oldIds0 = CONVS.map(function(c){return c._id;}).join(',');
        var newIds0 = basicConvs.map(function(c){return c._id;}).join(',');

        if (cached && cached.length) {
          // Cache already painted the rich version. Merge: keep cached
          // preview/counts for rows that still exist, drop rows the DB
          // no longer has.
          var byId = {};
          CONVS.forEach(function(c){ byId[c._id] = c; });
          CONVS = basicConvs.map(function(b) {
            var prev = byId[b._id];
            if (prev) {
              b.preview = prev.preview || [];
              b._msgCount = prev._msgCount || 0;
              b._vocabCount = prev._vocabCount || 0;
              b.topic = prev.topic || '';
              b.thumb = prev.thumb || null;
              b.cast_left_slug = prev.cast_left_slug || null;
              b.cast_right_slug = prev.cast_right_slug || null;
            }
            return b;
          });
          if (oldIds0 !== newIds0) renderCards(activeCat, activeLvl);
        } else {
          // First visit — render basic cards now (no preview yet).
          CONVS = basicConvs;
          renderCards(activeCat, activeLvl);
        }

        // Phase 2: pull `data` in the background and enrich.
        (async function _enrichConvData() {
          try {
            var dataRes = await sb.from('conversations_data')
              .select('id,data')
              .order('created_at', {ascending: false});
            if (dataRes.error) throw dataRes.error;
            var dataById = {};
            (dataRes.data || []).forEach(function(r){ dataById[r.id] = r.data || {}; });

            CONVS.forEach(function(c) {
              var d = dataById[c._id];
              if (!d) return;
              var msgs = d.msgs || [];
              var talkMsgs = msgs.filter(function(m){ return m.s !== 'n'; });
              c.preview = talkMsgs.slice(0,3).map(function(m) {
                return { who: (m.who || m.name || (m.s === 'l' ? 'A' : 'B')).slice(0,6), txt: (m.txt || '').slice(0,40) };
              });
              c._msgCount = talkMsgs.length;
              c._vocabCount = (d.vocab || []).length;
              c.topic = d.topic || c.topic || '';
              c.thumb = d.thumb || c.thumb || null;
              c.cast_left_slug = d.cast_left_slug || c.cast_left_slug || null;
              c.cast_right_slug = d.cast_right_slug || c.cast_right_slug || null;
              if (!c.name) c.name = d.name || '';
              if (!c.ctx)  c.ctx  = d.ctx  || '';
            });

            // Re-render so previews + vocab counts appear on the cards.
            renderCards(activeCat, activeLvl);

            // Refresh cache with enriched payload for instant next-load.
            try {
              var toCache = CONVS.map(function(c){
                return {_id:c._id, name:c.name, ctx:c.ctx, cat:c.cat, lvl:c.lvl, topic:c.topic, thumb:c.thumb, preview:c.preview, _msgCount:c._msgCount, _vocabCount:c._vocabCount, cast_left_slug:c.cast_left_slug, cast_right_slug:c.cast_right_slug};
              });
              localStorage.setItem(_CONV_CACHE_KEY, JSON.stringify(toCache));
            } catch(_) {}
          } catch(err) {
            console.warn('[conv] data enrich failed:', err && err.message);
          }
        })();
      } else if (!cached) {
        renderCards(activeCat, activeLvl);
      }
    } catch(e) {
      console.warn('DB 로드 실패:', e.message);
      if (!cached) renderCards(activeCat, activeLvl);
    }

    // URL ?id=DB_ID 또는 ?open=INDEX 로 특정 대화 자동 오픈
    var _params = new URLSearchParams(window.location.search);
    var _openId  = _params.get('id');
    var _openIdx = _params.get('open');
    if (_openId) {
      var _targetIdx = CONVS.findIndex(function(c){ return String(c._id) === String(_openId); });
      if (_targetIdx >= 0) setTimeout(function(){ openDetail(_targetIdx); }, 80);
    } else if (_openIdx !== null && CONVS[parseInt(_openIdx)]) {
      setTimeout(function(){ openDetail(parseInt(_openIdx)); }, 80);
    }
  })();

  // ── Filter bar (level pills only — categories surface via rails) ──
  var pills = document.getElementById('cat-pills');
  pills.querySelectorAll('.cf-tab[data-lvl]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      pills.querySelectorAll('.cf-tab[data-lvl]').forEach(function(b){b.classList.remove('on');});
      btn.classList.add('on');
      activeLvl = btn.dataset.lvl;
      renderCards(activeCat, activeLvl);
    });
  });
  // Honour ?cat=xxx deep-links by jumping straight to that rail's
  // flat grid — works even though we no longer surface a cat pill.
  var params = new URLSearchParams(window.location.search);
  var cp = params.get('cat');
  if (cp) _jumpToConvCat(cp);
})();
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDetail(); });

// ── BLANK FILL QUIZ ──────────────────────────────────────────
function startBlankQuiz() {
  var c = window._currentConv;
  if (!c) return;
  var msgs = (c.msgs || []);
  if (!msgs.length) { toast('No dialogue content found', 'warn'); return; }

  var vocab = (c.vocab || []).filter(function(v){ return v.ko && v.ko.length > 1; });
  if (!vocab.length) { toast('No vocabulary data available', 'warn'); return; }

  var questions = msgs.slice(0, 6).map(function(msg) {
    var text = msg.txt || msg.text || '';
    var used = vocab.find(function(v){ return text.includes(v.ko); });
    if (!used) return null;
    return { original: text, word: used.ko, en: used.en, who: msg.who||msg.name||'' };
  }).filter(Boolean).slice(0, 4);

  if (!questions.length) {
    // 단어가 대화에 없으면 단순 vocab 빈칸
    questions = vocab.slice(0, 4).map(function(v) {
      return { original: 'What does this mean? → ' + v.en, word: v.ko, en: v.en, who: '' };
    });
  }

  showQuizModal('blank', questions, c.name || '');
}

// ── ORDER QUIZ ────────────────────────────────────────────────
function startOrderQuiz() {
  var c = window._currentConv;
  if (!c) return;
  var msgs = (c.msgs || []).slice(0, 6);
  if (msgs.length < 3) { toast('Conversation is too short for this quiz', 'warn'); return; }

  var questions = [];
  // 3개씩 슬라이딩 윈도우로 순서 맞추기
  for (var i = 0; i + 2 < msgs.length; i++) {
    var group = msgs.slice(i, i+3);
    questions.push({ msgs: group });
    if (questions.length >= 3) break;
  }

  showQuizModal('order', questions, c.name || '');
}

// ── QUIZ MODAL ────────────────────────────────────────────────
var _quizAnswers = [];
var _quizScore = 0;
var _quizTotal = 0;
var _quizMode = '';
var _quizQuestions = [];
var _quizCurrent = 0;

function showQuizModal(mode, questions, title) {
  _quizMode = mode;
  _quizQuestions = questions;
  _quizCurrent = 0;
  _quizScore = 0;
  _quizTotal = questions.length;

  var overlay = document.getElementById('quiz-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'quiz-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:3000;display:flex;align-items:center;justify-content:center;padding:16px;';
    document.body.appendChild(overlay);
  }
  overlay.style.display = 'flex';
  renderQuizQuestion();
}

function renderQuizQuestion() {
  var overlay = document.getElementById('quiz-overlay');
  var q = _quizQuestions[_quizCurrent];
  var progress = (_quizCurrent / _quizTotal * 100).toFixed(0);

  var inner = '<div style="background:#fff;border-radius:24px;max-width:520px;width:100%;box-shadow:0 32px 80px rgba(15,23,42,.25);overflow:hidden;">'
    + '<div style="background:linear-gradient(135deg,#1d4ed8,#3b82f6);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;">'
    + '<div style="color:#fff;">'
    + '<div style="font-size:11px;font-weight:700;opacity:.8;letter-spacing:.08em;text-transform:uppercase;">' + (_quizMode==='blank'?'Blank Fill':'Word Order') + '</div>'
    + '<div style="font-size:15px;font-weight:700;margin-top:2px">' + (_quizCurrent+1) + ' / ' + _quizTotal + '</div>'
    + '</div>'
    + '<button aria-label="Close" onclick="closeQuiz()" style="background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;line-height:1;display:inline-flex;align-items:center;justify-content:center"><i data-lucide="x" class="kh-ui-icon" aria-hidden="true"></i></button>'
    + '</div>'
    + '<div style="height:4px;background:#e2e8f0;"><div style="height:4px;background:#3b82f6;width:'+progress+'%;transition:width .3s"></div></div>';

  if (_quizMode === 'blank') {
    inner += renderBlankQ(q);
  } else {
    inner += renderOrderQ(q);
  }

  inner += '</div>';
  overlay.innerHTML = inner;
}

function renderBlankQ(q) {
  var displayed = q.original.replace(q.word, '<span style="background:#dbeafe;color:#1d4ed8;border-radius:6px;padding:2px 10px;font-weight:700;">＿＿＿</span>');
  // 보기 만들기: 정답 + 오답 2개
  var allVocab = (window._currentConv && window._currentConv.data && window._currentConv.data.vocab) || [];
  var wrongs = allVocab.filter(function(v){ return v.ko !== q.word; }).slice(0,2).map(function(v){ return v.ko; });
  if (wrongs.length < 2) wrongs = ['아니요','그렇지만'].slice(0, 2-wrongs.length).concat(wrongs);
  var choices = [q.word].concat(wrongs).sort(function(){ return Math.random()-.5; });

  return '<div style="padding:24px 22px;">'
    + (q.who ? '<div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:8px;display:inline-flex;align-items:center;gap:5px"><i data-lucide="message-circle" class="kh-ui-icon kh-ui-icon-sm" aria-hidden="true"></i><span>' + q.who + '</span></div>' : '')
    + '<div style="font-size:16px;line-height:1.8;background:#f8fafc;border-radius:12px;padding:14px 16px;margin-bottom:18px;font-family:\'Noto Sans KR\',sans-serif;">' + displayed + '</div>'
    + '<div style="font-size:12px;color:#94a3b8;margin-bottom:10px;">( ' + q.en + ' )  ← hint</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'
    + choices.map(function(ch){
        return '<button onclick="checkBlank(\''+ch.replace(/'/g,"\\'")+'\')" style="padding:12px;border-radius:12px;border:2px solid #e2e8f0;background:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:\'Noto Sans KR\',sans-serif;transition:all .12s;" onmouseover="this.style.borderColor=\'#3b82f6\'" onmouseout="this.style.borderColor=\'#e2e8f0\'">'
          + ch + '</button>';
      }).join('')
    + '</div></div>';
}

function renderOrderQ(q) {
  var shuffled = q.msgs.slice().sort(function(){ return Math.random()-.5; });
  var html = '<div style="padding:24px 22px;">'
    + '<div style="font-size:13px;font-weight:700;color:#1d4ed8;margin-bottom:14px;">Drag to arrange in the correct order 👆</div>'
    + '<div id="order-list" style="display:flex;flex-direction:column;gap:8px;">';

  shuffled.forEach(function(msg, i) {
    html += '<div class="order-item" data-index="' + i + '" data-txt="' + (msg.txt||msg.text||'').replace(/"/g,'&quot;') + '" '
      + 'style="background:#fff;border:2px solid #e2e8f0;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:grab;user-select:none;font-family:\'Noto Sans KR\',sans-serif;"'
      + ' draggable="true" ontouchstart="orderTouch(event,this)" ondragstart="orderDrag(event,this)" ondragover="event.preventDefault()" ondrop="orderDrop(event,this)">'
      + '<span style="font-size:18px;opacity:.4">⠿</span>'
      + '<div><div style="font-size:11px;font-weight:700;color:#64748b;">' + (msg.who||msg.name||'') + '</div>'
      + '<div style="font-size:14px;margin-top:2px;">' + (msg.txt||msg.text||'') + '</div></div>'
      + '</div>';
  });

  html += '</div>'
    + '<button onclick="checkOrder()" style="width:100%;margin-top:16px;padding:13px;border-radius:14px;background:#2563eb;color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;">Check →</button>'
    + '</div>';

  return html;
}

var _dragSrc = null;
function orderDrag(e, el) { _dragSrc = el; e.dataTransfer.effectAllowed = 'move'; }
function orderDrop(e, el) {
  e.preventDefault();
  if (_dragSrc === el) return;
  var list = document.getElementById('order-list');
  var items = Array.from(list.children);
  var srcIdx = items.indexOf(_dragSrc);
  var tgtIdx = items.indexOf(el);
  if (srcIdx < tgtIdx) list.insertBefore(_dragSrc, el.nextSibling);
  else list.insertBefore(_dragSrc, el);
}

// 터치 드래그 (모바일)
var _touchEl = null, _touchClone = null;
function orderTouch(e, el) {
  _touchEl = el;
  e.target.style.opacity = '.5';
  document.addEventListener('touchmove', onTouchMove, {passive:false});
  document.addEventListener('touchend', onTouchEnd, {once:true});
}
function onTouchMove(e) {
  e.preventDefault();
  var t = e.touches[0];
  var list = document.getElementById('order-list');
  if (!list) return;
  Array.from(list.children).forEach(function(item) {
    var r = item.getBoundingClientRect();
    if (t.clientY > r.top && t.clientY < r.bottom && item !== _touchEl) {
      var midY = r.top + r.height/2;
      if (t.clientY < midY) list.insertBefore(_touchEl, item);
      else list.insertBefore(_touchEl, item.nextSibling);
    }
  });
}
function onTouchEnd(e) {
  if (_touchEl) _touchEl.style.opacity = '1';
  document.removeEventListener('touchmove', onTouchMove);
}

function checkBlank(choice) {
  var q = _quizQuestions[_quizCurrent];
  var correct = choice === q.word;
  if (correct) _quizScore++;
  showFeedback(correct, q.word, nextQuizQuestion);
}

function checkOrder() {
  var q = _quizQuestions[_quizCurrent];
  var list = document.getElementById('order-list');
  if (!list) return;
  var items = Array.from(list.children);
  var correct = true;
  q.msgs.forEach(function(msg, i) {
    var itemTxt = items[i] && (items[i].dataset.txt || '');
    if (itemTxt !== (msg.txt || msg.text || '')) correct = false;
  });
  if (correct) _quizScore++;
  showFeedback(correct, null, nextQuizQuestion);
}

function showFeedback(correct, answer, next) {
  var overlay = document.getElementById('quiz-overlay');
  var inner = overlay.querySelector('div');
  if (!inner) return;
  var fb = document.createElement('div');
  fb.style.cssText = 'padding:20px 22px;background:' + (correct?'#f0fdf4':'#fef2f2') + ';border-top:1px solid ' + (correct?'#bbf7d0':'#fecaca') + ';text-align:center;';
  fb.innerHTML = '<div style="display:inline-flex;width:32px;height:32px;color:'+(correct?'#a78bfa':'#fbbf24')+'"><i data-lucide="' + (correct?'party-popper':'frown') + '" class="kh-ui-icon" style="width:32px;height:32px" aria-hidden="true"></i></div>'
    + '<div style="font-size:16px;font-weight:700;color:' + (correct?'#15803d':'#b91c1c') + ';margin:6px 0">' + (correct?'Correct!':'Not quite') + '</div>'
    + (answer && !correct ? '<div style="font-size:14px;color:#64748b;">Answer: <b>' + escapeHtml(answer) + '</b></div>' : '')
    + '<button onclick="nextQuizQuestion()" style="margin-top:14px;padding:10px 24px;border-radius:12px;background:#2563eb;color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">Next →</button>';

  // 기존 버튼 비활성화
  inner.querySelectorAll('button:not([onclick="closeQuiz()"])').forEach(function(b){ b.disabled=true; b.style.opacity='.5'; });
  inner.appendChild(fb);
}

function nextQuizQuestion() {
  _quizCurrent++;
  if (_quizCurrent >= _quizTotal) {
    showQuizResult();
  } else {
    renderQuizQuestion();
  }
}

function showQuizResult() {
  var overlay = document.getElementById('quiz-overlay');
  var pct = Math.round(_quizScore / _quizTotal * 100);
  var iconName = pct >= 80 ? 'trophy' : pct >= 60 ? 'thumbs-up' : 'library';
  var iconColor = pct >= 80 ? '#fde68a' : pct >= 60 ? '#22c55e' : '#a78bfa';
  var emoji = '<i data-lucide="' + iconName + '" class="kh-ui-icon" style="width:48px;height:48px;color:' + iconColor + '" aria-hidden="true"></i>';

  // 데일리 미션 퀴즈 카운트
  if (typeof dmTrackQuiz === 'function') dmTrackQuiz();
  // grammar stats 기록 + 완료 처리
  if (supaUser && typeof getSupa === 'function') {
    try {
      var _sb = getSupa();
      var _conv = window._currentConv;
      if (_sb && _conv) {
        _sb.rpc('log_quiz_result', {
          p_user_id:      supaUser.id,

async function saveInlineEdit(rowId) {
  var errEl = document.getElementById('ie-error');
  errEl.style.display = 'none';
  try {
    var catVal = document.getElementById('ie-cat').value;
    var catLabelMap = {everyday:'Everyday',work:'Workplace',friends:'Friends',family:'Family',dating:'Dating'};
    var msgsText = document.getElementById('ie-msgs').value.trim();
    var msgs = msgsText.split('\n').filter(function(l){ return l.trim(); }).map(function(line){
      var isB = /^B:/i.test(line.trim());
      return {s: isB?'r':'l', who: isB?'B':'A', txt: line.replace(/^[AB]:\s*/i,'').trim()};
    });
    if (!msgs.length) throw new Error('Please enter dialogue content');

    var c = window._currentConv;
    var thumbVal = document.getElementById('ie-thumb').value.trim();
    var updatedData = Object.assign({}, c, {
      name:     document.getElementById('ie-name').value.trim(),
      ctx:      document.getElementById('ie-ctx').value.trim(),
      avi:      document.getElementById('ie-avi').value.trim() || '💬',
      cat:      catVal,
      lvl:      document.getElementById('ie-lvl').value,
      catLabel: catLabelMap[catVal] || catVal,
      thumb:    thumbVal || null,
      msgs:     msgs,
    });

    var sb = getSupa();
    var { error } = await sb.from('conversations_data').update({
      data: updatedData,
      name: updatedData.name,
      ctx:  updatedData.ctx,
      cat:  updatedData.cat,
      lvl:  updatedData.lvl,
    }).eq('id', rowId);
    if (error) throw error;

    // 로컬 CONVS 업데이트
    var idx = CONVS.findIndex(function(x){ return x._id === rowId; });
    if (idx >= 0) CONVS[idx] = Object.assign({}, updatedData, {_id: rowId});
    window._currentConv = Object.assign({}, updatedData, {_id: rowId});

    document.getElementById('conv-inline-edit').remove();
    showConvToast('✅ Saved!');
    renderCards(activeCat, activeLvl);
  } catch(e) {
    errEl.textContent = e.message || String(e);
    errEl.style.display = 'block';
  }
}

async function uploadConvThumb(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var sb = getSupa();
  if (!sb) { toast('Connection not ready — please retry', 'error'); return; }
  var ext = file.name.split('.').pop().toLowerCase();
  var path = 'conversations/' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
  try {
    var { error } = await sb.storage.from('article-images').upload(path, file, { cacheControl:'3600', upsert:true });
    if (error) throw error;
    var { data: urlData } = sb.storage.from('article-images').getPublicUrl(path);
    var url = urlData && urlData.publicUrl;
    if (url) {
      document.getElementById('ie-thumb').value = url;
      showConvToast('✅ Uploaded');
    }
  } catch(e) {
    khAlert('Upload failed', e.message || 'Please try again.');
  }
}

function showConvToast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#0f172a;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:700;z-index:99999;font-family:inherit';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2500);
}


function closeInlineEdit() { var e = document.getElementById('conv-inline-edit'); if(e) e.remove(); }

<script>
(function(){
  window.toggleSave = async function(btn) {
    var item = btn.closest('.dp-vocab-item');
    if (!item) return;
    var ko = (item.querySelector('.dp-vi-ko')||{}).textContent || '';
    var rom = (item.querySelector('.dp-vi-rom')||{}).textContent || '';
    var en = (item.querySelector('.dp-vi-en')||{}).textContent || '';
    btn.classList.toggle('saved');
    btn.textContent = btn.classList.contains('saved') ? '✓ Saved' : '+ Save';
    try {
      if (!window.getSupa) return;
      var sb = getSupa(); if (!sb) return;
      var sessionRes = await sb.auth.getSession();
      var user = sessionRes && sessionRes.data && sessionRes.data.session && sessionRes.data.session.user;
      if (!user) {
        var key = 'kh_saved_words_guest';
        var arr = JSON.parse(localStorage.getItem(key) || '[]');
        if (btn.classList.contains('saved')) {
          if (!arr.find(function(x){ return x.word_ko === ko; })) arr.push({ word_ko: ko, word_rom: rom, word_en: en });
        } else {
          arr = arr.filter(function(x){ return x.word_ko !== ko; });
        }
        localStorage.setItem(key, JSON.stringify(arr));
        return;
      }
      if (btn.classList.contains('saved')) {
        await sb.from('user_saved_words').upsert({ user_id: user.id, word_key: ko, word_ko: ko, word_rom: rom, word_en: en }, { onConflict: 'user_id,word_key' });
      } else {
        await sb.from('user_saved_words').delete().eq('user_id', user.id).eq('word_ko', ko);
      }
    } catch (e) { console.warn('save vocab failed', e); }
  };

  window.startOrderQuiz = function() {
    var c = window._currentConv;
    if (!c) return;
    var msgs = (c.msgs || []).slice(0, 10);
    if (!msgs.length) { toast('No conversation lines found', 'warn'); return; }
    var questions = [];
    msgs.forEach(function(msg) {
      var raw = (msg.txt || msg.text || '').trim();
      if (!raw) return;
      var sentence = raw.split(/[.!?]/)[0].trim();
      var words = sentence.split(/\s+/).filter(Boolean);
      if (words.length < 2 || words.length > 6) return;
      questions.push({ sentence: sentence, words: words, who: msg.who || msg.name || '' });
    });
    if (!questions.length) { toast('No usable sentence for word order quiz', 'warn'); return; }
    window._orderAttempt = 0;
    showQuizModal('order', questions.slice(0, 4), c.name || '');
  };

  window.renderOrderQ = function(q) {
    var shuffled = q.words.slice().sort(function(){ return Math.random() - .5; });
    q._shuffled = shuffled; q._selected = [];
    var html = '<div style="padding:24px 22px;">'
      + '<div style="font-size:13px;font-weight:800;color:#1d4ed8;margin-bottom:8px;">Word Order Quiz</div>'
      + (q.who ? '<div style="font-size:12px;color:#64748b;margin-bottom:14px;">Line from <b>' + q.who + '</b></div>' : '')
      + '<div style="font-size:13px;color:#64748b;line-height:1.65;margin-bottom:14px;">Tap the chunks in the correct Korean word order.</div>'
      + '<div id="order-answer" style="min-height:64px;border:2px dashed #cfe0ff;background:#f8fbff;border-radius:14px;padding:12px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;"></div>'
      + '<div id="order-bank" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;">';
    shuffled.forEach(function(word, i){
      html += '<button type="button" id="order-word-' + i + '" onclick="pickOrderWord(' + i + ')" style="padding:12px 14px;border-radius:14px;border:1.5px solid #dbe6f7;background:#fff;color:#0f172a;font-size:15px;font-weight:800;cursor:pointer;font-family:\'Noto Sans KR\',sans-serif;">' + word + '</button>';
    });
    html += '</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;">'
      + '<button onclick="resetOrderSelection()" style="padding:11px 16px;border-radius:12px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;">Reset</button>'
      + '<button onclick="checkOrder()" style="padding:11px 18px;border-radius:12px;background:#2563eb;color:#fff;border:none;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;">Check answer</button>'
      + '</div></div>';
    return html;
  };

  window.pickOrderWord = function(idx){
    var q = _quizQuestions[_quizCurrent]; if (!q) return;
    q._selected = q._selected || []; if (q._selected.indexOf(idx) !== -1) return;
    q._selected.push(idx); renderOrderSelection();
  };
  window.renderOrderSelection = function(){
    var q = _quizQuestions[_quizCurrent]; if (!q) return;
    var answerEl = document.getElementById('order-answer'); if (!answerEl) return;
    var selectedWords = (q._selected || []).map(function(i){ return q._shuffled[i]; });
    answerEl.innerHTML = selectedWords.length ? selectedWords.map(function(word){ return '<span style="display:inline-flex;padding:9px 12px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:14px;font-weight:800;">' + escapeHtml(word) + '</span>'; }).join('') : '<div style="font-size:13px;color:#94a3b8;">Your answer will appear here.</div>';
    (q._shuffled || []).forEach(function(_, i){
      var btn = document.getElementById('order-word-' + i); if (!btn) return;
      var used = (q._selected || []).indexOf(i) !== -1; btn.disabled = used; btn.style.opacity = used ? '.45' : '1';
    });
  };
  window.resetOrderSelection = function(){ var q = _quizQuestions[_quizCurrent]; if (!q) return; q._selected = []; renderOrderSelection(); };
  window.analyzeWordUnit = function(word){
    word = String(word || '').trim();
    if (/(은|는)$/.test(word)) return { text: word, role: 'topic' };
    if (/(이|가)$/.test(word)) return { text: word, role: 'subject' };
    if (/(을|를)$/.test(word)) return { text: word, role: 'object' };
    if (/(에|에서|에게|한테|로|으로|부터|까지)$/.test(word)) return { text: word, role: 'adverbial' };
    if (/(다|요|니다|했다|한다|해요|했어요|이에요|예요|입니다)$/.test(word)) return { text: word, role: 'predicate' };
    return { text: word, role: 'other' };
  };
  window.detectOrderMistakes = function(correctWords, answerWords){
    var mistakes = []; if (!answerWords.length) return [{ code: 'empty_answer' }];
    var answerAnalysis = answerWords.map(analyzeWordUnit);
    var predIdx = answerAnalysis.findIndex(function(x){ return x.role === 'predicate'; });
    if (predIdx !== -1 && predIdx !== answerAnalysis.length - 1) mistakes.push({ code: 'predicate_not_final' });
    answerAnalysis.forEach(function(unit, idx){
      if (unit.role === 'object' && predIdx !== -1 && idx > predIdx) mistakes.push({ code: 'object_after_predicate', word: unit.text });
      if ((unit.role === 'topic' || unit.role === 'subject') && idx > 0) mistakes.push({ code: 'topic_subject_late', word: unit.text });
      if (unit.role === 'adverbial' && predIdx !== -1 && idx > predIdx) mistakes.push({ code: 'adverbial_after_predicate', word: unit.text });
    });
    if (!mistakes.length && answerWords.join(' ') !== correctWords.join(' ')) mistakes.push({ code: 'far_from_expected' });
    return mistakes;
  };
  window.buildAttemptSpecificExplanation = function(correctWords, answerWords){
    window._orderAttempt = (window._orderAttempt || 0) + 1;
    var mistakes = detectOrderMistakes(correctWords, answerWords), lines = [];
    mistakes.forEach(function(m){
      if (m.code === 'empty_answer') lines.push('You need to place the chunks in an order before checking.');
      if (m.code === 'predicate_not_final') lines.push('In Korean, the predicate usually comes at the end of the sentence.');
      if (m.code === 'object_after_predicate') lines.push((m.word || 'The object') + ' has an object marker, so it should usually come before the predicate.');
      if (m.code === 'topic_subject_late') lines.push((m.word || 'The topic/subject') + ' usually appears earlier in the sentence.');
      if (m.code === 'adverbial_after_predicate') lines.push((m.word || 'That chunk') + ' works better before the predicate in normal Korean word order.');
      if (m.code === 'far_from_expected') lines.push('A more natural Korean order is topic/subject → object/adverbial → predicate.');
    });
    if (window._orderAttempt >= 2) lines.push('Basic pattern: subject or topic first, object in the middle, and the verb or adjective at the end.');
    return lines.filter(function(v,i,a){ return a.indexOf(v)===i; }).slice(0,2).join('<br>');
  };

  var origShowQuizModal = window.showQuizModal;
  window.showQuizModal = function(mode, questions, title){
    if (mode === 'order') window._orderAttempt = 0;
    origShowQuizModal(mode, questions, title);
    if (mode === 'order') setTimeout(function(){ try { renderOrderSelection(); } catch(e){} }, 0);
  };

  window.checkOrder = function() {
    var q = _quizQuestions[_quizCurrent]; if (!q) return;
    var answer = (q._selected || []).map(function(i){ return q._shuffled[i]; });
    var correctWords = q.words || [];
    var correct = answer.join(' ') === correctWords.join(' ');
    if (correct) _quizScore++;
    var explanation = correct ? '' : buildAttemptSpecificExplanation(correctWords, answer);
    showFeedback(correct, null, nextQuizQuestion, explanation, correctWords.join(' '));
  };

  window.showFeedback = function(correct, answer, next, explanation, correctSentence) {
    var overlay = document.getElementById('quiz-overlay');
    var inner = overlay.querySelector('div'); if (!inner) return;
    var fb = document.createElement('div');
    fb.style.cssText = 'padding:20px 22px;background:' + (correct?'#f0fdf4':'#fef2f2') + ';border-top:1px solid ' + (correct?'#bbf7d0':'#fecaca') + ';text-align:center;';
    fb.innerHTML = '<div style="display:inline-flex;width:32px;height:32px;color:'+(correct?'#a78bfa':'#fbbf24')+'"><i data-lucide="' + (correct?'party-popper':'frown') + '" class="kh-ui-icon" style="width:32px;height:32px" aria-hidden="true"></i></div>'
      + '<div style="font-size:16px;font-weight:800;color:' + (correct?'#15803d':'#b91c1c') + ';margin:6px 0">' + (correct?'Correct!':'Not quite.') + '</div>'
      + (answer && !correct ? '<div style="font-size:14px;color:#64748b;">Answer: <b>' + escapeHtml(answer) + '</b></div>' : '')
      + (correctSentence && !correct ? '<div style="font-size:14px;color:#475569;margin-top:6px;">Correct order: <b>' + correctSentence + '</b></div>' : '')
      + (explanation && !correct ? '<div style="margin-top:12px;padding:12px 14px;background:#fff;border:1px solid #fecaca;border-radius:12px;font-size:13px;line-height:1.7;color:#7f1d1d;text-align:left;"><b style="display:block;margin-bottom:4px;">Why this order works</b>' + explanation + '</div>' : '')
      + '<button onclick="nextQuizQuestion()" style="margin-top:14px;padding:10px 24px;border-radius:12px;background:#2563eb;color:#fff;border:none;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;">Next</button>';
    inner.querySelectorAll('button:not([onclick="closeQuiz()"])').forEach(function(b){ b.disabled=true; b.style.opacity='.5'; });
    inner.appendChild(fb);
  };

  window.showQuizResult = function() {
    var overlay = document.getElementById('quiz-overlay');
    var pct = Math.round(_quizScore / _quizTotal * 100);
    var iconName = pct >= 80 ? 'trophy' : pct >= 60 ? 'thumbs-up' : 'library';
  var iconColor = pct >= 80 ? '#fde68a' : pct >= 60 ? '#22c55e' : '#a78bfa';
  var emoji = '<i data-lucide="' + iconName + '" class="kh-ui-icon" style="width:48px;height:48px;color:' + iconColor + '" aria-hidden="true"></i>';

    // 데일리 미션 퀴즈 카운트
    if (typeof dmTrackQuiz === 'function') dmTrackQuiz();
    if (supaUser && typeof getSupa === 'function') {
      try {
        var _sb = getSupa();
        var _s = window._currentStory;
        if (_sb && _s) {
          _sb.rpc('log_quiz_result', {
            p_user_id:      supaUser.id,
            p_quiz_type:    'story_blank',
            p_content_type: 'story',
            p_content_id:   String(_s.id || ''),
            p_is_correct:   pct >= 60
          }).catch(function(){});
          // 퀴즈까지 풀었으면 completed=true
          _sb.rpc('log_read_event', {
            p_user_id:      supaUser.id,
            p_content_type: 'story',
            p_content_id:   String(_s.id || ''),
            p_title:        _s.title || '',
            p_level:        _s.lvl   || '',
            p_category:     _s.mood  || '',
            p_completed:    true
          }).catch(function(){});
        }
      } catch(e) {}
    }
    overlay.innerHTML = '<div style="background:#fff;border-radius:24px;max-width:400px;width:100%;padding:40px 32px;text-align:center;box-shadow:0 32px 80px rgba(15,23,42,.25);">'
      + '<div style="font-size:56px;margin-bottom:12px">' + emoji + '</div>'
      + '<div style="font-size:24px;font-weight:900;color:#0f172a;margin-bottom:6px">' + _quizScore + ' / ' + _quizTotal + ' correct</div>'
      + '<div style="font-size:15px;color:#64748b;margin-bottom:24px">' + (pct>=80?'Excellent work. You understood the conversation well.':pct>=60?'Nice work. A bit more practice will help.':'Read the conversation again and try one more time 💪') + '</div>'
      + '<div style="display:flex;gap:10px;justify-content:center;">'
      + '<button onclick="closeQuiz()" style="padding:12px 20px;border-radius:12px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">Close</button>'
      + '<button onclick="retryQuiz()" style="padding:12px 20px;border-radius:12px;background:#2563eb;color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">Try again</button>'
      + '</div></div>';
  };
})();
</script>
