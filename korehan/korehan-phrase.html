<script>
// Today's Phrase — one dark card: phrase → translation → meaning (EN + KO)
// → when to use → 2 examples → this week's phrases, Save / I know this one
// at the bottom.
//
// Phrases with thin metadata are lazy-filled via Claude once and cached
// locally + back to app_settings.phrases for signed-in users.

var PHRASE_FILL_CACHE_KEY = 'kh_phrase_fill_v2';
var SAVED_PHRASES_KEY = 'kh_saved_phrases_v1';
var MASTERED_PHRASES_KEY = 'kh_mastered_phrases_v1';
var PHRASE_VIEW_LOG_KEY = 'kh_phrase_view_log_v1';

function _getMasteredPhrases() {
  try { return JSON.parse(localStorage.getItem(MASTERED_PHRASES_KEY) || '[]'); }
  catch(_) { return []; }
}
function _isPhraseMastered(ko) {
  if (!ko) return false;
  return _getMasteredPhrases().indexOf(ko) >= 0;
}
function _togglePhraseMastered(ko) {
  if (!ko) return false;
  var list = _getMasteredPhrases();
  var idx = list.indexOf(ko);
  if (idx >= 0) list.splice(idx, 1);
  else list.unshift(ko);
  try { localStorage.setItem(MASTERED_PHRASES_KEY, JSON.stringify(list.slice(0, 500))); } catch(_) {}
  if (typeof khTrackUser === 'function') {
    try { khTrackUser(idx < 0 ? 'phrase_mastered' : 'phrase_unmastered', { ko: ko }); } catch(_) {}
  }
  return idx < 0;
}

// Lightweight phrase-view log for the "This week" strip. One entry per
// KST date when the user opens any phrase. Stored locally only.
function _logPhraseViewToday() {
  try {
    var raw = localStorage.getItem(PHRASE_VIEW_LOG_KEY);
    var log = raw ? JSON.parse(raw) : { dates: [] };
    if (!log || typeof log !== 'object') log = { dates: [] };
    var today = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);  // KST day
    if (log.dates.indexOf(today) < 0) {
      log.dates.unshift(today);
      log.dates = log.dates.slice(0, 60); // keep two months
      localStorage.setItem(PHRASE_VIEW_LOG_KEY, JSON.stringify(log));
    }
    return log;
  } catch(_) { return { dates: [] }; }
}
function escapeText(s) { return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function _phraseLocalFill() {
  try { return JSON.parse(localStorage.getItem(PHRASE_FILL_CACHE_KEY) || '{}'); }
  catch(_) { return {}; }
}
function _phraseStashLocal(key, data) {
  try {
    var all = _phraseLocalFill();
    all[key] = data;
    localStorage.setItem(PHRASE_FILL_CACHE_KEY, JSON.stringify(all));
  } catch(_) {}
}

// Saved phrases — local list keyed by Korean text. Tied into the
// bottom CTA + bookmark icon. Persists across sessions; later we can
// sync to Supabase too.
function _getSavedPhrases() {
  try { return JSON.parse(localStorage.getItem(SAVED_PHRASES_KEY) || '[]'); }
  catch(_) { return []; }
}
function _isPhraseSaved(ko) {
  if (!ko) return false;
  var list = _getSavedPhrases();
  return list.some(function(p){ return (p && p.ko) === ko; });
}
function _togglePhraseSaved(phrase) {
  if (!phrase || !phrase.ko) return false;
  var list = _getSavedPhrases();
  var idx = list.findIndex(function(p){ return (p && p.ko) === phrase.ko; });
  if (idx >= 0) {
    list.splice(idx, 1);
  } else {
    list.unshift({
      ko: phrase.ko,
      rom: phrase.rom || '',
      en: phrase.en || '',
      saved_at: new Date().toISOString(),
    });
  }
  try { localStorage.setItem(SAVED_PHRASES_KEY, JSON.stringify(list.slice(0, 200))); } catch(_) {}
  // Mirror the toggle to the user_saved_phrases table so the
  // collection survives a localStorage wipe / device swap. The
  // localStorage write above is the source of truth for the
  // current tab — DB sync is fire-and-forget. Owner-reported
  // "db 저장하라고 그렇게 말했는데 또 사라져있네".
  try {
    var sb = (typeof getSupa === 'function') ? getSupa() : null;
    var u  = (typeof supaUser !== 'undefined') ? supaUser : null;
    if (sb && u && phrase.ko) {
      if (idx >= 0) {
        sb.from('user_saved_phrases').delete()
          .eq('user_id', u.id).eq('source_type', 'phrase').eq('source_id', phrase.ko)
          .then(function(){}, function(){});
      } else {
        // No unique constraint backs (user_id, source_type, source_id,
        // msg_idx), so an upsert with onConflict was rejected (42P10) and
        // nothing was ever saved. Insert unless the row already exists.
        sb.from('user_saved_phrases').select('id')
          .eq('user_id', u.id).eq('source_type', 'phrase').eq('source_id', phrase.ko).limit(1)
          .then(function(r) {
            if (r.error) throw r.error;
            if (r.data && r.data.length) return null;
            return sb.from('user_saved_phrases').insert({
              user_id:     u.id,
              source_type: 'phrase',
              source_id:   phrase.ko,
              msg_idx:     null,
              ko:          phrase.ko,
              en:          phrase.en || '',
            }).then(function(ins) { if (ins.error) throw ins.error; });
          })
          .then(function(){}, function(e) {
            console.warn('[phrase] save failed', e);
            if (typeof showToast === 'function') showToast('Could not save to your account — saved on this device only.', true);
          });
      }
    }
  } catch(_){}
  if (typeof khTrackUser === 'function') {
    try { khTrackUser(idx >= 0 ? 'phrase_unsaved' : 'phrase_saved', { ko: phrase.ko }); } catch(_) {}
  }
  return idx < 0;
}

function isPhraseIncomplete(p) {
  // Only truly empty phrases get an AI fill. Short hand-written meanings
  // ("Extremely busy.") are intended — filling them produced long essays.
  if (!p) return true;
  var noExamples = !Array.isArray(p.examples) || !p.examples.some(function(e){ return e && e.ko; });
  return !p.intro || noExamples;
}

async function _fillPhraseViaClaude(phrase) {
  if (typeof callClaude !== 'function') return null;
  var prompt =
      'You are creating learner-facing content for ONE specific Korean phrase / proverb / idiom.\n\n'
    + 'Phrase: ' + phrase.ko + '\n'
    + 'Romanization: ' + (phrase.rom || '(generate)') + '\n'
    + 'Existing English gloss: ' + (phrase.en || '(generate a natural one)') + '\n\n'
    + 'Return ONLY a JSON object — no preamble, no code fences:\n'
    + '{\n'
    + '  "intro_ko": "ONE short Korean sentence (~25 chars max, ~해요체) — what it means. No cultural commentary.",\n'
    + '  "intro": "ONE short English sentence (~15 words max) — direct gloss of the meaning.",\n'
    + '  "nuance": "ONE short English sentence (~15 words max) — when/where Koreans say this. Skip if it duplicates intro.",\n'
    + '  "level": "Seed | Sprout | Tree | Forest — which TOPIK tier this phrase fits (Seed=basic words, Forest=advanced literary).",\n'
    + '  "examples": [\n'
    + '    {"ko":"natural Korean sentence USING the phrase, max 25 chars","en":"English translation"},\n'
    + '    {"ko":"different context using the phrase","en":"…"}\n'
    + '  ],\n'
    + '  "related": ["idiom 1","idiom 2"]\n'
    + '}\n\n'
    + 'Rules:\n'
    + '- intro_ko / intro / nuance MUST be specific to "' + phrase.ko + '" — do NOT echo back generic learner-platform copy.\n'
    + '- examples MUST contain the exact phrase (or a natural conjugated form) and be fully grammatical Korean.\n'
    + '- related: EXACTLY 0-2 entries (NEVER more than 2). Each MUST be a real Korean 관용구 (idiom) or 속담 (proverb) — a fixed multi-word expression you would find in a Korean idiom dictionary, not a literal noun phrase like "불가능한 일" or "어려운 목표". RIGHT examples for 하늘의 별 따기: 낙타가 바늘구멍 들어가기, 하늘이 두 쪽 나도. WRONG: 불가능한 일 (literal noun phrase, not an idiom). Each related entry must convey the SAME core meaning as "' + phrase.ko + '" and be substitutable in conversation. If you cannot find at least 2 real idioms/proverbs that strongly match, return FEWER (even an empty array []) — DO NOT pad with literal phrases or weak matches.';
  var res = await callClaude({
    feature: 'phrase-content-fill',
    model: 'claude-haiku-4-5-20251001',
    max_tokens: 700,
    messages: [{ role: 'user', content: prompt }]
  });
  var raw = (res && res.content && res.content[0] && res.content[0].text) || '';
  var clean = raw.replace(/^```json?/, '').replace(/^```/, '').replace(/```$/, '').trim();
  var oi = clean.indexOf('{'), ei = clean.lastIndexOf('}');
  if (oi < 0 || ei <= oi) throw new Error('no JSON');
  var data = JSON.parse(clean.slice(oi, ei + 1));
  // Sanitise related: drop entries that are the phrase itself, drop
  // duplicates, drop near-empty strings.
  var phraseStripped = String(phrase.ko || '').replace(/\s+/g,'').trim();
  var seen = {};
  var related = Array.isArray(data.related) ? data.related
    .map(function(s){ return String(s || '').trim(); })
    .filter(function(s){
      if (!s || s.length < 3) return false;
      var stripped = s.replace(/\s+/g,'');
      if (stripped === phraseStripped) return false;
      if (seen[stripped]) return false;
      seen[stripped] = true;
      return true;
    })
    .slice(0, 2) : [];
  return {
    intro_ko: typeof data.intro_ko === 'string' ? data.intro_ko : '',
    intro: typeof data.intro === 'string' ? data.intro : '',
    nuance: typeof data.nuance === 'string' ? data.nuance : '',
    level: ['Seed','Sprout','Tree','Forest'].indexOf(data.level) >= 0 ? data.level : '',
    examples: Array.isArray(data.examples) ? data.examples
      .map(function(e){ return { ko: (e && e.ko || '').trim(), en: (e && e.en || '').trim() }; })
      .filter(function(e){ return e.ko; }).slice(0, 3) : [],
    related: related,
  };
}

async function _ensurePhraseFilled(phrase) {
  if (!isPhraseIncomplete(phrase)) return phrase;
  var cacheKey = (phrase.ko || '').trim();
  if (!cacheKey) return phrase;
  var localAll = _phraseLocalFill();
  if (localAll[cacheKey]) {
    return _mergePhraseFill(phrase, localAll[cacheKey]);
  }
  try {
    var fill = await _fillPhraseViaClaude(phrase);
    if (!fill) return phrase;
    _phraseStashLocal(cacheKey, fill);
    try {
      if (typeof supaUser !== 'undefined' && supaUser && typeof saveSharedPhrases === 'function'
          && typeof getPhraseSourceRows === 'function') {
        var rows = getPhraseSourceRows().slice();
        var idx = rows.findIndex(function(r){ return (r && (r.ko || '').trim()) === cacheKey; });
        if (idx >= 0) {
          rows[idx] = Object.assign({}, rows[idx], fill);
          await saveSharedPhrases(rows);
        }
      }
    } catch(_) {}
    return _mergePhraseFill(phrase, fill);
  } catch(e) {
    console.warn('[phrase] AI fill failed', e);
    return phrase;
  }
}

function _mergePhraseFill(phrase, fill) {
  if (!fill) return phrase;
  var merged = Object.assign({}, phrase);
  if (fill.intro_ko && !phrase.intro_ko) merged.intro_ko = fill.intro_ko;
  if (fill.intro && (!phrase.intro || phrase.intro.length < 24)) merged.intro = fill.intro;
  if (fill.nuance && (!phrase.nuance || phrase.nuance.length < 24)) merged.nuance = fill.nuance;
  if (fill.level && !phrase.level) merged.level = fill.level;
  if (Array.isArray(fill.examples) && fill.examples.length
      && (!phrase.examples || !phrase.examples.length)) {
    merged.examples = fill.examples;
  }
  // related: ALWAYS overwrite when the fresh fill has them. Lazy fill
  // only runs when isPhraseIncomplete is true (intro/nuance/examples
  // missing) — meaning admin didn't curate this phrase manually, so
  // AI is the only source. Without this overwrite, bad related from
  // the previous loose-prompt run would survive forever in DB.
  if (Array.isArray(fill.related) && fill.related.length) {
    merged.related = fill.related;
  } else if (fill.related && !fill.related.length) {
    // AI explicitly returned [] — better to show nothing than the
    // loose stale list.
    merged.related = [];
  }
  return merged;
}

// Phrase illustration registry — moved to js/core/phrases.js so
// My Phrases / future gallery surfaces reuse the same regex → image
// mapping. We re-export the globals as locals to keep the rest of
// this file unchanged.
var PHRASE_ILLUS_MAP = window.PHRASE_ILLUS_MAP || [];
var PHRASE_DEFAULT_ILLUS = window.PHRASE_DEFAULT_ILLUS || { lottie: 'lottie/book.json', icon: 'fluent-emoji-flat:open-book' };

function _phraseIllusEntry(phrase) {
  if (typeof window.getPhraseIllusEntry === 'function') {
    return window.getPhraseIllusEntry(phrase);
  }
  var hay = ((phrase && phrase.ko) || '') + ' ' + ((phrase && phrase.en) || '');
  for (var i = 0; i < PHRASE_ILLUS_MAP.length; i++) {
    if (PHRASE_ILLUS_MAP[i].rx.test(hay)) return PHRASE_ILLUS_MAP[i];
  }
  return PHRASE_DEFAULT_ILLUS;
}

function speakKorean(text, btn) {
  if (!text) return;
  if (typeof speakHangul === 'function') {
    try { speakHangul(text); return; } catch(_) {}
  }
  if (typeof window.speechSynthesis !== 'undefined') {
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.rate = 0.92;
      if (typeof window.khTtsWarm === 'function') window.khTtsWarm(window.speechSynthesis);
      window.speechSynthesis.speak(u);
    } catch(_) {}
  }
  if (btn) {
    btn.style.transform = 'scale(.92)';
    setTimeout(function(){ btn.style.transform = ''; }, 140);
  }
}
window.speakKorean = speakKorean;

window.toggleSavePhrase = function() {
  var phrase = window._currentPhrase;
  if (!phrase) return;
  var nowSaved = _togglePhraseSaved(phrase);
  // Re-render so both the bookmark icon AND the bottom CTA reflect state.
  renderPhraseLayout(phrase, window._currentPhraseOpts || {});
  if (typeof toast === 'function') {
    toast(nowSaved ? 'Saved to My Phrases' : 'Removed from My Phrases', false);
  }
};

window.toggleMasteredPhrase = function() {
  var phrase = window._currentPhrase;
  if (!phrase || !phrase.ko) return;
  var nowMastered = _togglePhraseMastered(phrase.ko);
  renderPhraseLayout(phrase, window._currentPhraseOpts || {});
  if (typeof toast === 'function') {
    toast(nowMastered ? 'Marked as known' : 'Back in your study list', false);
  }
};

// KST day number / date key — the phrase rotation and the view log both
// run on Korean days so "today" matches the home card.
function _kpDayNum(offsetDays) { return Math.floor((Date.now() + 9 * 3600000) / 86400000) - (offsetDays || 0); }
function _kpDayKey(dayNum) { return new Date(dayNum * 86400000).toISOString().slice(0, 10); }
function _kpIdxForDay(dayNum, len) {
  var off = (typeof getPhraseRotationOffset === 'function') ? getPhraseRotationOffset() : 0;
  return ((dayNum + off) % len + len) % len;
}
var _KP_WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var _KP_MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

// Wrap the phrase inside an example sentence (exact match only).
function _kpMark(sentence, ko) {
  var s = escapeText(sentence), k = escapeText(ko || '');
  var at = k ? s.indexOf(k) : -1;
  return at < 0 ? s : s.slice(0, at) + '<mark>' + k + '</mark>' + s.slice(at + k.length);
}
function _kpSpeakBtn(text, label) {
  return '<button type="button" class="kp-spk" aria-label="' + label + '" onclick="speakKorean(\''
    + String(text || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;') + '\', this)">'
    + khIcon('volume-2') + '</button>';
}

function renderPhraseLayout(phrase, opts) {
  opts = opts || {};
  window._currentPhrase = phrase;
  window._currentPhraseOpts = opts;
  var root = document.getElementById('phrase-root');
  if (!root) return;
  var saved = _isPhraseSaved(phrase.ko);
  var mastered = _isPhraseMastered(phrase.ko);
  var examples = (phrase.examples || []).filter(function (e) { return e && e.ko; }).slice(0, 2);
  var lvl = phrase.level ? ' · ' + escapeText(phrase.level) : '';

  // Banner: hand-drawn image when one exists, otherwise a quiet night-sky
  // strip (CSS only) carrying the date label.
  var entry = _phraseIllusEntry(phrase);
  var bg = entry && entry.image ? ' style="background-image:url(\'' + escapeText(entry.image + '?v=20260505l') + '\')"' : '';
  var banner = '<div class="kp-banner' + (bg ? ' has-img' : '') + '"' + bg + '><span>' + escapeText(opts.label || "Today's phrase") + '</span></div>';

  var adminEdit = (window._isAdmin && opts.idx != null)
    ? '<a class="kp-admin" href="korehan-x9f4k2m7-phrases.html?edit=' + opts.idx + '">Edit</a>' : '';

  var meaning = '';
  if (phrase.intro || phrase.intro_ko || opts.generating) {
    meaning = '<div class="kp-mean">' + (phrase.intro ? escapeText(phrase.intro) : (opts.generating ? 'Summarizing the meaning…' : '')) + '</div>'
      + (phrase.intro_ko ? '<div class="kp-mean-ko" lang="ko">' + escapeText(phrase.intro_ko) + '</div>' : '');
  }
  var use = phrase.nuance && phrase.nuance !== phrase.intro
    ? '<div class="kp-sec">When to use it</div><div class="kp-use">' + escapeText(phrase.nuance) + '</div>' : '';
  var ex = examples.length
    ? '<div class="kp-sec">Examples</div>' + examples.map(function (e) {
        return '<div class="kp-ex"><div class="kp-ex-row"><p lang="ko">' + _kpMark(e.ko, phrase.ko) + '</p>' + _kpSpeakBtn(e.ko, 'Listen to example') + '</div>'
          + (e.en ? '<small>' + escapeText(e.en) + '</small>' : '') + '</div>';
      }).join('')
    : (opts.generating ? '<div class="kp-sec">Examples</div><div class="kp-use">Generating examples…</div>' : '');

  // This week: the last 7 KST days of the rotation, tap to revisit.
  var week = '';
  var len = opts.total | 0;
  if (len > 1) {
    var seen = (_logPhraseViewToday().dates || []);
    var cells = [];
    for (var k = 6; k >= 0; k--) {
      var dn = _kpDayNum(k), di = _kpIdxForDay(dn, len), key = _kpDayKey(dn);
      var d = new Date(dn * 86400000);
      var cls = (seen.indexOf(key) >= 0 ? ' on' : '') + (k === 0 ? ' today' : '') + (di === opts.idx ? ' cur' : '');
      cells.push('<a class="kp-day' + cls + '" href="korehan-phrase.html' + (k === 0 ? '' : '?i=' + di) + '">'
        + '<b>' + (k === 0 ? 'Today' : _KP_WD[d.getUTCDay()]) + '</b><small>' + d.getUTCDate() + '</small></a>');
    }
    week = '<div class="kp-sec">This week</div><div class="kp-week">' + cells.join('') + '</div>';
  }

  root.innerHTML = ''
    + '<div class="kp-wrap">'
    +   banner
    +   adminEdit
    +   '<div class="kp-phr"><h1 lang="ko">' + escapeText(phrase.ko) + '</h1>' + _kpSpeakBtn(phrase.ko, 'Listen')
    +     '<button type="button" class="kp-save' + (saved ? ' on' : '') + '" onclick="toggleSavePhrase()" aria-pressed="' + saved + '">' + khIcon('bookmark') + '<span>' + (saved ? 'Saved' : 'Save') + '</span></button>'
    +   '</div>'
    +   (phrase.rom || lvl ? '<div class="kp-rom">' + escapeText(phrase.rom) + lvl + '</div>' : '')
    +   (phrase.en ? '<div class="kp-lit">' + escapeText(phrase.en) + '</div>' : '')
    +   meaning + use + ex
    +   '<button type="button" class="kp-know' + (mastered ? ' on' : '') + '" onclick="toggleMasteredPhrase()">'
    +     (mastered ? khIcon('check') + '<span>You know this one</span>' : '<span>I know this one</span>') + '</button>'
    +   week
    + '</div>';

  document.title = phrase.ko + ' — KoreHani Phrase';
  if (typeof khTrackUser === 'function') {
    try { khTrackUser('phrase_view', { ko: phrase.ko, idx: opts.idx, level: phrase.level || null }); } catch (_) {}
  }
}

function _kpPick(phrases) {
  var params = new URLSearchParams(location.search);
  var today = _kpIdxForDay(_kpDayNum(0), phrases.length);
  var idx = today;
  if (params.has('q')) {
    var q = params.get('q');
    var f = phrases.findIndex(function (p) { return (p.ko || '') === q; });
    if (f >= 0) idx = f;
  } else if (params.has('i')) {
    var n = Number(params.get('i'));
    if (Number.isFinite(n) && n >= 0 && n < phrases.length) idx = n;
  }
  var label = "Today's phrase";
  var now = new Date(_kpDayNum(0) * 86400000);
  if (idx === today) label += ' · ' + _KP_MON[now.getUTCMonth()] + ' ' + now.getUTCDate();
  else {
    for (var k = 1; k <= 6; k++) {
      if (_kpIdxForDay(_kpDayNum(k), phrases.length) === idx) {
        var d = new Date(_kpDayNum(k) * 86400000);
        label = 'Phrase · ' + _KP_WD[d.getUTCDay()] + ', ' + _KP_MON[d.getUTCMonth()] + ' ' + d.getUTCDate();
        break;
      }
    }
    if (label === "Today's phrase") label = 'Phrase';
  }
  return { idx: idx, label: label };
}

var _kpRenderSeq = 0;
async function renderPhrasePage() {
  var root = document.getElementById('phrase-root');
  if (!root) return;
  var seq = ++_kpRenderSeq;
  // Paint from the local copy right away, then again once the DB list
  // (app_settings.phrases) arrives — the local copy can be an old, short list.
  var phrases = (typeof getPhrases === 'function') ? getPhrases() : [];
  if (typeof getPhrasesAsync === 'function') {
    var fresh = getPhrasesAsync().then(null, function () { return null; });
    if (!phrases.length || phrases.length < 8) {
      root.innerHTML = '<div class="kp-wrap"><div class="kp-use">Loading…</div></div>';
      var r = await fresh;
      if (r && r.length) phrases = r;
    } else {
      fresh.then(function (rows) {
        if (seq !== _kpRenderSeq || !rows || !rows.length) return;
        // Repaint when anything about the shown phrase changed (an admin edit or a
        // new banner image keeps the same ko and list length).
        var next = rows[_kpPick(rows).idx], cur = phrases[_kpPick(phrases).idx];
        if (rows.length !== phrases.length || JSON.stringify(next) !== JSON.stringify(cur)) renderPhrasePage();
      });
    }
  }
  if (seq !== _kpRenderSeq) return;
  if (!phrases.length) { root.innerHTML = '<div class="kp-wrap"><div class="kp-use">No phrase found.</div></div>'; return; }

  _logPhraseViewToday();
  var pick = _kpPick(phrases);
  var phrase = phrases[pick.idx] || phrases[0];
  var renderOpts = { idx: pick.idx, label: pick.label, total: phrases.length };
  var needsFill = isPhraseIncomplete(phrase);
  renderPhraseLayout(phrase, Object.assign({}, renderOpts, { generating: needsFill }));
  if (needsFill) {
    try {
      var filled = await _ensurePhraseFilled(phrase);
      if (seq === _kpRenderSeq) renderPhraseLayout(filled, renderOpts);
    } catch (e) { console.warn('[phrase] fill failed', e); }
  }
}

// Pull DB-side saved phrases on load and merge into localStorage so
// the bookmark icon reflects the user's full saved set, not just
// whatever was on this device. Fire-and-forget — render still
// happens immediately off the local cache.
async function _khHydrateSavedPhrasesFromDB() {
  try {
    var sb = (typeof getSupa === 'function') ? getSupa() : null;
    var u  = (typeof supaUser !== 'undefined') ? supaUser : null;
    if (!sb || !u) return;
    var r = await sb.from('user_saved_phrases')
      .select('ko,en,saved_at')
      .eq('user_id', u.id)
      .eq('source_type', 'phrase')
      .order('saved_at', { ascending: false })
      .limit(200);
    if (r.error || !r.data) return;
    var local = _getSavedPhrases();
    var seen  = Object.create(null);
    local.forEach(function (p) { if (p && p.ko) seen[p.ko] = true; });
    var merged = local.slice();
    r.data.forEach(function (row) {
      if (!row || !row.ko || seen[row.ko]) return;
      seen[row.ko] = true;
      merged.push({
        ko: row.ko, rom: '', en: row.en || '',
        saved_at: row.created_at || new Date().toISOString(),
      });
    });
    if (merged.length !== local.length) {
      try { localStorage.setItem(SAVED_PHRASES_KEY, JSON.stringify(merged.slice(0, 200))); } catch(_) {}
      // Re-render so the CTA / bookmark reflect the merged state.
      try { renderPhrasePage(); } catch(_){}
    }
  } catch(_){}
}

document.addEventListener('DOMContentLoaded', function () {
  renderPhrasePage();
  // Ticks "Today's phrase" in the home Today card (KST day key).
  try { localStorage.setItem('kh_phrase_seen_' + new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10), '1'); } catch (_) {}
  _khHydrateSavedPhrasesFromDB();
});
</script>
