<script>
// Today's Phrase — dark, mobile-first reader.
//
// Layout matches the iOS-mockup the user shared: level pill, big white
// phrase headline, blue translation, two dark cards (Meaning, Example)
// with optional decorative illustration in the corner of the meaning
// card, fixed bottom gradient CTA pill ("+ Add to My Phrases" / saved).
//
// AI fill flow from the previous version still applies: when a phrase
// is admin-saved with thin metadata we lazy-fill via Claude and cache
// the result locally + back to app_settings.phrases for signed-in
// users.

// Cache key bumped to v2 — v1 stored loose AI-generated related
// expressions (e.g. 하늘의 별 따기 paired with 등잔 밑이 어둡다 which
// is about a completely different concept). The new prompt enforces
// strict semantic match; bumping the key invalidates stale entries
// so users see clean data on next load.
var PHRASE_FILL_CACHE_KEY = 'kh_phrase_fill_v2';
var SAVED_PHRASES_KEY = 'kh_saved_phrases_v1';
var MASTERED_PHRASES_KEY = 'kh_mastered_phrases_v1';
var PHRASE_VIEW_LOG_KEY = 'kh_phrase_view_log_v1';

function _getMasteredPhrases() {
  try { return JSON.parse(localStorage.getItem(MASTERED_PHRASES_KEY) || '[]'); }
  catch(_) { return []; }
}
function _isPhraseMastered(ko) {
  if (!ko) return false;
  return _getMasteredPhrases().indexOf(ko) >= 0;
}
function _togglePhraseMastered(ko) {
  if (!ko) return false;
  var list = _getMasteredPhrases();
  var idx = list.indexOf(ko);
  if (idx >= 0) list.splice(idx, 1);
  else list.unshift(ko);
  try { localStorage.setItem(MASTERED_PHRASES_KEY, JSON.stringify(list.slice(0, 500))); } catch(_) {}
  if (typeof khTrackUser === 'function') {
    try { khTrackUser(idx < 0 ? 'phrase_mastered' : 'phrase_unmastered', { ko: ko }); } catch(_) {}
  }
  return idx < 0;
}

// Lightweight phrase-view log so we can show a "Day N" streak in the
// motivation strip. One entry per UTC date when the user opens any
// phrase. Stored locally only.
function _logPhraseViewToday() {
  try {
    var raw = localStorage.getItem(PHRASE_VIEW_LOG_KEY);
    var log = raw ? JSON.parse(raw) : { dates: [] };
    if (!log || typeof log !== 'object') log = { dates: [] };
    var today = new Date().toISOString().slice(0, 10);
    if (log.dates.indexOf(today) < 0) {
      log.dates.unshift(today);
      log.dates = log.dates.slice(0, 60); // keep two months
      localStorage.setItem(PHRASE_VIEW_LOG_KEY, JSON.stringify(log));
    }
    return log;
  } catch(_) { return { dates: [] }; }
}
function _phraseStreakFromLog(log) {
  if (!log || !Array.isArray(log.dates) || !log.dates.length) return 0;
  var streak = 0;
  var d = new Date();
  for (var i = 0; i < 60; i++) {
    var key = d.toISOString().slice(0, 10);
    if (log.dates.indexOf(key) >= 0) { streak++; d.setUTCDate(d.getUTCDate() - 1); }
    else break;
  }
  return streak;
}

function escapeText(s) { return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function _phraseLocalFill() {
  try { return JSON.parse(localStorage.getItem(PHRASE_FILL_CACHE_KEY) || '{}'); }
  catch(_) { return {}; }
}
function _phraseStashLocal(key, data) {
  try {
    var all = _phraseLocalFill();
    all[key] = data;
    localStorage.setItem(PHRASE_FILL_CACHE_KEY, JSON.stringify(all));
  } catch(_) {}
}

// Saved phrases — local list keyed by Korean text. Tied into the
// bottom CTA + bookmark icon. Persists across sessions; later we can
// sync to Supabase too.
function _getSavedPhrases() {
  try { return JSON.parse(localStorage.getItem(SAVED_PHRASES_KEY) || '[]'); }
  catch(_) { return []; }
}
function _isPhraseSaved(ko) {
  if (!ko) return false;
  var list = _getSavedPhrases();
  return list.some(function(p){ return (p && p.ko) === ko; });
}
function _togglePhraseSaved(phrase) {
  if (!phrase || !phrase.ko) return false;
  var list = _getSavedPhrases();
  var idx = list.findIndex(function(p){ return (p && p.ko) === phrase.ko; });
  if (idx >= 0) {
    list.splice(idx, 1);
  } else {
    list.unshift({
      ko: phrase.ko,
      rom: phrase.rom || '',
      en: phrase.en || '',
      saved_at: new Date().toISOString(),
    });
  }
  try { localStorage.setItem(SAVED_PHRASES_KEY, JSON.stringify(list.slice(0, 200))); } catch(_) {}
  if (typeof khTrackUser === 'function') {
    try { khTrackUser(idx >= 0 ? 'phrase_unsaved' : 'phrase_saved', { ko: phrase.ko }); } catch(_) {}
  }
  return idx < 0;
}

function isPhraseIncomplete(p) {
  if (!p) return true;
  var thinIntro   = !p.intro   || p.intro.length   < 24;
  var thinNuance  = !p.nuance  || p.nuance.length  < 24;
  var weakExamples = !Array.isArray(p.examples) || !p.examples.length
    || p.examples.every(function(e){ return !e || !e.ko || e.ko.length < 8; });
  return thinIntro || thinNuance || weakExamples;
}

async function _fillPhraseViaClaude(phrase) {
  if (typeof callClaude !== 'function') return null;
  var prompt =
      'You are creating learner-facing content for ONE specific Korean phrase / proverb / idiom.\n\n'
    + 'Phrase: ' + phrase.ko + '\n'
    + 'Romanization: ' + (phrase.rom || '(generate)') + '\n'
    + 'Existing English gloss: ' + (phrase.en || '(generate a natural one)') + '\n\n'
    + 'Return ONLY a JSON object — no preamble, no code fences:\n'
    + '{\n'
    + '  "intro_ko": "ONE short Korean sentence (~25 chars max, ~해요체) — what it means. No cultural commentary.",\n'
    + '  "intro": "ONE short English sentence (~15 words max) — direct gloss of the meaning.",\n'
    + '  "nuance": "ONE short English sentence (~15 words max) — when/where Koreans say this. Skip if it duplicates intro.",\n'
    + '  "level": "Seed | Sprout | Tree | Forest — which TOPIK tier this phrase fits (Seed=basic words, Forest=advanced literary).",\n'
    + '  "examples": [\n'
    + '    {"ko":"natural Korean sentence USING the phrase, max 25 chars","en":"English translation"},\n'
    + '    {"ko":"different context using the phrase","en":"…"}\n'
    + '  ],\n'
    + '  "related": ["idiom 1","idiom 2"]\n'
    + '}\n\n'
    + 'Rules:\n'
    + '- intro_ko / intro / nuance MUST be specific to "' + phrase.ko + '" — do NOT echo back generic learner-platform copy.\n'
    + '- examples MUST contain the exact phrase (or a natural conjugated form) and be fully grammatical Korean.\n'
    + '- related: EXACTLY 0-2 entries (NEVER more than 2). Each MUST be a real Korean 관용구 (idiom) or 속담 (proverb) — a fixed multi-word expression you would find in a Korean idiom dictionary, not a literal noun phrase like "불가능한 일" or "어려운 목표". RIGHT examples for 하늘의 별 따기: 낙타가 바늘구멍 들어가기, 하늘이 두 쪽 나도. WRONG: 불가능한 일 (literal noun phrase, not an idiom). Each related entry must convey the SAME core meaning as "' + phrase.ko + '" and be substitutable in conversation. If you cannot find at least 2 real idioms/proverbs that strongly match, return FEWER (even an empty array []) — DO NOT pad with literal phrases or weak matches.';
  var res = await callClaude({
    feature: 'phrase-content-fill',
    model: 'claude-haiku-4-5-20251001',
    max_tokens: 700,
    messages: [{ role: 'user', content: prompt }]
  });
  var raw = (res && res.content && res.content[0] && res.content[0].text) || '';
  var clean = raw.replace(/^```json?/, '').replace(/^```/, '').replace(/```$/, '').trim();
  var oi = clean.indexOf('{'), ei = clean.lastIndexOf('}');
  if (oi < 0 || ei <= oi) throw new Error('no JSON');
  var data = JSON.parse(clean.slice(oi, ei + 1));
  // Sanitise related: drop entries that are the phrase itself, drop
  // duplicates, drop near-empty strings.
  var phraseStripped = String(phrase.ko || '').replace(/\s+/g,'').trim();
  var seen = {};
  var related = Array.isArray(data.related) ? data.related
    .map(function(s){ return String(s || '').trim(); })
    .filter(function(s){
      if (!s || s.length < 3) return false;
      var stripped = s.replace(/\s+/g,'');
      if (stripped === phraseStripped) return false;
      if (seen[stripped]) return false;
      seen[stripped] = true;
      return true;
    })
    .slice(0, 2) : [];
  return {
    intro_ko: typeof data.intro_ko === 'string' ? data.intro_ko : '',
    intro: typeof data.intro === 'string' ? data.intro : '',
    nuance: typeof data.nuance === 'string' ? data.nuance : '',
    level: ['Seed','Sprout','Tree','Forest'].indexOf(data.level) >= 0 ? data.level : '',
    examples: Array.isArray(data.examples) ? data.examples
      .map(function(e){ return { ko: (e && e.ko || '').trim(), en: (e && e.en || '').trim() }; })
      .filter(function(e){ return e.ko; }).slice(0, 3) : [],
    related: related,
  };
}

// Per-session memo so we don't re-call Claude for the same phrase
// twice within a tab while the DB write is propagating.
window._khRelatedRefreshedSession = window._khRelatedRefreshedSession || {};

// Tighten-up pass for ALREADY-complete phrases whose `related` was
// generated under the old loose-match prompt. Triggers when the
// phrase has related entries but no `related_v: 3` marker. One
// short Claude call per phrase per session, then persisted to DB
// for everyone else.
async function _ensureRelatedFresh(phrase) {
  if (!phrase || !phrase.ko) return phrase;
  if (phrase.related_v === 3) return phrase;
  // Only applies when there ARE existing related entries that could
  // be stale. If admin left it empty there's nothing to clean up.
  if (!Array.isArray(phrase.related) || !phrase.related.length) return phrase;
  if (typeof callClaude !== 'function') return phrase;
  if (window._khRelatedRefreshedSession[phrase.ko]) return phrase;
  window._khRelatedRefreshedSession[phrase.ko] = true;

  var prompt =
      'Korean phrase: ' + phrase.ko + '\n'
    + (phrase.en ? 'Meaning: ' + phrase.en + '\n' : '')
    + '\n'
    + 'Return ONLY a JSON object — no preamble, no code fences:\n'
    + '{ "related": ["idiom 1", "idiom 2"] }\n\n'
    + 'Rules:\n'
    + '- EXACTLY 0-2 entries (NEVER more than 2).\n'
    + '- Each entry MUST be a real Korean 관용구 (idiom) or 속담 (proverb) — a fixed multi-word expression you would find in a Korean idiom dictionary. NOT literal noun phrases like "불가능한 일" or "어려운 목표".\n'
    + '- Each idiom must convey the SAME core meaning as "' + phrase.ko + '" and be substitutable in conversation. RIGHT for 하늘의 별 따기: 낙타가 바늘구멍 들어가기. WRONG: 불가능한 일 (literal noun phrase, not an idiom).\n'
    + '- If you cannot find 2 real idioms/proverbs with strong semantic match, return FEWER or [] — DO NOT pad with loose / literal phrases.\n'
    + '- No commentary, no romanization, just the Korean expressions.';

  try {
    var res = await callClaude({
      feature: 'phrase-related-refresh',
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 300,
      messages: [{ role: 'user', content: prompt }]
    });
    var raw = (res && res.content && res.content[0] && res.content[0].text) || '';
    var clean = raw.replace(/^```json?/, '').replace(/^```/, '').replace(/```$/, '').trim();
    var oi = clean.indexOf('{'), ei = clean.lastIndexOf('}');
    if (oi < 0 || ei <= oi) throw new Error('no JSON');
    var data = JSON.parse(clean.slice(oi, ei + 1));

    var phraseStripped = String(phrase.ko || '').replace(/\s+/g,'').trim();
    var seen = {};
    var related = Array.isArray(data.related) ? data.related
      .map(function(s){ return String(s || '').trim(); })
      .filter(function(s){
        if (!s || s.length < 3) return false;
        var stripped = s.replace(/\s+/g,'');
        if (stripped === phraseStripped) return false;
        if (seen[stripped]) return false;
        seen[stripped] = true;
        return true;
      })
      .slice(0, 2) : [];

    var merged = Object.assign({}, phrase, { related: related, related_v: 3 });

    // Persist back to the shared queue so other users (and our next
    // page load) see the cleaned data.
    try {
      if (typeof supaUser !== 'undefined' && supaUser
          && typeof saveSharedPhrases === 'function'
          && typeof getPhraseSourceRows === 'function') {
        var rows = getPhraseSourceRows().slice();
        var koTrim = String(phrase.ko || '').trim();
        var i = rows.findIndex(function(r){ return (r && (r.ko || '').trim()) === koTrim; });
        if (i >= 0) {
          rows[i] = Object.assign({}, rows[i], { related: related, related_v: 3 });
          await saveSharedPhrases(rows);
        }
      }
    } catch(_) {}

    return merged;
  } catch(e) {
    console.warn('[phrase] related refresh failed', e);
    return phrase;
  }
}

async function _ensurePhraseFilled(phrase) {
  if (!isPhraseIncomplete(phrase)) return phrase;
  var cacheKey = (phrase.ko || '').trim();
  if (!cacheKey) return phrase;
  var localAll = _phraseLocalFill();
  if (localAll[cacheKey]) {
    return _mergePhraseFill(phrase, localAll[cacheKey]);
  }
  try {
    var fill = await _fillPhraseViaClaude(phrase);
    if (!fill) return phrase;
    _phraseStashLocal(cacheKey, fill);
    try {
      if (typeof supaUser !== 'undefined' && supaUser && typeof saveSharedPhrases === 'function'
          && typeof getPhraseSourceRows === 'function') {
        var rows = getPhraseSourceRows().slice();
        var idx = rows.findIndex(function(r){ return (r && (r.ko || '').trim()) === cacheKey; });
        if (idx >= 0) {
          rows[idx] = Object.assign({}, rows[idx], fill);
          await saveSharedPhrases(rows);
        }
      }
    } catch(_) {}
    return _mergePhraseFill(phrase, fill);
  } catch(e) {
    console.warn('[phrase] AI fill failed', e);
    return phrase;
  }
}

function _mergePhraseFill(phrase, fill) {
  if (!fill) return phrase;
  var merged = Object.assign({}, phrase);
  if (fill.intro_ko && !phrase.intro_ko) merged.intro_ko = fill.intro_ko;
  if (fill.intro && (!phrase.intro || phrase.intro.length < 24)) merged.intro = fill.intro;
  if (fill.nuance && (!phrase.nuance || phrase.nuance.length < 24)) merged.nuance = fill.nuance;
  if (fill.level && !phrase.level) merged.level = fill.level;
  if (Array.isArray(fill.examples) && fill.examples.length
      && (!phrase.examples || !phrase.examples.length)) {
    merged.examples = fill.examples;
  }
  // related: ALWAYS overwrite when the fresh fill has them. Lazy fill
  // only runs when isPhraseIncomplete is true (intro/nuance/examples
  // missing) — meaning admin didn't curate this phrase manually, so
  // AI is the only source. Without this overwrite, bad related from
  // the previous loose-prompt run would survive forever in DB.
  if (Array.isArray(fill.related) && fill.related.length) {
    merged.related = fill.related;
  } else if (fill.related && !fill.related.length) {
    // AI explicitly returned [] — better to show nothing than the
    // loose stale list.
    merged.related = [];
  }
  return merged;
}

// Phrase illustration registry — moved to js/core/phrases.js so
// My Phrases / future gallery surfaces reuse the same regex → image
// mapping. We re-export the globals as locals to keep the rest of
// this file unchanged.
var PHRASE_ILLUS_MAP = window.PHRASE_ILLUS_MAP || [];
var PHRASE_DEFAULT_ILLUS = window.PHRASE_DEFAULT_ILLUS || { lottie: 'lottie/book.json', icon: 'fluent-emoji-flat:open-book', fallback: '📖' };

function _phraseIllusEntry(phrase) {
  if (typeof window.getPhraseIllusEntry === 'function') {
    return window.getPhraseIllusEntry(phrase);
  }
  var hay = ((phrase && phrase.ko) || '') + ' ' + ((phrase && phrase.en) || '');
  for (var i = 0; i < PHRASE_ILLUS_MAP.length; i++) {
    if (PHRASE_ILLUS_MAP[i].rx.test(hay)) return PHRASE_ILLUS_MAP[i];
  }
  return PHRASE_DEFAULT_ILLUS;
}

// Track which lottie paths we've confirmed exist (or 404'd) so we
// don't HEAD-fetch on every render.
var _phraseLottieKnown = {};

function _phraseRenderIllus(entry) {
  if (!entry) return '';
  // When the entry has a hand-drawn image, render it as a CSS
  // background-image on the banner — no <img> element means no
  // broken-image icon if the file is missing or still propagating
  // through the CDN. The banner's gradient acts as the natural
  // fallback layer underneath. image-rendering: pixelated on the
  // container keeps pixel art crisp at any container size.
  if (entry.image) {
    var imgUrl = entry.image + '?v=20260505l';
    return '<div class="kh-phrase-hero-img-wrap" style="background-image:url(\'' + escapeText(imgUrl) + '\')" role="img" aria-label="phrase illustration">'
      +    '<div class="kh-phrase-hero-fade" aria-hidden="true"></div>'
      +  '</div>';
  }
  // Three-tier illustration: Lottie JSON → Iconify SVG (Fluent Emoji)
  // → unicode emoji fallback nested as iconify-icon's child so the
  // banner is never empty if the CDN is slow/blocked.
  var fallbackEmoji = entry.fallback || '';
  return '<div class="kh-phrase-hero-illus" data-lottie="' + escapeText(entry.lottie || '') + '" data-fallback-icon="' + escapeText(entry.icon || '') + '" data-fallback-emoji="' + escapeText(fallbackEmoji) + '">'
    + (entry.icon
        ? '<iconify-icon icon="' + escapeText(entry.icon) + '" width="100%" height="100%" aria-hidden="true">' + escapeText(fallbackEmoji) + '</iconify-icon>'
        : escapeText(fallbackEmoji))
    + '</div>';
}

// Try to load Lottie JSON for an illustration slot. Probe only once
// per path per page-load. If Lottie + JSON both exist, replace the
// Iconify fallback with the animated player.
async function _phraseHydrateLottie() {
  var slots = document.querySelectorAll('.kh-phrase-hero-illus[data-lottie]');
  if (!slots.length || typeof window.lottie === 'undefined') return;
  for (var i = 0; i < slots.length; i++) {
    var slot = slots[i];
    var path = slot.getAttribute('data-lottie') || '';
    if (!path) continue;
    if (_phraseLottieKnown[path] === false) continue; // already 404'd
    try {
      if (_phraseLottieKnown[path] !== true) {
        var head = await fetch(path, { method: 'HEAD' });
        if (!head.ok) { _phraseLottieKnown[path] = false; continue; }
        _phraseLottieKnown[path] = true;
      }
      slot.innerHTML = '';
      window.lottie.loadAnimation({
        container: slot,
        path: path,
        renderer: 'svg',
        loop: true,
        autoplay: true,
      });
    } catch(_) {
      _phraseLottieKnown[path] = false;
    }
  }
}

// Map level → CSS modifier.
var LEVEL_CLASS = {
  Seed:'lvl-seed', Sprout:'lvl-sprout', Tree:'lvl-tree', Forest:'lvl-forest',
};
var LEVEL_LABEL = {
  Seed:'Seed Level', Sprout:'Sprout Level', Tree:'Tree Level', Forest:'Forest Level',
};

function speakKorean(text, btn) {
  if (!text) return;
  if (typeof speakHangul === 'function') {
    try { speakHangul(text); return; } catch(_) {}
  }
  if (typeof window.speechSynthesis !== 'undefined') {
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.rate = 0.92;
      window.speechSynthesis.speak(u);
    } catch(_) {}
  }
  if (btn) {
    btn.style.transform = 'scale(.92)';
    setTimeout(function(){ btn.style.transform = ''; }, 140);
  }
}
window.speakKorean = speakKorean;

// Cycle through the available examples, one per page-load (random
// but stable for the rest of the session).
var _exampleIdx = 0;
function pickExampleIdx(arr) {
  if (!arr || !arr.length) return -1;
  if (_exampleIdx >= arr.length) _exampleIdx = 0;
  return _exampleIdx;
}

window.cyclePhraseExample = function() {
  var btn = document.getElementById('ph-cycle-btn');
  if (btn) { btn.style.transform = 'rotate(180deg)'; setTimeout(function(){ btn.style.transform=''; }, 240); }
  _exampleIdx++;
  // Re-render the example card region only.
  var phrase = window._currentPhrase;
  if (!phrase) return;
  renderPhraseLayout(phrase, window._currentPhraseOpts || {});
};

window.toggleSavePhrase = function() {
  var phrase = window._currentPhrase;
  if (!phrase) return;
  var nowSaved = _togglePhraseSaved(phrase);
  // Re-render so both the bookmark icon AND the bottom CTA reflect state.
  renderPhraseLayout(phrase, window._currentPhraseOpts || {});
  if (typeof toast === 'function') {
    toast(nowSaved ? '내 표현에 저장됐어요 ❤️' : '저장 해제됨', false);
  }
};

window.toggleMasteredPhrase = function() {
  var phrase = window._currentPhrase;
  if (!phrase || !phrase.ko) return;
  var nowMastered = _togglePhraseMastered(phrase.ko);
  renderPhraseLayout(phrase, window._currentPhraseOpts || {});
  if (typeof toast === 'function') {
    toast(nowMastered ? '🎉 마스터했어요!' : '다시 학습 목록에 들어왔어요', false);
  }
};

window.startPhraseStudy = function() {
  if (typeof khTrackUser === 'function') {
    var phrase = window._currentPhrase || {};
    try { khTrackUser('phrase_study_start', { ko: phrase.ko }); } catch(_) {}
  }
  location.href = 'korehan-study-room.html';
};

function renderPhraseLayout(phrase, opts) {
  opts = opts || {};
  window._currentPhrase = phrase;
  window._currentPhraseOpts = opts;
  var root = document.getElementById('phrase-root');
  if (!root) return;
  var examples = (phrase.examples || []).filter(function(e){ return e && e.ko; });
  var exIdx = pickExampleIdx(examples);
  var ex = exIdx >= 0 ? examples[exIdx] : null;

  var levelKey = phrase.level || '';
  // Level pill removed from the user-facing eyebrow — the user found
  // it noisy and not useful for casual reading. The level value is
  // still tracked in analytics + admin queue.
  var saved = _isPhraseSaved(phrase.ko);
  var mastered = _isPhraseMastered(phrase.ko);
  var streak = opts.streak | 0;
  var dayCounter = (typeof opts.dayLabel === 'string') ? opts.dayLabel : '';

  var illusEntry = _phraseIllusEntry(phrase);

  // ── Editorial layout — mirrors the article reader card style:
  // white card on cream container, navy serif headline, italic Playfair
  // English subtitle, byline-style meta strip, sectioned body. No more
  // dark-mode takeover, no more iOS-style fixed CTA bar.
  var heroBanner = ''
    + '<div class="kh-phrase-hero-banner">'
    +   _phraseRenderIllus(illusEntry)
    + '</div>';

  var statusPill = opts.generating
    ? '<span class="kh-phrase-loading-pill" aria-live="polite">분석 채우는 중</span>'
    : '';

  var eyebrow = ''
    + '<div class="kh-phrase-eyebrow">'
    +   '<span class="kh-phrase-eyebrow-cat">Phrase of the Day</span>'
    +   statusPill
    + '</div>';

  var headline = '<h1 class="kh-phrase-headline">' + escapeText(phrase.ko) + '</h1>';
  var subtitle = phrase.en
    ? '<p class="kh-phrase-subtitle">' + escapeText(phrase.en) + '</p>'
    : '';
  var rom = phrase.rom
    ? '<p class="kh-phrase-rom">' + escapeText(phrase.rom) + '</p>'
    : '';

  // Byline-style meta — replaces the flashy chip strip. Treats
  // streak/day counter/master toggle like newspaper byline metadata.
  var bylineParts = [];
  if (dayCounter) bylineParts.push('<span>' + escapeText(dayCounter) + '</span>');
  if (streak > 0) bylineParts.push('<span><svg class="kh-phrase-streak-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5.5C13.5 4 11 5.5 9.5 7.5c-1.7 2.4-2 5.5-.5 8 1.6 2.7 5 4 8 3 3.2-1 5-3.7 5-7 0-3.4-2-6-4-8 0 2-1 4-2.5 5C13.8 9 14 6.5 13.5.5z"/></svg> ' + streak + 'd streak</span>');
  bylineParts.push('<button type="button" class="kh-phrase-master-btn ' + (mastered ? 'on' : '') + '" onclick="toggleMasteredPhrase()" aria-pressed="' + (mastered ? 'true' : 'false') + '">'
    + (mastered
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="11" height="11"><polyline points="20 6 9 17 4 12"/></svg> Mastered'
        : 'Mark as mastered')
    + '</button>');
  var byline = '<div class="kh-phrase-byline">' + bylineParts.join('<span class="kh-phrase-byline-dot">·</span>') + '</div>';

  // ── Body sections.
  var hasIntroKo  = !!(phrase.intro_ko && phrase.intro_ko.trim());
  var hasIntroEn  = !!(phrase.intro    && phrase.intro.trim());
  var hasNuance   = !!(phrase.nuance   && phrase.nuance.trim() && phrase.nuance !== phrase.intro);

  var meaningSection = '';
  if (hasIntroKo || hasIntroEn || opts.generating) {
    meaningSection = ''
      + '<section class="kh-phrase-section">'
      +   '<h2 class="kh-phrase-section-label">Meaning</h2>'
      +   (hasIntroKo ? '<p class="kh-phrase-section-ko">' + escapeText(phrase.intro_ko) + '</p>' : '')
      +   (hasIntroEn ? '<p class="kh-phrase-section-en">' + escapeText(phrase.intro)    + '</p>'
                      : (opts.generating ? '<p class="kh-phrase-section-en kh-phrase-section-pending">의미를 정리하고 있어요…</p>' : ''))
      + '</section>';
  }

  var nuanceSection = hasNuance
    ? '<section class="kh-phrase-section">'
        + '<h2 class="kh-phrase-section-label">When to use it</h2>'
        + '<p class="kh-phrase-section-en">' + escapeText(phrase.nuance) + '</p>'
      + '</section>'
    : '';

  // In Action — uses the existing site `art-example-box` look (cream
  // gradient panel) so it visually matches the article reader's
  // example boxes. TTS + cycle controls inline.
  var inActionSection = '';
  if (ex || opts.generating) {
    var ttsBtn = ex
      ? '<button class="kh-phrase-icon-btn" onclick="speakKorean(\'' + (ex.ko || '').replace(/\\/g,'\\\\').replace(/\'/g,"\\'") + '\', this)" aria-label="Listen">'
        + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>'
      + '</button>'
      : '';
    var cycleBtn = examples.length > 1
      ? '<button class="kh-phrase-icon-btn" id="ph-cycle-btn" onclick="cyclePhraseExample()" aria-label="Next example">'
        + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>'
      + '</button>'
      : '';
    var exBody = ex
      ? '<div class="art-example-ko">' + escapeText(ex.ko) + '</div>'
        + (ex.en ? '<div class="art-example-en">' + escapeText(ex.en) + '</div>' : '')
      : '<div class="art-example-en kh-phrase-section-pending">예문을 만들고 있어요…</div>';
    inActionSection = ''
      + '<section class="kh-phrase-section">'
      +   '<div class="art-example-box kh-phrase-example-box">'
      +     '<div class="art-example-head kh-phrase-example-head">'
      +       '<span>In Action' + (examples.length > 1 ? ' · ' + (exIdx + 1) + '/' + examples.length : '') + '</span>'
      +       '<span class="kh-phrase-example-actions">' + cycleBtn + ttsBtn + '</span>'
      +     '</div>'
      +     exBody
      +   '</div>'
      + '</section>';
  }

  // Related expressions — list of bordered links, same gradient cream
  // background as art-example-box for visual consistency.
  var related = (phrase.related || []).slice(0, 2).filter(function(x){ return x && String(x).trim(); });
  var relatedSection = '';
  if (related.length) {
    var rows = related.map(function(x){
      var t = String(x).trim();
      return '<li><a href="korehan-phrase.html?q=' + encodeURIComponent(t) + '">'
        +   '<span class="kp-rel-ko">' + escapeText(t) + '</span>'
        +   '<span class="kp-rel-arrow" aria-hidden="true">→</span>'
        + '</a></li>';
    }).join('');
    relatedSection = ''
      + '<section class="kh-phrase-section">'
      +   '<h2 class="kh-phrase-section-label">Related Expressions</h2>'
      +   '<ul class="kh-phrase-related-list">' + rows + '</ul>'
      + '</section>';
  }

  // CTA row — solid accent button to save, secondary outline to open
  // the study room. No more fixed bottom pill.
  // When already saved, swap the secondary button to a "View My
  // Phrases" link so the user can find the saved collection (the
  // most common follow-up after saving a phrase).
  var secondary = saved
    ? '<a class="kh-phrase-secondary-btn" href="korehan-my-phrases.html">View My Phrases <span aria-hidden="true">→</span></a>'
    : '<a class="kh-phrase-secondary-btn" href="korehan-my-phrases.html">My Phrases <span aria-hidden="true">→</span></a>';
  var ctaRow = ''
    + '<div class="kh-phrase-cta-row">'
    +   '<button class="kh-phrase-save-btn ' + (saved ? 'saved' : '') + '" onclick="toggleSavePhrase()">'
    +     (saved
            ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>'
            : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>')
    +     '<span>' + (saved ? 'Saved to My Phrases' : 'Add to My Phrases') + '</span>'
    +   '</button>'
    +   secondary
    + '</div>';

  // Admin-only edit shortcut, tucked discreetly above the headline.
  var adminEdit = (typeof window._isAdmin !== 'undefined' && window._isAdmin && opts.idx != null)
    ? '<a class="kh-phrase-admin-edit" href="korehan-x9f4k2m7-phrases.html?edit=' + opts.idx + '" title="Edit this phrase">'
      + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>'
      + '<span>Edit</span></a>'
    : '';

  var backLink = ''
    + '<a class="kh-phrase-back" href="javascript:history.length>1?history.back():(location.href=\'index.html\')">'
    +   '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>'
    +   '<span>All news</span>'
    + '</a>';

  root.innerHTML = ''
    + backLink
    + '<article class="kh-phrase-card">'
    +   heroBanner
    +   '<div class="kh-phrase-card-body">'
    +     adminEdit
    +     eyebrow
    +     headline
    +     subtitle
    +     rom
    +     byline
    +     '<div class="kh-phrase-divider"></div>'
    +     meaningSection
    +     nuanceSection
    +     inActionSection
    +     relatedSection
    +     ctaRow
    +   '</div>'
    + '</article>';

  document.title = phrase.ko + ' — KoreHani Phrase';

  // Lottie hydration runs after the DOM is in place — replaces the
  // Iconify fallback with the animated SVG when the JSON exists.
  var _hydrateTries = 0;
  function _tryHydrate() {
    if (typeof window.lottie !== 'undefined') { _phraseHydrateLottie(); return; }
    if (++_hydrateTries < 20) setTimeout(_tryHydrate, 150);
  }
  _tryHydrate();

  if (typeof khTrackUser === 'function') {
    try { khTrackUser('phrase_view', { ko: phrase.ko, idx: opts.idx, level: levelKey || null }); } catch(_) {}
  }
}

async function renderPhrasePage() {
  var root = document.getElementById('phrase-root');
  if (!root) return;
  var phrases = (typeof getPhrases === 'function') ? getPhrases() : [];
  if (!phrases.length) {
    root.innerHTML = '<div class="phrase-empty">No phrase found.</div>';
    return;
  }

  var params = new URLSearchParams(location.search);
  var idx;
  if (params.has('q')) {
    var q = params.get('q');
    idx = phrases.findIndex(function(p){ return (p.ko || '') === q; });
    if (idx < 0) idx = (typeof getTodaysPhraseIndex === 'function') ? getTodaysPhraseIndex() : 0;
  } else if (params.has('i')) {
    idx = Number(params.get('i'));
  } else {
    idx = (typeof getTodaysPhraseIndex === 'function') ? getTodaysPhraseIndex() : 0;
  }
  if (!Number.isFinite(idx) || idx < 0 || idx >= phrases.length) {
    idx = (typeof getTodaysPhraseIndex === 'function') ? getTodaysPhraseIndex() : 0;
  }
  var phrase = phrases[idx] || phrases[0];

  var viewLog = _logPhraseViewToday();
  var streak = _phraseStreakFromLog(viewLog);
  var dayLabel = phrases.length > 1
    ? 'Day ' + (idx + 1) + ' / ' + phrases.length
    : '';

  var renderOpts = { idx: idx, generating: false, streak: streak, dayLabel: dayLabel };

  var needsFill = isPhraseIncomplete(phrase);
  renderPhraseLayout(phrase, Object.assign({}, renderOpts, { generating: needsFill }));

  if (needsFill) {
    try {
      var filled = await _ensurePhraseFilled(phrase);
      // _fillPhraseViaClaude returns related under the v2 prompt, so
      // stamp the marker in-memory too — _mergePhraseFill doesn't
      // currently set it.
      filled.related_v = 3;
      phrase = filled;
      renderPhraseLayout(filled, renderOpts);
    } catch(e) {
      console.warn('[phrase] fill failed', e);
    }
  }

  // Pass 2 — for phrases that ARE complete (intro/nuance/examples
  // already good) but whose `related` was generated under the old
  // loose-match prompt. Detected via missing related_v: 3 marker.
  // Cheap related-only Claude call, then persisted to DB so the
  // next visitor doesn't re-pay.
  if (!phrase.related_v || phrase.related_v < 3) {
    try {
      var freshened = await _ensureRelatedFresh(phrase);
      if (freshened && freshened !== phrase) {
        renderPhraseLayout(freshened, renderOpts);
      }
    } catch(e) {
      console.warn('[phrase] related refresh failed', e);
    }
  }
}

document.addEventListener('DOMContentLoaded', renderPhrasePage);
</script>
