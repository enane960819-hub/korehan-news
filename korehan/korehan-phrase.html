<script>
// Today's Phrase — dark, mobile-first reader.
//
// Layout matches the iOS-mockup the user shared: level pill, big white
// phrase headline, blue translation, two dark cards (Meaning, Example)
// with optional decorative illustration in the corner of the meaning
// card, fixed bottom gradient CTA pill ("+ Add to My Phrases" / saved).
//
// AI fill flow from the previous version still applies: when a phrase
// is admin-saved with thin metadata we lazy-fill via Claude and cache
// the result locally + back to app_settings.phrases for signed-in
// users.

var PHRASE_FILL_CACHE_KEY = 'kh_phrase_fill_v1';
var SAVED_PHRASES_KEY = 'kh_saved_phrases_v1';

function escapeText(s) { return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function _phraseLocalFill() {
  try { return JSON.parse(localStorage.getItem(PHRASE_FILL_CACHE_KEY) || '{}'); }
  catch(_) { return {}; }
}
function _phraseStashLocal(key, data) {
  try {
    var all = _phraseLocalFill();
    all[key] = data;
    localStorage.setItem(PHRASE_FILL_CACHE_KEY, JSON.stringify(all));
  } catch(_) {}
}

// Saved phrases — local list keyed by Korean text. Tied into the
// bottom CTA + bookmark icon. Persists across sessions; later we can
// sync to Supabase too.
function _getSavedPhrases() {
  try { return JSON.parse(localStorage.getItem(SAVED_PHRASES_KEY) || '[]'); }
  catch(_) { return []; }
}
function _isPhraseSaved(ko) {
  if (!ko) return false;
  var list = _getSavedPhrases();
  return list.some(function(p){ return (p && p.ko) === ko; });
}
function _togglePhraseSaved(phrase) {
  if (!phrase || !phrase.ko) return false;
  var list = _getSavedPhrases();
  var idx = list.findIndex(function(p){ return (p && p.ko) === phrase.ko; });
  if (idx >= 0) {
    list.splice(idx, 1);
  } else {
    list.unshift({
      ko: phrase.ko,
      rom: phrase.rom || '',
      en: phrase.en || '',
      saved_at: new Date().toISOString(),
    });
  }
  try { localStorage.setItem(SAVED_PHRASES_KEY, JSON.stringify(list.slice(0, 200))); } catch(_) {}
  if (typeof khTrackUser === 'function') {
    try { khTrackUser(idx >= 0 ? 'phrase_unsaved' : 'phrase_saved', { ko: phrase.ko }); } catch(_) {}
  }
  return idx < 0;
}

function isPhraseIncomplete(p) {
  if (!p) return true;
  var thinIntro   = !p.intro   || p.intro.length   < 24;
  var thinNuance  = !p.nuance  || p.nuance.length  < 24;
  var weakExamples = !Array.isArray(p.examples) || !p.examples.length
    || p.examples.every(function(e){ return !e || !e.ko || e.ko.length < 8; });
  return thinIntro || thinNuance || weakExamples;
}

async function _fillPhraseViaClaude(phrase) {
  if (typeof callClaude !== 'function') return null;
  var prompt =
      'You are creating learner-facing content for ONE specific Korean phrase / proverb / idiom.\n\n'
    + 'Phrase: ' + phrase.ko + '\n'
    + 'Romanization: ' + (phrase.rom || '(generate)') + '\n'
    + 'Existing English gloss: ' + (phrase.en || '(generate a natural one)') + '\n\n'
    + 'Return ONLY a JSON object — no preamble, no code fences:\n'
    + '{\n'
    + '  "intro_ko": "1-2 sentence Korean explanation of what this phrase means and the imagery behind it. For 속담, explain the literal image AND the figurative meaning. Friendly tone, ~해요체.",\n'
    + '  "intro": "1-2 sentence English explanation matching intro_ko in meaning.",\n'
    + '  "nuance": "1-2 sentence English usage note explaining when a Korean speaker would actually say this. Specific to this phrase.",\n'
    + '  "level": "Seed | Sprout | Tree | Forest — which TOPIK tier this phrase fits (Seed=basic words, Forest=advanced literary).",\n'
    + '  "examples": [\n'
    + '    {"ko":"natural Korean sentence USING the phrase, max 25 chars","en":"English translation"},\n'
    + '    {"ko":"different context using the phrase","en":"…"}\n'
    + '  ],\n'
    + '  "related": ["관련 표현 1","관련 표현 2","관련 표현 3"]\n'
    + '}\n\n'
    + 'Rules:\n'
    + '- intro_ko / intro / nuance MUST be specific to "' + phrase.ko + '" — do NOT echo back generic learner-platform copy.\n'
    + '- examples MUST contain the exact phrase (or a natural conjugated form) and be fully grammatical Korean.\n'
    + '- related: 3 thematically related expressions in Korean. No commentary.';
  var res = await callClaude({
    feature: 'phrase-content-fill',
    model: 'claude-haiku-4-5-20251001',
    max_tokens: 700,
    messages: [{ role: 'user', content: prompt }]
  });
  var raw = (res && res.content && res.content[0] && res.content[0].text) || '';
  var clean = raw.replace(/^```json?/, '').replace(/^```/, '').replace(/```$/, '').trim();
  var oi = clean.indexOf('{'), ei = clean.lastIndexOf('}');
  if (oi < 0 || ei <= oi) throw new Error('no JSON');
  var data = JSON.parse(clean.slice(oi, ei + 1));
  return {
    intro_ko: typeof data.intro_ko === 'string' ? data.intro_ko : '',
    intro: typeof data.intro === 'string' ? data.intro : '',
    nuance: typeof data.nuance === 'string' ? data.nuance : '',
    level: ['Seed','Sprout','Tree','Forest'].indexOf(data.level) >= 0 ? data.level : '',
    examples: Array.isArray(data.examples) ? data.examples
      .map(function(e){ return { ko: (e && e.ko || '').trim(), en: (e && e.en || '').trim() }; })
      .filter(function(e){ return e.ko; }).slice(0, 3) : [],
    related: Array.isArray(data.related) ? data.related
      .map(function(s){ return String(s || '').trim(); }).filter(Boolean).slice(0, 6) : [],
  };
}

async function _ensurePhraseFilled(phrase) {
  if (!isPhraseIncomplete(phrase)) return phrase;
  var cacheKey = (phrase.ko || '').trim();
  if (!cacheKey) return phrase;
  var localAll = _phraseLocalFill();
  if (localAll[cacheKey]) {
    return _mergePhraseFill(phrase, localAll[cacheKey]);
  }
  try {
    var fill = await _fillPhraseViaClaude(phrase);
    if (!fill) return phrase;
    _phraseStashLocal(cacheKey, fill);
    try {
      if (typeof supaUser !== 'undefined' && supaUser && typeof saveSharedPhrases === 'function'
          && typeof getPhraseSourceRows === 'function') {
        var rows = getPhraseSourceRows().slice();
        var idx = rows.findIndex(function(r){ return (r && (r.ko || '').trim()) === cacheKey; });
        if (idx >= 0) {
          rows[idx] = Object.assign({}, rows[idx], fill);
          await saveSharedPhrases(rows);
        }
      }
    } catch(_) {}
    return _mergePhraseFill(phrase, fill);
  } catch(e) {
    console.warn('[phrase] AI fill failed', e);
    return phrase;
  }
}

function _mergePhraseFill(phrase, fill) {
  if (!fill) return phrase;
  var merged = Object.assign({}, phrase);
  if (fill.intro_ko && !phrase.intro_ko) merged.intro_ko = fill.intro_ko;
  if (fill.intro && (!phrase.intro || phrase.intro.length < 24)) merged.intro = fill.intro;
  if (fill.nuance && (!phrase.nuance || phrase.nuance.length < 24)) merged.nuance = fill.nuance;
  if (fill.level && !phrase.level) merged.level = fill.level;
  if (Array.isArray(fill.examples) && fill.examples.length
      && (!phrase.examples || !phrase.examples.length)) {
    merged.examples = fill.examples;
  }
  if (Array.isArray(fill.related) && fill.related.length
      && (!phrase.related || !phrase.related.length)) {
    merged.related = fill.related;
  }
  return merged;
}

// Phrase illustration registry.
//
// Each entry maps a regex against the phrase's KO + EN to:
//   - lottie:  optional path to a Lottie JSON in /korehan/lottie/.
//              When present, we render a real animated illustration.
//              Drop new JSON files in that folder and add the path
//              here to upgrade — no other code change needed.
//   - icon:    Iconify icon name. fluent-emoji-flat is rendered as
//              full-color SVG that looks like a designed illustration
//              (much closer to the mockup than a unicode emoji).
//              Always provided as a fallback so the corner is never
//              empty before / instead of a Lottie file landing.
//   - fallback: unicode emoji for the worst case (Iconify CDN down,
//              browser blocking the web component, etc.)
var PHRASE_ILLUS_MAP = [
  { rx: /등잔|램프|불빛|등불|lamp|light/i,
    lottie: 'lottie/lamp.json',           icon: 'fluent-emoji-flat:light-bulb',  fallback: '💡' },
  { rx: /태산|산|mountain|hill|peak/i,
    lottie: 'lottie/mountain.json',       icon: 'fluent-emoji-flat:mountain',     fallback: '⛰️' },
  { rx: /낙|행복|happy|joy|reward|sunrise|일출|새벽/i,
    lottie: 'lottie/sunrise.json',        icon: 'fluent-emoji-flat:sunrise',      fallback: '🌅' },
  { rx: /시작|첫걸음|begin|start|launch/i,
    lottie: 'lottie/rocket.json',         icon: 'fluent-emoji-flat:rocket',        fallback: '🚀' },
  { rx: /백문|보다|see|sight|eye|관찰/i,
    lottie: 'lottie/eye.json',            icon: 'fluent-emoji-flat:eye',           fallback: '👀' },
  { rx: /티끌|먼지|dust|drop|작은|tiny|small/i,
    lottie: 'lottie/sparkle.json',        icon: 'fluent-emoji-flat:sparkles',      fallback: '✨' },
  { rx: /꿩 먹고 알|일석이조|두 마리|bird/i,
    lottie: 'lottie/bird.json',           icon: 'fluent-emoji-flat:bird',          fallback: '🐦' },
  { rx: /소\b|cow|stable|barn|황소/i,
    lottie: 'lottie/cow.json',            icon: 'fluent-emoji-flat:cow-face',      fallback: '🐄' },
  { rx: /호랑이|범|tiger/i,
    lottie: 'lottie/tiger.json',          icon: 'fluent-emoji-flat:tiger-face',    fallback: '🐯' },
  { rx: /말\b|마이|horse|gallop/i,
    lottie: 'lottie/horse.json',          icon: 'fluent-emoji-flat:horse-face',    fallback: '🐴' },
  { rx: /개\b|강아지|dog/i,
    lottie: 'lottie/dog.json',            icon: 'fluent-emoji-flat:dog-face',      fallback: '🐶' },
  { rx: /물|강|river|water|stream/i,
    lottie: 'lottie/water.json',          icon: 'fluent-emoji-flat:droplet',       fallback: '💧' },
  { rx: /꽃|꽃밭|flower|blossom|핀/i,
    lottie: 'lottie/flower.json',         icon: 'fluent-emoji-flat:cherry-blossom',fallback: '🌸' },
  { rx: /나무|tree|숲|forest|woods/i,
    lottie: 'lottie/tree.json',           icon: 'fluent-emoji-flat:deciduous-tree',fallback: '🌳' },
  { rx: /책|글|read|word|book|문장/i,
    lottie: 'lottie/book.json',           icon: 'fluent-emoji-flat:open-book',     fallback: '📖' },
  { rx: /시간|세월|time|hour|clock/i,
    lottie: 'lottie/clock.json',          icon: 'fluent-emoji-flat:alarm-clock',    fallback: '⏰' },
  { rx: /돈|금|wealth|money|gold|부자/i,
    lottie: 'lottie/coin.json',           icon: 'fluent-emoji-flat:coin',          fallback: '🪙' },
  { rx: /불|불꽃|fire|flame|burn/i,
    lottie: 'lottie/fire.json',           icon: 'fluent-emoji-flat:fire',          fallback: '🔥' },
  { rx: /바람|wind|breeze/i,
    lottie: 'lottie/wind.json',           icon: 'fluent-emoji-flat:wind-face',     fallback: '🌬️' },
  { rx: /비\b|rain|shower|폭우/i,
    lottie: 'lottie/rain.json',           icon: 'fluent-emoji-flat:cloud-with-rain', fallback: '🌧️' },
  { rx: /눈\b|snow|winter|겨울/i,
    lottie: 'lottie/snow.json',           icon: 'fluent-emoji-flat:snowflake',     fallback: '❄️' },
  { rx: /해\b|sun|볕|햇살/i,
    lottie: 'lottie/sun.json',            icon: 'fluent-emoji-flat:sun',           fallback: '☀️' },
  { rx: /달\b|moon|밤|night/i,
    lottie: 'lottie/moon.json',           icon: 'fluent-emoji-flat:full-moon-face',fallback: '🌝' },
  { rx: /길\b|길|road|path|여정/i,
    lottie: 'lottie/road.json',           icon: 'fluent-emoji-flat:motorway',      fallback: '🛣️' },
  { rx: /손|hand|손길/i,
    lottie: 'lottie/hand.json',           icon: 'fluent-emoji-flat:open-hands',    fallback: '🤲' },
  { rx: /친구|friend|벗\b/i,
    lottie: 'lottie/friends.json',        icon: 'fluent-emoji-flat:people-hugging',fallback: '🫂' },
  { rx: /입\b|말씀|word|speak|talk/i,
    lottie: 'lottie/speech.json',         icon: 'fluent-emoji-flat:speech-balloon',fallback: '💬' },
];
var PHRASE_DEFAULT_ILLUS = { lottie: 'lottie/book.json', icon: 'fluent-emoji-flat:open-book', fallback: '📖' };

function _phraseIllusEntry(phrase) {
  var hay = ((phrase && phrase.ko) || '') + ' ' + ((phrase && phrase.en) || '');
  for (var i = 0; i < PHRASE_ILLUS_MAP.length; i++) {
    if (PHRASE_ILLUS_MAP[i].rx.test(hay)) return PHRASE_ILLUS_MAP[i];
  }
  return PHRASE_DEFAULT_ILLUS;
}

// Track which lottie paths we've confirmed exist (or 404'd) so we
// don't HEAD-fetch on every render.
var _phraseLottieKnown = {};

function _phraseRenderIllus(entry) {
  if (!entry) return '';
  // Lottie placeholder — JS swaps in a real player after probing if
  // the JSON file is hosted. Falls back to Iconify silently when not.
  var slot = '<div class="phrase-card-illus" data-lottie="' + escapeText(entry.lottie || '') + '" data-fallback-icon="' + escapeText(entry.icon || '') + '" data-fallback-emoji="' + escapeText(entry.fallback || '') + '">'
    + (entry.icon
        ? '<iconify-icon icon="' + escapeText(entry.icon) + '" width="100%" height="100%" aria-hidden="true"></iconify-icon>'
        : (entry.fallback || ''))
    + '</div>';
  return slot;
}

// Try to load Lottie JSON for an illustration slot. Probe only once
// per path per page-load. If Lottie + JSON both exist, replace the
// Iconify fallback with the animated player.
async function _phraseHydrateLottie() {
  var slots = document.querySelectorAll('.phrase-card-illus[data-lottie]');
  if (!slots.length || typeof window.lottie === 'undefined') return;
  for (var i = 0; i < slots.length; i++) {
    var slot = slots[i];
    var path = slot.getAttribute('data-lottie') || '';
    if (!path) continue;
    if (_phraseLottieKnown[path] === false) continue; // already 404'd
    try {
      if (_phraseLottieKnown[path] !== true) {
        var head = await fetch(path, { method: 'HEAD' });
        if (!head.ok) { _phraseLottieKnown[path] = false; continue; }
        _phraseLottieKnown[path] = true;
      }
      slot.innerHTML = '';
      window.lottie.loadAnimation({
        container: slot,
        path: path,
        renderer: 'svg',
        loop: true,
        autoplay: true,
      });
    } catch(_) {
      _phraseLottieKnown[path] = false;
    }
  }
}

// Map level → CSS modifier.
var LEVEL_CLASS = {
  Seed:'lvl-seed', Sprout:'lvl-sprout', Tree:'lvl-tree', Forest:'lvl-forest',
};
var LEVEL_LABEL = {
  Seed:'Seed Level', Sprout:'Sprout Level', Tree:'Tree Level', Forest:'Forest Level',
};

function speakKorean(text, btn) {
  if (!text) return;
  if (typeof speakHangul === 'function') {
    try { speakHangul(text); return; } catch(_) {}
  }
  if (typeof window.speechSynthesis !== 'undefined') {
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.rate = 0.92;
      window.speechSynthesis.speak(u);
    } catch(_) {}
  }
  if (btn) {
    btn.style.transform = 'scale(.92)';
    setTimeout(function(){ btn.style.transform = ''; }, 140);
  }
}
window.speakKorean = speakKorean;

// Cycle through the available examples, one per page-load (random
// but stable for the rest of the session).
var _exampleIdx = 0;
function pickExampleIdx(arr) {
  if (!arr || !arr.length) return -1;
  if (_exampleIdx >= arr.length) _exampleIdx = 0;
  return _exampleIdx;
}

window.cyclePhraseExample = function() {
  var btn = document.getElementById('ph-cycle-btn');
  if (btn) { btn.style.transform = 'rotate(180deg)'; setTimeout(function(){ btn.style.transform=''; }, 240); }
  _exampleIdx++;
  // Re-render the example card region only.
  var phrase = window._currentPhrase;
  if (!phrase) return;
  renderPhraseLayout(phrase, window._currentPhraseOpts || {});
};

window.toggleSavePhrase = function() {
  var phrase = window._currentPhrase;
  if (!phrase) return;
  var nowSaved = _togglePhraseSaved(phrase);
  // Re-render so both the bookmark icon AND the bottom CTA reflect state.
  renderPhraseLayout(phrase, window._currentPhraseOpts || {});
  if (typeof toast === 'function') {
    toast(nowSaved ? '내 표현에 저장됐어요 ❤️' : '저장 해제됨', false);
  }
};

window.startPhraseStudy = function() {
  if (typeof khTrackUser === 'function') {
    var phrase = window._currentPhrase || {};
    try { khTrackUser('phrase_study_start', { ko: phrase.ko }); } catch(_) {}
  }
  location.href = 'korehan-study-room.html';
};

function renderPhraseLayout(phrase, opts) {
  opts = opts || {};
  window._currentPhrase = phrase;
  window._currentPhraseOpts = opts;
  var root = document.getElementById('phrase-root');
  if (!root) return;
  var examples = (phrase.examples || []).filter(function(e){ return e && e.ko; });
  var exIdx = pickExampleIdx(examples);
  var ex = exIdx >= 0 ? examples[exIdx] : null;

  var levelKey = phrase.level || '';
  var levelClass = LEVEL_CLASS[levelKey] || 'lvl-sprout';
  var levelLabel = LEVEL_LABEL[levelKey] || 'Sprout Level';

  var saved = _isPhraseSaved(phrase.ko);

  var statusPill = opts.generating
    ? '<span class="phrase-loading">분석 채우는 중</span>'
    : '';

  // Meaning card body — prefer Korean intro_ko + English intro stack.
  var hasIntro = phrase.intro_ko || phrase.intro;
  var meaningBody;
  if (hasIntro) {
    meaningBody = ''
      + (phrase.intro_ko ? '<div class="phrase-card-body-ko">' + escapeText(phrase.intro_ko) + '</div>' : '')
      + (phrase.intro    ? '<div class="phrase-card-body-en">' + escapeText(phrase.intro)    + '</div>' : '')
      + (phrase.nuance && phrase.nuance.length > 8
          ? '<div class="phrase-card-body-en" style="margin-top:14px;font-style:normal;color:rgba(125,211,252,.85)">'
            + '<span style="font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;display:block;margin-bottom:4px;color:#7dd3fc">When to use it</span>'
            + escapeText(phrase.nuance)
            + '</div>'
          : '');
  } else if (opts.generating) {
    meaningBody = '<div class="phrase-card-body-en">의미를 정리하고 있어요…</div>';
  } else {
    meaningBody = '<div class="phrase-card-body-en">No description yet.</div>';
  }

  var illusEntry = _phraseIllusEntry(phrase);
  var meaningCard = ''
    + '<div class="phrase-card has-illus">'
    +   '<div class="phrase-card-header">'
    +     '<span class="phrase-card-title">Meaning</span>'
    +   '</div>'
    +   meaningBody
    +   _phraseRenderIllus(illusEntry)
    + '</div>';

  var exampleCard = '';
  if (ex || opts.generating) {
    var exBody = ex
      ? '<div class="phrase-card-body-ko">' + escapeText(ex.ko) + '</div>'
        + (ex.en ? '<div class="phrase-card-body-en">' + escapeText(ex.en) + '</div>' : '')
      : '<div class="phrase-card-body-en">예문을 만들고 있어요…</div>';
    var ttsBtnHtml = ex
      ? '<button class="phrase-card-tts" onclick="speakKorean(\'' + (ex.ko || '').replace(/\\/g,'\\\\').replace(/\'/g,"\\'") + '\', this)" aria-label="Listen">'
        + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>'
      + '</button>'
      : '';
    var cycleBtnHtml = examples.length > 1
      ? '<button class="phrase-card-tts" id="ph-cycle-btn" onclick="cyclePhraseExample()" aria-label="Next example" style="margin-right:6px;transition:transform .24s ease">'
        + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>'
      + '</button>'
      : '';
    exampleCard = ''
      + '<div class="phrase-card">'
      +   '<div class="phrase-card-header">'
      +     '<span class="phrase-card-title">Example' + (examples.length > 1 ? ' · ' + (exIdx + 1) + '/' + examples.length : '') + '</span>'
      +     '<span style="display:flex;align-items:center">' + cycleBtnHtml + ttsBtnHtml + '</span>'
      +   '</div>'
      +   exBody
      + '</div>';
  }

  var related = (phrase.related || []).slice(0, 5);
  var chipRow = related.length
    ? '<div class="phrase-meta-row">'
      + related.map(function(x){
          return '<a class="phrase-chip" href="korehan-phrase.html?q=' + encodeURIComponent(x) + '">'
            + '<span>' + escapeText(x) + '</span></a>';
        }).join('')
      + '</div>'
    : '';

  var topRow = ''
    + '<div class="phrase-toprow">'
    +   '<a class="phrase-iconbtn" href="javascript:history.length>1?history.back():(location.href=\'index.html\')" aria-label="Back">'
    +     '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>'
    +   '</a>'
    +   '<div class="ptr-right">'
    +     '<button class="phrase-iconbtn ' + (saved ? 'saved' : '') + '" onclick="toggleSavePhrase()" aria-label="Save phrase">'
    +       (saved
              ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>'
              : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>')
    +     '</button>'
    +     ((typeof window._isAdmin !== 'undefined' && window._isAdmin && opts.idx != null)
            ? '<a class="phrase-iconbtn" href="korehan-x9f4k2m7-phrases.html?edit=' + opts.idx + '" aria-label="Edit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></a>'
            : '')
    +   '</div>'
    + '</div>';

  root.innerHTML = ''
    + topRow
    + '<span class="phrase-level-badge ' + levelClass + '">'
    +   '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L4 8 L4 22 L11 22 L11 17 L13 17 L13 22 L20 22 L20 8 Z" opacity=".7"/></svg>'
    +   '<span>' + levelLabel + '</span>'
    + '</span>'
    + (statusPill ? statusPill : '')
    + '<h1 class="phrase-ko">' + escapeText(phrase.ko) + '</h1>'
    + (phrase.en  ? '<div class="phrase-en">' + escapeText(phrase.en)  + '</div>' : '')
    + (phrase.rom ? '<div class="phrase-rom">' + escapeText(phrase.rom) + '</div>' : '')
    + meaningCard
    + exampleCard
    + chipRow
    // Bottom CTA — fixed at viewport bottom; matches the mockup
    + '<div class="phrase-cta-bar">'
    +   '<button class="phrase-cta ' + (saved ? 'saved' : '') + '" onclick="toggleSavePhrase()">'
    +     (saved
            ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 6L9 17l-5-5"/></svg>'
            : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>')
    +     '<span>' + (saved ? 'Saved to My Phrases' : 'Add to My Phrases') + '</span>'
    +   '</button>'
    +   '<div class="phrase-cta-sub"><a href="korehan-study-room.html">Or continue studying →</a></div>'
    + '</div>';

  document.title = phrase.ko + ' — KoreHani Phrase';

  // Lottie hydration runs after the DOM is in place — replaces the
  // Iconify fallback with the animated SVG when the JSON exists.
  // Lottie library loads with `defer` so it may not be ready on the
  // first call; retry a few times until it is.
  var _hydrateTries = 0;
  function _tryHydrate() {
    if (typeof window.lottie !== 'undefined') { _phraseHydrateLottie(); return; }
    if (++_hydrateTries < 20) setTimeout(_tryHydrate, 150);
  }
  _tryHydrate();

  if (typeof khTrackUser === 'function') {
    try { khTrackUser('phrase_view', { ko: phrase.ko, idx: opts.idx, level: levelKey || null }); } catch(_) {}
  }
}

async function renderPhrasePage() {
  var root = document.getElementById('phrase-root');
  if (!root) return;
  var phrases = (typeof getPhrases === 'function') ? getPhrases() : [];
  if (!phrases.length) {
    root.innerHTML = '<div class="phrase-empty">No phrase found.</div>';
    return;
  }

  var params = new URLSearchParams(location.search);
  var idx;
  if (params.has('q')) {
    var q = params.get('q');
    idx = phrases.findIndex(function(p){ return (p.ko || '') === q; });
    if (idx < 0) idx = (typeof getTodaysPhraseIndex === 'function') ? getTodaysPhraseIndex() : 0;
  } else if (params.has('i')) {
    idx = Number(params.get('i'));
  } else {
    idx = (typeof getTodaysPhraseIndex === 'function') ? getTodaysPhraseIndex() : 0;
  }
  if (!Number.isFinite(idx) || idx < 0 || idx >= phrases.length) {
    idx = (typeof getTodaysPhraseIndex === 'function') ? getTodaysPhraseIndex() : 0;
  }
  var phrase = phrases[idx] || phrases[0];

  var needsFill = isPhraseIncomplete(phrase);
  renderPhraseLayout(phrase, { idx: idx, generating: needsFill });

  if (needsFill) {
    try {
      var filled = await _ensurePhraseFilled(phrase);
      renderPhraseLayout(filled, { idx: idx, generating: false });
    } catch(e) {
      console.warn('[phrase] fill failed', e);
    }
  }
}

document.addEventListener('DOMContentLoaded', renderPhrasePage);
</script>
</body>
</html>
