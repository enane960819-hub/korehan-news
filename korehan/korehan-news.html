<script>
document.addEventListener('DOMContentLoaded', async () => {
  const phrases = typeof getPhrasesAsync === 'function' ? await getPhrasesAsync() : getPhrases();
  if (!phrases.length) return;
  const _idx = (typeof getTodaysPhraseIndex === 'function')
    ? getTodaysPhraseIndex()
    : Math.floor((Date.now()+9*3600000)/86400000) % phrases.length;
  const p = phrases[_idx];
  const ko  = document.getElementById('banner-phrase-ko');
  const rom = document.getElementById('banner-phrase-rom');
  const en  = document.getElementById('banner-phrase-en');
  if(ko)  ko.textContent  = p.ko;
  if(rom) rom.textContent = p.rom;
  if(en)  en.textContent  = p.en;
});
