<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://samghztrdvtxmrmawneu.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm subscription — KoreHani</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=DM+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="korehan-shared.css?v=20261030bn">
<style>
/* Newsletter landing (mockup 2026-10-29 ④) — simple dark card. */
html, html body, html body.mobile-light { background:#0a1631 linear-gradient(180deg,#0d1b3d,#0a1631 900px) no-repeat !important; color:#e2e8f0; }
.kh-nl-page { padding:56px 16px 72px; }
.kh-confirm { max-width:480px; margin:0 auto; padding:34px 26px 30px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:16px; text-align:center; font-family:'DM Sans','Source Sans 3',system-ui,sans-serif; }
.kh-confirm h1 { font-family:'Playfair Display',Georgia,serif; font-weight:900; font-size:26px; color:#fff; margin:0 0 8px; }
.kh-confirm p { font-size:14px; color:#94a3b8; line-height:1.6; margin:0 0 20px; }
.kh-confirm .nl-ic { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; background:rgba(255,255,255,.08); color:#cbd5e1; }
.kh-confirm .nl-ic .kh-ui-icon, .kh-confirm .nl-ic svg { width:26px; height:26px; }
.kh-confirm .nl-ic.ok { background:#14532d; color:#86efac; }
.kh-confirm .nl-ic.err { background:rgba(220,38,38,.2); color:#fca5a5; }
.kh-confirm .home-btn { display:inline-flex; align-items:center; gap:6px; padding:11px 22px; background:#2563eb; color:#fff; border-radius:999px; text-decoration:none; font-weight:800; font-size:14px; transition:background .15s; }
.kh-confirm .home-btn:hover { background:#1d4ed8; }
.kh-confirm .home-btn.ghost { background:rgba(255,255,255,.08); color:#e2e8f0; border:1px solid rgba(255,255,255,.16); }
.kh-confirm .email { font-weight:800; color:#e2e8f0; }
</style>
</head>
<body>
<div id="kh-header"></div>
<main class="kh-nl-page">
  <div class="kh-confirm" id="kh-confirm-wrap">
    <div class="nl-ic" id="kh-confirm-icon"><i data-lucide="mail" class="kh-ui-icon" aria-hidden="true"></i></div>
    <h1 id="kh-confirm-title">Confirming…</h1>
    <p id="kh-confirm-body">Hold on, we're activating your subscription.</p>
    <a class="home-btn" id="kh-confirm-cta" href="index.html" style="display:none">Back to home</a>
  </div>
</main>
<div id="kh-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/core/security.js?v=20260525r"></script>
<script src="js/core/storage.js?v=20260525r"></script>
<script src="js/core/icons.js?v=20260525r"></script>
<script src="js/core/modals.js?v=20260525r"></script>
<script src="js/core/ui-states.js?v=20260525r"></script>
<script src="js/core/analytics.js?v=20261014a"></script>
<script src="js/core/user-analytics.js?v=20261014a"></script>
<script src="js/core/plans.js?v=20261030sp"></script>
<script src="js/core/article-cache.js?v=20261028b"></script>
<script src="js/core/saved-words.js?v=20261030fx"></script>
<script src="js/features/streak.js?v=20260525r"></script>
<script src="js/features/daily-mission.js?v=20261030fx"></script>
<script src="js/features/comments.js?v=20261016a"></script>
<script src="js/features/sidebar.js?v=20261030bn"></script>
<script src="korehan-shared.js?v=20261030d"></script>
<script src="js/core/emoji-icons.js?v=20261029t"></script>
<script>
(function () {
  // Token-only landing page. Hits the newsletter_confirm RPC and
  // shows success/failure copy. Designed to be runnable on any
  // browser, signed in or not — anon role has EXECUTE on the RPC.
  function $(id) { return document.getElementById(id); }
  function setError(title, body) {
    var ic = $('kh-confirm-icon');
    ic.className = 'nl-ic err';
    ic.innerHTML = '<i data-lucide="mail-x" class="kh-ui-icon" aria-hidden="true"></i>';
    $('kh-confirm-title').textContent = title;
    $('kh-confirm-body').innerHTML = body;
    var cta = $('kh-confirm-cta');
    cta.className = 'home-btn ghost';
    cta.textContent = 'Back to home';
    cta.style.display = 'inline-flex';
  }
  function setSuccess(email) {
    var ic = $('kh-confirm-icon');
    ic.className = 'nl-ic ok';
    ic.innerHTML = '<i data-lucide="mail-check" class="kh-ui-icon" aria-hidden="true"></i>';
    $('kh-confirm-title').textContent = 'You\'re subscribed';
    $('kh-confirm-body').innerHTML = email
      ? 'Welcome aboard. The KoreHani newsletter will come to <span class="email">' + escapeHtml(email) + '</span>.'
      : 'Welcome aboard. Watch your inbox for the next issue.';
    var cta = $('kh-confirm-cta');
    cta.className = 'home-btn';
    cta.innerHTML = '<i data-lucide="newspaper" class="kh-ui-icon" aria-hidden="true"></i> Read today\'s article';
    cta.style.display = 'inline-flex';
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  document.addEventListener('DOMContentLoaded', async function () {
    var p = new URLSearchParams(location.search);
    var token = p.get('t') || p.get('token') || '';
    if (!token) {
      setError('Missing token', 'This confirmation link is incomplete. Please use the link from your email.');
      return;
    }
    var sb = (typeof getSupa === 'function') ? getSupa() : null;
    if (!sb) {
      setError('Something went wrong', 'We couldn\'t reach the server. Please retry in a moment.');
      return;
    }
    try {
      var r = await sb.rpc('newsletter_confirm', { p_token: token });
      var data = r && r.data;
      if (r.error || !data || !data.ok) {
        setError('Link expired', 'This confirmation link is no longer valid. Resubscribe from the homepage footer to get a fresh one.');
        return;
      }
      setSuccess(data.email || '');
    } catch (e) {
      setError('Something went wrong', 'We couldn\'t confirm your subscription. Please retry in a moment.');
    }
  });
})();
</script>
</body>
</html>
