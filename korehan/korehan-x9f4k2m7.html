async function generateConvs() {
  var cat    = document.getElementById('cv-cat').value;
  var lvl    = document.getElementById('cv-lvl').value;
  var count  = document.getElementById('cv-count').value;
  var topic  = document.getElementById('cv-topic').value.trim();
  var res    = document.getElementById('cv-results');
  var lvlMap = {s:'Seed', b:'Sprout', i:'Tree', a:'Forest'};
  var catMap = {everyday:'Everyday', work:'Workplace', friends:'Friends', family:'Family', dating:'Dating'};

  var genBtn = document.getElementById('cv-gen-btn');
  if (genBtn) { genBtn.disabled = true; genBtn.textContent = '⏳ Generating…'; }
  res.innerHTML = '<div style="padding:28px;text-align:center;color:#64748b;background:#fff;border-radius:16px;border:1px solid #e2e8f0"><div style="font-size:32px;margin-bottom:10px">⏳</div><div style="font-size:14px;font-weight:600">Generating ' + count + ' conversation' + (count>1?'s':'') + '…</div><div style="font-size:12px;margin-top:6px;color:#94a3b8">This may take 10–30 seconds</div></div>';

  var prompt = 'You are creating Korean language learning content for KoreHan News.\n\nGenerate ' + count + ' KakaoTalk-style Korean conversations.\nCategory: ' + catMap[cat] + '\nLevel: ' + lvlMap[lvl] + '\nLevel guidance: ' + ({s:'STARTER: 아주 짧은 2~4단어 문장만. 기초 인사/숫자. ~이에요/예요 체만.',b:'BEGINNER: 짧고 쉬운 문장. 기본 조사. 현재형 위주.',i:'INTERMEDIATE: 연결어미, 과거형 자연스럽게.',a:'ADVANCED: 복잡한 문장, 격식체, 고급 문법.'}[lvl]||'') + '\nTopic: ' + (topic || 'any natural Korean daily life situation') + '\n\nReturn ONLY a valid JSON array. No markdown, no backticks.\n\nEach object:\n{"name":"Names","ctx":"context","cat":"' + cat + '","lvl":"' + lvl + '","catLabel":"' + catMap[cat] + '","topic":"topic","avi":"emoji","msgs":[{"s":"l or r","who":"name","txt":"Korean","en":"English translation of txt"}],"vocab":[{"ko":"","rom":"","en":""}],"grammar":[{"point":"","ex":""}],"mission":["task1","task2","task3"]}\n\nRules: 6-9 msgs, 5-7 vocab, 2-3 grammar, 3 missions. EVERY msg MUST have "en" field with natural English translation. ' + lvlMap[lvl] + ' level Korean.';

  try {
    var resp = await callClaude({
      feature: 'conv_gen',
      model: 'claude-sonnet-4-20250514',
      max_tokens: 8000,
      messages: [{role:'user', content: prompt}]
    });
    var raw = resp.content.map(function(b){ return b.text||''; }).join('');
    raw = raw.replace(/^```json/, '').replace(/^```/, '').replace(/```$/, '').trim();
    var convs = JSON.parse(raw);

    if (genBtn) { genBtn.disabled = false; genBtn.innerHTML = '🤖 Generate Conversations'; }
    var html = '<div style="background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px">'
      + '<div><div style="font-size:14px;font-weight:800;color:#15803d">✅ Generated ' + convs.length + ' conversation' + (convs.length!==1?'s':'') + '</div><div style="font-size:12px;color:#16a34a;margin-top:2px">Review below, then save all to the database.</div></div>'
      + '<button onclick="saveAllConvs()" style="background:#16a34a;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0">💾 Save All to DB</button>'
      + '</div>';

    convs.forEach(function(c, i) {
      var msgs = (c.msgs||[]).map(function(m) {
        var bg = m.s === 'r' ? '#2563eb' : '#fff';
        var col = m.s === 'r' ? '#fff' : '#0f172a';
        var brd = m.s === 'r' ? 'none' : '1px solid #e2e8f0';
        var align = m.s === 'r' ? 'justify-content:flex-end' : '';
        var note = m.note ? '<div style="font-size:11px;opacity:.7;margin-top:3px;font-style:italic">💡 ' + m.note + '</div>' : '';
        return '<div style="display:flex;' + align + ';margin-bottom:5px">'
          + '<div style="max-width:75%;background:' + bg + ';color:' + col + ';border:' + brd + ';border-radius:12px;padding:7px 11px;font-size:13px">'
          + m.txt + note + '</div></div>';
      }).join('');

      var vocab = (c.vocab||[]).map(function(v) {
        return '<span style="background:#f1f5f9;border-radius:8px;padding:4px 10px;font-size:12px"><b style="color:#1d4ed8">' + v.ko + '</b> ' + v.en + '</span>';
      }).join('');

      html += '<div style="background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:16px;margin-bottom:12px">'
        + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
        + '<span style="font-size:22px">' + (c.avi||'💬') + '</span>'
        + '<div><div style="font-size:13px;font-weight:700">' + c.name + '</div><div style="font-size:12px;color:#64748b">' + c.ctx + '</div></div>'
        + '<span style="margin-left:auto;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px">' + lvlMap[c.lvl||lvl] + '</span>'
        + '</div>'
        + '<div style="background:#f8fbff;border-radius:8px;padding:10px;margin-bottom:8px">' + msgs + '</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:5px">' + vocab + '</div>'
        + '</div>';
    });

    res.innerHTML = html;
    window._generatedConvs = convs;
  } catch(e) {
    if (genBtn) { genBtn.disabled = false; genBtn.innerHTML = '🤖 Generate Conversations'; }
    res.innerHTML = '<div style="background:#fee2e2;border-radius:12px;padding:16px 18px;color:#b91c1c;font-size:13px;border:1.5px solid #fecaca"><strong>Generation failed:</strong> ' + e.message + '</div>';
  }
}


async function saveAllConvs() {
  if (!window._generatedConvs || !window._generatedConvs.length) return;
  var sb = getSb();
  if (!sb) return;
  var rows = window._generatedConvs.map(function(c) {
    return {
      data: c,
      cat: c.cat,
      lvl: c.lvl,
      name: c.name,
      ctx: c.ctx,
      created_at: new Date().toISOString()
    };
  });
  var {error} = await sb.from('conversations_data').insert(rows);
  if (error) {
    alert('Save error: ' + error.message);
  } else {
    var msg = '✅ ' + rows.length + ' conversations saved/published!\n\nCheck in Conversations management.';
    alert(msg);
    window._generatedConvs = [];  // 초기화
    goConvManager();  // 저장 후 관리 화면으로 이동
  }
}

async function generateStories() {
  var mood   = document.getElementById('st-mood').value;
  var lvl    = document.getElementById('st-lvl').value;
  var count  = document.getElementById('st-count').value;
  var res    = document.getElementById('st-results');
  var lvlMap  = {s:'Seed', b:'Sprout', i:'Tree', a:'Forest'};
  var moodMap = {fun:'Fun', touching:'Touching', scary:'Scary', shocking:'Shocking'};
  var moodEmoji = {fun:'😂', touching:'🥹', scary:'😱', shocking:'😮'};
  var moodColors = {fun:'#d97706', touching:'#db2777', scary:'#7c3aed', shocking:'#dc2626'};

  res.innerHTML = '<div style="padding:20px;text-align:center;color:#64748b">⏳ AI generating...</div>';

  var prompt = 'Generate ' + count + ' short Korean community-style stories for Korean learners.\nMood: ' + moodMap[mood] + '\nLevel: ' + lvlMap[lvl] + '\n\nReturn ONLY a valid JSON array, no markdown, no backticks.\n\nEach story object:\n{"title":"Korean title","title_en":"English","mood":"' + mood + '","lvl":"' + lvl + '","readTime":"X min","preview":"first 1-2 sentences","body":"full story in Korean with paragraphs","vocab":[{"ko":"","rom":"","en":""}],"grammar":[{"point":"","ex":""}],"comprehension":[{"q":"","a":""}]}\n\nRules: authentic Korean community post style, body 8-15 paragraphs, 6-8 vocab, 2-3 grammar, 3 comprehension questions.';

  try {
    var resp = await callClaude({
      feature: 'story_gen',
      model: 'claude-sonnet-4-20250514',
      max_tokens: 8000,
      messages: [{role:'user', content: prompt}]
    });
    var raw = resp.content.map(function(b){ return b.text||''; }).join('');
    raw = raw.replace(/^```json/, '').replace(/^```/, '').replace(/```$/, '').trim();
    var stories = JSON.parse(raw);

    var html = '<div style="margin-bottom:14px;display:flex;align-items:center;justify-content:space-between">'
      + '<span style="font-size:14px;font-weight:700;color:#0f172a">Generated ' + stories.length + ' stories</span>'
      + '<button onclick="saveAllStories()" style="background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Save All to DB</button>'
      + '</div>';

    stories.forEach(function(s) {
      var color = moodColors[s.mood] || '#7c3aed';
      var vocab = (s.vocab||[]).map(function(v) {
        return '<span style="background:#f1f5f9;border-radius:8px;padding:4px 10px;font-size:12px"><b style="color:' + color + '">' + v.ko + '</b> ' + v.en + '</span>';
      }).join('');

      html += '<div style="background:#fff;border-radius:14px;border:1px solid #e2e8f0;overflow:hidden;margin-bottom:12px">'
        + '<div style="height:50px;background:' + color + ';display:flex;align-items:center;padding:0 16px;gap:10px">'
        + '<span style="font-size:22px">' + (moodEmoji[s.mood]||'📖') + '</span>'
        + '<span style="color:#fff;font-size:13px;font-weight:700">' + s.title + '</span>'
        + '<span style="margin-left:auto;color:rgba(255,255,255,.8);font-size:11px">' + (s.readTime||'') + ' · ' + lvlMap[s.lvl||lvl] + '</span>'
        + '</div>'
        + '<div style="padding:14px">'
        + '<div style="font-size:12px;color:#64748b;font-style:italic;margin-bottom:8px">' + (s.title_en||'') + '</div>'
        + '<div style="font-size:13px;color:#334155;line-height:1.7;margin-bottom:10px;white-space:pre-line">' + (s.preview||'') + '</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:5px">' + vocab + '</div>'
        + '</div></div>';
    });

    res.innerHTML = html;
    window._generatedStories = stories;
  } catch(e) {
    res.innerHTML = '<div style="background:#fee2e2;border-radius:10px;padding:14px;color:#b91c1c;font-size:13px">Error: ' + e.message + '</div>';
  }
}


async function saveAllStories() {
  if (!window._generatedStories || !window._generatedStories.length) return;
  var sb = getSb();
  if (!sb) return;
  var rows = window._generatedStories.map(function(s) {
    return {
      data: s,
      mood: s.mood,
      lvl: s.lvl,
      title: s.title,
      title_en: s.title_en,
      preview: s.preview,
      read_time: s.readTime,
      created_at: new Date().toISOString()
    };
  });
  var {error} = await sb.from('stories_data').insert(rows);
  if (error) {
    alert('Save error: ' + error.message);
  } else {
    alert('✅ ' + rows.length + ' stories saved/published!');
    window._generatedStories = [];
    goStoriesManager();
  }
}

function syncConvPreview() {
  var nameEl = document.getElementById('ce-name');
  var ctxEl = document.getElementById('ce-ctx');
  var lvlEl = document.getElementById('ce-lvl');
  var catEl = document.getElementById('ce-cat');
  var msgsEl = document.getElementById('ce-msgs-text');

  var title = document.getElementById('ce-preview-name');
  var ctx = document.getElementById('ce-preview-ctx');
  var lvl = document.getElementById('ce-preview-level');
  var cat = document.getElementById('ce-preview-cat');
  var chat = document.getElementById('ce-chat-preview');

  if (!chat) return;

  var lvlMap = {s:'Seed', b:'Sprout', i:'Tree', a:'Forest'};
  var catMap = {everyday:'Everyday', work:'Workplace', friends:'Friends', family:'Family', dating:'Dating'};

  if (title) title.textContent = (nameEl && nameEl.value.trim()) || 'New Conversation';
  if (ctx) ctx.textContent = (ctxEl && ctxEl.value.trim()) || 'Edit the dialogue below, then run AI Update.';
  if (lvl) lvl.textContent = lvlMap[(lvlEl && lvlEl.value) || 'b'] || 'Seed';
  if (cat) cat.textContent = catMap[(catEl && catEl.value) || 'everyday'] || 'Everyday';

  var lines = ((msgsEl && msgsEl.value) || '').split('\n').filter(function(l){ return l.trim(); });
  if (!lines.length) {
    chat.innerHTML = '<div style="padding:26px;text-align:center;color:#94a3b8;font-size:13px;">No messages yet. Add A:/B: lines below.</div>';
    return;
  }

  // 선택된 캐릭터 정보 가져오기
  var castAEl = document.getElementById('ce-cast-a');
  var castBEl = document.getElementById('ce-cast-b');
  var castAId = castAEl && castAEl.value;
  var castBId = castBEl && castBEl.value;
  var rep = _adminReporters || [];
  var repA = castAId ? rep.find(function(r){ return r.id === castAId; }) : null;
  var repB = castBId ? rep.find(function(r){ return r.id === castBId; }) : null;
  var nameA = repA ? repA.name : 'A';
  var nameB = repB ? repB.name : 'B';
  var colA  = repA ? (repA.color || '#64748b') : '#64748b';
  var colB  = repB ? (repB.color || '#2563eb') : '#2563eb';

  var html = '<div style="display:flex;flex-direction:column;gap:10px;">';
  lines.forEach(function(line){
    var raw = line.trim();
    // N: 지문 (웹소설 지문 스타일)
    if (/^N:/i.test(raw)) {
      var ntxt = raw.replace(/^N:\s*/i, '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      html += '<div style="display:flex;align-items:center;gap:10px;padding:6px 4px;">'
        + '<span style="flex:1;height:1px;background:#e2e8f0;"></span>'
        + '<span style="font-style:italic;color:#64748b;font-size:13px;white-space:pre-wrap;text-align:center;">' + ntxt + '</span>'
        + '<span style="flex:1;height:1px;background:#e2e8f0;"></span>'
        + '</div>';
      return;
    }
    var isB = /^B:/i.test(raw);
    var txt = raw.replace(/^[AB]:\s*/i, '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    var nm  = isB ? nameB : nameA;
    var col = isB ? colB : colA;
    var ini = nm.charAt(0);
    var rep = isB ? repB : repA;
    var imgUrl = rep && rep.image ? rep.image : '';
    var avatarHtml = imgUrl
      ? '<img src="'+imgUrl+'" style="width:34px;height:34px;border-radius:10px;object-fit:cover;flex-shrink:0;border:2px solid '+col+';" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div style="width:34px;height:34px;border-radius:10px;background:'+col+';color:#fff;display:none;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0;">'+ini+'</div>'
      : '<div style="width:34px;height:34px;border-radius:10px;background:'+col+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0;">'+ini+'</div>';
    html += '<div style="display:flex;align-items:flex-end;gap:8px;' + (isB ? 'justify-content:flex-end;' : '') + '">';
    if (!isB) html += avatarHtml;
    html += '<div style="max-width:68%;">'
      + '<div style="font-size:10px;font-weight:700;color:#94a3b8;margin-bottom:3px;'+(isB?'text-align:right;':'')+'">' + nm + (rep && rep.role ? ' · <span style="font-weight:500">'+rep.role+'</span>' : '') + '</div>'
      + '<div style="background:' + (isB ? '#2563eb' : '#fff') + ';color:' + (isB ? '#fff' : '#0f172a') + ';border:' + (isB ? 'none' : '1px solid #e2e8f0') + ';border-radius:16px;padding:10px 13px;font-size:14px;line-height:1.6;box-shadow:0 4px 12px rgba(15,23,42,.05);">'
      + txt + '</div>'
      + '</div>';
    if (isB) html += avatarHtml;
    html += '</div>';
  });
  html += '</div>';
  chat.innerHTML = html;
}

async function aiAnalyzeConv() {
  var btn = document.getElementById('ai-analyze-btn');
  var msgsText = document.getElementById('ce-msgs-text').value.trim();
  if (!msgsText) { alert('대화 내용을 먼저 입력해주세요'); return; }

  var lvl = document.getElementById('ce-lvl').value;
  var lvlMap = {s:'Seed',b:'Sprout',i:'Tree',a:'Forest'};

  btn.disabled = true;
  btn.textContent = '⏳ 분석 중...';

  var prompt = 'Korean language conversation (level: ' + lvlMap[lvl] + '):\n\n' + msgsText
    + '\n\nExtract for learners AND translate each message. Return ONLY valid JSON, no markdown:\n'
    + '{\n  "translations": [{"txt":"original Korean","en":"English translation"}],\n'
    + '  "vocab": [{"ko":"단어","rom":"romanization","en":"meaning"}],\n'
    + '  "grammar": [{"point":"pattern","ex":"example in English"}],\n'
    + '  "mission": ["writing task 1","writing task 2","writing task 3"]\n}'
    + '\n\ntranslations: one entry per A:/B: line in order. Vocab: 5-7 key words. Grammar: 2-3 patterns. Mission: 3 writing practice tasks.';

  try {
    var resp = await callClaude({
      feature: 'conv_analyze',
      model: 'claude-sonnet-4-20250514',
      max_tokens: 2000,
      messages: [{role:'user', content: prompt}]
    });
    var raw = resp.content.map(function(b){ return b.text||''; }).join('');
    raw = raw.replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/\s*```$/,'').trim();
    var parsed = JSON.parse(raw);

    document.getElementById('ce-vocab').value   = JSON.stringify(parsed.vocab   || [], null, 2);
    document.getElementById('ce-grammar').value = JSON.stringify(parsed.grammar || [], null, 2);
    document.getElementById('ce-mission').value = JSON.stringify(parsed.mission || [], null, 2);
    // Apply translations to messages in the script
    if (parsed.translations && parsed.translations.length) {
      var ta = document.getElementById('ce-msgs-text');
      var lines = ta.value.split('\n').filter(function(l){ return l.trim(); });
      var ti = 0;
      var newLines = lines.map(function(line) {
        if (/^[AB]:/i.test(line.trim()) && ti < parsed.translations.length) {
          var en = parsed.translations[ti].en || '';
          ti++;
          // Append [en:...] tag if not already present
          if (en && line.indexOf('[en:') < 0) return line.trimEnd() + ' [en:' + en + ']';
        }
        return line;
      });
      ta.value = newLines.join('\n');
      syncConvPreview();
    }
    document.getElementById('ai-result-area').style.display = 'block';

    btn.disabled = false;
    btn.textContent = '✅ 분석 완료 (재실행)';
    btn.style.background = '#059669';
    setTimeout(function(){ btn.textContent = '✨ AI 자동분석'; btn.style.background = '#7c3aed'; }, 3000);

  } catch(e) {
    btn.disabled = false;
    btn.textContent = '✨ AI 자동분석';
    var errEl = document.getElementById('ce-error');
    errEl.textContent = 'AI 분석 Error: ' + (e.message || String(e));
    errEl.style.display = 'block';
  }
}

async function saveConvEdit(rowId) {
  var ceErr = document.getElementById('ce-error');
  ceErr.style.display = 'none';

  var parseField = function(id) {
    var el = document.getElementById(id);
    if (!el || !el.value.trim()) return [];
    try { return JSON.parse(el.value); }
    catch(e) { throw new Error(id + ' JSON 파싱 Error: ' + e.message); }
  };

  // A:/B:/N: 텍스트 → msgs JSON
  var msgsText = document.getElementById('ce-msgs-text').value.trim();
  var castAId = (document.getElementById('ce-cast-a') || {}).value || '';
  var castBId = (document.getElementById('ce-cast-b') || {}).value || '';
  var _rep = _adminReporters || [];
  var _repA = castAId ? _rep.find(function(r){ return r.id === castAId; }) : null;
  var _repB = castBId ? _rep.find(function(r){ return r.id === castBId; }) : null;
  var msgs = msgsText.split('\n').filter(function(l){ return l.trim(); }).map(function(line) {
    var raw = line.trim();
    // Extract [en:...] tag if present
    var enMatch = raw.match(/\[en:([^\]]+)\]\s*$/);
    var en = enMatch ? enMatch[1].trim() : '';
    if (enMatch) raw = raw.replace(/\s*\[en:[^\]]+\]\s*$/, '').trim();
    if (/^N:/i.test(raw)) {
      return {s: 'n', txt: raw.replace(/^N:\s*/i, ''), en: en};
    }
    var isB = /^B:/i.test(raw);
    var txt = raw.replace(/^[AB]:\s*/i, '').trim();
    var charRef = isB ? _repB : _repA;
    return {s: isB ? 'r' : 'l', who: charRef ? charRef.name : (isB ? 'B' : 'A'), txt: txt, en: en};
  });

  try {
    var catVal = document.getElementById('ce-cat').value;
    var catLabelMap = {everyday:'Everyday', work:'Workplace', friends:'Friends', family:'Family', dating:'Dating'};
    var convObj = {
      name:     document.getElementById('ce-name').value.trim(),
      ctx:      document.getElementById('ce-ctx').value.trim(),
      cat:      catVal,
      lvl:      document.getElementById('ce-lvl').value,
      avi:      document.getElementById('ce-avi').value.trim() || '💬',
      catLabel: catLabelMap[catVal] || catVal,
      msgs:     msgs,
      vocab:    parseField('ce-vocab'),
      grammar:  parseField('ce-grammar'),
      mission:  parseField('ce-mission'),
    };
    if (castAId) convObj.cast_left_slug  = castAId;
    if (castBId) convObj.cast_right_slug = castBId;

    if (!convObj.name) throw new Error('이름을 입력해주세요');
    if (!convObj.msgs.length) throw new Error('대화 내용을 입력해주세요');

    var sb = getSb();
    var row = {data: convObj, cat: convObj.cat, lvl: convObj.lvl, name: convObj.name, ctx: convObj.ctx};

    if (rowId) {
      var { error } = await sb.from('conversations_data').update(row).eq('id', rowId);
      if (error) throw error;
    } else {
      var { error } = await sb.from('conversations_data').insert(row);
      if (error) throw error;
    }

    document.getElementById('conv-edit-overlay').remove();
    showToastAdmin('✅ 저장 완료! AI 분석 생성 중…');
    await loadConvList();

    // 10번: AI 자동으로 vocab/grammar/mission 생성 후 article_cache에 저장
    try {
      var savedRes = await sb.from('conversations_data').select('id').order('created_at', {ascending:false}).limit(1);
      var savedId = rowId || (savedRes.data && savedRes.data[0] && savedRes.data[0].id);
      if (savedId && (!convObj.vocab || !convObj.vocab.length)) {
        autoGenConvAI(savedId, convObj);
      }
    } catch(aiErr) { console.warn('AI gen skip:', aiErr); }

  } catch(e) {
    ceErr.textContent = e.message || String(e);
    ceErr.style.display = 'block';
  }
}

async function searchUnsplash(articleId) {
  var inp = document.getElementById('img-search-' + articleId);
  var res = document.getElementById('img-results-' + articleId);
  if (!inp || !res) return;
  var q = inp.value.trim();
  if (!q) return;
  
  res.innerHTML = '<span style="font-size:12px;color:#94a3b8">검색 중...</span>';
  
  try {
    // Unsplash Source API (무료, 랜덤 이미지)
    var keywords = q.split(' ').slice(0,3).join(',');
    var urls = [];
    for (var i = 0; i < 5; i++) {
      urls.push('https://source.unsplash.com/300x200/?' + encodeURIComponent(keywords) + '&sig=' + (Date.now() + i));
    }
    res.innerHTML = urls.map(function(u, i) {
      return '<img src="' + u + '" style="width:70px;height:50px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent" '
        + 'onclick="selectUnsplashImg(this, \'' + articleId + '\')" '
        + 'onmouseover="this.style.borderColor=\'#2563eb\'" onmouseout="this.style.borderColor=\'transparent\'">';
    }).join('');
  } catch(e) {
    res.innerHTML = '<span style="font-size:12px;color:#ef4444">Error: ' + e.message + '</span>';
  }
}

function selectUnsplashImg(imgEl, articleId) {
  var urlInp = document.getElementById('img-url-' + articleId);
  if (urlInp) urlInp.value = imgEl.src;
  // highlight selected
  var parent = imgEl.parentElement;
  parent.querySelectorAll('img').forEach(function(i){ i.style.borderColor = 'transparent'; });
  imgEl.style.borderColor = '#2563eb';
}

async function saveStoryEdit(rowId) {
  var seErr = document.getElementById('se-error');
  seErr.style.display = 'none';
  try {
    var lvlVal = document.getElementById('se-lvl').value;
    var storyObj = {
      title:     document.getElementById('se-title').value.trim(),
      title_en:  document.getElementById('se-title-en').value.trim(),
      lvl:       lvlVal,
      mood:      document.getElementById('se-mood').value.trim(),
      read_time: document.getElementById('se-read-time').value.trim() || '3 min',
      preview:   document.getElementById('se-preview').value.trim(),
      body:      document.getElementById('se-body').value.trim(),
    };
    if (!storyObj.title) throw new Error('제목을 입력해주세요');
    var sb = getSb();
    var row = {data: storyObj, lvl: lvlVal, mood: storyObj.mood, title: storyObj.title, title_en: storyObj.title_en, preview: storyObj.preview, read_time: storyObj.read_time};
    if (rowId) {
      var { error } = await sb.from('stories_data').update(row).eq('id', rowId);
      if (error) throw error;
    } else {
      var { error } = await sb.from('stories_data').insert(row);
      if (error) throw error;
    }
    document.getElementById('story-edit-overlay').remove();
    showToastAdmin('✅ 저장 완료! AI 분석 생성 중…');
    await loadStoryList();

    // 10번: AI 자동으로 vocab/grammar 생성 후 article_cache에 저장
    try {
      var savedRes2 = await sb.from('stories_data').select('id').order('created_at', {ascending:false}).limit(1);
      var savedId2 = rowId || (savedRes2.data && savedRes2.data[0] && savedRes2.data[0].id);
      if (savedId2 && (!storyObj.vocab || !storyObj.vocab.length)) {
        autoGenStoryAI(savedId2, storyObj);
      }
    } catch(aiErr2) { console.warn('AI gen skip:', aiErr2); }
  } catch(e) {
    seErr.textContent = e.message || String(e);
    seErr.style.display = 'block';
  }
}

var K_SHOP_ITEMS_FALLBACK = 'kh_shop_items_fallback';
var K_SHOP_ITEMS_FALLBACK_DB = 'shop_items_fallback';
function isShopTableMissingErr(err) {
  var msg = (err && err.message) ? String(err.message) : '';
  return msg.indexOf("Could not find the table 'public.shop_items'") >= 0
    || msg.indexOf("relation \"public.shop_items\" does not exist") >= 0;
}
async function getLocalShopItems(sb) {
  if (sb) {
    try {
      var r = await sb.from('app_settings').select('value').eq('key', K_SHOP_ITEMS_FALLBACK_DB).maybeSingle();
      if (r && r.data && r.data.value) {
        if (typeof r.data.value === 'string') return JSON.parse(r.data.value || '[]');
        return r.data.value || [];
      }
    } catch(e) {}
  }
  try { return JSON.parse(localStorage.getItem(K_SHOP_ITEMS_FALLBACK) || 'null') || []; }
  catch(e) { return []; }
}
async function setLocalShopItems(sb, items) {
  var data = items || [];
  if (sb) {
    try { await sb.from('app_settings').upsert({ key: K_SHOP_ITEMS_FALLBACK_DB, value: data }, { onConflict:'key' }); }
    catch(e) {}
  }
  localStorage.setItem(K_SHOP_ITEMS_FALLBACK, JSON.stringify(data));
}

async function seedShopDefaults(silent) {
  var sb = getSb();
  if (!sb) {
    await setLocalShopItems(sb, getDefaultShopItems());
    if (!silent) toast('기본 SHOP 아이템을 로컬 모드로 저장했습니다.');
    return;
  }
  var seedItems = getDefaultShopItems().map(function(it){ it.updated_at = new Date().toISOString(); return it; });
  var r = await sb.from('shop_items').upsert(seedItems, { onConflict:'id' });
  if (r.error) {
    if (isShopTableMissingErr(r.error)) {
      await setLocalShopItems(sb, seedItems);
      window._shopUseLocal = true;
      if (!silent) toast('shop_items 테이블이 없어 로컬 모드로 시드했습니다.');
      return;
    }
    if (!silent) toast('기본 아이템 시드 실패: ' + r.error.message, true);
    return;
  }
  window._shopUseLocal = false;
  if (!silent) toast('기본 SHOP 아이템 시드 완료');
}

async function saveShopItem(itemId, btn) {
  btn.disabled = true;
  var useLocal = !!window._shopUseLocal;
  var sb = getSb();
  var body = {
    id: document.getElementById('si-id').value.trim(),
    name: document.getElementById('si-name').value.trim(),
    slug: document.getElementById('si-name').value.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-'),
    description: document.getElementById('si-desc').value.trim(),
    image_url: document.getElementById('si-img').value.trim(),
    item_type: document.getElementById('si-type').value.trim() || 'one_time_unlock',
    coin_price: Number(document.getElementById('si-coin').value || 0),
    cash_price: Number(document.getElementById('si-cash').value || 0),
    is_active: document.getElementById('si-active').checked,
    can_buy_with_coin: document.getElementById('si-coin-on').checked,
    can_buy_with_cash: document.getElementById('si-cash-on').checked,
    is_repeatable: document.getElementById('si-repeat').checked,
    sort_order: Number(document.getElementById('si-sort').value || 100),
    updated_at: new Date().toISOString()
  };
  if (useLocal || !sb) {
    var items = await getLocalShopItems(sb);
    var idx = items.findIndex(function(x){ return x.id === body.id; });
    if (idx >= 0) items[idx] = body; else items.push(body);
    items.sort(function(a,b){ return Number(a.sort_order||100) - Number(b.sort_order||100); });
    await setLocalShopItems(sb, items);
    document.querySelector('.ov') && document.querySelector('.ov').remove();
    goShopManager();
    return;
  }
  var r = await sb.from('shop_items').upsert(body, { onConflict:'id' });
  if (r.error) {
    if (isShopTableMissingErr(r.error)) {
      window._shopUseLocal = true;
      var items2 = await getLocalShopItems(sb);
      var idx2 = items2.findIndex(function(x){ return x.id === body.id; });
      if (idx2 >= 0) items2[idx2] = body; else items2.push(body);
      await setLocalShopItems(sb, items2);
      document.querySelector('.ov') && document.querySelector('.ov').remove();
      goShopManager();
      return;
    }
    toast('Save error: ' + r.error.message, true); btn.disabled = false; return;
  }
  document.querySelector('.ov') && document.querySelector('.ov').remove();
  goShopManager();
}

async function deleteShopItem(itemId) {
  if (!confirm('Delete item ' + itemId + '?')) return;
  var sb = getSb();
  if (window._shopUseLocal) {
    await setLocalShopItems(sb, (await getLocalShopItems(sb)).filter(function(x){ return x.id !== itemId; }));
    goShopManager();
    return;
  }
  if (!sb) return;
  var r = await sb.from('shop_items').delete().eq('id', itemId);
  if (r.error) {
    if (isShopTableMissingErr(r.error)) {
      window._shopUseLocal = true;
      await setLocalShopItems(sb, (await getLocalShopItems(sb)).filter(function(x){ return x.id !== itemId; }));
      goShopManager();
      return;
    }
    toast('Delete error: ' + r.error.message, true); return;
  }
  goShopManager();
}

async function applyCoinAdjustment() {
  var sb = getSb();
  var uid = document.getElementById('coin-user-id').value.trim();
  var delta = Number(document.getElementById('coin-delta').value || 0);
  var reason = document.getElementById('coin-reason').value.trim() || 'admin adjustment';
  if (!uid) { toast('User ID를 입력하세요'); return; }
  if (!delta) { toast('Delta 값을 입력하세요'); return; }
  var res = await sb.rpc('admin_adjust_coin', { p_user_id: uid, p_delta: delta, p_reason: reason });
  var msg = document.getElementById('coin-admin-msg');
  if (res.error || !res.data || !res.data.ok) {
    msg.textContent = 'Error: ' + ((res.error && res.error.message) || (res.data && res.data.error) || 'failed');
    return;
  }
  msg.innerHTML = '✅ 완료: 신규 잔액 <b>' + res.data.coin_balance + '</b> 냥';
  // Log to coin_adjustments table
  try {
    await fetch(SUPA_URL_ADMIN+'/rest/v1/coin_adjustments', {
      method:'POST', headers:{'apikey':SUPA_SERVICE_KEY,'Authorization':'Bearer '+SUPA_SERVICE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({user_id:uid, delta:delta, reason:reason, new_balance:res.data.coin_balance, admin_by:'admin'})
    });
  } catch(e){}
  // Also log locally as fallback
  var history = JSON.parse(localStorage.getItem('kh_coin_history')||'[]');
  history.unshift({user_id:uid, delta:delta, reason:reason, new_balance:res.data.coin_balance, ts:new Date().toISOString()});
  localStorage.setItem('kh_coin_history', JSON.stringify(history.slice(0,200)));
  loadCoinHistory();
}

async function loadCoinHistory() {

  var rows = [];

      {headers:{'apikey':SUPA_SERVICE_KEY,'Authorization':'Bearer '+SUPA_SERVICE_KEY}});
    if (res.ok) rows = await res.json();
  } catch(e){}
  // Fallback to localStorage
  if (!rows.length) rows = JSON.parse(localStorage.getItem('kh_coin_history')||'[]');
  if (!rows.length) { wrap.innerHTML='<div style="color:var(--gr);font-size:13px;text-align:center;padding:20px">아직 조정 내역이 없습니다.</div>'; return; }

    +'<th style="padding:8px">날짜</th><th style="padding:8px">User ID</th><th style="padding:8px">변동</th><th style="padding:8px">잔액</th><th style="padding:8px">사유</th></tr></thead><tbody>'
    + rows.map(function(r){
        var ts = r.created_at||r.ts; var date = ts ? new Date(ts).toLocaleString('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '-';
        var d = r.delta||0; var color = d>=0?'#16a34a':'#dc2626'; var sign = d>=0?'+':'';
        return '<tr style="border-bottom:1px solid var(--border)"><td style="padding:8px;color:var(--gr)">'+date+'</td>'
          +'<td style="padding:8px;font-size:11px;font-family:monospace">'+(r.user_id||'').slice(0,12)+'…</td>'
          +'<td style="padding:8px;font-weight:800;color:'+color+'">'+sign+d+'</td>'
          +'<td style="padding:8px">'+(r.new_balance||'-')+'</td>'

      }).join('')+'</tbody></table>';

async function srLoadDailyContent() {
  var sb = getSb();
  var msgEl    = document.getElementById('srt-msg');
  var editorEl = document.getElementById('srt-editor');
  var emptyEl  = document.getElementById('srt-empty');
  var date  = (document.getElementById('srt-date').value  || '').trim();
  var level = (document.getElementById('srt-level').value || '').trim();
  if (!date || !level) { if (msgEl) msgEl.textContent = '날짜와 레벨을 선택하세요.'; return; }
  if (msgEl) msgEl.textContent = 'Loading...';

  var r = await sb.from('study_daily_content').select('*')
    .eq('scheduled_date', date).eq('level', level).maybeSingle();
  if (r.error) { if (msgEl) msgEl.textContent = 'Error: ' + r.error.message; return; }

  if (editorEl) {
    document.getElementById('srt-topic-ko').value = '';
    document.getElementById('srt-topic-en').value = '';
    document.getElementById('srt-vocab').value = '';
    document.getElementById('srt-grammar').value = '';
    document.getElementById('srt-helpers').value = '';
    document.getElementById('srt-dictation-sentences').value = '';
    document.getElementById('srt-dictation-questions').value = '';
    if (document.getElementById('srt-tw-sentences')) document.getElementById('srt-tw-sentences').value = '';
    document.getElementById('srt-admin-badge').style.display = 'none';
  }

  if (!r.data) {
    if (editorEl) editorEl.style.display = '';
    if (emptyEl)  emptyEl.style.display  = '';
    if (msgEl)    msgEl.textContent = '';
    // Clear all fields when no record found
    document.getElementById('srt-topic-ko').value = '';
    document.getElementById('srt-topic-en').value = '';
    document.getElementById('srt-vocab').value = '';
    document.getElementById('srt-grammar').value = '';
    document.getElementById('srt-helpers').value = '';
    document.getElementById('srt-dictation-sentences').value = '';
    document.getElementById('srt-dictation-questions').value = '';
    var twEl2 = document.getElementById('srt-tw-sentences'); if (twEl2) twEl2.value = '';
    return;
  }

  var rec = r.data;
  document.getElementById('srt-topic-ko').value = rec.topic_ko || '';
  document.getElementById('srt-topic-en').value = rec.topic_en || '';
  document.getElementById('srt-vocab').value = (rec.vocab || []).map(function(v) {
    return (v.ko||'') + '|' + (v.rom||'') + '|' + (v.en||'');
  }).join('\n');
  document.getElementById('srt-grammar').value = (rec.grammar || []).map(function(g) {
    return (g.pattern||'') + '|' + (g.explanation||'') + '|' + (g.example_ko||'') + '|' + (g.example_en||'');
  }).join('\n');
  document.getElementById('srt-helpers').value = (rec.helpers || []).map(function(h) {
    return (h.ko||'') + '|' + (h.en||'');
  }).join('\n');
  document.getElementById('srt-dictation-sentences').value = (rec.dictation_sentences || []).map(function(d) {
    return (d.ko||'') + '|' + (d.en||'');
  }).join('\n');
  document.getElementById('srt-dictation-questions').value = (rec.dictation_questions || []).map(function(d) {
    return (d.question_ko||'') + '|' + (d.answer_ko||'') + '|' + (d.hint_en||'');
  }).join('\n');
  var twEl = document.getElementById('srt-tw-sentences');
  if (twEl) {
    twEl.value = (rec.topic_writing_sentences || []).map(function(s) {
      var parts = [(s.ko||''), (s.en||'')];
      if (s.acceptable_orders && s.acceptable_orders.length) {
        s.acceptable_orders.forEach(function(ao){ parts.push(Array.isArray(ao)?ao.join(' '):String(ao)); });
      }
      if (s.explanation) parts.push(s.explanation);
      return parts.join('|');
    }).join('\n');
  }
  var badge = document.getElementById('srt-admin-badge');
  if (badge) badge.style.display = rec.admin_edited ? '' : 'none';
  var statusBadge = document.getElementById('srt-status-badge');
  if (statusBadge) {
    var st = rec.status || 'draft';
    statusBadge.style.display = '';
    statusBadge.textContent = st.toUpperCase();
    statusBadge.style.background = st === 'approved' ? '#dcfce7' : '#fef3c7';
    statusBadge.style.color = st === 'approved' ? '#15803d' : '#92400e';
  }

  if (editorEl) editorEl.style.display = '';
  if (emptyEl)  emptyEl.style.display  = 'none';
  if (msgEl)    msgEl.textContent = '불러왔습니다.';
}

async function srSaveDailyContent() {
  var sb = getSb(); if (!sb) return;
  var msgEl = document.getElementById('srt-msg');
  var date  = (document.getElementById('srt-date').value  || '').trim();
  var level = (document.getElementById('srt-level').value || '').trim();
  if (!date || !level) { if (msgEl) msgEl.textContent = '날짜와 레벨을 선택하세요.'; return; }
  if (msgEl) msgEl.textContent = '저장 중…';

  function parseLines(id, parser) {
    return (document.getElementById(id).value || '').trim().split('\n').filter(Boolean).map(parser);
  }
  var vocab = parseLines('srt-vocab', function(line) {
    var p = line.split('|'); return { ko:(p[0]||'').trim(), rom:(p[1]||'').trim(), en:(p[2]||'').trim(), level:level };
  });
  var grammar = parseLines('srt-grammar', function(line) {
    var p = line.split('|'); return { level:level, pattern:(p[0]||'').trim(), explanation:(p[1]||'').trim(), example_ko:(p[2]||'').trim(), example_en:(p[3]||'').trim() };
  });
  var helpers = parseLines('srt-helpers', function(line) {
    var p = line.split('|'); return { ko:(p[0]||'').trim(), en:(p[1]||'').trim() };
  });
  var dictation_sentences = parseLines('srt-dictation-sentences', function(line) {
    var p = line.split('|'); return { ko:(p[0]||'').trim(), en:(p[1]||'').trim() };
  });
  var dictation_questions = parseLines('srt-dictation-questions', function(line) {
    var p = line.split('|'); return { question_ko:(p[0]||'').trim(), answer_ko:(p[1]||'').trim(), hint_en:(p[2]||'').trim() };
  });

  var topic_writing_sentences = parseLines('srt-tw-sentences', function(line) {
    var p = line.split('|');
    var ko = (p[0]||'').trim(); var en = (p[1]||'').trim();
    if (!ko) return null;
    var acceptable_orders = []; var explanation = '';
    // p[2]+ are alternative orders or explanation
    for (var i = 2; i < p.length; i++) {
      var v = (p[i]||'').trim(); if (!v) continue;
      // If it contains Korean characters and spaces it's likely an alternative order
      if (/[가-힣]/.test(v) && v.indexOf(' ') >= 0) acceptable_orders.push(v.split(' '));
      else explanation = v; // last non-korean string is explanation
    }
    return { ko: ko, en: en, acceptable_orders: acceptable_orders, explanation: explanation };
  }).filter(Boolean);

  var r = await sb.from('study_daily_content').upsert({
    scheduled_date: date, level: level,
    topic_ko: (document.getElementById('srt-topic-ko').value || '').trim(),
    topic_en: (document.getElementById('srt-topic-en').value || '').trim(),
    vocab, grammar, helpers, dictation_sentences, dictation_questions,
    admin_edited: true, updated_at: new Date().toISOString()
  }, { onConflict: 'scheduled_date,level' });

  if (r.error) { if (msgEl) msgEl.textContent = 'Error: ' + r.error.message; return; }
  if (msgEl) msgEl.textContent = '저장됐습니다! (' + date + ' / ' + level + ')';
  var badge = document.getElementById('srt-admin-badge');
  if (badge) badge.style.display = '';
  await srLoadTopicSchedule();
}

async function srRegenDailyContent() {

  var date  = (document.getElementById('srt-date').value  || '').trim();
  var level = (document.getElementById('srt-level').value || '').trim();
  if (!date || !level) { if (msgEl) msgEl.textContent = '날짜와 레벨을 선택하세요.'; return; }
  if (!confirm('AI로 콘텐츠를 새로 생성합니다. 현재 내용이 덮어씌워집니다. 계속하시겠어요?')) return;

  try {
    // 1) Pick topic from writing_topics DB (or use form value if already filled)
    var existingKo = (document.getElementById('srt-topic-ko').value || '').trim();
    var existingEn = (document.getElementById('srt-topic-en').value || '').trim();

      if (msgEl) msgEl.textContent = 'writing_topics에서 토픽 가져오는 중…';

    }

    if (msgEl) msgEl.textContent = 'AI 생성 중… 토픽: ' + topicKo + ' (' + topicEn + ')';

    // 2) Generate content for this topic
    var topicHint = 'Use EXACTLY this topic: "' + topicKo + '" (' + topicEn + '). Do NOT change the topic.';
    var parsed = await _srGenerateContent(level, topicHint, topicKo, topicEn);

    document.getElementById('srt-topic-ko').value = parsed.topic_ko || topicKo;
    document.getElementById('srt-topic-en').value = parsed.topic_en || topicEn;
    document.getElementById('srt-vocab').value = (parsed.vocab||[]).map(function(v){ return (v.ko||'')+'|'+(v.rom||'')+'|'+(v.en||''); }).join('\n');
    document.getElementById('srt-grammar').value = (parsed.grammar||[]).map(function(g){ return (g.pattern||'')+'|'+(g.explanation||'')+'|'+(g.example_ko||'')+'|'+(g.example_en||''); }).join('\n');
    document.getElementById('srt-helpers').value = (parsed.helpers||[]).map(function(h){ return (h.ko||'')+'|'+(h.en||''); }).join('\n');
    document.getElementById('srt-dictation-sentences').value = (parsed.dictation_sentences||[]).map(function(d){ return (d.ko||'')+'|'+(d.en||''); }).join('\n');
    document.getElementById('srt-dictation-questions').value = (parsed.dictation_questions||[]).map(function(d){ return (d.question_ko||'')+'|'+(d.answer_ko||'')+'|'+(d.hint_en||''); }).join('\n');
    var twEl = document.getElementById('srt-tw-sentences');
    if (twEl) twEl.value = '';

    document.getElementById('srt-editor').style.display = '';
    document.getElementById('srt-empty').style.display = 'none';
    if (msgEl) msgEl.textContent = 'AI 생성 완료! 토픽: ' + topicKo + ' — 저장 버튼을 눌러 확정하세요.';
  } catch(err) {
    if (msgEl) msgEl.textContent = 'AI generation failed: ' + (err.message || err);
  }
}

// ── Pick an unused topic from writing_topics DB ──
async function _srPickTopicFromDB(sb, level) {
  if (!sb) sb = getSb();
  // Fetch all active topics for this level
  var topicsRes = await sb.from('writing_topics').select('topic_ko,topic_en').eq('level', level).eq('active', true);
  var allTopics = topicsRes.data || [];
  if (!allTopics.length) {
    // Fallback: try without level filter
    var fallbackRes = await sb.from('writing_topics').select('topic_ko,topic_en').eq('active', true);
    allTopics = fallbackRes.data || [];
  }
  if (!allTopics.length) return { topic_ko: '한국 음식', topic_en: 'Korean food' };

  // Get recently used topics (past 365 days) to avoid duplicates
  var usedRes = await sb.from('study_daily_content').select('topic_ko').eq('level', level).order('scheduled_date',{ascending:false}).limit(365);
  var usedKo = (usedRes.data||[]).map(function(r){ return r.topic_ko; });
  var available = allTopics.filter(function(t){ return usedKo.indexOf(t.topic_ko) < 0; });
  if (!available.length) available = allTopics; // All used, recycle

  // Random pick
  var pick = available[Math.floor(Math.random() * available.length)];
  return { topic_ko: pick.topic_ko || '', topic_en: pick.topic_en || '' };
}

// ── Shared AI generation prompt builder ──
function _srBuildPrompt(level, topicHint) {
  var levelGuide = {
    Starter:      'STARTER: Ultra-basic. Daily life, family, food. Vocab: 1-2 syllable words. Grammar: ~이에요/예요, ~있어요/없어요. Sentences max 4 words.',
    Beginner:     'BEGINNER: Present tense (~아요/어요). Basic particles. Everyday vocab. Helper sentences 5-8 words.',
    Intermediate: 'INTERMEDIATE: Past tense, conjunctions, modals. Sentences 8-12 words. Topic-specific terms.',
    Advanced:     'ADVANCED: Complex structures, formal style, advanced connectors. Sentences 12+ words. Abstract vocab.'
  };
  var levelExtra = '';
  var levelExtraCounts = '';
  if (level === 'Intermediate' || level === 'Advanced') {
    levelExtra = ',"confusing_grammar":[{"pair":["~grammar1","~grammar2"],"explanation":"","wrong":"","correct":""}]';
    levelExtraCounts = ', confusing_grammar=2';
  }
  if (level === 'Advanced') {
    levelExtra += ',"formality_exercise":{"casual":"","formal":"","explanation":""},"culture_note":"1-2 sentence Korean cultural note"';
    levelExtraCounts += ', formality_exercise=1, culture_note=1';
  }

  return 'Korean language teacher. Create daily study content for ' + level + ' level.\n'
    + 'Level: ' + (levelGuide[level] || levelGuide.Beginner) + '\n'
    + topicHint + '\n\n'
    + 'Return ONLY valid JSON (strict RFC8259, no markdown, no comments, no trailing commas):\n'
    + '{"topic_ko":"...","topic_en":"...",'
    + '"vocab":[{"ko":"","rom":"","en":""}],'
    + '"grammar":[{"pattern":"","explanation":"","example_ko":"","example_en":""}],'
    + '"helpers":[{"ko":"","en":""}],'
    + '"dictation_sentences":[{"ko":"","en":""}],'
    + '"dictation_questions":[{"question_ko":"","answer_ko":"","hint_en":""}]'
    + levelExtra + '}'
    + '\nExact counts: vocab=5, grammar=3, helpers=4, dictation_sentences=3, dictation_questions=3' + levelExtraCounts + '.';
}

async function _srGenerateContent(level, topicHint, forceTopicKo, forceTopicEn) {
  var prompt = _srBuildPrompt(level, topicHint);
  var parsed = null;
  for (var attempt = 1; attempt <= 3; attempt++) {
    var resp = await callClaude({ feature:'study-room-daily-admin', model:'claude-haiku-4-5-20251001', max_tokens:2500, messages:[{role:'user',content:prompt}] });
    var raw = (resp.content || []).map(function(c){ return c.text||''; }).join('');
    try {
      parsed = srParseStrictJsonObject(raw);
      // Force the topic to match what was requested (AI sometimes changes it)
      if (forceTopicKo) parsed.topic_ko = forceTopicKo;
      if (forceTopicEn) parsed.topic_en = forceTopicEn;
      return parsed;
    } catch(parseErr) {
      if (attempt === 3) throw parseErr;
    }
  }
  throw new Error('AI generation failed after 3 attempts');
}

async function srLoadTopicSchedule() {
  var sb = getSb();
  var el = document.getElementById('srt-list'); if (!sb || !el) return;
  var today = new Date().toISOString().slice(0, 10);
  var past   = new Date(Date.now() - 3 * 86400000).toISOString().slice(0, 10);
  var future = new Date(Date.now() + 14 * 86400000).toISOString().slice(0, 10);
  var r = await sb.from('study_daily_content')
    .select('scheduled_date,level,topic_ko,topic_en,admin_edited,status')
    .gte('scheduled_date', past)
    .lte('scheduled_date', future)
    .order('scheduled_date', { ascending: true })
    .order('level', { ascending: true });
  if (r.error) { el.innerHTML = '<div style="color:#ef4444;padding:12px">Error: ' + r.error.message + '</div>'; return; }
  var rows = r.data || [];
  if (!rows.length) { el.innerHTML = '<div style="color:#94a3b8;font-size:13px;padding:12px">콘텐츠가 없습니다. "Pre-generate 10 days" 버튼으로 생성하세요.</div>'; return; }

  // Group by date for better readability
  var lvlNames = {Starter:'Seed',Beginner:'Sprout',Intermediate:'Tree',Advanced:'Forest'};
  var lvlColors = {Starter:'#a855f7',Beginner:'#22c55e',Intermediate:'#f59e0b',Advanced:'#ef4444'};
  var allLevels = ['Starter','Beginner','Intermediate','Advanced'];

  // Find dates that have all 4 levels
  var dateMap = {};
  rows.forEach(function(row) {
    if (!dateMap[row.scheduled_date]) dateMap[row.scheduled_date] = {};
    dateMap[row.scheduled_date][row.level] = row;
  });

  var html = '<div style="font-weight:800;margin-bottom:10px">콘텐츠 현황 (과거3일 ~ 미래14일)</div>';
  Object.keys(dateMap).sort().forEach(function(date) {
    var isPast = date < today;
    var isToday = date === today;
    var dateLabel = isToday ? '📌 ' + date + ' (오늘)' : date;
    var dateBg = isToday ? '#eff6ff' : isPast ? '#f8fafc' : '#fff';
    var levels = dateMap[date];
    var missingLevels = allLevels.filter(function(l){ return !levels[l]; });

    html += '<div style="padding:10px 12px;border:1px solid ' + (isToday ? '#3b82f6' : '#e2e8f0') + ';border-radius:10px;margin-bottom:8px;background:' + dateBg + '">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'
      + '<span style="font-weight:800;font-size:13px;color:' + (isPast ? '#94a3b8' : '#0f172a') + '">' + dateLabel + '</span>';
    if (missingLevels.length && !isPast) {
      html += '<span style="font-size:10px;color:#ef4444;font-weight:700">⚠ ' + missingLevels.map(function(l){ return lvlNames[l]; }).join(', ') + ' 미생성</span>';
    }
    html += '</div>';
    allLevels.forEach(function(lvl) {
      var row = levels[lvl];
      if (!row) return;
      html += '<div style="display:flex;gap:6px;align-items:center;padding:4px 0;flex-wrap:wrap">'
        + '<span style="background:' + (lvlColors[lvl]||'#94a3b8') + ';color:#fff;padding:1px 8px;border-radius:999px;font-size:10px;font-weight:800;min-width:48px;text-align:center">' + (lvlNames[lvl]||lvl) + '</span>'
        + (row.admin_edited ? '<span style="background:#fde68a;color:#92400e;padding:1px 6px;border-radius:999px;font-size:9px;font-weight:700">편집됨</span>' : '')
        + '<span style="background:' + ((row.status||'draft')==='approved'?'#dcfce7':'#fef3c7') + ';color:' + ((row.status||'draft')==='approved'?'#15803d':'#92400e') + ';padding:1px 6px;border-radius:999px;font-size:9px;font-weight:700">' + (row.status||'draft').toUpperCase() + '</span>'
        + '<span style="flex:1;font-size:11px;color:#475569;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (row.topic_ko||'') + ' · ' + (row.topic_en||'') + '</span>'

async function srPregenerate10Days() {
  var sb = getSb();
  var el = document.getElementById('srt-list');
  if (!sb) { if (el) el.innerHTML = '<div style="padding:20px;text-align:center;color:#ef4444">Supabase 연결 실패 — 새로고침 후 다시 시도하세요.</div>'; return; }
  var level = (document.getElementById('srt-level').value || 'Beginner').trim();
  var lvlDisplay = {Starter:'Seed',Beginner:'Sprout',Intermediate:'Tree',Advanced:'Forest'}[level]||level;
  if (!confirm('Generate 10 days of topics for ' + lvlDisplay + '?')) return;
  if (el) el.innerHTML = '<div style="padding:20px;text-align:center;color:#475569">Generating 10 days for ' + lvlDisplay + '... (30-60초 소요)</div>';

  try {
    // Check which dates already exist
    var today = new Date();
    var dates = [];
    for (var i = 0; i < 10; i++) {
      var d = new Date(today.getTime() + i * 86400000);
      dates.push(d.toISOString().slice(0, 10));
    }
    var existing = await sb.from('study_daily_content').select('scheduled_date').eq('level', level).in('scheduled_date', dates);
    if (existing.error) throw new Error('DB 조회 실패: ' + existing.error.message);
    var existingDates = (existing.data || []).map(function(r){ return r.scheduled_date; });
    var missing = dates.filter(function(d){ return existingDates.indexOf(d) < 0; });

    if (!missing.length) {
      if (el) el.innerHTML = '<div style="padding:20px;text-align:center;color:#16a34a">All 10 days already have topics for ' + lvlDisplay + '!</div>';
      await srLoadTopicSchedule();
      return;
    }

    // Get writing_topics for dedup
    var topicsRes = await sb.from('writing_topics').select('*').eq('level', level).eq('active', true);
    var allTopics = topicsRes.data || [];
    var usedRes = await sb.from('study_daily_content').select('topic_ko').eq('level', level).order('scheduled_date',{ascending:false}).limit(365);
    var usedKo = (usedRes.data||[]).map(function(r){return r.topic_ko;});
    var available = allTopics.filter(function(t){ return usedKo.indexOf(t.topic_ko)<0; });
    if (!available.length) available = allTopics;

    var generated = 0;
    var errors = [];
    for (var mi = 0; mi < missing.length; mi++) {
      // Throttle: wait 1.5s between API calls to avoid rate limiting
      if (mi > 0) await new Promise(function(r){ setTimeout(r, 1500); });
      var date = missing[mi];
      var topic = available.length ? available[mi % available.length] : null;
      var topicKo = topic ? topic.topic_ko : '';
      var topicEn = topic ? topic.topic_en : '';
      var topicHint = topic
        ? 'Use EXACTLY this topic: "' + topicKo + '" (' + topicEn + '). Do NOT change the topic.'
        : 'Pick an interesting Korean daily life topic.';

      try {
        var parsed = await _srGenerateContent(level, topicHint, topicKo || null, topicEn || null);

        var rec = {
          scheduled_date: date, level: level,
          topic_ko: parsed.topic_ko||topicKo||'', topic_en: parsed.topic_en||topicEn||'',
          vocab: parsed.vocab||[], grammar: parsed.grammar||[], helpers: parsed.helpers||[],
          dictation_sentences: parsed.dictation_sentences||[], dictation_questions: parsed.dictation_questions||[],
          confusing_grammar: parsed.confusing_grammar||null,
          formality_exercise: parsed.formality_exercise||null,
          culture_note: parsed.culture_note||null,
          admin_edited: false, updated_at: new Date().toISOString()
        };
        var upsertRes = await sb.from('study_daily_content').upsert(rec, {onConflict:'scheduled_date,level'});
        if (upsertRes.error) throw new Error('DB 저장 실패: ' + upsertRes.error.message);
        generated++;
        if (el) el.innerHTML = '<div style="padding:20px;text-align:center;color:#475569">' + lvlDisplay + ' ' + generated + '/' + missing.length + ' 생성 완료…</div>';
      } catch(err) {
        errors.push(date + ': ' + (err.message||err));
        console.warn('pregen failed for', date, err);
      }
    }

    var summary = generated + '/' + missing.length + ' days generated for ' + lvlDisplay + '.';
    if (errors.length) summary += '\n실패: ' + errors.join(', ');
    toast(summary);
  } catch(err) {
    if (el) el.innerHTML = '<div style="padding:20px;text-align:center;color:#ef4444">Error: ' + (err.message||err) + '</div>';
  }
  await srLoadTopicSchedule();
}

function srExtractFirstJSONObject(raw) {
  var text = String(raw || '').replace(/```json|```/gi, '').trim();
  if (!text) return '';
  var start = text.indexOf('{');
  if (start < 0) return '';

  var depth = 0;
  var inString = false;
  var escaped = false;
  for (var i = start; i < text.length; i++) {
    var ch = text[i];
    if (inString) {
      if (escaped) escaped = false;
      else if (ch === '\\') escaped = true;
      else if (ch === '"') inString = false;
      continue;
    }
    if (ch === '"') { inString = true; continue; }
    if (ch === '{') depth++;
    if (ch === '}') {
      depth--;
      if (depth === 0) return text.slice(start, i + 1);
    }
  }
  return '';
}

function srParseStrictJsonObject(raw) {
  var extracted = srExtractFirstJSONObject(raw);
  if (!extracted) throw new Error('No JSON object in AI response');

  // Try strict parse first.
  try { return JSON.parse(extracted); } catch (_) {}

  // Fallback: remove trailing commas that often break JSON.
  var softened = extracted.replace(/,\s*([}\]])/g, '$1');
  try { return JSON.parse(softened); } catch (e) {}

  throw new Error('Invalid JSON from AI response');
}

    + '<div style="font-weight:800;font-size:15px;margin-bottom:10px">📊 Article Study 제출 현황</div>'
    + '<div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px">'
    + '<div class="fg" style="margin:0"><label>날짜 (이후)</label><input type="date" id="srs-date"></div>'
    + '<button class="btn btn-g" onclick="srLoadSubmissions()">조회</button>'
    + '<button class="btn" onclick="srExportSubmissions()">📥 CSV</button>'
    + '</div>'
    + '<div id="srs-msg" style="font-size:12px;color:#475569;margin-bottom:8px"></div>'
    + '</div>'
    + '<div class="sf-card" id="srs-list">조회 버튼을 눌러 불러오세요.</div>';
}

async function srLoadSubmissions() {
  var sb = getSb(); if (!sb) return;
  var el = document.getElementById('srs-list'); if (!el) return;
  var msg = document.getElementById('srs-msg');
  var date = (document.getElementById('srs-date').value || new Date(Date.now()-7*86400000).toISOString().slice(0,10));
  el.innerHTML = 'Loading...';
  var r = await sb.from('article_study_submissions')
    .select('id,user_id,article_id,article_title,study_date,step4_content,step5_content,submitted,auto_submitted,submitted_at,created_at')
    .gte('study_date', date)
    .order('submitted_at', { ascending: false })
    .limit(100);
  if (r.error) { el.innerHTML = 'Error: ' + r.error.message; return; }
  var rows = r.data || [];
  if (msg) msg.textContent = rows.length + '건 조회됨 (' + date + ' 이후)';
  if (!rows.length) { el.innerHTML = '<div style="color:#94a3b8;font-size:13px">제출 내역이 없습니다.</div>'; return; }
  el.innerHTML = '<table style="width:100%;border-collapse:collapse;font-size:12px">'
    + '<thead><tr style="background:#f8fafc;font-weight:700">'
    + '<th style="padding:8px;text-align:left;border-bottom:1px solid #e2e8f0">날짜</th>'
    + '<th style="padding:8px;text-align:left;border-bottom:1px solid #e2e8f0">사용자</th>'
    + '<th style="padding:8px;text-align:left;border-bottom:1px solid #e2e8f0">기사</th>'
    + '<th style="padding:8px;text-align:left;border-bottom:1px solid #e2e8f0">글쓰기</th>'
    + '<th style="padding:8px;text-align:left;border-bottom:1px solid #e2e8f0">제출 방식</th>'
    + '</tr></thead><tbody>'
    + rows.map(function(row) {
        var step5 = (row.step5_content||'').slice(0,80) + ((row.step5_content||'').length>80?'…':'');
        var how = row.auto_submitted ? '<span style="background:#fde68a;color:#92400e;padding:1px 6px;border-radius:999px;font-size:10px">자동</span>'
          : row.submitted ? '<span style="background:#dcfce7;color:#15803d;padding:1px 6px;border-radius:999px;font-size:10px">수동</span>'
          : '<span style="background:#f1f5f9;color:#64748b;padding:1px 6px;border-radius:999px;font-size:10px">미제출</span>';
        return '<tr style="border-bottom:1px solid #f1f5f9">'
          + '<td style="padding:8px;color:#475569">' + (row.study_date||'') + '</td>'
          + '<td style="padding:8px;font-family:monospace;font-size:10px;color:#64748b">' + (row.user_id||'').slice(0,8) + '…</td>'
          + '<td style="padding:8px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (row.article_title||row.article_id||'') + '</td>'
          + '<td style="padding:8px;color:#334155;max-width:220px">' + step5 + '</td>'
          + '<td style="padding:8px">' + how + '</td>'
          + '</tr>';
      }).join('')
    + '</tbody></table>';
}

function srExportSubmissions() {
  var el = document.getElementById('srs-list'); if (!el) return;
  var rows = el.querySelectorAll('tbody tr');
  var csv = ['날짜,사용자ID,기사,글쓰기,제출방식'];
  rows.forEach(function(tr) {
    var cells = tr.querySelectorAll('td');
    csv.push([0,1,2,3,4].map(function(i){ return '"'+(cells[i]?cells[i].textContent.replace(/"/g,'""'):'') +'"'; }).join(','));
  });
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent('\uFEFF' + csv.join('\n'));
  a.download = 'article_study_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

async function srLoadHelpers() {
  var sb = getSb();
  var el = document.getElementById('srh-list');
  if (!sb || !el) return;
  var lv = (document.getElementById('srh-filter-level') || {}).value || '';
  var q = sb.from('study_room_helpers').select('id,level,ko,en,display_order,active').order('display_order');
  if (lv) q = q.eq('level', lv);
  var r = await q;
  if (r.error) { el.innerHTML = 'Error: ' + r.error.message; return; }
  var rows = r.data || [];
  if (!rows.length) { el.innerHTML = '<div style="color:#94a3b8;font-size:13px">등록된 도움 문장이 없습니다.</div>'; return; }
  el.innerHTML = rows.map(function(h){
    return '<div style="border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:8px">'
      + '<div style="display:flex;justify-content:space-between;align-items:center">'
      + '<span style="font-size:11px;font-weight:700;color:#64748b">' + ({Starter:'Seed',Beginner:'Sprout',Intermediate:'Tree',Advanced:'Forest'}[h.level]||h.level) + ' · order:' + h.display_order + (h.active ? '' : ' · [비활성]') + '</span>'
      + '<div style="display:flex;gap:6px"><button class="btn" onclick="srEditHelper(\'' + h.id + '\')">Edit</button>'
      + '<button class="btn btn-r" onclick="srDeleteHelper(\'' + h.id + '\')">Delete</button></div></div>'
      + '<div style="font-weight:700;margin-top:4px">' + h.ko + '</div>'
      + '<div style="font-size:12px;color:#64748b">' + h.en + '</div></div>';
  }).join('');
}

async function srEditHelper(id) {
  var sb = getSb();
  var r = await sb.from('study_room_helpers').select('*').eq('id', id).maybeSingle();
  if (r.error || !r.data) return;
  document.getElementById('srh-id').value    = r.data.id;
  document.getElementById('srh-level').value = r.data.level;
  document.getElementById('srh-ko').value    = r.data.ko;
  document.getElementById('srh-en').value    = r.data.en;
  document.getElementById('srh-order').value = r.data.display_order;
  document.getElementById('srh-msg').textContent = '수정 중 — 저장 버튼을 눌러 확정하세요.';
  window.scrollTo(0,0);
}

async function srSaveHelper() {
  var sb = getSb(); if (!sb) return;
  var id  = (document.getElementById('srh-id').value || '').trim();
  var ko  = (document.getElementById('srh-ko').value || '').trim();
  var en  = (document.getElementById('srh-en').value || '').trim();
  var lv  = document.getElementById('srh-level').value;
  var ord = parseInt(document.getElementById('srh-order').value) || 0;
  if (!ko || !en) { document.getElementById('srh-msg').textContent = 'Korean + English 모두 입력하세요.'; return; }
  var row = { level:lv, ko:ko, en:en, display_order:ord, active:true, updated_at:new Date().toISOString() };
  var r;
  if (id) { r = await sb.from('study_room_helpers').update(row).eq('id', id); }
  else     { r = await sb.from('study_room_helpers').insert(row); }
  var msg = document.getElementById('srh-msg');
  if (r.error) { msg.textContent = 'Error: ' + r.error.message; return; }
  msg.textContent = '저장됐습니다!';
  srClearHelperForm();
  await srLoadHelpers();
}

async function srDeleteHelper(id) {
  if (!confirm('Delete?')) return;
  var r = await getSb().from('study_room_helpers').delete().eq('id', id);
  if (r.error) { alert(r.error.message); return; }
  await srLoadHelpers();
}

function srClearHelperForm() {
  document.getElementById('srh-id').value = '';
  document.getElementById('srh-ko').value = '';
  document.getElementById('srh-en').value = '';
  document.getElementById('srh-order').value = '0';
  document.getElementById('srh-msg').textContent = '';
}

async function srSaveGrammar() {
  var sb = getSb(); if (!sb) return;
  var id  = (document.getElementById('srg-id').value || '').trim();
  var row = {
    level:       document.getElementById('srg-level').value,
    pattern:     (document.getElementById('srg-pattern').value || '').trim(),
    explanation: (document.getElementById('srg-exp').value || '').trim(),
    example_ko:  (document.getElementById('srg-exko').value || '').trim(),
    example_en:  (document.getElementById('srg-exen').value || '').trim(),
    structure:   (document.getElementById('srg-structure').value || '').trim() || null,
    when_to_use: (document.getElementById('srg-when').value || '').trim() || null,
    watch_out:   (document.getElementById('srg-watch').value || '').trim() || null,
    display_order: parseInt(document.getElementById('srg-order').value) || 0,
    active: true,
    updated_at: new Date().toISOString()
  };
  if (!row.pattern || !row.example_ko) { document.getElementById('srg-msg').textContent = 'Pattern + Example KO 를 입력하세요.'; return; }
  var r = id
    ? await sb.from('study_room_grammar').update(row).eq('id', id)
    : await sb.from('study_room_grammar').insert(row);
  if (r.error) { document.getElementById('srg-msg').textContent = 'Error: ' + r.error.message; return; }

  srClearGrammarForm();
  await srLoadGrammar();
}

function srPreviewImage(input) {
  var prev = document.getElementById('srp-img-preview');
  if (!prev || !input.files[0]) return;
  var url = URL.createObjectURL(input.files[0]);
  prev.innerHTML = '<img src="' + url + '" style="max-width:240px;max-height:160px;border-radius:8px;margin-top:4px">';
}

async function srUploadImage(file) {
  var sb = getSb();
  if (!sb) throw new Error('No admin client');
  var ext  = file.name.split('.').pop();
  var path = 'study-images/' + Date.now() + '-' + Math.random().toString(36).slice(2) + '.' + ext;
  var up   = await sb.storage.from('study-images').upload(path, file, { upsert:true, contentType: file.type });
  if (up.error) throw up.error;
  return sb.storage.from('study-images').getPublicUrl(path).data.publicUrl;
}

async function srLoadPictures() {
  var sb = getSb();
  var el = document.getElementById('srp-list');
  if (!sb || !el) return;
  var r = await sb.from('study_picture_prompts')
    .select('id,prompt_ko,image_url,is_active,scheduled_date,word_order_words,vocab_items,incorrect_sentences,updated_at')
    .order('scheduled_date', { ascending:false, nullsFirst:false });
  if (r.error) { el.innerHTML = 'Error: ' + r.error.message; return; }
  var rows = r.data || [];
  if (!rows.length) { el.innerHTML = '<div style="color:#94a3b8;font-size:13px">등록된 이미지가 없습니다.</div>'; return; }
  el.innerHTML = '<div style="font-weight:800;margin-bottom:8px">Picture Prompt 목록</div>' + rows.map(function(p){
    var badge = p.scheduled_date
      ? '<span style="background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800">' + p.scheduled_date + '</span>'
      : '<span style="background:#f1f5f9;color:#94a3b8;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700">미지정</span>';
    var woBadge = (p.word_order_words && p.word_order_words.length)
      ? '<span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700">S2:어절 ' + p.word_order_words.length + '개</span>' : '';
    var vocabBadge = (p.vocab_items && p.vocab_items.length)
      ? '<span style="background:#fef9c3;color:#854d0e;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700">S1:어휘 ' + p.vocab_items.length + '개</span>' : '';
    var sentBadge = (p.incorrect_sentences && p.incorrect_sentences.length)
      ? '<span style="background:#ede9fe;color:#5b21b6;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700">S3:문장 ' + p.incorrect_sentences.length + '개</span>' : '';
    return '<div style="border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:8px">'
      + '<div style="display:flex;justify-content:space-between;align-items:start;gap:8px">'
      + '<div style="flex:1;min-width:0">'
      + '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px">'
      + badge + vocabBadge + woBadge + sentBadge
      + (p.is_active ? '' : '<span style="background:#fee2e2;color:#dc2626;padding:2px 6px;border-radius:999px;font-size:10px;font-weight:700">비활성</span>') + '</div>'
      + '<div style="font-weight:800;font-size:13px;word-break:break-all">' + p.id + '</div>'
      + '<div style="font-size:12px;color:#475569;margin-top:3px">' + (p.prompt_ko || '') + '</div>'
      + (p.image_url ? '<img src="' + p.image_url + '" style="margin-top:6px;max-width:120px;max-height:80px;border-radius:6px;object-fit:cover">' : '') + '</div>'
      + '<div style="display:flex;flex-direction:column;gap:5px;flex-shrink:0">'
      + '<button class="btn" onclick="srEditPicture(\'' + p.id + '\')">Edit</button>'
      + '<button class="btn btn-r" onclick="srDeletePicture(\'' + p.id + '\')">Delete</button></div></div></div>';
  }).join('');
}

async function srEditPicture(id) {
  var sb = getSb();
  var r = await sb.from('study_picture_prompts')
    .select('id,prompt_ko,image_url,sample_answer,word_order_words,vocab_items,incorrect_sentences,custom_prompt,scheduled_date,is_active')
    .eq('id', id).maybeSingle();
  if (r.error || !r.data) return;
  var d = r.data;
  document.getElementById('srp-uuid').value   = d.id;
  document.getElementById('srp-id').value     = d.id;
  document.getElementById('srp-prompt').value = d.prompt_ko || '';
  document.getElementById('srp-image').value  = d.image_url || '';
  document.getElementById('srp-custom').value = d.custom_prompt || '';
  document.getElementById('srp-sample').value = d.sample_answer || '';
  document.getElementById('srp-date').value   = d.scheduled_date || '';
  document.getElementById('srp-active').checked = !!d.is_active;
  var words = Array.isArray(d.word_order_words) ? d.word_order_words : [];
  document.getElementById('srp-words').value = words.join('\n');
  // vocab_items (Step 1)
  var vocab = Array.isArray(d.vocab_items) ? d.vocab_items : [];
  document.getElementById('srp-vocab').value = vocab.map(function(v) { return (v.ko||'') + '|' + (v.en||''); }).join('\n');
  // incorrect_sentences (Step 3)
  var sents = Array.isArray(d.incorrect_sentences) ? d.incorrect_sentences : [];
  document.getElementById('srp-correct-sents').value = sents.filter(function(s) { return s.is_correct; }).map(function(s) { return s.sentence; }).join('\n');
  var wrongItem = sents.find(function(s) { return !s.is_correct; });
  document.getElementById('srp-wrong-sent').value = wrongItem ? (wrongItem.sentence || '') : '';
  var prev = document.getElementById('srp-img-preview');
  if (prev) prev.innerHTML = d.image_url ? '<img src="' + d.image_url + '" style="max-width:240px;max-height:160px;border-radius:8px">' : '';
  document.getElementById('srp-msg').textContent = '수정 중 — 저장 버튼으로 확정하세요.';
  window.scrollTo(0,0);
}

async function srSavePicture() {
  var sb = getSb(); if (!sb) return;
  var msgEl = document.getElementById('srp-msg');
  msgEl.textContent = '저장 중…';
  var id = (document.getElementById('srp-id').value || '').trim();
  if (!id) { msgEl.textContent = 'Prompt ID를 입력하세요.'; return; }

  // Image: upload file if selected, else use URL field
  var imgUrl = (document.getElementById('srp-image').value || '').trim();
  var fileInput = document.getElementById('srp-img-file');
  if (fileInput && fileInput.files[0]) {
    try { imgUrl = await srUploadImage(fileInput.files[0]); }
    catch(e) { msgEl.textContent = 'Image upload failed: ' + e.message; return; }
  }

  // Parse word-order words (Step 2)
  var rawWords = (document.getElementById('srp-words').value || '').trim();
  var words = rawWords
    ? rawWords.split(/[\n,]+/).map(function(w){ return w.trim(); }).filter(Boolean)
    : [];

  // Parse vocab items (Step 1) — format per line: 한국어|English
  var vocabRaw = (document.getElementById('srp-vocab').value || '').trim();
  var vocabItems = vocabRaw
    ? vocabRaw.split('\n').map(function(line) {
        var parts = line.trim().split('|');
        return { ko: (parts[0] || '').trim(), en: (parts[1] || '').trim() };
      }).filter(function(v) { return v.ko; })
    : [];

  // Parse incorrect sentences (Step 3)
  var correctSentsRaw = (document.getElementById('srp-correct-sents').value || '').trim();
  var wrongSent = (document.getElementById('srp-wrong-sent').value || '').trim();
  var incorrectSentences = [];
  if (correctSentsRaw) {
    correctSentsRaw.split('\n').forEach(function(s) {
      s = s.trim(); if (s) incorrectSentences.push({ sentence: s, is_correct: true });
    });
  }
  if (wrongSent) incorrectSentences.push({ sentence: wrongSent, is_correct: false });

  var scheduledDate = (document.getElementById('srp-date').value || '').trim() || null;
  var row = {
    id:                   id,
    prompt_ko:            (document.getElementById('srp-prompt').value || '').trim(),
    image_url:            imgUrl,
    sample_answer:        (document.getElementById('srp-sample').value || '').trim(),
    word_order_words:     words,
    vocab_items:          vocabItems,
    incorrect_sentences:  incorrectSentences,
    custom_prompt:        (document.getElementById('srp-custom').value || '').trim() || null,
    scheduled_date:       scheduledDate,
    is_active:            document.getElementById('srp-active').checked,
    updated_at:           new Date().toISOString()
  };

  var r = await sb.from('study_picture_prompts').upsert(row, { onConflict:'id' });
  if (r.error) { msgEl.textContent = 'Error: ' + r.error.message; return; }
  msgEl.textContent = '저장됐습니다! (' + id + ')';
  srClearPictureForm();
  await srLoadPictures();
}

async function srDeletePicture(id) {
  if (!confirm('Delete? (' + id + ')')) return;
  var r = await getSb().from('study_picture_prompts').delete().eq('id', id);
  if (r.error) { alert(r.error.message); return; }
  await srLoadPictures();
}

function srClearPictureForm() {
  ['srp-uuid','srp-id','srp-image','srp-custom','srp-sample','srp-date','srp-words'].forEach(function(id){
    var el = document.getElementById(id); if (el) el.value = '';
  });
  document.getElementById('srp-prompt').value = '';
  document.getElementById('srp-active').checked = true;
  var prev = document.getElementById('srp-img-preview'); if (prev) prev.innerHTML = '';
  var msg  = document.getElementById('srp-msg');        if (msg)  msg.textContent = '';
  var fi   = document.getElementById('srp-img-file');   if (fi)   fi.value = '';
}

var _aseCurrentContent = null;

async function goArticleStudyEditor() {

var _aseAllArticles = [];
var _aseEditedIds   = new Set();

async function aseLoadList() {
  var sb = getSb();
  var el = document.getElementById('ase-list');
  if (!el) return;
  try {
    // articles_data 조회 — 컬럼 선택을 최소화 (누락 컬럼 에러 방지)
    var artsRes = await sb.from('articles_data').select('id,title,section,topik_level,image').order('created_at',{ascending:false}).limit(200);
    if (artsRes.error) {
      // image 컬럼이 없을 수 있음 — 재시도
      artsRes = await sb.from('articles_data').select('id,title,section,topik_level').order('created_at',{ascending:false}).limit(200);
    }
    _aseAllArticles = (artsRes.data || []).map(function(a){ a.image_url = a.image_url || a.image || ''; return a; });
    // article_study_content 조회 (테이블 없어도 무시)
    try {
      var editedRes = await sb.from('article_study_content').select('article_id,admin_edited').limit(500);
      _aseEditedIds = new Set((editedRes.data||[]).filter(function(r){return r.admin_edited;}).map(function(r){return String(r.article_id);}));
    } catch(e) { _aseEditedIds = new Set(); }
    aseRenderList(_aseAllArticles);
  } catch(e) {
    el.innerHTML = '<div class="infobox" style="color:#c33">⚠️ 로드 실패: '+e.message+'</div>';
  }
}

function aseFilterList() {
  var q = (document.getElementById('ase-search').value || '').toLowerCase();
  var onlyEdited = document.getElementById('ase-filter-edited').value === 'edited';
  var filtered = _aseAllArticles.filter(function(a){
    if (onlyEdited && !_aseEditedIds.has(String(a.id))) return false;
    if (q && !(a.title||'').toLowerCase().includes(q)) return false;
    return true;
  });
  aseRenderList(filtered);
}

function aseRenderList(arts) {
  var el = document.getElementById('ase-list');
  if (!el) return;
  if (!arts.length) { el.innerHTML = '<div style="color:#94a3b8;padding:24px;text-align:center">기사가 없습니다.</div>'; return; }
  el.innerHTML = arts.map(function(a){
    var edited = _aseEditedIds.has(String(a.id));
    var badge = edited ? '<span style="background:#dcfce7;color:#15803d;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:6px">편집됨</span>' : '';
    return '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px">'
      + (a.image_url ? '<img src="'+a.image_url+'" style="width:60px;height:42px;object-fit:cover;border-radius:6px;flex-shrink:0">' : '<div style="width:60px;height:42px;background:#f1f5f9;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px">📰</div>')
      + '<div style="flex:1;min-width:0">'
      + '<div style="font-weight:700;font-size:13px;color:#0f172a;display:flex;align-items:center;gap:4px">'
      + '<span style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">' + (a.title||'제목없음') + '</span>' + badge + '</div>'
      + '<div style="font-size:11px;color:#64748b;margin-top:3px">' + (a.section||'') + (a.topik_level?' · TOPIK '+a.topik_level:'') + '</div></div>'
      + '<button onclick="aseOpenEditor('+a.id+')" style="background:#2255a4;color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0">편집</button>'
      + '</div>';
  }).join('');
}

    sb.from('articles_data').select('id,title,body,section,topik_level').eq('id', artId).maybeSingle(),
    sb.from('article_study_content').select('*').eq('article_id', String(artId)).maybeSingle()

  _aseCurrentArt     = art;

      + '<td><input id="ase-vrom-'+i+'" value="'+(v.rom||'').replace(/"/g,'&quot;')+'" style="width:100%;padding:5px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;color:#64748b"></td>'

function aseReadVocab() {
  var rows = [];
  var tbody = document.getElementById('ase-vtbody'); if (!tbody) return rows;
  var i = 0;
  while (document.getElementById('ase-vko-'+i) !== null) {
    var ko  = (document.getElementById('ase-vko-'+i).value || '').trim();
    var en  = (document.getElementById('ase-ven-'+i).value || '').trim();
    var rom = (document.getElementById('ase-vrom-'+i).value || '').trim();
    if (ko || en) rows.push({ko:ko, en:en, rom:rom});
    i++;
  }
  return rows;
}
function aseReadPhrases() {
  var rows = [];
  var i = 0;
  while (document.getElementById('ase-pko-'+i) !== null) {
    var ko = (document.getElementById('ase-pko-'+i).value || '').trim();
    var en = (document.getElementById('ase-pen-'+i).value || '').trim();
    if (ko || en) rows.push({ko:ko, en:en});
    i++;
  }
  return rows;
}
