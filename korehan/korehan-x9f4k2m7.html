async function aseGenFromAI() {
  var msgEl = document.getElementById('ase-msg');
  var art = _aseCurrentArt; if (!art) return;
  msgEl.textContent = '🤖 AI 초안 생성 중… (약 10초)';
  var prompt = 'Korean news article study content for language learners.\nTitle: ' + art.title + '\nBody:\n' + (art.body||'').slice(0,1600)
    + '\n\nReturn ONLY valid JSON:\n{"vocab":[{"ko":"word","en":"meaning","rom":"rom"}],"phrases":[{"ko":"sentence from article","en":"translation"}],"word_order":[{"chunks":["chunk1","chunk2","chunk3"]}],"questions":[{"q":"question in Korean","options":["A","B","C","D"],"correct":0}]}\nvocab:6 key words. phrases:5 key sentences. word_order:3 sentences. questions:3 comprehension questions.';
  try {
    var sb = getSb();
    var data = await sb.functions.invoke('claude-proxy', { body: { feature:'article-study-admin', model:'claude-haiku-4-5-20251001', max_tokens:1500, messages:[{role:'user',content:prompt}] } });
    var raw = ((data.data&&data.data.content)||[]).map(function(c){return c.text||'';}).join('');
    var cl = raw.replace(/```json|```/g,'').trim();
    var s=cl.indexOf('{'),e=cl.lastIndexOf('}'); if(s>=0&&e>s) cl=cl.slice(s,e+1);
    var parsed = JSON.parse(cl);
    // Re-render editor with parsed data
    var artId = art.id;
    _aseCurrentContent = parsed;
    await aseOpenEditor(artId);
    document.getElementById('ase-msg').textContent = '✅ AI draft generated. 수정 후 저장하세요.';
  } catch(e) {
    msgEl.textContent = '❌ AI generation failed: ' + e.message;
  }
}

async function aseSaveContent() {
  var sb  = getSb();
  var art = _aseCurrentArt; if (!art) return;
  var msgEl = document.getElementById('ase-msg');
  var vocab   = aseReadVocab();
  var phrases = aseReadPhrases();
  var hlVocabRaw   = (document.getElementById('ase-hl-vocab').value   || '').trim();
  var hlPhrasesRaw = (document.getElementById('ase-hl-phrases').value || '').trim();
  var custom_highlights = {
    vocab:   hlVocabRaw   ? hlVocabRaw.split('\n').map(function(s){return s.trim();}).filter(Boolean) : null,
    phrases: hlPhrasesRaw ? hlPhrasesRaw.split('\n').map(function(s){return s.trim();}).filter(Boolean) : null
  };
  if (!custom_highlights.vocab && !custom_highlights.phrases) custom_highlights = null;
  var row = {
    article_id:        String(art.id),
    article_title:     art.title || '',
    vocab:             vocab,
    phrases:           phrases,
    word_order:        (_aseCurrentContent && _aseCurrentContent.word_order)  || [],
    questions:         (_aseCurrentContent && _aseCurrentContent.questions)   || [],
    custom_highlights: custom_highlights,
    admin_edited:      true,
    updated_at:        new Date().toISOString()
  };
  msgEl.textContent = '저장 중…';
  var r = await sb.from('article_study_content').upsert(row, {onConflict:'article_id'});
  if (r.error) { msgEl.textContent = '❌ Error: ' + r.error.message; return; }
  _aseEditedIds.add(String(art.id));
  msgEl.textContent = '✅ 저장됐습니다! (사용자에게 즉시 반영됩니다)';
}

async function aseDeleteContent() {
  if (!confirm('이 기사의 편집 콘텐츠를 삭제하고 AI 자동 생성으로 되돌릴까요?')) return;
  var sb  = getSb();
  var art = _aseCurrentArt; if (!art) return;
  var r = await sb.from('article_study_content').delete().eq('article_id', String(art.id));
  if (r.error) { alert(r.error.message); return; }
  _aseEditedIds.delete(String(art.id));
  await aseOpenEditor(art.id);
  document.getElementById('ase-msg').textContent = '✅ 삭제됨. AI 자동 생성으로 복귀.';
}

var _srpdfAllPages = 0;

async function srHandlePdfUpload(input) {
  var file = input.files[0];
  if (!file) return;
  var statusEl = document.getElementById('srpdf-status');
  statusEl.textContent = 'PDF.js 로딩 중…';

  // Load PDF.js from CDN if not already loaded
  if (!window.pdfjsLib) {
    await new Promise(function(resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }

  statusEl.textContent = 'PDF 읽는 중…';
  try {
    var arrayBuffer = await file.arrayBuffer();
    var pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    _srpdfAllPages = pdf.numPages;
    document.getElementById('srpdf-page-info').textContent =
      '총 ' + _srpdfAllPages + ' 페이지. 전체 추출 또는 페이지 범위를 지정하세요.';
    await srExtractPdfText(pdf, 1, _srpdfAllPages);
    document.getElementById('srpdf-extract-area').style.display = '';
    document.getElementById('srpdf-parse-area').style.display = '';
    statusEl.textContent = '텍스트 추출 완료. AI 파싱 버튼을 누르세요.';
  } catch(e) {
    statusEl.textContent = 'Error: ' + e.message;
  }
}

async function srExtractPdfText(pdf, from, to) {
  var pages = [];
  from = Math.max(1, from);
  to   = Math.min(to, pdf.numPages);
  for (var i = from; i <= to; i++) {
    var page = await pdf.getPage(i);
    var tc   = await page.getTextContent();
    var txt  = tc.items.map(function(item){ return item.str; }).join(' ');
    pages.push('=== Page ' + i + ' ===\n' + txt);
  }
  document.getElementById('srpdf-text').value = pages.join('\n\n');
}

async function srRerextractPages() {
  var file = document.getElementById('srpdf-file').files[0];
  if (!file || !window.pdfjsLib) return;
  var rangeStr = (document.getElementById('srpdf-pages').value || '').trim();
  var from = 1, to = _srpdfAllPages;
  if (rangeStr) {
    var parts = rangeStr.split('-');
    from = parseInt(parts[0]) || 1;
    to   = parseInt(parts[1]) || from;
  }
  document.getElementById('srpdf-status').textContent = '다시 추출 중…';
  var arrayBuffer = await file.arrayBuffer();
  var pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  await srExtractPdfText(pdf, from, to);
  document.getElementById('srpdf-status').textContent = '추출 완료 (' + from + '~' + to + ' 페이지).';
}

async function srParseGrammarWithClaude() {
  var text   = (document.getElementById('srpdf-text').value || '').trim();
  var level  = document.getElementById('srpdf-level').value;
  var status = document.getElementById('srpdf-status');
  if (!text) { status.textContent = '먼저 PDF를 업로드하세요.'; return; }

  // Truncate to ~12000 chars if very long (Claude has limits)
  var chunk = text.length > 12000 ? text.slice(0, 12000) + '\n\n[텍스트가 너무 길어 앞 부분만 파싱됩니다]' : text;

  status.textContent = 'Claude AI 파싱 중… (30~60초 소요)';
  document.getElementById('srpdf-parse-btn').disabled = true;

  var prompt = '당신은 한국어 문법 교재에서 문법 패턴을 추출하는 전문가입니다.\n'
    + '아래 PDF 텍스트에서 문법 패턴을 모두 추출하여 JSON 배열로 반환하세요.\n'
    + '레벨: ' + level + '\n\n'
    + '각 항목은 아래 형식의 JSON 객체여야 합니다:\n'
    + '{\n'
    + '  "pattern": "~아요/어요",\n'
    + '  "explanation": "Present tense polite ending (영어 설명)",\n'
    + '  "example_ko": "저는 밥을 먹어요.",\n'
    + '  "example_en": "I eat rice.",\n'
    + '  "structure": "동사 어간 + 아요/어요 (받침 없으면 아요, 있으면 어요)",\n'
    + '  "when_to_use": "일상적인 대화, 예의바른 상황에서 사용",\n'
    + '  "watch_out": "이다 뒤에는 이에요/예요를 사용"\n'
    + '}\n\n'
    + '규칙:\n'
    + '- pattern은 반드시 ~로 시작하는 한국어 문법 형태\n'
    + '- explanation은 영어로\n'
    + '- example_ko, example_en은 짧고 명확한 예문\n'
    + '- structure, when_to_use, watch_out 은 없으면 null\n'
    + '- 중복 패턴 제외\n'
    + '- JSON 배열만 반환, 다른 텍스트 없이\n\n'
    + 'PDF 텍스트:\n' + chunk;

  try {
    var res = await callClaude({
      feature: 'grammar-pdf-parse',
      model: 'claude-opus-4-6',
      max_tokens: 4000,
      messages: [{ role: 'user', content: prompt }]
    });
    var raw = (res && res.content && res.content[0] && res.content[0].text) || '';
    // Extract JSON array from response
    var match = raw.match(/\[[\s\S]*\]/);
    if (!match) throw new Error('JSON 배열을 찾을 수 없습니다. Claude 응답: ' + raw.slice(0, 200));
    var patterns = JSON.parse(match[0]);
    status.textContent = patterns.length + '개 패턴 파싱 완료. 아래에서 검토 후 저장하세요.';
    srShowParsedGrammar(patterns, level);
  } catch(e) {
    status.textContent = '파싱 Error: ' + e.message;
  }
  document.getElementById('srpdf-parse-btn').disabled = false;
}

      + '</div>'
      + '<div style="margin-top:8px;display:grid;grid-template-columns:1fr;gap:6px">'
      + '<div><label style="font-size:11px;font-weight:700;color:#475569;display:block;margin-bottom:2px">Structure</label>'
      + '<input id="srpdf-st-' + i + '" value="' + safeVal(p.structure) + '" style="width:100%;padding:6px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px"></div>'
      + '<div><label style="font-size:11px;font-weight:700;color:#475569;display:block;margin-bottom:2px">When to Use</label>'
      + '<textarea id="srpdf-wt-' + i + '" style="width:100%;padding:6px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;min-height:50px">' + safeVal(p.when_to_use) + '</textarea></div>'
      + '<div><label style="font-size:11px;font-weight:700;color:#475569;display:block;margin-bottom:2px">Watch Out</label>'
      + '<textarea id="srpdf-wo-' + i + '" style="width:100%;padding:6px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;min-height:50px">' + safeVal(p.watch_out) + '</textarea></div>'
      + '</div>'
      + '</div>';
  }).join('');
}

function srSelectAllParsed(checked) {
  var patterns = window._srpdfPatterns || [];
  patterns.forEach(function(_, i) {
    var chk = document.getElementById('srpdf-chk-' + i);
    if (chk) chk.checked = checked;
  });
}

async function srSaveParsedGrammar() {
  var sb = getSb();
  var patterns = window._srpdfPatterns || [];
  var level = window._srpdfLevel || document.getElementById('srpdf-level').value;
  var msgEl = document.getElementById('srpdf-save-msg');
  var rows = [];
  patterns.forEach(function(_, i) {
    var chk = document.getElementById('srpdf-chk-' + i);
    if (!chk || !chk.checked) return;
    var val = function(id){ return (document.getElementById(id) && document.getElementById(id).value || '').trim() || null; };
    var pattern = val('srpdf-p-' + i);
    if (!pattern) return;
    rows.push({
      level:         level,
      pattern:       pattern,
      explanation:   val('srpdf-e-'   + i),
      example_ko:    val('srpdf-eko-' + i),
      example_en:    val('srpdf-een-' + i),
      structure:     val('srpdf-st-'  + i),
      when_to_use:   val('srpdf-wt-'  + i),
      watch_out:     val('srpdf-wo-'  + i),
      display_order: i,
      active: true
    });
  });

  if (!rows.length) { msgEl.textContent = '선택된 항목이 없습니다.'; return; }
  msgEl.textContent = rows.length + '개 저장 중…';

  // Insert in batches of 20 to avoid request size limits
  var errors = [];
  for (var s = 0; s < rows.length; s += 20) {
    var batch = rows.slice(s, s + 20);
    var r = await sb.from('study_room_grammar').insert(batch);
    if (r.error) errors.push(r.error.message);
  }
  if (errors.length) {
    msgEl.textContent = '일부 Error: ' + errors.join(', ');
  } else {
    msgEl.textContent = '✅ ' + rows.length + '개 패턴이 study_room_grammar에 저장됐습니다!';
  }
}

// ══ MERGED SECTION WRAPPERS ════════════════════════════════════
// Each wrapper: renders inner function → prepends a tab bar on top

function _prependItabs(defs, activeKey) {
  var main = document.getElementById('main');
  if (!main) return;
  var bar = document.createElement('div');
  bar.className = 'itabs';
  bar.innerHTML = defs.map(function(d){
    return '<button class="itab' + (d.key===activeKey?' on':'') + '" onclick="' + d.fn + '">' + d.label + '</button>';
  }).join('');
  main.insertBefore(bar, main.firstChild);
}

// ── Room Item Manager (DB-backed CRUD) ─────────────────────────
async function goRoomItemManager() {
  var sb = getSb(); if (!sb) return;
  document.getElementById('main').innerHTML = '<div class="pg-hd"><h1>🏠 방꾸미기 아이템 관리</h1><p>room_items 테이블에서 아이템을 추가·수정·삭제합니다. 변경 즉시 모든 유저에게 반영됩니다.</p></div>'
    + '<div style="margin-bottom:12px"><button class="btn btn-g" onclick="openRoomItemEditor()">+ 새 아이템 추가</button></div>'
    + '<div id="room-item-list">로딩 중…</div>';
  var res = await sb.from('room_items').select('*').order('sort_order');
  var el = document.getElementById('room-item-list');
  if (res.error) { el.innerHTML = '<div style="color:#ef4444">Error: ' + res.error.message + '</div>'; return; }
  var items = res.data || [];
  if (!items.length) { el.innerHTML = '<div style="color:#94a3b8">아이템이 없습니다. 위 버튼으로 추가하세요.</div>'; return; }
  el.innerHTML = '<table class="tbl" style="width:100%;font-size:13px"><thead><tr><th>순서</th><th>이미지</th><th>ID</th><th>이름</th><th>가격</th><th>크기</th><th>활성</th><th></th></tr></thead><tbody>'
    + items.map(function(it) {
      return '<tr>'
        + '<td>' + it.sort_order + '</td>'
        + '<td><div style="width:48px;height:48px;background:url(' + it.image_url + ') center/contain no-repeat;border-radius:8px;background-color:#f8fafc"></div></td>'
        + '<td><code>' + it.id + '</code></td>'
        + '<td>' + it.name + '</td>'
        + '<td>🐾 ' + it.price_nyang + '</td>'
        + '<td>' + it.base_size + 'px</td>'
        + '<td>' + (it.effect && it.effect !== 'none' ? it.effect : '-') + '</td>'
        + '<td>' + (it.active ? '✅' : '❌') + '</td>'
        + '<td><button class="btn" onclick="openRoomItemEditor(\'' + it.id + '\')">Edit</button></td>'
        + '</tr>';
    }).join('') + '</tbody></table>';
}

async function openRoomItemEditor(editId) {
  var sb = getSb(); if (!sb) return;
  var existing = null;
  if (editId) {
    var res = await sb.from('room_items').select('*').eq('id', editId).maybeSingle();
    existing = res.data;
  }
  var isNew = !existing;
  var html = '<div class="sf-card" style="max-width:500px;margin:0 auto">'
    + '<h3>' + (isNew ? '새 아이템 추가' : '아이템 수정: ' + editId) + '</h3>'
    + '<div class="fg"><label>ID (영문, 변경불가)</label><input id="ri-id" value="' + (existing ? existing.id : '') + '" ' + (isNew ? '' : 'readonly style="background:#f1f5f9"') + '></div>'
    + '<div class="fg"><label>이름</label><input id="ri-name" value="' + (existing ? existing.name : '') + '"></div>'
    + '<div class="fg"><label>가격 (냥)</label><input id="ri-price" type="number" value="' + (existing ? existing.price_nyang : 0) + '"></div>'
    + '<div class="fg"><label>이미지 경로 (assets/파일명.png)</label><input id="ri-img" value="' + (existing ? existing.image_url : 'assets/') + '"></div>'
    + '<div class="fg"><label>썸네일 경로 (상점 표시용, 비우면 이미지와 동일)</label><input id="ri-thumb" value="' + (existing && existing.thumbnail_url ? existing.thumbnail_url : '') + '"></div>'
    + '<div class="fg"><label>기본 크기 (px)</label><input id="ri-size" type="number" value="' + (existing ? existing.base_size : 60) + '"></div>'
    + '<div class="fg"><label>효과</label><select id="ri-effect"><option value="none"' + (existing && existing.effect === 'none' ? ' selected' : '') + '>없음</option><option value="glow_neon"' + (existing && existing.effect === 'glow_neon' ? ' selected' : '') + '>네온 발광</option><option value="glow_warm"' + (existing && existing.effect === 'glow_warm' ? ' selected' : '') + '>따뜻한 빛</option><option value="sparkle"' + (existing && existing.effect === 'sparkle' ? ' selected' : '') + '>반짝임</option><option value="float"' + (existing && existing.effect === 'float' ? ' selected' : '') + '>둥실둥실</option></select></div>'
    + '<div class="fg"><label>카테고리</label><select id="ri-cat"><option value="character"' + (existing && existing.category === 'character' ? ' selected' : '') + '>캐릭터</option><option value="pet"' + (existing && existing.category === 'pet' ? ' selected' : '') + '>펫</option><option value="furniture"' + (existing && existing.category === 'furniture' ? ' selected' : '') + '>가구</option><option value="deco"' + ((!existing || existing.category === 'deco') ? ' selected' : '') + '>데코</option></select></div>'
    + '<div class="fg"><label>정렬 순서</label><input id="ri-order" type="number" value="' + (existing ? existing.sort_order : 99) + '"></div>'
    + '<div class="fg"><label><input type="checkbox" id="ri-active" ' + (existing ? (existing.active ? 'checked' : '') : 'checked') + '> 활성화</label></div>'
    + '<div style="display:flex;gap:8px;margin-top:12px">'
    + '<button class="btn btn-g" onclick="saveRoomItem(\'' + (editId||'') + '\')">' + (isNew ? '추가' : '저장') + '</button>'
    + '<button class="btn" onclick="goShopContent(\'room\')">취소</button>'
    + (isNew ? '' : '<button class="btn btn-r" onclick="deleteRoomItem(\'' + editId + '\')">삭제</button>')
    + '</div><div id="ri-msg" style="margin-top:8px;font-size:12px"></div></div>';
  document.getElementById('main').innerHTML = html;
}

async function saveRoomItem(editId) {
  var sb = getSb(); var msg = document.getElementById('ri-msg');
  var id = (document.getElementById('ri-id').value||'').trim();
  if (!id) { if (msg) msg.textContent = 'ID를 입력하세요.'; return; }
  var rec = {
    id: id,
    name: (document.getElementById('ri-name').value||'').trim(),
    price_nyang: parseInt(document.getElementById('ri-price').value) || 0,
    image_url: (document.getElementById('ri-img').value||'').trim(),
    thumbnail_url: (document.getElementById('ri-thumb').value||'').trim() || null,
    base_size: parseInt(document.getElementById('ri-size').value) || 60,
    effect: (document.getElementById('ri-effect').value||'none'),
    category: (document.getElementById('ri-cat').value||'deco'),
    sort_order: parseInt(document.getElementById('ri-order').value) || 0,
    active: document.getElementById('ri-active').checked
  };
  var res = await sb.from('room_items').upsert(rec, { onConflict: 'id' });
  if (res.error) { if (msg) msg.textContent = 'Error: ' + res.error.message; return; }
  toast(editId ? '수정됨!' : '추가됨!');
  goShopContent('room');
}

async function deleteRoomItem(id) {
  if (!confirm(id + ' 아이템을 삭제하시겠어요?')) return;
  var sb = getSb();
  await sb.from('room_items').delete().eq('id', id);
  toast('삭제됨!');
  goShopContent('room');
}
