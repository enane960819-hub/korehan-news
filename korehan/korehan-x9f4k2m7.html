<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KoreHan Admin CMS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@400;600;700;900&family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--a:#1a3a6b;--b:#2255a4;--li:#e8eef7;--r:#cc2200;--g:#1a7a3a;--dk:#0d1b2e;--gr:#445566;--br:#d4dce8;--w:#fff;--bg:#f4f6fa}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--dk);font-size:14px}
a{color:inherit;text-decoration:none}

/* TOP BAR */
.topbar{background:var(--dk);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px;position:sticky;top:0;z-index:100}
.tb-logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:#5a8fd0}
.tb-logo b{color:#fff}
.badge{background:var(--r);color:#fff;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:2px;margin-left:8px}
.tb-right{display:flex;gap:12px;align-items:center;font-size:13px}
.tb-right a{color:#7a9ac0;text-decoration:none}
.tb-right a:hover{color:#fff}
.vsb{background:var(--b);color:#fff!important;padding:6px 14px;font-size:12px;font-weight:700;border-radius:3px}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - 52px)}

/* SIDEBAR */
.sb{width:230px;flex-shrink:0;background:var(--w);border-right:1px solid var(--br);overflow-y:auto}
.sb-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#99aabb;padding:16px 20px 4px}
.sb-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 20px;font-size:13px;font-weight:600;color:var(--gr);cursor:pointer;border:none;background:none;text-align:left;border-left:3px solid transparent;font-family:inherit;transition:all .15s}
.sb-btn:hover{background:var(--li);color:var(--a)}
.sb-btn.on{background:var(--li);color:var(--a);border-left-color:var(--a)}
.sb-btn .ico{width:20px;text-align:center;font-size:15px}
.pill{margin-left:auto;background:#e4e8f0;color:var(--gr);font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;min-width:20px;text-align:center}

/* MAIN */
.main{flex:1;padding:28px 32px;overflow:auto;max-width:100%}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;font-size:13px;font-weight:700;border:none;cursor:pointer;border-radius:3px;font-family:inherit;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-b{background:var(--a);color:#fff}
.btn-g{background:var(--g);color:#fff}
.btn-r{background:var(--r);color:#fff}
.btn-gh{background:transparent;color:var(--a);border:1.5px solid var(--a)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:2px}

/* PAGE HEADER */
.pg-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
.pg-hd h1{font-family:'Playfair Display',serif;font-size:26px}
.pg-hd p{font-size:13px;color:var(--gr);margin-top:3px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--w);border:1px solid var(--br);padding:16px 18px}
.stat-n{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--a);line-height:1;margin-bottom:4px}
.stat-l{font-size:11px;color:var(--gr);text-transform:uppercase;letter-spacing:.8px}

/* INFO BOX */
.infobox{background:var(--w);border:1px solid var(--br);border-left:4px solid var(--b);padding:14px 18px;margin-bottom:16px;font-size:13px;color:var(--gr);line-height:1.7}
.infobox h3{font-size:14px;font-weight:700;color:var(--a);margin-bottom:5px}

/* TOOLBAR */
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.srch{flex:1;min-width:180px;display:flex;align-items:center;background:var(--w);border:1.5px solid var(--br);border-radius:3px;padding:0 12px;gap:8px}
.srch input{flex:1;border:none;outline:none;font-size:13px;padding:8px 0;font-family:inherit;background:transparent}
.flt{padding:8px 12px;font-size:13px;border:1.5px solid var(--br);border-radius:3px;background:var(--w);font-family:inherit;color:var(--dk);outline:none;cursor:pointer}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;background:var(--w)}
.tbl th{text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--gr);border-bottom:2px solid var(--br);background:var(--li)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--br);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#f8fafd}
.thumb{width:70px;height:48px;object-fit:cover;border-radius:2px;display:block}
.art-t{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;line-height:1.3}
.art-b{font-size:12px;color:var(--gr);margin-top:3px;max-width:340px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cpill{display:inline-block;padding:2px 8px;font-size:11px;font-weight:700;border-radius:2px}
.c사회{background:#e8eef7;color:#1a3a6b}
.c국제{background:#f0e8f7;color:#5a1a7a}
.c문화{background:#f7e8ee;color:#7a1a3a}
.c스포츠{background:#e8f4f7;color:#1a5a7a}
.cKorea{background:#fff0ec;color:#cc2200}
.cK-pop{background:#f3e8ff;color:#6b21a8}
.cbeauty{background:#fce7f3;color:#9d174d}
.ctravel{background:#e0f2fe;color:#075985}
.c오피니언{background:#fffbe8;color:#7a6400}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.dpub{background:var(--g)}
.ddr{background:#aab}
.row-act{display:flex;gap:6px}

/* EMPTY */
.empty{text-align:center;padding:56px;color:var(--gr)}
.empty .big{font-size:48px;margin-bottom:14px}

/* MODAL OVERLAY */
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:200}
.mbox{background:var(--w);border-radius:6px;width:640px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,0.3)}
.m-hd{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--br)}
.m-hd h2{font-family:'Playfair Display',serif;font-size:20px}
.m-x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gr);line-height:1}
.m-bd{padding:22px}
.m-ft{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--br)}

/* FORM */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--gr)}
.fg input,.fg select,.fg textarea{border:1.5px solid var(--br);border-radius:3px;padding:9px 12px;font-size:14px;font-family:inherit;color:var(--dk);background:var(--w);outline:none;transition:border-color .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--b)}
.fg textarea{resize:vertical;min-height:120px;line-height:1.6}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cntlabel{font-size:11px;color:#99aabb;text-align:right;margin-top:3px}
.imgprev{max-width:100%;border-radius:4px;margin-top:8px;max-height:180px;object-fit:cover}

/* DELETE CONFIRM */
.del-ov{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:300}
.del-box{background:var(--w);border-radius:8px;padding:32px 28px;text-align:center;width:360px;box-shadow:0 24px 64px rgba(0,0,0,0.3)}
.del-box .dico{font-size:44px;margin-bottom:12px}
.del-box h3{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:8px}
.del-box p{font-size:13px;color:var(--gr);margin-bottom:20px;max-width:280px;margin-left:auto;margin-right:auto}
.del-btns{display:flex;gap:10px;justify-content:center}

/* SETTINGS FORM */
.sf-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.sf-row.full{grid-template-columns:1fr}
.sf-card{background:var(--w);border:1px solid var(--br);border-radius:8px;padding:20px;margin-bottom:16px}
.sf-card h3{font-size:14px;font-weight:700;color:var(--a);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--br)}
.inp{width:100%;border:1.5px solid var(--br);border-radius:3px;padding:8px 12px;font-size:14px;font-family:inherit;color:var(--dk);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--b)}
.inp-ta{resize:vertical;min-height:80px;line-height:1.6}
.inp-sm{font-size:13px;padding:6px 10px}
.inp-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--gr);display:block;margin-bottom:5px}

/* ROW EDITOR (for ticker / opinions / etc.) */
.row-editor{background:var(--bg);border:1px solid var(--br);border-radius:6px;padding:12px;margin-bottom:8px;display:grid;gap:8px}
.row-del{background:var(--r);color:#fff;border:none;border-radius:3px;padding:4px 10px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:700;float:right}

/* TOASTS */
#toasts{position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.t{background:var(--dk);color:#fff;padding:11px 18px;border-radius:4px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,0.25);border-left:4px solid var(--g);min-width:240px;animation:tsin .2s ease}
.t.err{border-left-color:var(--r)}
@keyframes tsin{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}

.section-sep{height:1px;background:var(--br);margin:6px 0}

/* INNER PANEL TABS (used by merged sections) */
.itabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--br)}
.itab{padding:6px 16px;border-radius:20px;border:1.5px solid var(--br);background:var(--w);
  font-size:12px;font-weight:700;color:var(--gr);cursor:pointer;font-family:inherit;transition:all .15s}
.itab:hover{background:var(--li);color:var(--a);border-color:var(--a)}
.itab.on{background:var(--a);color:#fff;border-color:var(--a)}

/* SIDEBAR improvements */
.sb-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.8px;color:#b0bec8;
  padding:14px 18px 5px;display:flex;align-items:center;gap:6px}
.sb-lbl:first-child{padding-top:18px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

function ls(k,d){ try{const r=localStorage.getItem(k);if(r!=null)return JSON.parse(r);}catch(e){}return d; }

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function today(){ return new Date().toISOString().slice(0,10); }
function fdate(d){ try{return new Date(d+'T00:00:00').toLocaleDateString('ko-KR',{year:'numeric',month:'short',day:'numeric'});}catch(e){return d||'';} }
function toast(msg,isErr){
  const el=document.createElement('div');
  el.className='t'+(isErr?' err':'');
  el.textContent=msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(),3200);
}
function setSbOn(id){
  document.querySelectorAll('.sb-btn').forEach(b=>b.classList.remove('on'));
  if(id){ const el=document.getElementById(id); if(el) el.classList.add('on'); }
}

const ADMIN_CLAUDE_PROXY = SUPA_URL_ADMIN + '/functions/v1/claude-proxy';

async function callClaude({ feature, model, max_tokens, messages }) {
  var sb = getSb();
  if (!sb) throw new Error('Supabase not initialized');

  var sessionRes = await sb.auth.getSession();
  var session = sessionRes && sessionRes.data && sessionRes.data.session;
  var now = Math.floor(Date.now() / 1000);
  var expiresSoon = session && session.expires_at && session.expires_at <= now + 90;
  if (!session || expiresSoon) {
    var refreshed = await sb.auth.refreshSession();
    session = refreshed && refreshed.data && refreshed.data.session;
  }
  if (!session) throw new Error('Not signed in');

  var payload = { feature, model, max_tokens, messages };
  var resp = await fetch(ADMIN_CLAUDE_PROXY, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + session.access_token,
      'apikey': SUPA_KEY_ADMIN,
    },
    body: JSON.stringify(payload),
  });

  if (resp.status === 401) {
    var forcedRefresh = await sb.auth.refreshSession();
    var freshSession = forcedRefresh && forcedRefresh.data && forcedRefresh.data.session;
    if (freshSession && freshSession.access_token) {
      resp = await fetch(ADMIN_CLAUDE_PROXY, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + freshSession.access_token,
          'apikey': SUPA_KEY_ADMIN,
        },
        body: JSON.stringify(payload),
      });
    }
  }

  // Retry on rate limit with exponential backoff (up to 3 retries)
  var rateLimitRetries = 0;
  while (resp.status === 429 && rateLimitRetries < 3) {
    rateLimitRetries++;
    var backoff = Math.pow(2, rateLimitRetries) * 1000; // 2s, 4s, 8s
    console.warn('Rate limited (429), retry ' + rateLimitRetries + '/3 after ' + backoff + 'ms');
    await new Promise(function(r){ setTimeout(r, backoff); });
    var retrySession = (await sb.auth.getSession()).data.session;
    if (!retrySession) throw new Error('Not signed in');
    resp = await fetch(ADMIN_CLAUDE_PROXY, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + retrySession.access_token,
        'apikey': SUPA_KEY_ADMIN,
      },
      body: JSON.stringify(payload),
    });
  }
  if (resp.status === 429) throw new Error('rate_limit');
  if (resp.status === 401) throw new Error('unauthorized - please sign in');
  if (!resp.ok) {
    var err = await resp.json().catch(function(){ return {}; });
    throw new Error(err.error || 'API error ' + resp.status);
  }
  return resp.json();
}


function getSb() {
  if (_sbAdmin) return _sbAdmin;
  if (typeof supabase !== 'undefined' && SUPA_URL_ADMIN && SUPA_KEY_ADMIN) {
    _sbAdmin = supabase.createClient(SUPA_URL_ADMIN, SUPA_KEY_ADMIN, {
      auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
    });
    return _sbAdmin;
  }
  return null;
}

function normalizeNewsSection(section) {
  var key = String(section || '').trim();
  var low = key.toLowerCase();
  if (low === 'tech' || low === 'it과학' || low === 'technology' || low === 'tech/science') return 'beauty';
  return key;
}

async function dbLoadFromSupabase() {
  const sb = getSb();
  if (!sb) { console.warn('Supabase not available'); goList(); return; }
  try {
    const res = await sb.from('articles').select('*').order('date', { ascending: false });
    if (res.error) throw res.error;
    DB = (res.data || []).map(function(row){
      var clone = Object.assign({}, row);
      clone.section = normalizeNewsSection(row.section);
      return clone;
    });
    goList();
  } catch(e) {
    toast('DB load error: ' + e.message, true);
    goList();
  }
}

async function dbSaveArticle(article) {
  const sb = getSb();
  if (!sb) return false;
  var payload = Object.assign({}, article);
  Object.keys(payload).forEach(function(k){
    if (payload[k] === undefined) delete payload[k];
  });
  try {
    const res = await sb.from('articles').upsert(payload, { onConflict: 'id' });
    if (res.error) throw res.error;
    return true;
  } catch(e) {
    // Retry by removing unknown columns when schema differs
    var emsg = String(e?.message || '');
    var m = emsg.match(/column\\s+\"([^\"]+)\"/i) || emsg.match(/Could not find the '([^']+)' column/i);
    if (m && m[1] && payload[m[1]] !== undefined) {
      delete payload[m[1]];
      try {
        const res2 = await sb.from('articles').upsert(payload, { onConflict: 'id' });
        if (!res2.error) return true;
      } catch(e2) {}
    }
    toast('Save error: ' + e.message, true);
    return false;
  }
}

async function dbDeleteArticle(id) {
  const sb = getSb();
  if (!sb) return false;
  try {
    const res = await sb.from('articles').delete().eq('id', id);
    if (res.error) throw res.error;
    return true;
  } catch(e) {
    toast('Delete error: ' + e.message, true);
    return false;
  }
}

async function batchAssignReporters() {
  var sb = getSb();
  if (!sb) { toast('Supabase 연결 없음', true); return; }
  var unassigned = DB.filter(function(a){ return !a.reporter_id; });
  if (!unassigned.length) { toast('All articles already have reporters assigned ✓'); return; }
  if (!confirm(unassigned.length + ' articles — auto-assign section reporters?\n(Articles with existing reporters will not change)')) return;

  var updated = 0;
  var colMissing = false;
  for (var i = 0; i < unassigned.length; i++) {
    var a = unassigned[i];
    var rid = SECTION_REPORTER_MAP[a.section] || 'cr1';
    try {
      var res = await sb.from('articles').update({ reporter_id: rid }).eq('id', a.id);
      if (!res.error) {
        a.reporter_id = rid;
        updated++;
      } else if (/reporter_id/i.test((res.error.message||''))) {
        colMissing = true;
        break;
      }
    } catch(e) {}
  }
  if (colMissing) {
    toast('reporter_id column not found. Supabase SQL Editor에서 실행:\nALTER TABLE articles ADD COLUMN IF NOT EXISTS reporter_id TEXT;', true);
  } else {
    toast('✓ ' + updated + ' articles assigned to reporters');
  }
  renderRows();
}

async function adminUploadArticleImage(file) {
  var sb = getSb();
  if (!sb) throw new Error('Admin client not available');
  var ext  = (file.name.split('.').pop() || 'jpg').toLowerCase();
  var path = 'articles/' + Date.now() + '-' + Math.random().toString(36).slice(2) + '.' + ext;
  var up   = await sb.storage.from('article-images').upload(path, file, { upsert: true, contentType: file.type });
  if (up.error) throw up.error;
  return sb.storage.from('article-images').getPublicUrl(path).data.publicUrl;
}

async function adminHandleImgFile(input) {
  // Called from the article create/edit form file picker
  if (!input.files || !input.files[0]) return;
  var lbl      = document.getElementById('f-img-upload-lbl');
  var spinner  = document.getElementById('f-img-uploading');
  if (lbl)     lbl.textContent = '⏳';
  if (spinner) spinner.style.display = '';
  try {
    var url = await adminUploadArticleImage(input.files[0]);
    var urlInput = document.getElementById('f-image');
    if (urlInput) { urlInput.value = url; livePreview(); }
  } catch(e) {
    toast('Image upload failed: ' + e.message, true);
  } finally {
    if (lbl)     lbl.textContent = '📁 업로드';
    if (spinner) spinner.style.display = 'none';
    input.value = '';  // reset so same file can be re-picked
  }
}

async function adminHandleImgUploadForArticle(input, articleId) {
  // Called from the 기사 Image Management upload button per article
  if (!input.files || !input.files[0]) return;
  var span = document.getElementById('img-upld-lbl-' + articleId);
  if (span) span.textContent = '⏳';
  try {
    var url = await adminUploadArticleImage(input.files[0]);

    if (urlInput) urlInput.value = url;

  }
}

function adminExtractVocab(article){
  const text = (article.title||'') + ' ' + (article.body||'');
  const found = Object.keys(VOCAB_DICT).filter(function(k){ return text.indexOf(k) >= 0; });
  if(!found.length) return;
  found.sort(function(){ return Math.random()-0.5; });
  const picks = found.slice(0, 7);
  const wb = ls(K_WORDBANK, []);
  const existing = new Set(wb.map(function(w){ return w.ko; }));
  const toAdd = picks.filter(function(k){ return !existing.has(k); }).map(function(k){
    return { ko:k, rom:VOCAB_DICT[k].rom, en:VOCAB_DICT[k].en };
  });
  if(!toAdd.length) return;
  const merged = [...wb, ...toAdd].slice(-60);
  lsSet(K_WORDBANK, merged);
}

async function goUserStats() {
  setSbOn(null);
  var main = document.getElementById('main');
  main.innerHTML = '<div class="pg-hd"><div><h1>📊 User Analytics</h1><p>View learning analytics for all users.</p></div></div>'
    + '<div id="stats-content"><div style="text-align:center;padding:48px;color:#aaa">⏳ Loading data...</div></div>';

  var sb = getSb();
  if (!sb) { document.getElementById('stats-content').innerHTML = '<p style="color:red">Supabase connection failed</p>'; return; }

  try {
    // 병렬로 데이터 로드
    var today = new Date(Date.now() + 9*3600000).toISOString().slice(0,10); // KST
    var [usersRes, allDMsRes, missionsRes, viewsRes] = await Promise.all([
      sb.from('user_stats').select('*').order('xp', { ascending: false }),
      sb.from('daily_missions').select('user_id, date, articles, words, quizzes, fill').order('date', { ascending: false }),
      sb.from('daily_missions').select('user_id, completed').eq('date', today),
      sb.from('article_views').select('*').order('view_count', { ascending: false }).limit(10)
    ]);

    var users    = usersRes.data  || [];
    var allDMs   = allDMsRes.data || [];
    var missions = missionsRes.data || [];
    var views    = viewsRes.data  || [];

    // Compute streak per user from daily_missions
    var dmByUser = {};
    allDMs.forEach(function(d) {
      if (!dmByUser[d.user_id]) dmByUser[d.user_id] = [];
      dmByUser[d.user_id].push(d);
    });
    function calcStreak(rows) {
      var active = {};
      rows.forEach(function(d) {
        if ((d.articles||0)+(d.words||0)+(d.quizzes||0)+(d.fill||0) > 0) active[d.date] = true;
      });
      var streak = 0;
      var cur = new Date(Date.now() + 9*3600000);
      for (var i = 0; i < 400; i++) {
        var key = cur.toISOString().slice(0,10);
        if (active[key]) { streak++; cur.setDate(cur.getDate()-1); }
        else if (i === 0) { cur.setDate(cur.getDate()-1); }
        else break;
      }
      return streak;
    }

    // Compute XP per user from daily_missions
    var xpByUser = {};
    allDMs.forEach(function(d) {
      xpByUser[d.user_id] = (xpByUser[d.user_id]||0) + (d.articles||0)*10 + (d.words||0)*2 + (d.quizzes||0)*5 + (d.fill||0)*5;

        + '<th style="text-align:right;padding:8px">Fill</th>'

        + '<th style="text-align:right;padding:8px;color:#f59e0b">XP</th>'

async function uploadReporterBgImage(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var status = document.getElementById('sc-reporter-bg-status');
  if (status) status.textContent = 'Uploading...';
  if (file.size > 8 * 1024 * 1024) {
    if (status) status.textContent = 'Files must be under 8MB';
    input.value = '';
    return;
  }
  var ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  var path = 'reporter-bg/bg_' + Date.now() + '.' + ext;
  var bucket = 'reporter-images';
  try {
    var res = await fetch(SUPA_URL_ADMIN + '/storage/v1/object/' + bucket + '/' + path, {
      method: 'POST',
      headers: {
        'apikey': SUPA_SERVICE_KEY,
        'Authorization': 'Bearer ' + SUPA_SERVICE_KEY,
        'Content-Type': file.type,
        'x-upsert': 'true'
      },
      body: file
    });
    if (!res.ok) {
      var err = await res.json().catch(function(){ return {}; });
      throw new Error(err.message || err.error || ('HTTP ' + res.status));
    }
    var publicUrl = SUPA_URL_ADMIN + '/storage/v1/object/public/' + bucket + '/' + path;
    var inp = document.getElementById('sc-reporter-bg-url');
    var prev = document.getElementById('sc-reporter-bg-preview');
    if (inp) inp.value = publicUrl;
    if (prev) { prev.src = publicUrl; prev.style.display = 'block'; }
    if (status) status.textContent = '✓ Upload complete. Click [Save Background] to apply.';
    toast('배경 이미지 Upload complete');
  } catch(e) {
    if (status) status.textContent = '업로드 Error: ' + (e.message || e);
    toast('업로드 Error: ' + (e.message || e), true);
  }
  input.value = '';
}

async function loadApiKeyIntoSettings() {
  const statusEl = document.getElementById('sc-api-status');
  const input = document.getElementById('sc-api-key');
  if (!input) return;
  try {
    var sb = getSb();
    if (sb) {
      var res = await sb.from('app_settings').select('value,updated_at').eq('key','anthropic_key').single();
      if (res.data && res.data.value) {
        input.value = res.data.value;
        var d = new Date(res.data.updated_at).toLocaleDateString('ko-KR');
        if (statusEl) statusEl.textContent = '✅ Saved key found (last updated: ' + d + ')';
        return;
      }
    }
  } catch(e) {}
  // 로컬 캐시
  var local = localStorage.getItem('kh_anthropic_key') || '';
  if (local) { input.value = local; if (statusEl) statusEl.textContent = '⚠️ Local cache only — click Save to store in Supabase'; }
  else { if (statusEl) statusEl.textContent = '❌ No saved key'; }
}

async function saveApiKey() {
  const input = document.getElementById('sc-api-key');
  const statusEl = document.getElementById('sc-api-status');
  if (!input) return;
  const key = input.value.trim();
  if (!key || !key.startsWith('sk-ant-')) { toast('Please enter a valid API key (sk-ant-...)', true); return; }
  try {
    var sb = getSb();
    if (!sb) throw new Error('Supabase not ready');
    var res = await sb.from('app_settings').upsert({ key: 'anthropic_key', value: key, updated_at: new Date().toISOString() });
    if (res.error) throw res.error;
    localStorage.setItem('kh_anthropic_key', key);
    toast('🔑 API key saved! Applies to all users.');
    if (statusEl) statusEl.textContent = '✅ Saved (' + new Date().toLocaleDateString('ko-KR') + ')';
  } catch(e) {
    toast('Save failed: ' + (e.message || e), true);
  }
}

var _adminReporters = null; // populated by _ensureAdminReporters()

async function _ensureAdminReporters(force) {
  if (_adminReporters && !force) return _adminReporters;
  var sb = getSb();
  if (sb) {
    try {
      var res = await sb.from('character_reporters').select('id, data').order('updated_at', { ascending: true });
      if (!res.error && res.data && res.data.length > 0) {
        var loaded = res.data.map(function(row){ return row.data || row; }).filter(Boolean);
        if (loaded.length > 0) {
          _adminReporters = loaded;
          localStorage.setItem(K_CHAR_REPORTERS, JSON.stringify(loaded));
          return _adminReporters;
        }
      }
    } catch(e) {}
  }
  // Fall back to localStorage or defaults
  try { _adminReporters = JSON.parse(localStorage.getItem(K_CHAR_REPORTERS) || 'null') || DEF_CHAR_REPORTERS; }
  catch(e) { _adminReporters = DEF_CHAR_REPORTERS.slice(); }
  // If still defaults, sync them to Supabase silently
  _syncDefaultReportersToSupa();
  return _adminReporters;
}

async function _syncDefaultReportersToSupa() {
  var rows = DEF_CHAR_REPORTERS.map(function(r){ return { id: r.id, data: r, updated_at: new Date().toISOString() }; });
  try {
    await fetch(SUPA_URL_ADMIN + '/rest/v1/character_reporters', {
      method: 'POST',
      headers: {
        'apikey': SUPA_SERVICE_KEY,
        'Authorization': 'Bearer ' + SUPA_SERVICE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify(rows)
    });
  } catch(e) {}
}

async function crHandleImageUpload(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var status = document.getElementById('cr-upload-status');
  if (status) status.textContent = 'Uploading...';

  if (file.size > 5 * 1024 * 1024) {
    toast('이미지 크기는 5MB 이하여야 합니다', true);
    if (status) status.textContent = '';
    return;
  }

  var ext    = (file.name.split('.').pop() || 'jpg').toLowerCase();
  var rid    = document.getElementById('cr-id')?.value || ('cr_' + Date.now());
  var path   = 'reporters/' + rid + '_' + Date.now() + '.' + ext;
  var bucket = 'reporter-images';

  try {
    // Use service role key directly — bypasses all RLS / policy issues
    var res = await fetch(SUPA_URL_ADMIN + '/storage/v1/object/' + bucket + '/' + path, {
      method: 'POST',
      headers: {
        'apikey': SUPA_SERVICE_KEY,
        'Authorization': 'Bearer ' + SUPA_SERVICE_KEY,
        'Content-Type': file.type,
        'x-upsert': 'true'
      },
      body: file
    });

    if (!res.ok) {
      var err = await res.json().catch(function(){ return {}; });
      throw new Error(err.message || err.error || 'HTTP ' + res.status);
    }

    var publicUrl = SUPA_URL_ADMIN + '/storage/v1/object/public/' + bucket + '/' + path;
    var imgInput = document.getElementById('cr-img');
    var imgPrev  = document.getElementById('cr-imgprev');
    if (imgInput) imgInput.value = publicUrl;
    if (imgPrev)  imgPrev.src    = publicUrl;
    if (status) status.textContent = '✓ Upload complete';
    toast('✓ 이미지 Upload complete');
  } catch(e) {
    toast('업로드 Error: ' + (e.message || e), true);
    if (status) status.textContent = '';
  }
  input.value = '';
}

async function crSaveFromModal() {
  var name = (document.getElementById('cr-name')?.value||'').trim();

  if (!name || !role) { toast('Name and Role are required', true); return; }

  var reporters = _adminReporters ? _adminReporters.slice() : [];
  try { if (!reporters.length) reporters = JSON.parse(localStorage.getItem(K_CHAR_REPORTERS) || 'null') || DEF_CHAR_REPORTERS.slice(); } catch(e) { reporters = DEF_CHAR_REPORTERS.slice(); }

  var idxVal = parseInt(document.getElementById('cr-idx')?.value??'-1', 10);
  var tags = [...document.querySelectorAll('#m-bd input[type=checkbox]:checked')].map(function(c){ return c.value; });
  var reporter = {
    id: document.getElementById('cr-id')?.value || uid(),
    name: name,
    role: role,

  if (idxVal === -1) {

  (function() {

      });

  })();

  closeModal();
  document.getElementById('m-draft').style.display = '';

  document.getElementById('m-pub').onclick = function(){ submitForm('published'); };
  goCharReporters();

    var res = await fetch(SUPA_URL_ADMIN + '/rest/v1/character_reporters', {
      method: 'POST',
      headers: {
        'apikey': SUPA_SERVICE_KEY,
        'Authorization': 'Bearer ' + SUPA_SERVICE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ id: reporter.id, data: reporter, updated_at: new Date().toISOString() })
    });
    if (res.ok) {
      toast('🎭 Saved (Supabase ✓) — 모든 기기에서 반영됩니다');
    } else {
      var err = await res.json().catch(function(){ return {}; });
      toast('저장됨 (로컬만) — Supabase Error: ' + (err.message || err.error || 'HTTP ' + res.status) + '\nCreate character_reporters table in SQL Editor if missing', true);
    }
  } catch(e) {
    toast('저장됨 (로컬만) — Supabase connection failed', true);
  }
}

let phraseAdminItems = [];

function normalizePhraseAdmin(row){
  row = row || {};
  const examples = Array.isArray(row.examples) ? row.examples : [];
  return {
    ko: row.ko || '',
    rom: row.rom || '',
    en: row.en || '',
    intro: row.intro || '',
    nuance: row.nuance || '',
    related: Array.isArray(row.related) ? row.related.filter(Boolean) : (typeof row.related === 'string' ? row.related.split(',').map(v=>v.trim()).filter(Boolean) : []),
    examples: examples.map(ex => ({ ko: (ex && ex.ko) || '', en: (ex && ex.en) || '' })).filter(ex => ex.ko || ex.en)
  };
}

  phraseAdminItems[phraseAdminCurrentIndex] = row;

  if(!phraseAdminItems.length) phraseAdminItems = [phraseAdminDefaultItem()];
  phraseAdminCurrentIndex = Math.max(0, Math.min(phraseAdminCurrentIndex, phraseAdminItems.length - 1));
  lsSet(K_PHRASES, phraseAdminItems);
  renderPhraseAdminForm(phraseAdminCurrentIndex);
  renderPhraseAdminTable();
  toast('🗑 표현 삭제됨');
}
function renderPhraseAdminTable(){
  const tbody = document.getElementById('phrase-admin-tbody');
  if(!tbody) return;
  const q = (document.getElementById('phrase-search')?.value || '').toLowerCase();
  tbody.innerHTML = phraseAdminItems.map((raw, idx) => {
    const p = normalizePhraseAdmin(raw);
    const hay = [p.ko,p.rom,p.en,p.intro,p.nuance,(p.related||[]).join(' ')].join(' ').toLowerCase();
    if(q && !hay.includes(q)) return '';
    return `<tr ${idx===phraseAdminCurrentIndex ? 'style="background:#f8fbff"' : ''}>
      <td>
        <div class="art-t" style="font-size:18px">${esc(p.ko || '-')}</div>
        <div class="art-b" style="max-width:none">${esc(p.rom || '')}</div>
      </td>
      <td>
        <div style="font-weight:700;margin-bottom:4px">${esc(p.en || '')}</div>
        <div class="art-b" style="max-width:none;-webkit-line-clamp:3">${esc((p.intro || p.nuance || '').slice(0,140))}</div>
      </td>
      <td>${(p.examples || []).slice(0,2).map(ex => `<div style="font-size:12px;color:var(--gr);margin-bottom:4px">• ${esc(ex.ko || '')}</div>`).join('') || '<span style="color:#99aabb">예문 없음</span>'}</td>
      <td><button class="btn btn-gh btn-xs" onclick="openPhraseAdminItem(${idx})">Edit</button></td>
    </tr>`;
  }).join('');
}
function openPhraseAdminItem(idx){
  savePhraseAdminItem(false);
  renderPhraseAdminForm(idx);
  renderPhraseAdminTable();
}
function getPhraseAdminTodayIndex(){
  const items = phraseAdminItems.length ? phraseAdminItems : getPhraseAdminItems();
  return items.length ? (Math.floor(Date.now() / 86400000) % items.length) : 0;
}
function openTodayPhrasePreview(){

function openPhrasePreview(){

async function runPhraseAIGenerate(btn){
  const base = document.getElementById('phrase-ko')?.value.trim() || '경제 회복';
  const hint = document.getElementById('phrase-ai-hint')?.value.trim() || '';
  const old = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = 'Generating...';
  try{
    if(typeof callClaude !== 'function') throw new Error('AI helper is not available in this admin file.');
    const prompt = `You are creating Korean-learning content for a phrase detail page.
Generate polished content for the Korean phrase "${base}".
Hint: ${hint || 'natural learner-friendly usage, useful for mobile study'}
Return ONLY valid JSON with this exact shape:
{"ko":"","rom":"","en":"","intro":"","nuance":"","related":["","",""],"examples":[{"ko":"","en":""},{"ko":"","en":""},{"ko":"","en":""}]}
Keep intro and nuance concise but useful. Make examples natural Korean for beginner to intermediate learners.`;
    const res = await callClaude({
      feature:'generate',
      model:'claude-haiku-4-5-20251001',
      max_tokens:900,
      messages:[{role:'user', content: prompt}]
    });
    const raw = (res && res.content && res.content[0] && res.content[0].text) ? res.content[0].text : (res.text || '');
    const clean = raw.replace(/^```json\s*/,'').replace(/```$/,'').trim();
    const jsonText = clean.slice(clean.indexOf('{'), clean.lastIndexOf('}') + 1);
    const data = JSON.parse(jsonText);
    phraseAdminItems[phraseAdminCurrentIndex] = normalizePhraseAdmin(data);
    renderPhraseAdminForm(phraseAdminCurrentIndex);
    renderPhraseAdminTable();
    toast('🤖 AI draft generated');
  }catch(e){
    alert('AI generation failed: ' + (e.message || e));
  }finally{
    btn.disabled = false;
    btn.innerHTML = old;
  }
}

async function loadTopics() {
  try {
    const res = await fetch(SUPA_URL_ADMIN + '/rest/v1/writing_topics?select=*&order=category.asc,level.asc,created_at.asc', {
      headers: { 'apikey': SUPA_SERVICE_KEY, 'Authorization': 'Bearer ' + SUPA_SERVICE_KEY }
    });

    window._topicsAll = await res.json();

  } catch(e) {
    document.getElementById('topics-wrap').innerHTML = '<div class="infobox" style="color:#c33">⚠️ ' + e.message + '</div>';

  window._topicsFilter = level;

function _isRecentDate(iso, days){
  if (!iso) return true;
  var t = new Date(iso).getTime();
  if (isNaN(t)) return true;
  var diff = Date.now() - t;
  return diff <= (days || 7) * 86400000;
}
function _headlineKey(item){
  var k = (item.title || '').toLowerCase().replace(/[^\w가-힣]+/g, '');
  return k.slice(0, 140);
}
async function _fetchHeadlinesFromBackend(sourceIds) {
  const endpoint = '/api/admin-source-fetch';
  const payload = {
    source_ids: sourceIds || [],
    limit: 60,
  };
  const headers = { 'Content-Type':'application/json' };
  // Pass-through Supabase admin creds for server-side duplicate check (never shown in UI)
  if (SUPA_URL_ADMIN) headers['x-supabase-url'] = SUPA_URL_ADMIN;
  if (SUPA_KEY_ADMIN) {
    headers['apikey'] = SUPA_KEY_ADMIN;
    headers['authorization'] = 'Bearer ' + SUPA_KEY_ADMIN;
  }
  const res = await fetch(endpoint, {
    method:'POST',
    headers,
    body: JSON.stringify(payload),
    signal: AbortSignal.timeout(18000),
  });
  const json = await res.json().catch(function(){ return {}; });
  if (!res.ok || !json?.ok) {
    throw new Error(json?.message || 'SOURCE_FETCH_FAILED');
  }
  return json;
}

// ── STEP 1: Fetch headlines from all selected sources ─────────
async function fetchHeadlines() {
  const selected = [...document.querySelectorAll('.ns-chk:checked')].map(function(c){ return c.value; });
  if (!selected.length) { toast('소스를 하나 이상 선택하세요', true); return; }

  const btn = document.getElementById('btn-fetch');
  const statusEl = document.getElementById('fetch-status');
  btn.disabled = true; btn.textContent = '⏳ 가져오는 중…';
  statusEl.innerHTML = '<span style="color:#64748b">선택한 소스에서 최근 Headline을 수집 중입니다…</span>';
  _fetchedHeadlines = [];

  try {
    const resp = await _fetchHeadlinesFromBackend(selected);
    _fetchedHeadlines = Array.isArray(resp?.items) ? resp.items : [];
    var perSource = Array.isArray(resp?.by_source) ? resp.by_source : [];

    // final guardrails
    const seen = new Set();
    _fetchedHeadlines = _fetchedHeadlines.filter(function(item){
      if (!item?.title || !item?.url) return false;
      if (!_isRecentDate(item.published_at, 10)) return false;
      const key = String(item.url).trim() || _headlineKey(item);
      if (!key || seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    if (!_fetchedHeadlines.length) {
      statusEl.innerHTML = '❌ 가져온 결과가 없습니다. 소스를 바꾸거나 잠시 후 다시 시도하세요.'
        + '<div style="margin-top:6px;color:#94a3b8;font-size:12px">'
        + perSource.map(function(p){ return p.label + ': ' + p.count + '개' + (p.error ? ' (일부 실패)' : ''); }).join(' · ')
        + '</div>';
      return;
    }

    statusEl.innerHTML = '✅ ' + _fetchedHeadlines.length + '개 Headline 수집 완료'
      + '<div style="margin-top:6px;color:#94a3b8;font-size:12px">'
      + perSource.map(function(p){ return p.label + ': ' + p.count + '개' + (p.error ? ' (일부 실패)' : ''); }).join(' · ')
      + '</div>'
      + '<div style="margin-top:4px;color:#a0aec0;font-size:11px">※ 서버에서 최근성/중복/유효성 필터링 완료</div>';
    _renderHeadlinePanel();
  } catch (e) {
    statusEl.innerHTML = '❌ 소스 수집 서버 호출에 실패했습니다. 잠시 후 다시 시도하세요.';
  } finally {
    btn.disabled = false;
    btn.textContent = '📥 Headline 가져오기';
  }
}

function _fmtPubDate(v) {
  if (!v) return '';
  const d = new Date(v);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('ko-KR', { month:'2-digit', day:'2-digit' });
}

    const sel = s.key === selectedKey ? ' selected' : '';
    return '<option value="'+s.key+'"'+sel+'>'+s.icon+' '+s.key+'</option>';

      let   _ok    = 0;

      // 공통 호출 함수 — prefill 없이 순수 요청
      async function _call(instruction, max_tok) {
        const r = await callClaude({
          feature: 'generate',
          model: 'claude-haiku-4-5-20251001',
          max_tokens: max_tok,
          messages: [{
            role: 'user',
            content: 'Korean article (level: ' + _level + ')\nTitle: ' + _title + '\n\n' + _body.slice(0, 1200) + '\n\n---\n' + instruction
          }]
        });
        return (r.content && r.content[0] && r.content[0].text) || '';
      }

      // JSON 안전 추출
      function _json(text) {
        // 배열 먼저
        const ai = text.indexOf('['), bi = text.lastIndexOf(']');
        const oi = text.indexOf('{'), ei = text.lastIndexOf('}');
        // 배열이 객체보다 앞에 나오면 배열 우선
        if (ai >= 0 && bi > ai && (oi < 0 || ai < oi)) return JSON.parse(text.slice(ai, bi+1));
        if (oi >= 0 && ei > oi) return JSON.parse(text.slice(oi, ei+1));
        throw new Error('no JSON found');
      }

      try {
        document.getElementById(rowId+'-status').innerHTML = '🧠 (1/4) 번역 중…';
        const t = await _call('Translate each paragraph into English. Return ONLY a JSON array of strings, one string per paragraph. No other text.', 800);
        const ta = _json(t);
        _row.translation = JSON.stringify({ texts: Array.isArray(ta) ? ta : [ta] });
        _ok++;
      } catch(e) { console.warn('translation failed', e.message); }

      try {
        document.getElementById(rowId+'-status').innerHTML = '🧠 (2/4) 단어 중…';
        const v = await _call('List 8 key vocabulary words from the article. Return ONLY a JSON array. Each element must be an object with keys: word (Korean), reading (romanization), meaning (English). No other text.', 800);
        _row.vocab = JSON.stringify(_json(v));
        _ok++;
      } catch(e) { console.warn('vocab failed', e.message); }

      try {
        document.getElementById(rowId+'-status').innerHTML = '🧠 (3/4) 문법 중…';
        const g = await _call('Find 3 grammar patterns used in this article. Return ONLY a JSON object: {"patterns":[{"name":"Korean name + romanization","level":"Starter or Beginner or Intermediate or Advanced","exp":"1-sentence English explanation","ex_ko":"sentence from article","ex_en":"English translation"}]}. No other text.', 900);
        _row.grammar = JSON.stringify(_json(g));
        _ok++;
      } catch(e) { console.warn('grammar failed', e.message); }

      try {
        document.getElementById(rowId+'-status').innerHTML = '🧠 (4/4) 퀴즈 중…';
        const q = await _call('Create 5 fill-in-the-blank questions from this article. Return ONLY a JSON object: {"questions":[{"sentence":"Korean sentence with _____","sentence_en":"English translation with _____","blank":"correct word","blank_en":"English meaning","choices":["correct","wrong1","wrong2","wrong3"]}]}. No other text.', 1200);
        _row.quiz = JSON.stringify(_json(q));
        _ok++;
      } catch(e) { console.warn('quiz failed', e.message); }

      if (_ok > 0) {
        try {
          const _res = await fetch(SUPA_URL_ADMIN + '/rest/v1/article_cache?on_conflict=article_id', {
            method: 'POST',
            headers: {
              'apikey': SUPA_SERVICE_KEY,
              'Authorization': 'Bearer ' + SUPA_SERVICE_KEY,
              'Content-Type': 'application/json',
              'Prefer': 'resolution=merge-duplicates,return=minimal'
            },
            body: JSON.stringify(_row)
          });
          if (!_res.ok) {
            const _err = await _res.text();
            console.warn('cache upsert failed:', _res.status, _err);
          }
        } catch(e) { console.warn('upsert failed', e); }
      }

      const statusLabel = saveStatus === 'published' ? 'Published' : 'Saved as draft';
      const existingEl = document.getElementById(rowId+'-status');
      if (existingEl) existingEl.innerHTML =
        '<span style="color:#28a745;font-weight:700">✅ ' + statusLabel + ' (cache '+_ok+'/4) — </span>'
        +"<a href=\"#\" onclick=\"openModal('"+articleId+"')\" style=\"color:var(--a);font-weight:700\">Review &amp; edit →</a>";

    } catch(err) {
      const existingEl2 = document.getElementById(rowId+'-status');
      if (existingEl2) existingEl2.innerHTML = '<span style="color:#dc3545">❌ Failed: '+err.message+'</span>';
    }
  }

  toast('✨ Adaptation complete! ' + selected.length + ' articles generated.');
}

// ══ AI CACHE 관리 ════════════════════════════════════════════
async function goAICache() {
  setSbOn('sb-cache');
  const main = document.getElementById('main');
  main.innerHTML = '<div class="pg-hd"><div><h1>🧠 AI Cache Management</h1><p>View and generate translation, vocab, grammar, and quiz cache for each article.</p></div></div>'
    + '<div id="cache-wrap"><div style="padding:24px;text-align:center;color:var(--gr)">⏳ 스키마 확인 중…</div></div>';

  const H = { 'apikey': SUPA_SERVICE_KEY, 'Authorization': 'Bearer ' + SUPA_SERVICE_KEY };

  // ── 1. 실제 컬럼 감지 ─────────────────────────────────────────────
  let _schema = null; // 'kv' | 'wide' | null
  let _schemaError = '';
  let _actualCols = [];

  // 먼저 실제 컬럼명 확인 (행이 있으면 컬럼명 알 수 있음)
  try {
    const r0 = await fetch(SUPA_URL_ADMIN + '/rest/v1/article_cache?select=*&limit=1', { headers: H });
    if (r0.ok) {
      const d0 = await r0.json();
      if (Array.isArray(d0) && d0.length > 0) {
        _actualCols = Object.keys(d0[0]);
        if (_actualCols.includes('cache_key') && _actualCols.includes('content_type')) _schema = 'kv';
        else if (_actualCols.includes('article_id') && (_actualCols.includes('vocab') || _actualCols.includes('grammar'))) _schema = 'wide';
        else _schemaError = '알 수 없는 컬럼: ' + _actualCols.join(', ');
      }
      // empty table — fall through to column probes below
    } else {
      const errBody = await r0.text().catch(()=>'');
      _schemaError = 'HTTP ' + r0.status + (errBody ? ': ' + errBody.slice(0,120) : '');
    }
  } catch(e) { _schemaError = String(e && e.message || e); }

  // 빈 테이블이거나 위에서 확인 못했으면 컬럼 유효성으로 재시도
  if (!_schema && !_schemaError) {
    try {
      const r1 = await fetch(SUPA_URL_ADMIN + '/rest/v1/article_cache?select=content_type,content_id,cache_key,cache_value&limit=0', { headers: H });
      if (r1.ok) _schema = 'kv';
      else {
        const b1 = await r1.text().catch(()=>'');
        const r2 = await fetch(SUPA_URL_ADMIN + '/rest/v1/article_cache?select=article_id,vocab,grammar&limit=0', { headers: H });
        if (r2.ok) _schema = 'wide';
        else {
          const b2 = await r2.text().catch(()=>'');
          _schemaError = 'kv probe: HTTP ' + r1.status + ' / wide probe: HTTP ' + r2.status;
        }
      }
    } catch(e) { _schemaError = _schemaError || String(e && e.message || e); }
  }

  // ── 2. 스키마에 맞게 캐시 로드 ─────────────────────────────────
  let existingCache = {}; // article_id → { translation, vocab, grammar, quiz, expressions }
  if (_schema === 'kv') {
    try {
      const cr = await fetch(SUPA_URL_ADMIN + '/rest/v1/article_cache?content_type=eq.article&select=content_id,cache_key,cache_value', { headers: H });
      const cd = cr.ok ? await cr.json() : [];
      if (Array.isArray(cd)) cd.forEach(function(r) {
        if (!existingCache[r.content_id]) existingCache[r.content_id] = {};
        existingCache[r.content_id][r.cache_key] = r.cache_value || true;
      });
    } catch(e) {}
  } else if (_schema === 'wide') {
    // wide-table: article_id + column per type
    try {
      const cr = await fetch(SUPA_URL_ADMIN + '/rest/v1/article_cache?select=*', { headers: H });
      const cd = cr.ok ? await cr.json() : [];
      if (Array.isArray(cd)) cd.forEach(function(r) {
        existingCache[r.article_id || r.id] = r;
      });
    } catch(e) {}
  }

  const articles = DB.filter(function(a){ return a.status === 'published'; });
  const wrap = document.getElementById('cache-wrap');
  if (!articles.length) { wrap.innerHTML = '<p style="padding:24px;color:var(--gr)">발행된 기사가 없어요.</p>'; return; }

  const cacheComplete = articles.filter(function(a) {
    const c = existingCache[String(a.id)] || {};
    return c.translation && c.vocab && c.grammar && c.quiz;
  }).length;

  let schemaNote = _schema
    ? '<span style="font-size:11px;padding:2px 8px;background:' + (_schema==='kv'?'#d1fae5':'#fef9c3') + ';border-radius:8px;color:#374151;font-weight:700">스키마: ' + _schema + (_actualCols.length ? ' [' + _actualCols.join(', ') + ']' : '') + '</span>'
    : '<span style="font-size:11px;padding:2px 8px;background:#fee2e2;border-radius:8px;color:#991b1b;font-weight:700">⚠️ 스키마 감지 실패' + (_schemaError ? ' — ' + _schemaError : ' — Supabase 콘솔에서 article_cache 컬럼 확인 필요') + '</span>';

  let html = '<div style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
    + '<span style="font-size:13px;color:var(--gr)">발행 기사 <b>' + articles.length + '</b>개 · 캐시 완료 <b>' + cacheComplete + '</b>개</span>'
    + schemaNote
    + '<button class="btn" style="font-size:12px;padding:6px 14px;background:#f1f5f9;color:#374151;border:1px solid var(--bo)" onclick="goAICache()">🔄 새로고침</button>'
    + '</div>';

  articles.forEach(function(a) {
    const c = existingCache[String(a.id)] || {};
    const hasT = !!c.translation, hasV = !!c.vocab, hasG = !!c.grammar, hasQ = !!c.quiz;
    const hasE = !!c.expressions;
    const allDone = hasT && hasV && hasG && hasQ;
    function badge(ok, label) {
      return '<span style="padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;margin-right:4px;background:' + (ok?'#dcfce7':'#fee2e2') + ';color:' + (ok?'#166534':'#991b1b') + '">' + (ok?'✓':'✗') + ' ' + label + '</span>';
    }
    const exprCount = hasE && c.expressions ? (() => { try { const e = JSON.parse(c.expressions); return Array.isArray(e)?e.length:0; } catch(e){return 0;} })() : 0;
    html += '<div id="crow-' + a.id + '" style="background:#fff;border:1px solid var(--bo);border-radius:10px;margin-bottom:8px;overflow:hidden">'
      + '<div style="display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap">'
      + '<div style="flex:1;min-width:200px"><div style="font-weight:700;font-size:14px;margin-bottom:4px">' + (a.title||'(제목없음)') + '</div>'
      + '<div style="font-size:12px;color:var(--gr)">' + (a.section||'') + ' · ' + (a.date||'') + ' · ' + ({Starter:'Seed',Beginner:'Sprout',Intermediate:'Tree',Advanced:'Forest'}[a.level]||a.level||'') + '</div></div>'
      + '<div>' + badge(hasT,'Translation') + badge(hasV,'Vocab') + badge(hasG,'Grammar') + badge(hasQ,'Quiz') + '</div>'
      + (allDone ? '<span style="color:#166534;font-weight:700;font-size:13px">✅ Done</span>'
          : '<button class="btn btn-g" style="font-size:13px;padding:7px 16px" id="cbtn-' + a.id + '" onclick="genCache(\'' + a.id + '\',\'' + (_schema||'') + '\')">🧠 Generate</button>')
      + '<button style="padding:6px 13px;border:1.5px solid #6366f1;border-radius:8px;background:' + (hasE?'#eef2ff':'#fff') + ';color:#6366f1;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit" onclick="toggleExpressionsEditor(\'' + a.id + '\')">'
      + '✏️ Expressions' + (exprCount ? ' (' + exprCount + ')' : '') + '</button>'
      + '<div id="cst-' + a.id + '" style="width:100%;font-size:12px;color:var(--gr);margin-top:4px"></div>'
      + '</div>'
      + '<div id="expr-editor-' + a.id + '" style="display:none;padding:0 16px 16px;border-top:1px solid #f1f5f9">'
      + renderExpressionsEditor(a.id, hasE && c.expressions ? c.expressions : '[]')
      + '</div>'
      + '</div>';
  });
  wrap.innerHTML = html;
}

    return '<div class="expr-row" style="display:flex;gap:8px;align-items:center;margin-bottom:6px">'
      + '<input class="expr-phrase" style="flex:2;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;font-family:inherit" placeholder="Korean phrase…" value="' + (ex.phrase||'').replace(/"/g,'&quot;') + '">'
      + '<select class="expr-color" style="padding:6px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;font-family:inherit">'
      + ['blue','green','amber','rose'].map(function(c){ return '<option value="'+c+'"'+(ex.color===c?' selected':'')+'>'+c+'</option>'; }).join('')
      + '</select>'
      + '<input class="expr-note" style="flex:2;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;font-family:inherit" placeholder="Note (optional)…" value="' + (ex.note||'').replace(/"/g,'&quot;') + '">'
      + '<button onclick="this.closest(\'.expr-row\').remove()" style="padding:5px 9px;border:none;background:#fee2e2;color:#991b1b;border-radius:6px;cursor:pointer;font-size:13px">✕</button>'
      + '</div>';
  }).join('');
  return '<div style="padding-top:14px">'
    + '<div style="font-size:12px;font-weight:800;color:#6366f1;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">✏️ Highlighted Expressions</div>'
    + '<div style="font-size:12px;color:#64748b;margin-bottom:12px">Mark important phrases in this article. They will be highlighted in-article for learners.</div>'
    + '<div id="expr-rows-' + articleId + '">' + rows + '</div>'
    + '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'
    + '<button onclick="addExprRow(\'' + articleId + '\')" style="padding:7px 14px;background:#f0f0ff;border:1px dashed #6366f1;border-radius:8px;color:#6366f1;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">+ Add Expression</button>'
    + '<button onclick="saveExpressions(\'' + articleId + '\')" style="padding:7px 18px;background:#6366f1;border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">💾 Save</button>'
    + '<span id="expr-status-' + articleId + '" style="font-size:12px;color:var(--gr);align-self:center"></span>'
    + '</div>'
    + '</div>';
}

function addExprRow(articleId) {

    + '</select>'
    + '<input class="expr-note" style="flex:2;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;font-family:inherit" placeholder="Note (optional)…">'

async function saveExpressions(articleId) {
  const container = document.getElementById('expr-rows-' + articleId);
  const status = document.getElementById('expr-status-' + articleId);
  if (!container) return;
  const rows = container.querySelectorAll('.expr-row');
  const exprs = [];
  rows.forEach(function(row) {
    const phrase = (row.querySelector('.expr-phrase').value || '').trim();
    if (!phrase) return;
    exprs.push({
      phrase: phrase,
      color:  (row.querySelector('.expr-color').value || 'blue'),
      note:   (row.querySelector('.expr-note').value  || '').trim() || undefined
    });
  });
  if (status) status.textContent = 'Saving…';
  try {
    const res = await fetch(SUPA_URL_ADMIN + '/rest/v1/article_cache?on_conflict=content_type,content_id,cache_key', {
      method: 'POST',
      headers: {
        'apikey': SUPA_SERVICE_KEY, 'Authorization': 'Bearer ' + SUPA_SERVICE_KEY,
        'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ content_type: 'article', content_id: String(articleId), cache_key: 'expressions', cache_value: JSON.stringify(exprs) })
    });
    if (!res.ok) {
      const t = await res.text();
      if (status) status.textContent = '❌ ' + t.slice(0,80);
    } else {
      if (status) status.textContent = '✅ Saved (' + exprs.length + ' expressions)';
      setTimeout(function(){ if(status) status.textContent=''; }, 3000);
    }
  } catch(e) {
    if (status) status.textContent = '❌ ' + e.message;
  }
}

async function genCache(articleId, schema) {
  const a = DB.find(function(x){ return String(x.id) === String(articleId); });
  if (!a) return;
  const st  = document.getElementById('cst-' + articleId);
  const btn = document.getElementById('cbtn-' + articleId);
  if (btn) btn.disabled = true;

  const _body  = a.body  || '';
  const _title = a.title || '';
  const _level = a.level || 'Intermediate';
  const _row   = { article_id: String(articleId), updated_at: new Date().toISOString() };
  let _ok = 0;

  async function _call(instr, max_tok) {
    const r = await callClaude({
      feature: 'generate', model: 'claude-haiku-4-5-20251001', max_tokens: max_tok,
      messages: [{ role: 'user', content: 'Korean article (level: ' + _level + ')\nTitle: ' + _title + '\n\n' + _body.slice(0, 1200) + '\n\n---\n' + instr }]
    });
    return (r.content && r.content[0] && r.content[0].text) || '';
  }

  function _json(text) {
    const ai = text.indexOf('['), bi = text.lastIndexOf(']');
    const oi = text.indexOf('{'), ei = text.lastIndexOf('}');
    if (ai >= 0 && bi > ai && (oi < 0 || ai < oi)) return JSON.parse(text.slice(ai, bi+1));
    if (oi >= 0 && ei > oi) return JSON.parse(text.slice(oi, ei+1));
    throw new Error('no JSON');
  }

  try {
    if (st) st.textContent = '(1/4) 번역 중…';
    const t = await _call('Translate each paragraph into English. Return ONLY a JSON array of strings, one per paragraph. No other text.', 800);
    const ta = _json(t);
    _row.translation = JSON.stringify({ texts: Array.isArray(ta) ? ta : [ta] });
    _ok++;
  } catch(e) { console.warn('translation failed', e.message); }

  try {
    if (st) st.textContent = '(2/4) 단어 중…';
    const v = await _call('List 8 key vocabulary words. Return ONLY a JSON array. Each: {"word":"Korean","reading":"romanization","meaning":"English"}. No other text.', 800);
    _row.vocab = JSON.stringify(_json(v));
    _ok++;
  } catch(e) { console.warn('vocab failed', e.message); }

  try {
    if (st) st.textContent = '(3/4) 문법 중…';
    const g = await _call('Find 3 grammar patterns. Return ONLY: {"patterns":[{"name":"KO+romanization","level":"Starter|Beginner|Intermediate|Advanced","exp":"explanation","ex_ko":"sentence","ex_en":"translation"}]}. No other text.', 900);
    _row.grammar = JSON.stringify(_json(g));
    _ok++;
  } catch(e) { console.warn('grammar failed', e.message); }

  try {
    if (st) st.textContent = '(4/4) 퀴즈 중…';
    const q = await _call('Create 15 fill-in-the-blank questions from this article, covering different sentences and vocabulary. Return ONLY: {"questions":[{"sentence":"Korean sentence with _____","sentence_en":"English with _____","blank":"correct answer word","blank_en":"English meaning","choices":["correct","wrong1","wrong2","wrong3"]}]}. No other text.', 2500);
    _row.quiz = JSON.stringify(_json(q));
    _ok++;
  } catch(e) { console.warn('quiz failed', e.message); }

  // 스키마에 맞게 저장
  if (_ok > 0) {
    const H = { 'apikey': SUPA_SERVICE_KEY, 'Authorization': 'Bearer ' + SUPA_SERVICE_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' };
    let saved = 0;

    if (schema === 'kv') {
      // key-value 스키마: 각 키별로 upsert
      for (const k of ['translation', 'vocab', 'grammar', 'quiz']) {
        if (!_row[k]) continue;
        try {
          const res = await fetch(SUPA_URL_ADMIN + '/rest/v1/article_cache?on_conflict=content_type,content_id,cache_key', {
            method: 'POST', headers: H,
            body: JSON.stringify({ content_type: 'article', content_id: String(articleId), cache_key: k, cache_value: _row[k] })
          });
          if (res.ok) saved++;
          else { const t = await res.text(); console.error('cache save kv ' + k + ':', res.status, t); }
        } catch(e) {}
      }
    } else if (schema === 'wide') {
      // wide-table 스키마: article_id 기준 upsert
      // 존재 여부 확인 후 PATCH or POST
      try {
        const chk = await fetch(SUPA_URL_ADMIN + '/rest/v1/article_cache?article_id=eq.' + encodeURIComponent(articleId) + '&select=article_id', { headers: H });
        const chkData = chk.ok ? await chk.json() : [];
        const wideRow = { article_id: String(articleId), translation: _row.translation, vocab: _row.vocab, grammar: _row.grammar, quiz: _row.quiz };
        if (Array.isArray(chkData) && chkData.length > 0) {
          const res = await fetch(SUPA_URL_ADMIN + '/rest/v1/article_cache?article_id=eq.' + encodeURIComponent(articleId), {
            method: 'PATCH', headers: H, body: JSON.stringify(wideRow)
          });
          if (res.ok) saved++;
          else { const t = await res.text(); console.error('cache patch wide:', res.status, t); }
        } else {
          const res = await fetch(SUPA_URL_ADMIN + '/rest/v1/article_cache', {
            method: 'POST', headers: H, body: JSON.stringify(wideRow)
          });
          if (res.ok) saved++;
          else { const t = await res.text(); console.error('cache insert wide:', res.status, t); }
        }
      } catch(e) { console.error('cache save wide error', e); }
    } else {
      if (st) st.textContent = '❌ 스키마 감지 실패 — 어드민 콘솔에서 article_cache 컬럼 확인 필요';
      if (btn) btn.disabled = false;
      return;
    }

    if (saved === 0) {
      if (st) st.textContent = '❌ DB 저장 실패 (' + schema + ' 스키마) — 콘솔 오류 확인';
      if (btn) btn.disabled = false;
      return;
    }
  }

  if (st) st.textContent = '✅ 완료 (' + _ok + '/4)';
  setTimeout(function(){ goAICache(); }, 1200);
}

async function adminReplyComment(id, btn) {
  var ta = document.querySelector('textarea[data-id="'+id+'"]');
  if(!ta) return;
  var reply = ta.value.trim();
  if(!reply) return;
  btn.disabled = true; btn.textContent = '저장 중…';
  await fetch(SUPA_URL_ADMIN+'/rest/v1/comments?id=eq.'+id, {
    method:'PATCH',
    headers:{ 'apikey':SUPA_SERVICE_KEY,'Authorization':'Bearer '+SUPA_SERVICE_KEY,'Content-Type':'application/json','Prefer':'return=minimal' },
    body: JSON.stringify({ reply:reply, replied_at:new Date().toISOString() })
  });
  btn.disabled = false; btn.textContent = '답변 저장';
  toast('✅ 답변이 저장됐어요!');
}

async function adminDeleteComment(id) {

    method:'DELETE',
    headers:{ 'apikey':SUPA_SERVICE_KEY,'Authorization':'Bearer '+SUPA_SERVICE_KEY }
  });
  loadAllComments();
  toast('🗑 삭제됐어요.');
}

async function loadStats() {
  var wrap = document.getElementById('stats-admin-wrap');
  try {
    var since = new Date(Date.now()-30*86400000).toISOString();
    var res = await fetch(SUPA_URL_ADMIN+'/rest/v1/page_views?viewed_at=gte.'+since+'&order=viewed_at.desc&limit=2000', { headers: { 'apikey':SUPA_SERVICE_KEY,'Authorization':'Bearer '+SUPA_SERVICE_KEY } });
    var rows = res.ok ? await res.json() : [];

    var totalViews = rows.length;
    var todayStr   = new Date().toISOString().split('T')[0];
    var todayViews = rows.filter(function(r){ return r.viewed_at.startsWith(todayStr); }).length;

    // Daily counts (last 14 days)
    var daily = {};
    for(var d=13; d>=0; d--) {
      var dt = new Date(Date.now()-d*86400000).toISOString().split('T')[0];
      daily[dt] = rows.filter(function(r){ return r.viewed_at.startsWith(dt); }).length;
    }

    // Top articles
    var artCounts = {};
    rows.filter(function(r){ return r.article_id; }).forEach(function(r){
      artCounts[r.article_id] = (artCounts[r.article_id]||0)+1;
    });
    var topArts = Object.entries(artCounts).sort(function(a,b){ return b[1]-a[1]; }).slice(0,10);

    var maxVal = Math.max.apply(null, Object.values(daily).concat([1]));

    wrap.innerHTML =
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px">'
      +'<div style="background:#fff;border:1px solid var(--bo);border-radius:10px;padding:18px;text-align:center">'
      +'<div style="font-size:32px;font-weight:900;color:var(--a)">'+totalViews+'</div><div style="font-size:12px;color:var(--gr);font-weight:700">30일 총 페이지뷰</div></div>'
      +'<div style="background:#fff;border:1px solid var(--bo);border-radius:10px;padding:18px;text-align:center">'
      +'<div style="font-size:32px;font-weight:900;color:var(--a)">'+todayViews+'</div><div style="font-size:12px;color:var(--gr);font-weight:700">오늘 페이지뷰</div></div>'
      +'<div style="background:#fff;border:1px solid var(--bo);border-radius:10px;padding:18px;text-align:center">'
      +'<div style="font-size:32px;font-weight:900;color:var(--a)">'+topArts.length+'</div><div style="font-size:12px;color:var(--gr);font-weight:700">조회된 기사 수</div></div>'
      +'</div>'

      // 바 차트
      +'<div style="background:#fff;border:1px solid var(--bo);border-radius:10px;padding:20px;margin-bottom:20px">'
      +'<div style="font-size:14px;font-weight:700;color:var(--dk);margin-bottom:16px">최근 14일 일별 페이지뷰</div>'
      +'<div style="display:flex;align-items:flex-end;gap:6px;height:100px">'
      + Object.entries(daily).map(function(e){
          var h = Math.round((e[1]/maxVal)*90)+4;
          var isToday = e[0]===todayStr;
          return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">'
            +'<div style="font-size:10px;color:var(--gr)">'+e[1]+'</div>'
            +'<div style="width:100%;height:'+h+'px;background:'+(isToday?'var(--a)':'#c5d5f0')+';border-radius:4px 4px 0 0"></div>'
            +'<div style="font-size:9px;color:var(--gr)">'+e[0].slice(5)+'</div>'
            +'</div>';
        }).join('')
      +'</div></div>'

      // 인기 기사
      +'<div style="background:#fff;border:1px solid var(--bo);border-radius:10px;padding:20px">'
      +'<div style="font-size:14px;font-weight:700;color:var(--dk);margin-bottom:14px">🏆 Top Articles</div>'
      + (topArts.length ? topArts.map(function(e,i){
          var art = DB.find(function(a){ return a.id===e[0]; });
          var title = art ? art.title : e[0];
          return '<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--bo)">'
            +'<span style="font-size:16px;font-weight:900;color:var(--a);width:24px;text-align:right">'+(i+1)+'</span>'

  }
}

async function loadUsers(){
  const el = document.getElementById('users-wrap');
  try {
    // auth.users 직접 조회 (service_role 필요)
    const authRes = await fetch(SUPA_URL_ADMIN + '/auth/v1/admin/users?per_page=500', {
      headers: {
        'apikey': SUPA_SERVICE_KEY,
        'Authorization': 'Bearer ' + SUPA_SERVICE_KEY
      }
    });
    if (!authRes.ok) throw new Error('auth.users 조회 실패: ' + authRes.status);
    const authData = await authRes.json();
    const authUsers = authData.users || [];

    // 활동 데이터 병렬 조회 (각 테이블 실패해도 계속)
    function safeArr(p){ return p.then(function(d){ return Array.isArray(d)?d:[]; }).catch(function(){return [];}); }
    const [words, articles, missions, writings, comments] = await Promise.all([
      safeArr(supaAdminGet('/rest/v1/saved_words?select=user_id,created_at&order=created_at.desc')),
      safeArr(supaAdminGet('/rest/v1/read_articles?select=user_id,read_at&order=read_at.desc')),
      safeArr(supaAdminGet('/rest/v1/daily_missions?select=user_id,date,articles,words,quizzes,fill&order=date.desc')),
      safeArr(supaAdminGet('/rest/v1/writing_submissions?select=user_id,created_at&order=created_at.desc')),
      safeArr(supaAdminGet('/rest/v1/comments?select=user_id,created_at&order=created_at.desc')),
    ]);

    // 활동 집계
    const act = {};
    function getAct(uid){ if(!act[uid]) act[uid]={words:0,articles:0,quizzes:0,streak:0,writings:0,comments:0,lastSeen:null}; return act[uid]; }
    words.forEach(function(r){ if(!r||!r.user_id)return; var u=getAct(r.user_id); u.words++; if(!u.lastSeen||r.created_at>u.lastSeen) u.lastSeen=r.created_at; });
    articles.forEach(function(r){ if(!r||!r.user_id)return; var u=getAct(r.user_id); u.articles++; if(!u.lastSeen||r.read_at>u.lastSeen) u.lastSeen=r.read_at; });
    missions.forEach(function(r){ if(!r||!r.user_id)return; var u=getAct(r.user_id); u.quizzes+=(r.quizzes||0); u.articles+=(r.articles||0); });
    writings.forEach(function(r){ if(!r||!r.user_id)return; var u=getAct(r.user_id); u.writings++; if(!u.lastSeen||r.created_at>u.lastSeen) u.lastSeen=r.created_at; });
    comments.forEach(function(r){ if(!r||!r.user_id)return; var u=getAct(r.user_id); u.comments++; if(!u.lastSeen||r.created_at>u.lastSeen) u.lastSeen=r.created_at; });

    if (!authUsers.length) {
      el.innerHTML = '<div class="infobox">가입한 회원이 없습니다.</div>';
      return;
    }

    // auth.users 기준으로 정렬 (최신 가입순)
    authUsers.sort(function(a,b){ return (b.created_at||'') > (a.created_at||'') ? 1 : -1; });

    el.innerHTML =
      '<div style="margin-bottom:12px;font-size:13px;color:var(--gray)">총 <b>'+authUsers.length+'</b>명 가입</div>'
      +'<table style="width:100%;border-collapse:collapse;font-size:13px">'
      +'<thead><tr style="background:#f8faff;border-bottom:2px solid var(--border);text-align:left">'
      +'<th style="padding:10px 12px">이메일</th>'
      +'<th style="padding:10px 12px">가입일</th>'
      +'<th style="padding:10px 12px">마지막 로그인</th>'
      +'<th style="padding:10px 12px">저장단어</th>'
      +'<th style="padding:10px 12px">읽은기사</th>'
      +'<th style="padding:10px 12px">퀴즈</th>'
      +'<th style="padding:10px 12px">✍️쓰기</th>'
      +'<th style="padding:10px 12px">💬댓글</th>'
      +'<th style="padding:10px 12px">🔥연속</th>'
      +'</tr></thead><tbody>'
      + authUsers.map(function(u){
          var a = act[u.id] || {words:0,articles:0,quizzes:0,streak:0};
          var email = u.email || u.user_metadata?.email || '(소셜 로그인)';
          var name  = u.user_metadata?.full_name || u.user_metadata?.name || '';
          var joined   = u.created_at   ? new Date(u.created_at).toLocaleDateString('ko-KR')   : '-';
          var lastLogin= u.last_sign_in_at ? new Date(u.last_sign_in_at).toLocaleDateString('ko-KR') : '-';
          return '<tr style="border-bottom:1px solid var(--border)">'
            +'<td style="padding:10px 12px"><div style="font-weight:600">'+email+'</div>'+(name?'<div style="font-size:11px;color:var(--gray)">'+name+'</div>':'')+'</td>'
            +'<td style="padding:10px 12px;color:var(--gray);font-size:12px">'+joined+'</td>'
            +'<td style="padding:10px 12px;color:var(--gray);font-size:12px">'+lastLogin+'</td>'
            +'<td style="padding:10px 12px;font-weight:700;color:var(--accent)">'+a.words+'</td>'
            +'<td style="padding:10px 12px">'+a.articles+'</td>'
            +'<td style="padding:10px 12px">'+a.quizzes+'</td>'
            +'<td style="padding:10px 12px;font-weight:'+(a.writings?'700':'400')+';color:'+(a.writings?'#7c3aed':'#94a3b8')+'">'+a.writings+'</td>'
            +'<td style="padding:10px 12px">'+a.comments+'</td>'
            +'<td style="padding:10px 12px">'+(a.streak||0)+'</td>'
            +'</tr>';
        }).join('')
      +'</tbody></table>';

  } catch(err) {
    el.innerHTML = '<div class="infobox" style="color:#c33">⚠️ 실패: '+err.message+'</div>';
  }
}

async function callAdminClaude(prompt) {
  var proxies = [
    SUPA_URL_ADMIN2 + '/functions/v1/claude-proxy',
    SUPA_URL_ADMIN + '/functions/v1/claude-proxy'
  ];
  var lastErr = null;

  for (var i = 0; i < proxies.length; i++) {
    var resp = await fetch(proxies[i], {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPA_KEY_ADMIN2,
        'apikey': SUPA_KEY_ADMIN2,
        'x-admin-bypass': '1'
      },
      body: JSON.stringify({
        feature: 'admin-ai-gen',
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 2200,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (resp.ok) {
      var data = await resp.json();
      return (data.content || []).map(function(b){ return b.text || ''; }).join('');
    }

    var errBody = await resp.json().catch(function(){ return {}; });
    lastErr = new Error('Claude API ' + resp.status + ': ' + (errBody.error || ''));
  }

  throw lastErr || new Error('Claude proxy request failed');
}

async function saveToCache(contentType, contentId, key, value) {
  const sb = getSb();
  if (!sb) return;
  try {
    await sb.from('article_cache').upsert({
      content_type: contentType,
      content_id: String(contentId),
      cache_key: key,
      cache_value: JSON.stringify(value),
      created_at: new Date().toISOString()
    }, { onConflict: 'content_type,content_id,cache_key' });
  } catch(e) { console.warn('cache save fail:', e); }
}

async function autoGenConvAI(convId, convObj) {
  showToastAdmin('🤖 AI 분석 중…');
  try {
    var msgsText = (convObj.msgs || []).map(function(m){ return (m.who||m.s||'?') + ': ' + m.txt; }).join('\n');
    var prompt = '다음 한국어 대화를 분석해서 JSON으로만 답해줘. 다른 말 하지 마.\n\n대화:\n'
      + msgsText
      + '\n\n형식:\n{"vocab":[{"ko":"단어","rom":"로마자","en":"영어뜻"}],"grammar":[{"point":"문법 포인트","ex":"예문","en":"설명"}],"mission":[{"task":"연습 미션"}]}'
      + '\n\nvocab 5개, grammar 2개, mission 2개. JSON만 출력.';

    var result = await callAdminClaude(prompt);
    var clean = result.replace(/```json[\s\S]*?```/g, function(m){ return m.slice(7,-3); }).replace(/```/g,'').trim();
    var parsed = JSON.parse(clean);

    // DB: 현재 row 읽어서 data 컬럼 병합 후 update
    const sb = getSb();
    var res = await sb.from('conversations_data').select('data').eq('id', convId).single();
    // res.data = row 자체: { data: {...} }
    var currentData = (res.data && res.data.data) ? res.data.data : (convObj || {});
    var updated = Object.assign({}, currentData, {
      vocab:   parsed.vocab   || [],
      grammar: parsed.grammar || [],
      mission: parsed.mission || []
    });
    var { error: updateErr } = await sb.from('conversations_data').update({ data: updated }).eq('id', convId);
    if (updateErr) throw updateErr;

    // article_cache에도 저장
    await saveToCache('conversation', convId, 'ai_analysis', parsed);
    showToastAdmin('🤖 완료! vocab ' + (parsed.vocab||[]).length + '개 · grammar ' + (parsed.grammar||[]).length + '개 · mission ' + (parsed.mission||[]).length + '개');
    await loadConvList();
  } catch(e) {
    console.error('autoGenConvAI failed:', e);
    showToastAdmin('⚠️ AI generation failed: ' + (e.message || String(e)));
  }
}

async function autoGenStoryAI(storyId, storyObj) {
  showToastAdmin('🤖 스토리 AI 분석 중…');
  try {
    var bodyText = (storyObj.body || '').replace(/<[^>]*>/g, '').slice(0, 1500);
    var prompt = '다음 한국어 스토리를 분석해서 JSON으로만 답해줘. 다른 말 하지 마.\n\n스토리 제목: '
      + storyObj.title + '\n내용: ' + bodyText
      + '\n\n형식:\n{"vocab":[{"ko":"단어","rom":"로마자","en":"영어뜻","note":"간단한 설명"}],"grammar":[{"point":"문법 포인트","ex":"예문","en":"설명"}],"summary_en":"영어 요약 1-2문장"}'
      + '\n\nvocab 6개, grammar 3개. JSON만 출력.';

    var result = await callAdminClaude(prompt);
    var clean = result.replace(/```json[\s\S]*?```/g, function(m){ return m.slice(7,-3); }).replace(/```/g,'').trim();
    var parsed = JSON.parse(clean);

    const sb = getSb();
    var res = await sb.from('stories_data').select('data').eq('id', storyId).single();
    var currentData = (res.data && res.data.data) ? res.data.data : (storyObj || {});
    var updated = Object.assign({}, currentData, {
      vocab:      parsed.vocab      || [],
      grammar:    parsed.grammar    || [],
      summary_en: parsed.summary_en || '',
    });
    var { error: updateErr } = await sb.from('stories_data').update({ data: updated }).eq('id', storyId);
    if (updateErr) throw updateErr;

    await saveToCache('story', storyId, 'ai_analysis', parsed);
    showToastAdmin('🤖 완료! vocab ' + (parsed.vocab||[]).length + '개 · grammar ' + (parsed.grammar||[]).length + '개');
    await loadStoryList();
  } catch(e) {
    console.error('autoGenStoryAI failed:', e);
    showToastAdmin('⚠️ AI generation failed: ' + (e.message || String(e)));
  }
}
