<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://samghztrdvtxmrmawneu.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — KoreHani</title>
<link rel="stylesheet" href="korehan-shared.css?v=20261023a">
<style>
body{margin:0;background:#f8fafc;font-family:'Happy Monkey','Jua','DM Sans',Inter,'Noto Sans KR',sans-serif;color:#0f172a}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px 56px}
/* ── Shop Hero — matches the news/convo/stories hero family ── */
.shop-hero{background:linear-gradient(160deg,#0b1f3f 0%,#1e3a8a 55%,#0f766e 100%);padding:36px 0 80px;margin-bottom:-56px;position:relative;overflow:hidden;color:#fff}
.shop-hero-inner{max-width:1280px;margin:0 auto;padding:0 24px;position:relative;z-index:1}
.shop-hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.shop-hero-left{flex:1;min-width:240px}
.shop-hero-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.75);margin-bottom:10px}
.shop-hero-left h1{font-family:'Playfair Display',Georgia,serif;font-size:38px;font-weight:900;margin:0 0 10px;line-height:1.15;color:#fff;letter-spacing:-.01em}
.shop-hero-left p{font-size:15px;color:rgba(255,255,255,.85);line-height:1.7;max-width:560px;margin:0}
.shop-balances{display:flex;gap:10px}
.shop-bal{background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 18px;min-width:100px;text-align:center}
.shop-bal-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:4px}
.shop-bal-value{font-size:22px;font-weight:900;color:#fff}
.shop-bal-value.xp{color:#7dd3fc}
.shop-bal-value.nyang{color:#5eead4}
.wrap{position:relative;z-index:2}
/* ── Tabs ── */
.shop-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:4px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;margin-bottom:4px}
.shop-tab{padding:8px 16px;border-radius:10px;border:none;cursor:pointer;font-size:12px;font-weight:800;font-family:inherit;background:transparent;color:#64748b;transition:.15s}
.shop-tab:hover{background:#f1f5f9;color:#334155}
.shop-tab.active{background:#0b1626;color:#fff;box-shadow:0 2px 8px rgba(11,22,38,.2)}
/* ── Grid & Cards ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:14px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;padding:12px;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 8px 24px rgba(15,23,42,.08);transform:translateY(-2px)}
.thumb{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8fafc,#f0f4fa);border-radius:10px;margin-bottom:10px;padding:10px}
.thumb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.body{display:flex;flex-direction:column;gap:5px;flex:1}
@media(max-width:980px){
  /* Tablet 768-980: the previous breakpoints only handled <600px so a
     768-980px iPad showed a 1-column .grid (160px card + huge whitespace)
     Tighten to keep cards dense. */
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
@media(max-width:600px){
  /* Tab gap bumped from 6→8 px on phone — at 6 px adjacent tabs sit
     well inside the 44 px touch-target separation rule. */
  .shop-tabs{gap:8px}
}
.title{font-size:13px;font-weight:800}.desc{font-size:11px;color:#64748b;line-height:1.4}
.price{display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px}
.coin{background:#ecfeff;color:#0f766e}.cash{background:#f5f3ff;color:#6d28d9}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.btn{border:none;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:800;cursor:pointer;transition:opacity .15s}
.btn.coin{background:#0f766e;color:#fff}.btn.cash{background:#6d28d9;color:#fff}.btn:hover{opacity:.85}.btn:disabled{opacity:.4;cursor:not-allowed}
.owned{font-size:11px;color:#16a34a;font-weight:800}

/* Mobile tap targets — audit flagged these as sub-44 px. Bump shop tabs
   and purchase buttons to comply with iOS HIG / Material guidelines.
   The .btn flex:1 lets the two CTAs share the row at full width rather
   than each shrinking to fit its label. */
@media (max-width: 768px) {
  .shop-tab { padding:13px 18px; font-size:13px; min-height:48px; }
  .btn      { padding:11px 14px; font-size:13px; min-height:44px; flex:1 1 calc(50% - 6px); }
  .btns     { gap:8px; }
}
/* ── Sections ── */
.sec-header{display:flex;align-items:center;gap:10px;margin:28px 0 8px}
.sec-header h2{font-size:18px;font-weight:900;margin:0}
.sec-header p{font-size:12px;color:#64748b;margin:0}
/* ── Inventory ── */
.inv{margin-top:24px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;box-shadow:0 1px 4px rgba(15,23,42,.04)}
.inv h3{margin:0 0 10px;font-size:16px;font-weight:900}.inv-item{padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.inv-item:last-child{border-bottom:none}
@media(max-width:600px){.shop-hero{padding:22px 0 50px;margin-bottom:-34px}.shop-hero-inner{padding:0 16px}.shop-hero-left h1{font-size:24px;margin-bottom:6px}.shop-hero-left p{font-size:12px;line-height:1.5}.shop-balances{gap:8px}.shop-bal{padding:10px 14px;min-width:80px}.shop-bal-value{font-size:18px}.grid{grid-template-columns:repeat(2,1fr);gap:8px}}
</style>
</head>
<body>
<div id="kh-header"></div>
<section class="shop-hero">
  <div class="shop-hero-inner">
    <div class="shop-hero-top">
      <div class="shop-hero-left">
        <div class="shop-hero-eyebrow">KoreHani</div>
        <h1>Shop</h1>
        <p>Spend nyang on items, gifts, and room decorations.</p>
      </div>
      <div class="shop-balances">
        <div class="shop-bal">
          <div class="shop-bal-label">XP</div>
          <div class="shop-bal-value xp" id="shop-xp">—</div>
        </div>
        <div class="shop-bal">
          <div class="shop-bal-label">Nyang</div>
          <div class="shop-bal-value nyang" id="shop-coin">—</div>
        </div>
      </div>
    </div>
  </div>
</section>
<main class="wrap">
  <nav class="shop-tabs" id="shop-tabs">
    <button class="shop-tab active" data-tab="all">ALL</button>
    <button class="shop-tab" data-tab="gift" style="display:inline-flex;align-items:center;gap:5px"><i data-lucide="gift" class="kh-ui-icon kh-ui-icon-sm" aria-hidden="true"></i><span>Gift</span></button>
    <button class="shop-tab" data-tab="room" style="display:inline-flex;align-items:center;gap:5px"><i data-lucide="home" class="kh-ui-icon kh-ui-icon-sm" aria-hidden="true"></i><span>Room</span></button>
    <button class="shop-tab" data-tab="profile" style="display:inline-flex;align-items:center;gap:5px"><i data-lucide="user" class="kh-ui-icon kh-ui-icon-sm" aria-hidden="true"></i><span>Profile</span></button>
  </nav>
  <section class="grid" id="shop-grid"></section>
  <section class="grid" id="room-shop-grid"></section>
  <section class="inv" id="shop-inventory-section"><h3>Your Inventory</h3><div id="shop-inventory">Loading…</div></section>

</main>
<div id="kh-footer"></div>

</body>
</html>
