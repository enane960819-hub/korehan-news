<style>
/* Word Bank (mockup G, 2026-10-28) — dark study surface like Study Room. */
html, html body, html body.mobile-light { background:#0a1631 linear-gradient(180deg,#0d1b3d,#0a1631 900px) no-repeat !important; color:#e2e8f0; }
body.wb-locked { overflow:hidden; }
.wb-wrap { max-width:760px; margin:0 auto; padding:18px 16px 130px; font-family:'DM Sans','Noto Sans KR',sans-serif; }
.wb-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.wb-h1 { font-size:26px; font-weight:800; color:#fff; margin:0; }
.wb-hs { font-size:13px; color:rgba(255,255,255,.55); margin:3px 0 0; }
.wb-tabs { display:flex; gap:4px; padding:4px; border-radius:12px; background:rgba(255,255,255,.06); }
.wb-tabs button { font:inherit; font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:9px; border:0; background:none; color:#cbd5e1; cursor:pointer; }
.wb-tabs button.on { background:#fff; color:#0d1b3d; }
.wb-due { display:flex; align-items:center; gap:10px; width:100%; margin:14px 0 2px; padding:12px 14px; border-radius:14px; border:1px solid rgba(147,197,253,.3); background:linear-gradient(135deg,rgba(37,99,235,.35),rgba(124,58,237,.3)); color:#fff; font:inherit; text-align:left; cursor:pointer; }
.wb-due b { display:block; font-size:14px; }
.wb-due small { font-size:11.5px; color:rgba(255,255,255,.65); }
.wb-go { margin-left:auto; font-size:12.5px; font-weight:800; background:#2563eb; padding:8px 13px; border-radius:10px; }
.wb-seg { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin:14px 0 9px; }
.wb-seg button { font:inherit; padding:9px 0; border-radius:12px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#cbd5e1; font-size:12.5px; font-weight:700; cursor:pointer; }
.wb-seg button small { display:block; font-size:10.5px; color:rgba(255,255,255,.45); font-weight:600; min-height:13px; }
.wb-seg button.on { background:rgba(16,185,129,.2); border-color:rgba(52,211,153,.55); color:#fff; }
.wb-chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin:0 0 10px; padding-bottom:2px; }
.wb-chips::-webkit-scrollbar { display:none; }
.wb-chips button { flex-shrink:0; font:inherit; font-size:12px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#cbd5e1; cursor:pointer; }
.wb-chips button.on { background:rgba(124,58,237,.35); border-color:rgba(167,139,250,.6); color:#fff; }
.wb-chips button small { font-size:11px; opacity:.55; margin-left:2px; }
.wb-w { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:13px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); margin-bottom:6px; }
.wb-w .ko { font-family:'Noto Sans KR',sans-serif; font-size:17px; font-weight:700; color:#fff; min-width:72px; }
.wb-w .m { flex:1; min-width:0; }
.wb-w .m b { display:block; font-size:13px; color:#e2e8f0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wb-w .m small { font-size:11px; color:rgba(255,255,255,.45); }
.ib { flex-shrink:0; width:34px; height:34px; border-radius:10px; border:0; background:rgba(255,255,255,.07); color:#93c5fd; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.ib.sv { color:#fde68a; background:rgba(250,204,21,.14); }
.wb-more { display:block; width:100%; margin-top:8px; padding:11px; border-radius:12px; border:1px dashed rgba(255,255,255,.2); background:none; color:#cbd5e1; font:inherit; font-weight:700; cursor:pointer; }
.wb-empty { text-align:center; color:rgba(255,255,255,.55); font-size:13px; padding:30px 0; }
.wb-src { margin-top:26px; font-size:11px; color:rgba(255,255,255,.4); line-height:1.5; }
.wb-src a { color:rgba(147,197,253,.8); }
/* The Daily Mission / First Journey chips are not shown on this page (they
   covered the dock), so the dock spans the width. */
.wb-dock { position:fixed; left:12px; right:12px; bottom:calc(84px + env(safe-area-inset-bottom)); display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:7px; z-index:40; }
.wb-dock button { display:flex; align-items:center; justify-content:center; gap:6px; padding:12px 6px; border-radius:13px; border:1px solid rgba(255,255,255,.12); background:#1e293b; color:#fff; font:inherit; font-size:12.5px; font-weight:800; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,.3); }
.wb-dock button.p { background:linear-gradient(135deg,#2563eb,#7c3aed); border:0; }
@media (min-width:900px) { .wb-dock { left:50%; right:auto; transform:translateX(-50%); width:min(728px, calc(100% - 180px)); bottom:22px; } }
/* Room under the last row / footer Subscribe for the dock (+ tab bar on phones). */
body:has(#wb-dock) #kh-footer > footer { padding-bottom:calc(170px + env(safe-area-inset-bottom, 0px)) !important; }
@media (min-width:900px) { body:has(#wb-dock) #kh-footer > footer { padding-bottom:96px !important; } }
/* Hangul */
.wb-hg { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin:4px 0 12px; }
.wb-hg button { aspect-ratio:1/1.05; border-radius:12px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09); display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'Noto Sans KR',sans-serif; font-size:22px; font-weight:800; color:#fff; cursor:pointer; }
.wb-hg button small { font-family:'DM Sans',sans-serif; font-size:10.5px; color:rgba(255,255,255,.5); font-weight:600; }
.wb-hg button.on { background:rgba(124,58,237,.35); border-color:rgba(167,139,250,.6); }
@media (min-width:640px) { .wb-hg { grid-template-columns:repeat(7,minmax(0,1fr)); } }
.wb-k { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#7dd3fc; margin:14px 0 6px; font-weight:700; }
.wb-ex { display:flex; align-items:center; gap:8px; width:100%; padding:12px 14px; border-radius:13px; background:rgba(124,58,237,.18); border:1px solid rgba(167,139,250,.4); color:#e2e8f0; font:inherit; font-size:13px; text-align:left; cursor:pointer; }
.wb-ex b { font-family:'Noto Sans KR',sans-serif; font-size:17px; color:#fff; }
.wb-hint { font-size:12.5px; color:rgba(255,255,255,.55); margin-top:10px; }
.wb-hint a { color:#93c5fd; }
/* Drill overlay */
.wb-ov { position:fixed; inset:0; z-index:9000; background:linear-gradient(180deg,#0d1b3d,#0a1631); overflow-y:auto; font-family:'DM Sans','Noto Sans KR',sans-serif; color:#e2e8f0; }
.wb-ov-in { position:relative; max-width:520px; margin:0 auto; padding:58px 18px 40px; }
.wb-x { position:absolute; top:14px; right:14px; width:36px; height:36px; border-radius:50%; border:0; background:rgba(255,255,255,.08); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.wb-qk { font-size:11.5px; color:rgba(255,255,255,.5); display:flex; justify-content:space-between; }
.wb-prog { height:5px; border-radius:9px; background:rgba(255,255,255,.1); margin:6px 0 4px; }
.wb-prog i { display:block; height:100%; border-radius:9px; background:#34d399; transition:width .2s; }
.wb-card { display:flex; flex-direction:column; align-items:center; gap:6px; width:100%; margin:20px 0 14px; padding:30px 16px; border-radius:20px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#e2e8f0; font:inherit; text-align:center; cursor:pointer; min-height:180px; justify-content:center; }
.wb-card.static { cursor:default; }
.wb-card .big { font-family:'Noto Sans KR',sans-serif; font-size:40px; font-weight:900; color:#fff; }
.wb-card .big.sm { font-size:24px; }
.wb-card .big.xl { font-size:64px; }
.wb-card .rom { font-size:13px; color:rgba(255,255,255,.5); }
.wb-card .tap { font-size:12px; color:#93c5fd; margin-top:8px; }
.wb-card .en { font-size:17px; color:#fff; font-weight:700; }
.wb-card .ex, .wb-note .ex { display:block; font-family:'Noto Sans KR',sans-serif; font-size:13.5px; color:rgba(255,255,255,.7); margin-top:8px; line-height:1.6; }
.wb-say { margin-top:6px; display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:12px; color:#93c5fd; background:none; border:1px solid rgba(147,197,253,.35); padding:6px 12px; border-radius:999px; cursor:pointer; }
.wb-spk { display:flex; align-items:center; justify-content:center; width:92px; height:92px; margin:28px auto 8px; border-radius:50%; border:0; background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; box-shadow:0 0 0 12px rgba(99,102,241,.15); cursor:pointer; }
.wb-spk .kh-ui-icon { width:32px; height:32px; }
.wb-slow { display:block; margin:0 auto 18px; font:inherit; font-size:12.5px; color:#93c5fd; background:none; border:0; cursor:pointer; }
.wb-opts { display:flex; flex-direction:column; gap:8px; }
.wb-g2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
.wb-opt { padding:14px; border-radius:13px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#e2e8f0; font:inherit; font-size:14.5px; text-align:left; cursor:pointer; }
.wb-g2 .wb-opt { text-align:center; font-family:'Noto Sans KR',sans-serif; font-size:18px; font-weight:700; }
.wb-opt.ok { background:rgba(16,185,129,.18); border-color:rgba(52,211,153,.6); color:#fff; }
.wb-opt.no { background:rgba(239,68,68,.12); border-color:rgba(248,113,113,.45); color:#fecaca; }
.wb-note { margin-top:12px; padding:12px; border-radius:12px; background:rgba(255,255,255,.04); font-size:13px; color:rgba(255,255,255,.75); line-height:1.5; }
.wb-note b { color:#fff; font-family:'Noto Sans KR',sans-serif; }
.wb-next { display:block; width:100%; margin-top:14px; padding:13px; border-radius:13px; border:0; background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; font:inherit; font-size:14px; font-weight:800; cursor:pointer; }
.wb-actions { display:flex; gap:8px; margin-top:14px; }
.wb-actions > * { flex:1; margin-top:0; }
.wb-ghost { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:12px; border-radius:13px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.05); color:#fff; font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
.wb-done { text-align:center; padding:20px 0 6px; }
.wb-done b { display:block; font-size:40px; color:#fff; }
.wb-done small { font-size:13px; color:rgba(255,255,255,.55); }
</style>
