
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KoreHan Learn</title>

<style>
body{
font-family:Arial, sans-serif;
background:#f4f6fb;
margin:0;
padding:40px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
color:#1a3a6b;
margin-top:0;
}

.card{
background:#eef3ff;
padding:16px;
border-radius:10px;
margin-top:20px;
}

.sentence{
font-size:18px;
font-weight:bold;
}

.translation{
color:#555;
margin-top:6px;
}

button{
margin-top:15px;
padding:10px 18px;
border:none;
border-radius:8px;
background:#2a5db4;
color:white;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>KoreHan Learn</h1>

<div class="card">
<div class="sentence">시험이 끝나서 이제 마음이 놓여요.</div>
<div class="translation">Now that the exam is over, I feel relieved.</div>
<button>Listen</button>
</div>

<div class="card">
<div class="sentence">친구가 무사히 도착해서 마음이 놓였어요.</div>
<div class="translation">I felt relieved after my friend arrived safely.</div>
<button>Listen</button>
</div>

</div>

</body>
</html>
