<!DOCTYPE html>
<html lang="en">
<head>

<title>My Phrases — KoreHani</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="korehan-shared.css?v=20260525i">
<!-- Iconify for phrase illustration fallback (same lib the Today's
     Phrase page uses). Loaded defer so it doesn't block paint; cards
     render with the gradient + emoji until iconify hydrates. -->
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" defer></script>
<style>
/* Two-font system to keep the gallery visually quiet:
   - Noto Serif KR for Korean phrases (only)
   - Source Sans 3 for every English word and every piece of UI chrome
   The previous version mixed Happy Monkey + Playfair italic + Noto
   Serif KR + system sans on the same card, which the learner flagged
   as "too many fonts to focus on study". */
.kh-myp-page,
.kh-myp-head,
.kh-myp-card,
.kh-myp-empty,
.kh-myp-sub,
.kh-myp-count,
.kh-myp-card-en,
.kh-myp-card-rom,
.kh-myp-empty-sub,
.kh-myp-empty-cta { font-family: 'Source Sans 3', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }

.kh-myp-page { padding: 24px 0; }
.kh-myp-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.kh-myp-title { font-family:'Noto Serif KR', serif; font-weight:900; font-size:clamp(22px, 4vw, 30px); color:var(--navy); margin:0; letter-spacing:-.01em; }
.kh-myp-sub { font-size:13px; color:var(--gray); margin:4px 0 0; line-height:1.5; }
.kh-myp-count { font-size:12px; color:var(--bright); font-weight:800; letter-spacing:.06em; text-transform:uppercase; }

/* ── Mini-card grid (Today's Phrase style) ──────────────────────
   3 per row on mobile, 4 on slightly wider phones, scales up on
   desktop. Each card is a small "trading card" with the phrase
   illustration on top and KO + EN underneath. */
.kh-myp-grid {
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
}
@media (min-width: 480px) { .kh-myp-grid { grid-template-columns: repeat(4, 1fr); gap:12px; } }
@media (min-width: 720px) { .kh-myp-grid { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 960px) { .kh-myp-grid { grid-template-columns: repeat(6, 1fr); } }

.kh-myp-card {
  display:flex; flex-direction:column;
  background:var(--white); border:1px solid var(--border); border-radius:14px;
  overflow:hidden; box-shadow:var(--shadow);
  text-decoration:none; color:inherit;
  transition: box-shadow .15s, transform .12s, border-color .15s;
  position:relative;
}
.kh-myp-card:hover { border-color: var(--bright); box-shadow:0 10px 26px rgba(34,85,164,.14); transform:translateY(-2px); }

/* Illustration tile — square, gradient base so it never looks empty
   even when the phrase entry has no image. The .kh-myp-card-img
   layer paints the entry.image (pixel art) on top when present;
   .kh-myp-card-emoji is the fallback. */
.kh-myp-card-illus {
  position:relative; width:100%; aspect-ratio:1/1;
  background:linear-gradient(135deg,#e6efff 0%,#d6e6ff 100%);
  overflow:hidden;
}
.kh-myp-card-img {
  position:absolute; inset:0; background-size:cover; background-position:center;
  image-rendering: pixelated;
}
.kh-myp-card-emoji {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:clamp(34px, 7vw, 56px); line-height:1;
}
.kh-myp-card-iconify {
  position:absolute; inset:14% 14%; display:flex; align-items:center; justify-content:center;
}
.kh-myp-card-iconify iconify-icon { width:100%; height:100%; }

.kh-myp-card-body { padding:10px 10px 12px; display:flex; flex-direction:column; gap:4px; }
.kh-myp-card-ko {
  font-family:'Noto Serif KR', serif; font-weight:900;
  font-size:clamp(13px, 2.6vw, 15px); color:var(--navy);
  line-height:1.25; margin:0; word-break:keep-all;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.kh-myp-card-en {
  font-size:clamp(10px, 2.1vw, 12px); font-weight:600; color:var(--accent);
  line-height:1.35; margin:0;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.kh-myp-card-rom { display:none; }

.kh-myp-remove {
  position:absolute; top:6px; right:6px;
  width:22px; height:22px; border-radius:50%;
  background:rgba(15,23,42,.55); color:#fff;
  border:none; cursor:pointer; font-size:13px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .15s, background .15s;
  backdrop-filter: blur(4px);
}
.kh-myp-card:hover .kh-myp-remove,
.kh-myp-card:focus-within .kh-myp-remove { opacity:1; }
.kh-myp-remove:hover { background:#dc2626; }
/* Always show the × on touch devices — hover doesn't exist there. */
@media (hover: none) {
  .kh-myp-remove { opacity:.85; }
}

.kh-myp-empty {
  text-align:center; padding:80px 20px;
  background:var(--white); border:1px dashed var(--border); border-radius:14px;
  color:var(--gray);
}
.kh-myp-empty-icon { font-size:42px; margin-bottom:10px; }
.kh-myp-empty-title { font-family:'Noto Serif KR', serif; font-weight:900; color:var(--navy); font-size:18px; margin-bottom:6px; }
.kh-myp-empty-sub { font-size:13px; line-height:1.6; }
.kh-myp-empty-cta {
  display:inline-block; margin-top:18px; padding:11px 22px;
  background:var(--accent); color:#fff; border-radius:10px;
  text-decoration:none; font-weight:800; font-size:13px;
}
.kh-myp-empty-cta:hover { background:var(--bright); }
</style>
</head>
<body>
<div id="kh-header"></div>
<div class="container">
  <div class="kh-myp-page">
    <div class="kh-myp-head">
      <div>
        <h1 class="kh-myp-title">My Phrases</h1>
        <p class="kh-myp-sub">Phrases you've bookmarked from Today's Phrase. Tap any card to open the full reader.</p>
      </div>
      <div class="kh-myp-count" id="kh-myp-count"></div>
    </div>
    <div id="kh-myp-root"></div>
  </div>
</div>
<div id="kh-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/features/bookmarks.js?v=20260502a"></script>
<script src="js/features/comments.js?v=20260503c"></script>
<script src="js/features/sidebar.js?v=20260502a"></script>

<script>
// My Phrases — gallery of phrases the user has saved from the
// phrase reader's "Add to My Phrases" CTA. Saved entries live in
// localStorage under kh_saved_phrases_v1 (same key the phrase
// reader writes). Click a card → open the full reader on that
// phrase.
var SAVED_PHRASES_KEY = 'kh_saved_phrases_v1';

function _esc(s) { return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function _getSaved() {
  try { return JSON.parse(localStorage.getItem(SAVED_PHRASES_KEY) || '[]') || []; }
  catch(_) { return []; }
}
function _setSaved(list) {
  try { localStorage.setItem(SAVED_PHRASES_KEY, JSON.stringify(list)); } catch(_) {}
}

function _formatDate(iso) {
  if (!iso) return '';
  try {
    var d = new Date(iso);
    var diffMs = Date.now() - d.getTime();
    var diffDays = Math.floor(diffMs / 86400000);
    if (diffDays === 0) return 'Saved today';
    if (diffDays === 1) return 'Saved yesterday';
    if (diffDays < 7)   return 'Saved ' + diffDays + 'd ago';
    return 'Saved ' + d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  } catch(_) { return ''; }
}

window.removeSavedPhrase = function(idx, ev) {
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  var list = _getSaved();
  if (idx < 0 || idx >= list.length) return;
  var ko = list[idx] && list[idx].ko;
  list.splice(idx, 1);
  _setSaved(list);
  // Mirror removal to DB so the next device sees it removed too.
  try {
    var sb = (typeof getSupa === 'function') ? getSupa() : null;
    var u  = (typeof supaUser !== 'undefined') ? supaUser : null;
    if (sb && u && ko) {
      sb.from('user_saved_phrases').delete()
        .eq('user_id', u.id).eq('source_type', 'phrase').eq('source_id', ko)
        .then(function(){}, function(){});
    }
  } catch(_){}
  if (typeof khTrackUser === 'function') {
    try { khTrackUser('phrase_unsaved', { ko: ko, source: 'my-phrases' }); } catch(_) {}
  }
  render();
};

// Pull DB-side saved phrases and merge into localStorage so this
// gallery shows the user's full collection, not just the entries
// saved on this device/browser. Owner-reported "db 저장하라고 그렇게
// 말했는데 또 사라져있네". Local stays the source of truth for the
// current tab; DB rows missing from local get appended.
async function _khHydrateSavedPhrasesFromDB() {
  try {
    var sb = (typeof getSupa === 'function') ? getSupa() : null;
    var u  = (typeof supaUser !== 'undefined') ? supaUser : null;
    if (!sb || !u) return false;
    var r = await sb.from('user_saved_phrases')
      .select('ko,en,created_at')
      .eq('user_id', u.id)
      .eq('source_type', 'phrase')
      .order('created_at', { ascending: false })
      .limit(200);
    if (r.error || !r.data) return false;
    var local = _getSaved();
    var seen  = Object.create(null);
    local.forEach(function (p) { if (p && p.ko) seen[p.ko] = true; });
    var merged = local.slice();
    var added = 0;
    r.data.forEach(function (row) {
      if (!row || !row.ko || seen[row.ko]) return;
      seen[row.ko] = true;
      merged.push({
        ko: row.ko, rom: '', en: row.en || '',
        saved_at: row.created_at || new Date().toISOString(),
      });
      added++;
    });
    if (added) _setSaved(merged.slice(0, 200));
    return added > 0;
  } catch(_) { return false; }
}

function render() {
  var root = document.getElementById('kh-myp-root');
  var countEl = document.getElementById('kh-myp-count');
  if (!root) return;
  var saved = _getSaved();
  if (countEl) countEl.textContent = saved.length ? saved.length + ' saved' : '';
  if (!saved.length) {
    root.innerHTML = '<div class="kh-myp-empty">'
      + '<div class="kh-myp-empty-icon" aria-hidden="true">📚</div>'
      + '<div class="kh-myp-empty-title">No saved phrases yet</div>'
      + '<div class="kh-myp-empty-sub">Open Today\'s Phrase, tap <strong>Add to My Phrases</strong>, and your collection will appear here.</div>'
      + '<a class="kh-myp-empty-cta" href="korehan-phrase.html">Open today\'s phrase →</a>'
      + '</div>';
    return;
  }
  // Try to resolve each saved entry against the live phrase queue
  // so we can include intro/translation alongside the bare ko/en/rom
  // the saved record carries. Falls back to whatever the saved
  // record had when the queue lookup misses.
  var queue = (typeof getPhrases === 'function') ? getPhrases() : [];
  var byKo = {};
  queue.forEach(function(p, i) { if (p && p.ko) byKo[p.ko.trim()] = { p: p, i: i }; });

  root.innerHTML = '<div class="kh-myp-grid">'
    + saved.map(function(s, idx) {
        var koTrim = (s.ko || '').trim();
        var hit = byKo[koTrim];
        var p = hit ? hit.p : s;
        var queueIdx = hit ? hit.i : -1;
        var href = queueIdx >= 0
          ? 'korehan-phrase.html?i=' + queueIdx
          : 'korehan-phrase.html?q=' + encodeURIComponent(koTrim);
        return '<a class="kh-myp-card" href="' + _esc(href) + '">'
          +   '<button type="button" class="kh-myp-remove" aria-label="Remove from My Phrases" onclick="removeSavedPhrase(' + idx + ', event)">×</button>'
          +   _renderIllus(p)
          +   '<div class="kh-myp-card-body">'
          +     '<div class="kh-myp-card-ko">' + _esc(p.ko || s.ko || '') + '</div>'
          +     (p.en ? '<div class="kh-myp-card-en">' + _esc(p.en) + '</div>' : '')
          +   '</div>'
          + '</a>';
      }).join('')
    + '</div>';
}

// Mini-card illustration — resolves through the shared PHRASE_ILLUS_MAP
// from js/core/phrases.js (the same registry the Today's Phrase reader
// uses) so a saved phrase carries its real pixel-art / Iconify
// illustration here, not just the emoji fallback. The phrase ko + en
// drive the regex match; we never relied on entry.image being saved
// to localStorage because the reader doesn't save it either — both
// pages now derive illustrations the same way.
function _renderIllus(entry) {
  if (!entry) return '<div class="kh-myp-card-illus"></div>';
  var illus = (typeof window.getPhraseIllusEntry === 'function')
    ? window.getPhraseIllusEntry(entry)
    : null;
  // Caller may also have passed an entry that already carries image /
  // icon / fallback directly (e.g. from the live queue) — fall back
  // to those when the registry lookup returned nothing useful.
  illus = illus || {};
  var image    = illus.image    || entry.image    || '';
  var icon     = illus.icon     || entry.icon     || '';
  var fallback = illus.fallback || entry.fallback || '✨';

  if (image) {
    var imgUrl = image + '?v=20260505l';
    return '<div class="kh-myp-card-illus">'
      +    '<div class="kh-myp-card-img" style="background-image:url(\'' + _esc(imgUrl) + '\')" role="img" aria-label="phrase illustration"></div>'
      +  '</div>';
  }
  if (icon) {
    return '<div class="kh-myp-card-illus">'
      +    '<div class="kh-myp-card-iconify"><iconify-icon icon="' + _esc(icon) + '" aria-hidden="true">' + _esc(fallback) + '</iconify-icon></div>'
      +  '</div>';
  }
  return '<div class="kh-myp-card-illus"><div class="kh-myp-card-emoji" aria-hidden="true">' + _esc(fallback) + '</div></div>';
}

document.addEventListener('DOMContentLoaded', function() {
  // Pull the latest queue from DB so card en/rom are populated even
  // if localStorage K_PHRASES is stale on this device.
  if (typeof getPhrasesAsync === 'function') {
    getPhrasesAsync({ force: true }).then(render).catch(render);
  } else {
    render();
  }
  // Then merge in any DB-side saved entries that aren't in local
  // storage yet (different device, cleared cache, etc.). Re-render
  // if new entries landed.
  _khHydrateSavedPhrasesFromDB().then(function (added) { if (added) render(); });
  document.title = 'My Phrases — KoreHani';
});
</script>
</body>
