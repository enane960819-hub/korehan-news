<style>
/* Hangul Tetris visual overhaul (PR #7AK) — neon-synth aesthetic.
   Owner: "배경이랑 카드들이랑 저거 슬라이드랑 버튼이랑 전부 게임느낌 안나
   아직도. 아니 어디 레퍼런스라도 찾아보고 하지 왜 이래 디자인이 너무 구려."
   Reference vibe: Beat Saber / Geometry Dash / synthwave —
   deep-purple-to-cyan radial backdrop, neon glow on every interactive
   element, animated paddle, subtle starfield. */
html body{margin:0!important;color:#e0f2fe!important;font-family:'Happy Monkey','Jua','DM Sans',Inter,Pretendard,sans-serif;overflow:hidden;
  background:#04060f!important;
  background-color:#04060f!important;
  background-image:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,58,237,.30), transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 80%, rgba(34,211,238,.22), transparent 60%),
    radial-gradient(ellipse 50% 40% at 10% 90%, rgba(236,72,153,.18), transparent 60%),
    linear-gradient(180deg, #04060f 0%, #0a0e22 50%, #04060f 100%) !important;
}
/* Subtle animated noise grain across the whole page — gives the static
   gradient a sense of motion even when nothing else is happening. */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 20% 30%,rgba(125,211,252,.05) 1px,transparent 1px),radial-gradient(circle at 70% 60%,rgba(167,139,250,.04) 1px,transparent 1px),radial-gradient(circle at 50% 85%,rgba(244,114,182,.04) 1px,transparent 1px);background-size:200px 200px,180px 180px,220px 220px;animation:bgDrift 18s linear infinite;opacity:.5}
@keyframes bgDrift{0%{transform:translate(0,0)}100%{transform:translate(-200px,-180px)}}
.wrap{max-width:600px;margin:0 auto;padding:12px 16px;position:relative;height:100dvh;height:100vh;display:flex;flex-direction:column;z-index:1}
@supports(height:100dvh){.wrap{height:100dvh}}
.back{display:inline-flex;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#cbd5e1;text-decoration:none;font-size:12px;font-weight:700;margin-bottom:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.game-header{display:flex;justify-content:space-between;align-items:center;padding:6px 0;flex-shrink:0}
.game-title{font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px;color:#fff;text-shadow:0 0 18px rgba(125,211,252,.5)}
/* Header stat pills — gradient + neon edge glow so they read as
   in-game HUD chips rather than flat text. */
.stat{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:linear-gradient(135deg,rgba(125,211,252,.12),rgba(167,139,250,.08));border:1px solid rgba(125,211,252,.32);box-shadow:0 0 14px rgba(125,211,252,.18),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.stat-val{color:#7dd3fc;text-shadow:0 0 10px rgba(125,211,252,.6)}

/* Target display — now shows the WHOLE WORD, with one syllable
   highlighted as the one being built. The build-progress slots show the
   current syllable's jamo state. */
.target-area{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 0 6px;flex-shrink:0;flex-wrap:wrap}
.target-word{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:160px}
/* Romanization — the player's PRIMARY clue. Large, bright, italic so it
   reads as the prompt-to-decode rather than chrome text. */
.target-rom{font-size:30px;font-weight:900;letter-spacing:.04em;color:#fff;text-shadow:0 0 22px rgba(125,211,252,.55),0 0 40px rgba(124,58,237,.25);font-family:'DM Sans','Source Sans 3',sans-serif;font-style:italic;line-height:1.1}
.target-mean{font-size:13px;font-weight:700;color:#cbd5e1;font-family:'DM Sans','Noto Sans KR',sans-serif;letter-spacing:.02em;text-shadow:0 0 12px rgba(0,0,0,.5)}
/* Syllable placeholder row. Each box represents ONE syllable in the
   target word; sized smaller than the build-progress slots since those
   are per-jamo. Each placeholder is "◯" by default and animates to the
   Korean character when revealed (timer/life loss/syllable done). */
.target-syllables{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:4px}
.ts-syl{min-width:30px;height:30px;padding:0 6px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1.5px solid rgba(125,211,252,.22);background:rgba(125,211,252,.04);font-family:'Noto Sans KR',sans-serif;font-size:18px;font-weight:900;color:rgba(255,255,255,.7);transition:color .35s ease,background .35s ease,border-color .35s ease,text-shadow .35s ease,transform .35s ease}
.ts-syl.locked{color:rgba(125,211,252,.45)}
.ts-syl.current{border-color:rgba(125,211,252,.6);background:rgba(125,211,252,.10);animation:tsPulse 1.4s ease-in-out infinite}
.ts-syl.revealed{color:#fff;text-shadow:0 0 16px rgba(125,211,252,.7);background:rgba(125,211,252,.14);border-color:rgba(125,211,252,.55)}
.ts-syl.done{color:#4ade80;text-shadow:0 0 16px rgba(74,222,128,.6);background:rgba(74,222,128,.10);border-color:rgba(74,222,128,.5);transform:scale(1.05)}
@keyframes tsPulse{0%,100%{box-shadow:0 0 0 rgba(125,211,252,0)}50%{box-shadow:0 0 14px rgba(125,211,252,.4)}}
/* Time bar — visualises per-word time pressure. Fill drains from 100%
   to 0%; colour shifts from cyan → amber → red as it crosses the
   urgent threshold (≤35%). */
.target-timebar{width:100%;max-width:200px;height:4px;border-radius:999px;background:rgba(255,255,255,.05);overflow:hidden;margin-top:6px}
.target-timebar-fill{height:100%;width:100%;background:linear-gradient(90deg,#22d3ee,#7dd3fc);transition:width .25s linear,background .35s ease;border-radius:999px}
.target-timebar-fill.urgent{background:linear-gradient(90deg,#f59e0b,#ef4444);box-shadow:0 0 14px rgba(239,68,68,.5)}
@keyframes targetPop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.build-progress{display:flex;gap:6px;align-items:center;font-size:22px;font-weight:900;font-family:'Noto Sans KR',sans-serif}
.bp-slot{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:2px solid rgba(125,211,252,.3);color:#7dd3fc;font-size:20px;transition:all .2s}
.bp-slot.filled{background:rgba(125,211,252,.18);border-color:#7dd3fc;color:#fff}
.bp-slot.empty{color:rgba(255,255,255,.2)}
.bp-slot.empty.current{border-color:#7dd3fc;background:rgba(125,211,252,.08);animation:bpPulse 1.1s ease-in-out infinite}
@keyframes bpPulse{0%,100%{box-shadow:0 0 0 rgba(125,211,252,0)}50%{box-shadow:0 0 16px rgba(125,211,252,.45)}}

/* Canvas — deep gradient backdrop + neon edge glow so the play
   field reads as a game arena rather than a flat rectangle. */
#game-canvas{flex:1;width:100%;border-radius:14px;background:linear-gradient(180deg,#08081a 0%,#0d0a26 40%,#0a081e 100%);border:1px solid rgba(125,211,252,.22);box-shadow:0 0 32px rgba(125,211,252,.18),inset 0 0 60px rgba(124,58,237,.08)}

/* Touch controls — gradient + glow, distinct from header chips so the
   tap targets feel pressable. */
.touch-controls{display:none;padding:10px 0 6px;gap:12px;flex-shrink:0}
.touch-btn{flex:1;padding:16px;border:1px solid rgba(125,211,252,.32);border-radius:16px;background:linear-gradient(180deg,rgba(125,211,252,.10),rgba(124,58,237,.10));color:#7dd3fc;font-size:22px;font-weight:900;cursor:pointer;text-align:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;box-shadow:0 4px 18px rgba(125,211,252,.18),inset 0 1px 0 rgba(255,255,255,.08);text-shadow:0 0 12px rgba(125,211,252,.6);transition:transform .08s ease,box-shadow .15s ease,background .15s ease}
.touch-btn:active{transform:scale(.95);background:linear-gradient(180deg,rgba(125,211,252,.32),rgba(124,58,237,.22));border-color:#7dd3fc;box-shadow:0 0 28px rgba(125,211,252,.5),inset 0 0 14px rgba(125,211,252,.25)}
@media(max-width:768px){.touch-controls{display:flex}}

/* Screens — gradient backdrop matching the game backdrop so the
   start / end overlays feel part of the same world. */
.start-screen,.end-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 60% at 50% 30%,rgba(124,58,237,.25),transparent 70%),rgba(4,6,15,.95);z-index:10;border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.big-btn{padding:16px 42px;border:none;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed,#ec4899);background-size:200% 200%;color:#fff;font-size:18px;font-weight:900;cursor:pointer;font-family:inherit;margin-top:20px;box-shadow:0 8px 32px rgba(124,58,237,.45),0 0 28px rgba(125,211,252,.3);transition:transform .15s,background-position .6s ease;text-shadow:0 0 14px rgba(255,255,255,.45);letter-spacing:.02em;animation:bigBtnShimmer 4s ease-in-out infinite}
.big-btn:hover{transform:scale(1.05);background-position:100% 0}
@keyframes bigBtnShimmer{0%,100%{background-position:0% 0}50%{background-position:100% 0}}

/* Combo flash */
.combo-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:42px;font-weight:900;color:#fbbf24;text-shadow:0 0 40px rgba(251,191,36,.5);pointer-events:none;animation:comboIn .7s ease forwards;z-index:20}
@keyframes comboIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}

@media(max-width:500px){
  .game-title{font-size:15px}
  .target-rom{font-size:24px}
  .target-mean{font-size:11px}
  .ts-syl{min-width:26px;height:26px;font-size:15px;padding:0 5px}
  .bp-slot{width:30px;height:30px;font-size:17px}
  .target-area{gap:12px;padding:6px 0}
  .target-word{min-width:130px}
}
#kh-daily-mission,#vocab-admin-bar,.mobile-bottom-nav,.mobile-sticky-study,#kh-header,#kh-footer{display:none!important}
</style>

  <div class="game-header">
    <div class="game-title" style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;color:#7dd3fc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg></span>Hangul Tetris</div>
    <div style="display:flex;gap:6px">
      <div class="stat">Score <span class="stat-val" id="g-score">0</span></div>
      <div class="stat">Lv <span class="stat-val" id="g-level">1</span></div>
      <div class="stat">&hearts; <span class="stat-val" id="g-lives">5</span></div>
    </div>
  </div>

  <!-- Target area, redesigned in PR #7AM:
       - The Korean word is no longer shown by default. Player sees the
         English meaning + romanization + a row of syllable placeholders
         (one per syllable) and has to DEDUCE which jamo to catch.
       - Each placeholder reveals its Korean character only when the
         syllable is completed, OR when the per-word time bar dips into
         the urgent zone, OR when the player loses a life on this word.
       - Build slots for the CURRENT syllable show "?" until a jamo is
         caught (then they reveal what was caught). No more pre-display
         of the answer jamo. -->
  <div class="target-area">
    <div class="target-word">
      <!-- target-rom is the PRIMARY hint — large romanization with
           subtle glow. target-mean is the English meaning below. -->
      <div class="target-rom" id="target-rom">···</div>
      <div class="target-mean" id="target-mean"></div>
      <!-- target-syllables is the row of one-box-per-syllable Korean
           placeholders. Each box stays "◯" until revealed. -->
      <div class="target-syllables" id="target-syllables"></div>
      <!-- target-timebar is the per-word time pressure indicator. The
           fill drains as the word ages out; tint shifts to amber/red
           in the urgent zone. -->
      <div class="target-timebar"><div class="target-timebar-fill" id="target-timebar-fill"></div></div>
    </div>
    <div class="build-progress" id="build-progress">
      <div class="bp-slot empty" id="bp-0">?</div>
      <div class="bp-slot empty" id="bp-1">?</div>
      <div class="bp-slot empty" id="bp-2">?</div>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <div class="touch-controls">
    <div class="touch-btn" id="btn-left">◀</div>
    <div class="touch-btn" id="btn-right">▶</div>
  </div>

  <div class="start-screen" id="start-screen">
    <a href="korehan-fun.html" class="back" style="position:absolute;top:16px;left:16px">&larr; Playground</a>
    <div style="margin-bottom:16px;display:flex;align-items:center;justify-content:center"><span style="display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;color:#7dd3fc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg></span></div>
    <div style="font-size:26px;font-weight:900;margin-bottom:8px">Hangul Tetris</div>
    <div style="font-size:14px;color:#94a3b8;max-width:320px;text-align:center;line-height:1.6">Catch jamo blocks to build words! Complete each syllable in order (chosung → jungseong → jongseong), and finish the whole word for a bonus score.</div>
    <div style="font-size:12px;color:#64748b;margin-top:10px">← → or touch to move</div>
    <button class="big-btn" onclick="startGame()">START</button>
  </div>

  <div class="end-screen" id="end-screen" style="display:none">
    <div style="margin-bottom:16px;display:flex;align-items:center;justify-content:center" id="end-emoji"><span style="display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;color:#fbbf24"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a2 2 0 0 0 3 3.5"/><path d="M17 6h3a2 2 0 0 1-3 3.5"/><path d="M9 14h6l-1 4h-4z"/><path d="M8 21h8"/></svg></span></div>
    <div style="font-size:26px;font-weight:900;margin-bottom:4px">Game Over</div>
    <div style="font-size:38px;font-weight:900;color:#7dd3fc;margin:8px 0" id="end-score">0</div>
    <div style="font-size:14px;color:#94a3b8;margin-bottom:4px" id="end-stats"></div>
    <div style="font-size:13px;color:#64748b" id="end-best"></div>
    <button class="big-btn" onclick="startGame()">PLAY AGAIN</button>
  </div>
</div>

<script>
(function(){
  var CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  // Two jung lists: SIMPLE_JUNG is what the player can catch as a falling
  // block (no diphthongs that aren't typed as a single key), JUNG_FULL is
  // the standard 21-slot table the unicode decomposition uses.
  var SIMPLE_JUNG = ['ㅏ','ㅐ','ㅑ','ㅓ','ㅔ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'];
  var JUNG_FULL = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  // Standard 28-slot jongseong table (index 0 = no batchim). The previous
  // 15-slot table silently mapped every batchim to the wrong jamo — '한'
  // (jong index 4) was asking the player to catch ㄹ instead of ㄴ.
  var JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  // Simple jongseong only (no compounds like ㄳ, ㄵ, ㄻ, ㅄ, …) — used for
  // both the spawn pool and to avoid picking targets we can't catch with
  // a single block. Compounds need decomposing first.
  var SIMPLE_JONG = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

  function decompose(ch) {
    var code = ch.charCodeAt(0) - 0xAC00;
    if (code < 0 || code > 11171) return null;
    var cho = Math.floor(code / 588);
    var jung = Math.floor((code % 588) / 28);
    var jong = code % 28;
    return { cho: CHO[cho], jung: JUNG_FULL[jung], jong: JONG[jong] || '' };
  }

  // Game now plays WORDS, not isolated syllables — the player builds an
  // entire 2- or 3-syllable word by catching the right jamo for each
  // syllable in turn. Each entry: {ko, en}. The fallback list is small
  // and skews simple so any syllable is buildable from a single jamo.
  var _FALLBACK_WORDS_EASY = [
    {ko:'사랑',en:'love'},{ko:'바다',en:'sea'},{ko:'하루',en:'a day'},
    {ko:'나라',en:'country'},{ko:'다리',en:'leg / bridge'},{ko:'머리',en:'head / hair'},
    {ko:'노래',en:'song'},{ko:'고기',en:'meat'},{ko:'아기',en:'baby'},
    {ko:'어머니',en:'mother'},{ko:'아버지',en:'father'},{ko:'친구',en:'friend'}
  ];
  var _FALLBACK_WORDS_MED = [
    {ko:'한국',en:'Korea'},{ko:'학교',en:'school'},{ko:'음악',en:'music'},
    {ko:'영화',en:'movie'},{ko:'식당',en:'restaurant'},{ko:'주말',en:'weekend'},
    {ko:'시장',en:'market'},{ko:'공원',en:'park'},{ko:'강아지',en:'dog'},
    {ko:'고양이',en:'cat'},{ko:'친구들',en:'friends'},{ko:'선생님',en:'teacher'}
  ];
  var _FALLBACK_WORDS_HARD = [
    {ko:'도서관',en:'library'},{ko:'박물관',en:'museum'},{ko:'동물원',en:'zoo'},
    {ko:'운동장',en:'sports field'},{ko:'경찰관',en:'police officer'},
    {ko:'할머니',en:'grandmother'},{ko:'할아버지',en:'grandfather'},
    {ko:'생일선물',en:'birthday gift'},{ko:'한국말',en:'Korean (language)'},
    {ko:'겨울방학',en:'winter break'},{ko:'주말여행',en:'weekend trip'}
  ];
  var WORDS_EASY = _FALLBACK_WORDS_EASY.slice();
  var WORDS_MED  = _FALLBACK_WORDS_MED.slice();
  var WORDS_HARD = _FALLBACK_WORDS_HARD.slice();

  // Extract individual Hangul syllables from a Korean word string
  function _extractSyllables(word) {
    var syllables = [];
    for (var i = 0; i < word.length; i++) {
      var code = word.charCodeAt(i);
      if (code >= 0xAC00 && code <= 0xD7A3) syllables.push(word[i]);
    }
    return syllables;
  }

  // PR #7AM Revised-Romanization tables. Only cho/jung/jong values the
  // game can actually feature appear here — diphthongs and compound
  // finals are filtered out by `_wordIsBuildable` before a word reaches
  // the play pool. Slight liberties for player-friendliness:
  //   - ㅇ at chosung is silent (omit from output).
  //   - ㄹ chosung romanizes to 'r' (Revised) rather than 'l'.
  //   - All jong consonants use their pronunciation-stop forms (ㄱ→k,
  //     ㅂ→p, etc.) since that's what the player would sound out.
  var _ROM_CHO = {'ㄱ':'g','ㄲ':'kk','ㄴ':'n','ㄷ':'d','ㄸ':'tt','ㄹ':'r','ㅁ':'m','ㅂ':'b','ㅃ':'pp','ㅅ':'s','ㅆ':'ss','ㅇ':'','ㅈ':'j','ㅉ':'jj','ㅊ':'ch','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'h'};
  var _ROM_JUNG = {'ㅏ':'a','ㅐ':'ae','ㅑ':'ya','ㅒ':'yae','ㅓ':'eo','ㅔ':'e','ㅕ':'yeo','ㅖ':'ye','ㅗ':'o','ㅘ':'wa','ㅙ':'wae','ㅚ':'oe','ㅛ':'yo','ㅜ':'u','ㅝ':'wo','ㅞ':'we','ㅟ':'wi','ㅠ':'yu','ㅡ':'eu','ㅢ':'ui','ㅣ':'i'};
  var _ROM_JONG = {'ㄱ':'k','ㄲ':'k','ㄴ':'n','ㄷ':'t','ㄹ':'l','ㅁ':'m','ㅂ':'p','ㅅ':'t','ㅆ':'t','ㅇ':'ng','ㅈ':'t','ㅊ':'t','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'h'};
  function _romSyllable(syl) {
    var d = decompose(syl);
    if (!d) return '';
    var s = (_ROM_CHO[d.cho] || '') + (_ROM_JUNG[d.jung] || '');
    if (d.jong) s += (_ROM_JONG[d.jong] || '');
    // ㅇ chosung followed by a vowel produces empty string + vowel — fine,
    // but if the whole syllable started with ㅇ and result begins with a
    // vowel the joining via '-' still reads naturally.
    return s;
  }
  function _romWord(syls) {
    if (!syls || !syls.length) return '';
    return syls.map(_romSyllable).join('-');
  }

  // Skip diphthongs (ㅘ/ㅙ/ㅚ/ㅝ/ㅞ/ㅟ/ㅢ/ㅒ/ㅖ) and compound finals so we
  // can always catch every syllable with a single falling block.
  var _SIMPLE_JUNG_SET = {'ㅏ':1,'ㅐ':1,'ㅑ':1,'ㅓ':1,'ㅔ':1,'ㅕ':1,'ㅗ':1,'ㅛ':1,'ㅜ':1,'ㅠ':1,'ㅡ':1,'ㅣ':1};
  var _SIMPLE_JONG_SET = {'':1,'ㄱ':1,'ㄴ':1,'ㄷ':1,'ㄹ':1,'ㅁ':1,'ㅂ':1,'ㅅ':1,'ㅇ':1,'ㅈ':1,'ㅊ':1,'ㅋ':1,'ㅌ':1,'ㅍ':1,'ㅎ':1};
  function _wordIsBuildable(word) {
    if (!word || !word.ko) return false;
    var syls = _extractSyllables(word.ko);
    if (!syls.length) return false;
    for (var i = 0; i < syls.length; i++) {
      var d = decompose(syls[i]);
      if (!d) return false;
      if (!_SIMPLE_JUNG_SET[d.jung]) return false;
      if (!_SIMPLE_JONG_SET[d.jong || '']) return false;
    }
    return true;
  }

  // Detect whether a syllable has a 받침 (final consonant)
  function _hasBatchim(ch) {
    var code = ch.charCodeAt(0) - 0xAC00;
    return code >= 0 && (code % 28) !== 0;
  }

  // Detect whether a syllable has a complex 받침 (code % 28 maps to a compound jongseong)
  // Compound jongseong indices: 3(ㄳ),5(ㄵ),6(ㄶ),9(ㄺ),10(ㄻ),11(ㄼ),12(ㄽ),13(ㄾ),14(ㄿ),15(ㅀ),18(ㅄ)
  var _COMPOUND_JONG = {3:1,5:1,6:1,9:1,10:1,11:1,12:1,13:1,14:1,15:1,18:1};
  function _hasComplexBatchim(ch) {
    var code = ch.charCodeAt(0) - 0xAC00;
    if (code < 0) return false;
    return !!_COMPOUND_JONG[code % 28];
  }

  // Load live vocabulary as WORDS (kept whole, not split into syllables).
  // Difficulty bucket = syllable count: 1-2 / 3 / 4+. We also drop any
  // word that contains a syllable we can't catch with a single jamo
  // (compound batchim or diphthong jung) so the round is always winnable.
  (async function loadTetrisVocabFromDB() {
    try {
      var sb = typeof getSupa === 'function' ? getSupa() : null;
      if (!sb) return;
      var result = await sb.from('vocabulary_bank')
        .select('word_ko,word_en,level')
        .eq('is_active', true)
        .limit(400);
      if (result.error || !result.data || !result.data.length) return;

      var seenKo = {};
      var easy = [], med = [], hard = [];
      result.data.forEach(function(r) {
        if (!r.word_ko || !r.word_en) return;
        var ko = String(r.word_ko).trim();
        if (!ko || seenKo[ko]) return;
        seenKo[ko] = 1;
        var word = { ko: ko, en: String(r.word_en).trim() };
        if (!_wordIsBuildable(word)) return;
        var sylCount = _extractSyllables(ko).length;
        if (sylCount === 0) return;
        if (sylCount <= 2)      easy.push(word);
        else if (sylCount === 3) med.push(word);
        else                    hard.push(word);
      });

      if (easy.length >= 6) WORDS_EASY = easy;
      if (med.length  >= 6) WORDS_MED  = med;
      if (hard.length >= 4) WORDS_HARD = hard;
    } catch(e) { /* silently fall back to hardcoded */ }
  })();

  var canvas, ctx;
  var blocks = [];
  var paddle = { x: 0, w: 80 };
  var score = 0, lives = 5, level = 1, completed = 0;
  var gameRunning = false, animFrame;
  var currentWord = null, currentWordSyls = [], currentSylIdx = 0;
  var currentTarget = null, targetParts = [], buildIdx = 0;
  var baseSpeed = 1.2, spawnInterval = 1700, lastSpawn = 0;
  var bestScore = parseInt(localStorage.getItem('kh_hangul_tetris_best') || '0');
  // Game-feel state (PR #7U):
  //   popups[] — floating "+N" score numbers that drift up + fade out
  //              on correct catches and syllable bonuses
  //   shakeMs  — countdown timer (ms) for the canvas-wrapper shake
  //              effect on a wrong catch; non-zero values bias the
  //              render-time translate by a small random offset
  var popups = [];
  var shakeMs = 0;
  // PR #7AK visual overhaul state.
  // stars[] — canvas-rendered twinkling starfield. Each star has its
  //   own slow drift speed + brightness oscillation. Initialised lazily
  //   on first render once we know canvas size.
  // bgPulse — float in [0,1]. Spikes to 1 on every correct catch and
  //   decays exponentially. Drives a subtle bloom on the canvas
  //   background so the field "breathes" with successful play.
  // paddleGlowDir — -1/0/+1 mirrors the player's last movement so the
  //   paddle's directional glow biases toward the trailing edge for a
  //   sense of motion.
  var stars = [];
  var bgPulse = 0;
  var paddleGlowDir = 0;
  // PR #7AM hide-the-answer state:
  //   wordStartTime  — Date.now() snapshot when pickWord() ran.
  //   wordTimeLimit  — total ms the player gets to complete the word.
  //                    Scales with syllable count (longer words → more
  //                    time, but still under pressure).
  //   revealedSyls   — Set of syllable indices whose Korean character
  //                    has been revealed to the player. Once revealed,
  //                    sticky for the rest of the word; reset on
  //                    pickWord(). Sources of reveal: time bar dipping
  //                    into the urgent zone, a wrong catch on the
  //                    current syllable, or losing a life.
  var wordStartTime = 0;
  var wordTimeLimit = 0;
  var revealedSyls = Object.create(null);

  function init() {
    canvas = document.getElementById('game-canvas');
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    document.addEventListener('keydown', function(e) {
      if (!gameRunning) return;
      if (e.key === 'ArrowLeft')  { paddle.x = Math.max(0, paddle.x - 40); paddleGlowDir = -1; }
      if (e.key === 'ArrowRight') { paddle.x = Math.min(canvas._w - paddle.w, paddle.x + 40); paddleGlowDir = 1; }
    });
    var holdL = null, holdR = null;
    function moveL(){ paddle.x = Math.max(0, paddle.x - 6); paddleGlowDir = -1; }
    function moveR(){ paddle.x = Math.min(canvas._w - paddle.w, paddle.x + 6); paddleGlowDir = 1; }
    function clearL(){ if (holdL) { clearInterval(holdL); holdL = null; } }
    function clearR(){ if (holdR) { clearInterval(holdR); holdR = null; } }
    var btnL = document.getElementById('btn-left');
    var btnR = document.getElementById('btn-right');
    btnL.addEventListener('touchstart', function(e){ e.preventDefault(); clearL(); holdL = setInterval(moveL, 45); moveL(); }, {passive:false});
    btnL.addEventListener('touchend', clearL);
    btnL.addEventListener('touchcancel', clearL);
    btnR.addEventListener('touchstart', function(e){ e.preventDefault(); clearR(); holdR = setInterval(moveR, 45); moveR(); }, {passive:false});
    btnR.addEventListener('touchend', clearR);
    btnR.addEventListener('touchcancel', clearR);
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    canvas._w = rect.width;
    canvas._h = rect.height;
    paddle.x = (rect.width - paddle.w) / 2;
  }

  // Pick a NEW word, then start on its first syllable. Words are pulled
  // from the bucket matching current level (easy/med/hard).
  function pickWord() {
    var pool = level <= 3 ? WORDS_EASY : level <= 7 ? WORDS_MED : WORDS_HARD;
    if (!pool || !pool.length) pool = WORDS_EASY.length ? WORDS_EASY : _FALLBACK_WORDS_EASY;
    var pick;
    for (var t = 0; t < 8; t++) {
      pick = pool[Math.floor(Math.random() * pool.length)];
      if (!pick || (currentWord && currentWord.ko === pick.ko && pool.length > 1)) continue;
      break;
    }
    currentWord = pick || pool[0];
    currentWordSyls = _extractSyllables(currentWord.ko);
    currentSylIdx = 0;
    // PR #7AM: reset per-word reveal state and start the time bar.
    revealedSyls = Object.create(null);
    wordStartTime = Date.now();
    // Time budget: 9s per syllable + 4s baseline. Scales DOWN at higher
    // levels so the player feels time pressure ramp up alongside speed.
    var perSyl = Math.max(5500, 9000 - (level - 1) * 400);
    wordTimeLimit = 4000 + perSyl * currentWordSyls.length;
    startSyllable();
  }

  // Start work on the syllable at currentSylIdx within currentWord. Each
  // syllable becomes the existing build flow (cho → jung → optional jong).
  function startSyllable() {
    if (currentSylIdx >= currentWordSyls.length) {
      // Word is done — handled by the caller (handleMatch).
      return;
    }
    var ch = currentWordSyls[currentSylIdx];
    var d = decompose(ch);
    // Should never fail because pool words went through _wordIsBuildable.
    if (!d) {
      currentSylIdx++;
      startSyllable();
      return;
    }
    currentTarget = ch;
    targetParts = [d.cho, d.jung];
    if (d.jong) targetParts.push(d.jong);
    buildIdx = 0;
    updateTargetUI();
    // PR #7AP: kick a spawn IMMEDIATELY when the new phase / syllable
    // starts. Without this, `lastSpawn` was set on the previous wave
    // (often <100ms ago) so the next phase had to wait up to a full
    // `spawnInterval` (1700ms) before any block appeared. Owner felt
    // it as "한글자 나오고 다음 글자 안 내려와" — one letter and then
    // dead time. Resetting `lastSpawn` to a value old enough to trip
    // the spawn condition immediately on the next loop tick (rather
    // than calling spawnBlock() directly here, which would race with
    // any in-flight stale-fade cleanup).
    lastSpawn = 0;
  }

  // PR #7AM: target UI no longer reveals the Korean word or the
  // expected jamo for each slot. The player sees the romanization +
  // English meaning + per-syllable placeholders (showing "?" until
  // each syllable is revealed or completed). They MUST decode the
  // sound → Korean mapping themselves. Build slots show "?" until a
  // jamo is caught; only then do they reveal what was caught.
  function updateTargetUI() {
    // Romanization — the player's primary clue.
    var romEl = document.getElementById('target-rom');
    if (romEl) romEl.textContent = (currentWordSyls && currentWordSyls.length) ? _romWord(currentWordSyls) : '···';

    // English meaning subtitle.
    var meanEl = document.getElementById('target-mean');
    if (meanEl) meanEl.textContent = (currentWord && currentWord.en) ? currentWord.en : '';

    // Per-syllable placeholder row. Each placeholder shows the Korean
    // character when:
    //   - that syllable is already completed (.done),
    //   - that syllable is current AND has been revealed (timer ran
    //     into the urgent zone, a wrong catch happened, or a life
    //     was lost on this word),
    //   - that syllable is locked AND its index is in revealedSyls
    //     (currently no path sets this for non-current locked syls,
    //     but the check stays general for forward-compat).
    var sylEl = document.getElementById('target-syllables');
    if (sylEl) {
      var html = '';
      for (var s = 0; s < currentWordSyls.length; s++) {
        var ch = currentWordSyls[s];
        var isDone = s < currentSylIdx;
        var isCurrent = s === currentSylIdx;
        var isRevealed = isDone || revealedSyls[s];
        var cls = 'ts-syl';
        if (isDone) cls += ' done';
        else if (isCurrent) cls += isRevealed ? ' current revealed' : ' current';
        else cls += isRevealed ? ' revealed' : ' locked';
        var content = isRevealed ? ch : '?';
        html += '<span class="' + cls + '">' + content + '</span>';
      }
      sylEl.innerHTML = html;
    }

    // Build slots for the CURRENT syllable. The owner explicitly called
    // out that pre-showing the answer jamo (the old "?" rows secretly
    // hinting via slot order + count) was too easy — this version shows
    // ONLY "?" for uncaught slots, and reveals what the player caught
    // ONCE they catch it. Slot count = current syllable's jamo count.
    for (var i = 0; i < 3; i++) {
      var el = document.getElementById('bp-' + i);
      if (!el) continue;
      if (i < targetParts.length) {
        if (i < buildIdx) {
          el.textContent = targetParts[i];
          el.className = 'bp-slot filled';
        } else if (i === buildIdx) {
          el.textContent = '?';
          el.className = 'bp-slot empty current';
        } else {
          el.textContent = '?';
          el.className = 'bp-slot empty';
        }
        el.style.display = 'flex';
      } else {
        el.style.display = i < 2 ? 'flex' : 'none';
      }
    }
  }

  // PR #7AM helper: force-reveal the current syllable's Korean
  // character. Triggered by wrong catches, life loss, and the time-bar
  // urgent-zone threshold. Sticky for the rest of the word — once
  // revealed it stays revealed.
  function _revealCurrentSyllable() {
    if (currentSylIdx >= 0 && currentSylIdx < currentWordSyls.length) {
      if (!revealedSyls[currentSylIdx]) {
        revealedSyls[currentSylIdx] = true;
        updateTargetUI();
      }
    }
  }

  function spawnBlock() {
    var needed = targetParts[buildIdx];
    if (needed === undefined || needed === null) return; // No more parts to build
    // PR #7AM: more variety per wave — owner: "다양하게 떨궈야지 무슨소리야."
    // Each wave now spawns the correct jamo + 2-4 distinct distractors.
    // Combined with the stale-fade logic, multiple recent waves'
    // distractors persist on screen briefly, so the player sees a busy
    // mix of jamo at any moment rather than the same letter repeated.
    var minCount = 3;
    var maxCount = Math.min(5, 3 + Math.floor(level / 3));
    var count = minCount + Math.floor(Math.random() * (maxCount - minCount + 1));
    var jamos = [needed];
    // `phaseClass` is the jamo CLASS this block belongs to. Persisting
    // blocks whose class doesn't match the current build slot will fade
    // out via the staleness logic in update().
    var phaseClass = buildIdx === 0 ? 'cho' : buildIdx === 1 ? 'jung' : 'jong';
    var allJamo = buildIdx === 0 ? CHO : buildIdx === 1 ? SIMPLE_JUNG : SIMPLE_JONG;
    while (jamos.length < count) {
      var rj = allJamo[Math.floor(Math.random() * allJamo.length)];
      if (jamos.indexOf(rj) < 0) jamos.push(rj);
    }
    jamos.sort(function(){ return Math.random() - .5; });
    var lanes = jamos.length;
    var laneW = canvas._w / lanes;
    jamos.forEach(function(j, i) {
      var jitterX = (Math.random() - 0.5) * laneW * 0.5;
      var x = laneW * i + (laneW - 44) / 2 + jitterX;
      x = Math.max(4, Math.min(canvas._w - 48, x));
      blocks.push({
        jamo: j,
        phaseClass: phaseClass,     // class this block was spawned for
        spawnSyl: currentSylIdx,    // which syllable index spawned it
        isCorrect: j === needed,
        staleMs: 0,                 // ms since the block became wrong-class
        x: x,
        y: -30 - Math.random() * 80,
        w: 44, h: 44,
        speed: baseSpeed * (0.75 + Math.random() * 0.6)
      });
    });
  }

  window.startGame = function() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('end-screen').style.display = 'none';
    blocks = [];
    popups = [];
    shakeMs = 0;
    // PR #7AK: don't wipe stars[] — they're decoration only and
    // re-running startGame() shouldn't blink the starfield off.
    bgPulse = 0;
    paddleGlowDir = 0;
    score = 0; lives = 5; level = 1; completed = 0;
    baseSpeed = 1.2; spawnInterval = 1700; lastSpawn = 0;
    gameRunning = true;
    currentWord = null;
    updateUI();
    pickWord();
    if (animFrame) cancelAnimationFrame(animFrame);
    lastSpawn = performance.now();
    loop(performance.now());
  };

  // Spawn pacing now jitters by ±25% so wave timing isn't on a fixed beat.
  function _nextSpawnDelay() {
    return spawnInterval * (0.75 + Math.random() * 0.5);
  }
  var _currentSpawnDelay = 1700;

  function loop(now) {
    if (!gameRunning) return;
    animFrame = requestAnimationFrame(loop);
    if (now - lastSpawn > _currentSpawnDelay && blocks.length < 8) {
      spawnBlock();
      lastSpawn = now;
      _currentSpawnDelay = _nextSpawnDelay();
    }
    update();
    render();
  }

  function update() {
    var h = canvas._h;
    var px = paddle.x, pw = paddle.w, py = h - 20;
    for (var i = blocks.length - 1; i >= 0; i--) {
      var b = blocks[i];
      b.y += b.speed;
      // Check paddle collision
      if (b.y + b.h >= py && b.y + b.h <= py + 20 && b.x + b.w > px && b.x < px + pw) {
        blocks.splice(i, 1);
        // Re-evaluate correctness at CATCH time against the CURRENT needed
        // jamo. Previously blocks were stamped with `b.isCorrect` at spawn
        // time and the whole field got nuked between syllables to keep
        // that flag honest — which is the "글자 초기화" bug the owner
        // flagged. Now blocks persist across syllable boundaries and
        // their correctness is decided live: same jamo as the current
        // build slot wins; anything else is a wrong catch (regardless
        // of whether it was spawned as a correct-for-old-syllable or
        // distractor block).
        var correctNow = (b.jamo === targetParts[buildIdx]);
        if (correctNow) {
          // Correct catch — jamo locks in.
          buildIdx++;
          score += 10;
          // Spike the background pulse so a clean catch makes the whole
          // arena flash subtly — Beat-Saber-style reward signal.
          bgPulse = 1;
          // Floating "+10" popup so the catch has weight.
          popups.push({ x: b.x + b.w/2, y: b.y, text: '+10', life: 0, color: '#7dd3fc' });
          updateTargetUI();
          if (buildIdx >= targetParts.length) {
            // Syllable complete — bonus, then move on to next syllable
            // OR finish the whole word if this was the last syllable.
            score += 50;
            popups.push({ x: w/2, y: 60, text: '+50', life: 0, color: '#a78bfa' });
            completed++;
            var targetEl = document.getElementById('target-char');
            if (targetEl) targetEl.className = 'target-char done';
            currentSylIdx++;
            var wordDone = currentSylIdx >= currentWordSyls.length;
            if (wordDone) {
              // Whole word completed — extra word bonus + flash the word.
              var wordBonus = 80 + currentWordSyls.length * 30;
              score += wordBonus;
              var fl = document.createElement('div');
              fl.className = 'combo-flash';
              fl.innerHTML = escapeHTML(currentWord.ko) + ' ' + khSvg('sparkle', {size:36, color:'#a78bfa', marginRight:6}) + '+' + wordBonus;
              document.body.appendChild(fl);
              setTimeout(function(){ fl.remove(); }, 800);
              // Word boundary IS a celebration moment — flash + clear is OK
              // here. Just on syllable boundaries we keep blocks falling.
              blocks = [];
              if (completed % 4 === 0) {
                level++;
                baseSpeed = Math.min(3, 1.2 + level * 0.2);
                spawnInterval = Math.max(800, 1700 - level * 90);
              }
              updateUI();
              setTimeout(function(){ pickWord(); }, 700);
            } else {
              // Mid-word — DO NOT clear falling blocks. They keep coming
              // and get re-evaluated against the new targetParts[buildIdx]
              // by the live-correctness check above. Snappier transition
              // (200ms vs the old 350ms) so the rhythm doesn't feel
              // paused between syllables.
              updateUI();
              setTimeout(function(){ startSyllable(); }, 200);
            }
          }
        } else {
          // Wrong catch — life lost + shake + reveal the current
          // syllable's Korean as a hint so the player can recover.
          lives--;
          shakeMs = 220;
          _revealCurrentSyllable();
          updateUI();
          if (lives <= 0) endGame();
        }
        continue;
      }
      // Fell off screen
      if (b.y > h + 20) {
        blocks.splice(i, 1);
      }
    }
    // Tick popups (life is just a counter of update frames, ~60/s).
    // 36 frames ≈ 600ms before they fade out.
    for (var pi = popups.length - 1; pi >= 0; pi--) {
      popups[pi].life++;
      popups[pi].y -= 1.2;
      if (popups[pi].life > 36) popups.splice(pi, 1);
    }
    // PR #7AK staleness fix: blocks whose phaseClass no longer matches
    // the current build slot get a fade-out timer. Once it expires the
    // block is removed even if it hasn't hit the bottom. This stops
    // the field accumulating wrong-class jamo (the "ㅈㄴ 대충" complaint —
    // user sees CHO consonants still falling while they're trying to
    // catch a JUNG vowel). Persistence within the SAME phase is preserved
    // — only cross-phase blocks fade.
    var currentClass = buildIdx === 0 ? 'cho' : buildIdx === 1 ? 'jung' : 'jong';
    for (var si = blocks.length - 1; si >= 0; si--) {
      var sb = blocks[si];
      if (sb.phaseClass && sb.phaseClass !== currentClass) {
        sb.staleMs += 16;
        // 800ms fade-out window — long enough that an in-flight block
        // about to be caught isn't yanked away suddenly, short enough
        // that the arena clears visibly between phases.
        if (sb.staleMs > 800) blocks.splice(si, 1);
      } else if (sb.staleMs > 0) {
        // Edge case: a block's class became "stale" then the player
        // back-stepped a phase somehow (currently impossible, but be
        // safe). Reset the fade timer if class matches again.
        sb.staleMs = 0;
      }
    }
    // bgPulse exponential decay — catch spikes it to 1, every frame
    // multiplies by ~0.94 so it bleeds out over ~30 frames (~500ms).
    if (bgPulse > 0) bgPulse = Math.max(0, bgPulse * 0.94 - 0.005);
    // PR #7AM: update the per-word time bar + auto-reveal Korean of
    // the current syllable when the bar dips below 35% (urgent zone).
    if (currentWord && wordTimeLimit > 0) {
      var elapsed = Date.now() - wordStartTime;
      var remain = Math.max(0, 1 - elapsed / wordTimeLimit);
      var tbFill = document.getElementById('target-timebar-fill');
      if (tbFill) {
        tbFill.style.width = (remain * 100).toFixed(1) + '%';
        if (remain <= 0.35) tbFill.classList.add('urgent');
        else tbFill.classList.remove('urgent');
      }
      // Auto-reveal current syllable when urgent threshold hits, and
      // again when time fully expires (reveal as gentle assist before
      // the player just runs the clock down for free).
      if (remain <= 0.35 && currentSylIdx < currentWordSyls.length && !revealedSyls[currentSylIdx]) {
        _revealCurrentSyllable();
      }
    }
    // paddleGlowDir decays toward 0 so the directional bias fades when
    // the player stops moving.
    if (paddleGlowDir !== 0) {
      paddleGlowDir = paddleGlowDir * 0.85;
      if (Math.abs(paddleGlowDir) < 0.05) paddleGlowDir = 0;
    }
    // Tick starfield drift — each star moves slowly downward and twinkles.
    for (var st = 0; st < stars.length; st++) {
      var s = stars[st];
      s.y += s.spd;
      if (s.y > canvas._h) { s.y = -4; s.x = Math.random() * canvas._w; }
      s.tw += s.twSpd;
    }
    // Tick shake timer (assume ~16ms per update frame).
    if (shakeMs > 0) shakeMs = Math.max(0, shakeMs - 16);
  }

  function render() {
    var w = canvas._w, h = canvas._h;
    ctx.clearRect(0, 0, w, h);
    // Lazy-init starfield once the canvas has real dimensions.
    if (!stars.length && w > 0 && h > 0) {
      for (var sn = 0; sn < 70; sn++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: 0.4 + Math.random() * 1.4,
          spd: 0.08 + Math.random() * 0.32,
          tw: Math.random() * Math.PI * 2,
          twSpd: 0.02 + Math.random() * 0.04,
          hue: Math.random() < 0.7 ? 200 + Math.random() * 40 : 280 + Math.random() * 40
        });
      }
    }
    // Shake on wrong-catch — same as before.
    var shakeX = 0, shakeY = 0;
    if (shakeMs > 0) {
      var mag = (shakeMs / 220) * 6;
      shakeX = (Math.random() - 0.5) * mag * 2;
      shakeY = (Math.random() - 0.5) * mag * 2;
      ctx.save();
      ctx.translate(shakeX, shakeY);
    }
    // Background bloom — radial gradient from the centre, intensity
    // modulated by bgPulse so correct catches make the arena breathe.
    var grad = ctx.createRadialGradient(w/2, h*0.55, 0, w/2, h*0.55, Math.max(w, h) * 0.7);
    var bloomStrength = 0.05 + bgPulse * 0.18;
    grad.addColorStop(0, 'rgba(125,211,252,' + bloomStrength + ')');
    grad.addColorStop(0.55, 'rgba(124,58,237,' + (bloomStrength * 0.5) + ')');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    // Starfield — sparse, slowly drifting downward, each star
    // independently twinkling via its tw phase.
    stars.forEach(function(s) {
      var twAmp = 0.55 + 0.45 * Math.sin(s.tw);
      ctx.fillStyle = 'hsla(' + s.hue + ',80%,75%,' + (0.35 * twAmp) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * twAmp, 0, Math.PI * 2);
      ctx.fill();
    });
    // Horizontal scan lines — much fainter than the previous grid,
    // arcade-monitor vibe rather than spreadsheet grid.
    ctx.strokeStyle = 'rgba(125,211,252,0.04)';
    ctx.lineWidth = 1;
    for (var gy = 0; gy < h; gy += 56) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
    }
    // Paddle — gradient body + directional glow that biases toward the
    // trailing edge of the player's last move. Wider hit-area indicator
    // (the brighter inner gradient extends slightly beyond the paddle
    // body so the player gets a generous visual reference).
    var py = h - 22;
    var pw = paddle.w, px = paddle.x;
    var dirShift = paddleGlowDir * 18; // shift glow center opposite movement
    var paddleGrad = ctx.createLinearGradient(px - 12, py, px + pw + 12, py);
    paddleGrad.addColorStop(0, paddleGlowDir < 0 ? 'rgba(125,211,252,.7)' : 'rgba(125,211,252,.15)');
    paddleGrad.addColorStop(0.5, 'rgba(125,211,252,.5)');
    paddleGrad.addColorStop(1, paddleGlowDir > 0 ? 'rgba(125,211,252,.7)' : 'rgba(125,211,252,.15)');
    // Drop shadow / glow under the paddle.
    ctx.save();
    ctx.shadowColor = 'rgba(125,211,252,.55)';
    ctx.shadowBlur = 24;
    ctx.fillStyle = paddleGrad;
    ctx.beginPath();
    ctx.roundRect(px, py, pw, 14, 7);
    ctx.fill();
    ctx.restore();
    // Bright top edge — gives the paddle a neon-strip top surface that
    // reads as the "rail" the jamo slide into.
    var topGrad = ctx.createLinearGradient(px, py - 1, px, py + 4);
    topGrad.addColorStop(0, 'rgba(255,255,255,.7)');
    topGrad.addColorStop(1, 'rgba(125,211,252,0)');
    ctx.fillStyle = topGrad;
    ctx.fillRect(px + 4 + dirShift * 0.4, py, pw - 8, 5);
    // Outline
    ctx.strokeStyle = '#7dd3fc';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(px, py, pw, 14, 7);
    ctx.stroke();
    // Blocks. PR #7AM: removed the live-correct highlight.
    // Owner: "떨어지는 자모 카드들 정답을 하이라이트 해주지 말라고."
    // ALL blocks now render with the SAME neon-cyan gradient — the
    // player has to recognise the correct jamo themselves from the
    // romanization clue. Stale-class blocks still fade out per the
    // staleness logic so phase transitions stay clean.
    blocks.forEach(function(b) {
      ctx.save();
      var staleFade = b.staleMs > 0 ? Math.max(0, 1 - b.staleMs / 800) : 1;
      ctx.globalAlpha = staleFade;
      // Drop shadow — neon cyan for every block, fade with staleness.
      ctx.shadowColor = 'rgba(125,211,252,.5)';
      ctx.shadowBlur = 16;
      // Body — uniform gradient fill so no block looks more correct.
      var bg = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
      bg.addColorStop(0, 'rgba(125,211,252,.22)');
      bg.addColorStop(1, 'rgba(56,189,248,.34)');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, b.h, 12);
      ctx.fill();
      ctx.shadowBlur = 0;
      // Border — same colour and thickness for every block.
      ctx.strokeStyle = 'rgba(125,211,252,.55)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // Inner top-edge highlight stroke for the 3D rim — applied to
      // every block so they all read with the same depth.
      ctx.strokeStyle = 'rgba(255,255,255,.28)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(b.x + 6, b.y + 1.5);
      ctx.lineTo(b.x + b.w - 6, b.y + 1.5);
      ctx.stroke();
      // Jamo glyph — bright white text on every block.
      ctx.font = 'bold 24px "Noto Sans KR", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(125,211,252,.55)';
      ctx.shadowBlur = 8;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.jamo, b.x + b.w/2, b.y + b.h/2);
      ctx.restore();
    });
    // Score popups (drift up + fade)
    popups.forEach(function(p) {
      var alpha = Math.max(0, 1 - p.life / 36);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color || '#7dd3fc';
      ctx.font = 'bold 18px "Source Sans 3", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    });
    if (shakeMs > 0) ctx.restore();
  }

  function updateUI() {
    document.getElementById('g-score').textContent = score;
    document.getElementById('g-level').textContent = level;
    document.getElementById('g-lives').textContent = lives;
  }

  function endGame() {
    gameRunning = false;
    if (animFrame) cancelAnimationFrame(animFrame);
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('kh_hangul_tetris_best', String(bestScore));
    }
    if (window.playgroundScores) playgroundScores.submit('hangul-tetris', score, { wordsCleared: typeof wordsCleared !== 'undefined' ? wordsCleared : null, level: typeof level !== 'undefined' ? level : null });
    var iconHtml = score >= 500
      ? khSvg('trophy', {size:64, color:'#fbbf24'})
      : score >= 200
        ? khSvg('star', {size:64, color:'#fbbf24'})
        : score >= 100
          ? khSvg('thumbs_up', {size:64, color:'#7dd3fc'})
          : khSvg('sparkle', {size:64, color:'#a78bfa'});
    document.getElementById('end-emoji').innerHTML = iconHtml;
    document.getElementById('end-score').textContent = score + ' pts';
    document.getElementById('end-stats').textContent = completed + ' syllables · level ' + level;
    document.getElementById('end-best').textContent = 'Best: ' + bestScore + ' pts';
    document.getElementById('end-screen').style.display = 'flex';
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
