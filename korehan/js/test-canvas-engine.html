<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHCanvas Engine Test</title>
<style>
body { background: #0b1626; color: #fff; font-family: sans-serif; padding: 20px; }
h2 { font-size: 16px; margin: 20px 0 8px; color: #7ab8f5; }
.test-box { position: relative; width: 400px; height: 300px; background: #1a2a44; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); overflow: hidden; }
canvas { display: block; }
button { padding: 8px 16px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 700; cursor: pointer; margin: 4px; }
button:hover { background: #3b82f6; }
.log { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 4px; }
.pass { color: #4ade80; }
.fail { color: #f87171; }
</style>
</head>
<body>

<h1>KHCanvas Engine — Unit Tests</h1>

<!-- Test 1: DPR -->
<h2>1. DPR Setup</h2>
<canvas id="test-dpr" style="border:1px solid rgba(255,255,255,.2);border-radius:8px"></canvas>
<div class="log" id="log-dpr"></div>

<!-- Test 2: AnimLoop -->
<h2>2. AnimLoop</h2>
<div class="log" id="log-anim"></div>
<button onclick="testAnimStop()">Stop AnimLoop Test</button>

<!-- Test 3: Particle -->
<h2>3. Particle System</h2>
<div class="test-box" id="particle-box">
  <canvas id="test-particles"></canvas>
</div>
<button onclick="testPreset('GOLD_BURST')">Gold Burst</button>
<button onclick="testPreset('COMBO_FIRE')">Combo Fire</button>
<button onclick="testPreset('CELEBRATION')">Celebration</button>
<button onclick="testPreset('MASTERY')">Mastery</button>
<button onclick="testPreset('SPARKLE')">Sparkle</button>
<button onclick="testPreset('WRONG')">Wrong</button>
<button onclick="testTrail()">Trail Effect</button>
<button onclick="testBurstAtEl()">Burst at Element</button>
<div class="log" id="log-particle"></div>

<!-- Test 4: Ring -->
<h2>4. Progress Ring</h2>
<div style="display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap">
  <div>
    <div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:4px">Vocab (0%)</div>
    <canvas id="test-ring1"></canvas>
  </div>
  <div>
    <div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:4px">Grammar (0%)</div>
    <canvas id="test-ring2"></canvas>
  </div>
  <div>
    <div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:4px">Large + text</div>
    <canvas id="test-ring3"></canvas>
  </div>
</div>
<button onclick="testRingProgress()">Progress +25%</button>
<button onclick="testRingComplete()">Set 100%</button>
<button onclick="testRingReset()">Reset 0%</button>
<div class="log" id="log-ring"></div>

<!-- Test 5: Gauge (Timer) -->
<h2>5. Timer Gauge</h2>
<div style="display:flex;gap:20px;align-items:flex-end">
  <canvas id="test-gauge1"></canvas>
  <canvas id="test-gauge2"></canvas>
</div>
<button onclick="testGaugeStart()">Start 10s</button>
<button onclick="testGaugePause()">Pause</button>
<button onclick="testGaugeResume()">Resume</button>
<button onclick="testGaugeReset()">Reset</button>
<div class="log" id="log-gauge"></div>

<!-- Test 6: Overlay -->
<h2>6. Overlay on DOM Element</h2>
<div class="test-box" id="overlay-box" style="display:flex;align-items:center;justify-content:center;">
  <span style="font-size:24px;font-weight:900;">Click anywhere in this box</span>
</div>
<div class="log" id="log-overlay"></div>

<script src="kh-canvas-engine.js"></script>
<script>
// ── Test 1: DPR ──
(function() {
  var canvas = document.getElementById('test-dpr');
  var ctx = KHCanvas.DPR.setup(canvas, 300, 60);
  var log = document.getElementById('log-dpr');

  if (!ctx) { log.innerHTML = '<span class="fail">FAIL: ctx is null</span>'; return; }

  var dpr = KHCanvas.DPR.ratio();
  var ok = canvas.width === 300 * dpr && canvas.height === 60 * dpr;
  log.innerHTML = '<span class="' + (ok ? 'pass' : 'fail') + '">' +
    (ok ? 'PASS' : 'FAIL') + ': canvas=' + canvas.width + 'x' + canvas.height +
    ' (CSS 300x60, DPR=' + dpr + ')</span>';

  // Draw test text
  ctx.fillStyle = '#4ade80';
  ctx.font = '700 18px sans-serif';
  ctx.fillText('DPR=' + dpr + ' — Crisp text rendering', 10, 35);
})();

// ── Test 2: AnimLoop ──
var _animFrames = 0;
var _animLog = document.getElementById('log-anim');

KHCanvas.AnimLoop.register('test-anim', function(dt) {
  _animFrames++;
  if (_animFrames <= 5 || _animFrames % 60 === 0) {
    _animLog.innerHTML = '<span class="pass">AnimLoop running: frame ' + _animFrames + ', dt=' + dt.toFixed(4) + 's, callbacks=' + KHCanvas.AnimLoop.count() + '</span>';
  }
});

function testAnimStop() {
  KHCanvas.AnimLoop.unregister('test-anim');
  _animLog.innerHTML += '<br><span class="pass">Stopped. Final frame: ' + _animFrames + ', remaining callbacks: ' + KHCanvas.AnimLoop.count() + '</span>';
}

// ── Test 3: Particles ──
var _pCanvas = document.getElementById('test-particles');
var _pCtx = KHCanvas.DPR.setup(_pCanvas, 400, 300);
var _ps = new KHCanvas.ParticleSystem(_pCanvas);
var _pLog = document.getElementById('log-particle');

function testPreset(name) {
  var x = 80 + Math.random() * 240;
  var y = 60 + Math.random() * 180;
  _ps.burstAt(x, y, name, 35);
  _pLog.innerHTML = '<span class="pass">' + name + ' at (' + Math.round(x) + ',' + Math.round(y) + '). Active: ' + _ps.particles.length + '</span>';
}

function testTrail() {
  _ps.trail({ x: 200, y: 280, duration: 1.2, rate: 6, preset: 'COMBO_FIRE' });
  _pLog.innerHTML = '<span class="pass">COMBO_FIRE trail at bottom center for 1.2s</span>';
}

function testBurstAtEl() {
  var btn = document.querySelector('button');
  _ps.burstAtElement(btn, 'SPARKLE', 20);
  _pLog.innerHTML = '<span class="pass">SPARKLE burst at first button element</span>';
}

// ── Test 4: Ring ──
var _ringProgress = 0;
var _ring1 = new KHCanvas.Ring(document.getElementById('test-ring1'), {
  radius: 28, lineWidth: 6, colors: ['#38bdf8','#2563eb'], showText: true
});
var _ring2 = new KHCanvas.Ring(document.getElementById('test-ring2'), {
  radius: 28, lineWidth: 6, colors: ['#fbbf24','#f59e0b'],
  completeColors: ['#34d399','#22c55e'], showText: true
});
var _ring3 = new KHCanvas.Ring(document.getElementById('test-ring3'), {
  radius: 40, lineWidth: 8, showText: true
});
_ring3.setText('0/5');
var _rLog = document.getElementById('log-ring');

function testRingProgress() {
  _ringProgress = Math.min(1, _ringProgress + 0.25);
  _ring1.setProgress(_ringProgress);
  _ring2.setProgress(_ringProgress);
  _ring3.setProgress(_ringProgress);
  _ring3.setText(Math.round(_ringProgress * 5) + '/5');
  _rLog.innerHTML = '<span class="pass">Progress: ' + Math.round(_ringProgress * 100) + '%</span>';
}
function testRingComplete() {
  _ringProgress = 1;
  _ring1.setProgress(1, 'complete');
  _ring2.setProgress(1, 'complete');
  _ring3.setProgress(1, 'complete');
  _ring3.setText('5/5');
  _rLog.innerHTML = '<span class="pass">Complete! Green mode.</span>';
}
function testRingReset() {
  _ringProgress = 0;
  _ring1.setProgress(0);
  _ring2.setProgress(0);
  _ring3.setProgress(0);
  _ring3.setText('0/5');
  _rLog.innerHTML = '<span class="pass">Reset to 0%</span>';
}

// ── Test 5: Gauge ──
var _gauge1 = new KHCanvas.Gauge(document.getElementById('test-gauge1'), {
  radius: 40, lineWidth: 8, duration: 10
});
var _gauge2 = new KHCanvas.Gauge(document.getElementById('test-gauge2'), {
  radius: 30, lineWidth: 6, duration: 5
});
var _gLog = document.getElementById('log-gauge');

function testGaugeStart() {
  _gauge1.reset(10);
  _gauge1.start(function() { _gLog.innerHTML = '<span class="fail">TIME UP! (10s gauge)</span>'; });
  _gauge2.reset(5);
  _gauge2.start(function() { _gLog.innerHTML = '<span class="fail">TIME UP! (5s gauge)</span>'; });
  _gLog.innerHTML = '<span class="pass">Gauges started: 10s and 5s</span>';
}
function testGaugePause() {
  _gauge1.pause(); _gauge2.pause();
  _gLog.innerHTML = '<span class="pass">Paused. Remaining: ' + _gauge1.getRemaining().toFixed(1) + 's / ' + _gauge2.getRemaining().toFixed(1) + 's</span>';
}
function testGaugeResume() {
  _gauge1.resume(); _gauge2.resume();
  _gLog.innerHTML = '<span class="pass">Resumed</span>';
}
function testGaugeReset() {
  _gauge1.reset(); _gauge2.reset();
  _gLog.innerHTML = '<span class="pass">Reset</span>';
}

// ── Test 6: Overlay ──
var _overlayBox = document.getElementById('overlay-box');
var _overlayData = KHCanvas.createOverlay(_overlayBox);
var _oLog = document.getElementById('log-overlay');

if (_overlayData) {
  _oLog.innerHTML = '<span class="pass">Overlay canvas created: ' + _overlayData.canvas.width + 'x' + _overlayData.canvas.height + '</span>';

  _overlayBox.addEventListener('click', function(e) {
    var rect = _overlayBox.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;
    _overlayData.ps.spawn({ x: x, y: y, count: 25 });
    _oLog.innerHTML = '<span class="pass">Burst at (' + Math.round(x) + ',' + Math.round(y) + '). Active: ' + _overlayData.ps.particles.length + '</span>';
  });
} else {
  _oLog.innerHTML = '<span class="fail">FAIL: overlay creation returned null</span>';
}
</script>
</body>
</html>
