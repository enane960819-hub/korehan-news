<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KoreHan Admin Conversation Editor</title>
<style>
body{font-family:system-ui;background:#f3f6fb;margin:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.editor{width:1200px;background:white;border-radius:20px;display:grid;grid-template-columns:1.2fr .8fr;overflow:hidden}
.left{background:#f8fbff;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#2b57d9,#5b87ff);color:white;padding:20px;font-size:26px;font-weight:800}
.chat{flex:1;padding:20px;overflow:auto}
.msg{margin:10px 0;display:flex}
.msg.right{justify-content:flex-end}
.bubble{max-width:70%;padding:12px 14px;border-radius:16px;background:white;border:1px solid #e2e8f0}
.right .bubble{background:#2563eb;color:white;border:none}
textarea{width:100%;height:160px;border-radius:12px;border:1px solid #dbe4f0;padding:10px}
.rightPanel{padding:20px}
button{background:#2563eb;color:white;border:none;padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="overlay">
  <div class="editor">
    <div class="left">
      <div class="header">Conversation Editor</div>
      <div class="chat" id="chat"></div>
      <div style="padding:20px;border-top:1px solid #e2e8f0">
        <textarea id="script" oninput="renderChat()">A: 안녕
B: 응 안녕
A: 점심 먹었어?
B: 아직 안 먹었어</textarea>
      </div>
    </div>
    <div class="rightPanel">
      <h3>AI Controls</h3>
      <button onclick="alert('AI regenerate here')">AI Update</button>
      <h3>Vocab JSON</h3>
      <textarea>[]</textarea>
      <h3>Grammar JSON</h3>
      <textarea>[]</textarea>
      <h3>Mission JSON</h3>
      <textarea>[]</textarea>
    </div>
  </div>
</div>
<script>
function renderChat(){
  const chat=document.getElementById("chat");
  chat.innerHTML="";
  const lines=document.getElementById("script").value.split("\n");
  lines.forEach(line=>{
    line=line.trim();
    if(!line)return;
    const isB=line.startsWith("B:");
    const text=line.replace(/^[AB]:/,"").trim();
    const div=document.createElement("div");
    div.className="msg "+(isB?"right":"");
    const bubble=document.createElement("div");
    bubble.className="bubble";
    bubble.innerText=text;
    div.appendChild(bubble);
    chat.appendChild(div);
  });
}
renderChat();
</script>
</body>
</html>
