/* ── Hero ───────────────────────────────────────────────────── */
.cc-hero {
  background: linear-gradient(135deg, #0b1626 0%, #1a3a6b 100%);
  padding: 44px 24px 36px; text-align: center; color: #fff;

/* ── Grid ───────────────────────────────────────────────────── */

.cc-card:hover { transform: translateY(-4px); }
.cc-card.tier-locked {

<script>
// Card collection page — shows every reporter with the current user's
// affinity status. Tier mirrors the level thresholds from the reporter
// detail page (모르는 사이 → 지인 → 친구 → 매니저). Tier 0 (locked)
// hides the portrait behind a silhouette + lock overlay so progressing
// to Tier 1 actually feels like unlocking something.

var FAV_HIRE_THRESHOLD = 3000;

function ccTier(points) {
  var p = Number(points || 0);
  if (p >= FAV_HIRE_THRESHOLD) return { key: 'platinum', label: 'Manager',     min: FAV_HIRE_THRESHOLD, max: FAV_HIRE_THRESHOLD };
  if (p >= 200)                return { key: 'gold',     label: 'Friend',       min: 200,  max: FAV_HIRE_THRESHOLD };
  if (p >= 80)                 return { key: 'silver',   label: 'Acquaintance', min: 80,   max: 200  };
  if (p >= 1)                  return { key: 'bronze',   label: 'Stranger',     min: 1,    max: 80   };
  return                              { key: 'locked',   label: 'Locked',       min: 0,    max: 1    };
}

function ccPhBg(color) {
  var c = /^#[0-9a-f]{6}$/i.test(color || '') ? color : '#475569';
  return 'radial-gradient(120% 90% at 30% 15%,' + c + '73 0%,' + c + '26 45%,#0f1b33 100%)';
}

function ccCardHTML(reporter, points) {
  var tier = ccTier(points);
  var pct;
  if (tier.key === 'platinum') {
    pct = 100;
  } else if (tier.key === 'locked') {
    pct = 0;
  } else {
    pct = Math.min(100, Math.max(4, Math.round(((points - tier.min) / (tier.max - tier.min)) * 100)));
  }

  var portrait;
  var imgSrc = reporter.image || reporter.img || '';
  // The default 1px gif placeholders and random stock photos (picsum.photos)
  // aren't the reporter — fall back to the initial.
  var hasRealImage = !!imgSrc && imgSrc.indexOf('data:image/gif;base64,R0lGODlhAQAB') !== 0 && !/picsum\.photos/i.test(imgSrc);
  if (hasRealImage) {
    portrait = '<img class="cc-img" src="' + imgSrc + '" alt="' + escapeHtml(reporter.name || '') + '" onerror="this.outerHTML=\'<div class=cc-ph style=&quot;background:' + ccPhBg(reporter.color) + '&quot;>' + escapeHtml((reporter.name || '?').slice(0, 1)) + '</div>\'">';
  } else {
    portrait = '<div class="cc-ph" style="background:' + ccPhBg(reporter.color) + '">' + escapeHtml((reporter.name || '?').slice(0, 1)) + '</div>';
  }

  var lockOverlay = '';
  if (tier.key === 'locked') {
    lockOverlay = '<div class="cc-lock-overlay">'
      + '<div class="cc-lock-icon"><i data-lucide="lock" class="kh-ui-icon kh-emo-ico" aria-hidden="true"></i></div>'
      + '<div>Affinity 1+ required</div>'
      + '<div class="cc-lock-text">Send a gift to start</div>'
      + '</div>';
  }

  var hiredRibbon = (tier.key === 'platinum')
    ? '<div class="cc-hired-ribbon">Hired</div>' : '';

  var cta;
  if (tier.key === 'locked') {
    cta = 'Unlock card';
  } else if (tier.key === 'platinum') {
    cta = 'Manager page →';
  } else {
    cta = 'Build more affinity';
  }

  var affDisplay = tier.key === 'platinum'
    ? FAV_HIRE_THRESHOLD + '+ <i data-lucide="heart" class="kh-ui-icon kh-emo-ico" aria-hidden="true"></i>'
    : (Number(points || 0) + ' <i data-lucide="heart" class="kh-ui-icon kh-emo-ico" aria-hidden="true"></i>');

  return '<a class="cc-card tier-' + tier.key + '" href="korehan-reporter.html?id=' + encodeURIComponent(reporter.id) + '">'
    + '<div class="cc-img-wrap">'
    +   portrait
    +   '<div class="cc-tier-badge">' + tier.label + '</div>'
    +   hiredRibbon
    +   lockOverlay
    + '</div>'
    + '<div class="cc-body">'
    +   '<div class="cc-name">' + escapeHtml(reporter.name || '')
    +     (typeof khReporterNameEn === 'function' && khReporterNameEn(reporter) ? ' <span class="cc-rom">' + escapeHtml(khReporterNameEn(reporter)) + '</span>' : '') + '</div>'
    +   '<div class="cc-role">' + escapeHtml((typeof khReporterRole === 'function' ? khReporterRole : String)(reporter.role || '')) + '</div>'
    +   '<div class="cc-aff-row">'
    +     '<div class="cc-aff-bar"><div class="cc-aff-fill" style="width:' + pct + '%"></div></div>'
    +     '<span class="cc-aff-num">' + affDisplay + '</span>'
    +   '</div>'
    +   '<span class="cc-cta">' + cta + '</span>'
    + '</div>'
    + '</a>';
}

function ccRender(reporters, affinityMap) {
  var grid = document.getElementById('cc-grid');
  if (!grid) return;
  // Sort: platinum > gold > silver > bronze > locked, then by points desc within tier.
  var tierOrder = { platinum: 0, gold: 1, silver: 2, bronze: 3, locked: 4 };
  var sorted = reporters.slice().sort(function(a, b) {
    var pa = Number(affinityMap[a.id] || 0);
    var pb = Number(affinityMap[b.id] || 0);
    var ta = tierOrder[ccTier(pa).key];
    var tb = tierOrder[ccTier(pb).key];
    if (ta !== tb) return ta - tb;
    return pb - pa;
  });

  grid.innerHTML = sorted.map(function(r) {
    return ccCardHTML(r, affinityMap[r.id] || 0);
  }).join('');

  // Stats
  var unlocked = 0, managers = 0;
  reporters.forEach(function(r) {
    var p = Number(affinityMap[r.id] || 0);
    if (p >= 1) unlocked++;
    if (p >= FAV_HIRE_THRESHOLD) managers++;
  });
  var unlockedEl = document.getElementById('cc-unlocked');
  var managersEl = document.getElementById('cc-managers');
  var totalEl = document.getElementById('cc-total');
  if (totalEl) totalEl.textContent = reporters.length;
  if (unlockedEl) unlockedEl.textContent = unlocked;
  if (managersEl) managersEl.textContent = managers;
}

function ccBuildReporterList() {
  // Use _KH_DEFAULT_REPORTERS_LIST since it's always available synchronously,
  // then merge any overrides KH_REPORTERS picked up from Supabase / cache.
  var list = (typeof _KH_DEFAULT_REPORTERS_LIST !== 'undefined' ? _KH_DEFAULT_REPORTERS_LIST : []).slice();
  if (typeof KH_REPORTERS === 'object' && KH_REPORTERS) {
    list = list.map(function(d) {
      var k = KH_REPORTERS[d.id] || {};
      return {
        id: d.id,
        name: k.name || d.name,
        name_en: k.name_en || '',
        role: k.role || d.role,
        color: k.color || d.color,
        image: k.img || d.image,
      };
    });
    // Reporters that exist only in the live table (not in the seed list).
    var have = {};
    list.forEach(function(r) { have[r.id] = 1; });
    Object.keys(KH_REPORTERS).forEach(function(id) {
      var k = KH_REPORTERS[id] || {};
      if (have[id] || !k.name) return;
      list.push({ id: id, name: k.name, name_en: k.name_en || '', role: k.role || '', color: k.color || '#475569', image: k.img || '' });
    });
  }
  return list;
}

async function ccLoad() {
  // Live reporter list (character_reporters) — capped so a slow query can't stall the page.
  var mapReady = (typeof _loadReportersIntoKHMap === 'function')
    ? Promise.race([_loadReportersIntoKHMap(), new Promise(function(r){ setTimeout(r, 5000); })])
    : Promise.resolve();

  // Wait for auth to land — without this the affinity batch query runs
  // with auth.uid() = null and RLS hides every row, so the page
  // misleadingly shows everything locked even when the user has gifts.
  // Bumped timeout to 8s (matches shared.js's getSession timeout); on
  // some cold tabs / slow networks 4s wasn't enough and signed-in users
  // got bounced to the sign-in screen.
  // Stop waiting as soon as the shared auth check has finished
  // (window._sessionChecked) — signed-out visitors used to sit on
  // "Loading cards…" for the full 8 s.
  if (!supaUser) {
    await new Promise(function(resolve) {
      var done = false;
      function finish() { if (done) return; done = true; resolve(); }
      window.addEventListener('kh-auth-signed-in', finish);
      var poll = setInterval(function(){ if (supaUser || window._sessionChecked) { clearInterval(poll); finish(); } }, 100);
      setTimeout(function(){ clearInterval(poll); finish(); }, 8000);
    });
  }

  // Last-resort fallback — if the global supaUser still didn't settle
  // (the auth event never fired this load), ask Supabase directly. The
  // session may already be cached locally even when the global wasn't
  // touched. This covers admin users who reported being kicked to the
  // sign-in screen despite being logged in.
  var userId = supaUser ? supaUser.id : null;
  var sb = getSupa();
  if (!userId && sb) {
    try {
      var sess = await sb.auth.getSession();
      if (sess && sess.data && sess.data.session && sess.data.session.user) {
        userId = sess.data.session.user.id;
      }
    } catch(_) {}
  }

  if (!userId) {
    var grid = document.getElementById('cc-grid');
    var totalEl0 = document.getElementById('cc-total');
    if (totalEl0) mapReady.then(function(){ totalEl0.textContent = ccBuildReporterList().length; });
    grid.innerHTML = '<div class="cc-signin" style="grid-column:1/-1">'
      + '<h2><i data-lucide="lock" class="kh-ui-icon kh-emo-ico" aria-hidden="true"></i> Login required</h2>'
      + '<p>Log in to view your card collection.</p>'
      + '<button onclick="if(typeof openAuthModal===\'function\')openAuthModal(\'signin\')">Log in</button>'
      + '</div>';
    return;
  }

  await mapReady;
  var reporters = ccBuildReporterList();

  // Single batch query for all reporters at once.
  var affinityMap = {};
  if (sb) {
    try {
      var res = await sb.from('reporter_user_affinity')
        .select('reporter_id, affinity_points')
        .eq('user_id', userId);
      if (!res.error && Array.isArray(res.data)) {
        res.data.forEach(function(r) {
          affinityMap[r.reporter_id] = Number(r.affinity_points || 0);
        });
      }
    } catch(e) { console.warn('affinity batch fetch failed', e); }
  }

  // Local fallback — if DB returned nothing for a reporter, check
  // localStorage in case the gift never settled to the DB. Picks the
  // larger of the two (defensive against either source being stale).
  reporters.forEach(function(r) {
    try {
      var localKey = 'kh_affinity_' + userId + '_' + r.id;
      var localVal = Number(localStorage.getItem(localKey) || 0);
      if (localVal > (affinityMap[r.id] || 0)) {
        affinityMap[r.id] = localVal;
      }
    } catch(_) {}
  });

  ccRender(reporters, affinityMap);

  // Track for analytics
  if (typeof khTrackUser === 'function') {
    var unlocked = reporters.filter(function(r){ return (affinityMap[r.id] || 0) >= 1; }).length;
    try { khTrackUser('cards_view', { unlocked: unlocked }); } catch(_) {}
  }
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

document.addEventListener('DOMContentLoaded', function() { ccLoad(); });
</script>
