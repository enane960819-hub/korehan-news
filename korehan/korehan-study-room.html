
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KoreHan Study Room</title>

<style>
body{
font-family:Arial, sans-serif;
background:#f4f6fb;
margin:0;
padding:40px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
color:#1a3a6b;
margin-top:0;
}

.section{
margin-top:30px;
}

.tag{
display:inline-block;
background:#e8eefc;
padding:8px 12px;
border-radius:8px;
margin:5px;
font-weight:bold;
}

textarea{
width:100%;
height:140px;
border-radius:10px;
border:1px solid #ddd;
padding:12px;
font-size:14px;
}

button{
margin-top:15px;
padding:10px 18px;
border:none;
border-radius:8px;
background:#2a5db4;
color:white;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>KoreHan Study Room</h1>

<div class="section">
<h3>Topic</h3>
<p>Describe your morning routine in Korean.</p>
</div>

<div class="section">
<h3>Must-use Vocabulary</h3>
<span class="tag">아침</span>
<span class="tag">준비하다</span>
<span class="tag">출근</span>
<span class="tag">보통</span>
</div>

<div class="section">
<h3>Must-use Grammar</h3>
<span class="tag">-고 나서</span>
<span class="tag">-기 전에</span>
<span class="tag">-아요/어요</span>
</div>

<div class="section">
<h3>Write your answer</h3>
<textarea placeholder="Write 3–5 sentences here..."></textarea>
<br>
<button>Check Writing</button>
</div>

</div>

</body>
</html>
