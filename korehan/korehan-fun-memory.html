<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Match — KoreHani Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="korehan-shared.css">
<style>
/* All game classes use the .mm- prefix because korehan-shared.css already
   defines .card / .card-grid / .card .tag for the news card grid, and
   those rules collide with this game (forced 1-column on mobile,
   overflow:hidden, etc). Renaming dodges the cascade entirely. */
body{margin:0;background:#050b15;color:#e0f2fe;font-family:'Happy Monkey','Jua','DM Sans','Noto Sans KR',Inter,Pretendard,sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at top,#0c1a36 0%,#050b15 65%);}
*,*::before,*::after{box-sizing:border-box}
.mm-wrap{max-width:860px;margin:0 auto;padding:12px 16px 40px;position:relative}
.mm-back{display:inline-flex;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#94a3b8;text-decoration:none;font-size:12px;font-weight:700;margin-bottom:8px;transition:background .15s}
.mm-back:hover{background:rgba(255,255,255,.12)}
.mm-header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 12px;flex-wrap:wrap;gap:8px}
.mm-title{font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px;color:#fff}
.mm-stats{display:flex;gap:8px;flex-wrap:wrap}
.mm-stat{font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#cbd5e1}
.mm-stat-val{color:#7dd3fc}
.mm-streak{display:none;align-items:center;gap:4px;font-size:13px;font-weight:800;padding:4px 12px;border-radius:999px;background:linear-gradient(135deg,#f59e0b,#dc2626);color:#fff;box-shadow:0 0 16px rgba(245,158,11,.4)}
.mm-streak.on{display:inline-flex;animation:streakPulse .6s ease}
@keyframes streakPulse{0%{transform:scale(.9)}50%{transform:scale(1.1)}100%{transform:scale(1)}}

/* ── Card Grid ──
   The desktop layout shows wider grids and the mobile layout drops
   one column at every difficulty so the catch-22 of "fixed aspect-
   ratio cards in a 360px viewport" doesn't blow up the card height. */
.mm-grid{display:grid;gap:10px;justify-content:center;margin:0 auto;padding:8px 0}
.mm-grid.easy{grid-template-columns:repeat(4,1fr);max-width:480px}
.mm-grid.normal{grid-template-columns:repeat(5,1fr);max-width:600px}
.mm-grid.hard{grid-template-columns:repeat(6,1fr);max-width:720px}

/* ── Card ── */
.mm-card{-webkit-perspective:600px;perspective:600px;cursor:pointer;aspect-ratio:3/4;position:relative}
.mm-card-inner{width:100%;height:100%;transition:transform .4s cubic-bezier(.4,.0,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;position:relative}
.mm-card.flipped .mm-card-inner{transform:rotateY(180deg);-webkit-transform:rotateY(180deg)}
.mm-card-front,.mm-card-back{backface-visibility:hidden;-webkit-backface-visibility:hidden;position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;font-weight:700;border:2px solid transparent;overflow:hidden}

/* face-down front — subtle pattern + numbered icon */
.mm-card-front{background:linear-gradient(145deg,#0f1e3a 0%,#162040 100%);border-color:rgba(125,211,252,.18);font-size:24px;color:rgba(125,211,252,.4)}
.mm-card-front::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(125,211,252,.04) 10px,rgba(125,211,252,.04) 20px);pointer-events:none}
.mm-card-front::after{content:'';position:absolute;inset:6px;border-radius:10px;border:1px dashed rgba(125,211,252,.15);pointer-events:none}

/* face-up back */
.mm-card-back{transform:rotateY(180deg);font-size:15px;line-height:1.3;word-break:keep-all}
.mm-card-back.ko{background:linear-gradient(145deg,#0c2461,#1a3a7a);border-color:rgba(59,130,246,.55);color:#dbeafe;font-family:'Noto Sans KR','DM Sans',sans-serif;font-size:18px;font-weight:800}
.mm-card-back.en{background:linear-gradient(145deg,#2d1066,#4c1d95);border-color:rgba(139,92,246,.55);color:#ede9fe}

/* Matched */
.mm-card.matched .mm-card-back{border-color:rgba(34,197,94,.7);box-shadow:0 0 22px rgba(34,197,94,.3)}
.mm-card.matched .mm-card-back.ko,
.mm-card.matched .mm-card-back.en{background:linear-gradient(145deg,#064e3b,#065f46);color:#a7f3d0}
.mm-card.matched{transform:scale(.94);pointer-events:none;transition:transform .3s}

/* No-match shake */
.mm-card.no-match .mm-card-back{animation:mmShake .42s ease;border-color:rgba(239,68,68,.7);box-shadow:0 0 22px rgba(239,68,68,.3)}
@keyframes mmShake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-5px)}50%{transform:rotateY(180deg) translateX(5px)}75%{transform:rotateY(180deg) translateX(-5px)}}

/* Match flash */
.mm-card.match-flash .mm-card-back{animation:mmGlow .55s ease}
@keyframes mmGlow{0%{box-shadow:0 0 0 rgba(34,197,94,0)}50%{box-shadow:0 0 36px rgba(34,197,94,.7)}100%{box-shadow:0 0 22px rgba(34,197,94,.3)}}

/* Hover */
.mm-card:not(.flipped):not(.matched):hover .mm-card-front{border-color:rgba(125,211,252,.4);background:linear-gradient(145deg,#132744,#1c2d55)}

/* ── Screens ── */
.mm-overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,11,21,.94);z-index:50;padding:20px;opacity:0;transition:opacity .35s ease;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mm-overlay.visible{opacity:1}
.mm-overlay.hidden{pointer-events:none;opacity:0}

.mm-icon{font-size:64px;margin-bottom:16px}
.mm-screen-title{font-size:28px;font-weight:900;margin-bottom:8px;color:#fff}
.mm-screen-sub{font-size:14px;color:#94a3b8;max-width:360px;text-align:center;line-height:1.6;margin-bottom:24px}

.mm-diff-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.mm-diff-btn{border:none;border-radius:14px;padding:18px 20px;cursor:pointer;font-family:inherit;text-align:left;transition:transform .15s,box-shadow .15s}
.mm-diff-btn:hover{transform:translateY(-2px)}
.mm-diff-btn .mm-db-label{font-size:16px;font-weight:800;margin-bottom:4px}
.mm-diff-btn .mm-db-desc{font-size:12px;opacity:.75;line-height:1.4}

.mm-diff-btn.easy{background:linear-gradient(135deg,#065f46,#047857);color:#a7f3d0;box-shadow:0 8px 24px rgba(4,120,87,.32)}
.mm-diff-btn.easy:hover{box-shadow:0 12px 32px rgba(4,120,87,.45)}
.mm-diff-btn.normal{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#bfdbfe;box-shadow:0 8px 24px rgba(37,99,235,.32)}
.mm-diff-btn.normal:hover{box-shadow:0 12px 32px rgba(37,99,235,.45)}
.mm-diff-btn.hard{background:linear-gradient(135deg,#581c87,#7c3aed);color:#ddd6fe;box-shadow:0 8px 24px rgba(124,58,237,.32)}
.mm-diff-btn.hard:hover{box-shadow:0 12px 32px rgba(124,58,237,.45)}

/* End screen */
.mm-end-stars{font-size:48px;margin:12px 0 8px;letter-spacing:6px}
.mm-end-stat{font-size:15px;color:#94a3b8;margin:4px 0}
.mm-end-stat strong{color:#7dd3fc}
.mm-end-best{font-size:12px;color:#64748b;margin-top:8px}
.mm-play-btn{padding:16px 40px;border:none;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:18px;font-weight:900;cursor:pointer;font-family:inherit;margin-top:24px;box-shadow:0 8px 32px rgba(37,99,235,.4);transition:transform .15s}
.mm-play-btn:hover{transform:scale(1.05)}

/* Combo flash */
.mm-combo-flash{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);font-size:42px;font-weight:900;color:#fbbf24;text-shadow:0 0 40px rgba(251,191,36,.5);pointer-events:none;animation:mmCombo .8s ease forwards;z-index:60}
@keyframes mmCombo{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-65%) scale(1)}}

/* ── Responsive ──
   Mobile drops one column per difficulty so cards stay roughly
   square-ish (aspect-ratio 3/4 in a narrow 1-col grid would make each
   card taller than the viewport — that's what the screenshot showed). */
@media(max-width:600px){
  .mm-grid{gap:8px}
  .mm-grid.easy{grid-template-columns:repeat(3,1fr);max-width:100%}
  .mm-grid.normal{grid-template-columns:repeat(4,1fr);max-width:100%}
  .mm-grid.hard{grid-template-columns:repeat(4,1fr);max-width:100%}
  .mm-card-back{font-size:13px}
  .mm-card-back.ko{font-size:15px}
  .mm-card-front{font-size:18px}
  .mm-title{font-size:16px}
  .mm-stat{font-size:11px;padding:3px 8px}
  .mm-screen-title{font-size:24px}
  .mm-combo-flash{font-size:32px}
}
@media(max-width:380px){
  .mm-grid{gap:6px}
  .mm-grid.easy{grid-template-columns:repeat(3,1fr)}
  .mm-grid.normal{grid-template-columns:repeat(4,1fr)}
  .mm-grid.hard{grid-template-columns:repeat(5,1fr)}
  .mm-card{border-radius:8px}
  .mm-card-front,.mm-card-back{border-radius:10px}
  .mm-card-back.ko{font-size:13px}
  .mm-card-back.en{font-size:11px}
}
#kh-daily-mission,#vocab-admin-bar,.mobile-bottom-nav,.mobile-sticky-study,#kh-header,#kh-footer{display:none!important}
</style>
</head>
<body>
<div class="mm-wrap">
  <a href="korehan-fun.html" class="mm-back">&larr; Playground</a>
  <div class="mm-header">
    <div class="mm-title">🃏 Memory Match</div>
    <div class="mm-stats">
      <div class="mm-streak" id="mm-streak">🔥 <span id="mm-streak-val">0</span></div>
      <div class="mm-stat">Flips <span class="mm-stat-val" id="mm-flips">0</span></div>
      <div class="mm-stat">Pairs <span class="mm-stat-val" id="mm-pairs">0/0</span></div>
      <div class="mm-stat">⏱ <span class="mm-stat-val" id="mm-timer">0:00</span></div>
    </div>
  </div>
  <div class="mm-grid" id="mm-grid"></div>
</div>

<!-- Start Screen -->
<div class="mm-overlay visible" id="mm-start-screen">
  <a href="korehan-fun.html" class="mm-back" style="position:absolute;top:16px;left:16px">&larr; Playground</a>
  <div class="mm-icon">🃏</div>
  <div class="mm-screen-title">Memory Match</div>
  <div class="mm-screen-sub">Match Korean words with their English meanings. Flip two cards at a time and find all pairs!</div>
  <div class="mm-diff-btns">
    <button class="mm-diff-btn easy" onclick="MEM.start('easy')">
      <div class="mm-db-label">Easy — 6 Pairs</div>
      <div class="mm-db-desc">12 cards · Great for beginners</div>
    </button>
    <button class="mm-diff-btn normal" onclick="MEM.start('normal')">
      <div class="mm-db-label">Normal — 10 Pairs</div>
      <div class="mm-db-desc">20 cards · A solid challenge</div>
    </button>
    <button class="mm-diff-btn hard" onclick="MEM.start('hard')">
      <div class="mm-db-label">Hard — 15 Pairs</div>
      <div class="mm-db-desc">30 cards · Test your memory!</div>
    </button>
  </div>
</div>

<!-- End Screen -->
<div class="mm-overlay hidden" id="mm-end-screen">
  <div class="mm-icon" id="mm-end-icon">🏆</div>
  <div class="mm-screen-title">Well Done!</div>
  <div class="mm-end-stars" id="mm-end-stars"></div>
  <div class="mm-end-stat">Flips: <strong id="mm-end-flips">0</strong></div>
  <div class="mm-end-stat">Time: <strong id="mm-end-time">0:00</strong></div>
  <div class="mm-end-stat">Pairs: <strong id="mm-end-pairs">0</strong></div>
  <div class="mm-end-best" id="mm-end-best"></div>
  <button class="mm-play-btn" onclick="MEM.showStart()">PLAY AGAIN</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="korehan-shared.js?v=20260426h-fbedit"></script>
<script>
var MEM = (function(){
  'use strict';

  // ── Word Pool ──
  var _FALLBACK_WORDS = [
    {ko:'사랑',en:'love'},{ko:'친구',en:'friend'},{ko:'음식',en:'food'},
    {ko:'행복',en:'happiness'},{ko:'여행',en:'travel'},{ko:'학교',en:'school'},
    {ko:'가족',en:'family'},{ko:'날씨',en:'weather'},{ko:'영화',en:'movie'},
    {ko:'음악',en:'music'},{ko:'커피',en:'coffee'},{ko:'병원',en:'hospital'},
    {ko:'회사',en:'company'},{ko:'고양이',en:'cat'},{ko:'강아지',en:'dog'},
    {ko:'바다',en:'sea'},{ko:'하늘',en:'sky'},{ko:'꽃',en:'flower'},
    {ko:'별',en:'star'},{ko:'달',en:'moon'},{ko:'책',en:'book'},
    {ko:'집',en:'house'},{ko:'돈',en:'money'},{ko:'건강',en:'health'},
    {ko:'꿈',en:'dream'},{ko:'미래',en:'future'},{ko:'노래',en:'song'},
    {ko:'춤',en:'dance'},{ko:'맛',en:'taste'},{ko:'마음',en:'heart'}
  ];
  var WORDS = _FALLBACK_WORDS.slice();

  // Load live vocabulary from DB; silently fall back to hardcoded if unavailable.
  // Pulls a much larger window (was 60) so 'hard' difficulty (15 pairs) still
  // has variety after dedupe + per-game shuffle, and dedupes by word_ko so the
  // same Korean word can't show up twice in one board.
  (async function loadVocabFromDB() {
    try {
      var sb = typeof getSupa === 'function' ? getSupa() : null;
      if (!sb) return;
      var result = await sb.from('vocabulary_bank')
        .select('word_ko,word_en')
        .eq('is_active', true)
        .limit(400);
      if (result.error || !result.data || !result.data.length) return;
      var seenKo = {};
      var seenEn = {};
      var mapped = [];
      result.data.forEach(function(r) {
        if (!r.word_ko || !r.word_en) return;
        var ko = String(r.word_ko).trim();
        var en = String(r.word_en).trim().toLowerCase();
        if (!ko || !en) return;
        if (seenKo[ko] || seenEn[en]) return; // skip duplicates either side
        seenKo[ko] = 1; seenEn[en] = 1;
        mapped.push({ ko: ko, en: r.word_en.trim() });
      });
      if (mapped.length >= 15) WORDS = mapped;
    } catch(e) { /* silently fall back to hardcoded */ }
  })();

  var DIFFICULTY = {
    easy:   { pairs: 6,  cols: 'easy' },
    normal: { pairs: 10, cols: 'normal' },
    hard:   { pairs: 15, cols: 'hard' }
  };

  var STAR_THRESHOLDS = {
    easy:   [12, 18],
    normal: [25, 35],
    hard:   [40, 55]
  };

  // ── State ──
  var cards = [];
  var firstCard = null;
  var secondCard = null;
  var lockBoard = false;
  var flips = 0;
  var matchedPairs = 0;
  var totalPairs = 0;
  var difficulty = 'easy';
  var timerInterval = null;
  var startTime = 0;
  var elapsed = 0;
  var streak = 0;

  // ── DOM refs ──
  var grid = document.getElementById('mm-grid');
  var startScreen = document.getElementById('mm-start-screen');
  var endScreen = document.getElementById('mm-end-screen');
  var elFlips = document.getElementById('mm-flips');
  var elPairs = document.getElementById('mm-pairs');
  var elTimer = document.getElementById('mm-timer');
  var elStreak = document.getElementById('mm-streak');
  var elStreakVal = document.getElementById('mm-streak-val');

  // ── Helpers ──
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function fmtTime(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updateStats() {
    elFlips.textContent = flips;
    elPairs.textContent = matchedPairs + '/' + totalPairs;
  }

  function updateStreakUI() {
    if (streak >= 2) {
      elStreak.classList.add('on');
      elStreakVal.textContent = streak;
      // Re-trigger animation
      elStreak.style.animation = 'none';
      void elStreak.offsetWidth;
      elStreak.style.animation = '';
    } else {
      elStreak.classList.remove('on');
    }
  }

  function showCombo(text) {
    var fl = document.createElement('div');
    fl.className = 'mm-combo-flash';
    fl.textContent = text;
    document.body.appendChild(fl);
    setTimeout(function(){ fl.remove(); }, 800);
  }

  function startTimer() {
    stopTimer();
    startTime = Date.now();
    elapsed = 0;
    elTimer.textContent = '0:00';
    timerInterval = setInterval(function() {
      elapsed = Math.floor((Date.now() - startTime) / 1000);
      elTimer.textContent = fmtTime(elapsed);
    }, 500);
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function getStars(diff, f) {
    var t = STAR_THRESHOLDS[diff];
    if (f <= t[0]) return 3;
    if (f <= t[1]) return 2;
    return 1;
  }

  function renderStars(n) {
    var s = '';
    for (var i = 0; i < 3; i++) s += (i < n ? '⭐' : '☆');
    return s;
  }

  // ── localStorage best score ──
  function getBest(diff) {
    try {
      var raw = localStorage.getItem('kh_memory_best');
      if (!raw) return null;
      var obj = JSON.parse(raw);
      return obj[diff] || null;
    } catch(e) { return null; }
  }

  function saveBest(diff, f) {
    try {
      var raw = localStorage.getItem('kh_memory_best');
      var obj = raw ? JSON.parse(raw) : {};
      if (!obj[diff] || f < obj[diff]) {
        obj[diff] = f;
        localStorage.setItem('kh_memory_best', JSON.stringify(obj));
        return true;
      }
      return false;
    } catch(e) { return false; }
  }

  // ── Build Cards ──
  // Defensive dedupe at draw time too — if WORDS still has dupes (older
  // hardcoded fallback or pathological DB row), pick unique ko+en pairs.
  function buildCards(diff) {
    var cfg = DIFFICULTY[diff];
    var shuffled = shuffle(WORDS.slice());
    var pool = [];
    var seenKo = {}, seenEn = {};
    for (var i = 0; i < shuffled.length && pool.length < cfg.pairs; i++) {
      var w = shuffled[i];
      if (!w || !w.ko || !w.en) continue;
      var k = String(w.ko).trim();
      var e = String(w.en).trim().toLowerCase();
      if (seenKo[k] || seenEn[e]) continue;
      seenKo[k] = 1; seenEn[e] = 1;
      pool.push(w);
    }
    var deck = [];
    pool.forEach(function(w, i) {
      deck.push({ id: i, type: 'ko', text: w.ko, pairId: i });
      deck.push({ id: i, type: 'en', text: w.en, pairId: i });
    });
    return shuffle(deck);
  }

  function createCardEl(data, idx) {
    var card = document.createElement('div');
    card.className = 'mm-card';
    card.dataset.idx = idx;
    card.dataset.pairId = data.pairId;
    card.dataset.type = data.type;

    var inner = document.createElement('div');
    inner.className = 'mm-card-inner';

    var front = document.createElement('div');
    front.className = 'mm-card-front';
    front.textContent = '?';

    var back = document.createElement('div');
    back.className = 'mm-card-back ' + data.type;
    back.textContent = data.text;

    inner.appendChild(front);
    inner.appendChild(back);
    card.appendChild(inner);

    card.addEventListener('click', function() { onCardClick(card); });
    return card;
  }

  // ── Card Click Logic ──
  function onCardClick(card) {
    if (lockBoard) return;
    if (card.classList.contains('flipped')) return;
    if (card.classList.contains('matched')) return;

    card.classList.add('flipped');
    flips++;
    updateStats();

    if (!firstCard) {
      firstCard = card;
      return;
    }

    secondCard = card;
    lockBoard = true;
    checkForMatch();
  }

  function checkForMatch() {
    var isMatch = firstCard.dataset.pairId === secondCard.dataset.pairId;

    if (isMatch) {
      handleMatch();
    } else {
      handleNoMatch();
    }
  }

  function handleMatch() {
    firstCard.classList.add('match-flash', 'matched');
    secondCard.classList.add('match-flash', 'matched');
    matchedPairs++;
    streak++;
    updateStats();
    updateStreakUI();
    if (streak >= 3) showCombo('🔥 ' + streak + ' streak!');

    setTimeout(function() {
      firstCard.classList.remove('match-flash');
      secondCard.classList.remove('match-flash');
    }, 500);

    resetTurn();

    if (matchedPairs === totalPairs) {
      setTimeout(endGame, 400);
    }
  }

  function handleNoMatch() {
    firstCard.classList.add('no-match');
    secondCard.classList.add('no-match');
    streak = 0;
    updateStreakUI();

    setTimeout(function() {
      firstCard.classList.remove('flipped', 'no-match');
      secondCard.classList.remove('flipped', 'no-match');
      resetTurn();
    }, 800);
  }

  function resetTurn() {
    firstCard = null;
    secondCard = null;
    lockBoard = false;
  }

  // ── Screen Management ──
  function showOverlay(el) {
    el.classList.remove('hidden');
    // force reflow for transition
    void el.offsetWidth;
    el.classList.add('visible');
  }

  function hideOverlay(el) {
    el.classList.remove('visible');
    setTimeout(function() { el.classList.add('hidden'); }, 350);
  }

  // ── Start Game ──
  function startGame(diff) {
    difficulty = diff;
    var cfg = DIFFICULTY[diff];
    totalPairs = cfg.pairs;
    matchedPairs = 0;
    flips = 0;
    streak = 0;
    firstCard = null;
    secondCard = null;
    lockBoard = false;

    updateStats();
    updateStreakUI();
    hideOverlay(startScreen);
    hideOverlay(endScreen);

    // Build grid
    grid.innerHTML = '';
    grid.className = 'mm-grid ' + cfg.cols;
    cards = buildCards(diff);

    cards.forEach(function(data, idx) {
      var el = createCardEl(data, idx);
      grid.appendChild(el);
    });

    // Brief peek: show all cards for a quick moment then hide
    var allCards = grid.querySelectorAll('.mm-card');
    allCards.forEach(function(c) { c.classList.add('flipped'); });
    lockBoard = true;

    setTimeout(function() {
      allCards.forEach(function(c) { c.classList.remove('flipped'); });
      lockBoard = false;
      startTimer();
    }, 1200);
  }

  // ── End Game ──
  function endGame() {
    stopTimer();
    elapsed = Math.floor((Date.now() - startTime) / 1000);

    var stars = getStars(difficulty, flips);
    var isNew = saveBest(difficulty, flips);
    var best = getBest(difficulty);

    document.getElementById('mm-end-icon').textContent = stars === 3 ? '🏆' : stars === 2 ? '🎉' : '👏';
    document.getElementById('mm-end-stars').textContent = renderStars(stars);
    document.getElementById('mm-end-flips').textContent = flips;
    document.getElementById('mm-end-time').textContent = fmtTime(elapsed);
    document.getElementById('mm-end-pairs').textContent = totalPairs;

    var bestEl = document.getElementById('mm-end-best');
    if (isNew) {
      bestEl.textContent = '🎊 New best score!';
      bestEl.style.color = '#fbbf24';
    } else if (best) {
      bestEl.textContent = 'Best: ' + best + ' flips';
      bestEl.style.color = '#64748b';
    } else {
      bestEl.textContent = '';
    }

    showOverlay(endScreen);
  }

  // ── Show Start ──
  function showStart() {
    stopTimer();
    hideOverlay(endScreen);
    grid.innerHTML = '';
    elFlips.textContent = '0';
    elPairs.textContent = '0/0';
    elTimer.textContent = '0:00';
    streak = 0;
    updateStreakUI();
    setTimeout(function() { showOverlay(startScreen); }, 100);
  }

  // Public API
  return {
    start: startGame,
    showStart: showStart
  };
})();
</script>

</html>
