<style>
.st-hero{background:linear-gradient(160deg,#4c1d95 0%,#7c3aed 55%,#a78bfa 100%);padding:36px 0 80px;margin-bottom:-56px;}
.st-hero-inner{max-width:1280px;margin:0 auto;padding:0 24px;}
.st-hero-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.75);margin-bottom:10px;}
.st-hero h1{font-family:'Playfair Display',serif;font-size:38px;font-weight:900;color:#fff;margin:0 0 10px;line-height:1.15;}
.st-hero p{font-size:15px;color:rgba(255,255,255,.85);line-height:1.7;max-width:560px;margin:0;}
.st-filter-bar{max-width:1280px;margin:0 auto;padding:20px 24px 28px;display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:2;}
.sf-pill{padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.3);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;}
.sf-pill.on,.sf-pill:hover{background:#fff;color:#7c3aed;border-color:#fff;}
.sf-sep{flex-basis:100%;height:0;}
.st-container{max-width:1280px;margin:0 auto;padding:0 24px 60px;}
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
/* Full-image overlay card (news-card style) */
.sc{position:relative;background:#0b1626;border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;box-shadow:0 10px 32px rgba(15,23,42,.1);aspect-ratio:3/4;min-height:320px;}
.sc:hover{transform:translateY(-4px);box-shadow:0 20px 48px rgba(15,23,42,.15);}
.sc-thumb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1e293b;}
.sc-thumb > img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(1.28) contrast(1.05) saturate(1.15);}
.sc-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,15,35,0) 0%,rgba(5,15,35,0) 48%,rgba(5,15,35,.5) 72%,rgba(5,15,35,.9) 100%);pointer-events:none;}
.sc-mood-badge{position:absolute;top:12px;left:12px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;padding:4px 9px;border-radius:6px;color:#fff;z-index:2;}
.sc-icon-wrap{display:flex;align-items:center;justify-content:center;}
.sc-body{position:absolute;left:0;right:0;bottom:0;padding:16px 18px;z-index:2;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 25%,rgba(0,0,0,.92) 70%,rgba(0,0,0,.98) 100%);}
.sc-title{font-family:'DM Sans','Playfair Display',serif;font-size:17px;font-weight:800;color:#fff;margin:0 0 4px;line-height:1.3;text-shadow:0 2px 10px rgba(0,0,0,1),0 1px 2px rgba(0,0,0,1);letter-spacing:-.01em;}
.sc-title-ko{font-family:'Noto Serif KR',serif;font-size:12px;color:rgba(255,255,255,.82);margin:0 0 6px;text-shadow:0 1px 4px rgba(0,0,0,1);}
.sc-preview{font-size:12px;color:rgba(255,255,255,.78);line-height:1.55;margin:0 0 10px;font-family:'Noto Sans KR',sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.sc-author{display:flex;align-items:center;gap:8px;margin:8px 0 0;}
.sc-author-copy{font-size:11px;color:rgba(255,255,255,.7);line-height:1.45;}
.sc-author-copy strong{display:block;font-size:12px;color:#fff;}
.sc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.15);}
.sc-meta{font-size:11px;color:rgba(255,255,255,.65);}
.sc-open{font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 14px;cursor:pointer;font-family:inherit;transition:all .15s;}
.sc-open:hover{background:rgba(255,255,255,.25);}
/* thumb color themes */
.mood-fun{background:linear-gradient(135deg,#fef9c3,#fde68a);}
.mood-touching{background:linear-gradient(135deg,#fce7f3,#fbcfe8);}
.mood-scary{background:linear-gradient(135deg,#ede9fe,#c4b5fd);}
.mood-shocking{background:linear-gradient(135deg,#fee2e2,#fca5a5);}
.badge-fun{background:#d97706;}
.badge-touching{background:#db2777;}
.badge-scary{background:#7c3aed;}
.badge-shocking{background:#dc2626;}

/* DETAIL OVERLAY */
.st-overlay{position:fixed;inset:0;background:rgba(5,12,24,.65);backdrop-filter:blur(5px);z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;overflow-y:auto;}
.st-overlay.hidden{display:none;}
.st-panel{width:100%;max-width:1080px;background:#f8fafc;border-radius:28px;overflow:hidden;box-shadow:0 32px 80px rgba(5,12,24,.3);display:grid;grid-template-columns:1.3fr .75fr;animation:stIn .22s cubic-bezier(.22,1,.36,1);}
@keyframes stIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.st-left{background:#fff;display:flex;flex-direction:column;}
.st-left-head{padding:0;position:relative;}
.st-head-banner{height:120px;display:flex;align-items:center;justify-content:center;position:relative;}
.st-head-icon{display:flex;align-items:center;justify-content:center;}
.st-head-info{padding:20px 24px 16px;}
.st-head-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.st-head-title{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:900;color:#0f172a;margin:0 0 4px;line-height:1.35;}
.st-head-en{font-size:13px;color:#64748b;font-style:italic;margin:0 0 12px;}
.st-head-pills{display:flex;gap:7px;flex-wrap:wrap;}
.st-author-inline{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;border-radius:16px;background:#f8fafc;border:1px solid #e8eef7;}
.st-author-inline-copy strong{display:block;font-size:12px;color:#0f172a;}
.st-author-inline-copy span{display:block;font-size:11px;color:#64748b;line-height:1.4;}
.st-pill{font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;}
.st-pill-purple{background:#f5f3ff;color:#7c3aed;}
.st-pill-gray{background:#f1f5f9;color:#475569;}
.st-pill-amber{background:#fef9c3;color:#92400e;}
.st-pill-pink{background:#fce7f3;color:#be185d;}
.st-pill-red{background:#fee2e2;color:#b91c1c;}
.st-body-scroll{flex:1;padding:0 24px 16px;overflow-y:auto;max-height:460px;}
.st-body-text{font-family:'Noto Sans KR',sans-serif;font-size:var(--st-body-fs,14px);line-height:var(--st-body-lh,1.9);color:#1e293b;white-space:pre-line;}

/* ── Paragraph-by-paragraph reading: each Korean paragraph is its
   own tappable card, English translation slides in below on tap.
   Lets learners try to understand each chunk in Korean first, then
   uncover the answer one paragraph at a time instead of either
   reading along with English or going entirely without. */
.st-paras{display:flex;flex-direction:column;gap:14px;white-space:normal;}
.st-para{background:rgba(241,245,249,.55);border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;cursor:pointer;transition:background .18s,border-color .18s;}
.st-para:hover{background:rgba(238,242,255,.85);border-color:#c7d2fe;}
.st-para-ko{font-family:'Noto Sans KR',sans-serif;font-size:var(--st-body-fs,14px);line-height:var(--st-body-lh,1.9);color:#1e293b;white-space:pre-line;}
.st-para-en{margin-top:10px;padding-top:10px;border-top:1px dashed #cbd5e1;font-size:13px;line-height:1.65;color:#475569;white-space:pre-line;display:none;}
.st-para.is-open .st-para-en{display:block;animation:stParaReveal .25s ease-out;}
.st-para .st-para-tap-hint{display:block;font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:.06em;text-transform:uppercase;margin-top:8px;}
.st-para.is-open .st-para-tap-hint{color:#64748b;}
@keyframes stParaReveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.st-sent-block{display:none;margin-top:14px;padding-top:12px;border-top:1px dashed #cbd5e1;}
.st-para.is-open .st-sent-block{display:block;animation:stParaReveal .25s ease-out;}
.st-sent-block-label{font-size:10px;font-weight:800;color:#7c3aed;letter-spacing:.1em;margin-bottom:10px;}
.st-sent-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.st-sent-card:last-child{margin-bottom:0;}
.st-sent-ko{font-family:'Noto Serif KR',serif;font-size:14px;font-weight:600;color:#0f172a;line-height:1.55;}
.st-sent-en{margin-top:4px;font-size:12px;color:#64748b;line-height:1.5;}
.st-sent-vocab-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.st-sent-vocab-pill{display:inline-flex;align-items:center;background:rgba(124,58,237,.08);color:#6d28d9;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;}
.st-sent-grammar-row{margin-top:8px;display:flex;flex-direction:column;gap:4px;}
.st-sent-grammar-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-size:11px;line-height:1.4;}
.st-sent-grammar-pat{font-family:'Noto Serif KR',serif;font-weight:800;color:#0ea5e9;}
.st-sent-grammar-exp{color:#64748b;}
.st-theme-sepia .st-sent-card{background:#f7eed8;border-color:#d6c89c;}
.st-theme-sepia .st-sent-ko{color:#5b4636;}
.st-theme-sepia .st-sent-en{color:#7a6240;}

/* ── Reading settings popover (font size + line height + theme).
   Sits over the body scroll area top-right, toggled via gear btn.
   Settings persist via localStorage and re-apply on every story
   open. */
.st-settings-wrap{position:relative;display:inline-flex;align-items:center;gap:6px;}
.st-settings-btn{padding:6px 12px;border-radius:999px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;line-height:1;}
.st-settings-btn:hover{border-color:#cbd5e1;color:#475569;}
.st-settings-pop{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 16px 40px rgba(15,23,42,.18);padding:14px 16px;min-width:240px;z-index:50;}
.st-settings-pop[hidden]{display:none;}
.st-settings-pop h4{margin:0 0 10px;font-size:11px;font-weight:800;color:#94a3b8;letter-spacing:.08em;text-transform:uppercase;}
.st-settings-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.st-settings-row:last-child{margin-bottom:0;}
.st-settings-row > span{font-size:12px;font-weight:700;color:#334155;}
.st-settings-pop button{flex:0 0 auto;padding:5px 10px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;}
.st-settings-pop button.on{border-color:#7c3aed;background:#7c3aed;color:#fff;}
.st-settings-group{display:flex;gap:4px;}

/* Theme variations applied on the panel root via .st-theme-* class. */
.st-theme-light .st-body-scroll{background:#fff;}
.st-theme-light .st-para{background:#f8fafc;border-color:#e2e8f0;}
.st-theme-sepia .st-body-scroll{background:#f4ecd8;}
.st-theme-sepia .st-para{background:#f0e4c8;border-color:#d6c89c;}
.st-theme-sepia .st-para-ko,
.st-theme-sepia .st-body-text{color:#5b4636;}
.st-theme-sepia .st-para-en{color:#7a6240;border-top-color:#d6c89c;}
.st-cta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 24px 20px;border-top:1px solid #f0f4fa;}

/* Series nav strip — rendered at the bottom of the story body when
   the current story belongs to a series. Two large prev/next pills
   under a small header showing series title + episode position. */
.st-series-nav-wrap{margin:18px 0 4px;padding:14px 16px;background:rgba(124,58,237,.07);border:1px solid rgba(124,58,237,.18);border-radius:14px;}
.st-series-nav-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.st-series-nav-eyebrow{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7c3aed;}
.st-series-nav-title-strong{font-size:13px;font-weight:800;color:#1e1b4b;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.st-series-nav-count{font-size:10px;font-weight:700;color:#64748b;background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:2px 8px;letter-spacing:.04em;}
.st-series-nav-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.st-series-nav-pill{display:flex;align-items:center;gap:8px;padding:11px 12px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;cursor:pointer;text-align:left;font-family:inherit;transition:border-color .12s,background .12s,transform .12s;min-width:0;}
.st-series-nav-pill:hover{border-color:#c4b5fd;background:#faf5ff;transform:translateY(-1px);}
.st-series-nav-arrow{font-size:18px;color:#7c3aed;flex:0 0 auto;}
.st-series-nav-meta{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
.st-series-nav-meta .st-series-nav-eyebrow{font-size:9px;color:#7c3aed;}
.st-series-nav-meta .st-series-nav-title{font-size:13px;font-weight:700;color:#0f172a;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}
@media(max-width:520px){.st-series-nav-row{grid-template-columns:1fr;}}
.st-cta-btn{padding:12px;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:all .15s;}
.st-cta-pri{background:#7c3aed;color:#fff;}
.st-cta-pri:hover{background:#6d28d9;}
.st-cta-sec{background:#f5f3ff;color:#7c3aed;border:1px solid #ddd6fe;}
.st-cta-sec:hover{background:#ede9fe;}
.st-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;font-family:inherit;line-height:1;}
.st-close:hover{background:rgba(0,0,0,.68);}
.st-back{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:999px;background:rgba(0,0,0,.5);border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;z-index:5;font-family:inherit;}
.st-back:hover{background:rgba(0,0,0,.68);}

/* Favorite (heart) button — sits next to the close X. Empty heart by
   default, fills + glows when the story is saved. The ♡ character
   swaps to ♥ via JS to avoid a CSS background image. */
.st-fav-btn{position:absolute;top:12px;right:58px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;font-family:inherit;line-height:1;transition:background .15s,transform .15s,color .15s;}
.st-fav-btn:hover{background:rgba(0,0,0,.68);transform:scale(1.08);}
.st-fav-btn.is-saved{background:rgba(244,63,94,.85);color:#fff;text-shadow:0 0 12px rgba(244,63,94,.7);}
.st-fav-btn.is-saved:hover{background:rgba(225,29,72,.95);}

/* Heart marker on each list-page card thumbnail. Filled = saved. */
.sc-fav-mark{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;line-height:1;transition:background .15s,color .15s,transform .15s;}
.sc-fav-mark:hover{background:rgba(15,23,42,.78);transform:scale(1.08);}
.sc-fav-mark.is-saved{background:rgba(244,63,94,.92);color:#fff;}
.sc-thumb{position:relative;}
/* right study panel */
.st-right{background:#f8fafc;border-left:1px solid #e8eef7;overflow-y:auto;}
.st-right-head{padding:20px 22px 14px;border-bottom:1px solid #e8eef7;background:#fff;}
.st-right-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#7c3aed;margin-bottom:6px;}
.st-right-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:#0f172a;margin:0;}
.st-sections{padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.st-card{background:#fff;border-radius:18px;border:1px solid #e8eef7;padding:16px 18px;box-shadow:0 2px 10px rgba(15,23,42,.04);}
.st-card-title{font-size:13px;font-weight:800;color:#0f172a;margin:0 0 10px;display:flex;align-items:center;gap:6px;}
.st-vocab-list{display:flex;flex-direction:column;gap:7px;}
.st-vocab-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:#f8fafc;border:1px solid #e8eef7;}
.st-vocab-item:hover{background:#f5f3ff;border-color:#ddd6fe;}
.st-vi-ko{font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;color:#7c3aed;min-width:80px;}
.st-vi-rom{font-size:11px;color:#94a3b8;font-style:italic;min-width:70px;flex-shrink:0;}
.st-vi-en{font-size:12px;color:#334155;flex:1;}
.st-grammar-list{display:flex;flex-direction:column;gap:8px;}
.st-grammar-item{padding:9px 12px;border-radius:10px;background:#f8fafc;border:1px solid #e8eef7;font-size:12px;line-height:1.6;color:#334155;}
.st-grammar-item strong{color:#7c3aed;font-weight:800;}
.st-q-list{display:flex;flex-direction:column;gap:8px;}
.st-q-item{padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px solid #e8eef7;}
.st-q-q{font-size:12px;font-weight:700;color:#0f172a;margin-bottom:4px;}
.st-q-a{font-size:12px;color:#475569;line-height:1.5;}
@media(max-width:900px){.st-grid{grid-template-columns:repeat(2,1fr)}.st-panel{grid-template-columns:1fr}.st-right{border-left:none;border-top:1px solid #e8eef7}}
@media(max-width:600px){.st-grid{grid-template-columns:1fr}.st-hero h1{font-size:28px}.st-panel{border-radius:20px}}

/* Mobile-only Read / Learn tab strip on the story detail. Desktop
   keeps the 2-column layout (body + right panel side-by-side) so
   the tab strip is display:none. On mobile the right panel was
   stacked below the body — too much learning-element noise under
   each story — so we gate one or the other via the active tab. */
.st-tab-strip{display:none;}
@media(max-width:900px){
  .st-tab-strip{
    display:flex;gap:8px;padding:10px 20px 0;background:#fff;
    border-bottom:1px solid #eef2f7;position:sticky;top:0;z-index:5;
  }
  .st-tab-btn{
    flex:1;padding:10px 0;border:none;background:transparent;
    color:#64748b;font-size:13px;font-weight:800;cursor:pointer;
    font-family:inherit;border-bottom:2px solid transparent;
    transition:color .15s,border-color .15s;
  }
  .st-tab-btn.on{color:#0f172a;border-bottom-color:#2563eb;}
  .st-panel.st-mobile-tab-read .st-right{display:none;}
  .st-panel.st-mobile-tab-learn .st-body-scroll,
  .st-panel.st-mobile-tab-learn .st-cta-row{display:none;}
}
/* Netflix-style genre rails */
.st-rail{margin-bottom:36px;}
.st-rail-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;padding:0 4px;}
.st-rail-title{font-size:20px;font-weight:900;color:#0f172a;letter-spacing:-0.01em;font-family:'DM Sans','Noto Sans KR',sans-serif;}
.st-rail-more{font-size:12px;font-weight:700;color:#64748b;cursor:pointer;background:none;border:none;padding:4px 0;font-family:inherit;}
.st-rail-more:hover{color:#0f172a;}
.st-rail-scroll{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;padding:4px 4px 16px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
.st-rail-scroll::-webkit-scrollbar{height:6px;}
.st-rail-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}
.st-rail-scroll > .sc{flex:0 0 168px;scroll-snap-align:start;min-height:224px;}
.st-rail-scroll > .sc .sc-preview,
.st-rail-scroll > .sc .sc-author,
.st-rail-scroll > .sc .sc-foot{display:none;}
.st-rail-scroll > .sc .sc-body{padding:10px 12px;}
.st-rail-scroll > .sc .sc-title{font-size:13px;margin-bottom:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.st-rail-scroll > .sc .sc-title-ko{font-size:10px;margin-bottom:0;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.st-rail-scroll > .sc .sc-mood-badge{font-size:9px;padding:2px 6px;top:8px;left:8px;}
/* Darker bottom scrim for compact rail cards so titles stay legible */
.st-rail-scroll > .sc .sc-thumb::after{background:linear-gradient(180deg,rgba(5,15,35,0) 0%,rgba(5,15,35,0) 45%,rgba(5,15,35,.55) 72%,rgba(5,15,35,.92) 100%);}
.st-rail-scroll > .sc .sc-body{background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.38) 25%,rgba(0,0,0,.8) 65%,rgba(0,0,0,.92) 100%);}
@media(max-width:600px){
  .st-rail-scroll > .sc{flex:0 0 136px;min-height:182px;}
  .st-rail-scroll{gap:8px;padding:2px 2px 12px;}
  .st-rail{margin-bottom:22px;}
  .st-rail-head{margin-bottom:8px;padding:0 2px;}
  .st-rail-title{font-size:15px;}
  .st-rail-scroll > .sc .sc-title{font-size:12px;}
  .st-rail-scroll > .sc .sc-body{padding:8px 10px;}
  .st-hero{padding:22px 0 50px;margin-bottom:-34px;}
  .st-hero h1{font-size:24px;margin-bottom:6px;}
  .st-hero p{font-size:12px;line-height:1.5;}
  .st-filter-bar{padding:12px 16px 16px;gap:6px;}
  .sf-pill{padding:6px 12px;font-size:12px;}
  .st-container{padding:0 14px 48px;}
}

<script>
// ── Story progress + favorites helpers (Phase 2) ────────────────
// Both backed by Supabase tables created in the Phase 2 migration.
// Anonymous users (no supaUser) silently no-op so the feature
// degrades cleanly in incognito / signed-out states.
//
//   user_story_progress  — one row per (user, story). Keeps the
//   last_position as a 0-100 percent (resilient to font-size /
//   line-height changes that would invalidate raw scrollTop) and
//   last_read_at for the "Continue reading" surface.
//
//   user_saved_stories   — one row per (user, story) — composite
//   PK so the upsert acts as toggle: insert = save, delete = unsave.
var _khStorySavedSet = null;        // cached set of saved story_ids
var _khStoryProgressTimer = null;   // debounce handle for scroll save

function _khStorySupa() {
  return (typeof getSupa === 'function') ? getSupa() : null;
}

async function khStoryProgressLoad(storyId) {
  if (typeof supaUser === 'undefined' || !supaUser || !storyId) return null;
  var sb = _khStorySupa();
  if (!sb) return null;
  try {
    var r = await sb.from('user_story_progress')
      .select('last_position')
      .eq('user_id', supaUser.id)
      .eq('story_id', String(storyId))
      .maybeSingle();
    return (r && r.data && typeof r.data.last_position === 'number') ? r.data.last_position : null;
  } catch (_) { return null; }
}

async function khStoryProgressSave(storyId, percent) {
  if (typeof supaUser === 'undefined' || !supaUser || !storyId) return;
  var sb = _khStorySupa();
  if (!sb) return;
  var pos = Math.max(0, Math.min(100, Math.round(percent)));
  try {
    await sb.from('user_story_progress').upsert({
      user_id:       supaUser.id,
      story_id:      String(storyId),
      last_position: pos,
      last_read_at:  new Date().toISOString(),
    }, { onConflict: 'user_id,story_id' });
  } catch (_) {}
}

// Convert scroll element offsets → 0-100 percent and back.
function khStoryScrollPercent(scrollEl) {
  if (!scrollEl) return 0;
  var max = scrollEl.scrollHeight - scrollEl.clientHeight;
  if (max <= 0) return 0;
  return (scrollEl.scrollTop / max) * 100;
}
function khStoryScrollSetPercent(scrollEl, pct) {
  if (!scrollEl) return;
  var max = scrollEl.scrollHeight - scrollEl.clientHeight;
  if (max <= 0) return;
  scrollEl.scrollTop = (Math.max(0, Math.min(100, pct)) / 100) * max;
}

// Saves on every scroll, throttled to ~800ms — picks the value at
// the trailing edge so the persisted position matches where the
// user actually stopped, not where they swept past.
function khStoryProgressAttachScroll(scrollEl, storyId) {
  if (!scrollEl || !storyId) return;
  if (_khStoryProgressTimer) { clearTimeout(_khStoryProgressTimer); _khStoryProgressTimer = null; }
  scrollEl.addEventListener('scroll', function () {
    if (_khStoryProgressTimer) clearTimeout(_khStoryProgressTimer);
    _khStoryProgressTimer = setTimeout(function () {
      khStoryProgressSave(storyId, khStoryScrollPercent(scrollEl));
    }, 800);
  });
}

// ── Favorites cache: load once per session so the list page can
// show ♥ markers without N round-trips. Refreshed when the user
// toggles a save.
async function khStoryFavLoadAll() {
  if (typeof supaUser === 'undefined' || !supaUser) { _khStorySavedSet = new Set(); return _khStorySavedSet; }
  var sb = _khStorySupa();
  if (!sb) { _khStorySavedSet = new Set(); return _khStorySavedSet; }
  try {
    var r = await sb.from('user_saved_stories').select('story_id').eq('user_id', supaUser.id);
    _khStorySavedSet = new Set((r && r.data || []).map(function (x) { return String(x.story_id); }));
  } catch (_) { _khStorySavedSet = new Set(); }
  return _khStorySavedSet;
}
function khStoryIsSaved(storyId) {
  return _khStorySavedSet ? _khStorySavedSet.has(String(storyId)) : false;
}

async function khStoryFavToggle(storyId) {
  if (typeof supaUser === 'undefined' || !supaUser) {
    if (typeof openAuthModal === 'function') openAuthModal('signin');
    return;
  }
  var sb = _khStorySupa();
  if (!sb) return;
  if (!_khStorySavedSet) await khStoryFavLoadAll();
  var sid = String(storyId);
  var willSave = !_khStorySavedSet.has(sid);
  try {
    if (willSave) {
      await sb.from('user_saved_stories').insert({ user_id: supaUser.id, story_id: sid });
      _khStorySavedSet.add(sid);
    } else {
      await sb.from('user_saved_stories').delete()
        .eq('user_id', supaUser.id).eq('story_id', sid);
      _khStorySavedSet.delete(sid);
    }
  } catch (_) {}
  // Sync the in-overlay button state.
  var btn = document.getElementById('st-fav-btn');
  if (btn) {
    btn.classList.toggle('is-saved', willSave);
    btn.textContent = willSave ? '♥' : '♡';
    btn.setAttribute('aria-label', willSave ? 'Remove from saved' : 'Save story');
    btn.title = willSave ? 'Remove from saved' : 'Save story';
  }
  // Sync any list-page heart marker for this card.
  document.querySelectorAll('.sc[data-story-id="' + sid + '"] .sc-fav-mark')
    .forEach(function (el) {
      el.classList.toggle('is-saved', willSave);
      el.textContent = willSave ? '♥' : '♡';
    });
}

// Recently-in-progress stories (last_position < 95). Used by the
// "Continue reading" surface on the list page.
async function khStoryProgressRecent(limit) {
  if (typeof supaUser === 'undefined' || !supaUser) return [];
  var sb = _khStorySupa();
  if (!sb) return [];
  try {
    var r = await sb.from('user_story_progress')
      .select('story_id,last_position,last_read_at')
      .eq('user_id', supaUser.id)
      .lt('last_position', 95)
      .order('last_read_at', { ascending: false })
      .limit(limit || 6);
    return (r && r.data) || [];
  } catch (_) { return []; }
}

// Returns a character object for the story's author_slug, or null if none.
function resolveStoryAuthor(s) {
  if (!s || !s.author_slug) return null;
  // KH_CHARACTERS may be defined on this page in a future update; fall back to null.
  var chars = (typeof KH_CHARACTERS !== 'undefined') ? KH_CHARACTERS : {};
  return chars[s.author_slug] || null;
}

// Palette for initial-based avatar colours (same logic as conversations page).
var _ST_CHAR_PALETTE = ['#2255a4','#0891b2','#059669','#b45309','#7c3aed','#c2410c','#1e7e5e','#1d4ed8'];
function _stCharInitialColor(name) {
  var h = 0;
  for (var i = 0; i < (name||'').length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return _ST_CHAR_PALETTE[Math.abs(h) % _ST_CHAR_PALETTE.length];
}

// Renders a small circular avatar — image if available, otherwise coloured initial.
function renderCharacterAvatar(char, cls, size) {
  var sz  = size || 36;
  var nm  = (char && (char.name || char.name_ko)) || '?';
  var col = (char && char.color) || _stCharInitialColor(nm);
  var ini = nm.charAt(0).toUpperCase();
  var fs  = Math.round(sz * 0.38) + 'px';
  var base = 'style="width:' + sz + 'px;height:' + sz + 'px;border-radius:50%;'
    + 'background:' + col + ';display:inline-flex;align-items:center;justify-content:center;'
    + 'font-weight:900;color:#fff;font-size:' + fs + ';flex-shrink:0;overflow:hidden;"'
    + (cls ? ' class="' + cls + '"' : '');
  if (char && char.img) {
    return '<div ' + base + '>'
      + '<img src="' + char.img + '" alt="' + escapeHtml(nm) + '" '
      + 'style="width:100%;height:100%;object-fit:cover;display:block;" '
      + 'onerror="this.style.display=\'none\'">'
      + '</div>';
  }
  return '<div ' + base + '>' + ini + '</div>';
}

function characterDisplayName(char) {

var activeGenre = 'all', activeLvl = 'all', activePerspective = 'all';

function renderStories() {
  var grid = document.getElementById('st-grid');
  var list = STORIES.filter(function(s) {
    var genre = s.genre || s.mood || 'slice_of_life';
    var persp = s.perspective || 'third';
    var genreOk = activeGenre === 'all' || genre === activeGenre || s.mood === activeGenre;
    var lvlOk = activeLvl === 'all' || s.lvl === activeLvl;
    var perspOk = activePerspective === 'all' || persp === activePerspective;
    return genreOk && lvlOk && perspOk;
  });

  renderSeriesSection();

  if (!list.length) {
    grid.className = 'st-grid';
    grid.style.display = '';
    grid.innerHTML = '<p style="color:#64748b;font-size:14px;grid-column:1/-1;padding:20px 0">No stories found.</p>';
    return;
  }

  // Netflix-style genre rails when no filter is active.
  // Each story appears in exactly ONE rail — priority order:
  //   1) ⚡ Quick Reads  →  2) its genre rail  →  3) its level rail
  var noFilter = activeGenre === 'all' && activeLvl === 'all' && activePerspective === 'all';
  if (noFilter) {
    grid.className = 'st-rails';
    grid.style.display = 'block';

    // 0a) 📖 Continue Reading — only when the signed-in user has
    // in-progress stories (last_position < 95) cached from
    // khStoryProgressRecent. Does NOT remove items from other rails.
    var contHTML = '';
    var contRecent = window._khStoryProgressRecent || [];
    if (contRecent.length) {
      var byId = {};
      list.forEach(function (s) { byId[String(s.id)] = s; });
      var contStories = contRecent
        .map(function (r) { return byId[String(r.story_id)]; })
        .filter(Boolean)
        .slice(0, 8);
      if (contStories.length) {
        contHTML = '<div class="st-rail"><div class="st-rail-head"><div class="st-rail-title" style="display:inline-flex;align-items:center;gap:8px"><i data-lucide="book-open" class="kh-ui-icon" style="width:18px;height:18px" aria-hidden="true"></i><span>Continue Reading</span></div></div>'
          + '<div class="st-rail-scroll">' + contStories.map(renderStoryCard).join('') + '</div></div>';
      }
    }

    // 0b) ❤️ Saved — user's bookmarked stories. Skipped when empty
    // or when the user isn't signed in.
    var savedHTML = '';
    if (_khStorySavedSet && _khStorySavedSet.size) {
      var savedStories = list.filter(function (s) { return _khStorySavedSet.has(String(s.id)); }).slice(0, 12);
      if (savedStories.length) {
        savedHTML = '<div class="st-rail"><div class="st-rail-head"><div class="st-rail-title" style="display:inline-flex;align-items:center;gap:8px"><i data-lucide="heart" class="kh-ui-icon" style="width:18px;height:18px;color:#ef4444;fill:#ef4444" aria-hidden="true"></i><span>Saved</span></div></div>'
          + '<div class="st-rail-scroll">' + savedStories.map(renderStoryCard).join('') + '</div></div>';
      }
    }

    // 0) ✨ New Stories — spotlight rail, does NOT remove items from genre rails below
    var byCreatedDesc = list.slice().sort(function(a, b) {
      var ad = a.created_at || a.createdAt || '';
      var bd = b.created_at || b.createdAt || '';
      if (ad && bd) return bd.localeCompare(ad);
      return (b.id || 0) - (a.id || 0);
    });
    var newStories = byCreatedDesc.slice(0, 6);
    var newHTML = newStories.length
      ? '<div class="st-rail"><div class="st-rail-head"><div class="st-rail-title" style="display:inline-flex;align-items:center;gap:8px"><i data-lucide="sparkles" class="kh-ui-icon" style="width:18px;height:18px;color:#fbbf24" aria-hidden="true"></i><span>New Stories</span></div></div>'
        + '<div class="st-rail-scroll">' + newStories.map(renderStoryCard).join('') + '</div></div>'
      : '';

    // 1) Quick Reads — spotlight rail for ≤3-min stories, also non-claiming
    var quickReads = list.filter(function(s) {
      var m = String(s.readTime || s.read_time || '').match(/\d+/);
      return m && parseInt(m[0], 10) <= 3;
    }).slice(0, 12);
    var quickHTML = quickReads.length
      ? '<div class="st-rail"><div class="st-rail-head"><div class="st-rail-title" style="display:inline-flex;align-items:center;gap:8px"><i data-lucide="zap" class="kh-ui-icon" style="width:18px;height:18px;color:#fbbf24" aria-hidden="true"></i><span>Quick Reads</span></div></div>'
        + '<div class="st-rail-scroll">' + quickReads.map(renderStoryCard).join('') + '</div></div>'
      : '';

    // 2) Genre rails — every story appears in its own genre section
    var byGenre = {};
    list.forEach(function(s) {
      var g = s.genre || s.mood || 'slice_of_life';
      if (!byGenre[g]) byGenre[g] = [];
      byGenre[g].push(s);
    });
    var order = [
      'slice_of_life','romance','mystery','adventure','thriller','essay','workplace','comedy',
      'fairytale','folktale','aesop',
      'webnovel','sci_fi','historical','fantasy',
      'fun','touching','scary','shocking'
    ];
    var keys = Object.keys(byGenre).sort(function(a, b) {
      var ai = order.indexOf(a); var bi = order.indexOf(b);
      if (ai < 0) ai = 999; if (bi < 0) bi = 999;
      return ai - bi;
    });
    var genreRailsHTML = keys.map(function(g) {
      var label = GENRE_LABELS[g] || g;
      var stories = byGenre[g].slice(0, 12);
      return '<div class="st-rail">'
        + '<div class="st-rail-head">'
          + '<div class="st-rail-title">' + label + '</div>'
          + '<button class="st-rail-more" onclick="stFilterGenre(\'' + g + '\')">See all &rsaquo;</button>'
        + '</div>'
        + '<div class="st-rail-scroll">' + stories.map(renderStoryCard).join('') + '</div>'
      + '</div>';
    }).join('');

    grid.innerHTML = contHTML + savedHTML + newHTML + quickHTML + genreRailsHTML;
    if (window.renderKhLucideIcons) renderKhLucideIcons();
    return;
  }

  // Filtered view — flat grid (current behaviour)
  grid.className = 'st-grid';
  grid.style.display = '';
  var standalone = list.filter(function(s) { return !s.series_id; });
  var seriesEps = list.filter(function(s) { return !!s.series_id; });

  var html = standalone.map(renderStoryCard).join('');
  var seriesGroups = {};
  seriesEps.forEach(function(s) {
    if (!seriesGroups[s.series_id]) seriesGroups[s.series_id] = [];
    seriesGroups[s.series_id].push(s);
  });
  Object.keys(seriesGroups).forEach(function(sid) {
    var eps = seriesGroups[sid].sort(function(a,b) { return (a.episode||0) - (b.episode||0); });
    html += eps.map(renderStoryCard).join('');
  });

  grid.innerHTML = html;
  if (window.renderKhLucideIcons) renderKhLucideIcons();
}

function stFilterGenre(genre) {
  var pill = document.querySelector('#mood-pills .sf-pill[data-genre="' + genre + '"]');
  if (pill) { pill.click(); return; }
  activeGenre = genre;
  renderStories();
}

function renderStoryCard(s) {
  var author = resolveStoryAuthor(s);
  var genre = s.genre || s.mood || 'slice_of_life';
  var genreLabel = GENRE_LABELS[genre] || genre;
  var genreColor = GENRE_COLORS[genre] || '#7c3aed';
  var thumbBg = GENRE_BG[genre] || GENRE_BG[s.mood] || 'linear-gradient(135deg,#f5f3ff,#ede9fe)';
  var persp = s.perspective || 'third';
  var perspIcon = PERSPECTIVE_ICONS[persp] || '';
  var perspLabel = PERSPECTIVE_LABELS[persp] || '';
  var iconName = s.banner_icon || MOOD_ICONS[s.mood] || 'book-open';
  var seriesBadge = s.series_id ? '<span style="display:inline-block;padding:2px 6px;border-radius:4px;background:rgba(124,58,237,.1);color:#7c3aed;font-size:9px;font-weight:800;margin-left:6px">EP ' + (s.episode||1) + '</span>' : '';

  var thumbUrl = s.thumbnail_url || s.thumbnail || s.image_url || '';
  // Always supply an image — picsum fallback keyed to story id so the

  var finalThumb = thumbUrl || ('https://picsum.photos/seed/' + encodeURIComponent('story-' + (s.id || s.title || Math.random())) + '/600/800');
  var thumbInner = '<img src="' + escapeHtml(finalThumb) + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'https://picsum.photos/seed/kh-story/600/800\'">'
    + '<span class="sc-mood-badge" style="background:' + genreColor + '">' + genreLabel + '</span>';

  // Saved-state mark — sits on the thumbnail so it's visible even
  // before opening the story. The heart character flips ♡ → ♥ via

  var savedOn = (typeof khStoryIsSaved === 'function' && khStoryIsSaved(s.id));
  var savedMarkHtml = '<span class="sc-fav-mark' + (savedOn ? ' is-saved' : '') + '" onclick="event.stopPropagation();khStoryFavToggle(\'' + String(s.id).replace(/'/g,"\\'") + '\')" aria-label="Toggle save" title="Save / unsave">' + (savedOn ? '♥' : '♡') + '</span>';

  return '<div class="sc" data-hover-skip="1" data-story-id="' + String(s.id) + '" onclick="openStory(\'' + s.id + '\')">'
    + '<div class="sc-thumb">'
      + thumbInner
      + savedMarkHtml
    + '</div>'
    + '<div class="sc-body">'
      + '<div class="sc-title">' + escapeHtml(s.title_en || s.title || '') + seriesBadge + '</div>'
      + (s.title && s.title_en ? '<div class="sc-title-ko">' + escapeHtml(s.title) + '</div>' : '')
      + '<div class="sc-preview">' + escapeHtml(s.preview || '') + '</div>'
      + (author ? '<div class="sc-author">' + renderCharacterAvatar(author, 'kh-character-avatar', 34) + '<div class="sc-author-copy"><strong>' + characterDisplayName(author) + '</strong><span>' + escapeHtml(author.role || '') + '</span></div></div>' : '')
      + '<div class="sc-foot">'
        + '<span class="sc-meta">' + (s.readTime||'3 min') + ' · ' + (LVL_LABEL[s.lvl]||'') + (perspLabel ? ' · ' + perspIcon + ' ' + perspLabel : '') + '</span>'
        + '<button class="sc-open">Read →</button>'
      + '</div>'
    + '</div>'
  + '</div>';
}

function filterBySeries(seriesId) {
  activeGenre = 'all'; activeLvl = 'all'; activePerspective = 'all';
  var grid = document.getElementById('st-grid');

// ── Series navigation strip rendered at the foot of a story body.
//    If the story belongs to a series, show prev/next episode pills
//    + a small "more episodes" list. Falls back to empty string for
//    stand-alones so the body just ends like before.
function stRenderSeriesNav(s) {
  if (!s || !s.series_id) return '';
  var siblings = STORIES
    .filter(function (x) { return x && x.series_id === s.series_id; })
    .sort(function (a, b) {
      // Prefer series_order if both have it; fall back to episode #.
      var ao = (a.series_order != null) ? a.series_order : (a.episode || 0);
      var bo = (b.series_order != null) ? b.series_order : (b.episode || 0);
      return ao - bo;
    });
  if (siblings.length < 2) return '';
  var idx = siblings.findIndex(function (x) { return String(x.id) === String(s.id); });
  if (idx < 0) return '';
  var prev = idx > 0 ? siblings[idx - 1] : null;
  var next = idx < siblings.length - 1 ? siblings[idx + 1] : null;
  var seriesMeta = (typeof _storySeries !== 'undefined' ? _storySeries : []).find(function (sr) { return sr && sr.id === s.series_id; });
  var seriesTitle = (seriesMeta && (seriesMeta.title_en || seriesMeta.title)) || s.series_id;

  // Pill button factory.
  function pill(ep, label, dir) {
    if (!ep) return '<span style="flex:1"></span>';
    var arrow = dir === 'prev' ? '←' : '→';
    var epNum = (ep.series_order != null) ? ep.series_order : (ep.episode || '');
    var epLabel = epNum ? 'EP ' + epNum : 'Episode';
    var title = ep.title_en || ep.title || ep.episode_title || '';
    return '<button class="st-series-nav-pill" onclick="closeSt();setTimeout(function(){openStory(\'' + String(ep.id).replace(/'/g,"\\'") + '\')},80)">'
      + (dir === 'prev' ? '<span class="st-series-nav-arrow">' + arrow + '</span>' : '')
      +   '<span class="st-series-nav-meta"><span class="st-series-nav-eyebrow">' + (dir === 'prev' ? 'Previous · ' : 'Next · ') + epLabel + '</span><span class="st-series-nav-title">' + escapeHtml(title) + '</span></span>'
      + (dir === 'next' ? '<span class="st-series-nav-arrow">' + arrow + '</span>' : '')
      + '</button>';
  }

  var navHTML =
    '<div class="st-series-nav-wrap">'
    +   '<div class="st-series-nav-header">'
    +     '<span class="st-series-nav-eyebrow">📚 Series</span>'
    +     '<span class="st-series-nav-title-strong">' + escapeHtml(seriesTitle) + '</span>'
    +     '<span class="st-series-nav-count">EP ' + (idx + 1) + ' / ' + siblings.length + '</span>'
    +   '</div>'
    +   '<div class="st-series-nav-row">' + pill(prev, '', 'prev') + pill(next, '', 'next') + '</div>'
    + '</div>';
  return navHTML;
}

var _stOverlayOpen = false;
function _storyAiCacheKey(id) { return 'kh_story_ai_v1_' + id; }
function _hydrateStoryAiFromCache(s) {
  if (!s || s.id == null) return;
  try {
    var raw = localStorage.getItem(_storyAiCacheKey(s.id));
    if (!raw) return;
    var c = JSON.parse(raw);
    if (!c || typeof c !== 'object') return;
    if ((!s.vocab || !s.vocab.length) && Array.isArray(c.vocab)) s.vocab = c.vocab;
    if ((!s.grammar || !s.grammar.length) && Array.isArray(c.grammar)) s.grammar = c.grammar;
    if ((!s.key_expressions || !s.key_expressions.length) && Array.isArray(c.key_expressions)) s.key_expressions = c.key_expressions;
    if ((!s.comprehension || !s.comprehension.length) && Array.isArray(c.comprehension)) s.comprehension = c.comprehension;
  } catch(e) {}
}

async function generateStoryAI(id) {
  var s = STORIES.find(function(x){ return String(x.id) === String(id); });
  if (!s) return;
  var btn = document.getElementById('st-gen-ai-btn');
  var msg = document.getElementById('st-gen-ai-msg');
  if (btn) { btn.disabled = true; btn.style.opacity = '.7'; btn.textContent = '🤖 AI 분석 중… (15-25초)'; }
  if (msg) msg.textContent = '';
  try {
    if (typeof callClaude !== 'function') throw new Error('callClaude 사용 불가 (로그인 필요)');
    var body = (s.body || '').replace(/<[^>]*>/g, '').slice(0, 2500);
    if (!body || body.length < 40) throw new Error('본문이 너무 짧습니다');
    var prompt = 'Analyze the Korean story below and return ONLY valid JSON (no markdown, no "json" label).\n\n'
      + 'Title: ' + (s.title || '') + '\nBody: ' + body
      + '\n\nSchema:\n{\n'
      + '  "vocab": [{"ko":"단어","rom":"romanization","en":"English meaning","note":"short usage tip"}],\n'
      + '  "grammar": [{"point":"grammar pattern","ex":"example sentence from the story","en":"English explanation"}],\n'
      + '  "key_expressions": [{"ko":"multi-word expression","rom":"romanization","en":"English meaning","usage":"when to use it"}],\n'
      + '  "comprehension": [{"q":"question","a":"answer"}]\n'
      + '}\n\n'
      + 'Rules: vocab 10-15 SINGLE words in dictionary form, every entry stem must appear in the body. key_expressions 4-6 MULTI-word idioms/phrases. grammar 3 items. comprehension 3 items. JSON only.';
    var res = await callClaude({
      feature: 'story-user-analysis',
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 1800,
      messages: [{ role: 'user', content: prompt }]
    });
    var txt = (res && res.content || []).map(function(b){ return b.text || ''; }).join('');
    txt = txt.replace(/```json\s*/gi, '').replace(/```/g, '').trim();
    txt = txt.replace(/^\s*json\b[:\s]*/i, '').trim();
    var si = txt.indexOf('{'), ei = txt.lastIndexOf('}');
    if (si >= 0 && ei > si) txt = txt.slice(si, ei + 1);
    var parsed = JSON.parse(txt);
    s.vocab = Array.isArray(parsed.vocab) ? parsed.vocab : [];
    s.grammar = Array.isArray(parsed.grammar) ? parsed.grammar : [];
    s.key_expressions = Array.isArray(parsed.key_expressions) ? parsed.key_expressions : [];
    s.comprehension = Array.isArray(parsed.comprehension) ? parsed.comprehension : [];
    try {
      localStorage.setItem(_storyAiCacheKey(s.id), JSON.stringify({
        vocab: s.vocab, grammar: s.grammar,
        key_expressions: s.key_expressions, comprehension: s.comprehension
      }));
    } catch(e) {}
    // Close the history entry we pushed so re-opening doesn't double-stack
    if (_stOverlayOpen && history.state && history.state.storyOverlay) {
      _stOverlayOpen = false;
      try { history.back(); } catch(e) {}
      setTimeout(function(){ openStory(s.id); }, 50);
    } else {
      openStory(s.id);
    }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '🤖 다시 시도'; }
    if (msg) msg.textContent = '실패: ' + (e.message || e);
  }
}

    if (Array.isArray(s.hover_extras)) {

  }
  if (typeof window.korehanHoverRefresh === 'function') {
    setTimeout(window.korehanHoverRefresh, 80);

// ── Paragraph-card rendering: split body on blank-line boundaries
//    so a learner can read one Korean chunk, guess at meaning, then
//    tap to reveal the matching English. Korean and English bodies
//    paragraph-align by index — if counts differ (older stories
//    where translation wasn't run paragraph-by-paragraph) we fall
//    back to whatever EN we have for that index, or none.
//
//    When sentence_analysis is available (new stories), the open
//    state ALSO shows a per-sentence breakdown beneath the paragraph
//    EN: each sentence in the paragraph gets its own translation
//    plus a tight vocab/grammar list. Without this, stories only
//    showed "translation only", which is what learners complained
//    about — they want the same per-sentence depth articles offer.
function _stSplitSentencesKo(text) {
  // Use a Korean-aware split: keep the punctuation, split on .!?。?!? followed
  // by whitespace, then trim. Long quoted speech with internal punctuation
  // stays as one sentence — the AI is told to copy the exact text so the
  // sentence_analysis lookup keys on full strings.
  var raw = String(text || '');
  var parts = raw
    .replace(/([.!?。！？]+)\s+/g, '$1')
    .split('')
    .map(function (s) { return s.trim(); })
    .filter(Boolean);
  return parts.length ? parts : [raw.trim()].filter(Boolean);
}

function _stRenderSentenceAnalysis(koPara, sentenceMap) {
  if (!sentenceMap) return '';
  var koSents = _stSplitSentencesKo(koPara);
  if (!koSents.length) return '';
  var rows = koSents.map(function (ko) {
    var key = ko.replace(/\s+/g, '');
    var entry = sentenceMap[key];
    if (!entry) return '';
    var vocabHtml = (Array.isArray(entry.vocab) && entry.vocab.length)
      ? '<div class="st-sent-vocab-row">'
        + entry.vocab.map(function (v) {
            var vKo = v && (v.ko || v.word) || '';
            var vEn = v && (v.en || v.meaning) || '';
            if (!vKo) return '';
            return '<span class="st-sent-vocab-pill"><strong>' + escapeHtml(vKo) + '</strong> · ' + escapeHtml(vEn) + '</span>';
          }).filter(Boolean).join('')
        + '</div>'
      : '';
    var grammarHtml = (Array.isArray(entry.grammar) && entry.grammar.length)
      ? '<div class="st-sent-grammar-row">'
        + entry.grammar.map(function (g) {
            var gp = g && (g.pattern || g.point) || '';
            var ge = g && (g.exp || g.explanation || g.ex) || '';
            if (!gp) return '';
            return '<div class="st-sent-grammar-line"><span class="st-sent-grammar-pat">' + escapeHtml(gp) + '</span><span class="st-sent-grammar-exp">' + escapeHtml(ge) + '</span></div>';
          }).filter(Boolean).join('')
        + '</div>'
      : '';
    return '<div class="st-sent-card">'
      + '<div class="st-sent-ko">' + escapeHtml(ko) + '</div>'
      + (entry.en ? '<div class="st-sent-en">' + escapeHtml(entry.en) + '</div>' : '')
      + vocabHtml
      + grammarHtml
      + '</div>';
  }).filter(Boolean).join('');
  if (!rows) return '';
  return '<div class="st-sent-block">'
    + '<div class="st-sent-block-label">SENTENCE BREAKDOWN</div>'
    + rows
    + '</div>';
}

function _stBuildSentenceMap(sentenceAnalysis) {
  if (!Array.isArray(sentenceAnalysis) || !sentenceAnalysis.length) return null;
  var map = {};
  sentenceAnalysis.forEach(function (e) {
    if (!e || !e.ko) return;
    var key = String(e.ko).replace(/\s+/g, '');
    if (key) map[key] = e;
  });
  return Object.keys(map).length ? map : null;
}

function stRenderParagraphCards(koBody, enBody, hasEn, sentenceAnalysis) {
  var splitParas = function (s) {
    return String(s || '').split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean);
  };
  var koParas = splitParas(koBody);
  var enParas = hasEn ? splitParas(enBody) : [];
  if (!koParas.length) return '';
  var sentMap = _stBuildSentenceMap(sentenceAnalysis);
  return koParas.map(function (ko, i) {
    var en = enParas[i] || '';
    var sentBreakdown = sentMap ? _stRenderSentenceAnalysis(ko, sentMap) : '';
    var hasBreakdown = !!sentBreakdown;
    var canOpen = !!(en || hasBreakdown);
    var hint = canOpen
      ? '<span class="st-para-tap-hint">' + (hasBreakdown ? 'Tap for translation + sentence breakdown ↓' : 'Tap to reveal translation ↓') + '</span>'
      : '';
    return '<div class="st-para" '
      + (canOpen ? 'onclick="stTogglePara(this)" role="button" tabindex="0" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();stTogglePara(this);}"' : '')
      + '>'
      + '<div class="st-para-ko">' + escapeHtml(ko) + '</div>'
      + (en ? '<div class="st-para-en">' + escapeHtml(en) + '</div>' : '')
      + sentBreakdown
      + hint
      + '</div>';
  }).join('');
}

function stTogglePara(el) {
  if (!el) return;
  el.classList.toggle('is-open');
  // Update tap-hint copy so it reads "Hide" / "Reveal" depending
  // on the current state — much clearer than just flipping classes.
  var hint = el.querySelector('.st-para-tap-hint');
  if (hint) hint.textContent = el.classList.contains('is-open')
    ? 'Tap to hide translation ↑'
    : 'Tap to reveal translation ↓';
}

// ── Reading settings (font size / line height / theme).
//    Persists in localStorage so the same preferences come back
//    on every story open. Theme is applied as a class on the panel
//    so individual tweaks (sepia background etc) hit only this view.
var _ST_SETTINGS_KEY = 'kh_story_read_settings_v1';
function _stReadSettings() {
  try { return JSON.parse(localStorage.getItem(_ST_SETTINGS_KEY) || '{}') || {}; } catch (_) { return {}; }
}
function _stSaveSettings(s) {
  try { localStorage.setItem(_ST_SETTINGS_KEY, JSON.stringify(s)); } catch (_) {}
}
function stApplySettings() {
  var s = _stReadSettings();
  var panel = document.getElementById('st-panel');
  if (!panel) return;
  var fs = s.fs || '14px';
  var lh = s.lh || '1.9';
  var theme = s.theme || 'default';
  panel.style.setProperty('--st-body-fs', fs);
  panel.style.setProperty('--st-body-lh', lh);
  panel.classList.remove('st-theme-default', 'st-theme-light', 'st-theme-sepia');
  panel.classList.add('st-theme-' + theme);
  // Sync the popover toggle highlights.
  ['fs','lh','theme'].forEach(function (key) {
    var group = document.getElementById('st-set-' + key);
    if (!group) return;
    var attr = 'data-' + key;
    var val = key === 'fs' ? fs : key === 'lh' ? lh : theme;
    group.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute(attr) === val);
    });
  });
}
function stToggleSettings(ev) {
  if (ev && ev.stopPropagation) ev.stopPropagation();
  var pop = document.getElementById('st-settings-pop');
  if (!pop) return;
  var was = pop.hasAttribute('hidden');
  pop.toggleAttribute('hidden');
  if (was) {
    stApplySettings();
    // Click-anywhere-else-to-close handler. Re-attach each open so
    // we don't accumulate listeners.
    setTimeout(function () {
      function off(e) {
        if (pop.contains(e.target) || (e.target && e.target.classList && e.target.classList.contains('st-settings-btn'))) return;
        pop.setAttribute('hidden', '');
        document.removeEventListener('click', off, true);
      }
      document.addEventListener('click', off, true);
    }, 0);
  }
}
// Delegated change listener — every popover button has data-fs/lh/theme
// so one document-level handler covers all of them.
document.addEventListener('click', function (e) {
  var b = e.target && e.target.closest && e.target.closest('#st-settings-pop button');
  if (!b) return;
  var s = _stReadSettings();
  if (b.dataset.fs)    s.fs = b.dataset.fs;
  if (b.dataset.lh)    s.lh = b.dataset.lh;
  if (b.dataset.theme) s.theme = b.dataset.theme;
  _stSaveSettings(s);
  stApplySettings();
});

function stPlayAudio(text) {
  if (!text) return;
  // Try Web Speech API with Korean voice
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    utter.rate = 0.85;
    // Find Korean voice
    var voices = window.speechSynthesis.getVoices();
    var koVoice = voices.find(function(v){ return v.lang && v.lang.indexOf('ko') === 0; });
    if (koVoice) utter.voice = koVoice;
    window.speechSynthesis.speak(utter);
  }
}

}

      +'<button onclick="stPlayAudio(\''+v.ko.replace(/'/g,"\\'")+'\')" style="padding:12px 24px;background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:12px;font-size:16px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px"><i data-lucide="volume-2" class="kh-ui-icon kh-ui-icon-sm" aria-hidden="true"></i><span>Play</span></button></div>'
      +'<div style="display:flex;flex-direction:column;gap:6px">'+opts.map(function(o){
        return '<button onclick="stListenPick(this,\''+o.replace(/'/g,"\\'")+'\',\''+v.en.replace(/'/g,"\\'")+'\')" style="padding:10px 14px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;text-align:left">'+o+'</button>';

function closeSt(fromPop) {

    var _curS = window._currentStory;
    var scrollEl = document.querySelector('#st-panel .st-body-scroll');
    if (_curS && _curS.id != null && scrollEl) {
      khStoryProgressSave(_curS.id, khStoryScrollPercent(scrollEl));
    }
  } catch (_) {}

  document.getElementById('st-overlay').classList.add('hidden');

// Feed-style swipe nav between stories — mirror of conversations.
// Swipe up near bottom of the scrollable story panel → next story;
// swipe down near top → previous. Guards: must be a one-finger flick
// (no pinch), fast enough, clearly vertical, panel at the edge, and
// overlay actually open.
var _stSwipeStartY = 0;
var _stSwipeStartX = 0;
var _stSwipeStartT = 0;
var _stSwipeValid  = false;
(function hookStoryFeedSwipe() {
  document.addEventListener('touchstart', function(e) {
    if (!_stOverlayOpen) { _stSwipeValid = false; return; }
    // Pinch-to-zoom uses two fingers and each drifts vertically while
    // just resizing — treating that as a swipe was causing iPhone
    // users to keep jumping stories accidentally.
    if (!e.touches || e.touches.length !== 1) { _stSwipeValid = false; return; }
    _stSwipeStartY = e.touches[0].clientY;
    _stSwipeStartX = e.touches[0].clientX;
    _stSwipeStartT = Date.now();
    _stSwipeValid  = true;
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    if (!_stSwipeValid) return;
    _stSwipeValid = false;
    if (!_stOverlayOpen) return;
    if (!window._currentStory) return;
    if (!e.changedTouches || !e.changedTouches.length) return;
    // Other fingers still down? Mid-pinch, skip.
    if (e.touches && e.touches.length > 0) return;
    var dy = _stSwipeStartY - e.changedTouches[0].clientY;
    var dx = e.changedTouches[0].clientX - _stSwipeStartX;
    var dt = Date.now() - _stSwipeStartT;
    if (dt > 600) return;
    if (Math.abs(dx) > Math.abs(dy) * 0.5) return;
    if (Math.abs(dy) < 100) return;
    var panel = document.getElementById('st-panel');
    if (!panel) return;
    // On mobile the panel is overflow:hidden and the actual scroll
    // container is either #st-overlay (short viewport) or the inner
    // .st-body-scroll column. Checking only panel.scrollTop kept
    // atBottom permanently false there, silently blocking swipe-nav.
    var overlay = document.getElementById('st-overlay');
    var bodyScroll = panel.querySelector('.st-body-scroll');
    var scroller = panel;
    if (overlay && overlay.scrollHeight > overlay.clientHeight + 10) scroller = overlay;
    else if (bodyScroll && bodyScroll.scrollHeight > bodyScroll.clientHeight + 10) scroller = bodyScroll;
    var atTop    = scroller.scrollTop < 60;
    var atBottom = (scroller.scrollTop + scroller.clientHeight) >= scroller.scrollHeight - 120;
    // Pick pool from the currently visible story cards (honors the
    // active mood/level filter). Falls back to STORIES if the card
    // grid isn't queryable.
    var pool = [];
    try {
      var cards = document.querySelectorAll('.sc[data-story-id], .sc[onclick*="openStory"]');
      cards.forEach(function(el) {
        var m = (el.getAttribute('onclick') || '').match(/openStory\(['"]([^'"]+)['"]\)/);
        if (m) {
          var s = STORIES.find(function(x){ return String(x.id) === m[1]; });
          if (s) pool.push(s);
        }
      });
    } catch(e) {}
    if (!pool.length) pool = STORIES.slice();
    var curId = String(window._currentStory.id);
    var curPos = pool.findIndex(function(x){ return String(x.id) === curId; });
    if (dy > 0 && atBottom) {
      var nx = pool[curPos + 1];
      if (nx) _stNavigateTo(nx.id, 'forward');
    } else if (dy < 0 && atTop) {
      var pv = pool[curPos - 1];
      if (pv) _stNavigateTo(pv.id, 'back');
    }
  }, { passive: true });
})();

// Animated hand-off between stories — mirrors _convNavigateTo /
// _khSpaLoadArticle. openStory() continues to handle loading +
// rendering; this just wraps it in a leave/enter animation so the
// swap is visible instead of feeling like a stutter.
function _stNavigateTo(id, direction) {
  var panel = document.getElementById('st-panel');
  if (!panel) { openStory(id); return; }
  if (panel.classList.contains('kh-modal-leaving') || panel.classList.contains('kh-modal-leaving-back')) return;
  direction = direction === 'back' ? 'back' : 'forward';
  var leaveClass = direction === 'back' ? 'kh-modal-leaving-back' : 'kh-modal-leaving';
  var enterClass = direction === 'back' ? 'kh-modal-entering-back' : 'kh-modal-entering';
  panel.classList.add(leaveClass);
  setTimeout(function() {
    openStory(id);
    _stPanelScrollReset();
    document.body.classList.remove('kh-feed-pill-on');
    var p = document.getElementById('st-panel');
    if (!p) return;
    p.classList.remove(leaveClass);
    p.classList.add(enterClass);
    setTimeout(function(){ p.classList.remove(enterClass); }, 340);
  }, 220);
}

// Bottom-centered "Next story" pill, same chrome as the article and
// conversations variants. Reveal is wired below via the overlay's
// scroll listener.
function _ensureStoryNextPill() {
  if (document.getElementById('kh-story-next-pill')) return;
  var pill = document.createElement('button');
  pill.id = 'kh-story-next-pill';
  pill.type = 'button';
  pill.className = 'kh-next-pill';
  pill.setAttribute('aria-label', 'Next story');
  pill.innerHTML =
      '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>'
    + '<span>Next story</span>';
  pill.onclick = function(e) {
    e.preventDefault();
    if (!window._currentStory) return;
    // Rebuild the same pool the swipe handler uses so pill-next and
    // swipe-next agree on what "next" means (respects active filters).
    var pool = [];
    try {
      var cards = document.querySelectorAll('.sc[data-story-id], .sc[onclick*="openStory"]');
      cards.forEach(function(el) {
        var m = (el.getAttribute('onclick') || '').match(/openStory\(['"]([^'"]+)['"]\)/);
        if (m) {
          var s = STORIES.find(function(x){ return String(x.id) === m[1]; });
          if (s) pool.push(s);
        }
      });
    } catch(e) {}
    if (!pool.length) pool = STORIES.slice();
    var curId = String(window._currentStory.id);
    var curPos = pool.findIndex(function(x){ return String(x.id) === curId; });
    var nx = pool[curPos + 1];
    if (nx) _stNavigateTo(nx.id, 'forward');
  };
  document.body.appendChild(pill);
}

// Reveal the pill once the user has scrolled 80% through the story.
// On mobile the scroll container is #st-overlay (panel itself is
// overflow:hidden); on desktop the body column inside the panel
// scrolls. Checking both keeps the threshold reliable across layouts.
(function hookStoryPillReveal() {
  function update() {
    if (!_stOverlayOpen) { document.body.classList.remove('kh-feed-pill-on'); return; }
    var overlay = document.getElementById('st-overlay');
    var panel = document.getElementById('st-panel');
    var bodyScroll = panel ? panel.querySelector('.st-body-scroll') : null;
    var ratio = 0;
    if (overlay && overlay.scrollHeight > overlay.clientHeight + 10) {
      ratio = (overlay.scrollTop + overlay.clientHeight) / overlay.scrollHeight;
    } else if (bodyScroll && bodyScroll.scrollHeight > bodyScroll.clientHeight + 10) {
      ratio = (bodyScroll.scrollTop + bodyScroll.clientHeight) / bodyScroll.scrollHeight;
    } else if (panel && panel.scrollHeight > panel.clientHeight + 10) {
      ratio = (panel.scrollTop + panel.clientHeight) / panel.scrollHeight;
    } else {
      ratio = 1;
    }
    document.body.classList.toggle('kh-feed-pill-on', ratio > 0.8);
  }
  ['scroll', 'touchmove'].forEach(function(ev) {
    document.addEventListener(ev, function(e) {
      if (!_stOverlayOpen) return;
      var t = e.target;
      if (!t || !(t === document || t.id === 'st-overlay' || t.id === 'st-panel' || (t.closest && t.closest('#st-panel')))) return;
      update();
    }, { passive: true });
  });
  window._stPillSync = update;
})();

// After a feed-style swipe re-renders #st-panel for a different
// story, the scroll position is still wherever the user released
// their finger — which means they land mid-body or on the learning
// elements of the new story. Jump to the top so every nav feels
// like a fresh story open, not a continuation of the previous
// scroll. On mobile the actual scroll container is #st-overlay
// (overflow-y:auto) because #st-panel itself has overflow:hidden,
// so resetting only panel.scrollTop had no visible effect. We also
// run the reset on the next frame because browsers try to preserve
// scroll position across innerHTML replacement.
function _stPanelScrollReset() {
  function reset() {
    var overlay = document.getElementById('st-overlay');
    var panel = document.getElementById('st-panel');
    if (overlay) overlay.scrollTop = 0;
    if (panel) {
      panel.scrollTop = 0;
      var bodyScroll = panel.querySelector('.st-body-scroll');
      if (bodyScroll) bodyScroll.scrollTop = 0;
      var right = panel.querySelector('.st-right');
      if (right) right.scrollTop = 0;
    }
    window.scrollTo(0, 0);
  }
  reset();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(reset);
}

// Mobile-only Read / Learn tabs for the story detail. Desktop keeps
// its 2-column layout untouched. Toggles a body class on #st-panel;
// the CSS (stories.html style block) uses it to hide either the
// story body or the study-notes panel under the 900px breakpoint.
function stSwitchTab(tab) {
  var panel = document.getElementById('st-panel');
  if (!panel) return;
  panel.classList.remove('st-mobile-tab-read', 'st-mobile-tab-learn');
  panel.classList.add('st-mobile-tab-' + tab);
  panel.querySelectorAll('.st-tab-btn').forEach(function(b) {
    b.classList.toggle('on', b.dataset.tab === tab);
  });
  panel.scrollTop = 0;
  window.scrollTo(0, 0);
}

// activeMood replaced by activeGenre in renderStories()

async function loadStoriesFromDB() {
  var grid = document.getElementById('st-grid');
  // Show skeleton loader while fetching
  grid.innerHTML = '<div style="grid-column:1/-1;display:flex;align-items:center;gap:10px;color:#64748b;font-size:13px;padding:32px 0">'
    + '<svg style="animation:spin .8s linear infinite;flex-shrink:0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>'
    + '<span>Loading story…</span></div>';
  try {
    var sb = typeof getSupa === 'function' ? getSupa() : null;
    if (!sb) throw new Error('Supabase 연결 없음');
    var { data, error } = await sb.from('stories_data').select('*').order('created_at', {ascending: false}).limit(60);
    if (error) throw error;
    if (data && data.length) {
      var dbStories = data.map(function(row) {
        var d = row.data;
        if (typeof d === 'string') { try { d = JSON.parse(d); } catch(e) { d = null; } }
        var story = d || row;
        if (!story || !story.title) return null;
        return Object.assign({}, story, {
          id: row.id,  // SQL PK only — guarantees home → story deep links match
          genre: row.genre || story.genre || story.mood || 'slice_of_life',
          perspective: row.perspective || story.perspective || 'third',
          series_id: row.series_id || story.series_id || null,
          episode: row.episode || story.episode || 0,
          episode_title: row.episode_title || story.episode_title || '',
          character_slugs: row.character_slugs || story.character_slugs || [],
          cliffhanger: row.cliffhanger || story.cliffhanger || '',
          author_slug: story.author_slug || (typeof pickCharacterSlug === 'function' ? pickCharacterSlug(String(row.id) + '-story') : '')
        });
      }).filter(Boolean);
      // Use DB stories only — hardcoded fallbacks removed (they lack proper IDs and don't open)
      STORIES.length = 0;
      dbStories.forEach(function(s){ STORIES.push(s); });
    }
    // Phase 2: kick off favorites + in-progress fetches before render
    // so the rails show on first paint instead of popping in.
    try {
      var _stPhase2Loads = [khStoryFavLoadAll(), khStoryProgressRecent(8)];
      Promise.all(_stPhase2Loads).then(function (results) {
        window._khStoryProgressRecent = results[1] || [];
        renderStories();
      }).catch(function () { renderStories(); });
    } catch (_) { /* fall through to normal render below */ }
    renderStories();
    // Load series
    _loadSeries();
  } catch(e) {
    console.warn('loadStoriesFromDB failed:', e.message || e);
    renderStories();
  }
}

async function _loadSeries() {
  try {
    var sb = typeof getSupa === 'function' ? getSupa() : null;
    if (!sb) return;
    var { data } = await sb.from('story_series').select('*').eq('is_active', true).order('sort_order');
    _storySeries = data || [];
    renderSeriesSection();
  } catch(e) {}
}

document.addEventListener('DOMContentLoaded', function() {
  loadStoriesFromDB();
  var pills = document.getElementById('mood-pills');
  // Genre filters
  pills.querySelectorAll('.sf-pill[data-genre]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      pills.querySelectorAll('.sf-pill[data-genre]').forEach(function(b){ b.classList.remove('on'); });
      btn.classList.add('on');
      activeGenre = btn.dataset.genre;
      renderStories();
    });
  });
  // Level filters
  pills.querySelectorAll('.sf-pill[data-lvl]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      pills.querySelectorAll('.sf-pill[data-lvl]').forEach(function(b){ b.classList.remove('on'); });
      btn.classList.add('on');
      activeLvl = btn.dataset.lvl;
      renderStories();
    });
  });
  // Perspective filters
  pills.querySelectorAll('.sf-pill[data-perspective]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      pills.querySelectorAll('.sf-pill[data-perspective]').forEach(function(b){ b.classList.remove('on'); });
      btn.classList.add('on');
      activePerspective = btn.dataset.perspective;
      renderStories();
    });
  });
  var params = new URLSearchParams(window.location.search);
  var gp = params.get('genre');
  if (gp) { var t = pills.querySelector('[data-genre="'+gp+'"]'); if(t) t.click(); }
  // Deep-link: ?id=<storyId> auto-opens the story detail once data is loaded
  var idParam = params.get('id');
  if (idParam) {
    var tries = 0;
    var iv = setInterval(function() {
      tries++;
      if (STORIES && STORIES.length && STORIES.find(function(x){ return String(x.id) === String(idParam); })) {
        clearInterval(iv);
        openStory(idParam);
      } else if (tries > 40) {
        clearInterval(iv);
      }
    }, 150);
  }
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSt(); });

// ── STORY BLANK FILL ─────────────────────────────────────────
function startStoryBlank() {
  var s = window._currentStory;
  if (!s) return;
  var vocab = (s.vocab || []).filter(function(v){ return v.ko && v.ko.length > 1; });
  if (!vocab.length) { toast('이 스토리에 단어 데이터가 없습니다.'); return; }

  // 스토리 body에서 단어 찾아 빈칸
  var body = (s.body || '').replace(/<[^>]*>/g, '');
  var sentences = body.split(/[.。\n]/).filter(function(s){ return s.trim().length > 5; }).slice(0,8);
  var questions = [];
  vocab.forEach(function(v) {
    var sent = sentences.find(function(s){ return s.includes(v.ko); });
    if (sent && questions.length < 4) {
      questions.push({ original: sent.trim(), word: v.ko, en: v.en, who: '' });
    }
  });
  if (!questions.length) {
    questions = vocab.slice(0,4).map(function(v){
      return { original: '이 단어의 뜻은? → ' + v.en, word: v.ko, en: v.en, who: '' };
    });
  }
  showStoryQuiz('blank', questions, s.title);
}

function startStoryOrder() {
  var s = window._currentStory;
  if (!s) return;
  var body = (s.body || '').replace(/<[^>]*>/g, '');
  var sentences = body.split(/[.。\n]/).filter(function(t){ return t.trim().length > 8; }).slice(0, 6);
  if (sentences.length < 3) { toast('이 스토리는 순서 퀴즈를 만들기에 너무 짧습니다.'); return; }
  var questions = [];
  for (var i = 0; i + 2 < sentences.length; i++) {
    questions.push({ msgs: sentences.slice(i, i+3).map(function(t){ return {txt: t.trim(), who:''}; }) });
    if (questions.length >= 3) break;
  }
  showStoryQuiz('order', questions, s.title);
}

function showStoryQuiz(mode, questions, title) {
  // conversations의 showQuizModal 공유
  _storyQuizMode = true;
  if (typeof showQuizModal === 'function') {
    showQuizModal(mode, questions, title);
    return;
  }
  // fallback - inline quiz
  var overlay = document.getElementById('st-quiz-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'st-quiz-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:3000;display:flex;align-items:center;justify-content:center;padding:16px;';
    document.body.appendChild(overlay);
  }
  overlay.style.display = 'flex';
  var panel = document.getElementById('st-panel'); if (panel) panel.style.filter='blur(10px)';
  var html = '<div style="background:#fff;border-radius:24px;max-width:520px;width:100%;padding:32px;box-shadow:0 32px 80px rgba(15,23,42,.25);text-align:center;">';
  html += '<div style="display:inline-flex;width:38px;height:38px;margin-bottom:12px;color:#a78bfa"><i data-lucide="' + (mode==='blank'?'pencil':'shuffle') + '" class="kh-ui-icon" style="width:38px;height:38px" aria-hidden="true"></i></div>';
  html += '<div style="font-size:18px;font-weight:700;margin-bottom:8px">' + title + '</div>';
  if (mode === 'blank') {
    html += '<div style="font-size:14px;color:#64748b;margin-bottom:20px">Fill in the missing word.</div>'; 
    questions.slice(0,1).forEach(function(q) {
      html += '<div style="background:#f8fafc;border-radius:12px;padding:16px;font-size:15px;line-height:1.8;margin-bottom:14px;text-align:left;">' 
        + q.original.replace(q.word, '<b style="color:#2563eb;background:#dbeafe;border-radius:6px;padding:1px 8px;">___</b>') 
        + '</div>';
      html += '<div style="color:#94a3b8;font-size:13px;margin-bottom:4px">힌트: ' + q.en + '</div>';
      html += '<div style="font-size:13px;font-weight:700;color:#2563eb;margin-top:8px">Answer hidden until you check the original text.</div>'; 
    });
  } else {
    html += '<div style="font-size:14px;color:#64748b;margin-bottom:16px">Which order makes the story flow naturally?</div>'; 
    var shuffled = questions[0].msgs.slice().sort(function(){ return Math.random()-.5; });
    shuffled.forEach(function(m, i) {
      html += '<div style="background:#f8fafc;border:2px solid #e2e8f0;border-radius:10px;padding:10px 14px;margin-bottom:6px;text-align:left;font-family:\'Noto Sans KR\',sans-serif;">' 
        + (i+1) + '. ' + m.txt + '</div>';
    });
    html += '<div style="font-size:13px;color:#94a3b8;margin-top:10px">Tip: read carefully first — the background story is blurred while you solve it.</div>'; 
  }
  html += '<button onclick="document.getElementById(\'st-quiz-overlay\').style.display=\'none\';var panel=document.getElementById(\'st-panel\');if(panel)panel.style.filter=\'\'" style="margin-top:20px;padding:12px 28px;border-radius:12px;background:#2563eb;color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;">Close</button>'; 
  html += '</div>';
  overlay.innerHTML = html;
}
var _storyQuizMode = false;

</script>
