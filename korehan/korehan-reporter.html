<style>
/* ── Layout ── */
body {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}
.rp-page-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  filter: saturate(1.05) brightness(.78);
  transform: scale(1.02);
}
.rp-page-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(4,16,44,.58) 0%, rgba(8,14,28,.7) 60%, rgba(8,14,28,.84) 100%);
}
.rp-content-layer { position: relative; z-index: 1; }
.rp-wrap { max-width: 960px; margin: 0 auto; padding: 36px 20px 60px; }

/* ── Profile card ── */
.rp-profile {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 36px;
  background: #fff;
  border-radius: 28px;
  border: 1px solid #e8eef7;
  box-shadow: 0 8px 32px rgba(15,23,42,.07);
  overflow: hidden;
  margin-bottom: 28px;
}
.rp-photo-col {
  position: relative;
  min-height: 320px;
  overflow: hidden;
}
.rp-photo-col img, .rp-photo-ph {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  min-height: 320px;
}
.rp-photo-ph {
  display: flex; align-items: center; justify-content: center;
  font-size: 80px; font-weight: 900; color: #fff;
}
.rp-color-bar {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 6px; border-radius: 0 0 16px 16px; pointer-events: none;
}
.rp-info-col {
  padding: 32px 32px 28px 0;
  display: flex; flex-direction: column; gap: 0;
}
.rp-name {
  font-family: 'Noto Serif KR', serif;
  font-size: 30px; font-weight: 900; color: #0f172a;
  margin-bottom: 4px;
}
.rp-role-badge {
  display: inline-block;
  font-size: 12px; font-weight: 700;
  padding: 4px 12px; border-radius: 999px;
  color: #fff; margin-bottom: 20px;
}
.rp-stats {
  display: flex; gap: 28px; margin-bottom: 20px;
  flex-wrap: wrap;
}
.rp-stat { display: flex; flex-direction: column; gap: 2px; }
.rp-stat-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; }
.rp-stat-val { font-size: 16px; font-weight: 800; color: #0f172a; }
.rp-divider { height: 1px; background: #f1f5f9; margin: 16px 0; }
.rp-intro {
  font-size: 14px; line-height: 1.8; color: #475569;
  font-family: 'Noto Sans KR', sans-serif;
  flex: 1;
}
.rp-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.rp-tag {
  font-size: 11px; font-weight: 700;
  padding: 4px 12px; border-radius: 999px;
  background: #f1f5f9; color: #475569;
  border: 1px solid #e2e8f0;
}

/* ── Favorability ── */
.rp-fav-card {
  background: #fff;
  border-radius: 24px;
  border: 1px solid #e8eef7;
  box-shadow: 0 4px 20px rgba(15,23,42,.05);
  padding: 28px;
  margin-bottom: 28px;
}
.rp-fav-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.rp-fav-title { font-size: 16px; font-weight: 800; color: #0f172a; }
.rp-fav-level {
  font-size: 12px; font-weight: 700;
  padding: 4px 12px; border-radius: 999px;
  background: #f1f5f9; color: #64748b;
}
.rp-fav-bar-bg {
  height: 10px; border-radius: 999px;
  background: #f1f5f9; margin-bottom: 6px; overflow: hidden;
}
.rp-fav-bar-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, #facc15, #f97316);
  transition: width .6s ease;
}
.rp-fav-meta {
  display: flex; justify-content: space-between;
  font-size: 12px; color: #94a3b8; margin-bottom: 24px;
}
.rp-gifts {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  margin-bottom: 20px;
}
.rp-gift {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: #f8fafc; border: 1.5px solid #e2e8f0;
  border-radius: 16px; padding: 16px 8px;
  cursor: pointer; opacity: 1;
  position: relative;
  transition: transform .15s ease, box-shadow .15s ease;
}
.rp-gift:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(2,6,23,.08); }
.rp-gift.disabled { cursor:not-allowed; opacity:.55; }
.rp-gift-icon { font-size: 28px; }
.rp-gift-name { font-size: 11px; font-weight: 700; color: #475569; text-align: center; }
.rp-gift-cost {
  font-size: 11px; font-weight: 800; color: #f97316;
  background: #fff7ed; padding: 2px 8px; border-radius: 999px;
}
.rp-gift-lock {
  position: absolute; top: 8px; right: 8px;
  font-size: 11px; color: #94a3b8;
}
.rp-gift-own { font-size:10px; color:#15803d; font-weight:800; }
.rp-nyang-chip { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; background:#ecfeff; color:#0f766e; font-size:12px; font-weight:800; border:1px solid #a5f3fc; }
.rp-hire-btn {
  width: 100%; padding: 14px;
  border-radius: 14px; border: 2px dashed #e2e8f0;
  background: #f8fafc; color: #94a3b8;
  font-size: 15px; font-weight: 800;
  cursor: not-allowed;
  font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.rp-hire-progress {
  font-size: 12px; color: #94a3b8; text-align: center; margin-top: 8px;
}

/* ── Articles ── */
.rp-sec-title {
  font-size: 13px; font-weight: 800;
  text-transform: uppercase; letter-spacing: .06em;
  color: #94a3b8; margin-bottom: 14px;
}
.rp-art-list { display: flex; flex-direction: column; gap: 10px; }
.rp-art-item {
  background: #fff; border-radius: 14px;
  border: 1px solid #e8eef7; padding: 14px 18px;
  text-decoration: none; display: block;
  transition: box-shadow .15s, transform .15s;
}
.rp-art-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,.07); transform: translateY(-2px); }
.rp-art-title { font-size: 14px; font-weight: 700; color: #0f172a; line-height: 1.45; margin-bottom: 3px; font-family: 'Noto Serif KR', serif; }
.rp-art-meta { font-size: 12px; color: #94a3b8; }

/* ── Reporter body layout — single column with idol-style tabs ── */
.rp-body-grid {
  display:block;
}
.rp-main-col { min-width:0; }
.rp-side-col { min-width:0; }

/* ── Idol-style tab bar (Posts / Album / Photocards / Articles) ── */
.rp-tabbar {
  display:flex; gap:6px;
  background:#fff; border:1px solid #e8eef7; border-radius:18px;
  padding:6px; margin:0 0 18px;
  box-shadow:0 4px 20px rgba(15,23,42,.05);
  overflow-x:auto; scrollbar-width:none;
}
.rp-tabbar::-webkit-scrollbar { display:none; }
.rp-tab {
  flex:1 1 auto;
  padding:11px 14px;
  border-radius:12px; border:none; background:transparent;
  font:inherit; font-size:13px; font-weight:800;
  color:#64748b; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  white-space:nowrap;
  transition: background .15s, color .15s, transform .12s;
}
.rp-tab:hover { color:#0f172a; }
.rp-tab.on {
  background:#0f172a; color:#fff;
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(15,23,42,.18);
}
.rp-tab-count {
  font-size:11px; padding:1px 7px; border-radius:999px;
  background:rgba(15,23,42,.08); color:#64748b; font-weight:800;
}
.rp-tab.on .rp-tab-count { background:rgba(255,255,255,.18); color:#fff; }

.rp-panel { display:none; }
.rp-panel.on { display:block; animation: rpPanelIn .22s ease; }
@keyframes rpPanelIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }

/* ── Compact stat strip (favorability + nyang) under profile ── */
.rp-stat-strip {
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  background:#fff; border:1px solid #e8eef7; border-radius:16px;
  padding:12px 16px; margin:0 0 14px;
  box-shadow:0 4px 18px rgba(15,23,42,.05);
}
.rp-stat-strip-fav {
  flex:1 1 auto; min-width:160px;
  display:flex; flex-direction:column; gap:6px;
}
.rp-stat-strip-bar {
  position:relative; height:8px; border-radius:999px; background:#f1f5f9; overflow:hidden;
}
.rp-stat-strip-bar-fill {
  position:absolute; inset:0 auto 0 0; border-radius:999px;
  transition: width .35s ease;
}
.rp-stat-strip-row {
  display:flex; justify-content:space-between; align-items:center;
  font-size:11px; color:#64748b; font-weight:700;
}
.rp-stat-strip-row b { color:#0f172a; font-size:12px; font-weight:900; }

/* ── Album grid (Instagram-style 3-col image grid) ── */
.rp-album-grid {
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:4px;
}
@media (min-width: 640px) {
  .rp-album-grid { gap:6px; grid-template-columns: repeat(4, 1fr); }
}
@media (min-width: 960px) {
  .rp-album-grid { grid-template-columns: repeat(5, 1fr); }
}
.rp-album-tile {
  position:relative; aspect-ratio:1/1; overflow:hidden;
  background:#0f172a; cursor:zoom-in;
  border-radius:6px;
}
.rp-album-tile img {
  width:100%; height:100%; object-fit:cover; display:block;
  transition: transform .25s ease;
}
.rp-album-tile:hover img { transform: scale(1.05); }
.rp-album-empty {
  text-align:center; padding:48px 20px; color:#64748b; font-size:13px;
  background:#fff; border:1px dashed #cbd5e1; border-radius:14px;
}

/* ── Photocards (idol photocard tiles) ── */
.rp-pc-grid {
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:14px;
}
@media (min-width: 480px) {
  .rp-pc-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 720px) {
  .rp-pc-grid { grid-template-columns: repeat(4, 1fr); }
}
.rp-pc {
  position:relative;
  aspect-ratio: 2/3;
  border-radius:18px;
  overflow:hidden;
  border:3px solid #fff;
  box-shadow: 0 12px 28px rgba(15,23,42,.22), 0 0 0 1px rgba(15,23,42,.08);
  background:#0f172a;
  cursor:zoom-in;
  transition: transform .2s ease, box-shadow .2s ease;
}
.rp-pc:hover { transform: translateY(-4px) rotate(-1deg); box-shadow: 0 18px 36px rgba(15,23,42,.32), 0 0 0 1px rgba(15,23,42,.08); }
.rp-pc-img {
  position:absolute; inset:0;
  background-size:cover; background-position:center top;
}
.rp-pc-fade {
  position:absolute; inset:auto 0 0 0; height:60%;
  background: linear-gradient(180deg, rgba(8,14,28,0) 0%, rgba(8,14,28,.55) 55%, rgba(8,14,28,.92) 100%);
}
.rp-pc-edge {
  position:absolute; top:0; left:0; right:0; height:5px;
}
.rp-pc-body {
  position:absolute; left:0; right:0; bottom:0;
  padding:14px 14px 14px;
  color:#fff;
}
.rp-pc-num {
  position:absolute; top:10px; right:12px;
  font-family:'Source Sans 3', system-ui, sans-serif;
  font-size:11px; font-weight:900; letter-spacing:.18em;
  color:rgba(255,255,255,.85);
  text-shadow:0 1px 2px rgba(0,0,0,.4);
}
.rp-pc-tag {
  display:inline-block;
  font-size:9px; font-weight:900; letter-spacing:.16em; text-transform:uppercase;
  padding:3px 8px; border-radius:999px;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.32);
  backdrop-filter: blur(4px);
  margin-bottom:6px;
}
.rp-pc-name {
  font-family:'Noto Serif KR', serif;
  font-size:18px; font-weight:900; line-height:1.15;
  margin:0;
  text-shadow: 0 2px 8px rgba(0,0,0,.45);
}
.rp-pc-role {
  font-size:10px; font-weight:700; letter-spacing:.04em;
  color:rgba(255,255,255,.85); margin-top:3px;
  text-shadow: 0 1px 3px rgba(0,0,0,.45);
}
.rp-pc-ph {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Noto Serif KR', serif; font-size:88px; font-weight:900; color:#fff;
}
.rp-pc-empty {
  text-align:center; padding:48px 20px; color:#64748b; font-size:13px;
  background:#fff; border:1px dashed #cbd5e1; border-radius:14px;
}

.rp-post-compose {
  background:#fff; border:1px solid #e8eef7; border-radius:22px; padding:18px; margin-bottom:14px;
  box-shadow:0 4px 18px rgba(15,23,42,.05);
}
.rp-post-compose textarea {
  width:100%; min-height:92px; resize:vertical; border:1px solid #e2e8f0; border-radius:14px;
  padding:12px; font:inherit; font-size:14px; color:#0f172a; background:#f8fafc;
}
.rp-post-compose-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
.rp-post-select, .rp-post-file {
  border:1px solid #dbe5f2; border-radius:10px; padding:8px 10px; background:#fff; font:inherit; font-size:12px;
}
.rp-post-btn {
  border:1px solid #0f172a; background:#0f172a; color:#fff; border-radius:10px; padding:8px 12px; font-size:12px; font-weight:800; cursor:pointer;
}
.rp-post-btn.ghost { background:#fff; color:#334155; border-color:#dbe5f2; }
.rp-post-feed { display:flex; flex-direction:column; gap:12px; }
.rp-post-card {
  background:#fff; border:1px solid #e8eef7; border-radius:18px; overflow:hidden;
  box-shadow:0 4px 18px rgba(15,23,42,.04);
}
.rp-post-head { display:flex; justify-content:space-between; gap:12px; padding:14px 16px 8px; }
.rp-post-meta { font-size:11px; color:#94a3b8; }
.rp-post-pin { font-size:11px; color:#f97316; font-weight:900; }
.rp-post-content { padding:0 16px 12px; color:#1e293b; font-size:14px; line-height:1.7; white-space:pre-wrap; }
.rp-post-images {
  display:grid; gap:4px; grid-template-columns: repeat(2, 1fr);
}
.rp-post-images img { width:100%; height:220px; object-fit:cover; display:block; cursor:zoom-in; }
.rp-post-images.one { grid-template-columns:1fr; }
.rp-post-images.one img { height:360px; }
.rp-post-foot {
  padding:10px 16px 14px; display:flex; justify-content:space-between; align-items:center; border-top:1px solid #f1f5f9;
}
.rp-post-status { font-size:11px; color:#64748b; font-weight:700; }
.rp-post-actions { display:flex; gap:8px; }
.rp-post-act {
  border:1px solid #dbe5f2; background:#fff; color:#334155; border-radius:8px; padding:5px 10px; font-size:11px; font-weight:800; cursor:pointer;
}
.rp-post-empty {
  background:#ffffffcc; border:1px dashed #cbd5e1; border-radius:14px; padding:20px; text-align:center; color:#94a3b8; font-size:13px;
}

/* ── Loading / Error ── */
.rp-loading { text-align: center; padding: 80px 20px; color: #94a3b8; font-size: 15px; }
.rp-not-found { text-align: center; padding: 80px 20px; }
.rp-not-found h2 { font-size: 22px; color: #0f172a; margin-bottom: 8px; }
.rp-not-found p { color: #64748b; }

/* ── Lightbox ── */
#rp-lb { display:none; position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:9999; align-items:center; justify-content:center; cursor:zoom-out; }
#rp-lb.on { display:flex; }
#rp-lb img { max-width:90vw; max-height:90vh; border-radius:16px; box-shadow:0 24px 80px rgba(0,0,0,.6); object-fit:contain; }
.rp-photo-col { cursor:zoom-in; }

/* ── Mobile ── */
@media(max-width: 640px) {
  .rp-profile { grid-template-columns: 1fr; }
  .rp-photo-col { min-height: 240px; max-height: 260px; }
  .rp-info-col { padding: 24px 20px 24px; }
  .rp-gifts { grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .rp-gift { padding: 12px 4px; }
  .rp-gift-icon { font-size: 22px; }
  .rp-post-images img { height:170px; }
  .rp-post-images.one img { height:240px; }
  .rp-body-grid { grid-template-columns: 1fr; }
  .rp-side-col { position: static; }
  /* Tab bar: compact icons on the smallest screens so 4 labels still
     fit in a single row without horizontal scroll bars dominating. */
  .rp-tab { padding:10px 10px; font-size:12px; }
  .rp-tabbar { padding:5px; gap:4px; border-radius:14px; }
  .rp-stat-strip { padding:10px 12px; gap:8px; }
}
</style>

<script>
var FAV_HIRE_THRESHOLD = 3000;
var REPORTER_BG_DEFAULT = 'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=2200&q=80';
var _giftCatalog = [];
var _giftOwnedMap = {};
var _giftBalance = 0;
var _currentReporterId = '';
var _currentAffinityXP = 0;
var _currentReporter = null;
var _canManagePosts = false;
var _postDraftFiles = [];
var _editingPostId = null;
var _postCache = [];
var _postMode = 'db'; // db | fallback
var _giftHistoryEnabled = true;

function _postModeKey() { return 'kh_reporter_posts_mode'; }
function getPostModePref() {
  try { return localStorage.getItem(_postModeKey()) || 'db'; } catch(e) { return 'db'; }
}
function setPostModePref(mode) {
  try { localStorage.setItem(_postModeKey(), mode); } catch(e) {}
}
function shouldUseGiftHistory() {
  if (!_giftHistoryEnabled) return false;
  try {

// Idol-style tab switching: toggle .on between buttons and panels.
// Panel rendering is lazy — Posts loads automatically (initReporterPosts),
// Album + Photocards hydrate from the cached _postCache when first opened,
// Articles is loaded by loadReporterArticles in the main entry.
window.rpSwitchTab = function(tab) {
  document.querySelectorAll('.rp-tab').forEach(function(b){
    var on = b.dataset.tab === tab;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('.rp-panel').forEach(function(p){
    p.classList.toggle('on', p.id === 'rp-panel-' + tab);
  });
  if (tab === 'album')      rpRenderAlbum();
  if (tab === 'photocards') rpRenderPhotocards();
};

// Album: every post image flattened into a square Instagram-style grid.
// Pulls from _postCache (already loaded by initReporterPosts) so there's
// no extra round-trip. Updates the tab badge count too.
function rpRenderAlbum() {
  var root = document.getElementById('rp-album-root');
  var countEl = document.getElementById('rp-tab-c-album');
  if (!root) return;
  var imgs = [];
  (_postCache || []).forEach(function(p) {
    if (Array.isArray(p.images)) p.images.forEach(function(u){ if (u) imgs.push(u); });
  });
  if (countEl) countEl.textContent = imgs.length ? imgs.length : '';
  if (!imgs.length) {
    root.innerHTML = '<div class="rp-album-empty">아직 사진이 없습니다. Posts 탭에서 사진을 올려보세요.</div>';
    return;
  }
  root.innerHTML = '<div class="rp-album-grid">'
    + imgs.map(function(u){
        return '<div class="rp-album-tile" onclick="rpOpenPostImage(&quot;' + escHtml(u) + '&quot;)">'
          + '<img src="' + escHtml(u) + '" loading="lazy" alt="">'
          + '</div>';
      }).join('')
    + '</div>';
}

// Photocards: the reporter's official profile shot + every published
// post image gets framed as an idol photocard. Numbered 001/N onward
// so collectors get a "set" feel. Single image (reporter.image only)
// is fine — that's the official card.
function rpRenderPhotocards() {
  var root = document.getElementById('rp-pc-root');
  var countEl = document.getElementById('rp-tab-c-pc');
  if (!root || !_currentReporter) return;
  var r = _currentReporter;
  var color = r.color || '#2563eb';

  // Build the card list: official first (reporter.image), then one per
  // post image. Each entry → { src, tag, num } shape the renderer uses.
  var cards = [];
  if (r.image) {
    cards.push({ src: r.image, tag: 'OFFICIAL', num: 1 });
  }
  (_postCache || []).forEach(function(p) {
    (p.images || []).forEach(function(u) {
      if (u && u !== r.image) cards.push({ src: u, tag: 'BEHIND', num: cards.length + 1 });
    });
  });

  if (countEl) countEl.textContent = cards.length ? cards.length : '';
  if (!cards.length) {
    root.innerHTML = '<div class="rp-pc-empty">아직 포카가 없습니다. 기자가 사진을 올리면 포카가 생성됩니다.</div>';
    return;
  }

  var total = cards.length;
  root.innerHTML = '<div class="rp-pc-grid">'
    + cards.map(function(c, i) {
        var num = String(c.num).padStart(3, '0');
        var imgLayer = c.src
          ? '<div class="rp-pc-img" style="background-image:url(\'' + escHtml(c.src) + '\')"></div>'
          : '<div class="rp-pc-ph" style="background:' + color + '">' + escHtml(r.name.charAt(0)) + '</div>';
        return '<div class="rp-pc" onclick="rpOpenPostImage(&quot;' + escHtml(c.src) + '&quot;)">'
          + imgLayer
          + '<div class="rp-pc-edge" style="background:' + color + '"></div>'
          + '<div class="rp-pc-fade"></div>'
          + '<div class="rp-pc-num">' + num + ' / ' + String(total).padStart(3, '0') + '</div>'
          + '<div class="rp-pc-body">'
          +   '<span class="rp-pc-tag">' + escHtml(c.tag) + '</span>'
          +   '<h3 class="rp-pc-name">' + escHtml(r.name) + '</h3>'
          +   '<div class="rp-pc-role">' + escHtml(r.role || '') + '</div>'
          + '</div>'
          + '</div>';
      }).join('')
    + '</div>';
}

function canManageReporterPosts(reporter) {

  return !!linked && String(linked) === String(supaUser.id);

function escHtml(t){ return String(t || '').replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); }

// Smart "← 뒤로가기" target. The old javascript:history.back() did the
// literal browser-back, which on the common path (home → all reporters
// → reporter detail) lands the user on the all-reporters list rather
// than where they actually started — owner-reported as "뒤로가기 하면
// 뒤로 안가고 전체 기자 페이지가 나옴". Heuristic:
//   1. If we came directly from the all-reporters list AND we stashed
//      the page that preceded it (kh_rp_pre_list, set by reporters.html
//      on its own load), navigate straight there.
//   2. Otherwise, do the standard history.back() if there's anything
//      to go back to.
//   3. Final fallback: home page.
window.rpGoBack = function (e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  var ref = document.referrer || '';
  if (/korehan-reporters\.html/i.test(ref)) {
    var pre = '';
    try { pre = sessionStorage.getItem('kh_rp_pre_list') || ''; } catch (_) {}
    if (pre) {
      try {
        var u = new URL(pre, window.location.origin);
        if (u.origin === window.location.origin && !/korehan-reporter(s)?\.html/i.test(u.pathname)) {
          window.location.href = u.pathname + u.search + u.hash;
          return;
        }
      } catch (_) {}
    }
    window.location.href = 'index.html';
    return;
  }
  if (window.history.length > 1) { window.history.back(); return; }
  window.location.href = 'index.html';
};

function formatPostTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleString('ko-KR', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function isMissingReporterPostsTableError(err) {
  var msg = String(err && (err.message || err.details || err.hint || err.code) || '').toLowerCase();
  return msg.indexOf('reporter_posts') >= 0 || msg.indexOf('reporter_post_images') >= 0 || msg.indexOf('pgrst') >= 0 || msg.indexOf('404') >= 0;
}

function _fallbackPostsKey(reporterId) {
  return 'reporter_posts_fallback_' + reporterId;
}

async function loadFallbackReporterPosts(sb, reporterId) {
  var localPosts = [];
  try { localPosts = JSON.parse(localStorage.getItem('kh_rp_posts_' + reporterId) || '[]'); } catch(e) { localPosts = []; }
  try {
    if (!sb) return localPosts;
    var key = _fallbackPostsKey(reporterId);
    var res = await sb.from('app_settings').select('value').eq('key', key).maybeSingle();
    if (res.error) return localPosts.length ? localPosts : [];
    var raw = res.data && res.data.value ? res.data.value : '[]';
    var arr = Array.isArray(raw) ? raw : JSON.parse(raw || '[]');
    arr = Array.isArray(arr) ? arr : [];
    // Merge: use whichever has more posts (server or local)
    return arr.length >= localPosts.length ? arr : localPosts;
  } catch(e) {
    return localPosts;
  }
}

async function saveFallbackReporterPosts(sb, reporterId, posts) {
  var postsJson = JSON.stringify(posts || []);
  // Always save to localStorage as backup
  try { localStorage.setItem('kh_rp_posts_' + reporterId, postsJson); } catch(e) {}
  if (!sb) return false;
  try {
    var key = _fallbackPostsKey(reporterId);
    var payload = { key:key, value:postsJson, updated_at:new Date().toISOString() };
    var res = await sb.from('app_settings').upsert(payload, { onConflict:'key' });
    return !res.error;
  } catch(e) {
    return false;
  }
}

// Also load from localStorage as secondary fallback


async function loadReporterPosts(reporterId) {
  var feed = document.getElementById('rp-post-feed');
  if (!feed) return;
  var sb = getSupa();
  if (!sb) { feed.innerHTML = '<div class="rp-post-empty">Posts를 불러올 수 없습니다.</div>'; return; }
  try {
    if (_postMode === 'fallback') {
      var fp = await loadFallbackReporterPosts(sb, reporterId);
      fp = fp.filter(function(p){ return _canManagePosts || p.status === 'published'; });
      fp.sort(function(a,b){ return Number(!!b.pinned) - Number(!!a.pinned) || String(b.created_at||'').localeCompare(String(a.created_at||'')); });
      _postCache = fp;
      renderReporterPosts(fp);
      return;
    }

    var q = sb.from('reporter_posts')
      .select('id,reporter_id,author_user_id,content,post_type,status,pinned,created_at,updated_at')
      .eq('reporter_id', reporterId)
      .order('pinned', { ascending:false })
      .order('created_at', { ascending:false });
    if (!_canManagePosts) q = q.eq('status', 'published');
    var res = await q;
    if (res.error) throw res.error;
    var posts = res.data || [];
    var ids = posts.map(function(p){ return p.id; });
    var imgMap = {};
    if (ids.length) {
      var ir = await sb.from('reporter_post_images').select('id,post_id,image_url,sort_order').in('post_id', ids).order('sort_order', { ascending:true });
      if (ir.error && isMissingReporterPostsTableError(ir.error)) throw ir.error;
      if (!ir.error) {
        (ir.data || []).forEach(function(im){
          if (!imgMap[im.post_id]) imgMap[im.post_id] = [];
          imgMap[im.post_id].push(im.image_url);
        });
      }
    }
    posts.forEach(function(p){ p.images = imgMap[p.id] || []; });
    _postMode = 'db';
    setPostModePref('db');
    _postCache = posts;
    renderReporterPosts(posts);
  } catch(e) {
    if (isMissingReporterPostsTableError(e)) {
      _postMode = 'fallback';
      setPostModePref('fallback');
      var fposts = await loadFallbackReporterPosts(sb, reporterId);
      fposts = fposts.filter(function(p){ return _canManagePosts || p.status === 'published'; });
      fposts.sort(function(a,b){ return Number(!!b.pinned) - Number(!!a.pinned) || String(b.created_at||'').localeCompare(String(a.created_at||'')); });
      _postCache = fposts;
      renderReporterPosts(fposts);
      return;
    }
    feed.innerHTML = '<div class="rp-post-empty">Posts를 불러오지 못했습니다.</div>';
  }
}

function renderReporterPosts(posts) {
  var feed = document.getElementById('rp-post-feed');
  if (!feed) return;
  // Keep the tab badge count in sync with whatever lands in the feed,
  // and refresh the Album / Photocards panels if they happen to be
  // open so a new post upload doesn't leave them stale.
  if (typeof rpUpdatePostsCount === 'function') rpUpdatePostsCount();
  var openPanel = document.querySelector('.rp-panel.on');
  if (openPanel && openPanel.id === 'rp-panel-album')      rpRenderAlbum();
  if (openPanel && openPanel.id === 'rp-panel-photocards') rpRenderPhotocards();
  if (!posts.length) {
    feed.innerHTML = '<div class="rp-post-empty">아직 올라온 포스트가 없습니다.</div>';
    return;
  }
  feed.innerHTML = posts.map(function(p){
    var imgs = p.images || [];
    var imgsClass = 'rp-post-images' + (imgs.length === 1 ? ' one' : '');
    var actions = _canManagePosts
      ? '<div class="rp-post-actions"><button class="rp-post-act" onclick="editReporterPost(&quot;' + p.id + '&quot;)">수정</button><button class="rp-post-act" onclick="deleteReporterPost(&quot;' + p.id + '&quot;)">삭제</button></div>'
      : '';
    return '<article class="rp-post-card">'
      + '<div class="rp-post-head">'
      +   '<div><div style="font-weight:800;color:#0f172a">기자 포스트</div><div class="rp-post-meta">' + escHtml(formatPostTime(p.created_at)) + (p.updated_at && p.updated_at !== p.created_at ? ' · 수정됨' : '') + '</div></div>'
      +   (p.pinned ? '<div class="rp-post-pin">📌 PINNED</div>' : '')
      + '</div>'
      + '<div class="rp-post-content">' + escHtml(p.content || '') + '</div>'
      + (imgs.length ? ('<div class="' + imgsClass + '">' + imgs.map(function(url){ return '<img src="' + escHtml(url) + '" onclick="rpOpenPostImage(&quot;' + escHtml(url) + '&quot;)">'; }).join('') + '</div>') : '')
      + '<div class="rp-post-foot"><span class="rp-post-status">' + (p.status === 'draft' ? '임시저장' : '게시됨') + '</span>' + actions + '</div>'
      + '</article>';
  }).join('');
}

function rpOpenPostImage(url) {

async function uploadPostImages(sb, reporterId, postId, files) {
  var out = [];
  if (!files || !files.length) return out;
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    var ext = (f.name.split('.').pop() || 'jpg').replace(/[^a-zA-Z0-9]/g, '');
    var path = 'posts/' + reporterId + '/' + postId + '/' + Date.now() + '_' + i + '.' + ext;
    var up = await sb.storage.from('reporter-images').upload(path, f, { upsert:true, contentType:f.type || 'image/jpeg' });
    if (up.error) continue;
    var pub = sb.storage.from('reporter-images').getPublicUrl(path);
    var u = pub && pub.data && pub.data.publicUrl ? pub.data.publicUrl : '';
    if (u) out.push(u);
  }
  return out;
}

async function submitReporterPost(reporterId) {
  if (!_canManagePosts) return;
  var sb = getSupa();
  if (!sb || !supaUser) { openAuthModal('signin'); return; }
  var contentEl = document.getElementById('rp-post-content');
  var statusEl = document.getElementById('rp-post-status');
  var pinEl = document.getElementById('rp-post-pinned');
  var content = (contentEl && contentEl.value || '').trim();
  if (!content && !_postDraftFiles.length) { alert('텍스트나 이미지 중 하나는 필요해요.'); return; }

  var status = statusEl ? statusEl.value : 'published';
  var pinned = !!(pinEl && pinEl.checked);
  var now = new Date().toISOString();
  var postId = _editingPostId || (window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'rp_' + Date.now());
  var payload = {
    id: postId, reporter_id: reporterId, author_user_id: supaUser.id,
    content: content, post_type: 'general', status: status, pinned: pinned,
    updated_at: now
  };
  if (!_editingPostId) payload.created_at = now;

  if (_postMode === 'fallback') {
    var local = await loadFallbackReporterPosts(sb, reporterId);
    if (_editingPostId) {
      local = local.map(function(p){ return p.id === postId ? Object.assign({}, p, payload) : p; });
    } else {
      local.unshift(Object.assign({ images:[] }, payload));
    }
    if (_postDraftFiles.length) {
      var furls = await uploadPostImages(sb, reporterId, postId, _postDraftFiles);
      local = local.map(function(p){
        if (p.id !== postId) return p;
        var imgs = Array.isArray(p.images) ? p.images.slice() : [];
        return Object.assign({}, p, { images: imgs.concat(furls) });
      });
    }
    var ok = await saveFallbackReporterPosts(sb, reporterId, local);
    if (!ok) { alert('포스트 저장 실패'); return; }
    cancelPostEdit();
    await loadReporterPosts(reporterId);
    return;
  }

  var r = _editingPostId
    ? await sb.from('reporter_posts').update(payload).eq('id', postId).eq('reporter_id', reporterId)
    : await sb.from('reporter_posts').insert(payload);
  if (r.error) {
    if (isMissingReporterPostsTableError(r.error)) {
      _postMode = 'fallback';
      setPostModePref('fallback');
      return submitReporterPost(reporterId);
    }
    alert('포스트 저장 실패');
    return;
  }

  if (_postDraftFiles.length) {
    var urls = await uploadPostImages(sb, reporterId, postId, _postDraftFiles);
    if (urls.length) {
      var existing = _postCache.find(function(p){ return p.id === postId; });
      var start = existing && existing.images ? existing.images.length : 0;
      var rows = urls.map(function(url, idx){
        return { post_id: postId, image_url: url, sort_order: start + idx };
      });
      await sb.from('reporter_post_images').insert(rows);
    }
  }

  cancelPostEdit();
  await loadReporterPosts(reporterId);
}

function editReporterPost(postId) {
  if (!_canManagePosts) return;
  var p = _postCache.find(function(x){ return x.id === postId; });
  if (!p) return;
  _editingPostId = postId;
  var contentEl = document.getElementById('rp-post-content');
  var statusEl = document.getElementById('rp-post-status');
  var pinEl = document.getElementById('rp-post-pinned');
  var cancelBtn = document.getElementById('rp-post-cancel');
  if (contentEl) contentEl.value = p.content || '';
  if (statusEl) statusEl.value = p.status || 'published';
  if (pinEl) pinEl.checked = !!p.pinned;
  if (cancelBtn) cancelBtn.style.display = '';
  var hint = document.getElementById('rp-post-file-hint');
  if (hint) hint.textContent = '수정 모드: 새 이미지를 추가로 업로드할 수 있어요.';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelPostEdit() {
  _editingPostId = null;
  _postDraftFiles = [];
  var contentEl = document.getElementById('rp-post-content');
  var statusEl = document.getElementById('rp-post-status');
  var pinEl = document.getElementById('rp-post-pinned');
  var fileEl = document.getElementById('rp-post-files');
  var hint = document.getElementById('rp-post-file-hint');
  var cancelBtn = document.getElementById('rp-post-cancel');

  if (statusEl) statusEl.value = 'published';
  if (pinEl) pinEl.checked = false;
  if (fileEl) fileEl.value = '';

}

async function deleteReporterPost(postId) {
  if (!_canManagePosts) return;
  if (!confirm('Delete this post?')) return;
  var sb = getSupa();
  if (!sb) return;
  if (_postMode === 'fallback') {
    var local = await loadFallbackReporterPosts(sb, _currentReporterId);
    local = local.filter(function(p){ return p.id !== postId; });
    var ok = await saveFallbackReporterPosts(sb, _currentReporterId, local);
    if (!ok) { alert('삭제 실패'); return; }
    await loadReporterPosts(_currentReporterId);
    return;
  }
  await sb.from('reporter_post_images').delete().eq('post_id', postId);
  var dr = await sb.from('reporter_posts').delete().eq('id', postId);
  if (dr.error) {
    if (isMissingReporterPostsTableError(dr.error)) {
      _postMode = 'fallback';
      setPostModePref('fallback');
      return deleteReporterPost(postId);
    }
    alert('삭제 실패'); return;
  }
  await loadReporterPosts(_currentReporterId);
}

async function sendGiftToReporter(reporterId, itemId) {
  var sb = getSupa();
  if (!sb || !supaUser) { openAuthModal('signin'); return; }
  var item = _giftCatalog.find(function(it){ return it.id === itemId; });
  if (!item) return;
  var own = Number(_giftOwnedMap[itemId] || 0);
  var prompt = own > 0
    ? item.name + ' 선물을 인벤토리에서 1개 사용해서 보내시겠어요?'
    : item.name + ' 선물을 ' + Number(item.coin_price || 0).toLocaleString() + '냥으로 즉시 구매/전송할까요?';
  if (!confirm(prompt)) return;

  var res = null;
  if (shouldUseGiftRpc()) {
    res = await sb.rpc('send_reporter_gift', {
      p_item_id: itemId,
      p_reporter_id: reporterId,
      p_user_id: supaUser.id
    });
    if (res.error && isMissingGiftRpcError(res.error)) {
      try { localStorage.setItem('kh_use_gift_rpc', '0'); } catch(e) {}
      res = await sendGiftFallbackNoRpc(sb, reporterId, itemId);
    }
  } else {
    res = await sendGiftFallbackNoRpc(sb, reporterId, itemId);
  }
  if (res.error || !res.data || !res.data.ok) {
    var code = (res.data && res.data.error) || 'GIFT_PROCESS_FAILED';
    var friendly = 'Gift sending failed. Please try again later.';
    if (code === 'INSUFFICIENT_NYANG') friendly = '냥이 부족합니다.';
    else if (code === 'ITEM_NOT_GIFTABLE') friendly = '현재 보낼 수 없는 아이템입니다.';
    else if (code === 'INVALID_INPUT') friendly = '선물 정보가 올바르지 않습니다.';
    else if (code === 'GIFT_PROCESS_FAILED') friendly = '선물 처리 중 오류가 발생했습니다.';
    alert(friendly);
    return;
  }
  alert('선물 전송 완료! 기자 호감도가 상승했어요.');
  var delta = Number(res.data && (res.data.affinity_gained || res.data.affinity_delta) || 0);
  if (!delta) {
    delta = Math.max(10, Number(item.coin_price || 0));
  }
  _currentAffinityXP = Math.max(0, Number(_currentAffinityXP || 0) + delta);
  setLocalAffinity(reporterId, _currentAffinityXP);
  updateAffinityUI(_currentAffinityXP);
  await loadReporterGiftPanel(reporterId);
}

function isMissingGiftRpcError(err) {
  var msg = String(err && (err.message || err.details || err.hint || err.code) || '').toLowerCase();
  return msg.indexOf('send_reporter_gift') >= 0 && (msg.indexOf('schema cache') >= 0 || msg.indexOf('404') >= 0 || msg.indexOf('pgrst') >= 0);
}

async function sendGiftFallbackNoRpc(sb, reporterId, itemId) {
  try {
    var item = _giftCatalog.find(function(it){ return it.id === itemId; });
    if (!item) return { data:{ ok:false, error:'ITEM_NOT_GIFTABLE' } };
    var cost = Number(item.coin_price || 0);

    var ownQty = Number(_giftOwnedMap[itemId] || 0);
    if (ownQty > 0) {
      if (ownQty <= 1) {
        await sb.from('owned_items').delete().eq('user_id', supaUser.id).eq('item_id', itemId);
      } else {
        await sb.from('owned_items').update({ quantity: ownQty - 1 }).eq('user_id', supaUser.id).eq('item_id', itemId);
      }
    } else {
      var statsRes = await sb.from('user_stats').select('coin_balance').eq('user_id', supaUser.id).maybeSingle();
      var bal = Number(statsRes.data && statsRes.data.coin_balance || 0);
      if (bal < cost) return { data:{ ok:false, error:'INSUFFICIENT_NYANG' } };
      var nextBal = bal - cost;
      await sb.from('user_stats').update({ coin_balance: nextBal }).eq('user_id', supaUser.id);
      try {
        await sb.from('coin_transactions').insert({
          user_id:supaUser.id, tx_type:'spend', amount:-cost, balance_after:nextBal,
          source:'reporter_gift_direct', reference_id:itemId, memo:item.name || 'Reporter gift'
        });
      } catch(e) {}
    }

    if (shouldUseGiftHistory()) {
      var gh = await sb.from('reporter_gift_history').insert({
        user_id:supaUser.id, reporter_id:reporterId, item_id:itemId, quantity:1, nyang_spent:(ownQty > 0 ? 0 : cost)
      });
      if (gh && gh.error && isMissingGiftHistoryTableError(gh.error)) {
        disableGiftHistoryWrites();
      }
    }

    var affinityGain = Math.max(10, cost);
    var newAffinity = getLocalAffinity(reporterId) + affinityGain;
    if (shouldUseRemoteAffinity()) {
      try {
        var affRes = await sb.from('reporter_user_affinity').select('gift_count,affinity_points').eq('user_id', supaUser.id).eq('reporter_id', reporterId).maybeSingle();
        var giftCount = Number(affRes.data && affRes.data.gift_count || 0) + 1;
        newAffinity = Number(affRes.data && affRes.data.affinity_points || 0) + affinityGain;
        await sb.from('reporter_user_affinity').upsert({
          user_id:supaUser.id, reporter_id:reporterId, gift_count:giftCount, affinity_points:newAffinity, updated_at:new Date().toISOString()
        }, { onConflict:'user_id,reporter_id' });
      } catch(e) {
        if (isMissingAffinityTableError(e)) {
          try { localStorage.setItem('kh_remote_affinity', '0'); } catch(ex) {}
        }
      }
    }
    // Always save to localStorage + app_settings fallback
    setLocalAffinity(reporterId, newAffinity);
    saveAffinityToAppSettings(sb, reporterId, newAffinity);

    return { data:{ ok:true, success:true, affinity_gained: affinityGain } };
  } catch(e) {
    return { data:{ ok:false, error:'GIFT_PROCESS_FAILED' } };
  }
}

function getAffinityStorageKey(reporterId) {
  if (!supaUser || !reporterId) return '';
  return 'kh_affinity_' + supaUser.id + '_' + reporterId;
}

// Auth restores asynchronously after page load. Without this gate the
// reporter page renders affinity as 0 because supaUser is still null
// when loadAffinityPoints fires from DOMContentLoaded — the function
// then short-circuits to getLocalAffinity which keys on supaUser.id
// (empty), so localStorage looks empty too. We block up to 4s for the
// session to land before reading.
async function _waitForSupaUser(timeoutMs) {
  if (supaUser) return supaUser;
  return new Promise(function(resolve) {
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      window.removeEventListener('kh-auth-signed-in', onSignIn);
      resolve(supaUser || null);
    }
    function onSignIn() { finish(); }
    window.addEventListener('kh-auth-signed-in', onSignIn);
    // Poll lightly in case the event already fired before listeners
    // attached (race when shared.js getSession resolves quickly).
    var pollId = setInterval(function(){
      if (supaUser) { clearInterval(pollId); finish(); }
    }, 100);
    setTimeout(function(){ clearInterval(pollId); finish(); }, timeoutMs || 4000);
  });
}

// Belt-and-suspenders: if auth restored AFTER the page already rendered
// affinity (e.g. very slow getSession on a cold tab), re-fetch and patch
// the UI in place so the user doesn't see 0 then have to refresh.
window.addEventListener('kh-auth-signed-in', async function() {
  if (!_currentReporterId) return;
  var sb = getSupa();
  if (!sb) return;
  try {
    var fresh = Number(await loadAffinityPoints(sb, _currentReporterId)) || 0;
    if (fresh > Number(_currentAffinityXP || 0)) {
      _currentAffinityXP = fresh;
      updateAffinityUI(fresh);
    }
  } catch(_) {}
});

function shouldUseRemoteAffinity() {
  try {
    return localStorage.getItem('kh_remote_affinity') !== '0';
  } catch(e) {
    return true;
  }
}

function shouldUseGiftRpc() {
  try {
    return localStorage.getItem('kh_use_gift_rpc') !== '0';
  } catch(e) {
    return true;
  }
}

function getLocalAffinity(reporterId) {
  try {
    var key = getAffinityStorageKey(reporterId);
    if (!key) return 0;
    return Number(localStorage.getItem(key) || 0);
  } catch(e) {
    return 0;
  }
}

function setLocalAffinity(reporterId, points) {
  try {
    var key = getAffinityStorageKey(reporterId);
    if (!key) return;
    localStorage.setItem(key, String(Math.max(0, Number(points || 0))));
  } catch(e) {}
}

function isMissingAffinityTableError(err) {
  var msg = String(err && (err.message || err.details || err.hint || err.code) || '').toLowerCase();
  return msg.indexOf('reporter_user_affinity') >= 0 || msg.indexOf('pgrst205') >= 0 || msg.indexOf('schema cache') >= 0 || msg.indexOf('404') >= 0;
}

// ── app_settings fallback for affinity ──
function _affinityFallbackKey(reporterId) {
  return 'kh_affinity_fb_' + (supaUser ? supaUser.id : 'anon') + '_' + reporterId;
}
async function loadAffinityFromAppSettings(sb, reporterId) {
  try {
    var key = _affinityFallbackKey(reporterId);
    var res = await sb.from('app_settings').select('value').eq('key', key).maybeSingle();
    if (res.data && res.data.value) return Number(res.data.value) || 0;
  } catch(e) {}
  return 0;
}
async function saveAffinityToAppSettings(sb, reporterId, points) {
  try {
    var key = _affinityFallbackKey(reporterId);
    await sb.from('app_settings').upsert({ key: key, value: String(points), updated_at: new Date().toISOString() }, { onConflict: 'key' });
  } catch(e) {}
}

async function loadAffinityPoints(sb, reporterId) {
  // Bridge the async auth restore — without this, a fresh page load
  // calls this function before supaUser settles, the table read gets
  // skipped, and the user sees their affinity reset to 0 every time.
  if (!supaUser) await _waitForSupaUser(4000);
  if (!sb || !supaUser) return getLocalAffinity(reporterId);
  // Try primary table first
  if (shouldUseRemoteAffinity()) {
    try {
      var af = await sb.from('reporter_user_affinity').select('affinity_points').eq('user_id', supaUser.id).eq('reporter_id', reporterId).maybeSingle();
      if (af && af.error) {
        if (isMissingAffinityTableError(af.error)) {
          try { localStorage.setItem('kh_remote_affinity', '0'); } catch(e) {}
        }
      } else {
        var dbVal = Number(af.data && af.data.affinity_points || 0);
        var localVal = getLocalAffinity(reporterId);
        var finalVal = Math.max(dbVal, localVal);
        if (finalVal !== localVal) setLocalAffinity(reporterId, finalVal);
        return finalVal;
      }
    } catch(e) {}
  }
  // Fallback: app_settings table
  var fbVal = await loadAffinityFromAppSettings(sb, reporterId);
  var localVal = getLocalAffinity(reporterId);
  var finalVal = Math.max(fbVal, localVal);
  if (finalVal > 0) {
    setLocalAffinity(reporterId, finalVal);
    if (finalVal > fbVal) saveAffinityToAppSettings(sb, reporterId, finalVal);
  }
  return finalVal;
}

function updateAffinityUI(favXP) {
  var pct = Math.min(100, Math.round(Number(favXP || 0) / FAV_HIRE_THRESHOLD * 100));
  var level = favXP >= FAV_HIRE_THRESHOLD ? '매니저' : favXP >= 200 ? '친구' : favXP >= 80 ? '지인' : '모르는 사이';
  var fill = document.getElementById('rp-fav-bar-fill');
  if (fill) fill.style.width = pct + '%';
  var xp = document.getElementById('rp-fav-xp');
  if (xp) xp.textContent = Number(favXP || 0) + ' / ' + FAV_HIRE_THRESHOLD + ' 친밀도';
  var left = document.getElementById('rp-fav-left');
  if (left) left.textContent = '매니저 고용까지 ' + Math.max(0, FAV_HIRE_THRESHOLD - Number(favXP || 0)) + ' 남음';
  var lv = document.getElementById('rp-fav-level');
  if (lv) lv.textContent = level;
  var p = document.getElementById('rp-fav-progress');
  if (p) p.textContent = '호감도 ' + FAV_HIRE_THRESHOLD + ' 달성 시 고용 가능 · 현재 ' + pct + '%';
}

async function loadReporterArticles(rid, name) {
  var el = document.getElementById('rp-arts');
  var countEl = document.getElementById('rp-tab-c-arts');
  if (!el) return;
  await loadArticlesFromDB({ force: false });
  var arts = getCachedArticles().filter(function(a){ return a.reporter_id === rid && (!a.status || a.status === 'published'); });
  if (countEl) countEl.textContent = arts.length ? arts.length : '';
  if (!arts.length) {
    el.innerHTML = '<div class="rp-post-empty">아직 작성한 기사가 없습니다.</div>';
    return;
  }
  arts.sort(function(a,b){ return (b.date||'') > (a.date||'') ? 1 : -1; });
  el.innerHTML = '<div class="rp-sec-title">' + name + '의 기사 ' + arts.length + '편</div>'
    + '<div class="rp-art-list">'
    + arts.slice(0,12).map(function(a){
        var d = a.date ? new Date(a.date).toLocaleDateString('ko-KR',{year:'numeric',month:'short',day:'numeric'}) : '';
        return '<a class="rp-art-item" href="korehan-article.html?id=' + a.id + '">'
          + '<div class="rp-art-title">' + (a.title||'') + '</div>'
          + '<div class="rp-art-meta">' + (a.section||'') + (d?' · '+d:'') + '</div></a>';
      }).join('')
    + '</div>';
}
</script>
