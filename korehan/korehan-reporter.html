<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>기자 소개 — KoreHan News</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="korehan-shared.css">
<style>
/* ── Layout ── */
body {
  position: relative;
  min-height: 100vh;
  overflow-x: hidden;
}
.rp-page-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  filter: saturate(1.05) brightness(.78);
  transform: scale(1.02);
}
.rp-page-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(4,16,44,.58) 0%, rgba(8,14,28,.7) 60%, rgba(8,14,28,.84) 100%);
}
.rp-content-layer { position: relative; z-index: 1; }
.rp-wrap { max-width: 960px; margin: 0 auto; padding: 36px 20px 60px; }

/* ── Profile card ── */
.rp-profile {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 36px;
  background: #fff;
  border-radius: 28px;
  border: 1px solid #e8eef7;
  box-shadow: 0 8px 32px rgba(15,23,42,.07);
  overflow: hidden;
  margin-bottom: 28px;
}
.rp-photo-col {
  position: relative;
  min-height: 320px;
}
.rp-photo-col img, .rp-photo-ph {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  min-height: 320px;
}
.rp-photo-ph {
  display: flex; align-items: center; justify-content: center;
  font-size: 80px; font-weight: 900; color: #fff;
}
.rp-color-bar {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 6px;
}
.rp-info-col {
  padding: 32px 32px 28px 0;
  display: flex; flex-direction: column; gap: 0;
}
.rp-name {
  font-family: 'Noto Serif KR', serif;
  font-size: 30px; font-weight: 900; color: #0f172a;
  margin-bottom: 4px;
}
.rp-role-badge {
  display: inline-block;
  font-size: 12px; font-weight: 700;
  padding: 4px 12px; border-radius: 999px;
  color: #fff; margin-bottom: 20px;
}
.rp-stats {
  display: flex; gap: 28px; margin-bottom: 20px;
  flex-wrap: wrap;
}
.rp-stat { display: flex; flex-direction: column; gap: 2px; }
.rp-stat-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; }
.rp-stat-val { font-size: 16px; font-weight: 800; color: #0f172a; }
.rp-divider { height: 1px; background: #f1f5f9; margin: 16px 0; }
.rp-intro {
  font-size: 14px; line-height: 1.8; color: #475569;
  font-family: 'Noto Sans KR', sans-serif;
  flex: 1;
}
.rp-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.rp-tag {
  font-size: 11px; font-weight: 700;
  padding: 4px 12px; border-radius: 999px;
  background: #f1f5f9; color: #475569;
  border: 1px solid #e2e8f0;
}

/* ── Favorability ── */
.rp-fav-card {
  background: #fff;
  border-radius: 24px;
  border: 1px solid #e8eef7;
  box-shadow: 0 4px 20px rgba(15,23,42,.05);
  padding: 28px;
  margin-bottom: 28px;
}
.rp-fav-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.rp-fav-title { font-size: 16px; font-weight: 800; color: #0f172a; }
.rp-fav-level {
  font-size: 12px; font-weight: 700;
  padding: 4px 12px; border-radius: 999px;
  background: #f1f5f9; color: #64748b;
}
.rp-fav-bar-bg {
  height: 10px; border-radius: 999px;
  background: #f1f5f9; margin-bottom: 6px; overflow: hidden;
}
.rp-fav-bar-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, #facc15, #f97316);
  transition: width .6s ease;
}
.rp-fav-meta {
  display: flex; justify-content: space-between;
  font-size: 12px; color: #94a3b8; margin-bottom: 24px;
}
.rp-gifts {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  margin-bottom: 20px;
}
.rp-gift {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: #f8fafc; border: 1.5px solid #e2e8f0;
  border-radius: 16px; padding: 16px 8px;
  cursor: not-allowed; opacity: .7;
  position: relative;
}
.rp-gift-icon { font-size: 28px; }
.rp-gift-name { font-size: 11px; font-weight: 700; color: #475569; text-align: center; }
.rp-gift-cost {
  font-size: 11px; font-weight: 800; color: #f97316;
  background: #fff7ed; padding: 2px 8px; border-radius: 999px;
}
.rp-gift-lock {
  position: absolute; top: 8px; right: 8px;
  font-size: 11px; color: #94a3b8;
}
.rp-hire-btn {
  width: 100%; padding: 14px;
  border-radius: 14px; border: 2px dashed #e2e8f0;
  background: #f8fafc; color: #94a3b8;
  font-size: 15px; font-weight: 800;
  cursor: not-allowed;
  font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.rp-hire-progress {
  font-size: 12px; color: #94a3b8; text-align: center; margin-top: 8px;
}

/* ── Articles ── */
.rp-sec-title {
  font-size: 13px; font-weight: 800;
  text-transform: uppercase; letter-spacing: .06em;
  color: #94a3b8; margin-bottom: 14px;
}
.rp-art-list { display: flex; flex-direction: column; gap: 10px; }
.rp-art-item {
  background: #fff; border-radius: 14px;
  border: 1px solid #e8eef7; padding: 14px 18px;
  text-decoration: none; display: block;
  transition: box-shadow .15s, transform .15s;
}
.rp-art-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,.07); transform: translateY(-2px); }
.rp-art-title { font-size: 14px; font-weight: 700; color: #0f172a; line-height: 1.45; margin-bottom: 3px; font-family: 'Noto Serif KR', serif; }
.rp-art-meta { font-size: 12px; color: #94a3b8; }

/* ── Loading / Error ── */
.rp-loading { text-align: center; padding: 80px 20px; color: #94a3b8; font-size: 15px; }
.rp-not-found { text-align: center; padding: 80px 20px; }
.rp-not-found h2 { font-size: 22px; color: #0f172a; margin-bottom: 8px; }
.rp-not-found p { color: #64748b; }

/* ── Lightbox ── */
#rp-lb { display:none; position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:9999; align-items:center; justify-content:center; cursor:zoom-out; }
#rp-lb.on { display:flex; }
#rp-lb img { max-width:90vw; max-height:90vh; border-radius:16px; box-shadow:0 24px 80px rgba(0,0,0,.6); object-fit:contain; }
.rp-photo-col { cursor:zoom-in; }

/* ── Mobile ── */
@media(max-width: 640px) {
  .rp-profile { grid-template-columns: 1fr; }
  .rp-photo-col { min-height: 240px; max-height: 260px; }
  .rp-info-col { padding: 24px 20px 24px; }
  .rp-gifts { grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .rp-gift { padding: 12px 4px; }
  .rp-gift-icon { font-size: 22px; }
}
</style>
</head>
<body>
<div id="rp-page-bg" class="rp-page-bg"></div>
<div class="rp-content-layer">
<div id="dyn-header"></div>
<div id="rp-root"><div class="rp-loading">⏳ 로딩 중…</div></div>
<div id="rp-lb" onclick="this.classList.remove('on')"><img id="rp-lb-img" src="" alt=""></div>
<div id="dyn-footer"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="korehan-shared.js"></script>
<script>
var GIFTS = [
  { icon:'☕', name:'커피',   cost:'50 XP',  xpCost:50  },
  { icon:'🧋', name:'버블티', cost:'120 XP', xpCost:120 },
  { icon:'🌸', name:'꽃다발', cost:'300 XP', xpCost:300 },
  { icon:'🎁', name:'선물',   cost:'800 XP', xpCost:800 },
];
var FAV_HIRE_THRESHOLD = 3000;
var REPORTER_BG_DEFAULT = 'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=2200&q=80';

document.addEventListener('DOMContentLoaded', async function() {
  var rid  = new URLSearchParams(window.location.search).get('id');
  var root = document.getElementById('rp-root');
  if (!rid) { root.innerHTML = '<div class="rp-not-found"><h2>기자를 찾을 수 없습니다</h2></div>'; return; }
  try {
    var sbBg = getSupa && getSupa();
    var bgUrl = REPORTER_BG_DEFAULT;
    if (sbBg) {
      var bgRes = await sbBg.from('app_settings').select('value').eq('key', 'reporter_bg_image_url').maybeSingle();
      if (!bgRes.error && bgRes.data && bgRes.data.value) bgUrl = String(bgRes.data.value);
    }
    var bgEl = document.getElementById('rp-page-bg');
    if (bgEl) bgEl.style.backgroundImage = 'url(\"' + bgUrl.replace(/\"/g, '%22') + '\")';
  } catch(e) {}

  var reporter = null;
  var sb = getSupa();
  if (sb) {
    try {
      var res = await sb.from('character_reporters').select('data').eq('id', rid).maybeSingle();
      if (!res.error && res.data) reporter = res.data.data || res.data;
    } catch(e) {}
  }
  if (!reporter || !reporter.name) {
    await _loadReportersIntoKHMap();
    var b = KH_REPORTERS[rid];
    if (b) reporter = { id:rid, name:b.name, role:b.role, image:b.img, color:b.color, intro:'', tags:[] };
  }
  if (!reporter || !reporter.name) {
    root.innerHTML = '<div class="rp-not-found"><h2>기자를 찾을 수 없습니다</h2><p><a href="index.html" style="color:var(--bright)">← 홈으로</a></p></div>';
    return;
  }

  var color = reporter.color || '#2563eb';
  document.title = reporter.name + ' 기자 — KoreHan News';

  // Placeholder favorability (future: load from DB per user)
  var favXP = 0;
  var favPct = Math.min(100, Math.round(favXP / FAV_HIRE_THRESHOLD * 100));
  var favLevel = favXP >= FAV_HIRE_THRESHOLD ? '매니저' : favXP >= 200 ? '친구' : favXP >= 80 ? '지인' : '모르는 사이';

  var photoHtml = reporter.image
    ? '<img src="' + reporter.image + '" alt="' + reporter.name + '" style="width:100%;height:100%;object-fit:cover;display:block;min-height:320px" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">'
      + '<div class="rp-photo-ph" style="background:' + color + ';display:none;min-height:320px">' + reporter.name.charAt(0) + '</div>'
    : '<div class="rp-photo-ph" style="background:' + color + '">' + reporter.name.charAt(0) + '</div>';

  var tagsHtml = (reporter.tags||[]).map(function(t){ return '<span class="rp-tag">' + t + '</span>'; }).join('');

  var giftsHtml = GIFTS.map(function(g){
    return '<div class="rp-gift">'
      + '<span class="rp-gift-icon">' + g.icon + '</span>'
      + '<span class="rp-gift-name">' + g.name + '</span>'
      + '<span class="rp-gift-cost">' + g.cost + '</span>'
      + '<span class="rp-gift-lock">🔒</span>'
      + '</div>';
  }).join('');

  root.innerHTML =
    '<div class="rp-wrap">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">'
    +   '<a href="javascript:history.back()" style="color:var(--bright);font-size:14px;font-weight:700;text-decoration:none;opacity:.8">← 뒤로가기</a>'
    +   '<a href="korehan-reporters.html" style="color:var(--bright);font-size:13px;font-weight:700;text-decoration:none;opacity:.8">전체 기자 보기 →</a>'
    + '</div>'

    // ── Profile ──
    + '<div class="rp-profile">'
    +   '<div class="rp-photo-col" onclick="rpOpenLb()">'
    +     photoHtml
    +     '<div class="rp-color-bar" style="background:' + color + '"></div>'
    +   '</div>'
    +   '<div class="rp-info-col">'
    +     '<div class="rp-name">' + reporter.name + '</div>'
    +     '<span class="rp-role-badge" style="background:' + color + '">' + (reporter.role||'') + '</span>'
    +     '<div class="rp-stats">'
    +       (reporter.age ? '<div class="rp-stat"><span class="rp-stat-label">나이</span><span class="rp-stat-val">' + reporter.age + '세</span></div>' : '')
    +       (reporter.tone ? '<div class="rp-stat"><span class="rp-stat-label">성향</span><span class="rp-stat-val" style="font-size:13px">' + reporter.tone + '</span></div>' : '')
    +     '</div>'
    +     '<div class="rp-divider"></div>'
    +     '<div class="rp-intro">' + (reporter.intro || '소개가 아직 없습니다.') + '</div>'
    +     (tagsHtml ? '<div class="rp-tags">' + tagsHtml + '</div>' : '')
    +   '</div>'
    + '</div>'

    // ── Favorability ──
    + '<div class="rp-fav-card">'
    +   '<div class="rp-fav-header">'
    +     '<div class="rp-fav-title">❤️ 호감도</div>'
    +     '<div class="rp-fav-level">' + favLevel + '</div>'
    +   '</div>'
    +   '<div class="rp-fav-bar-bg"><div class="rp-fav-bar-fill" style="width:' + favPct + '%;background:linear-gradient(90deg,' + color + ',' + color + 'aa)"></div></div>'
    +   '<div class="rp-fav-meta"><span>' + favXP + ' / ' + FAV_HIRE_THRESHOLD + ' XP</span><span>매니저 고용까지 ' + (FAV_HIRE_THRESHOLD - favXP) + ' XP</span></div>'
    +   '<div class="rp-gifts">' + giftsHtml + '</div>'
    +   '<button class="rp-hire-btn" disabled>🎓 한국어 매니저로 고용하기</button>'
    +   '<div class="rp-hire-progress">호감도 ' + FAV_HIRE_THRESHOLD + ' XP 달성 시 고용 가능 · 현재 ' + favPct + '%</div>'
    + '</div>'

    // ── Articles ──
    + '<div id="rp-arts"></div>'
    + '</div>';

  loadReporterArticles(rid, reporter.name);
});

function rpOpenLb() {
  var src = document.querySelector('.rp-photo-col img');
  if (!src) return;
  document.getElementById('rp-lb-img').src = src.src;
  document.getElementById('rp-lb').classList.add('on');
}
document.addEventListener('keydown', function(e){ if(e.key==='Escape') document.getElementById('rp-lb').classList.remove('on'); });

async function loadReporterArticles(rid, name) {
  var el = document.getElementById('rp-arts');
  if (!el) return;
  await loadArticlesFromDB({ force: false });
  var arts = getCachedArticles().filter(function(a){ return a.reporter_id === rid && (!a.status || a.status === 'published'); });
  if (!arts.length) return;
  arts.sort(function(a,b){ return (b.date||'') > (a.date||'') ? 1 : -1; });
  el.innerHTML = '<div class="rp-sec-title">' + name + '의 기사 ' + arts.length + '편</div>'
    + '<div class="rp-art-list">'
    + arts.slice(0,12).map(function(a){
        var d = a.date ? new Date(a.date).toLocaleDateString('ko-KR',{year:'numeric',month:'short',day:'numeric'}) : '';
        return '<a class="rp-art-item" href="korehan-article.html?id=' + a.id + '">'
          + '<div class="rp-art-title">' + (a.title||'') + '</div>'
          + '<div class="rp-art-meta">' + (a.section||'') + (d?' · '+d:'') + '</div></a>';
      }).join('')
    + '</div>';
}
</script>
</body>
</html>
