<style>
html body{margin:0;background:#050b15!important;background-color:#050b15!important;color:#e0f2fe;font-family:'Happy Monkey','Jua','DM Sans',Inter,Pretendard,sans-serif;overflow:hidden}
.wrap{max-width:700px;margin:0 auto;padding:10px 16px;position:relative;height:100dvh;height:100vh;display:flex;flex-direction:column}
@supports(height:100dvh){.wrap{height:100dvh}}
.game-header{display:flex;justify-content:space-between;align-items:center;padding:6px 0;flex-shrink:0}
.game-title{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px}
.stat{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1)}
.stat-val{color:#7dd3fc}
.back{display:inline-flex;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);color:#94a3b8;text-decoration:none;font-size:12px;font-weight:700;margin-bottom:4px}

/* Game area — replaces canvas */
.game-area{flex:1;position:relative;overflow:hidden;border-radius:14px}
/* Danger zone */
.game-area::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent,rgba(239,68,68,.12));border-top:2px dashed rgba(239,68,68,.25);pointer-events:none;z-index:1}

/* Falling word pill */
.word-pill{position:absolute;padding:8px 16px;border-radius:10px;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);border:1.5px solid rgba(125,211,252,.2);color:#e0f2fe;font-size:18px;font-weight:800;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;pointer-events:none;transition:border-color .15s;z-index:2}
.word-pill.danger{border-color:rgba(239,68,68,.5);color:#fca5a5}
.word-pill.correct{animation:wpCorrect .4s ease forwards}
@keyframes wpCorrect{0%{transform:scale(1);opacity:1}50%{transform:scale(1.3);border-color:#4ade80;color:#4ade80}100%{transform:scale(0);opacity:0}}
.word-pill.missed{animation:wpMissed .3s ease forwards}
@keyframes wpMissed{to{opacity:0;transform:translateY(20px)}}

/* Input */
.input-area{flex-shrink:0;padding:6px 0}
.input-area form{display:flex;gap:8px}
.input-area input{flex:1;padding:10px 14px;border:2px solid rgba(125,211,252,.3);border-radius:12px;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);color:#fff;font-size:16px;font-family:'Noto Sans KR',sans-serif;text-align:center;outline:none}
.input-area input:focus{border-color:#7dd3fc;box-shadow:0 0 20px rgba(125,211,252,.15)}
.input-area button{padding:10px 18px;border:none;border-radius:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}

.combo-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:900;color:#fbbf24;text-shadow:0 0 40px rgba(251,191,36,.5);pointer-events:none;animation:comboIn .6s ease forwards;z-index:20}
@keyframes comboIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
/* Game-feel additions (PR #7AE):
   - wd-shake: stronger input shake on no-match (border-color blip
     was too subtle).
   - wd-bump: score-pill scale-pulse on increment.
   - wd-popup: +N floating popup over the matched word (per-action
     feedback; combo-flash only fires every 3 catches so individual
     catches need their own signal). */
.input-area input.wd-shake{animation:wdShake .42s ease;border-color:rgba(239,68,68,.7)!important;background:rgba(239,68,68,.06)!important}
@keyframes wdShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.stat-val.wd-bump{animation:wdScoreBump .35s ease;display:inline-block}
@keyframes wdScoreBump{0%{transform:scale(1)}50%{transform:scale(1.22);color:#fbbf24}100%{transform:scale(1)}}
.wd-popup{position:absolute;pointer-events:none;font-size:22px;font-weight:900;color:#fbbf24;text-shadow:0 0 22px rgba(251,191,36,.55);z-index:30;animation:wdPopup .85s cubic-bezier(.2,.7,.3,1) forwards;font-family:'Source Sans 3','DM Sans',sans-serif;white-space:nowrap}
@keyframes wdPopup{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-58px) scale(1)}}

/* Particle */
.particle{position:absolute;border-radius:50%;pointer-events:none;z-index:3}

/* ── Menu ── */
.menu-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);z-index:10;padding:20px;overflow-y:auto}
.menu-title{font-size:28px;font-weight:900;margin-bottom:4px}
.menu-sub{font-size:13px;color:#94a3b8;margin-bottom:18px}
.menu-section{width:100%;max-width:380px;margin-bottom:14px}
.menu-label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#64748b;margin-bottom:8px}
.mode-btns,.speed-btns{display:flex;gap:8px}
.mode-btn,.speed-btn{flex:1;padding:12px 8px;border:2px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.03);color:#94a3b8;font-size:13px;font-weight:800;cursor:pointer;text-align:center;transition:.15s;font-family:inherit}
.mode-btn.on{border-color:#2563eb;background:rgba(37,99,235,.15);color:#7dd3fc}
.speed-btn.on{border-color:#f59e0b;background:rgba(245,158,11,.12);color:#fbbf24}
.topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.topic-btn{padding:10px 6px;border:2px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.03);color:#94a3b8;font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:.15s;font-family:inherit}
.topic-btn.on{border-color:#7c3aed;background:rgba(124,58,237,.15);color:#c4b5fd}
.topic-btn .ico{font-size:18px;display:block;margin-bottom:3px}
.start-btn{width:100%;max-width:380px;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:18px;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 8px 32px rgba(37,99,235,.4);margin-top:6px}

/* ── End ── */
.end-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);z-index:10}
.end-btns{display:flex;gap:10px;margin-top:16px}
.end-btn{padding:14px 28px;border:none;border-radius:14px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit}
.end-btn.primary{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}
.end-btn.ghost{background:rgba(255,255,255,.08);color:#94a3b8;border:1px solid rgba(255,255,255,.1)}

/* Hint row */
.hint-row{flex-shrink:0;display:flex;gap:6px;padding:6px 0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hint-row::-webkit-scrollbar{display:none}
.hint-chip{flex-shrink:0;padding:7px 14px;border-radius:10px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border:1.5px solid rgba(255,255,255,.1);color:#cbd5e1;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;pointer-events:none}

/* Bottom panel — sticks above keyboard */
.bottom-panel{flex-shrink:0;z-index:5}

/* Hide shared overlays on game page */
#kh-daily-mission,#vocab-admin-bar,.mobile-bottom-nav,.mobile-sticky-study,#kh-header,#kh-footer{display:none!important}

@media(max-width:500px){.game-title{font-size:14px}.topic-grid{grid-template-columns:repeat(2,1fr)}.word-pill{font-size:16px;padding:6px 12px}}
</style>

<script>
// Pause the looping background video when the tab is hidden so it stops
// burning battery and decode bandwidth on mobile. Resume on return.
// Also respect prefers-reduced-motion — users with motion sensitivity
// or low-spec devices get a static fallback (the video itself stays
// removed; the body's background colour is the visible result).
(function() {
  var v = document.getElementById('kh-bg-video');
  if (!v) return;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    try { v.pause(); v.removeAttribute('autoplay'); v.style.display = 'none'; } catch(_) {}
    return;
  }
  document.addEventListener('visibilitychange', function() {
    try {
      if (document.hidden) v.pause();
      else v.play().catch(function(){});
    } catch(_) {}
  });
})();
</script>

<script>
(function(){
// PR #7AN: defensive guard. The Emotion topic icon was originally
// `khSvg('heart', ...)` evaluated at parse time. If a user's browser
// caches an OLD icons.js (pre-#7S) that doesn't define khSvg, the
// reference throws ReferenceError → the whole IIFE bails → topic
// grid stays empty + START GAME button does nothing. Guard with
// typeof so the page still works during the cache-bump rollout window
// (#7AN bumped the cache-buster from ?v=20260502a → ?v=20260520a).
var _safeKhSvg = (typeof khSvg === 'function') ? khSvg : function(){ return ''; };
var _FALLBACK_TOPICS={
  daily:{icon:'',label:'Daily',words:[
    {ko:'친구',en:'friend'},{ko:'가족',en:'family'},{ko:'학교',en:'school'},{ko:'회사',en:'company'},
    {ko:'집',en:'house'},{ko:'시간',en:'time'},{ko:'사람',en:'person'},{ko:'이름',en:'name'},
    {ko:'약속',en:'promise'},{ko:'선물',en:'gift'},{ko:'생일',en:'birthday'},{ko:'학생',en:'student'},
    {ko:'선생님',en:'teacher'},{ko:'오늘',en:'today'},{ko:'내일',en:'tomorrow'},{ko:'주말',en:'weekend'}]},
  food:{icon:'',label:'Food',words:[
    {ko:'음식',en:'food'},{ko:'김치',en:'kimchi'},{ko:'빵',en:'bread'},{ko:'커피',en:'coffee'},
    {ko:'물',en:'water'},{ko:'맛',en:'taste'},{ko:'밥',en:'rice'},{ko:'고기',en:'meat'},
    {ko:'과일',en:'fruit'},{ko:'라면',en:'ramen'},{ko:'치킨',en:'chicken'},{ko:'김밥',en:'kimbap'},
    {ko:'떡볶이',en:'tteokbokki'},{ko:'삼겹살',en:'pork belly'},{ko:'소주',en:'soju'},{ko:'비빔밥',en:'bibimbap'}]},
  nature:{icon:'',label:'Nature',words:[
    {ko:'바다',en:'sea'},{ko:'산',en:'mountain'},{ko:'꽃',en:'flower'},{ko:'하늘',en:'sky'},
    {ko:'별',en:'star'},{ko:'달',en:'moon'},{ko:'해',en:'sun'},{ko:'비',en:'rain'},
    {ko:'눈',en:'snow'},{ko:'날씨',en:'weather'},{ko:'봄',en:'spring'},{ko:'여름',en:'summer'},
    {ko:'가을',en:'autumn'},{ko:'겨울',en:'winter'},{ko:'길',en:'road'},{ko:'강',en:'river'}]},
  emotion:{icon:_safeKhSvg('heart',{size:18,color:'#a78bfa'}),label:'Emotion',words:[
    {ko:'사랑',en:'love'},{ko:'행복',en:'happiness'},{ko:'희망',en:'hope'},{ko:'꿈',en:'dream'},
    {ko:'마음',en:'heart'},{ko:'건강',en:'health'},{ko:'미래',en:'future'},{ko:'자유',en:'freedom'},
    {ko:'평화',en:'peace'},{ko:'감사',en:'gratitude'},{ko:'노력',en:'effort'},{ko:'성공',en:'success'},
    {ko:'실패',en:'failure'},{ko:'슬픔',en:'sadness'},{ko:'기쁨',en:'joy'},{ko:'용기',en:'courage'}]},
  culture:{icon:'',label:'Culture',words:[
    {ko:'영화',en:'movie'},{ko:'음악',en:'music'},{ko:'노래',en:'song'},{ko:'춤',en:'dance'},
    {ko:'예술',en:'art'},{ko:'문화',en:'culture'},{ko:'역사',en:'history'},{ko:'여행',en:'travel'},
    {ko:'운동',en:'exercise'},{ko:'공부',en:'study'},{ko:'책',en:'book'},{ko:'게임',en:'game'},
    {ko:'한복',en:'hanbok'},{ko:'태권도',en:'taekwondo'},{ko:'불고기',en:'bulgogi'},{ko:'막걸리',en:'makgeolli'}]},
  work:{icon:'',label:'Work',words:[
    {ko:'경제',en:'economy'},{ko:'과학',en:'science'},{ko:'기술',en:'technology'},{ko:'정치',en:'politics'},
    {ko:'돈',en:'money'},{ko:'일',en:'work'},{ko:'계획',en:'plan'},{ko:'회의',en:'meeting'},
    {ko:'컴퓨터',en:'computer'},{ko:'인터넷',en:'internet'},{ko:'전화기',en:'telephone'},{ko:'도서관',en:'library'},
    {ko:'편의점',en:'convenience store'},{ko:'병원',en:'hospital'},{ko:'경찰',en:'police'},{ko:'의사',en:'doctor'}]}
};
// Deep-copy fallback into working TOPICS so DB words can be merged in
var TOPICS=(function(){
  var t={};
  Object.keys(_FALLBACK_TOPICS).forEach(function(k){
    var src=_FALLBACK_TOPICS[k];
    t[k]={icon:src.icon,label:src.label,words:src.words.slice()};
  });
  return t;
})();

// Map interest_tag values from vocabulary_bank to TOPICS keys
var _TAG_TO_TOPIC={
  daily:'daily',everyday:'daily',general:'daily',
  food:'food',cooking:'food',restaurant:'food',drink:'food',drinks:'food',
  nature:'nature',weather:'nature',environment:'nature',outdoors:'nature',
  emotion:'emotion',feelings:'emotion',emotions:'emotion',health:'emotion',wellness:'emotion',
  culture:'culture',entertainment:'culture',arts:'culture',art:'culture',travel:'culture',sport:'culture',sports:'culture',
  work:'work',business:'work',technology:'work',tech:'work',education:'work',politics:'work',economy:'work'
};

// Load live vocabulary from DB and merge into TOPICS; silently fall back if unavailable
(async function loadWordDropVocabFromDB(){
  try {
    var sb=typeof getSupa==='function'?getSupa():null;
    if(!sb)return;
    var result=await sb.from('vocabulary_bank')
      .select('word_ko,word_en,interest_tag')
      .eq('is_active',true)
      .limit(200);
    if(result.error||!result.data||!result.data.length)return;
    // Track which ko words already exist per topic to avoid duplicates
    var existing={};
    Object.keys(TOPICS).forEach(function(k){
      existing[k]={};
      TOPICS[k].words.forEach(function(w){existing[k][w.ko]=1;});
    });
    // Overflow bucket for untagged or unmatched words — goes into 'daily'
    result.data.forEach(function(r){
      if(!r.word_ko||!r.word_en)return;
      var tag=(r.interest_tag||'').toLowerCase().trim();
      var topicKey=_TAG_TO_TOPIC[tag]||'daily';
      if(!existing[topicKey][r.word_ko]){
        TOPICS[topicKey].words.push({ko:r.word_ko,en:r.word_en});
        existing[topicKey][r.word_ko]=1;
      }
    });
  }catch(e){/* silently fall back to hardcoded */}
})();
var SPEED_CFG={slow:{base:.4,interval:4000},normal:{base:.7,interval:3000},fast:{base:1.2,interval:2000}};
var _mode='ko2en',_speed='normal',_selectedTopics=['daily'];

function renderTopics(){
  var el=document.getElementById('topic-grid');
  el.innerHTML=Object.keys(TOPICS).map(function(k){
    var t=TOPICS[k],on=_selectedTopics.indexOf(k)>=0?' on':'';
    return '<button type="button" class="topic-btn'+on+'" onclick="toggleTopic(\''+k+'\')"><span class="ico">'+t.icon+'</span>'+t.label+'</button>';
  }).join('');
}
window.setMode=function(m){_mode=m;document.querySelectorAll('.mode-btn').forEach(function(b){b.classList.toggle('on',b.dataset.mode===m);});};
window.setSpeed=function(s){_speed=s;document.querySelectorAll('.speed-btn').forEach(function(b){b.classList.toggle('on',b.dataset.spd===s);});};
window.toggleTopic=function(k){var i=_selectedTopics.indexOf(k);if(i>=0)_selectedTopics.splice(i,1);else _selectedTopics.push(k);if(!_selectedTopics.length)_selectedTopics.push(k);renderTopics();};
window.showMenu=function(){
  document.getElementById('menu-screen').style.display='flex';
  document.getElementById('end-screen').style.display='none';
  document.getElementById('game-header').style.display='none';
  document.getElementById('game-area').style.display='none';
  document.getElementById('bottom-panel').style.display='none';
};
function getPool(){var p=[];_selectedTopics.forEach(function(k){if(TOPICS[k])p=p.concat(TOPICS[k].words);});return p.length?p:TOPICS.daily.words;}

// ── Game state ──
var POOL=[],words=[],areaEl,areaH,areaW;
var score=0,combo=0,maxCombo=0,lives=5,level=1,correctCount=0;
var gameRunning=false,baseSpeed,spawnInterval,lastSpawn=0,animFrame;
var bestScore=parseInt(localStorage.getItem('kh_worddrop_best')||'0');

window.startGame=function(){
  POOL=getPool();
  var cfg=SPEED_CFG[_speed]||SPEED_CFG.normal;
  baseSpeed=cfg.base;spawnInterval=cfg.interval;
  document.getElementById('menu-screen').style.display='none';
  document.getElementById('end-screen').style.display='none';
  document.getElementById('game-header').style.display='flex';
  areaEl=document.getElementById('game-area');areaEl.style.display='block';areaEl.innerHTML='';
  document.getElementById('bottom-panel').style.display='block';
  var inp=document.getElementById('g-input');
  inp.placeholder=_mode==='ko2en'?'Type English meaning...':'Type in Korean...';
  words=[];score=0;combo=0;maxCombo=0;lives=5;level=1;correctCount=0;lastSpawn=0;
  updateUI();gameRunning=true;
  areaH=areaEl.offsetHeight;areaW=areaEl.offsetWidth;
  inp.focus();
  if(animFrame)cancelAnimationFrame(animFrame);
  lastSpawn=performance.now();loop(performance.now());
};

function spawnWord(){
  var pool=POOL.filter(function(v){return!words.some(function(w){return w.ko===v.ko;});});
  if(!pool.length)pool=POOL.slice();
  var w=pool[Math.floor(Math.random()*pool.length)];
  var display=_mode==='ko2en'?w.ko:w.en;
  var el=document.createElement('div');el.className='word-pill';el.textContent=display;
  areaEl.appendChild(el);
  var pw=el.offsetWidth||80;
  var x=Math.random()*(areaW-pw);
  el.style.left=x+'px';el.style.top='-50px';
  words.push({ko:w.ko,en:w.en.toLowerCase(),display:display,el:el,x:x,y:-50,speed:baseSpeed+Math.random()*.2});
}

function loop(now){
  if(!gameRunning)return;
  animFrame=requestAnimationFrame(loop);
  areaH=areaEl.offsetHeight;areaW=areaEl.offsetWidth;
  if(now-lastSpawn>spawnInterval&&words.length<6){spawnWord();lastSpawn=now;}
  for(var i=words.length-1;i>=0;i--){
    var w=words[i];w.y+=w.speed;
    w.el.style.top=w.y+'px';
    // Danger zone
    if(w.y>areaH-80)w.el.classList.add('danger');
    // Fell off
    if(w.y>areaH+10){
      w.el.classList.add('missed');
      setTimeout((function(el){return function(){el.remove();};})(w.el),300);
      words.splice(i,1);lives--;combo=0;updateUI();
      if(lives<=0)endGame();
    }
  }
  updateHints();
}

window.checkAnswer=function(){
  var inp=document.getElementById('g-input');
  var raw=(inp.value||'').trim();if(!raw)return;
  var ans=raw.toLowerCase();inp.value='';
  var matched=null,matchIdx=-1;
  words.forEach(function(w,i){
    var hit=_mode==='ko2en'
      ?(w.en===ans||w.en.split('/').indexOf(ans)>=0||w.en.split(',').map(function(s){return s.trim();}).indexOf(ans)>=0||w.ko===raw)
      :(w.ko===raw||w.en===ans);
    if(hit&&(!matched||w.y>matched.y)){matched=w;matchIdx=i;}
  });
  if(matched){
    combo++;if(combo>maxCombo)maxCombo=combo;correctCount++;
    var pts = 10*Math.min(combo,10);
    score += pts;
    // Per-catch +N popup positioned over the matched word.
    var rect=matched.el.getBoundingClientRect(),aRect=areaEl.getBoundingClientRect();
    var cx=rect.left-aRect.left+rect.width/2,cy=rect.top-aRect.top+rect.height/2;
    var wp=document.createElement('div');
    wp.className='wd-popup';
    wp.textContent='+'+pts;
    wp.style.left=cx+'px';
    wp.style.top=cy+'px';
    areaEl.appendChild(wp);
    setTimeout((function(el){return function(){ try { el.remove(); } catch(_){} };})(wp), 900);
    var colors=['#7dd3fc','#60a5fa','#a78bfa','#34d399','#fbbf24'];
    for(var p=0;p<10;p++){
      var dot=document.createElement('div');dot.className='particle';
      var sz=3+Math.random()*4;dot.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+cx+'px;top:'+cy+'px;background:'+colors[p%5]+';opacity:1';
      areaEl.appendChild(dot);
      var vx=(Math.random()-.5)*120,vy=(Math.random()-.5)*120-40;
      (function(d,vx,vy,cx,cy){var t=0;var iv=setInterval(function(){t+=16;var prog=t/500;
        d.style.left=(cx+vx*prog)+'px';d.style.top=(cy+vy*prog+100*prog*prog)+'px';d.style.opacity=1-prog;
        if(prog>=1){clearInterval(iv);d.remove();}
      },16);})(dot,vx,vy,cx,cy);
    }
    matched.el.classList.add('correct');
    setTimeout((function(el){return function(){el.remove();};})(matched.el),400);
    words.splice(matchIdx,1);
    _lastHintWord=null;
    if(combo>=3&&combo%3===0){var fl=document.createElement('div');fl.className='combo-flash';fl.textContent='x'+combo+' COMBO!';document.body.appendChild(fl);setTimeout(function(){fl.remove();},600);}
    if(correctCount%5===0){level++;baseSpeed=Math.min(baseSpeed+.08,2.5);spawnInterval=Math.max(spawnInterval-120,800);}
    updateUI();
  } else {
    // PR #7AE: replace the border-color blink with a proper shake +
    // red-tint flash — same pattern as Dictation/Chosung/OX.
    inp.classList.remove('wd-shake');
    void inp.offsetWidth;
    inp.classList.add('wd-shake');
    setTimeout(function(){ inp.classList.remove('wd-shake'); }, 460);
  }
  inp.focus();
};

function updateUI(){
  var scEl=document.getElementById('g-score');
  var prev=parseInt(scEl.textContent||'0',10);
  scEl.textContent=score;
  if(score>prev){
    scEl.classList.remove('wd-bump');
    void scEl.offsetWidth;
    scEl.classList.add('wd-bump');
  }
  document.getElementById('g-combo').textContent='x'+Math.max(1,combo);
  document.getElementById('g-lives').textContent=lives;
  document.getElementById('g-level').textContent=level;
}
function endGame(){
  gameRunning=false;if(animFrame)cancelAnimationFrame(animFrame);
  words.forEach(function(w){w.el.remove();});words=[];
  if(score>bestScore){bestScore=score;localStorage.setItem('kh_worddrop_best',String(bestScore));}
  if(window.playgroundScores){playgroundScores.submit('worddrop',score,{mode:_mode,speed:_speed,topics:_selectedTopics.slice()});}
  var iconHtml=score>=500
    ?khSvg('trophy',{size:64,color:'#fbbf24'})
    :score>=200
      ?khSvg('star',{size:64,color:'#fbbf24'})
      :score>=100
        ?khSvg('thumbs_up',{size:64,color:'#7dd3fc'})
        :'';
  document.getElementById('end-emoji').innerHTML=iconHtml;
  document.getElementById('end-score').textContent=score+' pts';
  document.getElementById('end-stats').textContent=correctCount+' words · combo x'+maxCombo+' · level '+level;
  document.getElementById('end-best').textContent='Best: '+bestScore+' pts';
  document.getElementById('end-screen').style.display='flex';
}
// ── Hint row ──
var _lastHintWord=null;
function updateHints(){
  var row=document.getElementById('hint-row');if(!row)return;
  // Find bottom-most word
  var bottom=null;
  words.forEach(function(w){if(!bottom||w.y>bottom.y)bottom=w;});
  if(!bottom||bottom===_lastHintWord&&row.children.length>0)return;
  _lastHintWord=bottom;
  // Correct answer(s)
  var correctVal=_mode==='ko2en'?bottom.en:bottom.ko;
  // Build wrong options from pool
  var wrongs=[];
  POOL.forEach(function(p){
    var v=_mode==='ko2en'?p.en.toLowerCase():p.ko;
    if(v!==correctVal&&wrongs.indexOf(v)<0)wrongs.push(v);
  });
  wrongs.sort(function(){return Math.random()-.5;});
  var opts=[correctVal].concat(wrongs.slice(0,3));
  opts.sort(function(){return Math.random()-.5;});
  row.innerHTML=opts.map(function(o){
    return '<div class="hint-chip">'+o+'</div>';
  }).join('');
}

// ── Keyboard position ──
function setupKeyboardHandler(){
  if(!window.visualViewport)return;
  var panel=document.getElementById('bottom-panel');
  window.visualViewport.addEventListener('resize',function(){
    var vv=window.visualViewport;
    var diff=window.innerHeight-vv.height;
    if(diff>100){
      // Keyboard open
      panel.style.position='fixed';
      panel.style.bottom='0';
      panel.style.left='0';
      panel.style.right='0';
      panel.style.padding='4px 16px';
      panel.style.background='rgba(5,11,21,.92)';
      panel.style.zIndex='50';
    } else {
      panel.style.position='';
      panel.style.bottom='';
      panel.style.left='';
      panel.style.right='';
      panel.style.padding='';
      panel.style.background='';
      panel.style.zIndex='';
    }
  });
}

setupKeyboardHandler();
renderTopics();
})()
</script>
