<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Page — KoreHan News</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="korehan-shared.css">
<style>
/* Base font override for this page */
body { font-family: 'Inter', 'Noto Sans KR', sans-serif; }

/* Hero */
.mypage-hero {
  background: linear-gradient(135deg,#0b1626,#1a3a6b);
  padding: 36px 22px 28px; color:#fff; overflow:hidden;
}
.mypage-hero-inner { max-width:960px; margin:0 auto; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
.mp-avatar-wrap { position:relative; flex-shrink:0; cursor:pointer; }
.mp-avatar-wrap:hover .mp-avatar-edit { opacity:1; }
.mp-avatar-img  { width:76px; height:76px; border-radius:50%; border:2px solid rgba(255,255,255,.3); object-fit:cover; display:block; }
.mp-initials { width:76px; height:76px; border-radius:50%; background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.07)); border:2px solid rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:#fff; font-family:'Inter',sans-serif; letter-spacing:-.02em; }
.mp-avatar-edit { position:absolute; inset:0; border-radius:50%; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .2s; }
.mypage-name { font-family:'Inter','Noto Sans KR',sans-serif; font-size:22px; font-weight:800; letter-spacing:-.02em; margin:0 0 3px; cursor:pointer; }
.mypage-name:hover { opacity:.8; }
.mypage-email { font-size:13px; color:rgba(255,255,255,.55); margin:0 0 3px; font-weight:400; }
.mp-member-since { font-size:11px; color:rgba(255,255,255,.38); }
.hero-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.mp-action-btn { font-size:12px; font-weight:700; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:5px 14px; color:rgba(255,255,255,.8); cursor:pointer; font-family:inherit; transition:all .15s; }
.mp-action-btn:hover { background:rgba(255,255,255,.17); color:#fff; }

/* Page body */
.mypage-body { max-width:960px; margin:0 auto; padding:28px 20px 70px; }

/* XP Card */
.xp-card { background:#fff; border:1px solid var(--border); border-radius:20px; padding:26px; margin-bottom:16px; box-shadow:0 4px 20px rgba(15,23,42,.06); }
.xp-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
.xp-total { font-family:'Inter',sans-serif; font-size:56px; font-weight:900; color:#0b1626; line-height:1; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
.xp-total-label { font-size:11px; color:#94a3b8; font-weight:500; margin-top:5px; letter-spacing:.04em; text-transform:uppercase; }
.xp-tier-badge { display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:8px; font-size:12px; font-weight:700; font-family:'Inter',sans-serif; letter-spacing:.02em; }
.xp-tier-badge.bronze  { background:#fef3c7; color:#b45309; }
.xp-tier-badge.silver  { background:#f1f5f9; color:#64748b; }
.xp-tier-badge.gold    { background:#fffbeb; color:#d97706; }
.xp-tier-badge.plat    { background:#f5f3ff; color:#7c3aed; }
.xp-tier-badge.diamond { background:#eff6ff; color:#1d4ed8; }
.xp-track { height:6px; border-radius:999px; background:#eef0f5; overflow:hidden; margin-bottom:8px; }
.xp-fill  { height:100%; border-radius:999px; background:linear-gradient(90deg,#2255a4,#3d7fd4); transition:width .7s ease; }
.xp-meta  { display:flex; justify-content:space-between; font-size:11px; color:#94a3b8; font-weight:500; }

/* Stats grid */
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:28px; }
.stat-card  { background:#fff; border:1px solid var(--border); border-radius:16px; padding:18px 16px; display:flex; align-items:center; gap:14px; box-shadow:0 2px 12px rgba(15,23,42,.05); }
.stat-icon  { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.stat-icon.s-streak  { background:#fff7ed; }
.stat-icon.s-articles{ background:#eff6ff; }
.stat-icon.s-words   { background:#f0fdf4; }
.stat-icon.s-quizzes { background:#fdf4ff; }
.stat-body  { min-width:0; }
.stat-n     { font-family:'Inter',sans-serif; font-size:28px; font-weight:800; color:#0b1626; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
.stat-lbl   { font-size:10px; color:#94a3b8; font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin-top:5px; white-space:nowrap; }
@media (max-width:800px) { .stats-grid { grid-template-columns:repeat(2,1fr); } }
@media (max-width:420px) { .stats-grid { grid-template-columns:repeat(2,1fr); gap:10px; } .stat-card { padding:16px 14px; gap:12px; } .stat-n { font-size:26px; } }

/* Tier grid */
.tier-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:24px; }
.tier-item { background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px 10px; text-align:center; }
.tier-item.current { border-color:#2255a4; border-width:2px; background:#f0f6ff; }
.tier-icon  { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 8px; }
.tier-icon svg { display:block; }
.tier-label { font-size:11px; font-weight:700; color:#0b1626; margin-bottom:3px; font-family:'Inter',sans-serif; letter-spacing:.01em; }
.tier-xp    { font-size:10px; color:#94a3b8; font-family:'Inter',sans-serif; font-weight:500; }
.tier-bar   { height:5px; background:#eef0f5; border-radius:99px; overflow:hidden; margin-top:7px; }
.tier-bar-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,#2255a4,#3d7fd4); }

/* Stat card SVG icons */
.stat-icon svg { display:block; width:22px; height:22px; }

/* Tier badge — text only, no emoji */
.xp-tier-badge { display:inline-flex; align-items:center; gap:6px; }
.xp-tier-badge .tier-dot {
  width:8px; height:8px; border-radius:50%; flex-shrink:0;
}
.xp-tier-badge.bronze .tier-dot  { background:#cd7f32; }
.xp-tier-badge.silver .tier-dot  { background:#94a3b8; }
.xp-tier-badge.gold   .tier-dot  { background:#f59e0b; }
.xp-tier-badge.plat   .tier-dot  { background:#7c3aed; }
.xp-tier-badge.diamond .tier-dot { background:#1d4ed8; }

/* Sections */
.mp-section { background:#fff; border:1px solid var(--border); border-radius:16px; padding:24px; margin-bottom:16px; box-shadow:0 2px 10px rgba(15,23,42,.04); }
.mp-section h3 { font-family:'Inter',sans-serif; font-size:13px; font-weight:700; color:#0b1626; margin:0 0 16px; text-transform:uppercase; letter-spacing:.06em; }
.mp-section-divider { height:1px; background:var(--border); margin:4px 0; }

/* Profile fields */
.pf-row { display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid #f0f4f9; }
.pf-row:last-child { border-bottom:none; }
.pf-label { font-family:'Inter',sans-serif; font-size:10px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:.06em; width:80px; flex-shrink:0; }
.pf-value { flex:1; font-size:14px; color:#0b1626; font-weight:500; font-family:'Inter','Noto Sans KR',sans-serif; }
.pf-btn { padding:6px 14px; border:1px solid var(--border); border-radius:999px; background:#fff; font-size:12px; font-weight:700; color:#2255a4; cursor:pointer; white-space:nowrap; transition:all .15s; font-family:inherit; }
.pf-btn:hover { background:#f0f6ff; border-color:#93c5fd; }

/* Danger zone */
.danger-zone { background:#fff5f5; border:1px solid #fecaca; border-radius:14px; padding:20px 22px; }
.danger-zone h3 { color:#b91c1c; }

/* Nickname modal */
.nn-overlay { position:fixed; inset:0; background:rgba(5,12,24,.72); display:flex; align-items:center; justify-content:center; z-index:3000; padding:16px; }
.nn-modal   { background:#fff; border-radius:20px; width:min(440px,96vw); padding:28px 26px; box-shadow:0 24px 64px rgba(0,0,0,.25); }
.nn-modal h3 { margin:0 0 6px; font-size:18px; font-weight:900; color:#0b1626; }
.nn-modal p  { font-size:13px; color:#64748b; margin:0 0 20px; line-height:1.6; }
.nn-cost-badge { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:999px; background:#eff6ff; color:#2255a4; font-size:13px; font-weight:800; margin-bottom:16px; }
.nn-input { width:100%; padding:12px 14px; border:2px solid var(--border); border-radius:12px; font-size:15px; font-weight:600; font-family:inherit; outline:none; transition:border-color .15s; box-sizing:border-box; }
.nn-input:focus { border-color:#2255a4; }
.nn-actions { display:flex; gap:10px; margin-top:16px; }
.nn-btn-cancel { flex:1; padding:12px; border:1.5px solid var(--border); border-radius:12px; background:#fff; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; color:#64748b; }
.nn-btn-confirm { flex:1; padding:12px; border:none; border-radius:12px; background:#2255a4; color:#fff; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; }
.nn-btn-confirm:disabled { opacity:.45; cursor:not-allowed; }
body.kh-neon-on .nn-modal { background:#071320 !important; }
body.kh-neon-on .nn-modal h3 { color:#e4f9ff !important; }
body.kh-neon-on .nn-modal p  { color:rgba(163,230,235,.65) !important; }
body.kh-neon-on .nn-cost-badge { background:rgba(0,255,214,.1) !important; color:#8ffcff !important; }
body.kh-neon-on .nn-input { background:rgba(9,18,33,.9) !important; border-color:rgba(0,255,214,.25) !important; color:#e4f9ff !important; }
body.kh-neon-on .nn-input:focus { border-color:rgba(0,255,214,.6) !important; }
body.kh-neon-on .nn-btn-cancel { background:transparent !important; border-color:rgba(0,255,214,.2) !important; color:rgba(163,230,235,.7) !important; }

/* XP log */
.xp-log-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid #f0f4f9; }
.xp-log-row:last-child { border-bottom:none; }
.xp-log-reason { font-size:14px; font-weight:600; color:#0b1626; font-family:'Inter',sans-serif; }
.xp-log-date   { font-size:11px; color:#94a3b8; margin-top:2px; font-weight:400; }
.xp-log-amount { font-size:14px; font-weight:800; color:#2255a4; font-family:'Inter',sans-serif; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.inv-card{border:1px solid #e2e8f0;border-radius:12px;padding:12px;background:#f8fbff}
.inv-thumb{width:100%;height:94px;border-radius:10px;background:#e2e8f0;background-size:cover;background-position:center;margin-bottom:8px}
.inv-name{font-size:13px;font-weight:800;color:#0b1626}
.inv-desc{font-size:12px;color:#64748b;line-height:1.5;margin-top:4px}
.inv-meta{font-size:11px;color:#2255a4;font-weight:800;margin-top:6px}
.gift-log-row{padding:10px 0;border-bottom:1px solid #eef2f7;font-size:13px;color:#334155}
.gift-log-row:last-child{border-bottom:none}

/* Neon overrides */
body.kh-neon-on .mypage-hero { background:linear-gradient(135deg,#050d1a,#091b3a) !important; border-bottom:1px solid rgba(0,255,214,.1); }
body.kh-neon-on .mypage-name { color:#e4f9ff !important; }
body.kh-neon-on .mypage-email { color:rgba(163,230,235,.55) !important; }
body.kh-neon-on .mp-member-since { color:rgba(163,230,235,.35) !important; }
body.kh-neon-on .mp-action-btn { background:rgba(255,255,255,.07) !important; border-color:rgba(0,255,214,.2) !important; color:rgba(163,230,235,.8) !important; }
body.kh-neon-on .mp-initials { background:rgba(0,255,214,.1) !important; border-color:rgba(0,255,214,.28) !important; }
body.kh-neon-on .mp-avatar-img { border-color:rgba(0,255,214,.35) !important; }

body.kh-neon-on .xp-card,

body.kh-neon-on .tier-item { background:rgba(9,18,33,.92) !important; border-color:rgba(0,255,214,.16) !important; }
body.kh-neon-on .tier-item.current { background:rgba(0,255,214,.07) !important; border-color:rgba(0,255,214,.4) !important; }

@media (max-width:700px) {
  .mini-stats { grid-template-columns:repeat(2,1fr); }
  .tier-grid  { grid-template-columns:repeat(5,1fr); gap:6px; }
  .tier-item  { padding:10px 6px; }
  .tier-icon  { font-size:20px; }
}
@media (max-width:480px) { .tier-grid { grid-template-columns:repeat(3,1fr); } }

/* ═══ Animations & visual life ═══ */

/* XP number glow pulse */
@keyframes xpGlow {
  0%, 100% { text-shadow: 0 0 8px rgba(34,85,164,.15); }
  50% { text-shadow: 0 0 24px rgba(34,85,164,.35), 0 0 48px rgba(61,127,212,.15); }
}
.xp-total { animation: xpGlow 3s ease-in-out infinite; }

/* Tier badge shimmer */
@keyframes badgeShimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}
.xp-tier-badge {
  background-size: 200% auto;
  animation: badgeShimmer 4s linear infinite;
}
.xp-tier-badge.bronze  { background-image: linear-gradient(90deg, #fef3c7 0%, #fde68a 25%, #fef3c7 50%, #fde68a 75%, #fef3c7 100%); }
.xp-tier-badge.silver  { background-image: linear-gradient(90deg, #f1f5f9 0%, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%, #f1f5f9 100%); }
.xp-tier-badge.gold    { background-image: linear-gradient(90deg, #fffbeb 0%, #fde68a 25%, #fffbeb 50%, #fde68a 75%, #fffbeb 100%); }
.xp-tier-badge.plat    { background-image: linear-gradient(90deg, #f5f3ff 0%, #ddd6fe 25%, #f5f3ff 50%, #ddd6fe 75%, #f5f3ff 100%); }
.xp-tier-badge.diamond { background-image: linear-gradient(90deg, #eff6ff 0%, #bfdbfe 25%, #eff6ff 50%, #bfdbfe 75%, #eff6ff 100%); }

/* Progress bar animated fill */
@keyframes progressPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .75; }
}
.xp-fill { animation: progressPulse 2.5s ease-in-out infinite; }

/* Stat cards — staggered entrance */
@keyframes statSlideIn {
  from { opacity: 0; transform: translateY(18px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.stat-card {
  animation: statSlideIn .45s cubic-bezier(.22,1,.36,1) both;
  transition: transform .18s ease, box-shadow .18s ease;
}
.stat-card:nth-child(1) { animation-delay: .05s; }
.stat-card:nth-child(2) { animation-delay: .1s; }
.stat-card:nth-child(3) { animation-delay: .15s; }
.stat-card:nth-child(4) { animation-delay: .2s; }
.stat-card:nth-child(5) { animation-delay: .25s; }
.stat-card:nth-child(6) { animation-delay: .3s; }
.stat-card:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 24px rgba(15,23,42,.1); }

/* XP card entrance */
@keyframes xpCardIn {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
.xp-card { animation: xpCardIn .5s cubic-bezier(.22,1,.36,1) both; }

/* Tier items — staggered entrance + hover */
@keyframes tierFadeIn {
  from { opacity: 0; transform: scale(.88); }
  to   { opacity: 1; transform: scale(1); }
}
.tier-item {
  animation: tierFadeIn .4s cubic-bezier(.22,1,.36,1) both;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.tier-item:nth-child(1) { animation-delay: .05s; }
.tier-item:nth-child(2) { animation-delay: .1s; }
.tier-item:nth-child(3) { animation-delay: .15s; }
.tier-item:nth-child(4) { animation-delay: .2s; }
.tier-item:nth-child(5) { animation-delay: .25s; }
.tier-item:hover { transform: scale(1.06); box-shadow: 0 6px 20px rgba(15,23,42,.08); }

/* Current tier gentle bounce */
@keyframes tierBounce {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}
.tier-item.current { animation: tierBounce 2.5s ease-in-out infinite; }
.tier-item.current .tier-icon { animation: tierBounce 2s ease-in-out infinite; animation-delay: .3s; }

/* Stat number count-up feel */
@keyframes numPop {
  0%   { transform: scale(.7); opacity: 0; }
  60%  { transform: scale(1.08); }
  100% { transform: scale(1); opacity: 1; }
}
.stat-n { animation: numPop .5s cubic-bezier(.22,1,.36,1) both; }

/* Hero avatar float */
@keyframes avatarFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.mp-avatar-wrap { animation: avatarFloat 4s ease-in-out infinite; }

/* Streak icon flame flicker */
@keyframes flameFlicker {
  0%, 100% { transform: scale(1) rotate(0deg); }
  25% { transform: scale(1.08) rotate(-3deg); }
  75% { transform: scale(1.04) rotate(2deg); }
}
.stat-icon.s-streak { animation: flameFlicker 1.8s ease-in-out infinite; }

/* Progress bar shimmer overlay */
@keyframes barShimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
.xp-fill { position: relative; overflow: hidden; }
.xp-fill::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  animation: barShimmer 2s ease-in-out infinite;
}
.tier-bar-fill { position: relative; overflow: hidden; }
.tier-bar-fill::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  animation: barShimmer 2.5s ease-in-out infinite;
}

/* Section entrance */
@keyframes sectionIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Neon mode: stat card glow on hover */

<script>

// ── Tier SVG mark helper ────────────────────────────────────────
var TIER_COLORS = { bronze:'#cd7f32', silver:'#94a3b8', gold:'#f59e0b', plat:'#7c3aed', diamond:'#1d4ed8' };
function tierMark(cls, size, faded) {
  var c = TIER_COLORS[cls] || '#94a3b8';
  var opacity = faded ? 0.28 : 1;
  // Hexagon path
  var s = size || 18;
  return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" style="opacity:' + opacity + '">'
    + '<polygon points="12,2 20.5,7 20.5,17 12,22 3.5,17 3.5,7" fill="' + c + '" stroke="' + c + '" stroke-width="1" stroke-linejoin="round"/>'
    + '</svg>';
}

// ── Stat card SVG icons ─────────────────────────────────────────
var SVG_ICONS = {
  streak:
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M12 2C12 8 6 9 6 14a6 6 0 0012 0C18 9 12 8 12 2z" stroke="#f97316" fill="#fed7aa"/>'
    + '<path d="M12 12c0 3-2 4-2 5.5a2 2 0 004 0C14 16 12 15 12 12z" fill="#f97316" stroke="none"/>'
    + '</svg>',
  articles:
    '<svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
    + '<rect x="4" y="3" width="16" height="18" rx="2"/>'
    + '<line x1="8" y1="8" x2="16" y2="8"/>'
    + '<line x1="8" y1="12" x2="16" y2="12"/>'
    + '<line x1="8" y1="16" x2="12" y2="16"/>'
    + '</svg>',
  words:
    '<svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z" fill="#dcfce7"/>'
    + '</svg>',
  quizzes:
    '<svg viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
    + '<circle cx="12" cy="12" r="10" fill="#f5f3ff"/>'
    + '<polyline points="9 12 11 14.5 15 9.5"/>'
    + '</svg>',
  xp:
    '<svg viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
    + '<polygon points="12 2 14.9 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 9.1 8.3 12 2" fill="#dbeafe"/>'
    + '</svg>',
  nyang:
    '<svg viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
    + '<circle cx="12" cy="12" r="10" fill="#fef3c7"/>'
    + '<path d="M9 9h.01M15 9h.01M8 13s1 2 4 2 4-2 4-2" stroke-linecap="round"/>'
    + '</svg>',
};

// ── Tier helper ────────────────────────────────────────────────
function getXPTier(xp) {
  if (xp >= 75000) return { label:'Diamond', cls:'diamond', next:null,       from:75000, to:75000 };
  if (xp >= 30000) return { label:'Platinum', cls:'plat',   next:'Diamond',  from:30000, to:75000 };
  if (xp >= 12000) return { label:'Gold',     cls:'gold',   next:'Platinum', from:12000, to:30000 };
  if (xp >= 4500)  return { label:'Silver',   cls:'silver', next:'Gold',     from:4500,  to:12000 };
  return               { label:'Bronze',   cls:'bronze', next:'Silver',   from:0,    to:4500  };
}

var TIERS = [
  { label:'Bronze',  cls:'bronze',  min:0,     max:4500  },
  { label:'Silver',  cls:'silver',  min:4500,  max:12000 },
  { label:'Gold',    cls:'gold',    min:12000, max:30000 },
  { label:'Platinum',cls:'plat',    min:30000, max:75000 },
  { label:'Diamond', cls:'diamond', min:75000, max:75000 },
];

// ── Load user stats ────────────────────────────────────────────
// XP + streak are ALWAYS computed from daily_missions (same source as Learning Hub)
async function dbGetUserStats() {
  if (!supaUser) return null;
  var sb = getSupa();
  if (!sb) return null;

  var statsData = null;
  var computedXP = 0;
  var computedStreak = 0;

  // Load user_stats and all daily_missions in parallel
  var results = await Promise.allSettled([
    sb.from('user_stats')
      .select('quizzes_done, articles_read, words_saved, coin_balance')
      .eq('user_id', supaUser.id).maybeSingle(),
    sb.from('daily_missions')
      .select('date, articles, words, quizzes, fill')
      .eq('user_id', supaUser.id)
      .order('date', { ascending: false })
  ]);

  if (results[0].status === 'fulfilled' && results[0].value.data) {
    statsData = results[0].value.data;
  }
  if (results[1].status === 'fulfilled' && results[1].value.data) {
    var rows = results[1].value.data;
    // XP
    computedXP = rows.reduce(function(sum, d) {
      return sum + (d.articles||0)*10 + (d.words||0)*2 + (d.quizzes||0)*5 + (d.fill||0)*5;
    }, 0);
    // Streak: consecutive days with any activity (KST)
    var activeDates = {};
    rows.forEach(function(d) {
      if ((d.articles||0)+(d.words||0)+(d.quizzes||0)+(d.fill||0) > 0) activeDates[d.date] = true;
    });
    var cur = new Date(Date.now() + 9*3600000);
    for (var i = 0; i < 400; i++) {
      var key = cur.toISOString().slice(0, 10);
      if (activeDates[key]) { computedStreak++; cur.setDate(cur.getDate() - 1); }
      else if (i === 0) { cur.setDate(cur.getDate() - 1); }
      else break;
    }
  }

  statsData = statsData || {};
  statsData.xp = computedXP;
  statsData.coin_balance = Number(statsData.coin_balance || 0);
  statsData.mission_streak = computedStreak;
  return statsData;
}

async function dbGetXPLog() {
  if (!supaUser) return [];
  var sb = getSupa();
  if (!sb) return [];
  try {
    var { data } = await sb.from('xp_log').select('*').eq('user_id', supaUser.id).order('created_at', { ascending: false }).limit(50);
    return data || [];
  } catch(e) { return []; }
}

// ── Render XP card ─────────────────────────────────────────────
function renderXPCard(xp) {
  var area = document.getElementById('mp-xp-card');
  if (!area) return;
  var tier = getXPTier(xp);
  var pct  = tier.next
    ? Math.min(100, Math.round((xp - tier.from) / (tier.to - tier.from) * 100))
    : 100;

  var dotHtml = '<span class="tier-dot"></span>';

  // Hero badge
  var heroEl = document.getElementById('mp-tier-hero');
  if (heroEl) heroEl.innerHTML = '<span class="xp-tier-badge ' + tier.cls + '">' + dotHtml + tier.label + ' · ' + xp.toLocaleString() + ' XP</span>';

  area.innerHTML =
    '<div class="xp-card">'
    + '<div class="xp-top">'
    + '<div><div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#94a3b8;margin-bottom:6px">Accumulated XP</div>'
    + '<div class="xp-total">' + xp.toLocaleString() + '</div>'
    + '<div class="xp-total-label">total experience points</div></div>'
    + '<div style="text-align:right"><span class="xp-tier-badge ' + tier.cls + '">' + dotHtml + tier.label + '</span>'
    + (tier.next
      ? '<div style="font-size:12px;color:#94a3b8;margin-top:8px;font-weight:600">' + (tier.to - xp).toLocaleString() + ' XP to ' + tier.next + '</div>'
      : '<div style="font-size:12px;color:#16a34a;margin-top:8px;font-weight:700">Maximum tier ✓</div>')
    + '</div></div>'
    + '<div class="xp-track"><div class="xp-fill" style="width:' + pct + '%"></div></div>'
    + '<div class="xp-meta"><span>' + tier.label + ' (' + tier.from.toLocaleString() + ')</span>'
    + (tier.next ? '<span>' + tier.next + ' (' + tier.to.toLocaleString() + ')</span>' : '<span>Max tier</span>')
    + '</div></div>';
}

// ── Render stats ───────────────────────────────────────────────
function renderMiniStats(stats) {
  var el = document.getElementById('mp-mini-stats');
  if (!el) return;
  var us = stats || {};
  function card(iconCls, icon, value, label) {
    return '<div class="stat-card">'
      + '<div class="stat-icon ' + iconCls + '">' + icon + '</div>'
      + '<div class="stat-body"><div class="stat-n">' + value + '</div><div class="stat-lbl">' + label + '</div></div>'
      + '</div>';
  }
  var xpVal = Number(us.xp || 0);
  var coinVal = Number(us.coin_balance || 0);
  el.innerHTML =
    card('s-streak',   SVG_ICONS.streak,   us.mission_streak || us.streak || 0, 'Day Streak')  +
    card('s-articles', SVG_ICONS.articles, us.articles_read  || 0,              'Articles Read') +
    card('s-words',    SVG_ICONS.words,    us.words_saved    || 0,              'Saved Words')   +
    card('s-quizzes',  SVG_ICONS.quizzes,  us.quizzes_done   || 0,              'Quizzes Done')  +
    card('s-articles', SVG_ICONS.xp,       xpVal.toLocaleString(),              'Total XP')       +
    card('s-quizzes',  SVG_ICONS.nyang,    coinVal.toLocaleString(),            '냥 Balance');
}

// ── Render tier grid ───────────────────────────────────────────
function renderTierGrid(xp) {
  var el = document.getElementById('mp-tier-grid');
  if (!el) return;
  var tier = getXPTier(xp);
  el.innerHTML = TIERS.map(function(t) {
    var active  = xp >= t.min;
    var current = tier.label === t.label;
    var pct = (t.max > t.min) ? Math.min(100, Math.round(Math.max(0, xp - t.min) / (t.max - t.min) * 100)) : 100;
    var bgColor = active ? (TIER_COLORS[t.cls] + '18') : '#f4f6fa';
    return '<div class="tier-item' + (current ? ' current' : '') + '">'
      + '<div class="tier-icon" style="background:' + bgColor + '">' + tierMark(t.cls, 18, !active) + '</div>'
      + '<div class="tier-label" style="' + (active ? '' : 'color:#94a3b8') + '">' + t.label + '</div>'
      + '<div class="tier-xp">' + t.min.toLocaleString() + (t.max !== t.min ? '+' : '') + '</div>'
      + (active && t.max !== t.min ? '<div class="tier-bar"><div class="tier-bar-fill" style="width:' + pct + '%"></div></div>' : '')
      + '</div>';
  }).join('');
}

// ── Render XP log ──────────────────────────────────────────────
var _xpLogAll = [];
var _xpLogShowing = 5;

function renderXPLog(rows) {
  _xpLogAll = rows || [];
  _xpLogShowing = 5;
  _drawXPLog();
}

function _drawXPLog() {
  var el = document.getElementById('mp-xp-log');
  if (!el) return;
  if (!_xpLogAll.length) {
    el.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px">No XP activity yet — read articles, take quizzes, and save words to earn XP!</div>';
    return;
  }
  var visible = _xpLogAll.slice(0, _xpLogShowing);
  var html = visible.map(function(row) {
    var ds = row.created_at ? new Date(row.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '';
    // xp_log 컬럼명이 amount/xp/xp_gained/points 등일 수 있으므로 모두 시도
    var _cols = ['amount', 'xp', 'xp_gained', 'xp_amount', 'points'];
    var amt = 0;
    for (var _ci = 0; _ci < _cols.length; _ci++) {
      if (row[_cols[_ci]] != null && +row[_cols[_ci]] > 0) { amt = +row[_cols[_ci]]; break; }
    }
    // 위에서 못찾으면: 행의 모든 숫자 필드 중 양수 첫번째 사용
    if (!amt) {
      var skipCols = { user_id:1, id:1, level:1, streak:1, count:1 };
      Object.keys(row).forEach(function(k) {
        if (!amt && !skipCols[k] && typeof row[k] === 'number' && row[k] > 0 && row[k] < 10000) amt = row[k];
      });
    }
    var sign = amt >= 0 ? '+' : '';
    var color = amt >= 0 ? '' : 'color:#ef4444';
    return '<div class="xp-log-row">'
      + '<div><div class="xp-log-reason">' + (row.reason || 'Activity') + '</div><div class="xp-log-date">' + ds + '</div></div>'
      + '<div class="xp-log-amount" style="' + color + '">' + sign + amt + ' XP</div>'
      + '</div>';
  }).join('');

  // Show more / less button
  if (_xpLogAll.length > 5) {
    var remaining = _xpLogAll.length - _xpLogShowing;
    if (remaining > 0) {
      html += '<button onclick="xpLogShowMore()" style="width:100%;margin-top:14px;padding:10px;border:1px solid var(--border);border-radius:10px;background:#f8faff;color:#2255a4;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Show ' + Math.min(remaining, 10) + ' more ↓</button>';
    } else if (_xpLogShowing > 5) {
      html += '<button onclick="xpLogCollapse()" style="width:100%;margin-top:14px;padding:10px;border:1px solid var(--border);border-radius:10px;background:#f8faff;color:#94a3b8;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Show less ↑</button>';
    }
  }
  el.innerHTML = html;
}

function xpLogShowMore() {
  _xpLogShowing = Math.min(_xpLogShowing + 10, _xpLogAll.length);
  _drawXPLog();
}

function xpLogCollapse() {
  _xpLogShowing = 5;
  _drawXPLog();
}

// ── Render profile fields ──────────────────────────────────────
var _userXP = 0;
var _userCoin = 0;
var NICKNAME_COST = 100;

function renderProfileFields(xp, coin) {
  if (xp !== undefined) _userXP = xp;
  if (coin !== undefined) _userCoin = coin;
  var el = document.getElementById('mp-profile-fields');
  if (!el || !supaUser) return;
  var savedName = localStorage.getItem('kh_display_name');
  var name = savedName || (supaUser.user_metadata && supaUser.user_metadata.full_name) || supaUser.email.split('@')[0];
  var email = supaUser.email || '';
  var since = supaUser.created_at ? new Date(supaUser.created_at).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }) : '—';
  var provider = (supaUser.app_metadata && supaUser.app_metadata.provider) || 'email';
  var provLabel = provider === 'google' ? 'Google' : 'Email';
  var canAfford = _userCoin >= NICKNAME_COST;

  el.innerHTML =
    '<div class="pf-row">'
    + '<div class="pf-label">Nickname</div>'
    + '<div class="pf-value" id="pf-name-val">' + name + '</div>'
    + '<button class="pf-btn" onclick="openNicknameModal()" style="' + (canAfford ? '' : 'opacity:.55') + '" title="' + (canAfford ? '닉네임 변경 (100냥)' : '닉네임 변경에 ' + NICKNAME_COST + '냥 필요') + '">'
    + NICKNAME_COST + ' 냥</button>'
    + '</div>'
    + '<div class="pf-row"><div class="pf-label">Email</div><div class="pf-value">' + email + '</div></div>'
    + '<div class="pf-row"><div class="pf-label">Sign-in</div><div class="pf-value">' + provLabel + '</div></div>'
    + '<div class="pf-row"><div class="pf-label">Member</div><div class="pf-value">' + since + '</div></div>'
    + (provider !== 'google'
      ? '<div class="pf-row"><div class="pf-label">Password</div><div class="pf-value" style="color:#94a3b8">Change via email</div>'
        + '<button class="pf-btn" onclick="sendPasswordReset()">Reset</button></div>'
      : '');
}

// ── Nickname change modal ──────────────────────────────────────
function openNicknameModal() {
  var existing = document.getElementById('nn-overlay');
  if (existing) existing.remove();

  var currentName = (document.getElementById('pf-name-val') || {}).textContent || '';
  var canAfford = _userCoin >= NICKNAME_COST;

  var el = document.createElement('div');
  el.id = 'nn-overlay';
  el.className = 'nn-overlay';
  el.innerHTML =
    '<div class="nn-modal">'
    + '<h3>Change Nickname</h3>'
    + '<p>닉네임 변경에는 <strong>' + NICKNAME_COST + '냥</strong>이 필요합니다. 현재 보유: <strong>' + _userCoin.toLocaleString() + '냥</strong>.</p>'
    + (canAfford
      ? '<div class="nn-cost-badge">✨ ' + NICKNAME_COST + '냥 차감</div>'
        + '<input class="nn-input" id="nn-input" type="text" maxlength="30" placeholder="New nickname" value="' + currentName + '">'
        + '<div class="nn-actions">'
        + '<button class="nn-btn-cancel" onclick="closeNicknameModal()">Cancel</button>'
        + '<button class="nn-btn-confirm" id="nn-confirm-btn" onclick="confirmNicknameChange()">변경 — ' + NICKNAME_COST + '냥</button>'
        + '</div>'
      : '<div style="text-align:center;padding:16px 0">'
        + '<div style="font-size:36px;margin-bottom:10px">🔒</div>'
        + '<div style="font-size:14px;font-weight:700;color:#0b1626;margin-bottom:6px">냥이 부족해요</div>'
        + '<div style="font-size:13px;color:#64748b">추가로 ' + (NICKNAME_COST - _userCoin) + '냥이 필요해요.</div>'
        + '<button class="nn-btn-cancel" style="margin-top:18px;width:100%" onclick="closeNicknameModal()">OK</button>'
        + '</div>')
    + '</div>';

  el.addEventListener('click', function(e) { if (e.target === el) closeNicknameModal(); });
  document.body.appendChild(el);
  if (canAfford) {
    var inp = document.getElementById('nn-input');
    if (inp) { inp.focus(); inp.select(); }
  }
}

function closeNicknameModal() {
  var el = document.getElementById('nn-overlay');
  if (el) el.remove();
}

async function confirmNicknameChange() {
  var inp = document.getElementById('nn-input');
  var newName = inp ? inp.value.trim() : '';
  if (!newName) { if (inp) inp.focus(); return; }
  if (_userCoin < NICKNAME_COST) { closeNicknameModal(); return; }

  var btn = document.getElementById('nn-confirm-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  var sb = getSupa();
  try {
    // Deduct Coin only (XP is non-spendable progression stat)
    var newCoin = _userCoin - NICKNAME_COST;
    await sb.from('user_stats').update({ coin_balance: newCoin, display_name: newName }).eq('user_id', supaUser.id);
    try { await sb.from('coin_transactions').insert({ user_id: supaUser.id, tx_type:'spend', amount:-NICKNAME_COST, balance_after:newCoin, source:'nickname_change', memo:'Nickname change' }); } catch(e) {}
    // Update auth metadata
    await sb.auth.updateUser({ data: { full_name: newName } });
    // Persist locally
    localStorage.setItem('kh_display_name', newName);

    // Update UI
    _userCoin = newCoin;
    var nameDisp = document.getElementById('pf-name-val');
    if (nameDisp) nameDisp.textContent = newName;
    var heroName = document.getElementById('mp-name');
    if (heroName) heroName.textContent = newName;
    // Update initials
    var initials = newName.replace(/[^a-zA-Z가-힣]/g,' ').trim().split(/\s+/).map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase() || '?';
    var initialsEl = document.getElementById('mp-initials');
    if (initialsEl) initialsEl.textContent = initials;
    // Refresh XP card and profile button
    renderXPCard(_userXP);
    renderProfileFields(_userXP, _userCoin);

    closeNicknameModal();
    if (typeof toast === 'function') toast('Nickname updated ✓');
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = '변경 — ' + NICKNAME_COST + '냥'; }
    alert('Error: ' + e.message);
  }
}


async function sendPasswordReset() {
  if (!supaUser || !supaUser.email) return;
  var sb = getSupa();
  if (!sb) return;
  var { error } = await sb.auth.resetPasswordForEmail(supaUser.email);
  if (!error) {
    if (typeof toast === 'function') toast('Reset email sent ✓');
    else alert('Password reset email sent to ' + supaUser.email);
  } else {
    alert('Error: ' + error.message);
  }
}

async function confirmDeleteAccount() {
  if (!confirm('정말 탈퇴하시겠어요?\n\n저장된 단어, 학습 기록, XP가 모두 삭제되며 복구할 수 없어요.')) return;
  if (!confirm('마지막 확인이에요. 계정과 모든 데이터를 영구 삭제할까요?')) return;

  var sb = getSupa();
  if (!sb || !supaUser) return;
  try {
    await Promise.all([
      sb.from('saved_words').delete().eq('user_id', supaUser.id),
      sb.from('user_stats').delete().eq('user_id', supaUser.id),
      sb.from('xp_log').delete().eq('user_id', supaUser.id),
    ]);
    var res = await fetch('https://samghztrdvtxmrmawneu.supabase.co/functions/v1/delete-account', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ((await sb.auth.getSession()).data.session?.access_token || '') }
    });
    await sb.auth.signOut();
    alert(res.ok ? '탈퇴가 완료됐어요. 이용해주셔서 감사합니다.' : '데이터는 삭제됐어요. 계정 완전 삭제는 관리자에게 문의해주세요.');
    window.location.href = 'index.html';
  } catch(e) {
    alert('오류: ' + e.message);
  }
}

// ── Profile picture ────────────────────────────────────────────
function triggerAvatarUpload() {
  document.getElementById('avatar-file-input').click();
}

async function handleAvatarUpload(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { // 2 MB limit
    if (typeof toast === 'function') toast('Image must be under 2 MB');
    else alert('Image must be under 2 MB');
    return;
  }

  var wrap = document.querySelector('.mp-avatar-wrap');
  if (wrap) wrap.style.opacity = '.5';

  var sb = getSupa();
  var avatarUrl = null;

  // Try Supabase Storage first
  try {
    var path = supaUser.id + '/avatar';
    var ext  = file.type === 'image/png' ? '.png' : file.type === 'image/webp' ? '.webp' : '.jpg';
    var fullPath = path + ext;
    var { error: upErr } = await sb.storage.from('avatars').upload(fullPath, file, { upsert: true, contentType: file.type });
    if (!upErr) {
      var { data: urlData } = sb.storage.from('avatars').getPublicUrl(fullPath);
      avatarUrl = urlData && urlData.publicUrl;
    }
  } catch(e) {}

  // Fallback: data URL stored in auth metadata (small images only)
  if (!avatarUrl) {
    try {
      avatarUrl = await new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function(e) { resolve(e.target.result); };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    } catch(e) {}
  }

  if (!avatarUrl) {
    if (wrap) wrap.style.opacity = '1';
    if (typeof toast === 'function') toast('Upload failed — please try again');
    return;
  }

  // Save to auth metadata + user_stats
  try {
    await sb.auth.updateUser({ data: { avatar_url: avatarUrl } });
    await sb.from('user_stats').update({ avatar_url: avatarUrl }).eq('user_id', supaUser.id);
  } catch(e) {}

  // Update avatar in hero
  _setAvatarDisplay(avatarUrl);
  if (wrap) wrap.style.opacity = '1';
  if (typeof toast === 'function') toast('Profile photo updated ✓');
  // Reset file input so same file can be re-selected
  input.value = '';
}

function _setAvatarDisplay(url) {
  var wrap = document.querySelector('.mp-avatar-wrap');
  if (!wrap) return;
  var existing = wrap.querySelector('.mp-initials, .mp-avatar-img');
  if (url && url.length < 500000) { // skip huge data URLs
    var img = document.createElement('img');
    img.className = 'mp-avatar-img';
    img.src = url;
    img.alt = '';
    img.onerror = function() { img.replaceWith(document.getElementById('mp-initials') || img); };
    if (existing) existing.replaceWith(img);
  }
}

// ── Init ───────────────────────────────────────────────────────
async function initMyPage() {
  if (!supaUser) { window.location.href = 'index.html'; return; }

  // Hero
  var savedName = localStorage.getItem('kh_display_name');
  var name = savedName || (supaUser.user_metadata && supaUser.user_metadata.full_name) || supaUser.email.split('@')[0];
  var nameEl = document.getElementById('mp-name');
  nameEl.textContent = name;

  document.getElementById('mp-email').textContent = supaUser.email || '';

  if (supaUser.created_at) {
    document.getElementById('mp-member-since').textContent =
      'Member since ' + new Date(supaUser.created_at).toLocaleDateString('en-US', { year:'numeric', month:'long' });
  }

  var initials = name.replace(/[^a-zA-Z가-힣]/g,' ').trim().split(/\s+/).map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase() || '?';
  var initialsEl = document.getElementById('mp-initials');
  if (initialsEl) initialsEl.textContent = initials;

  // Show existing profile photo if any
  var existingAvatar = (supaUser.user_metadata && supaUser.user_metadata.avatar_url) || '';
  if (existingAvatar) _setAvatarDisplay(existingAvatar);

  // Load in parallel
  var results = await Promise.all([ dbGetUserStats(), dbGetXPLog() ]);
  var invRes = await dbGetOwnedAndGifts();
  var stats = results[0];
  var xpLog = results[1];
  var xp = (stats && stats.xp) || 0;
  var coin = Number((stats && stats.coin_balance) || 0);

  _userXP = xp;
  renderXPCard(xp);
  renderMiniStats(stats);
  renderTierGrid(xp);
  renderXPLog(xpLog);
  renderProfileFields(xp, coin);
  renderOwnedAndGiftSections(coin, invRes);
}

async function dbGetOwnedAndGifts() {
  if (!supaUser) return { owned:[], gifts:[] };
  var sb = getSupa(); if (!sb) return { owned:[], gifts:[] };
  var out = { owned:[], gifts:[] };
  try {
    var ownedRes = await sb.from('owned_items').select('item_id, quantity, shop_items(name,description,image_url,item_type)').eq('user_id', supaUser.id).order('acquired_at', { ascending:false });
    out.owned = ownedRes.data || [];
  } catch(e) {}
  try {
    var giftRes = await sb.from('reporter_gift_history').select('reporter_id,item_id,quantity,nyang_spent,gifted_at,shop_items(name)').eq('user_id', supaUser.id).order('gifted_at', { ascending:false }).limit(30);
    out.gifts = giftRes.data || [];
  } catch(e) {}
  return out;
}

function renderOwnedAndGiftSections(coin, data) {
  var balEl = document.getElementById('mp-nyang-balance');
  if (balEl) balEl.textContent = '냥: ' + Number(coin || 0).toLocaleString();

  var ownedEl = document.getElementById('mp-owned-items');
  var owned = (data && data.owned) || [];
  if (ownedEl) {
    ownedEl.innerHTML = owned.length
      ? '<div class="inv-grid">' + owned.map(function(o){
          var it = o.shop_items || {};
          return '<div class="inv-card">'
            + '<div class="inv-thumb" style="background-image:url(\'' + (it.image_url || 'https://picsum.photos/seed/' + o.item_id + '/480/280') + '\')"></div>'
            + '<div class="inv-name">' + (it.name || o.item_id) + '</div>'
            + '<div class="inv-desc">' + (it.description || '-') + '</div>'
            + '<div class="inv-meta">수량: ' + (o.quantity || 0) + (it.item_type ? ' · ' + it.item_type : '') + '</div>'
            + '</div>';
        }).join('') + '</div>'
      : '<div style="color:#94a3b8;font-size:13px">보유 아이템이 없습니다.</div>';
  }

  var ghEl = document.getElementById('mp-gift-history');
  var gifts = (data && data.gifts) || [];
  if (ghEl) {
    ghEl.innerHTML = gifts.length
      ? gifts.map(function(g){
          var dt = g.gifted_at ? new Date(g.gifted_at).toLocaleString('ko-KR') : '-';
          var nm = (g.shop_items && g.shop_items.name) || g.item_id;
          return '<div class="gift-log-row"><b>' + nm + '</b> → 기자 <b>' + g.reporter_id + '</b> · 수량 ' + (g.quantity || 1) + ' · 사용 냥 ' + Number(g.nyang_spent || 0).toLocaleString() + '<div style="font-size:11px;color:#94a3b8;margin-top:3px">' + dt + '</div></div>';
        }).join('')
      : '<div style="color:#94a3b8;font-size:13px">보낸 선물 기록이 없습니다.</div>';
  }
}

document.addEventListener('DOMContentLoaded', function() {
  var attempts = 0;
  function waitForSession() {
    attempts++;
    if (supaUser) { initMyPage(); }
    else if (attempts < 30) { setTimeout(waitForSession, 200); }
    else { initMyPage(); }
  }
  setTimeout(waitForSession, 300);
});
</script>
