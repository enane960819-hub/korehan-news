<style>
/* Base font override for this page */
body { font-family: 'Happy Monkey', 'Jua', 'Inter', 'Noto Sans KR', sans-serif; }

/* Hero */
.mypage-hero {
  background: linear-gradient(135deg,#0b1626,#1a3a6b);
  padding: 36px 22px 28px; color:#fff; overflow:hidden;
}
.mypage-hero-inner { max-width:960px; margin:0 auto; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
.mp-avatar-wrap { position:relative; flex-shrink:0; cursor:pointer; }
.mp-avatar-wrap:hover .mp-avatar-edit { opacity:1; }
.mp-avatar-img  { width:76px; height:76px; border-radius:50%; border:2px solid rgba(255,255,255,.3); object-fit:cover; display:block; }
.mp-initials { width:76px; height:76px; border-radius:50%; background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.07)); border:2px solid rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:#fff; font-family:'Inter',sans-serif; letter-spacing:-.02em; }
.mp-avatar-edit { position:absolute; inset:0; border-radius:50%; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .2s; }
.mypage-name { font-family:'Inter','Noto Sans KR',sans-serif; font-size:22px; font-weight:800; letter-spacing:-.02em; margin:0 0 3px; cursor:pointer; }
.mypage-name:hover { opacity:.8; }
.mypage-email { font-size:13px; color:rgba(255,255,255,.55); margin:0 0 3px; font-weight:400; }
.mp-member-since { font-size:11px; color:rgba(255,255,255,.38); }
.hero-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.mp-action-btn { font-size:12px; font-weight:700; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:5px 14px; color:rgba(255,255,255,.8); cursor:pointer; font-family:inherit; transition:all .15s; }
.mp-action-btn:hover { background:rgba(255,255,255,.17); color:#fff; }

/* Page body */
.mypage-body { max-width:960px; margin:0 auto; padding:28px 20px 70px; }

/* XP Card */
.xp-card { background:#fff; border:1px solid var(--border); border-radius:20px; padding:26px; margin-bottom:16px; box-shadow:0 4px 20px rgba(15,23,42,.06); }
.xp-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
.xp-total { font-family:'Inter',sans-serif; font-size:56px; font-weight:900; color:#0b1626; line-height:1; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
.xp-total-label { font-size:11px; color:#94a3b8; font-weight:500; margin-top:5px; letter-spacing:.04em; text-transform:uppercase; }
.xp-tier-badge { display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:8px; font-size:12px; font-weight:700; font-family:'Inter',sans-serif; letter-spacing:.02em; }
.xp-tier-badge.bronze  { background:#fef3c7; color:#b45309; }
.xp-tier-badge.silver  { background:#f1f5f9; color:#64748b; }
.xp-tier-badge.gold    { background:#fffbeb; color:#d97706; }
.xp-tier-badge.plat    { background:#f5f3ff; color:#7c3aed; }
.xp-tier-badge.diamond { background:#eff6ff; color:#1d4ed8; }
.xp-track { height:6px; border-radius:999px; background:#eef0f5; overflow:hidden; margin-bottom:8px; }
.xp-fill  { height:100%; border-radius:999px; background:linear-gradient(90deg,#2255a4,#3d7fd4); transition:width .7s ease; }
.xp-meta  { display:flex; justify-content:space-between; font-size:11px; color:#94a3b8; font-weight:500; }

/* Stats overview — uses mp-section sizing for consistency */
.stats-overview { margin-bottom:20px; }
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; }
.stat-row { display:flex; align-items:center; gap:12px; padding:8px 6px; }
.stat-icon { width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.stat-icon img { width:44px; height:44px; object-fit:contain; object-position:center; display:block; }
.stat-text { display:flex; align-items:baseline; gap:6px; min-width:0; }
.stat-n { font-family:'Inter',sans-serif; font-size:18px; font-weight:800; color:#0b1626; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.stat-lbl { font-size:12px; color:#64748b; font-weight:500; white-space:nowrap; }

/* Tier journey — replaces the old 5-column grid that wrapped "Bro/nze" on mobile.
   Single wide canvas draws a path with 5 stations, the user's marker, and tier
   particles; station labels live in a DOM overlay so they stay crisp. */
.tier-journey {
  position:relative; border-radius:18px;
  background:linear-gradient(160deg,#0b1a33 0%,#132448 45%,#1a2c57 100%);
  padding:0; margin-bottom:24px; overflow:hidden;
  box-shadow:0 10px 28px rgba(11,26,51,.22);
  border:1px solid rgba(125,211,252,.12);
}
.tier-journey-header {
  position:relative; z-index:2; padding:18px 20px 6px;
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.tier-journey-now {
  display:inline-flex; align-items:center; gap:10px;
  padding:7px 14px 7px 8px; border-radius:999px;
  background:rgba(255,255,255,.08); backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.1);
}
.tier-journey-now .tj-mark {
  width:30px; height:30px; border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.12);
}
.tier-journey-now .tj-label { font-size:13px; font-weight:800; color:#fff; letter-spacing:.02em; }
.tier-journey-now .tj-xp { font-size:11px; color:rgba(255,255,255,.55); margin-left:2px; }
.tier-journey-next { font-size:11px; font-weight:700; color:rgba(125,211,252,.85); letter-spacing:.02em; }
.tier-journey-next b { color:#7dd3fc; }
.tier-journey-canvas-wrap {
  position:relative; width:100%; height:180px;
}
#tier-path-canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.tier-stations {
  position:absolute; inset:auto 0 0 0; height:64px;
  display:flex; align-items:flex-start; justify-content:space-between;
  padding:0 8px 10px; pointer-events:none;
}
.tier-station {
  flex:1 1 0; min-width:0; text-align:center;
  padding:4px 2px; color:rgba(255,255,255,.45);
  transition:all .25s;
}
.tier-station.active { color:#fff; }
.tier-station.current { color:#fff; transform:translateY(-2px); }
.tier-station .ts-name {
  font-size:11px; font-weight:800; letter-spacing:.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tier-station .ts-xp {
  font-size:10px; font-weight:600; color:rgba(255,255,255,.45);
  margin-top:2px; font-variant-numeric:tabular-nums;
}
.tier-station.current .ts-name { color:#fff; text-shadow:0 0 10px currentColor; }
.tier-journey-bar {
  position:relative; z-index:2; margin:0 20px 16px;
  height:6px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden;
}
.tier-journey-bar .tj-fill {
  height:100%; border-radius:99px;
  background:linear-gradient(90deg,#fbbf24,#f59e0b,#f97316,#c084fc,#60a5fa);
  box-shadow:0 0 14px rgba(125,211,252,.5);
  transition:width .6s cubic-bezier(.4,.2,.2,1);
}
@media (max-width:520px) {
  .tier-journey-canvas-wrap { height:160px; }
  .tier-station .ts-name { font-size:10px; }
  .tier-station .ts-xp { font-size:9px; }
}
/* Hide the legacy grid rules in case the class lingers somewhere */
.tier-grid { grid-template-columns:none !important; }

/* Stat card SVG icons */
/* stat icons handled by .stat-icon img above */

/* Tier badge — text only, no emoji */
.xp-tier-badge { display:inline-flex; align-items:center; gap:6px; }
.xp-tier-badge .tier-dot {
  width:8px; height:8px; border-radius:50%; flex-shrink:0;
}
.xp-tier-badge.bronze .tier-dot  { background:#cd7f32; }
.xp-tier-badge.silver .tier-dot  { background:#94a3b8; }
.xp-tier-badge.gold   .tier-dot  { background:#f59e0b; }
.xp-tier-badge.plat   .tier-dot  { background:#7c3aed; }
.xp-tier-badge.diamond .tier-dot { background:#1d4ed8; }

/* Sections */
.mp-section { background:#fff; border:1px solid var(--border); border-radius:16px; padding:24px; margin-bottom:16px; box-shadow:0 2px 10px rgba(15,23,42,.04); }
.mp-section h3 { font-family:'Inter',sans-serif; font-size:13px; font-weight:700; color:#0b1626; margin:0 0 16px; text-transform:uppercase; letter-spacing:.06em; }
.mp-section-divider { height:1px; background:var(--border); margin:4px 0; }

/* Profile fields */
.pf-row { display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid #f0f4f9; }
.pf-row:last-child { border-bottom:none; }
.pf-label { font-family:'Inter',sans-serif; font-size:10px; font-weight:600; color:#94a3b8; text-transform:uppercase; letter-spacing:.06em; width:80px; flex-shrink:0; }
.pf-value { flex:1; font-size:14px; color:#0b1626; font-weight:500; font-family:'Inter','Noto Sans KR',sans-serif; }
.pf-btn { padding:6px 14px; border:1px solid var(--border); border-radius:999px; background:#fff; font-size:12px; font-weight:700; color:#2255a4; cursor:pointer; white-space:nowrap; transition:all .15s; font-family:inherit; }
.pf-btn:hover { background:#f0f6ff; border-color:#93c5fd; }

/* Danger zone */
.danger-zone { background:#fff5f5; border:1px solid #fecaca; border-radius:14px; padding:20px 22px; }
.danger-zone h3 { color:#b91c1c; }

/* Nickname modal */
.nn-overlay { position:fixed; inset:0; background:rgba(5,12,24,.72); display:flex; align-items:center; justify-content:center; z-index:3000; padding:16px; }
.nn-modal   { background:#fff; border-radius:20px; width:min(440px,96vw); padding:28px 26px; box-shadow:0 24px 64px rgba(0,0,0,.25); }
.nn-modal h3 { margin:0 0 6px; font-size:18px; font-weight:900; color:#0b1626; }
.nn-modal p  { font-size:13px; color:#64748b; margin:0 0 20px; line-height:1.6; }
.nn-cost-badge { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:999px; background:#eff6ff; color:#2255a4; font-size:13px; font-weight:800; margin-bottom:16px; }
.nn-input { width:100%; padding:12px 14px; border:2px solid var(--border); border-radius:12px; font-size:15px; font-weight:600; font-family:inherit; outline:none; transition:border-color .15s; box-sizing:border-box; }
.nn-input:focus { border-color:#2255a4; }
.nn-actions { display:flex; gap:10px; margin-top:16px; }
.nn-btn-cancel { flex:1; padding:12px; border:1.5px solid var(--border); border-radius:12px; background:#fff; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; color:#64748b; }
.nn-btn-confirm { flex:1; padding:12px; border:none; border-radius:12px; background:#2255a4; color:#fff; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; }
.nn-btn-confirm:disabled { opacity:.45; cursor:not-allowed; }

/* XP log */
.xp-log-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid #f0f4f9; }
.xp-log-row:last-child { border-bottom:none; }
.xp-log-reason { font-size:14px; font-weight:600; color:#0b1626; font-family:'Inter',sans-serif; }
.xp-log-date   { font-size:11px; color:#94a3b8; margin-top:2px; font-weight:400; }
.xp-log-amount { font-size:14px; font-weight:800; color:#2255a4; font-family:'Inter',sans-serif; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.inv-card{border:1px solid #e2e8f0;border-radius:12px;padding:12px;background:#f8fbff}
.inv-thumb{width:100%;height:94px;border-radius:10px;background:#e2e8f0;background-size:cover;background-position:center;margin-bottom:8px}
.inv-name{font-size:13px;font-weight:800;color:#0b1626}
.inv-desc{font-size:12px;color:#64748b;line-height:1.5;margin-top:4px}
.inv-meta{font-size:11px;color:#2255a4;font-weight:800;margin-top:6px}
.gift-log-row{padding:10px 0;border-bottom:1px solid #eef2f7;font-size:13px;color:#334155}
.gift-log-row:last-child{border-bottom:none}

/* Neon overrides */

/* ═══ Animations & visual life ═══ */

/* XP number glow pulse */
@keyframes xpGlow {
  0%, 100% { text-shadow: 0 0 8px rgba(34,85,164,.15); }
  50% { text-shadow: 0 0 24px rgba(34,85,164,.35), 0 0 48px rgba(61,127,212,.15); }
}
.xp-total { animation: xpGlow 3s ease-in-out infinite; }

/* Tier badge shimmer */
@keyframes badgeShimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}
.xp-tier-badge {
  background-size: 200% auto;
  animation: badgeShimmer 4s linear infinite;
}
.xp-tier-badge.bronze  { background-image: linear-gradient(90deg, #fef3c7 0%, #fde68a 25%, #fef3c7 50%, #fde68a 75%, #fef3c7 100%); }
.xp-tier-badge.silver  { background-image: linear-gradient(90deg, #f1f5f9 0%, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%, #f1f5f9 100%); }
.xp-tier-badge.gold    { background-image: linear-gradient(90deg, #fffbeb 0%, #fde68a 25%, #fffbeb 50%, #fde68a 75%, #fffbeb 100%); }
.xp-tier-badge.plat    { background-image: linear-gradient(90deg, #f5f3ff 0%, #ddd6fe 25%, #f5f3ff 50%, #ddd6fe 75%, #f5f3ff 100%); }
.xp-tier-badge.diamond { background-image: linear-gradient(90deg, #eff6ff 0%, #bfdbfe 25%, #eff6ff 50%, #bfdbfe 75%, #eff6ff 100%); }

/* Progress bar animated fill */
@keyframes progressPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .75; }
}
.xp-fill { animation: progressPulse 2.5s ease-in-out infinite; }

/* Stats overview entrance */
@keyframes statSlideIn {
  from { opacity: 0; transform: translateY(18px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.stats-overview {
  animation: statSlideIn .45s cubic-bezier(.22,1,.36,1) both;
}

/* XP card entrance */
@keyframes xpCardIn {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
.xp-card { animation: xpCardIn .5s cubic-bezier(.22,1,.36,1) both; }

/* Tier items — staggered entrance + hover */
@keyframes tierFadeIn {
  from { opacity: 0; transform: scale(.88); }
  to   { opacity: 1; transform: scale(1); }
}
.tier-item {
  animation: tierFadeIn .4s cubic-bezier(.22,1,.36,1) both;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.tier-item:nth-child(1) { animation-delay: .05s; }
.tier-item:nth-child(2) { animation-delay: .1s; }
.tier-item:nth-child(3) { animation-delay: .15s; }
.tier-item:nth-child(4) { animation-delay: .2s; }
.tier-item:nth-child(5) { animation-delay: .25s; }
.tier-item:hover { transform: scale(1.06); box-shadow: 0 6px 20px rgba(15,23,42,.08); }

/* Current tier gentle bounce */
@keyframes tierBounce {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}
.tier-item.current { animation: tierBounce 2.5s ease-in-out infinite; }
.tier-item.current .tier-icon { animation: tierBounce 2s ease-in-out infinite; animation-delay: .3s; }

/* Stat number count-up feel */
@keyframes numPop {
  0%   { transform: scale(.7); opacity: 0; }
  60%  { transform: scale(1.08); }
  100% { transform: scale(1); opacity: 1; }
}
.stat-n { animation: numPop .5s cubic-bezier(.22,1,.36,1) both; }
.stat-row.clickable { cursor:pointer; border-radius:8px; transition:background .15s; }
.stat-row.clickable:hover { background:rgba(37,99,235,.06); }
body.kh-neon-on .stat-row.clickable:hover { background:rgba(0,255,214,.06) !important; }

/* Hero avatar float */
@keyframes avatarFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.mp-avatar-wrap { animation: avatarFloat 4s ease-in-out infinite; }

/* Streak icon flame flicker */
@keyframes flameFlicker {
  0%, 100% { transform: scale(1) rotate(0deg); }
  25% { transform: scale(1.08) rotate(-3deg); }
  75% { transform: scale(1.04) rotate(2deg); }
}
.stat-icon.s-streak { animation: flameFlicker 1.8s ease-in-out infinite; }

/* Progress bar shimmer overlay */
@keyframes barShimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
.xp-fill { position: relative; overflow: hidden; }
.xp-fill::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  animation: barShimmer 2s ease-in-out infinite;
}
.tier-bar-fill { position: relative; overflow: hidden; }
.tier-bar-fill::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  animation: barShimmer 2.5s ease-in-out infinite;
}

/* Section entrance */
@keyframes sectionIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.mp-section { animation: sectionIn .5s cubic-bezier(.22,1,.36,1) both; }
.mp-section:nth-of-type(1) { animation-delay: .1s; }
.mp-section:nth-of-type(2) { animation-delay: .2s; }
.mp-section:nth-of-type(3) { animation-delay: .3s; }
.mp-section:nth-of-type(4) { animation-delay: .4s; }

/* Hero background subtle movement */
@keyframes heroBgShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.mypage-hero {
  background-size: 200% 200%;
  animation: heroBgShift 12s ease-in-out infinite;
}

/* Neon mode: animated glow on XP number */
body.kh-neon-on .xp-total {
  animation: xpGlowNeon 3s ease-in-out infinite !important;
}
@keyframes xpGlowNeon {
  0%, 100% { text-shadow: 0 0 10px rgba(143,252,255,.3); }
  50% { text-shadow: 0 0 30px rgba(143,252,255,.6), 0 0 60px rgba(0,255,214,.2); }
}

/* Neon mode: badge shimmer */
body.kh-neon-on .xp-tier-badge.bronze  { background-image: linear-gradient(90deg, rgba(180,83,9,.15) 0%, rgba(252,211,77,.2) 50%, rgba(180,83,9,.15) 100%) !important; }
body.kh-neon-on .xp-tier-badge.silver  { background-image: linear-gradient(90deg, rgba(100,116,139,.15) 0%, rgba(203,213,225,.2) 50%, rgba(100,116,139,.15) 100%) !important; }
body.kh-neon-on .xp-tier-badge.gold    { background-image: linear-gradient(90deg, rgba(217,119,6,.15) 0%, rgba(252,211,77,.2) 50%, rgba(217,119,6,.15) 100%) !important; }
body.kh-neon-on .xp-tier-badge.plat    { background-image: linear-gradient(90deg, rgba(124,58,237,.15) 0%, rgba(196,181,253,.2) 50%, rgba(124,58,237,.15) 100%) !important; }
body.kh-neon-on .xp-tier-badge.diamond { background-image: linear-gradient(90deg, rgba(29,78,216,.15) 0%, rgba(147,197,253,.2) 50%, rgba(29,78,216,.15) 100%) !important; }

/* Neon mode: overview hover */
body.kh-neon-on .tier-item:hover { box-shadow: 0 0 16px rgba(0,255,214,.12), 0 6px 20px rgba(0,0,0,.3) !important; }

/* Neon mode: progress bar glow */
body.kh-neon-on .xp-fill { background: linear-gradient(90deg, #0d9488, #00ffd6) !important; box-shadow: 0 0 10px rgba(0,255,214,.3); }
body.kh-neon-on .tier-bar-fill { background: linear-gradient(90deg, #0d9488, #00ffd6) !important; box-shadow: 0 0 8px rgba(0,255,214,.25); }

/* Neon hero glow */
body.kh-neon-on .mypage-hero {
  background-image: linear-gradient(135deg, #050d1a, #091b3a, #0d2847, #091b3a) !important;
  background-size: 300% 300% !important;
  animation: heroBgShift 10s ease-in-out infinite !important;
}

/* ═══ Mini Room ═══ */
#miniroom-container { user-select:none; -webkit-user-select:none; }
.room-placed-item {
  position:absolute; background-repeat:no-repeat;
  transition: outline .15s, box-shadow .15s;
  z-index:1; overflow:visible;
}
.room-placed-item.room-dragging { z-index:10; opacity:.85; }
.room-placed-item.room-selected {
  outline:2px solid #facc15 !important;
  box-shadow:0 0 0 2px rgba(250,204,21,.35);
}
/* Visual hint while the user is holding to remove (450ms) — sprite shrinks
   + reddens, so the gesture feels like it's "charging up" the delete. */
.room-placed-item.room-longpressing .room-placed-sprite {
  filter: brightness(.85) saturate(1.4) drop-shadow(0 0 6px rgba(239,68,68,.6));
  transition: filter .15s ease, transform .45s cubic-bezier(.4,0,.2,1);
}
.room-placed-item.room-longpressing { transform: scale(.95); transition: transform .45s cubic-bezier(.4,0,.2,1); }
@keyframes roomSpin { to { transform: rotate(360deg); } }
.room-placed-sprite {
  position:absolute; inset:0;
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;
  transform-origin:center center;
  pointer-events:none;
}

/* Shop modal */
.room-shop-overlay {
  position:fixed; inset:0; background:rgba(5,12,24,.78); display:flex;
  align-items:center; justify-content:center; z-index:3000; padding:16px;
}
.room-shop-modal {
  background:#fff; border-radius:20px; width:min(520px,96vw); max-height:80vh;
  padding:0; box-shadow:0 24px 64px rgba(0,0,0,.3); overflow:hidden;
  display:flex; flex-direction:column;
}
.room-shop-header {
  padding:22px 24px 14px; border-bottom:1px solid #eef2f7;
  display:flex; align-items:center; justify-content:space-between;
}
.room-shop-header h3 { margin:0; font-size:16px; font-weight:900; color:#0b1626; font-family:'Inter',sans-serif; }
.room-shop-bal { font-size:13px; font-weight:800; color:#d97706; }
.room-shop-close {
  width:32px; height:32px; border-radius:50%; border:none; background:rgba(0,0,0,.06);
  font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:#64748b; transition:background .15s;
}
.room-shop-close:hover { background:rgba(0,0,0,.12); }
.room-shop-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px;
  padding:18px 24px 24px; overflow-y:auto; flex:1;
}
.room-shop-card {
  border:1px solid #e2e8f0; border-radius:14px; padding:14px 12px; text-align:center;
  background:#f8fbff; transition:border-color .15s, box-shadow .15s;
}
.room-shop-card:hover { border-color:#93c5fd; box-shadow:0 4px 16px rgba(37,99,235,.08); }
.room-shop-sprite {
  width:60px; height:60px; margin:0 auto 10px;
  background-size:contain; background-repeat:no-repeat; background-position:center;
}
.room-shop-name { font-size:12px; font-weight:800; color:#0b1626; margin-bottom:4px; }
.room-shop-price { font-size:11px; font-weight:700; color:#d97706; margin-bottom:8px; }
.room-shop-btn {
  padding:6px 16px; border:none; border-radius:999px; font-size:11px; font-weight:800;
  cursor:pointer; font-family:inherit; transition:all .15s;
}
.room-shop-btn.buy { background:#2563eb; color:#fff; }
.room-shop-btn.buy:hover { background:#1d4ed8; }
.room-shop-btn.buy:disabled { opacity:.45; cursor:not-allowed; }
.room-shop-btn.place { background:#16a34a; color:#fff; }
.room-shop-btn.place:hover { background:#15803d; }
.room-shop-btn.owned { background:rgba(0,0,0,.06); color:#94a3b8; cursor:default; }
.room-shop-btn.remove { background:#ef4444; color:#fff; margin-top:4px; }
.room-shop-btn.remove:hover { background:#dc2626; }

/* Room edit-mode controls (flip/layer/remove/+/-). Bigger tap targets on
   touch so nobody needs to aim at a 28px icon. */
.room-ctrl-btn {
  padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 10px;
  background: #fff; cursor: pointer; font-size: 12px; font-weight: 700;
  font-family: inherit; color: #0b1626; min-height: 36px; line-height: 1;
}
.room-ctrl-btn:hover { background: #f1f5f9; }
.room-ctrl-btn.room-ctrl-icon { padding: 0; width: 36px; min-width: 36px; font-size: 18px; font-weight: 800; }
.room-ctrl-btn.room-ctrl-danger { background: #ef4444; border-color: #dc2626; color: #fff; font-weight: 800; }
.room-ctrl-btn.room-ctrl-danger:hover { background: #dc2626; }
@media (pointer: coarse) {
  .room-ctrl-btn { min-height: 44px; padding: 10px 16px; font-size: 13px; }
  .room-ctrl-btn.room-ctrl-icon { width: 44px; min-width: 44px; font-size: 20px; }
}

/* Room badges on wall */
.room-badge-icon {
  width:28px; height:28px; border-radius:6px; display:flex; align-items:center;
  justify-content:center; font-size:14px; background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15); cursor:default;
}

/* ── Room light switch ───────────────────────────── */
.room-light-switch {
  position:absolute; top:8px; right:8px; z-index:10;
  width:36px; height:52px; cursor:pointer;
  background-size:contain; background-repeat:no-repeat; background-position:center;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));
  transition:transform .1s;
}
.room-light-switch:active { transform:scale(.9); }

/* ── Glow effects on items (lights on) ───────────── */
.room-placed-item[data-effect="glow_neon"] .room-placed-sprite {
  filter:drop-shadow(0 0 6px rgba(0,200,255,.4)) drop-shadow(0 0 14px rgba(0,200,255,.2));
}
.room-placed-item[data-effect="glow_warm"] .room-placed-sprite {
  filter:drop-shadow(0 0 8px rgba(255,180,50,.35)) drop-shadow(0 0 18px rgba(255,160,30,.15));
}

/* ── Lights-off mode ─────────────────────────────── */
/* All items: dim silhouettes */
.room-lights-off .room-placed-item {
  opacity:.1; transition:opacity .4s;
}
/* Glow items: fully visible + enhanced glow */
.room-lights-off .room-placed-item[data-effect="glow_neon"] {
  opacity:1 !important;
}
.room-lights-off .room-placed-item[data-effect="glow_neon"] .room-placed-sprite {
  filter:drop-shadow(0 0 14px rgba(0,200,255,.9)) drop-shadow(0 0 36px rgba(0,200,255,.5)) drop-shadow(0 0 60px rgba(0,200,255,.25)) brightness(1.3);
}
.room-lights-off .room-placed-item[data-effect="glow_warm"] {
  opacity:1 !important;
}
.room-lights-off .room-placed-item[data-effect="glow_warm"] .room-placed-sprite {
  filter:drop-shadow(0 0 12px rgba(255,180,50,.9)) drop-shadow(0 0 30px rgba(255,150,30,.5)) drop-shadow(0 0 50px rgba(255,130,20,.2)) brightness(1.2);
}
/* Switch always visible */
.room-lights-off .room-light-switch { opacity:1 !important; }

/* Neon overrides for mini room */
body.kh-neon-on #miniroom-container { border-color:rgba(0,255,214,.2) !important; }
body.kh-neon-on #mp-miniroom-section { background:rgba(9,18,33,.92) !important; border-color:rgba(0,255,214,.16) !important; }
body.kh-neon-on #mp-miniroom-section h3 { color:#e4f9ff !important; }
body.kh-neon-on .room-shop-modal { background:#071320 !important; }
body.kh-neon-on .room-shop-header { border-bottom-color:rgba(0,255,214,.15) !important; }
body.kh-neon-on .room-shop-header h3 { color:#e4f9ff !important; }
body.kh-neon-on .room-shop-card { background:rgba(9,18,33,.8) !important; border-color:rgba(0,255,214,.15) !important; }
body.kh-neon-on .room-shop-name { color:#e4f9ff !important; }
body.kh-neon-on .room-shop-price { color:#8ffcff !important; }

/* ── #8 sparkle + float animations ──────────────── */
@keyframes roomSparkle {
  0%, 100% { filter:drop-shadow(0 0 3px rgba(255,255,180,.3)); }
  50% { filter:drop-shadow(0 0 10px rgba(255,255,200,.7)) drop-shadow(0 0 20px rgba(255,220,100,.3)); }
}
@keyframes roomFloat {
  0%, 100% { transform:translateY(0); }
  50% { transform:translateY(-6px); }
}
.room-placed-item[data-effect="sparkle"] .room-placed-sprite { animation:roomSparkle 2s ease-in-out infinite; }
.room-placed-item[data-effect="float"] .room-placed-sprite { animation:roomFloat 3s ease-in-out infinite; }

/* ── #9 Edit mode visual ────────────────────────── */
.room-editing-active { outline:3px solid rgba(250,204,21,.5) !important; outline-offset:-3px; }
.room-editing-active::after {
  content:'EDITING'; position:absolute; top:6px; left:50%; transform:translateX(-50%);
  font-size:9px; font-weight:900; color:#facc15; background:rgba(0,0,0,.6);
  padding:2px 8px; border-radius:999px; z-index:20; pointer-events:none; letter-spacing:.05em;
}

/* ── #12 Item selection bounce ──────────────────── */
@keyframes selectBounce {
  0% { transform:scale(1); }
  30% { transform:scale(1.12); }
  60% { transform:scale(.96); }
  100% { transform:scale(1); }
}
.room-placed-item.room-selected { animation:selectBounce .3s ease-out; }

/* ── My Room Phase-1 polish ─────────────────────────────────────
   - Wider on desktop (was capped at 600px even on 1920px screens)
   - Time-of-day color overlay so morning/afternoon/evening/night look
     different even before any wallpaper system exists
   - SVG clock hands, window tints, rain animation
   - Pet idle slide + click-react hop
   - BGM toggle button + drawer
   ────────────────────────────────────────────────────────────── */
@media(min-width:760px){#miniroom-container{max-width:920px!important}}

.room-time-overlay{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;transition:background 1.6s ease;background:transparent;z-index:1}
body.room-lights-off .room-time-overlay{background:linear-gradient(180deg,rgba(8,12,28,.55),rgba(4,6,18,.7))!important}

/* SVG clock hands sit on top of the wall_clock sprite */
.room-clock-hands{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.room-clock-hands line{transition:transform .25s cubic-bezier(.4,0,.2,1)}
.room-clock-hands line.sec{transition:none}

/* Window tint overlay — color changes with time of day */
.room-window-tint{position:absolute;inset:8%;border-radius:6%;pointer-events:none;mix-blend-mode:screen;transition:background 1.6s ease}
.room-window-rain{position:absolute;inset:8%;border-radius:6%;pointer-events:none;background-image:repeating-linear-gradient(105deg,rgba(125,211,252,0) 0 9px,rgba(125,211,252,.22) 9px 11px);background-size:40px 80px;animation:roomRain .65s linear infinite;opacity:.85}
@keyframes roomRain{0%{background-position:0 0}100%{background-position:-40px 80px}}

/* Pet idle hop on click + heart popup */
@keyframes roomHeartUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}30%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-32px) scale(.9)}}
.room-pet-heart{position:absolute;left:50%;top:0;transform:translate(-50%,0);font-size:18px;animation:roomHeartUp .9s ease forwards;pointer-events:none;z-index:6}
.room-placed-item.room-pet{cursor:pointer}
.room-placed-item.room-pet-hop{animation:roomPetHop .35s ease}
@keyframes roomPetHop{0%{transform:translateY(0)}40%{transform:translateY(-12px)}100%{transform:translateY(0)}}

/* BGM toggle button — top-right corner, twin to the light switch */
.room-bgm-btn{position:absolute;top:10px;right:56px;width:38px;height:38px;border-radius:999px;background:rgba(15,23,42,.7);color:#fff;border:1px solid rgba(255,255,255,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:11;transition:transform .15s,background .15s}
.room-bgm-btn:hover{background:rgba(15,23,42,.9);transform:scale(1.06)}
.room-bgm-btn.on{background:linear-gradient(135deg,#2563eb,#7c3aed);border-color:rgba(125,211,252,.6);box-shadow:0 0 14px rgba(125,211,252,.35)}
.room-bgm-drawer{position:absolute;top:54px;right:10px;background:rgba(15,23,42,.96);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;min-width:180px;color:#fff;font-size:13px;box-shadow:0 12px 36px rgba(0,0,0,.4);z-index:6;display:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.room-bgm-drawer.open{display:block}
.room-bgm-track{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;color:#cbd5e1;font-weight:600}
.room-bgm-track:hover{background:rgba(255,255,255,.06)}
.room-bgm-track.active{background:rgba(125,211,252,.18);color:#fff}
.room-bgm-track .room-bgm-emoji{font-size:16px}
.room-bgm-vol{display:flex;align-items:center;gap:8px;padding:8px 4px 2px;border-top:1px solid rgba(255,255,255,.08);margin-top:6px}
.room-bgm-vol input{flex:1;height:18px}

/* ── My Room Phase-2 ──
   - Hub-ified furniture (desk/bookshelf/TV/etc become shortcuts to
     the matching learning area)
   - Seasonal particle layer (snow / blossoms / leaves)
   - Pet affinity badge
   ────────────────────────────────────────────────────────────── */

/* Furniture clickable in non-edit mode → tooltip + cursor + soft glow on hover */
.room-placed-item.room-hub:not(.room-pet){cursor:pointer}
.room-placed-item.room-hub::after{
  content:attr(data-hub-label);
  position:absolute;bottom:100%;left:50%;
  transform:translate(-50%,-2px);
  background:rgba(15,23,42,.92);color:#fff;
  font-size:11px;font-weight:700;letter-spacing:.02em;
  padding:5px 10px;border-radius:8px;white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity .15s,transform .15s;
  z-index:9;font-family:'DM Sans','Noto Sans KR',sans-serif;
}
.room-placed-item.room-hub:hover::after{opacity:1;transform:translate(-50%,-8px)}
.room-placed-item.room-hub:not(.room-pet):hover .room-placed-sprite{filter:drop-shadow(0 0 8px rgba(125,211,252,.55))}
.room-placed-item.room-hub-pulse .room-placed-sprite{animation:roomHubPulse .35s ease}
@keyframes roomHubPulse{0%{transform:scale(var(--hub-sx,1),var(--hub-s,1))}50%{transform:scale(calc(var(--hub-sx,1) * 1.06),calc(var(--hub-s,1) * 1.06))}100%{transform:scale(var(--hub-sx,1),var(--hub-s,1))}}

/* Seasonal particles — floats over everything but light/clock UI */
.room-season-layer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.room-season-flake{position:absolute;top:-24px;animation:roomSeasonFall linear infinite;will-change:transform;text-shadow:0 1px 4px rgba(0,0,0,.25)}
@keyframes roomSeasonFall{
  0%{transform:translate3d(0,-30px,0) rotate(0deg);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translate3d(40px,440px,0) rotate(360deg);opacity:0}
}

/* Pet affinity badge — small heart + count under each pet */
.room-pet-badge{
  position:absolute;bottom:-2px;left:50%;
  transform:translateX(-50%);
  background:rgba(15,23,42,.88);color:#fff;
  font-size:10px;font-weight:800;letter-spacing:.04em;
  padding:1px 7px;border-radius:10px;
  pointer-events:none;
  font-family:'DM Sans',sans-serif;
  white-space:nowrap;
  z-index:6;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
  opacity:.9;
}
.room-pet-badge.bump{animation:petBadgeBump .35s ease}
@keyframes petBadgeBump{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.18)}100%{transform:translateX(-50%) scale(1)}}

/* ── My Room Phase-3 — Theme (wallpaper + floor) ──
   Pure-CSS swatches mean we can ship wallpaper/floor variety today
   without any illustration work. When real artwork lands later, the
   catalog entries just swap their `bg` value to a url(...).
   ────────────────────────────────────────────────────────────── */
.room-theme-btn{position:absolute;top:10px;right:102px;width:38px;height:38px;border-radius:999px;background:rgba(15,23,42,.7);color:#fff;border:1px solid rgba(255,255,255,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:11;transition:transform .15s,background .15s}
.room-theme-btn:hover{background:rgba(15,23,42,.9);transform:scale(1.06)}
.room-theme-btn.on{background:linear-gradient(135deg,#0ea5e9,#22d3ee);border-color:rgba(125,211,252,.6);box-shadow:0 0 14px rgba(125,211,252,.35)}
.room-theme-drawer{position:absolute;top:54px;right:10px;background:rgba(15,23,42,.96);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;min-width:240px;color:#fff;font-size:13px;box-shadow:0 12px 36px rgba(0,0,0,.4);z-index:6;display:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.room-theme-drawer.open{display:block}
.room-theme-tabs{display:flex;gap:4px;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:8px}
.room-theme-tab{flex:1;padding:6px 10px;background:none;border:0;color:#94a3b8;font-size:12px;font-weight:800;letter-spacing:.04em;border-radius:8px;cursor:pointer;font-family:inherit;text-transform:uppercase}
.room-theme-tab.active{background:rgba(125,211,252,.18);color:#fff}
.room-theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.room-theme-swatch{aspect-ratio:1;border-radius:10px;cursor:pointer;border:2px solid transparent;position:relative;overflow:hidden;background-size:cover;background-position:center;transition:transform .12s,border-color .15s}
.room-theme-swatch:hover{transform:scale(1.05);border-color:rgba(125,211,252,.4)}
.room-theme-swatch.active{border-color:#7dd3fc;box-shadow:0 0 12px rgba(125,211,252,.4)}
.room-theme-swatch::after{content:attr(data-name);position:absolute;left:0;right:0;bottom:0;font-size:9px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));padding:8px 4px 3px;text-align:center;letter-spacing:.02em}

/* The floor layer sits above the room background but below items.
   Items still snap to the same grid coordinates — the floor is a
   non-interactive cosmetic strip across the bottom 32% of the room. */

/* ═══ #4 Tier glow effects — Gold / Platinum / Diamond ═══ */

/* Gold tier — warm golden glow */
@keyframes goldGlow {
  0%, 100% { box-shadow:0 0 8px rgba(245,158,11,.15), inset 0 0 6px rgba(245,158,11,.05); }
  50% { box-shadow:0 0 18px rgba(245,158,11,.35), 0 0 36px rgba(245,158,11,.1), inset 0 0 10px rgba(245,158,11,.08); }
}
@keyframes goldShine {
  0% { background-position:-200% center; }
  100% { background-position:200% center; }
}
.tier-item[data-tier="gold"] {
  border-color:#f59e0b !important;
  background:linear-gradient(135deg, #fffbeb, #fef3c7, #fffbeb) !important;
  animation: goldGlow 3s ease-in-out infinite;
}
.tier-item[data-tier="gold"] .tier-icon {
  background:linear-gradient(135deg, #fef3c7, #fde68a) !important;
  box-shadow:0 0 12px rgba(245,158,11,.25);
}
.tier-item[data-tier="gold"]::after {
  content:''; position:absolute; inset:0; border-radius:14px; pointer-events:none;
  background:linear-gradient(90deg, transparent 30%, rgba(255,215,0,.15) 50%, transparent 70%);
  background-size:200% 100%;
  animation:goldShine 4s linear infinite;
}
.tier-item[data-tier="gold"] { position:relative; overflow:hidden; }

/* Platinum tier — elegant purple metallic glow */
@keyframes platGlow {
  0%, 100% { box-shadow:0 0 10px rgba(124,58,237,.15), 0 0 24px rgba(124,58,237,.05); }
  50% { box-shadow:0 0 22px rgba(124,58,237,.4), 0 0 48px rgba(167,139,250,.12), inset 0 0 12px rgba(124,58,237,.06); }
}
@keyframes platShine {
  0% { background-position:-200% center; }
  100% { background-position:200% center; }
}
.tier-item[data-tier="plat"] {
  border-color:#7c3aed !important;
  background:linear-gradient(135deg, #f5f3ff, #ede9fe, #f5f3ff) !important;
  animation: platGlow 2.8s ease-in-out infinite;
}
.tier-item[data-tier="plat"] .tier-icon {
  background:linear-gradient(135deg, #ede9fe, #ddd6fe) !important;
  box-shadow:0 0 16px rgba(124,58,237,.3);
}
.tier-item[data-tier="plat"]::before {
  content:''; position:absolute; inset:-1px; border-radius:14px; pointer-events:none;
  background:linear-gradient(135deg, rgba(124,58,237,.2), transparent 40%, rgba(167,139,250,.15) 60%, transparent);
  z-index:0;
}
.tier-item[data-tier="plat"]::after {
  content:''; position:absolute; inset:0; border-radius:14px; pointer-events:none;
  background:linear-gradient(90deg, transparent 20%, rgba(196,181,253,.25) 45%, rgba(255,255,255,.35) 50%, rgba(196,181,253,.25) 55%, transparent 80%);
  background-size:200% 100%;
  animation:platShine 3s linear infinite;
  z-index:1;
}
.tier-item[data-tier="plat"] { position:relative; overflow:hidden; }
.tier-item[data-tier="plat"] > * { position:relative; z-index:2; }

/* Diamond tier — dazzling blue sparkle */
@keyframes diamondGlow {
  0%, 100% { box-shadow:0 0 12px rgba(59,130,246,.2), 0 0 32px rgba(59,130,246,.08); }
  33% { box-shadow:0 0 28px rgba(59,130,246,.5), 0 0 56px rgba(96,165,250,.18), 0 0 4px rgba(255,255,255,.3); }
  66% { box-shadow:0 0 20px rgba(29,78,216,.4), 0 0 48px rgba(147,197,253,.15); }
}
@keyframes diamondSparkle {
  0% { background-position:-300% center; }
  100% { background-position:300% center; }
}
@keyframes diamondPrism {
  0%, 100% { opacity:.3; }
  50% { opacity:.7; }
}
.tier-item[data-tier="diamond"] {
  border-color:#3b82f6 !important; border-width:2px;
  background:linear-gradient(135deg, #eff6ff, #dbeafe, #e0f2fe, #dbeafe, #eff6ff) !important;
  background-size:200% 200%;
  animation: diamondGlow 2.5s ease-in-out infinite, heroBgShift 6s ease-in-out infinite;
}
.tier-item[data-tier="diamond"] .tier-icon {
  background:linear-gradient(135deg, #dbeafe, #93c5fd, #bfdbfe) !important;
  box-shadow:0 0 20px rgba(59,130,246,.35), 0 0 6px rgba(255,255,255,.4);
}
.tier-item[data-tier="diamond"]::before {
  content:''; position:absolute; inset:-1px; border-radius:14px; pointer-events:none;
  background:linear-gradient(135deg, rgba(59,130,246,.3), transparent 30%, rgba(147,197,253,.2) 50%, transparent 70%, rgba(96,165,250,.25));
  z-index:0;
}
.tier-item[data-tier="diamond"]::after {
  content:''; position:absolute; inset:0; border-radius:14px; pointer-events:none;
  background:linear-gradient(90deg, transparent 10%, rgba(255,255,255,.4) 30%, rgba(147,197,253,.35) 45%, rgba(255,255,255,.5) 50%, rgba(147,197,253,.35) 55%, rgba(255,255,255,.4) 70%, transparent 90%);
  background-size:300% 100%;
  animation:diamondSparkle 2.5s linear infinite;
  z-index:1;
}
.tier-item[data-tier="diamond"] { position:relative; overflow:hidden; }
.tier-item[data-tier="diamond"] > * { position:relative; z-index:2; }

body.kh-neon-on .tier-item[data-tier="gold"] {

      + '<text x="12" y="15" text-anchor="middle" fill="'+c+'" font-size="8" font-weight="900">B</text></svg>';
  }
  if (cls === 'silver') {
    return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" style="opacity:'+opacity+'">'
      + '<defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c0c0c0"/><stop offset="100%" stop-color="#e8e8e8"/></linearGradient></defs>'
      + '<polygon points="12,2 15.5,8.5 22,9.5 17,14.5 18.5,21 12,17.5 5.5,21 7,14.5 2,9.5 8.5,8.5" fill="url(#sg)" stroke="#94a3b8" stroke-width=".5"/></svg>';
  }
  if (cls === 'gold') {
    return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" style="opacity:'+opacity+'">'
      + '<defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fbbf24"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient></defs>'
      + '<polygon points="12,1.5 15,8 22,9 17,14 18.5,21.5 12,17.5 5.5,21.5 7,14 2,9 9,8" fill="url(#gg)" stroke="#b45309" stroke-width=".5"/>'
      + '<circle cx="12" cy="11" r="3" fill="none" stroke="#fff" stroke-width=".8" opacity=".6"/></svg>';

// ── Tier helper ────────────────────────────────────────────────
function getXPTier(xp) {
  if (xp >= 75000) return { label:'Diamond', cls:'diamond', next:null,       from:75000, to:75000 };
  if (xp >= 30000) return { label:'Platinum', cls:'plat',   next:'Diamond',  from:30000, to:75000 };
  if (xp >= 12000) return { label:'Gold',     cls:'gold',   next:'Platinum', from:12000, to:30000 };
  if (xp >= 4500)  return { label:'Silver',   cls:'silver', next:'Gold',     from:4500,  to:12000 };
  return               { label:'Bronze',   cls:'bronze', next:'Silver',   from:0,    to:4500  };
}

var TIERS = [
  { label:'Bronze',  cls:'bronze',  min:0,     max:4500  },

// ── Load user stats ────────────────────────────────────────────
// XP + streak are ALWAYS computed from daily_missions (same source as Growth Lab)
async function dbGetUserStats() {
  if (!supaUser) return null;
  var sb = getSupa();
  if (!sb) return null;

  var statsData = null;
  var computedXP = 0;
  var computedStreak = 0;

  // Load user_stats and all daily_missions in parallel
  var results = await Promise.allSettled([
    sb.from('user_stats')
      .select('xp, quizzes_done, articles_read, words_saved, coin_balance')
      .eq('user_id', supaUser.id).maybeSingle(),
    sb.from('daily_missions')
      .select('date, articles, words, quizzes, fill')
      .eq('user_id', supaUser.id)
      .order('date', { ascending: false })
  ]);

  if (results[0].status === 'fulfilled' && results[0].value.data) {
    statsData = results[0].value.data;
    // Use xp from user_stats as the single source of truth (matches profile dropdown)
    computedXP = Number(statsData.xp || 0);
  }
  if (results[1].status === 'fulfilled' && results[1].value.data) {
    var rows = results[1].value.data;
    // If user_stats.xp is 0 or missing, fall back to daily_missions calculation
    if (!computedXP) {
      computedXP = rows.reduce(function(sum, d) {
        return sum + (d.articles||0)*10 + (d.words||0)*2 + (d.quizzes||0)*5 + (d.fill||0)*5;
      }, 0);
    }
    // Streak: consecutive days with any activity (KST)
    var activeDates = {};
    rows.forEach(function(d) {
      if ((d.articles||0)+(d.words||0)+(d.quizzes||0)+(d.fill||0) > 0) activeDates[d.date] = true;
    });
    var cur = new Date(Date.now() + 9*3600000);
    for (var i = 0; i < 400; i++) {
      var key = cur.toISOString().slice(0, 10);
      if (activeDates[key]) { computedStreak++; cur.setDate(cur.getDate() - 1); }
      else if (i === 0) { cur.setDate(cur.getDate() - 1); }
      else break;
    }
  }

  statsData = statsData || {};
  statsData.xp = computedXP;
  statsData.coin_balance = Number(statsData.coin_balance || 0);
  statsData.mission_streak = computedStreak;
  return statsData;
}

// Lightweight HTML escaper for any user-controlled string we splice into
// innerHTML. Without this, a saved word like '<img src=x onerror=alert(1)>'
// would execute when the user re-opens the saved-words modal (self-XSS,
// but still cleanup-worthy).
function _escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ── Tier journey ──────────────────────────────────────────────
// Single canvas draws a stylized horizontal path with 5 stations (tiers),
// a travelling light for the user's position, and tier-themed particles on
// each achieved station. Station labels are DOM siblings of the canvas so
// Korean/English text stays crisp regardless of DPR.

var TIER_JOURNEY_STYLES = {
  bronze:  { accent:'#f0a664', glow:'#fbbf24', particles:['#f0a664','#b87333','#fde68a'], count:6,  speed:0.25, size:[1.2,2.6] },
  silver:  { accent:'#cbd5e1', glow:'#e2e8f0', particles:['#d4d4d8','#e8e8ee','#fff'],    count:10, speed:0.45, size:[1.2,2.8] },
  gold:    { accent:'#fbbf24', glow:'#fde68a', particles:['#fbbf24','#f59e0b','#fde68a','#fff7ed'], count:14, speed:0.6, size:[1.4,3.2], shimmer:true },
  plat:    { accent:'#a78bfa', glow:'#c4b5fd', particles:['#a78bfa','#7c3aed','#c4b5fd','#e9d5ff'], count:16, speed:0.65, size:[1.6,3.4], prism:true },
  diamond: { accent:'#60a5fa', glow:'#93c5fd', particles:['#60a5fa','#93c5fd','#dbeafe','#fff','#e0f2fe'], count:22, speed:0.8,  size:[1.8,3.8], sparkle:true, rays:true }
};

var _tierJourneyRAF = null;
var _tierJourneyObs = null;

function renderTierGrid(xp) {
  var root = document.getElementById('mp-tier-grid');
  if (!root) return;
  var tier = getXPTier(xp);
  var tierIdx = TIERS.findIndex(function(t){ return t.label === tier.label; });

  // Build the shell once per render so live XP updates redraw cleanly.
  root.className = 'tier-journey';
  root.removeAttribute('style');
  root.innerHTML = ''
    + '<div class="tier-journey-header">'
    +   '<div class="tier-journey-now">'
    +     '<span class="tj-mark" style="background:' + TIER_COLORS[tier.cls] + '22">' + tierMark(tier.cls, 20) + '</span>'
    +     '<span class="tj-label">' + tier.label + '<span class="tj-xp"> · ' + (xp||0).toLocaleString() + ' XP</span></span>'
    +   '</div>'
    +   (tier.next
          ? '<div class="tier-journey-next">Next · <b>' + Math.max(0, tier.to - xp).toLocaleString() + ' XP</b> to ' + tier.next + '</div>'
          : '<div class="tier-journey-next" style="display:inline-flex;align-items:center;gap:5px"><span>최고 등급 달성</span><i data-lucide="party-popper" class="kh-ui-icon kh-ui-icon-sm" aria-hidden="true"></i></div>')
    + '</div>'
    + '<div class="tier-journey-canvas-wrap">'
    +   '<canvas id="tier-path-canvas"></canvas>'
    +   '<div class="tier-stations" id="tier-stations"></div>'
    + '</div>'
    + '<div class="tier-journey-bar"><div class="tj-fill" id="tier-journey-fill"></div></div>';

  // Station labels — DOM overlay keeps text outside the canvas bitmap.
  var stations = document.getElementById('tier-stations');
  stations.innerHTML = TIERS.map(function(t, i) {
    var reached = xp >= t.min;
    var current = i === tierIdx;
    var xpTxt = t.min >= 1000 ? (Math.round(t.min/100)/10).toString().replace(/\.0$/,'') + 'k' : t.min.toLocaleString();
    return '<div class="tier-station' + (reached ? ' active' : '') + (current ? ' current' : '') + '"'
      + ' style="' + (reached ? 'color:' + TIER_COLORS[t.cls] : '') + '">'
      + '<div class="ts-name">' + t.label + '</div>'
      + '<div class="ts-xp">' + xpTxt + '</div>'
      + '</div>';
  }).join('');

  // Overall progress bar from Bronze 0 to Diamond 75,000.
  var overallPct = Math.min(100, Math.round(xp / TIERS[TIERS.length-1].min * 100));
  var fill = document.getElementById('tier-journey-fill');
  if (fill) fill.style.width = overallPct + '%';

  // Stop any previous animation before starting a new one.
  if (_tierJourneyRAF) { cancelAnimationFrame(_tierJourneyRAF); _tierJourneyRAF = null; }
  if (_tierJourneyObs) { try { _tierJourneyObs.disconnect(); } catch(e) {} _tierJourneyObs = null; }

  var canvas = document.getElementById('tier-path-canvas');
  if (!canvas) return;

  _tierJourneyAnimate(canvas, xp, tierIdx);
}

function _tierJourneyAnimate(canvas, xp, currentIdx) {
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var W = 0, H = 0;

  function resize() {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width) return;
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize, { passive:true });

  // Station X positions — evenly distributed across the drawable width with a
  // little padding so the first/last markers don't kiss the edges.
  function stationX(i) {
    var pad = 36;
    return pad + (W - pad*2) * (i / (TIERS.length - 1));
  }
  function pathY() { return H * 0.48; }

  // Interpolate the marker's X from XP.
  function markerX() {
    if (xp <= 0) return stationX(0);
    for (var i = 1; i < TIERS.length; i++) {
      if (xp < TIERS[i].min) {
        var prev = TIERS[i-1], next = TIERS[i];
        var frac = Math.min(1, Math.max(0, (xp - prev.min) / (next.min - prev.min)));
        return stationX(i-1) + (stationX(i) - stationX(i-1)) * frac;
      }
    }
    return stationX(TIERS.length - 1);
  }

  // Particles, keyed by station index
  var stationParticles = TIERS.map(function(t, i) {
    if (xp < t.min) return [];
    var style = TIER_JOURNEY_STYLES[t.cls];
    var arr = [];
    for (var k = 0; k < style.count; k++) {
      arr.push({
        angle: Math.random() * Math.PI * 2,
        radius: 6 + Math.random() * 22,
        speed: 0.005 + Math.random() * style.speed * 0.02,
        size: style.size[0] + Math.random() * (style.size[1] - style.size[0]),
        color: style.particles[Math.floor(Math.random() * style.particles.length)],
        alpha: 0.35 + Math.random() * 0.55,
        life: Math.random() * 120,
        maxLife: 90 + Math.random() * 80,
        phase: Math.random() * Math.PI * 2
      });
    }
    return arr;
  });

  var time = 0;

  function frame() {
    if (!W) { resize(); _tierJourneyRAF = requestAnimationFrame(frame); return; }
    time++;
    ctx.clearRect(0, 0, W, H);

    var y = pathY();
    var mx = markerX();

    // 1) Star-field backdrop
    for (var s = 0; s < 26; s++) {
      var sx = ((s * 73) + time * 0.25) % W;
      var sy = (s * 37) % (H - 60) + 10;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + (s % 3) * 0.05) + ')';
      ctx.beginPath();
      ctx.arc(sx, sy, (s % 3) * 0.6 + 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // 2) Base path (unreached portion)
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.09)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(stationX(0), y);
    ctx.lineTo(stationX(TIERS.length-1), y);
    ctx.stroke();

    // 3) Achieved path (gradient, up to marker)
    var grad = ctx.createLinearGradient(stationX(0), y, stationX(TIERS.length-1), y);
    grad.addColorStop(0.00, '#fbbf24');
    grad.addColorStop(0.28, '#f59e0b');
    grad.addColorStop(0.52, '#c084fc');
    grad.addColorStop(0.80, '#60a5fa');
    grad.addColorStop(1.00, '#a5f3fc');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 6;
    ctx.shadowBlur = 14;
    ctx.shadowColor = 'rgba(96,165,250,.7)';
    ctx.beginPath();
    ctx.moveTo(stationX(0), y);
    ctx.lineTo(mx, y);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 4) Station nodes
    TIERS.forEach(function(t, i) {
      var sx2 = stationX(i);
      var reached = xp >= t.min;
      var isCurrent = i === currentIdx;
      var style = TIER_JOURNEY_STYLES[t.cls];

      // Outer glow ring for reached stations
      if (reached) {
        var ringRadius = isCurrent ? 22 + Math.sin(time * 0.08) * 2 : 17;
        var ringGrad = ctx.createRadialGradient(sx2, y, 4, sx2, y, ringRadius + 4);
        ringGrad.addColorStop(0, style.accent + 'cc');
        ringGrad.addColorStop(1, style.accent + '00');
        ctx.fillStyle = ringGrad;
        ctx.beginPath();
        ctx.arc(sx2, y, ringRadius + 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Orbiting particles on reached stations
      if (reached) {
        var particles = stationParticles[i];
        particles.forEach(function(p) {
          p.angle += p.speed * (isCurrent ? 1.3 : 0.8);
          p.life++;
          var wob = Math.sin(time * 0.04 + p.phase) * 2;
          var px = sx2 + Math.cos(p.angle) * (p.radius + wob);
          var py = y + Math.sin(p.angle) * (p.radius + wob) * 0.6;
          var fadeIn = Math.min(p.life / 20, 1);
          var fadeOut = Math.max(0, 1 - (p.life - p.maxLife + 30) / 30);
          var alpha = p.alpha * fadeIn * fadeOut;
          if (p.life > p.maxLife) {
            p.life = 0;
            p.alpha = 0.35 + Math.random() * 0.55;
            p.radius = 6 + Math.random() * 22;
          }
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.shadowBlur = isCurrent ? 10 : 6;
          ctx.shadowColor = style.glow;
          if (style.sparkle && ((time + Math.floor(p.phase*4)) % 8 === 0)) {
            _tjDrawStar(ctx, px, py, p.size * 1.4);
          } else {
            ctx.beginPath();
            ctx.arc(px, py, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        });
      }

      // Diamond prismatic rays for the top tier when reached
      if (t.cls === 'diamond' && reached) {
        ctx.save();
        ctx.translate(sx2, y);
        for (var r = 0; r < 8; r++) {
          ctx.rotate(Math.PI / 4);
          var rayG = ctx.createLinearGradient(0, 0, 0, -36);
          rayG.addColorStop(0, 'rgba(147,197,253,' + (0.25 + Math.sin(time*0.04)*0.1) + ')');
          rayG.addColorStop(1, 'transparent');
          ctx.fillStyle = rayG;
          ctx.beginPath();
          ctx.moveTo(-2, 0); ctx.lineTo(0, -34); ctx.lineTo(2, 0);
          ctx.fill();
        }
        ctx.restore();
      }

      // Core node
      var nodeR = isCurrent ? 12 : reached ? 10 : 7;
      var nodeGrad = ctx.createRadialGradient(sx2 - 2, y - 2, 1, sx2, y, nodeR);
      if (reached) {
        nodeGrad.addColorStop(0, '#fff');
        nodeGrad.addColorStop(0.55, style.accent);
        nodeGrad.addColorStop(1, style.glow);
      } else {
        nodeGrad.addColorStop(0, 'rgba(255,255,255,.2)');
        nodeGrad.addColorStop(1, 'rgba(255,255,255,.04)');
      }
      ctx.fillStyle = nodeGrad;
      ctx.beginPath();
      ctx.arc(sx2, y, nodeR, 0, Math.PI * 2);
      ctx.fill();

      // Current-node highlight ring
      if (isCurrent) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sx2, y, nodeR + 2, 0, Math.PI * 2);
        ctx.stroke();
      } else if (!reached) {
        ctx.strokeStyle = 'rgba(255,255,255,.22)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(sx2, y, nodeR, 0, Math.PI * 2);
        ctx.stroke();
      }
    });

    // 5) Travelling marker (user position) — sits on top of everything,
    //    with a pulsing halo so the current XP is unmistakable.
    var pulse = 10 + Math.sin(time * 0.1) * 2;
    ctx.save();
    ctx.shadowBlur = 18;
    ctx.shadowColor = '#7dd3fc';
    var markerGrad = ctx.createRadialGradient(mx, y, 1, mx, y, pulse);
    markerGrad.addColorStop(0, '#fff');
    markerGrad.addColorStop(0.55, '#7dd3fc');
    markerGrad.addColorStop(1, 'rgba(125,211,252,0)');
    ctx.fillStyle = markerGrad;
    ctx.beginPath();
    ctx.arc(mx, y, pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(mx, y, 4, 0, Math.PI * 2);
    ctx.fill();
    // "You are here" mini flag above the marker
    ctx.fillStyle = 'rgba(125,211,252,.85)';
    ctx.font = '700 10px "Inter",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('YOU', mx, y - 16);
    ctx.restore();

    _tierJourneyRAF = requestAnimationFrame(frame);
  }

  frame();

  _tierJourneyObs = new IntersectionObserver(function(entries) {
    if (entries[0].isIntersecting) {
      if (!_tierJourneyRAF) _tierJourneyRAF = requestAnimationFrame(frame);
    } else {
      if (_tierJourneyRAF) { cancelAnimationFrame(_tierJourneyRAF); _tierJourneyRAF = null; }
    }
  });
  _tierJourneyObs.observe(canvas);
}

function _tjDrawStar(ctx, x, y, r) {
  ctx.beginPath();
  for (var i = 0; i < 4; i++) {
    var a = (Math.PI / 2) * i;
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.stroke();
  ctx.fill();
}

// ── Render XP log ──────────────────────────────────────────────
var _xpLogAll = [];
var _xpLogShowing = 5;

function renderXPLog(rows) {
  _xpLogAll = rows || [];
  _xpLogShowing = 5;
  _drawXPLog();
}

function _drawXPLog() {
  var el = document.getElementById('mp-xp-log');
  if (!el) return;
  if (!_xpLogAll.length) {
    el.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px">No XP activity yet — read articles, take quizzes, and save words to earn XP!</div>';
    return;
  }
  var visible = _xpLogAll.slice(0, _xpLogShowing);
  var html = visible.map(function(row) {
    var ds = row.created_at ? new Date(row.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '';
    // xp_log 컬럼명이 amount/xp/xp_gained/points 등일 수 있으므로 모두 시도
    var _cols = ['amount', 'xp', 'xp_gained', 'xp_amount', 'points'];
    var amt = 0;
    for (var _ci = 0; _ci < _cols.length; _ci++) {
      if (row[_cols[_ci]] != null && +row[_cols[_ci]] > 0) { amt = +row[_cols[_ci]]; break; }
    }
    // 위에서 못찾으면: 행의 모든 숫자 필드 중 양수 첫번째 사용
    if (!amt) {
      var skipCols = { user_id:1, id:1, level:1, streak:1, count:1 };
      Object.keys(row).forEach(function(k) {
        if (!amt && !skipCols[k] && typeof row[k] === 'number' && row[k] > 0 && row[k] < 10000) amt = row[k];
      });
    }
    var sign = amt >= 0 ? '+' : '';
    var color = amt >= 0 ? '' : 'color:#ef4444';
    var reasonIcons = { article_read:'📰', word_save:'💾', word_saved:'💾', quiz_complete:'✅', conv_quiz_complete:'✅', fill_complete:'📝', daily_mission_complete:'🎯', streak_day:'🔥', streak:'🔥' };
    var rKey = (row.reason||'').toLowerCase().replace(/\s+/g,'_');
    var rIcon = reasonIcons[rKey] || '✨';
    return '<div class="xp-log-row">'
      + '<div style="display:flex;align-items:center;gap:8px"><span style="font-size:16px">' + rIcon + '</span><div><div class="xp-log-reason">' + (row.reason || 'Activity') + '</div><div class="xp-log-date">' + ds + '</div></div></div>'
      + '<div class="xp-log-amount" style="' + color + '">' + sign + amt + ' XP</div>'
      + '</div>';
  }).join('');

  // Show more / less button
  if (_xpLogAll.length > 5) {
    var remaining = _xpLogAll.length - _xpLogShowing;
    if (remaining > 0) {
      html += '<button onclick="xpLogShowMore()" style="width:100%;margin-top:14px;padding:10px;border:1px solid var(--border);border-radius:10px;background:#f8faff;color:#2255a4;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Show ' + Math.min(remaining, 10) + ' more ↓</button>';
    } else if (_xpLogShowing > 5) {
      html += '<button onclick="xpLogCollapse()" style="width:100%;margin-top:14px;padding:10px;border:1px solid var(--border);border-radius:10px;background:#f8faff;color:#94a3b8;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Show less ↑</button>';
    }
  }
  el.innerHTML = html;
}

function xpLogShowMore() {
  _xpLogShowing = Math.min(_xpLogShowing + 10, _xpLogAll.length);
  _drawXPLog();
}

function xpLogCollapse() {
  _xpLogShowing = 5;
  _drawXPLog();
}

async function confirmNicknameChange() {
  var inp = document.getElementById('nn-input');
  var newName = inp ? inp.value.trim() : '';
  if (!newName) { if (inp) inp.focus(); return; }
  if (_userCoin < NICKNAME_COST) { closeNicknameModal(); return; }

  var btn = document.getElementById('nn-confirm-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  var sb = getSupa();
  try {
    // Deduct Coin only (XP is non-spendable progression stat). Guarded
    // update so a stale client balance can't underpay.
    var newCoin = _userCoin - NICKNAME_COST;
    var upd = await sb.from('user_stats')
      .update({ coin_balance: newCoin, display_name: newName })
      .eq('user_id', supaUser.id)
      .gte('coin_balance', NICKNAME_COST)
      .select('coin_balance');
    if (upd.error) throw upd.error;
    if (!upd.data || upd.data.length === 0) {
      if (btn) { btn.disabled = false; btn.textContent = 'Change — ' + NICKNAME_COST + ' nyang'; }
      if (typeof toast === 'function') toast('Balance out of sync — please retry.');
      if (typeof _reloadUserStats === 'function') _reloadUserStats();
      return;
    }
    newCoin = Number(upd.data[0].coin_balance);
    try { await sb.from('coin_transactions').insert({ user_id: supaUser.id, tx_type:'spend', amount:-NICKNAME_COST, balance_after:newCoin, source:'nickname_change', memo:'Nickname change' }); } catch(e) {}
    // Update auth metadata
    await sb.auth.updateUser({ data: { full_name: newName } });
    // Persist locally
    try { localStorage.setItem('kh_display_name', newName); } catch(e) {}

    // Update UI
    _setNyangBalance(newCoin);
    var nameDisp = document.getElementById('pf-name-val');
    if (nameDisp) nameDisp.textContent = newName;
    var heroName = document.getElementById('mp-name');
    if (heroName) heroName.textContent = newName;
    // Update initials
    var initials = newName.replace(/[^a-zA-Z가-힣]/g,' ').trim().split(/\s+/).map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase() || '?';
    var initialsEl = document.getElementById('mp-initials');
    if (initialsEl) initialsEl.textContent = initials;
    // Refresh XP card and profile button
    renderXPCard(_userXP);
    renderProfileFields(_userXP, _userCoin);

    closeNicknameModal();
    if (typeof toast === 'function') toast('Nickname updated');
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Change — ' + NICKNAME_COST + ' nyang'; }
    toast('Error: ' + e.message, 'error');
  }
}

// ── Profile picture ────────────────────────────────────────────
function triggerAvatarUpload() {
  document.getElementById('avatar-file-input').click();
}

async function handleAvatarUpload(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { // 2 MB limit
    toast('Image must be under 2 MB', 'warn');
    return;
  }

  var wrap = document.querySelector('.mp-avatar-wrap');
  if (wrap) wrap.style.opacity = '.5';

  var sb = getSupa();
  var avatarUrl = null;

  // Try Supabase Storage first
  try {
    var path = supaUser.id + '/avatar';
    var ext  = file.type === 'image/png' ? '.png' : file.type === 'image/webp' ? '.webp' : '.jpg';
    var fullPath = path + ext;
    var { error: upErr } = await sb.storage.from('avatars').upload(fullPath, file, { upsert: true, contentType: file.type });
    if (!upErr) {
      var { data: urlData } = sb.storage.from('avatars').getPublicUrl(fullPath);
      avatarUrl = urlData && urlData.publicUrl;
    }
  } catch(e) {}

  // Fallback: data URL stored in auth metadata (small images only)
  if (!avatarUrl) {
    try {
      avatarUrl = await new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function(e) { resolve(e.target.result); };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    } catch(e) {}
  }

  if (!avatarUrl) {
    if (wrap) wrap.style.opacity = '1';
    if (typeof toast === 'function') toast('Upload failed — please try again');
    return;
  }

  // Save to auth metadata + user_stats
  try {
    await sb.auth.updateUser({ data: { avatar_url: avatarUrl } });
    await sb.from('user_stats').update({ avatar_url: avatarUrl }).eq('user_id', supaUser.id);
  } catch(e) {}

  // Update avatar in hero
  _setAvatarDisplay(avatarUrl);
  if (wrap) wrap.style.opacity = '1';
  if (typeof toast === 'function') toast('Profile photo updated');
  // Reset file input so same file can be re-selected
  input.value = '';
}

function _setAvatarDisplay(url) {
  var wrap = document.querySelector('.mp-avatar-wrap');
  if (!wrap) return;
  var existing = wrap.querySelector('.mp-initials, .mp-avatar-img');
  if (url && url.length < 500000) { // skip huge data URLs
    var img = document.createElement('img');
    img.className = 'mp-avatar-img';
    img.src = url;
    img.alt = '';
    img.onerror = function() { img.replaceWith(document.getElementById('mp-initials') || img); };
    if (existing) existing.replaceWith(img);
  }
}

async function dbGetOwnedAndGifts() {
  if (!supaUser) return { owned:[], gifts:[] };
  var sb = getSupa(); if (!sb) return { owned:[], gifts:[] };
  var out = { owned:[], gifts:[] };
  try {
    var ownedRes = await sb.from('owned_items').select('item_id, quantity, shop_items(name,description,image_url,item_type)').eq('user_id', supaUser.id).order('acquired_at', { ascending:false });
    out.owned = ownedRes.data || [];
  } catch(e) {}
  try {
    var giftRes = await sb.from('reporter_gift_history').select('*').eq('user_id', supaUser.id).order('gifted_at', { ascending:false }).limit(30);
    if (!giftRes.error) out.gifts = giftRes.data || [];
  } catch(e) {}
  return out;
}

function renderOwnedAndGiftSections(coin, data) {
  var balEl = document.getElementById('mp-nyang-balance');
  if (balEl) balEl.textContent = '냥: ' + Number(coin || 0).toLocaleString();

  var ownedEl = document.getElementById('mp-owned-items');
  var owned = (data && data.owned) || [];
  // Also include room items
  var roomOwned = getRoomOwned();
  var roomHtml = roomOwned.length ? '<div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:8px">Room Items</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">'
    + roomOwned.map(function(rid){
        var def = getRoomItemDef(rid); if(!def) return '';
        return '<div style="width:56px;height:56px;border-radius:10px;border:1px solid #e2e8f0;'+roomItemThumbBgStyle(def)+'" title="'+def.name+'"></div>';
      }).join('') + '</div>' : '';
  if (ownedEl) {
    var shopHtml = owned.length
      ? '<div class="inv-grid">' + owned.map(function(o){
          var it = o.shop_items || {};
          var applyBtn = '';
          if (it.item_type === 'profile_frame' || (it.name && it.name.toLowerCase().indexOf('frame') !== -1)) {
            var isActive = document.body.classList.contains('kh-neon-on') || localStorage.getItem('kh_profile_frame') === o.item_id;
            applyBtn = '<button onclick="applyProfileFrame(\'' + o.item_id + '\',this)" style="margin-top:8px;padding:6px 14px;border:none;border-radius:8px;background:' + (isActive ? '#dcfce7;color:#166534' : '#2563eb;color:#fff') + ';font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:5px">' + (isActive ? '<i data-lucide="check" class="kh-ui-icon kh-ui-icon-sm" aria-hidden="true"></i><span>Applied</span>' : 'Apply') + '</button>';
          } else if (it.item_type === 'theme' || (it.name && it.name.toLowerCase().indexOf('theme') !== -1)) {
            applyBtn = '<button onclick="applyThemeItem(\'' + o.item_id + '\',this)" style="margin-top:8px;padding:6px 14px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit">Apply</button>';
          }
          return '<div class="inv-card">'
            + '<div class="inv-thumb" style="background-image:url(\'' + (it.image_url || 'https://picsum.photos/seed/' + o.item_id + '/480/280') + '\')"></div>'
            + '<div class="inv-name">' + (it.name || o.item_id) + '</div>'
            + '<div class="inv-desc">' + (it.description || '-') + '</div>'
            + '<div class="inv-meta">Qty: ' + (o.quantity || 0) + (it.item_type ? ' · ' + it.item_type : '') + '</div>'
            + applyBtn
            + '</div>';
        }).join('') + '</div>'
      : '';
    ownedEl.innerHTML = roomHtml + shopHtml || '<div style="color:#94a3b8;font-size:13px">No items owned.</div>';
  }

}

// ── Apply inventory items ────────────────────────────────────
function applyProfileFrame(itemId, btn) {
  var current = localStorage.getItem('kh_profile_frame');
  if (current === itemId) {
    // Remove
    localStorage.removeItem('kh_profile_frame');
    document.body.classList.remove('kh-neon-on');
    localStorage.removeItem('kh_neon');
    btn.textContent = 'Apply';
    btn.style.background = '#2563eb'; btn.style.color = '#fff';
    if (typeof toast === 'function') toast('Frame removed');
  } else {
    // Apply
    localStorage.setItem('kh_profile_frame', itemId);
    document.body.classList.add('kh-neon-on');
    localStorage.setItem('kh_neon', '1');
    btn.innerHTML = '<span style="display:inline-flex;align-items:center;justify-content:center;gap:5px"><i data-lucide="check" class="kh-ui-icon kh-ui-icon-sm" aria-hidden="true"></i><span>Applied</span></span>';
    btn.style.background = '#dcfce7'; btn.style.color = '#166534';
    if (typeof toast === 'function') toast('Neon Profile Frame applied!');
  }
  // Update avatar visual
  var avatar = document.querySelector('.mp-avatar-img, .mp-initials');
  if (avatar) {
    if (localStorage.getItem('kh_profile_frame')) {
      avatar.style.boxShadow = '0 0 16px rgba(0,255,214,.5), 0 0 32px rgba(0,255,214,.2)';
      avatar.style.borderColor = '#00ffd6';
    } else {
      avatar.style.boxShadow = '';
      avatar.style.borderColor = '';
    }
  }
}

function applyThemeItem(itemId, btn) {
  localStorage.setItem('kh_theme_item', itemId);
  btn.textContent = '✓ Applied';
  btn.style.background = '#dcfce7'; btn.style.color = '#166534';
  if (typeof toast === 'function') toast('Theme applied!');
}

var ROOM_ITEMS = ROOM_ITEMS_FALLBACK.slice(); // will be replaced by DB data
var _roomItemsLoaded = false;

async function loadRoomItemsFromDB() {
  if (_roomItemsLoaded) return ROOM_ITEMS;
  var sb = getSupa(); if (!sb) return ROOM_ITEMS;
  try {
    var res = await sb.from('room_items').select('*').eq('active', true).order('sort_order');
    if (!res.error && res.data && res.data.length) {
      ROOM_ITEMS = res.data.map(function(r) {
        var sz = r.base_size || 60;
        if (sz < 100) sz = sz * 2; // Auto-double if DB hasn't been migrated yet
        return { id: r.id, name: r.name, price: r.price_nyang, img: r.image_url, size: sz, effect: r.effect || 'none', thumbnail: r.thumbnail_url || '', category: r.category || 'deco' };
      });
      _roomItemsLoaded = true;
    }
  } catch(e) { console.warn('room_items load failed, using fallback'); }
  // Earned-badge → room-item linkage was scrapped per product spec
  // (#9 in the May 2026 feedback batch). Badges now live as profile
  // collectibles only; rooms are decorated with shop purchases.
  return ROOM_ITEMS;
}

// Turn each earned badge into a virtual ROOM_ITEMS entry so it can be placed
// in My Room just like purchased decorations. Badge icons are pixel-art SVG
// strings (from pxBadge); we convert them to data URLs on demand so the
// normal room sprite pipeline can render them.
function _badgeSvgToDataURL(svg) {
  if (!svg) return '';
  try {
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  } catch(e) { return ''; }
}

function _mergeEarnedBadgeItems() {
  if (typeof BADGE_DEFS === 'undefined' || typeof getEarnedBadges !== 'function') return;
  var earned = getEarnedBadges();
  var have = {};
  ROOM_ITEMS.forEach(function(it) { have[it.id] = true; });
  var ownedChanged = false;
  var owned = getRoomOwned();
  var ownedSet = {}; owned.forEach(function(id){ ownedSet[id] = true; });
  BADGE_DEFS.forEach(function(b) {
    if (!earned[b.id]) return; // Only earned badges
    var id = 'badge_' + b.id;
    if (!have[id]) {
      var img = _badgeSvgToDataURL(b.icon);
      if (!img) return;
      ROOM_ITEMS.push({
        id: id,
        name: b.name + ' Badge',
        price: 0,
        img: img,
        thumbnail: img,
        size: 90,
        category: 'badge',
        effect: 'none',
        isBadge: true,
        badgeDesc: b.desc || '',
        badgeTier: b.tier || 'bronze'
      });
      have[id] = true;
    }
    // Earned badges are automatically "owned" as room items — no purchase.
    if (!ownedSet[id]) { owned.push(id); ownedSet[id] = true; ownedChanged = true; }
  });
  if (ownedChanged) {
    try { localStorage.setItem(K_ROOM_OWNED, JSON.stringify(owned)); } catch(e) {}
  }
}

// ── Get item def by id ───────────────────────────────────────
// Index cache keyed by ROOM_ITEMS reference. We rebuild whenever the array
// identity changes (e.g. after loadRoomItemsFromDB replaces the fallback).
var _roomItemsIndex = null;
var _roomItemsIndexSource = null;
function getRoomItemDef(id) {
  if (_roomItemsIndexSource !== ROOM_ITEMS) {
    _roomItemsIndex = {};
    for (var i = 0; i < ROOM_ITEMS.length; i++) {
      _roomItemsIndex[ROOM_ITEMS[i].id] = ROOM_ITEMS[i];
    }
    _roomItemsIndexSource = ROOM_ITEMS;
  }
  return _roomItemsIndex[id] || null;
}

// ── Owned items helpers ──────────────────────────────────────
function getRoomOwned() {
  try { return JSON.parse(localStorage.getItem(K_ROOM_OWNED) || '[]'); } catch(e) { return []; }
}
function setRoomOwned(arr) {
  try { localStorage.setItem(K_ROOM_OWNED, JSON.stringify(arr)); }
  catch(e) { console.warn('room owned write failed (private mode?)', e); }
  _syncRoomToServer();
}
function isRoomItemOwned(id) {

}

// ── Supabase sync (cross-device) ─────────────────────────────
// Primary store is `user_room_state` (per-user RLS). Until the migration
// lands in Supabase we fall back to `app_settings` under a synthetic key.
function _roomServerKey() { return 'room_data_' + (supaUser ? supaUser.id : 'anon'); }
var _roomUseUserTable = true; // flips to false on first "relation missing" error

// Debounced so rapid purchases / drags coalesce into one upsert.
var _roomSyncTimer = null;
var _roomSyncInFlight = false;
function _syncRoomToServer() {
  if (!supaUser) return;
  if (_roomSyncTimer) clearTimeout(_roomSyncTimer);
  _roomSyncTimer = setTimeout(function() {
    _roomSyncTimer = null;
    var sb = getSupa(); if (!sb) return;
    if (_roomSyncInFlight) { _syncRoomToServer(); return; }
    _roomSyncInFlight = true;
    var layout = getRoomLayout();
    var owned  = getRoomOwned();

    var writeUserTable = function() {
      return sb.from('user_room_state').upsert({
        user_id: supaUser.id,
        layout: layout,
        owned:  owned,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });
    };
    var writeAppSettings = function() {
      var data = JSON.stringify({ room_layout: layout, room_owned: owned });
      return sb.from('app_settings').upsert({
        key: _roomServerKey(), value: data, updated_at: new Date().toISOString()
      }, { onConflict: 'key' });
    };

    var primary = _roomUseUserTable ? writeUserTable() : writeAppSettings();
    primary.then(function(r) {
      if (r.error && _roomUseUserTable && _isMissingRelation(r.error)) {
        _roomUseUserTable = false;
        return writeAppSettings();
      }
      return r;
    }).then(function(r){
      _roomSyncInFlight = false;
      if (r && r.error) {
        console.warn('room sync error:', r.error.message);
        if (typeof toast === 'function') toast('Room not saved — check connection.');
      }
    });
  }, 400);
}

function _isMissingRelation(err) {
  if (!err) return false;
  var code = String(err.code || '');
  var msg  = String(err.message || '').toLowerCase();
  return code === '42P01' || msg.indexOf('does not exist') >= 0 || msg.indexOf('not found') >= 0;
}

async function _loadRoomFromServer() {
  if (!supaUser) return;
  var sb = getSupa(); if (!sb) return;
  try {
    var d = null;
    if (_roomUseUserTable) {
      var r = await sb.from('user_room_state')
        .select('layout, owned')
        .eq('user_id', supaUser.id)
        .maybeSingle();
      if (r.error && _isMissingRelation(r.error)) {
        _roomUseUserTable = false;
      } else if (r.data) {
        d = { room_layout: r.data.layout, room_owned: r.data.owned };
      }
    }
    if (!d) {
      var key = _roomServerKey();
      var r2 = await sb.from('app_settings').select('value').eq('key', key).maybeSingle();
      if (r2.data && r2.data.value) {
        d = typeof r2.data.value === 'string' ? JSON.parse(r2.data.value) : r2.data.value;
      }
    }
    if (d) {
      try {
        if (Array.isArray(d.room_layout)) localStorage.setItem(K_ROOM_LAYOUT, JSON.stringify(d.room_layout));
        if (Array.isArray(d.room_owned))  localStorage.setItem(K_ROOM_OWNED,  JSON.stringify(d.room_owned));
      } catch(e) { /* private mode */ }
      console.log('room loaded from server');
    }
  } catch(e) { console.warn('room load from server failed:', e); }
}

function isItemPlaced(id) {
  var layout = getRoomLayout();
  for (var i = 0; i < layout.length; i++) {
    if (layout[i].id === id) return true;
  }
  return false;
}

// Toggle the "your room is empty" overlay. Rendered inline once so repeated

function _updateRoomEmptyState(isEmpty) {
  var host = document.getElementById('miniroom-container');
  if (!host) return;
  var overlay = document.getElementById('miniroom-empty');
  if (isEmpty) {

        + 'color:rgba(255,255,255,.85);text-align:center;padding:24px;'

        + '<div style="font-size:14px;font-weight:800">Your room is empty</div>'
