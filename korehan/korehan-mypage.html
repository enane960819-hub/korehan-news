var ROOM_ITEMS = ROOM_ITEMS_FALLBACK.slice(); // will be replaced by DB data
var _roomItemsLoaded = false;

async function loadRoomItemsFromDB() {
  if (_roomItemsLoaded) return ROOM_ITEMS;
  var sb = getSupa(); if (!sb) return ROOM_ITEMS;
  try {
    var res = await sb.from('room_items').select('*').eq('active', true).order('sort_order');
    if (!res.error && res.data && res.data.length) {
      ROOM_ITEMS = res.data.map(function(r) {
        var sz = r.base_size || 60;
        if (sz < 100) sz = sz * 2; // Auto-double if DB hasn't been migrated yet
        return { id: r.id, name: r.name, price: r.price_nyang, img: r.image_url, size: sz, effect: r.effect || 'none', thumbnail: r.thumbnail_url || '', category: r.category || 'deco' };
      });
      _roomItemsLoaded = true;
    }
  } catch(e) { console.warn('room_items load failed, using fallback'); }
  // Always merge in earned-badge trophies so they appear as placeable items.
  _mergeEarnedBadgeItems();
  return ROOM_ITEMS;
}

// Turn each earned badge into a virtual ROOM_ITEMS entry so it can be placed
// in My Room just like purchased decorations. Badge icons are pixel-art SVG
// strings (from pxBadge); we convert them to data URLs on demand so the
// normal room sprite pipeline can render them.
function _badgeSvgToDataURL(svg) {
  if (!svg) return '';
  try {
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  } catch(e) { return ''; }
}

function _mergeEarnedBadgeItems() {
  if (typeof BADGE_DEFS === 'undefined' || typeof getEarnedBadges !== 'function') return;
  var earned = getEarnedBadges();
  var have = {};
  ROOM_ITEMS.forEach(function(it) { have[it.id] = true; });
  var ownedChanged = false;
  var owned = getRoomOwned();
  var ownedSet = {}; owned.forEach(function(id){ ownedSet[id] = true; });
  BADGE_DEFS.forEach(function(b) {
    if (!earned[b.id]) return; // Only earned badges
    var id = 'badge_' + b.id;
    if (!have[id]) {
      var img = _badgeSvgToDataURL(b.icon);
      if (!img) return;
      ROOM_ITEMS.push({
        id: id,
        name: b.name + ' Badge',
        price: 0,
        img: img,
        thumbnail: img,
        size: 90,
        category: 'badge',
        effect: 'none',
        isBadge: true,
        badgeDesc: b.desc || '',
        badgeTier: b.tier || 'bronze'
      });
      have[id] = true;
    }
    // Earned badges are automatically "owned" as room items — no purchase.
    if (!ownedSet[id]) { owned.push(id); ownedSet[id] = true; ownedChanged = true; }
  });
  if (ownedChanged) {
    try { localStorage.setItem(K_ROOM_OWNED, JSON.stringify(owned)); } catch(e) {}
  }
}

// ── Supabase sync (cross-device) ─────────────────────────────
function _roomServerKey() { return 'room_data_' + (supaUser ? supaUser.id : 'anon'); }

function _syncRoomToServer() {
  if (!supaUser) return;
  var sb = getSupa(); if (!sb) return;
  var data = JSON.stringify({ room_layout: getRoomLayout(), room_owned: getRoomOwned() });
  var key = _roomServerKey();
  sb.from('app_settings').upsert({ key: key, value: data, updated_at: new Date().toISOString() }, { onConflict: 'key' })
    .then(function(r){ if(r.error) console.warn('room sync error:', r.error.message); else console.log('room synced to server'); });
}

async function _loadRoomFromServer() {
  if (!supaUser) return;
  var sb = getSupa(); if (!sb) return;
  try {
    var key = _roomServerKey();
    var r = await sb.from('app_settings').select('value').eq('key', key).maybeSingle();
    if (r.data && r.data.value) {
      var d = typeof r.data.value === 'string' ? JSON.parse(r.data.value) : r.data.value;
      if (d && Array.isArray(d.room_layout)) localStorage.setItem(K_ROOM_LAYOUT, JSON.stringify(d.room_layout));
      if (d && Array.isArray(d.room_owned)) localStorage.setItem(K_ROOM_OWNED, JSON.stringify(d.room_owned));
      console.log('room loaded from server');
    }
  } catch(e) { console.warn('room load from server failed:', e); }
}
function isItemPlaced(id) {
  var layout = getRoomLayout();
  for (var i = 0; i < layout.length; i++) {
    if (layout[i].id === id) return true;
  }
  return false;
}

// ── Render placed items in room ──────────────────────────────
function renderRoomItems() {
  var container = document.getElementById('miniroom-items');
  if (!container) return;
  var layout = getRoomLayout();
  container.innerHTML = '';

  layout.forEach(function(placed) {
    var def = getRoomItemDef(placed.id);
    if (!def) return;
    var div = document.createElement('div');
    div.className = 'room-placed-item';
    div.dataset.itemId = placed.id;
    if (def.effect && def.effect !== 'none') div.dataset.effect = def.effect;
    var scale = Math.max(70, Math.min(170, Number(placed.scale || 100)));
    var base = def.size || 100;
    // Position as % of 400x360 base
    var leftPct = (placed.x / 400) * 100;
    var topPct  = (placed.y / 360) * 100;
    // Visual size in px, proportional to actual container width
    // Visual size: proportional to container
    // On PC (>700px) reduce hitbox to 40% and compensate with sprite scale
    var sizePct = (base / 400) * 100;
    var isPC = window.innerWidth > 700;
    var hitboxRatio = isPC ? 0.4 : 0.7;
    var hitboxPct = sizePct * hitboxRatio;
    var spriteCompensate = 1 / hitboxRatio;
    // Adjust position so visual center stays the same
    var offsetPct = (sizePct - hitboxPct) / 2;
    var adjLeftPct = leftPct + (offsetPct / 100) * (100); // shift right
    var adjTopPct = topPct + (offsetPct / 100) * (100);   // shift down
    // Simple: offset = (sizePct - hitboxPct) / 2 in % units
    adjLeftPct = leftPct + (sizePct - hitboxPct) / 2;
    adjTopPct = topPct + (sizePct - hitboxPct) / 2;
    div.setAttribute('style',
      'left:' + adjLeftPct + '%;top:' + adjTopPct + '%;width:' + hitboxPct + '%;height:' + hitboxPct + '%;'
      + 'cursor:' + (_roomEditing ? 'grab' : 'default') + ';'
      + (_roomEditing ? 'outline:2px dashed rgba(255,255,255,.3);' : '')
    );
    div.title = def.name;
    div.dataset.scale = String(scale);
    div.dataset.sizePct = String(sizePct);
    div.dataset.hitboxRatio = String(hitboxRatio);

    var sprite = document.createElement('div');
    sprite.className = 'room-placed-sprite';
    var flipped = !!placed.flipped;
    var sx = flipped ? -1 : 1;
    var s = (scale / 100) * spriteCompensate;
    sprite.setAttribute('style', roomItemBgStyle(def)
      + 'width:100%;height:100%;position:absolute;inset:0;'
      + (def.isBadge ? 'image-rendering:pixelated;' : '')
      + 'transform:scale(' + (sx * s) + ',' + s + ');');
    if (flipped) sprite.dataset.flipped = '1';
    div.appendChild(sprite);

    // Drag events
    div.addEventListener('mousedown', roomDragStart);
    div.addEventListener('touchstart', roomDragStart, {passive:false});
    div.addEventListener('click', roomSelectItem);
    // Long-press to remove (mobile-friendly) — with movement threshold
    (function(el, id) {
      var _lp = null;
      var _lpStartX = 0, _lpStartY = 0;
      el.addEventListener('touchstart', function(ev) {
        var t = ev.touches && ev.touches[0];
        _lpStartX = t ? t.clientX : 0;
        _lpStartY = t ? t.clientY : 0;
        _lp = setTimeout(function() {
          if (_roomEditing && confirm('Remove "' + (def.name||id) + '" from room?')) {
            removeRoomItem(id);
          }
        }, 600);
      }, {passive:true});
      el.addEventListener('touchend', function() { clearTimeout(_lp); });
      el.addEventListener('touchmove', function(ev) {
        // Only cancel if moved more than 12px (prevent jitter cancellation)
        var t = ev.touches && ev.touches[0];
        if (t) {
          var dx = Math.abs(t.clientX - _lpStartX);
          var dy = Math.abs(t.clientY - _lpStartY);
          if (dx > 12 || dy > 12) clearTimeout(_lp);
        }
      });
    })(div, placed.id);

    if (_selectedRoomItemId && _selectedRoomItemId === placed.id) {
      div.classList.add('room-selected');
    }

    container.appendChild(div);
  });
}

// ── Save room layout ─────────────────────────────────────────
function saveRoomLayout() {
  var container = document.getElementById('miniroom-container');
  var cW = container ? container.offsetWidth : 400;
  var cH = container ? container.offsetHeight : 360;
  var items = [];
  document.querySelectorAll('.room-placed-item').forEach(function(el) {
    var saved = getPlacedState(el.dataset.itemId) || {};
    // Convert current position back to 400x360 base for storage
    // Must undo the hitbox offset that renderRoomItems added
    var curLeft = parseFloat(el.style.left) || 0;
    var curTop  = parseFloat(el.style.top) || 0;
    var sizePct = parseFloat(el.dataset.sizePct) || 0;
    var hitboxRatio = parseFloat(el.dataset.hitboxRatio) || 0.7;
    var hitboxPct = sizePct * hitboxRatio;
    var offsetPct = (sizePct - hitboxPct) / 2;
    // Undo the offset that was added during render
    var rawLeftPct = curLeft - offsetPct;
    var rawTopPct = curTop - offsetPct;
    var x, y;
    if (String(el.style.left).indexOf('%') >= 0) {
      x = Math.round((rawLeftPct / 100) * 400);
      y = Math.round((rawTopPct / 100) * 360);
    } else {
      x = Math.round((curLeft / cW) * 400);
      y = Math.round((curTop / cH) * 360);
    }
    var spriteEl = el.querySelector('.room-placed-sprite');
    items.push({
      id: el.dataset.itemId,
      x: Math.max(0, Math.min(380, x)),
      y: Math.max(0, Math.min(340, y)),
      scale: Math.max(70, Math.min(170, Number(saved.scale || 100))),
      flipped: !!(spriteEl && spriteEl.dataset.flipped === '1')
    });
  });
  setRoomLayout(items);
  _syncRoomToServer();
  if (typeof toast === 'function') toast('Room saved!');
  if (_roomEditing) toggleRoomEdit();
}

// ── Drag & Drop ──────────────────────────────────────────────
var _dragStartPos = {x:0, y:0};
var _dragMoved = false;

function roomDragStart(e) {
  if (!_roomEditing) return;
  e.preventDefault();
  var el = e.currentTarget;
  _dragItem = el;
  _dragMoved = false;
  el.classList.add('room-dragging');
  el.style.cursor = 'grabbing';

  var container = document.getElementById('miniroom-container');
  var rect = container.getBoundingClientRect();
  var elRect = el.getBoundingClientRect();
  var clientX, clientY;
  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  _dragStartPos.x = clientX;
  _dragStartPos.y = clientY;
  _dragOffset.x = clientX - elRect.left;
  _dragOffset.y = clientY - elRect.top;

  document.addEventListener('mousemove', roomDragMove);
  document.addEventListener('mouseup', roomDragEnd);
  document.addEventListener('touchmove', roomDragMove, {passive:false});
  document.addEventListener('touchend', roomDragEnd);
}

function roomDragMove(e) {
  if (!_dragItem) return;
  e.preventDefault();
  var container = document.getElementById('miniroom-container');
  var rect = container.getBoundingClientRect();
  var clientX, clientY;
  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  // Track if actually moved (for tap detection)
  var dx = Math.abs(clientX - _dragStartPos.x);
  var dy = Math.abs(clientY - _dragStartPos.y);
  if (dx > 5 || dy > 5) _dragMoved = true;

  var x = clientX - rect.left - _dragOffset.x;
  var y = clientY - rect.top - _dragOffset.y;

  // Clamp within container (0% to 90%)
  x = Math.max(0, Math.min(rect.width * 0.9, x));
  y = Math.max(0, Math.min(rect.height * 0.9, y));

  _dragItem.style.left = ((x / rect.width) * 100) + '%';
  _dragItem.style.top = ((y / rect.height) * 100) + '%';
}

function roomDragEnd(e) {
  if (_dragItem) {
    var wasItem = _dragItem;
    _dragItem.classList.remove('room-dragging');
    _dragItem.style.cursor = 'grab';
    _dragItem = null;
    // If user didn't move (tap), trigger selection (fixes mobile tap)
    if (!_dragMoved && _roomEditing && wasItem.dataset.itemId) {
      _selectedRoomItemId = wasItem.dataset.itemId;
      document.querySelectorAll('.room-placed-item').forEach(function(el) {
        el.classList.toggle('room-selected', el.dataset.itemId === _selectedRoomItemId);
      });
      updateRoomSizeUI();
      var rmBtn = document.getElementById('room-remove-btn');
      if (rmBtn) rmBtn.style.display = '';
    }
  }
  document.removeEventListener('mousemove', roomDragMove);
  document.removeEventListener('mouseup', roomDragEnd);
  document.removeEventListener('touchmove', roomDragMove);
  document.removeEventListener('touchend', roomDragEnd);
}

function getPlacedState(itemId) {
  var layout = getRoomLayout();
  for (var i = 0; i < layout.length; i++) {
    if (layout[i].id === itemId) return layout[i];
  }
  return null;
}

function roomSelectItem(e) {
  if (!_roomEditing) return;
  var itemId = e.currentTarget && e.currentTarget.dataset ? e.currentTarget.dataset.itemId : null;
  if (!itemId) return;
  _selectedRoomItemId = itemId;
  document.querySelectorAll('.room-placed-item').forEach(function(el) {
    el.classList.toggle('room-selected', el.dataset.itemId === itemId);
  });
  updateRoomSizeUI();
  var rmBtn = document.getElementById('room-remove-btn');
  if (rmBtn) rmBtn.style.display = '';
}

function flipSelectedItem() {
  if (!_selectedRoomItemId) return;
  var el = document.querySelector('.room-placed-item.room-selected .room-placed-sprite');
  if (!el) return;
  var wasFlipped = el.dataset.flipped === '1';
  var nowFlipped = !wasFlipped;
  el.dataset.flipped = nowFlipped ? '1' : '0';
  var parentEl = el.parentElement;
  var hratio = Number(parentEl.dataset.hitboxRatio || 1);
  var compensate = 1 / hratio;
  var s = parentEl ? (Number(parentEl.dataset.scale || 100) / 100) * compensate : 1;
  var sx = nowFlipped ? -1 : 1;
  el.style.transform = 'scale(' + (sx * s) + ',' + s + ')';
  _syncDOMToLayout();
}

function moveSelectedLayer(dir) {
  if (!_selectedRoomItemId) return;
  // Save current DOM positions to layout first (user may have dragged without saving)
  _syncDOMToLayout();
  var layout = getRoomLayout();
  var idx = -1;
  for (var i = 0; i < layout.length; i++) { if (layout[i].id === _selectedRoomItemId) { idx = i; break; } }
  if (idx < 0) return;
  var newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= layout.length) return;
  var tmp = layout[idx];
  layout[idx] = layout[newIdx];
  layout[newIdx] = tmp;
  setRoomLayout(layout);
  renderRoomItems();
}

// Sync current DOM positions back to layout without triggering save/toast
function _syncDOMToLayout() {
  var container = document.getElementById('miniroom-container');
  var cW = container ? container.offsetWidth : 400;
  var cH = container ? container.offsetHeight : 360;
  var layout = getRoomLayout();
  document.querySelectorAll('.room-placed-item').forEach(function(el) {
    var id = el.dataset.itemId;
    var curLeft = parseFloat(el.style.left) || 0;
    var curTop  = parseFloat(el.style.top) || 0;
    var x = (String(el.style.left).indexOf('%') >= 0)
      ? Math.round((curLeft / 100) * 400)
      : Math.round((curLeft / cW) * 400);
    var y = (String(el.style.top).indexOf('%') >= 0)
      ? Math.round((curTop / 100) * 360)
      : Math.round((curTop / cH) * 360);
    var spriteEl = el.querySelector('.room-placed-sprite');
    for (var i = 0; i < layout.length; i++) {
      if (layout[i].id === id) {
        layout[i].x = Math.max(0, Math.min(380, x));
        layout[i].y = Math.max(0, Math.min(340, y));
        if (spriteEl) layout[i].flipped = spriteEl.dataset.flipped === '1';
        break;
      }
    }
  });
  localStorage.setItem(K_ROOM_LAYOUT, JSON.stringify(layout));
}

function removeSelectedRoomItem() {
  if (!_selectedRoomItemId) return;
  removeRoomItem(_selectedRoomItemId);
  var rmBtn = document.getElementById('room-remove-btn');
  if (rmBtn) rmBtn.style.display = 'none';
}

function updateRoomSizeUI() {
  var slider = document.getElementById('room-size-slider');
  var valueEl = document.getElementById('room-size-value');
  if (!slider || !valueEl) return;
  var placed = _selectedRoomItemId ? getPlacedState(_selectedRoomItemId) : null;
  var scale = placed ? Math.max(70, Math.min(170, Number(placed.scale || 100))) : 100;
  slider.value = String(scale);
  slider.disabled = !_selectedRoomItemId;
  valueEl.textContent = scale + '%';
  valueEl.style.opacity = _selectedRoomItemId ? '1' : '.45';
}

function onRoomSizeSlider(value) {
  applySelectedItemScale(value);
}

function nudgeSelectedItemScale(delta) {
  var slider = document.getElementById('room-size-slider');
  if (!slider || !_selectedRoomItemId) return;
  var next = Math.max(70, Math.min(170, (parseInt(slider.value, 10) || 100) + delta));
  slider.value = String(next);
  applySelectedItemScale(next);
}

function applySelectedItemScale(scaleValue) {
  if (!_selectedRoomItemId) return;
  var scale = Math.max(70, Math.min(170, Number(scaleValue || 100)));
  var layout = getRoomLayout();
  var def = getRoomItemDef(_selectedRoomItemId);
  if (!def) return;

  layout = layout.map(function(p) {
    if (p.id !== _selectedRoomItemId) return p;
    return { id: p.id, x: p.x, y: p.y, scale: scale };
  });
  setRoomLayout(layout);

  var selectedEl = document.querySelector('.room-placed-item.room-selected');
  if (selectedEl) {
    selectedEl.dataset.scale = String(scale);
    var hratio = Number(selectedEl.dataset.hitboxRatio || 1);
    var compensate = 1 / hratio;
    var spriteEl = selectedEl.querySelector('.room-placed-sprite');
    if (spriteEl) {
      var flipped = spriteEl.dataset.flipped === '1';
      var sx = flipped ? -1 : 1;
      var s = (scale / 100) * compensate;
      spriteEl.style.transform = 'scale(' + (sx * s) + ',' + s + ')';
    }
  }
  updateRoomSizeUI();
}

// ── Item Shop / My Items ─────────────────────────────────────
// ownedOnly = true → "My Items" drawer (only items the user owns, for placing

// ownedOnly = false → full Item Shop (kept around for backwards-compat links).
async function openRoomShop(ownedOnly) {

  var overlay = document.createElement('div');
  overlay.className = 'room-shop-overlay';
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeRoomShop(); });

    ? '<a href="korehan-shop.html" class="room-shop-bal" style="text-decoration:none;color:#2563eb;font-weight:800">Shop →</a>'

  var html = '<div class="room-shop-modal">'
    + '<div class="room-shop-header">'
    + '<h3>' + headerTitle + '</h3>'
    + headerRight
    + '<button class="room-shop-close" onclick="closeRoomShop()">&times;</button>'
    + '</div>'
    + '<div style="display:flex;gap:6px;padding:10px 24px 0;flex-wrap:wrap">'
    + cats.map(function(c) {
      return '<button class="room-shop-btn ' + (c === 'all' ? 'buy' : '') + '" data-shop-cat="' + c + '" onclick="filterRoomShop(\'' + c + '\')" style="padding:4px 10px;font-size:10px;border-radius:999px;border:1px solid #cbd5e1;background:' + (c === 'all' ? '#2563eb' : '#f1f5f9') + ';color:' + (c === 'all' ? '#fff' : '#475569') + '">' + catLabels[c] + '</button>';
    }).join('')
    + '</div>'
    + '<div class="room-shop-grid">';

  if (!items.length) {
    html += '<div style="grid-column:1/-1;padding:30px 20px;text-align:center;color:#94a3b8;font-size:13px">'
      + (ownedOnly
          ? 'You don\'t own any items yet. Visit the <a href="korehan-shop.html" style="color:#2563eb;font-weight:700">Shop</a> to get some.'
          : 'No items yet.')
      + '</div>';
  }

  items.forEach(function(item) {
    var isOwned = owned.indexOf(item.id) !== -1;
    var placed = isItemPlaced(item.id);
    var canBuy = coin >= item.price;
    var s = 60;
    var cat = item.category || 'deco';
    var isBadge = !!item.isBadge;
    var priceLabel = isBadge ? '🏆 Earned' : (isOwned ? 'Owned' : item.price + ' nyang');

    html += '<div class="room-shop-card" data-item-id="' + item.id + '" data-cat="' + cat + '">'
      + '<div class="room-shop-sprite" style="width:' + s + 'px;height:' + s + 'px;' + roomItemThumbBgStyle(item) + (isBadge ? ';image-rendering:pixelated' : '') + '"></div>'
      + '<div class="room-shop-name">' + item.name + '</div>'
      + '<div class="room-shop-price">' + priceLabel + '</div>';

    if (!isOwned) {
      html += '<button class="room-shop-btn buy" onclick="buyRoomItem(\'' + item.id + '\')"'
        + (canBuy ? '' : ' disabled') + '>'
        + (canBuy ? 'Buy' : 'Not enough') + '</button>';
    } else if (!placed) {
      html += '<button class="room-shop-btn place" onclick="placeRoomItem(\'' + item.id + '\')">Place in Room</button>';
    } else {
      html += '<button class="room-shop-btn owned">In Room</button>'
        + '<button class="room-shop-btn remove" onclick="removeRoomItem(\'' + item.id + '\')">Remove</button>';
    }

    html += '</div>';
  });

  html += '</div></div>';
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
}

// ── Buy item ─────────────────────────────────────────────────
async function buyRoomItem(itemId) {
  var def = getRoomItemDef(itemId);
  if (!def) return;
  if (isRoomItemOwned(itemId)) { if (typeof toast === 'function') toast('Already owned!'); return; }
  if (_userCoin < def.price) { if (typeof toast === 'function') toast('Not enough nyang!'); return; }

  // Deduct nyang
  var newCoin = _userCoin - def.price;
  var sb = getSupa();
  if (sb && supaUser) {
    try {
      await sb.from('user_stats').update({coin_balance: newCoin}).eq('user_id', supaUser.id);
      try {
        await sb.from('coin_transactions').insert({
          user_id: supaUser.id, tx_type:'spend', amount: -def.price,
          balance_after: newCoin, source:'room_item', memo:'Room item: ' + def.name
        });
      } catch(e) {}
    } catch(e) {
      if (typeof toast === 'function') toast('Purchase failed!');
      return;
    }
  }

  _userCoin = newCoin;
  // Update owned list
  var owned = getRoomOwned();
  owned.push(itemId);
  setRoomOwned(owned);

  // Update balance displays
  var balEl = document.getElementById('mp-nyang-balance');
  if (balEl) balEl.textContent = 'nyang: ' + newCoin.toLocaleString();
  renderMiniStats({xp: _userXP, coin_balance: newCoin, mission_streak: 0, articles_read: 0, words_saved: 0, quizzes_done: 0});

  if (typeof toast === 'function') toast('Purchased ' + def.name + '!');
  if (typeof _fjMarkDone === 'function') _fjMarkDone('shop');

  // Refresh shop
  closeRoomShop();
  openRoomShop();
}

// ── Place item in room ───────────────────────────────────────
function placeRoomItem(itemId) {
  var def = getRoomItemDef(itemId);
  if (!def) return;
  if (!isRoomItemOwned(itemId)) return;
  if (isItemPlaced(itemId)) return;

  var layout = getRoomLayout();
  // Place in a default position (center-ish, slightly randomized)
  var x = 120 + Math.floor(Math.random() * 120);
  var y = 140 + Math.floor(Math.random() * 100);
  layout.push({id: itemId, x: x, y: y, scale:100});
  setRoomLayout(layout);

  renderRoomItems();
  updateRoomSizeUI();
  if (typeof toast === 'function') toast(def.name + ' placed! Use Edit to move it.');
  if (typeof _fjMarkDone === 'function') _fjMarkDone('room');

  // Refresh shop
  closeRoomShop();
  openRoomShop();
}

// ── Remove item from room ────────────────────────────────────
function removeRoomItem(itemId) {
  var layout = getRoomLayout();
  layout = layout.filter(function(p) { return p.id !== itemId; });
  setRoomLayout(layout);

  renderRoomItems();
  if (_selectedRoomItemId === itemId) _selectedRoomItemId = null;
  updateRoomSizeUI();
  if (typeof toast === 'function') toast('Item removed from room.');

  // Refresh shop
  closeRoomShop();
  openRoomShop();
}

// ── Saved Words modal ────────────────────────────────────────
async function openSavedWordsModal() {
  var existing = document.querySelector('.nn-overlay');
  if (existing) existing.remove();

  var overlay = document.createElement('div');
  overlay.className = 'nn-overlay';
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });

  var modal = document.createElement('div');
  modal.className = 'nn-modal';
  modal.style.maxHeight = '80vh';
  modal.style.overflow = 'auto';
  modal.innerHTML = '<h3>Saved Words</h3><p style="color:#94a3b8">Loading…</p>';
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  var sb = getSupa();
  var words = [];
  if (sb && supaUser) {
    try {
      var res = await sb.from('saved_words').select('word_ko, word_en, word_rom, created_at').eq('user_id', supaUser.id).order('created_at', { ascending: false }).limit(100);
      if (res.data) words = res.data;
    } catch(e) {}
  }
  // Also check localStorage
  if (!words.length) {
    try {
      var lsWords = JSON.parse(localStorage.getItem('kh_saved') || '[]');
      words = lsWords.map(function(w) {
        if (typeof w === 'string') return { word_ko: w, word_en: '', word_rom: '' };
        return w;
      });
    } catch(e) {}
  }

  if (!words.length) {
    modal.innerHTML = '<h3>Saved Words</h3>'
      + '<div style="text-align:center;padding:28px 0">'
      + '<div style="font-size:32px;margin-bottom:10px">📚</div>'
      + '<div style="font-size:14px;color:#64748b">No saved words yet.</div>'
      + '<div style="font-size:12px;color:#94a3b8;margin-top:6px">Hover over Korean words in articles and save them!</div>'
      + '</div>'
      + '<button class="nn-btn-cancel" style="width:100%;margin-top:12px" onclick="this.closest(\'.nn-overlay\').remove()">Close</button>';
    return;
  }

  var listHtml = words.map(function(w) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f4f9">'
      + '<div><div style="font-size:15px;font-weight:700;color:#0b1626">' + (w.word_ko || '') + '</div>'
      + (w.word_rom ? '<div style="font-size:11px;color:#94a3b8">' + w.word_rom + '</div>' : '') + '</div>'
      + '<div style="font-size:13px;color:#475569;text-align:right;max-width:180px">' + (w.word_en || '') + '</div>'
      + '</div>';
  }).join('');

  modal.innerHTML = '<h3>Saved Words <span style="font-size:12px;font-weight:500;color:#94a3b8">(' + words.length + ')</span></h3>'
    + '<div style="max-height:55vh;overflow-y:auto">' + listHtml + '</div>'
    + '<button class="nn-btn-cancel" style="width:100%;margin-top:16px" onclick="this.closest(\'.nn-overlay\').remove()">Close</button>';
}

// ── Badges rendering on mypage ──────────────────────────────
function renderMyPageBadges() {
  var el = document.getElementById('mp-badges-content');
  if (!el) return;

  // Check if kh-badges.js is loaded
  if (typeof BADGE_DEFS === 'undefined' || typeof getEarnedBadges !== 'function') {
    el.innerHTML = '<div style="color:#94a3b8;font-size:13px">Badge system loading…</div>';
    return;
  }

  var earned = getEarnedBadges();
  var earnedCount = Object.keys(earned).length;
  var total = BADGE_DEFS.length;
  var pct = total > 0 ? Math.round(earnedCount / total * 100) : 0;

  var tierColor = { bronze:'#cd7c3a', silver:'#9aa5b4', gold:'#f5a623', diamond:'#60a5fa', legendary:'#a855f7' };
  var tierBg    = { bronze:'#fff3e0', silver:'#f1f5f9', gold:'#fffbeb', diamond:'#eff6ff', legendary:'#fdf4ff' };

  var html = '<div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap">'
    + '<div style="font-size:24px;font-weight:900;color:#0b1626">' + earnedCount + '<span style="font-size:14px;font-weight:500;color:#94a3b8">/' + total + '</span></div>'
    + '<div style="flex:1;min-width:120px"><div class="badge-progress-bar"><div class="badge-progress-fill" style="width:' + pct + '%"></div></div>'
    + '<div style="font-size:10px;color:#94a3b8;margin-top:4px">' + pct + '% complete</div></div>'
    + '</div>';

  // Show earned badges first, then a few locked ones
  var earnedBadges = BADGE_DEFS.filter(function(b) { return !!earned[b.id]; });
  var lockedBadges = BADGE_DEFS.filter(function(b) { return !earned[b.id]; });

  html += '<div class="badge-grid-mp">';
  earnedBadges.forEach(function(b) {
    var c = tierColor[b.tier] || '#f5a623';
    var bg = tierBg[b.tier] || '#fffbeb';
    html += '<div class="badge-item-mp" title="' + b.name + ': ' + b.desc + '">'
      + '<div class="badge-icon-mp earned" style="background:' + bg + ';--badge-color:' + c + ';--badge-glow:' + c + '33">' + b.icon + '</div>'
      + '<div class="badge-name-mp">' + b.name + '</div></div>';
  });
  // Show first 8 locked badges
  lockedBadges.slice(0, 8).forEach(function(b) {
    html += '<div class="badge-item-mp" title="' + b.name + ': ' + b.desc + ' (Locked)">'
      + '<div class="badge-icon-mp locked" style="background:#f4f6fa">' + b.icon + '</div>'
      + '<div class="badge-name-mp" style="color:#cbd5e1">' + b.name + '</div></div>';
  });
  if (lockedBadges.length > 8) {
    // Clickable chip that opens the full badges modal — previously a static
    // div with no handler, so tapping did nothing.
    html += '<div class="badge-item-mp" onclick="openAllBadgesModal()" role="button" tabindex="0"'
      + ' style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:54px;height:54px;cursor:pointer;border:1.5px dashed #cbd5e1;border-radius:50%;transition:all .15s"'
      + ' onmouseover="this.style.borderColor=\'#2563eb\';this.style.background=\'#eff6ff\'"'
      + ' onmouseout="this.style.borderColor=\'#cbd5e1\';this.style.background=\'transparent\'"'
      + ' title="Show all badges">'
      + '<div style="font-size:13px;font-weight:900;color:#2563eb;line-height:1">+' + (lockedBadges.length - 8) + '</div>'
      + '<div style="font-size:8px;font-weight:700;color:#64748b;margin-top:2px;text-transform:uppercase;letter-spacing:.05em">View all</div>'
      + '</div>';
  }
  html += '</div>';

  el.innerHTML = html;
}

// ── Full-badges modal ─────────────────────────────────────────
function openAllBadgesModal() {
  var existing = document.getElementById('all-badges-overlay');
  if (existing) existing.remove();
  var overlay = document.createElement('div');
  overlay.id = 'all-badges-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(5,12,24,.78);display:flex;align-items:center;justify-content:center;z-index:3500;padding:14px';
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });

  var modal = document.createElement('div');
  modal.style.cssText = 'background:#fff;border-radius:18px;width:min(760px,96vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden';
  modal.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #eef2f7;flex-shrink:0">'
    +   '<h3 style="margin:0;font-size:16px;font-weight:900;color:#0b1626;letter-spacing:.02em">All Badges</h3>'
    +   '<button onclick="document.getElementById(\'all-badges-overlay\').remove()" aria-label="Close" style="border:none;background:#f1f5f9;color:#475569;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1">&times;</button>'
    + '</div>'
    + '<div id="all-badges-body" style="flex:1;overflow-y:auto;padding:20px 22px"></div>';
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  var body = document.getElementById('all-badges-body');
  if (typeof renderBadgePage === 'function' && body) {
    try { renderBadgePage(body); } catch(e) { body.innerHTML = '<div style="text-align:center;padding:20px;color:#ef4444">Failed to load: ' + (e.message||'') + '</div>'; }
  } else if (body) {
    body.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8">Badge system is still loading — try again in a moment.</div>';
  }
}

// ══════════════════════════════════════════════════════════════

document.addEventListener('DOMContentLoaded', function() {
  function _startMyPage() { initMyPage(); loadRoomLayout(); }
  // supaUser가 이미 있으면 즉시 실행, 없으면 이벤트 대기
  if (window.supaUser) {
    _startMyPage();
  } else {
    window.addEventListener('kh-auth-signed-in', function() { _startMyPage(); }, { once: true });
    // 세션 체크 완료 후에도 미로그인이면 실행 (게스트 모드)
    var _fallback = setTimeout(function() { if (!window.supaUser) _startMyPage(); }, 3000);
    window.addEventListener('kh-auth-signed-in', function() { clearTimeout(_fallback); }, { once: true });
  }
});
</script>
