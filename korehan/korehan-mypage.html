// ── Render placed items in room ──────────────────────────────
function renderRoomItems() {
  var container = document.getElementById('miniroom-items');
  if (!container) return;
  var layout = getRoomLayout();
  container.innerHTML = '';
  _updateRoomEmptyState(layout.length === 0);

  layout.forEach(function(placed) {
    var def = getRoomItemDef(placed.id);
    if (!def) return;
    var div = document.createElement('div');
    div.className = 'room-placed-item';
    div.dataset.itemId = placed.id;
    if (def.effect && def.effect !== 'none') div.dataset.effect = def.effect;
    var scale = Math.max(70, Math.min(170, Number(placed.scale || 100)));
    var base = def.size || 100;
    // Position as % of 400x360 base
    var leftPct = (placed.x / 400) * 100;
    var topPct  = (placed.y / 360) * 100;
    // Visual size in px, proportional to actual container width
    // Visual size: proportional to container
    // On PC (>700px) reduce hitbox to 40% and compensate with sprite scale
    var sizePct = (base / 400) * 100;
    var isPC = window.innerWidth > 700;
    var hitboxRatio = isPC ? 0.4 : 0.7;
    var hitboxPct = sizePct * hitboxRatio;
    var spriteCompensate = 1 / hitboxRatio;
    // Adjust position so visual center stays the same
    var offsetPct = (sizePct - hitboxPct) / 2;
    var adjLeftPct = leftPct + (offsetPct / 100) * (100); // shift right
    var adjTopPct = topPct + (offsetPct / 100) * (100);   // shift down
    // Simple: offset = (sizePct - hitboxPct) / 2 in % units
    adjLeftPct = leftPct + (sizePct - hitboxPct) / 2;
    adjTopPct = topPct + (sizePct - hitboxPct) / 2;
    div.setAttribute('style',
      'left:' + adjLeftPct + '%;top:' + adjTopPct + '%;width:' + hitboxPct + '%;height:' + hitboxPct + '%;'
      + 'cursor:' + (_roomEditing ? 'grab' : 'default') + ';'
      + (_roomEditing ? 'outline:2px dashed rgba(255,255,255,.3);' : '')
    );
    div.title = def.name;
    div.setAttribute('role', 'button');
    div.setAttribute('aria-label', (def.isBadge ? 'Badge: ' : 'Item: ') + def.name);
    div.dataset.scale = String(scale);
    div.dataset.sizePct = String(sizePct);
    div.dataset.hitboxRatio = String(hitboxRatio);

    var sprite = document.createElement('div');
    sprite.className = 'room-placed-sprite';
    var flipped = !!placed.flipped;
    var sx = flipped ? -1 : 1;
    var s = (scale / 100) * spriteCompensate;
    sprite.setAttribute('style', roomItemBgStyle(def)
      + 'width:100%;height:100%;position:absolute;inset:0;'
      + (def.isBadge ? 'image-rendering:pixelated;' : '')
      + 'transform:scale(' + (sx * s) + ',' + s + ');');
    if (flipped) sprite.dataset.flipped = '1';
    div.appendChild(sprite);

    // Drag events
    div.addEventListener('mousedown', roomDragStart);
    div.addEventListener('touchstart', roomDragStart, {passive:false});
    div.addEventListener('click', roomSelectItem);
    // Long-press to remove (mobile-friendly) — 450ms with progress feedback.
    (function(el, id) {
      var _lp = null;
      var _lpStartX = 0, _lpStartY = 0;
      var _clearLp = function() {
        clearTimeout(_lp);
        el.classList.remove('room-longpressing');
      };
      el.addEventListener('touchstart', function(ev) {
        if (!_roomEditing) return;
        var t = ev.touches && ev.touches[0];
        _lpStartX = t ? t.clientX : 0;
        _lpStartY = t ? t.clientY : 0;
        el.classList.add('room-longpressing');
        _lp = setTimeout(function() {
          el.classList.remove('room-longpressing');
          if (!_roomEditing) return;
          khConfirm('Remove from room?', 'Remove "' + (def.name||id) + '" from your room?', { okLabel: 'Remove', destructive: true }).then(function(ok) {
            if (ok) removeRoomItem(id);
          });
        }, 450);
      }, {passive:true});
      el.addEventListener('touchend', _clearLp);
      el.addEventListener('touchcancel', _clearLp);
      el.addEventListener('touchmove', function(ev) {
        // Only cancel if moved more than 12px (prevent jitter cancellation)
        var t = ev.touches && ev.touches[0];
        if (t) {
          var dx = Math.abs(t.clientX - _lpStartX);
          var dy = Math.abs(t.clientY - _lpStartY);
          if (dx > 12 || dy > 12) _clearLp();
        }
      });
    })(div, placed.id);

    if (_selectedRoomItemId && _selectedRoomItemId === placed.id) {
      div.classList.add('room-selected');
    }

    container.appendChild(div);

    // Per-item decorators (Phase-1 polish): clock hands, window tints,
    // pet idle slide. All are passive — they hook on top of the existing
    // sprite without changing its sizing or drag math.
    if (placed.id === 'wall_clock') _decorateClock(div);
    else if (placed.id && placed.id.indexOf('window_') === 0) _decorateWindow(div, def);
    if (def.category === 'pet') _decoratePet(div);
    // Phase-2: hub-ify learning-related furniture (desk → study room,
    // bookshelf → vocab, TV → conversations, etc).
    _decorateHub(div, placed.id);
  });
  _ensureClockTicker();
  _updateRoomTimeOfDay();
  _ensureTimeOfDayTicker();
  _ensureSeasonalParticles();
  _applyRoomTheme();
}

// ── Phase-2: Seasonal particle layer ──────────────────────────
// Auto-pick by month. Snow Dec/Jan/Feb, blossoms Mar/Apr, leaves
// Oct/Nov, nothing the rest of the year. Pure DOM particles — cheap,
// CSS animation handles the movement.
var _seasonalStarted = false;
function _ensureSeasonalParticles() {
  if (_seasonalStarted) return;
  var month = new Date().getMonth() + 1;
  var glyph = null, count = 0;
  if (month === 12 || month === 1 || month === 2) { glyph = '❄'; count = 14; }
  else if (month === 3 || month === 4)            { glyph = '🌸'; count = 12; }
  else if (month === 10 || month === 11)          { glyph = '🍁'; count = 10; }
  if (!glyph) return;
  var host = document.getElementById('miniroom-container');
  if (!host) return;
  // Don't double-mount across re-renders.
  var existing = host.querySelector('.room-season-layer');
  if (existing) existing.remove();
  var layer = document.createElement('div');
  layer.className = 'room-season-layer';
  for (var i = 0; i < count; i++) {
    var p = document.createElement('span');
    p.className = 'room-season-flake';
    p.textContent = glyph;
    p.style.left = (Math.random() * 95) + '%';
    p.style.fontSize = (10 + Math.random() * 14) + 'px';
    p.style.animationDuration = (10 + Math.random() * 10) + 's';
    p.style.animationDelay = (-Math.random() * 18) + 's';
    layer.appendChild(p);
  }
  host.appendChild(layer);
  _seasonalStarted = true;
}

var _ROOM_THEME_KEY = 'kh_room_theme_v1';
function _getRoomTheme() {
  try { return JSON.parse(localStorage.getItem(_ROOM_THEME_KEY) || '{}'); }
  catch(e) { return {}; }
}
function _saveRoomTheme(t) {
  try { localStorage.setItem(_ROOM_THEME_KEY, JSON.stringify(t)); } catch(e) {}
}
function _applyRoomTheme() {
  var theme = _getRoomTheme();
  var wpId = theme.wallpaper || 'default';
  var flId = theme.floor || 'none';
  var wp = WALLPAPERS.filter(function(w){ return w.id === wpId; })[0] || WALLPAPERS[0];
  var fl = FLOORS.filter(function(f){ return f.id === flId; })[0] || FLOORS[0];
  var room = document.getElementById('miniroom-container');
  if (room) room.style.background = wp.bg;
  var floor = document.getElementById('room-floor-layer');
  if (floor) {
    floor.style.background = fl.bg;
    floor.style.opacity = (flId === 'none') ? '0' : '1';
  }
  var btn = document.getElementById('room-theme-btn');
  if (btn) btn.classList.toggle('on', wpId !== 'default' || flId !== 'none');
}
function _renderThemeDrawer() {
  var d = document.getElementById('room-theme-drawer');
  if (!d) return;
  var theme = _getRoomTheme();
  var activeTab = d.dataset.tab || 'wallpaper';
  var list = activeTab === 'floor' ? FLOORS : WALLPAPERS;
  var activeId = (activeTab === 'floor' ? (theme.floor || 'none') : (theme.wallpaper || 'default'));
  d.innerHTML =
    '<div class="room-theme-tabs">'
    + '<button class="room-theme-tab' + (activeTab === 'wallpaper' ? ' active' : '') + '" data-tab="wallpaper" type="button">Wallpaper</button>'
    + '<button class="room-theme-tab' + (activeTab === 'floor'     ? ' active' : '') + '" data-tab="floor" type="button">Floor</button>'
    + '</div>'
    + '<div class="room-theme-grid">'
    + list.map(function(it) {
        var on = it.id === activeId ? ' active' : '';
        var bg = it.bg.replace(/"/g, '&quot;');
        return '<div class="room-theme-swatch' + on + '" data-id="' + it.id + '" data-name="' + it.name + '" style="background:' + bg + '"></div>';
      }).join('')
    + '</div>';
  d.querySelectorAll('.room-theme-tab').forEach(function(b) {
    b.addEventListener('click', function(e) {
      e.stopPropagation();
      d.dataset.tab = b.dataset.tab;
      _renderThemeDrawer();
    });
  });
  d.querySelectorAll('.room-theme-swatch').forEach(function(s) {
    s.addEventListener('click', function(e) {
      e.stopPropagation();
      var theme = _getRoomTheme();
      if (activeTab === 'floor') theme.floor = s.dataset.id;
      else theme.wallpaper = s.dataset.id;
      _saveRoomTheme(theme);
      _applyRoomTheme();
      _renderThemeDrawer();
    });
  });
}
function toggleRoomThemeDrawer(ev) {
  if (ev) ev.stopPropagation();
  var d = document.getElementById('room-theme-drawer');
  if (!d) return;
  var open = d.classList.toggle('open');
  if (open) {
    d.dataset.tab = d.dataset.tab || 'wallpaper';
    _renderThemeDrawer();
    setTimeout(function() {
      function offClick(e) {
        if (d.contains(e.target) || (e.target && e.target.id === 'room-theme-btn')) return;
        d.classList.remove('open');
        document.removeEventListener('click', offClick);
      }
      document.addEventListener('click', offClick);
    }, 0);
  }
}

function _renderPetBadge(div, count, animate) {

// ── Phase-1 decorators ──────────────────────────────────────────

// Wall clock: SVG hands overlayed on the sprite. Updated once a second
// by _ensureClockTicker. Ignores a clock sprite that already has hands
// painted on the PNG — we just add ours on top.
function _decorateClock(div) {
  if (div.querySelector('.room-clock-hands')) return;
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'room-clock-hands');
  svg.setAttribute('viewBox', '0 0 100 100');
  function mkHand(y2, w, color, cls) {
    var l = document.createElementNS(ns, 'line');
    l.setAttribute('x1', '50'); l.setAttribute('y1', '50');
    l.setAttribute('x2', '50'); l.setAttribute('y2', String(y2));
    l.setAttribute('stroke', color);
    l.setAttribute('stroke-width', String(w));
    l.setAttribute('stroke-linecap', 'round');
    l.style.transformOrigin = '50px 50px';
    if (cls) l.setAttribute('class', cls);
    return l;
  }
  var hour = mkHand(32, 3.4, '#0f172a');
  var min  = mkHand(22, 2.4, '#0f172a');
  var sec  = mkHand(18, 1.2, '#dc2626', 'sec');
  var pin  = document.createElementNS(ns, 'circle');
  pin.setAttribute('cx', '50'); pin.setAttribute('cy', '50'); pin.setAttribute('r', '2.6');
  pin.setAttribute('fill', '#0f172a');
  svg.appendChild(hour); svg.appendChild(min); svg.appendChild(sec); svg.appendChild(pin);
  div.appendChild(svg);
  div._clockHands = { hour: hour, min: min, sec: sec };
}

var _clockTickerStarted = false;
function _ensureClockTicker() {
  if (_clockTickerStarted) return;
  _clockTickerStarted = true;
  setInterval(function() {
    var now = new Date();
    var h = now.getHours() % 12;
    var m = now.getMinutes();
    var s = now.getSeconds();
    var hAng = (h + m / 60) * 30;
    var mAng = (m + s / 60) * 6;
    var sAng = s * 6;
    document.querySelectorAll('.room-placed-item[data-item-id="wall_clock"]').forEach(function(div) {
      if (!div._clockHands) return;
      div._clockHands.hour.style.transform = 'rotate(' + hAng + 'deg)';
      div._clockHands.min.style.transform  = 'rotate(' + mAng + 'deg)';
      div._clockHands.sec.style.transform  = 'rotate(' + sAng + 'deg)';
    });
  }, 1000);
}

// Window: a tint layer that slides between morning / day / dusk / night
// colors driven by _updateRoomTimeOfDay. Rainy window also gets an
// animated streak overlay.
function _decorateWindow(div, def) {
  if (div.querySelector('.room-window-tint')) {
    return;
  }
  var tint = document.createElement('div');
  tint.className = 'room-window-tint';
  div.appendChild(tint);
  if (def && def.id === 'window_rain') {
    var rain = document.createElement('div');
    rain.className = 'room-window-rain';
    div.appendChild(rain);
  }
}

// Time of day → page-wide color overlay + per-window tint. Runs once on
// render and then every minute (set by _ensureTimeOfDayTicker).
function _updateRoomTimeOfDay() {
  var h = new Date().getHours();
  var bg, windowTint;
  if (h < 6) {
    bg = 'linear-gradient(180deg,rgba(20,30,80,.55),rgba(8,12,40,.65))';
    windowTint = 'linear-gradient(180deg,rgba(40,60,140,.55),rgba(15,20,60,.65))';
  } else if (h < 9) {
    bg = 'linear-gradient(180deg,rgba(255,200,150,.18),rgba(255,180,120,.10))';
    windowTint = 'linear-gradient(180deg,rgba(255,210,160,.5),rgba(255,170,140,.35))';
  } else if (h < 17) {
    bg = 'transparent';
    windowTint = 'linear-gradient(180deg,rgba(180,220,255,.35),rgba(200,230,255,.2))';
  } else if (h < 20) {
    bg = 'linear-gradient(180deg,rgba(255,140,80,.25),rgba(255,90,60,.2))';
    windowTint = 'linear-gradient(180deg,rgba(255,140,90,.55),rgba(255,80,90,.45))';
  } else if (h < 23) {
    bg = 'linear-gradient(180deg,rgba(60,40,120,.40),rgba(20,20,80,.50))';
    windowTint = 'linear-gradient(180deg,rgba(70,50,130,.6),rgba(20,20,80,.7))';
  } else {
    bg = 'linear-gradient(180deg,rgba(20,30,80,.55),rgba(8,12,40,.65))';
    windowTint = 'linear-gradient(180deg,rgba(40,60,140,.55),rgba(15,20,60,.65))';
  }
  var overlay = document.getElementById('room-time-overlay');
  if (overlay) overlay.style.background = bg;
  document.querySelectorAll('.room-window-tint').forEach(function(el) {
    el.style.background = windowTint;
  });
}

var _todTickerStarted = false;
function _ensureTimeOfDayTicker() {
  if (_todTickerStarted) return;
  _todTickerStarted = true;
  setInterval(_updateRoomTimeOfDay, 60000);
}

// ── Room BGM (Web Audio, generative — no audio files) ──────────
// Browsers block autoplay until a gesture, which is fine here because
// the user clicks the 🎵 button to open the drawer and pick a track.
// We synthesize three flavors:
//   • brown  — deep, soft white-noise filtered low (good background hum)
//   • rain   — pink-ish noise filtered + amplitude jitter (rainfall)
//   • cafe   — brown noise base + occasional voice-like burble bursts
// All loop indefinitely until the user picks 'off' or navigates away.
var _bgm = null;
var _BGM_KEY = 'kh_room_bgm_v1';
var BGM_TRACKS = [
  { id: 'off',   label: 'Off',         emoji: '🚫' },
  { id: 'brown', label: 'White noise', emoji: '🌫' },
  { id: 'rain',  label: 'Rain',        emoji: '🌧' },
  { id: 'cafe',  label: 'Cafe hum',    emoji: '☕' },
  { id: 'lofi',  label: 'Lo-fi pulse', emoji: '🎧' }
];

function _bgmGetSavedState() {
  try { return JSON.parse(localStorage.getItem(_BGM_KEY) || '{}'); }
  catch(e) { return {}; }
}
function _bgmSaveState(state) {
  try { localStorage.setItem(_BGM_KEY, JSON.stringify(state)); } catch(e) {}
}

function _bgmEnsureCtx() {
  if (_bgm && _bgm.ctx) return _bgm;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  var ctx = new Ctx();
  var master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  _bgm = { ctx: ctx, master: master, nodes: [], track: 'off', volume: 0.4 };
  return _bgm;
}
function _bgmStopCurrent() {
  if (!_bgm) return;
  _bgm.nodes.forEach(function(n) { try { n.stop && n.stop(); } catch(e) {} try { n.disconnect && n.disconnect(); } catch(e) {} });
  _bgm.nodes = [];
}

// Helper: looping noise buffer source.
function _bgmNoiseSource(ctx, color) {
  var buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  var data = buf.getChannelData(0);
  if (color === 'pink') {
    var b0=0,b1=0,b2=0;
    for (var i = 0; i < data.length; i++) {
      var w = Math.random() * 2 - 1;
      b0 = 0.99765 * b0 + w * 0.0990460;
      b1 = 0.96300 * b1 + w * 0.2965164;
      b2 = 0.57000 * b2 + w * 1.0526913;
      data[i] = (b0 + b1 + b2 + w * 0.1848) * 0.11;
    }
  } else if (color === 'brown') {
    var last = 0;
    for (var j = 0; j < data.length; j++) {
      var w2 = Math.random() * 2 - 1;
      last = (last + 0.02 * w2) / 1.02;
      data[j] = last * 3.5;
    }
  } else { // white
    for (var k = 0; k < data.length; k++) data[k] = Math.random() * 2 - 1;
  }
  var src = ctx.createBufferSource();
  src.buffer = buf;
  src.loop = true;
  return src;
}

function _bgmPlay(trackId) {
  var ctx_ = _bgmEnsureCtx();
  if (!ctx_) return;
  // Resume context (browsers suspend until first gesture)
  if (ctx_.ctx.state === 'suspended') ctx_.ctx.resume();
  _bgmStopCurrent();
  _bgm.track = trackId;
  var ctx = ctx_.ctx;
  var master = ctx_.master;

  if (trackId === 'off') {
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
    return;
  }

  if (trackId === 'brown') {
    var src = _bgmNoiseSource(ctx, 'brown');
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 380; lp.Q.value = 0.6;
    src.connect(lp); lp.connect(master);
    src.start();
    _bgm.nodes.push(src);
  } else if (trackId === 'rain') {
    var src1 = _bgmNoiseSource(ctx, 'pink');
    var hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 600;
    var lp2 = ctx.createBiquadFilter();
    lp2.type = 'lowpass'; lp2.frequency.value = 4500;
    src1.connect(hp); hp.connect(lp2); lp2.connect(master);
    src1.start();
    _bgm.nodes.push(src1);
    // Distant rumble layer for depth
    var rumble = _bgmNoiseSource(ctx, 'brown');
    var lp3 = ctx.createBiquadFilter();
    lp3.type = 'lowpass'; lp3.frequency.value = 220;
    var rg = ctx.createGain(); rg.gain.value = 0.45;
    rumble.connect(lp3); lp3.connect(rg); rg.connect(master);
    rumble.start();
    _bgm.nodes.push(rumble);
  } else if (trackId === 'cafe') {
    // Brown noise base + occasional resonant blips simulating chatter.
    var bn = _bgmNoiseSource(ctx, 'brown');
    var lpA = ctx.createBiquadFilter();
    lpA.type = 'lowpass'; lpA.frequency.value = 700;
    var bg = ctx.createGain(); bg.gain.value = 0.85;
    bn.connect(lpA); lpA.connect(bg); bg.connect(master);
    bn.start();
    _bgm.nodes.push(bn);
    // Periodic gentle blip to suggest chatter rhythm
    var blipTimer = setInterval(function() {
      if (_bgm.track !== 'cafe') { clearInterval(blipTimer); return; }
      var t = ctx.currentTime;
      var osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = 200 + Math.random() * 300;
      var g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.05 + Math.random() * 0.05, t + 0.08);
      g.gain.linearRampToValueAtTime(0, t + 0.55);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + 0.6);
    }, 850);
    _bgm.nodes.push({ stop: function(){ clearInterval(blipTimer); }, disconnect: function(){} });
  } else if (trackId === 'lofi') {
    // Tiny lo-fi feel: brown noise hiss + slow arpeggio of sine pads.
    var bnL = _bgmNoiseSource(ctx, 'brown');
    var lpL = ctx.createBiquadFilter();
    lpL.type = 'lowpass'; lpL.frequency.value = 900;
    var bgL = ctx.createGain(); bgL.gain.value = 0.4;
    bnL.connect(lpL); lpL.connect(bgL); bgL.connect(master);
    bnL.start();
    _bgm.nodes.push(bnL);
    // Slow chord arpeggio (Cmaj7 / Am7 / Fmaj7 / G7 — 4 chords, 2s each)
    var chords = [
      [261.63, 329.63, 392.00, 493.88], // C E G B
      [220.00, 261.63, 329.63, 392.00], // A C E G
      [174.61, 220.00, 261.63, 329.63], // F A C E
      [196.00, 246.94, 293.66, 392.00]  // G B D G
    ];
    var step = 0;
    var arpTimer = setInterval(function() {
      if (_bgm.track !== 'lofi') { clearInterval(arpTimer); return; }
      var chord = chords[step % chords.length];
      step++;
      chord.forEach(function(freq, i) {
        var t = ctx.currentTime + i * 0.45;
        var osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        var g = ctx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.06, t + 0.25);
        g.gain.linearRampToValueAtTime(0, t + 1.6);
        osc.connect(g); g.connect(master);
        osc.start(t); osc.stop(t + 1.7);
      });
    }, 2200);
    _bgm.nodes.push({ stop: function(){ clearInterval(arpTimer); }, disconnect: function(){} });
  }
  // Fade in master to set volume
  master.gain.cancelScheduledValues(ctx.currentTime);
  master.gain.linearRampToValueAtTime(_bgm.volume, ctx.currentTime + 0.6);
}

function _bgmSetVolume(v) {
  if (!_bgm) return;
  _bgm.volume = Math.max(0, Math.min(1, Number(v) || 0));
  var t = _bgm.ctx.currentTime;
  _bgm.master.gain.cancelScheduledValues(t);
  _bgm.master.gain.linearRampToValueAtTime(_bgm.volume, t + 0.2);
  var st = _bgmGetSavedState(); st.volume = _bgm.volume; _bgmSaveState(st);
}

function _bgmRenderDrawer() {
  var d = document.getElementById('room-bgm-drawer');
  if (!d) return;
  var current = (_bgm && _bgm.track) || 'off';
  var vol = (_bgm && typeof _bgm.volume === 'number') ? _bgm.volume : 0.4;
  d.innerHTML = BGM_TRACKS.map(function(t) {
    var on = t.id === current ? ' active' : '';
    return '<div class="room-bgm-track' + on + '" role="menuitem" data-track="' + t.id + '">'
      + '<span class="room-bgm-emoji">' + t.emoji + '</span>'
      + '<span>' + t.label + '</span>'
      + '</div>';
  }).join('')
  + '<div class="room-bgm-vol"><i data-lucide="volume-2" class="kh-ui-icon kh-ui-icon-sm" aria-hidden="true"></i>'
  + '<input type="range" min="0" max="1" step="0.05" value="' + vol + '">'
  + '</div>';
  d.querySelectorAll('.room-bgm-track').forEach(function(el) {
    el.addEventListener('click', function() {
      var tid = el.getAttribute('data-track');
      _bgmPlay(tid);
      var st = _bgmGetSavedState(); st.track = tid; _bgmSaveState(st);
      var btn = document.getElementById('room-bgm-btn');
      if (btn) btn.classList.toggle('on', tid !== 'off');
      _bgmRenderDrawer();
    });
  });
  var rng = d.querySelector('input[type=range]');
  if (rng) rng.addEventListener('input', function() { _bgmSetVolume(rng.value); });
}

function toggleRoomBGMDrawer(ev) {
  if (ev) { ev.stopPropagation(); }
  var d = document.getElementById('room-bgm-drawer');
  if (!d) return;
  // Lazy-init audio context on first interaction.
  if (!_bgm) {
    _bgmEnsureCtx();
    var saved = _bgmGetSavedState();
    if (saved && typeof saved.volume === 'number') _bgm.volume = saved.volume;
  }
  var open = d.classList.toggle('open');
  if (open) {
    _bgmRenderDrawer();
    // Click-outside to close
    setTimeout(function() {
      function offClick(e) {
        if (d.contains(e.target) || (e.target && e.target.id === 'room-bgm-btn')) return;
        d.classList.remove('open');
        document.removeEventListener('click', offClick);
      }
      document.addEventListener('click', offClick);
    }, 0);
  }
}
window.toggleRoomBGMDrawer = toggleRoomBGMDrawer;

// Pets: gentle left-right slide using transform translateX so the saved
// position (placed.x) is untouched. Click triggers a hop + a heart popup
// (only when not in edit mode — edit mode keeps the existing select/drag
// behavior). Affinity tracking can hook in later via the 'click' event.
function _decoratePet(div) {
  div.classList.add('room-pet');
  // Render existing affinity badge (if any) on first paint so a returning
  // user sees their pet's stat immediately.
  var pid = div.dataset.itemId;
  var existingCount = (_getPetAffinity())[pid] || 0;
  if (existingCount > 0) _renderPetBadge(div, existingCount, false);

  if (div._petAnim) return;
  var phase = Math.random() * Math.PI * 2;
  var range = 22; // px swing
  var period = 5 + Math.random() * 3; // seconds per full sway
  var t0 = Date.now();
  function tick() {
    if (!div.isConnected) { div._petAnim = null; return; }
    if (_roomEditing) {
      // Pause sliding while editing so dragging feels accurate.
      div.style.transform = '';
    } else {
      var t = (Date.now() - t0) / 1000;
      var x = Math.sin((t / period) * Math.PI * 2 + phase) * range;
      div.style.transform = 'translateX(' + x.toFixed(2) + 'px)';
    }
    div._petAnim = requestAnimationFrame(tick);
  }
  div._petAnim = requestAnimationFrame(tick);

  div.addEventListener('click', function(e) {
    if (_roomEditing) return; // edit mode owns clicks (selection)
    // Hop animation — re-trigger by toggling class
    div.classList.remove('room-pet-hop');
    void div.offsetWidth;
    div.classList.add('room-pet-hop');
    setTimeout(function() { div.classList.remove('room-pet-hop'); }, 360);
    // Heart popup
    var heart = document.createElement('div');
    heart.className = 'room-pet-heart';
    heart.textContent = ['❤️','💕','💖','✨'][Math.floor(Math.random()*4)];
    div.appendChild(heart);
    setTimeout(function() { heart.remove(); }, 900);
    // Affinity++ + badge update
    var newCount = _bumpPetAffinity(pid);
    _renderPetBadge(div, newCount, true);
  });
}

// ── Load room (call on page init) ────────────────────────────
// Hitbox ratio flips at 700px (see renderRoomItems); on rotate / split-screen
// we need to re-render so drag math matches the new viewport. Debounce to
// avoid thrashing during active resize animations.
var _roomResizeTimer = null;
var _roomResizeWasPC = null;
window.addEventListener('resize', function() {
  if (_roomResizeTimer) clearTimeout(_roomResizeTimer);
  _roomResizeTimer = setTimeout(function() {
    var isPC = window.innerWidth > 700;
    if (_roomResizeWasPC === null) { _roomResizeWasPC = isPC; return; }
    if (isPC !== _roomResizeWasPC) {
      _roomResizeWasPC = isPC;
      if (document.getElementById('miniroom-items')) renderRoomItems();
    }
  }, 200);
});

async function loadRoomLayout() {
  _showRoomLoading(true);
  try {
    // Load room item catalog from DB (replaces hardcoded array)
    await loadRoomItemsFromDB();
    // Try loading from server first (cross-device sync)
    await _loadRoomFromServer();

    var owned = getRoomOwned();
    var layout = getRoomLayout();

    // First-time setup: give starter items
    if (owned.length === 0 && layout.length === 0) {
      var starterOwned = ['character', 'plant'];
      var starterLayout = [
        {id:'character', x:150, y:160, scale:100},
        {id:'plant',     x:280, y:220, scale:100}
      ];
      setRoomOwned(starterOwned);
      setRoomLayout(starterLayout);
    }

    renderRoomItems();
    updateRoomSizeUI();
  } finally {
    _showRoomLoading(false);
  }
}

function _showRoomLoading(on) {

// ── Save room layout ─────────────────────────────────────────
function saveRoomLayout() {
  var container = document.getElementById('miniroom-container');
  var cW = container ? container.offsetWidth : 400;
  var cH = container ? container.offsetHeight : 360;
  var items = [];
  document.querySelectorAll('.room-placed-item').forEach(function(el) {
    var saved = getPlacedState(el.dataset.itemId) || {};
    // Convert current position back to 400x360 base for storage
    // Must undo the hitbox offset that renderRoomItems added
    var curLeft = parseFloat(el.style.left) || 0;
    var curTop  = parseFloat(el.style.top) || 0;
    var sizePct = parseFloat(el.dataset.sizePct) || 0;
    var hitboxRatio = parseFloat(el.dataset.hitboxRatio) || 0.7;
    var hitboxPct = sizePct * hitboxRatio;
    var offsetPct = (sizePct - hitboxPct) / 2;
    // Undo the offset that was added during render
    var rawLeftPct = curLeft - offsetPct;
    var rawTopPct = curTop - offsetPct;
    var x, y;
    if (String(el.style.left).indexOf('%') >= 0) {
      x = Math.round((rawLeftPct / 100) * 400);
      y = Math.round((rawTopPct / 100) * 360);
    } else {
      x = Math.round((curLeft / cW) * 400);
      y = Math.round((curTop / cH) * 360);
    }
    var spriteEl = el.querySelector('.room-placed-sprite');
    items.push({
      id: el.dataset.itemId,
      x: Math.max(0, Math.min(380, x)),
      y: Math.max(0, Math.min(340, y)),
      scale: Math.max(70, Math.min(170, Number(saved.scale || 100))),
      flipped: !!(spriteEl && spriteEl.dataset.flipped === '1')
    });
  });
  setRoomLayout(items);
  _syncRoomToServer();
  if (typeof toast === 'function') toast('Room saved!');
  if (_roomEditing) toggleRoomEdit();
}

// ── Toggle edit mode ─────────────────────────────────────────
function toggleRoomEdit() {
  _roomEditing = !_roomEditing;
  var btn = document.getElementById('room-edit-btn');
  var saveBtn = document.getElementById('room-save-btn');
  var container = document.getElementById('miniroom-container');
  if (btn) btn.textContent = _roomEditing ? 'Editing...' : 'Edit Room';
  if (saveBtn) saveBtn.style.display = _roomEditing ? '' : 'none';
  if (container) {
    container.classList.toggle('room-editing-active', _roomEditing);
    container.style.touchAction = _roomEditing ? 'none' : 'auto';
  }
  var sizeControls = document.getElementById('room-size-controls');
  if (sizeControls) sizeControls.style.display = _roomEditing ? '' : 'none';

  document.querySelectorAll('.room-placed-item').forEach(function(el) {
    el.style.cursor = _roomEditing ? 'grab' : 'default';
    el.style.outline = _roomEditing ? '2px dashed rgba(255,255,255,.3)' : 'none';
    if (!_roomEditing) el.classList.remove('room-selected');
  });
  if (!_roomEditing) {
    _selectedRoomItemId = null;
    updateRoomSizeUI();
    var rmBtn = document.getElementById('room-remove-btn');
    if (rmBtn) rmBtn.style.display = 'none';
  }
}

// ── Drag & Drop ──────────────────────────────────────────────
var _dragStartPos = {x:0, y:0};
var _dragMoved = false;
// Guard so duplicate roomDragStart calls (synthesised mouse-after-touch on
// some Android browsers) don't double-bind the document-level listeners.
var _dragListenersBound = false;
function _bindDragListeners() {
  if (_dragListenersBound) return;
  _dragListenersBound = true;
  document.addEventListener('mousemove', roomDragMove);
  document.addEventListener('mouseup', roomDragEnd);
  document.addEventListener('touchmove', roomDragMove, {passive:false});
  document.addEventListener('touchend', roomDragEnd);
  document.addEventListener('touchcancel', roomDragEnd);
}
function _unbindDragListeners() {
  if (!_dragListenersBound) return;
  _dragListenersBound = false;
  document.removeEventListener('mousemove', roomDragMove);
  document.removeEventListener('mouseup', roomDragEnd);
  document.removeEventListener('touchmove', roomDragMove);
  document.removeEventListener('touchend', roomDragEnd);
  document.removeEventListener('touchcancel', roomDragEnd);
}

function roomDragStart(e) {
  if (!_roomEditing) return;
  e.preventDefault();
  var el = e.currentTarget;
  _dragItem = el;
  _dragMoved = false;
  el.classList.add('room-dragging');
  el.style.cursor = 'grabbing';

  var container = document.getElementById('miniroom-container');
  var rect = container.getBoundingClientRect();
  var elRect = el.getBoundingClientRect();
  var clientX, clientY;
  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  _dragStartPos.x = clientX;
  _dragStartPos.y = clientY;
  _dragOffset.x = clientX - elRect.left;
  _dragOffset.y = clientY - elRect.top;

  _bindDragListeners();
}

function roomDragMove(e) {
  if (!_dragItem) return;
  e.preventDefault();
  var container = document.getElementById('miniroom-container');
  var rect = container.getBoundingClientRect();
  var clientX, clientY;
  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  // Track if actually moved (for tap detection)
  var dx = Math.abs(clientX - _dragStartPos.x);
  var dy = Math.abs(clientY - _dragStartPos.y);
  if (dx > 5 || dy > 5) _dragMoved = true;

  var x = clientX - rect.left - _dragOffset.x;
  var y = clientY - rect.top - _dragOffset.y;

  // Clamp within container (0% to 90%)
  x = Math.max(0, Math.min(rect.width * 0.9, x));
  y = Math.max(0, Math.min(rect.height * 0.9, y));

  _dragItem.style.left = ((x / rect.width) * 100) + '%';
  _dragItem.style.top = ((y / rect.height) * 100) + '%';
}

function roomDragEnd(e) {
  if (_dragItem) {
    var wasItem = _dragItem;
    _dragItem.classList.remove('room-dragging');
    _dragItem.style.cursor = 'grab';
    _dragItem = null;
    // If user didn't move (tap), trigger selection (fixes mobile tap)
    if (!_dragMoved && _roomEditing && wasItem.dataset.itemId) {
      _selectedRoomItemId = wasItem.dataset.itemId;
      document.querySelectorAll('.room-placed-item').forEach(function(el) {
        el.classList.toggle('room-selected', el.dataset.itemId === _selectedRoomItemId);
      });
      updateRoomSizeUI();
      var rmBtn = document.getElementById('room-remove-btn');
      if (rmBtn) rmBtn.style.display = '';
    }
  }
  _unbindDragListeners();
}

function getPlacedState(itemId) {
  var layout = getRoomLayout();
  for (var i = 0; i < layout.length; i++) {
    if (layout[i].id === itemId) return layout[i];
  }
  return null;
}

function roomSelectItem(e) {
  if (!_roomEditing) return;
  var itemId = e.currentTarget && e.currentTarget.dataset ? e.currentTarget.dataset.itemId : null;
  if (!itemId) return;
  _selectedRoomItemId = itemId;
  document.querySelectorAll('.room-placed-item').forEach(function(el) {
    el.classList.toggle('room-selected', el.dataset.itemId === itemId);
  });
  updateRoomSizeUI();
  var rmBtn = document.getElementById('room-remove-btn');
  if (rmBtn) rmBtn.style.display = '';
}

function flipSelectedItem() {
  if (!_selectedRoomItemId) return;
  var el = document.querySelector('.room-placed-item.room-selected .room-placed-sprite');
  if (!el) return;
  var wasFlipped = el.dataset.flipped === '1';
  var nowFlipped = !wasFlipped;
  el.dataset.flipped = nowFlipped ? '1' : '0';
  var parentEl = el.parentElement;
  var hratio = Number(parentEl.dataset.hitboxRatio || 1);
  var compensate = 1 / hratio;
  var s = parentEl ? (Number(parentEl.dataset.scale || 100) / 100) * compensate : 1;
  var sx = nowFlipped ? -1 : 1;
  el.style.transform = 'scale(' + (sx * s) + ',' + s + ')';
  _syncDOMToLayout();
}

function moveSelectedLayer(dir) {
  if (!_selectedRoomItemId) return;
  // Save current DOM positions to layout first (user may have dragged without saving)
  _syncDOMToLayout();
  var layout = getRoomLayout();
  var idx = -1;
  for (var i = 0; i < layout.length; i++) { if (layout[i].id === _selectedRoomItemId) { idx = i; break; } }
  if (idx < 0) return;
  var newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= layout.length) return;
  var tmp = layout[idx];
  layout[idx] = layout[newIdx];
  layout[newIdx] = tmp;
  setRoomLayout(layout);
  renderRoomItems();
}

// Sync current DOM positions back to layout without triggering save/toast
function _syncDOMToLayout() {
  var container = document.getElementById('miniroom-container');
  var cW = container ? container.offsetWidth : 400;
  var cH = container ? container.offsetHeight : 360;
  var layout = getRoomLayout();
  document.querySelectorAll('.room-placed-item').forEach(function(el) {
    var id = el.dataset.itemId;
    var curLeft = parseFloat(el.style.left) || 0;
    var curTop  = parseFloat(el.style.top) || 0;
    var x = (String(el.style.left).indexOf('%') >= 0)
      ? Math.round((curLeft / 100) * 400)
      : Math.round((curLeft / cW) * 400);
    var y = (String(el.style.top).indexOf('%') >= 0)
      ? Math.round((curTop / 100) * 360)
      : Math.round((curTop / cH) * 360);
    var spriteEl = el.querySelector('.room-placed-sprite');
    for (var i = 0; i < layout.length; i++) {
      if (layout[i].id === id) {
        layout[i].x = Math.max(0, Math.min(380, x));
        layout[i].y = Math.max(0, Math.min(340, y));
        if (spriteEl) layout[i].flipped = spriteEl.dataset.flipped === '1';
        break;
      }
    }
  });
  localStorage.setItem(K_ROOM_LAYOUT, JSON.stringify(layout));
}

function removeSelectedRoomItem() {
  if (!_selectedRoomItemId) return;
  removeRoomItem(_selectedRoomItemId);
  var rmBtn = document.getElementById('room-remove-btn');
  if (rmBtn) rmBtn.style.display = 'none';
}

function updateRoomSizeUI() {
  var slider = document.getElementById('room-size-slider');
  var valueEl = document.getElementById('room-size-value');
  if (!slider || !valueEl) return;
  var placed = _selectedRoomItemId ? getPlacedState(_selectedRoomItemId) : null;
  var scale = placed ? Math.max(70, Math.min(170, Number(placed.scale || 100))) : 100;
  slider.value = String(scale);
  slider.disabled = !_selectedRoomItemId;
  valueEl.textContent = scale + '%';
  valueEl.style.opacity = _selectedRoomItemId ? '1' : '.45';
}

// Slider fires `input` at ~60Hz. Render the visual transform on every tick
// (cheap CSS update), but coalesce the localStorage write + state mutation
// so we don't pay the JSON.stringify on every pixel of slider movement.
var _scaleWriteTimer = null;
function onRoomSizeSlider(value) {
  if (!_selectedRoomItemId) return;
  var scale = Math.max(70, Math.min(170, Number(value || 100)));
  _applyScaleVisual(scale);
  if (_scaleWriteTimer) clearTimeout(_scaleWriteTimer);
  _scaleWriteTimer = setTimeout(function() {
    _scaleWriteTimer = null;
    applySelectedItemScale(scale);
  }, 120);
}

// Cheap visual-only scale update — no layout write, no DOM rebuild.
function _applyScaleVisual(scale) {
  var selectedEl = document.querySelector('.room-placed-item.room-selected');
  if (!selectedEl) return;
  var hratio = Number(selectedEl.dataset.hitboxRatio || 1);
  var compensate = 1 / hratio;
  var spriteEl = selectedEl.querySelector('.room-placed-sprite');
  if (!spriteEl) return;
  var flipped = spriteEl.dataset.flipped === '1';
  var sx = flipped ? -1 : 1;
  var s = (scale / 100) * compensate;
  spriteEl.style.transform = 'scale(' + (sx * s) + ',' + s + ')';
  selectedEl.dataset.scale = String(scale);
  var valueEl = document.getElementById('room-size-value');
  if (valueEl) valueEl.textContent = scale + '%';
}

function nudgeSelectedItemScale(delta) {
  var slider = document.getElementById('room-size-slider');
  if (!slider || !_selectedRoomItemId) return;
  var next = Math.max(70, Math.min(170, (parseInt(slider.value, 10) || 100) + delta));
  slider.value = String(next);
  applySelectedItemScale(next);
}

function applySelectedItemScale(scaleValue) {
  if (!_selectedRoomItemId) return;
  var scale = Math.max(70, Math.min(170, Number(scaleValue || 100)));
  var layout = getRoomLayout();
  var def = getRoomItemDef(_selectedRoomItemId);
  if (!def) return;

  layout = layout.map(function(p) {
    if (p.id !== _selectedRoomItemId) return p;
    // Preserve every existing field (esp. `flipped` and any future props);
    // only the scale changes.
    var next = {};
    for (var k in p) if (Object.prototype.hasOwnProperty.call(p, k)) next[k] = p[k];
    next.scale = scale;
    return next;
  });
  setRoomLayout(layout);

  var selectedEl = document.querySelector('.room-placed-item.room-selected');
  if (selectedEl) {
    selectedEl.dataset.scale = String(scale);
    var hratio = Number(selectedEl.dataset.hitboxRatio || 1);
    var compensate = 1 / hratio;
    var spriteEl = selectedEl.querySelector('.room-placed-sprite');
    if (spriteEl) {
      var flipped = spriteEl.dataset.flipped === '1';
      var sx = flipped ? -1 : 1;
      var s = (scale / 100) * compensate;
      spriteEl.style.transform = 'scale(' + (sx * s) + ',' + s + ')';
    }
  }
  updateRoomSizeUI();
}

// ── Item Shop / My Items ─────────────────────────────────────
// ownedOnly = true → "My Items" drawer (only items the user owns, for placing
//              into the room). Triggered from the MY ROOM controls.
// ownedOnly = false → full Item Shop (kept around for backwards-compat links).
async function openRoomShop(ownedOnly) {
  await loadRoomItemsFromDB();
  var existing = document.querySelector('.room-shop-overlay');
  if (existing) existing.remove();
  _armRoomShopEsc();

  var coin = _userCoin || 0;
  var owned = getRoomOwned();
  // Filter to owned-only when invoked from MY ROOM controls.
  var items = ownedOnly
    ? ROOM_ITEMS.filter(function(it){ return owned.indexOf(it.id) !== -1; })
    : ROOM_ITEMS;

  var overlay = document.createElement('div');
  overlay.className = 'room-shop-overlay';
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeRoomShop(); });

  var catLabels = { all:'All', character:'Characters', pet:'Pets', furniture:'Furniture', deco:'Deco', badge:'Badges' };
  var cats = ['all','character','pet','furniture','deco','badge'];

  var headerTitle = ownedOnly ? 'My Items' : 'Item Shop';
  var headerRight = ownedOnly
    ? '<a href="korehan-shop.html" class="room-shop-bal" style="text-decoration:none;color:#2563eb;font-weight:800">Shop →</a>'
    : '<div class="room-shop-bal" id="room-shop-bal">' + coin.toLocaleString() + ' nyang</div>';

  var html = '<div class="room-shop-modal">'
    + '<div class="room-shop-header">'
    + '<h3>' + headerTitle + '</h3>'
    + headerRight
    + '<button class="room-shop-close" onclick="closeRoomShop()">&times;</button>'
    + '</div>'
    + '<div style="display:flex;gap:6px;padding:10px 24px 0;flex-wrap:wrap">'
    + cats.map(function(c) {
      return '<button class="room-shop-btn ' + (c === 'all' ? 'buy' : '') + '" data-shop-cat="' + c + '" onclick="filterRoomShop(\'' + c + '\')" style="padding:4px 10px;font-size:10px;border-radius:999px;border:1px solid #cbd5e1;background:' + (c === 'all' ? '#2563eb' : '#f1f5f9') + ';color:' + (c === 'all' ? '#fff' : '#475569') + '">' + catLabels[c] + '</button>';
    }).join('')
    + '</div>'
    + '<div class="room-shop-grid">';

  if (!items.length) {
    html += '<div style="grid-column:1/-1;padding:30px 20px;text-align:center;color:#94a3b8;font-size:13px">'
      + (ownedOnly
          ? 'You don\'t own any items yet. Visit the <a href="korehan-shop.html" style="color:#2563eb;font-weight:700">Shop</a> to get some.'
          : 'No items yet.')
      + '</div>';
  }

  items.forEach(function(item) {
    var isOwned = owned.indexOf(item.id) !== -1;
    var placed = isItemPlaced(item.id);
    var canBuy = coin >= item.price;
    var s = 60;
    var cat = item.category || 'deco';
    var isBadge = !!item.isBadge;
    var priceLabel = isBadge ? 'Earned' : (isOwned ? 'Owned' : item.price + ' nyang');

    html += '<div class="room-shop-card" data-item-id="' + item.id + '" data-cat="' + cat + '">'
      + '<div class="room-shop-sprite" style="width:' + s + 'px;height:' + s + 'px;' + roomItemThumbBgStyle(item) + (isBadge ? ';image-rendering:pixelated' : '') + '"></div>'
      + '<div class="room-shop-name">' + item.name + '</div>'
      + '<div class="room-shop-price">' + priceLabel + '</div>';

    if (!isOwned) {
      html += '<button class="room-shop-btn buy" onclick="buyRoomItem(\'' + item.id + '\')"'
        + (canBuy ? '' : ' disabled') + '>'
        + (canBuy ? 'Buy' : 'Not enough') + '</button>';
    } else if (!placed) {
      html += '<button class="room-shop-btn place" onclick="placeRoomItem(\'' + item.id + '\')">Place in Room</button>';
    } else {
      html += '<button class="room-shop-btn owned">In Room</button>'
        + '<button class="room-shop-btn remove" onclick="removeRoomItem(\'' + item.id + '\')">Remove</button>';
    }

    html += '</div>';
  });

  html += '</div></div>';
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
}

function filterRoomShop(cat) {
  document.querySelectorAll('[data-shop-cat]').forEach(function(btn) {
    var active = btn.dataset.shopCat === cat;
    btn.style.background = active ? '#2563eb' : '#f1f5f9';
    btn.style.color = active ? '#fff' : '#475569';
  });
  document.querySelectorAll('.room-shop-card').forEach(function(card) {
    card.style.display = (cat === 'all' || card.dataset.cat === cat) ? '' : 'none';
  });
}

function closeRoomShop() {
  var overlay = document.querySelector('.room-shop-overlay');
  if (overlay) overlay.remove();
  if (_roomShopEscHandler) {
    document.removeEventListener('keydown', _roomShopEscHandler);
    _roomShopEscHandler = null;
  }
}

var _roomShopEscHandler = null;
function _armRoomShopEsc() {
  if (_roomShopEscHandler) return;
  _roomShopEscHandler = function(e) {
    if (e.key === 'Escape' || e.keyCode === 27) closeRoomShop();
  };
  document.addEventListener('keydown', _roomShopEscHandler);
}

// ── Buy item ─────────────────────────────────────────────────
var _roomUseBuyRpc = true; // flips to false on first "not found" from Supabase RPC

async function buyRoomItem(itemId) {
  var def = getRoomItemDef(itemId);
  if (!def) return;
  if (isRoomItemOwned(itemId)) { if (typeof toast === 'function') toast('Already owned!'); return; }
  if (_userCoin < def.price) { if (typeof toast === 'function') toast('Not enough nyang!'); return; }

  var newCoin = _userCoin - def.price;
  var sb = getSupa();
  if (sb && supaUser) {
    // Preferred path: atomic RPC. Server validates price from room_items,
    // locks the balance row, records ownership + transaction in one txn.
    if (_roomUseBuyRpc) {
      try {
        var rpc = await sb.rpc('buy_room_item', { p_item_id: itemId });
        if (rpc.error && _isMissingRelation(rpc.error)) {
          _roomUseBuyRpc = false; // fall through to guarded update below
        } else if (rpc.error) {
          if (typeof toast === 'function') toast('Purchase failed!');
          return;
        } else {
          var body = rpc.data || {};
          if (!body.ok) {
            if (body.error === 'INSUFFICIENT_NYANG') {
              if (typeof toast === 'function') toast('Not enough nyang!');
              if (typeof body.current === 'number') _setNyangBalance(body.current);
            } else {
              if (typeof toast === 'function') toast('Purchase failed!');
            }
            return;
          }
          newCoin = Number(body.nyang_balance);
          // Keep local owned list in sync with the server write (RPC already
          // inserted into user_room_state.owned, so this is just a mirror).
          var ownedRpc = getRoomOwned();
          if (ownedRpc.indexOf(itemId) === -1) {
            ownedRpc.push(itemId);
            try { localStorage.setItem(K_ROOM_OWNED, JSON.stringify(ownedRpc)); } catch(e) {}
          }
          _setNyangBalance(newCoin);
          if (typeof toast === 'function') toast('Purchased ' + def.name + '!');
          if (typeof _fjMarkDone === 'function') _fjMarkDone('shop');
          closeRoomShop();
          openRoomShop();
          return;
        }
      } catch(e) {
        if (_isMissingRelation(e)) { _roomUseBuyRpc = false; }
        else {
          if (typeof toast === 'function') toast('Purchase failed!');
          return;
        }
      }
    }

    // Fallback path (before the migration runs): guarded .update() so two
    // concurrent purchases can't both succeed against the same balance.
    try {
      var upd = await sb.from('user_stats')
        .update({coin_balance: newCoin})
        .eq('user_id', supaUser.id)
        .gte('coin_balance', def.price)
        .select('coin_balance');
      if (upd.error) throw upd.error;
      if (!upd.data || upd.data.length === 0) {
        if (typeof toast === 'function') toast('Balance out of sync — reloading.');
        if (typeof _reloadUserStats === 'function') _reloadUserStats();
        return;
      }
      newCoin = Number(upd.data[0].coin_balance);
      try {
        await sb.from('coin_transactions').insert({
          user_id: supaUser.id, tx_type:'spend', amount: -def.price,
          balance_after: newCoin, source:'room_item', memo:'Room item: ' + def.name
        });
      } catch(e) {}
    } catch(e) {
      if (typeof toast === 'function') toast('Purchase failed!');
      return;
    }
  }

  // Update owned list
  var owned = getRoomOwned();
  owned.push(itemId);
  setRoomOwned(owned);

  // Update balance displays via the single helper (also sets _userCoin).
  _setNyangBalance(newCoin);

  if (typeof toast === 'function') toast('Purchased ' + def.name + '!');
  if (typeof _fjMarkDone === 'function') _fjMarkDone('shop');

  // Refresh shop
  closeRoomShop();
  openRoomShop();
}

// ── Place item in room ───────────────────────────────────────
function placeRoomItem(itemId) {
  var def = getRoomItemDef(itemId);
  if (!def) return;
  if (!isRoomItemOwned(itemId)) return;
  if (isItemPlaced(itemId)) return;

  var layout = getRoomLayout();
  // Place in a default position (center-ish, slightly randomized)
  var x = 120 + Math.floor(Math.random() * 120);
  var y = 140 + Math.floor(Math.random() * 100);
  layout.push({id: itemId, x: x, y: y, scale:100});
  setRoomLayout(layout);

  renderRoomItems();
  updateRoomSizeUI();
  if (typeof toast === 'function') toast(def.name + ' placed! Use Edit to move it.');
  if (typeof _fjMarkDone === 'function') _fjMarkDone('room');

  // Refresh shop
  closeRoomShop();
  openRoomShop();
}

// ── Remove item from room ────────────────────────────────────
function removeRoomItem(itemId) {
  var prevLayout = getRoomLayout();
  var removed = null;
  var nextLayout = prevLayout.filter(function(p) {
    if (p.id === itemId) { removed = p; return false; }
    return true;
  });
  setRoomLayout(nextLayout);

  renderRoomItems();
  if (_selectedRoomItemId === itemId) _selectedRoomItemId = null;
  updateRoomSizeUI();
  _showRemoveUndoToast(removed);

  // Refresh shop so the item flips back to "Place" state.
  var shopOpen = !!document.querySelector('.room-shop-overlay');
  closeRoomShop();
  if (shopOpen) openRoomShop(true);
}

// 5-second undo window after a remove. Tapping Undo re-appends the item with
// its original position/scale/flipped state, so nothing is lost by accident.
function _showRemoveUndoToast(removed) {
  var existing = document.getElementById('room-undo-toast');
  if (existing) existing.remove();
  if (!removed) {
    if (typeof toast === 'function') toast('Item removed from room.');
    return;
  }
  var el = document.createElement('div');
  el.id = 'room-undo-toast';
  el.setAttribute('style',
    'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);'
    + 'background:#0b1626;color:#fff;padding:10px 14px;border-radius:12px;'
    + 'display:flex;align-items:center;gap:12px;font-family:inherit;font-size:13px;'
    + 'font-weight:700;box-shadow:0 12px 32px rgba(0,0,0,.35);z-index:9999;'
  );
  var label = document.createElement('span');
  label.textContent = 'Removed from room';
  var btn = document.createElement('button');
  btn.textContent = 'Undo';
  btn.setAttribute('style',
    'background:#fbbf24;color:#0b1626;border:none;border-radius:999px;'
    + 'padding:5px 12px;font-weight:800;cursor:pointer;font-family:inherit;'
  );
  btn.addEventListener('click', function() {
    var cur = getRoomLayout();
    // Only restore if the item wasn't re-placed during the undo window.
    if (!cur.some(function(p){ return p.id === removed.id; })) {
      cur.push(removed);
      setRoomLayout(cur);
      renderRoomItems();
    }
    el.remove();
  });
  el.appendChild(label);
  el.appendChild(btn);
  document.body.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.remove(); }, 5000);
}

// ── Saved Words modal ────────────────────────────────────────
async function openSavedWordsModal() {
  var existing = document.querySelector('.nn-overlay');
  if (existing) existing.remove();

  var overlay = document.createElement('div');
  overlay.className = 'nn-overlay';
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });

  var modal = document.createElement('div');
  modal.className = 'nn-modal';
  modal.style.maxHeight = '80vh';
  modal.style.overflow = 'auto';
  modal.innerHTML = '<h3>Saved Words</h3><p style="color:#94a3b8">Loading…</p>';
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  var sb = getSupa();
  var words = [];
  if (sb && supaUser) {
    try {
      var res = await sb.from('saved_words').select('word_ko, word_en, word_rom, created_at').eq('user_id', supaUser.id).order('created_at', { ascending: false }).limit(100);
      if (res.data) words = res.data;
    } catch(e) {}
  }
  // Also check localStorage
  if (!words.length) {
    try {
      var lsWords = JSON.parse(localStorage.getItem('kh_saved') || '[]');
      words = lsWords.map(function(w) {
        if (typeof w === 'string') return { word_ko: w, word_en: '', word_rom: '' };
        return w;
      });
    } catch(e) {}
  }

  if (!words.length) {
    modal.innerHTML = '<h3>Saved Words</h3>'
      + '<div style="text-align:center;padding:28px 0">'
      + '<div style="display:inline-flex;width:38px;height:38px;margin-bottom:10px;color:#a78bfa"><i data-lucide="library" class="kh-ui-icon" style="width:38px;height:38px" aria-hidden="true"></i></div>'
      + '<div style="font-size:14px;color:#0f172a;font-weight:700;margin-bottom:6px">No saved words yet</div>'
      + '<div style="font-size:12px;color:#64748b;line-height:1.6;max-width:240px;margin:0 auto">Tap or hover any Korean word while reading an article — it saves to your Word Book and shows up here for review.</div>'
      + '</div>'
      + '<div style="display:flex;gap:8px;margin-top:12px">'
      +   '<a href="korehan-news.html" style="flex:1;padding:11px;border-radius:10px;background:#2255a4;color:#fff;font-size:13px;font-weight:800;text-align:center;text-decoration:none">Browse articles →</a>'
      +   '<button class="nn-btn-cancel" style="flex:1" onclick="this.closest(\'.nn-overlay\').remove()">Close</button>'
      + '</div>';
    return;
  }

  var listHtml = words.map(function(w) {
    var ko = _escapeHtml(w.word_ko);
    var rom = _escapeHtml(w.word_rom);
    var en = _escapeHtml(w.word_en);
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f4f9">'
      + '<div><div style="font-size:15px;font-weight:700;color:#0b1626">' + ko + '</div>'
      + (rom ? '<div style="font-size:11px;color:#94a3b8">' + rom + '</div>' : '') + '</div>'
      + '<div style="font-size:13px;color:#475569;text-align:right;max-width:180px">' + en + '</div>'
      + '</div>';
  }).join('');

  modal.innerHTML = '<h3>Saved Words <span style="font-size:12px;font-weight:500;color:#94a3b8">(' + words.length + ')</span></h3>'
    + '<div style="max-height:55vh;overflow-y:auto">' + listHtml + '</div>'
    + '<button class="nn-btn-cancel" style="width:100%;margin-top:16px" onclick="this.closest(\'.nn-overlay\').remove()">Close</button>';
}

// ── Badges rendering on mypage ──────────────────────────────
// ── Progress section ──────────────────────────────────────────
// Two panes:
//  1) "Up Next" — the three closest unearned badges with progress bars.
//  2) Activity heatmap — 12-week GitHub-style grid driven by the same
//     kh_study_log dictionary that drives the streak count, so what the
//     learner sees on this card is exactly what their streak/badge
//     checks see internally.
function renderMyPageProgress() {
  if (typeof BADGE_DEFS === 'undefined' || typeof getEarnedBadges !== 'function') {
    var pane = document.getElementById('mp-up-next-pane');
    if (pane) pane.innerHTML = '<div style="font-size:12px;color:#94a3b8">Badge system loading…</div>';
    return;
  }
  _renderUpNextBadges();
  _renderActivityHeatmap();
}

// Auto-derive (current, target) for a badge from its id pattern. Avoids
// having to maintain a parallel progress map alongside BADGE_DEFS' check
// functions — the id already encodes the threshold.
function _badgeProgress(b) {
  if (!b || !b.id) return null;
  var id = b.id, m;
  function safeGet(fn, dflt) { try { return fn(); } catch(e) { return dflt; } }
  if ((m = /^streak_(\d+)$/.exec(id))) {
    return { current: safeGet(getCurrentStreak, 0), target: +m[1] };
  }
  if ((m = /^read_(\d+)$/.exec(id))) {
    return { current: safeGet(getTotalArticlesRead, 0), target: +m[1] };
  }
  if ((m = /^word_(\d+)$/.exec(id))) {
    var saved = (typeof lsGet === 'function' && typeof K_SAVED !== 'undefined') ? lsGet(K_SAVED, []).length : 0;
    return { current: saved, target: +m[1] };
  }
  if ((m = /^xp_(\d+)$/.exec(id))) {
    return { current: safeGet(getXP, 0), target: +m[1] };
  }
  if ((m = /^sec_(\w+)$/.exec(id))) {
    var secMap = { society:'사회', world:'국제', culture:'문화', sports:'스포츠', korea:'Korea', beauty:'beauty', travel:'travel', opinion:'오피니언' };
    var sec = secMap[m[1]];
    if (!sec) return null;
    var counts = safeGet(getSectionReadCounts, {});
    var t = m[1] === 'opinion' ? 10 : 20;
    return { current: counts[sec] || 0, target: t };
  }
  return null;
}

function _renderUpNextBadges() {
  var pane = document.getElementById('mp-up-next-pane');
  if (!pane) return;
  var earned = getEarnedBadges();
  var withProgress = [];
  BADGE_DEFS.forEach(function(b) {
    if (earned[b.id]) return; // already earned
    var p = _badgeProgress(b);
    if (!p || !p.target) return;
    var pct = Math.min(99, Math.round((p.current / p.target) * 100));
    if (pct < 1) return; // zero-progress badges aren't 'up next' yet
    withProgress.push({ b: b, current: p.current, target: p.target, pct: pct });
  });
  withProgress.sort(function(a, b){ return b.pct - a.pct; });
  var top = withProgress.slice(0, 3);

  if (!top.length) {
    pane.innerHTML = '<div class="mp-up-next-title">Up Next</div>'
      + '<div style="font-size:12px;color:#94a3b8">Read an article, save a word, or do a quiz to start your next badge.</div>';
    return;
  }
  pane.innerHTML =
      '<div class="mp-up-next-title">Up Next</div>'
    + top.map(function(t) {
        return '<div class="mp-up-next-row">'
          + '<div class="mp-up-next-icon">' + (t.b.icon || '🏅') + '</div>'
          + '<div class="mp-up-next-body">'
            + '<div class="mp-up-next-name"><span>' + _escapeHtml(t.b.name) + '</span><span class="mp-up-next-meta">' + t.current + ' / ' + t.target + '</span></div>'
            + '<div class="mp-up-next-desc">' + _escapeHtml(t.b.desc || '') + '</div>'
            + '<div class="mp-up-next-bar"><div class="mp-up-next-fill" style="width:' + t.pct + '%"></div></div>'
          + '</div>'
        + '</div>';
      }).join('');
}

// Activity-per-day heatmap — last 12 weeks. Each cell counts
// articles + words + quiz from kh_study_log. Future days inside the
// current week stay empty so the trailing column doesn't lie.
function _renderActivityHeatmap() {
  var pane = document.getElementById('mp-heatmap-pane');
  if (!pane || typeof lsGet !== 'function') return;
  var log = lsGet('kh_study_log', {}) || {};
  var weeks = 12;
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var todayDow = today.getDay(); // 0 (Sun) .. 6 (Sat)
  // Anchor the rightmost column to "this week" — start from Sunday of
  // the (weeks-1) weeks ago.
  var firstSunday = new Date(today);
  firstSunday.setDate(today.getDate() - todayDow - (weeks - 1) * 7);

  var totalThisPeriod = 0;
  var cellsHTML = '';
  for (var w = 0; w < weeks; w++) {
    for (var d = 0; d < 7; d++) {
      var date = new Date(firstSunday);
      date.setDate(firstSunday.getDate() + (w * 7) + d);
      if (date > today) {
        cellsHTML += '<div class="mp-hm-cell empty"></div>';
        continue;
      }
      var key = _ymd(date);
      var entry = log[key] || {};
      var total = (entry.articles||0) + (entry.words||0) + (entry.quiz||0);
      totalThisPeriod += total;
      var lvl = total === 0 ? 0 : total < 3 ? 1 : total < 8 ? 2 : total < 15 ? 3 : 4;
      cellsHTML += '<div class="mp-hm-cell lvl-' + lvl + '" title="' + key + ' · ' + total + ' activities"></div>';
    }
  }
  pane.innerHTML =
      '<div class="mp-heatmap-title"><span>Last ' + weeks + ' weeks</span><span style="font-weight:700;color:#0b1626">' + totalThisPeriod + ' activities</span></div>'
    + '<div class="mp-heatmap-grid">' + cellsHTML + '</div>'
    + '<div class="mp-heatmap-legend">'
      + '<span>Less</span>'
      + '<div class="mp-hm-cell lvl-0"></div>'
      + '<div class="mp-hm-cell lvl-1"></div>'
      + '<div class="mp-hm-cell lvl-2"></div>'
      + '<div class="mp-hm-cell lvl-3"></div>'
      + '<div class="mp-hm-cell lvl-4"></div>'
      + '<span>More</span>'
    + '</div>';
}

function _ymd(d) {
  var m = d.getMonth() + 1;
  var day = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
}

function renderMyPageBadges() {
  var el = document.getElementById('mp-badges-content');
  if (!el) return;

  // Check if kh-badges.js is loaded
  if (typeof BADGE_DEFS === 'undefined' || typeof getEarnedBadges !== 'function') {
    el.innerHTML = '<div style="color:#94a3b8;font-size:13px">Badge system loading…</div>';
    return;
  }

  var earned = getEarnedBadges();
  var earnedCount = Object.keys(earned).length;
  var total = BADGE_DEFS.length;
  var pct = total > 0 ? Math.round(earnedCount / total * 100) : 0;

  var tierColor = { bronze:'#cd7c3a', silver:'#9aa5b4', gold:'#f5a623', diamond:'#60a5fa', legendary:'#a855f7' };
  var tierBg    = { bronze:'#fff3e0', silver:'#f1f5f9', gold:'#fffbeb', diamond:'#eff6ff', legendary:'#fdf4ff' };

  var html = '<div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap">'
    + '<div style="font-size:24px;font-weight:900;color:#0b1626">' + earnedCount + '<span style="font-size:14px;font-weight:500;color:#94a3b8">/' + total + '</span></div>'
    + '<div style="flex:1;min-width:120px"><div class="badge-progress-bar"><div class="badge-progress-fill" style="width:' + pct + '%"></div></div>'
    + '<div style="font-size:10px;color:#94a3b8;margin-top:4px">' + pct + '% complete</div></div>'
    + '</div>';

  // Show earned badges first, then a few locked ones
  var earnedBadges = BADGE_DEFS.filter(function(b) { return !!earned[b.id]; });
  var lockedBadges = BADGE_DEFS.filter(function(b) { return !earned[b.id]; });

  html += '<div class="badge-grid-mp">';
  earnedBadges.forEach(function(b) {
    var c = tierColor[b.tier] || '#f5a623';
    var bg = tierBg[b.tier] || '#fffbeb';
    html += '<div class="badge-item-mp" title="' + b.name + ': ' + b.desc + '">'
      + '<div class="badge-icon-mp earned" style="background:' + bg + ';--badge-color:' + c + ';--badge-glow:' + c + '33">' + b.icon + '</div>'
      + '<div class="badge-name-mp">' + b.name + '</div></div>';
  });
  // Show first 8 locked badges
  lockedBadges.slice(0, 8).forEach(function(b) {
    html += '<div class="badge-item-mp" title="' + b.name + ': ' + b.desc + ' (Locked)">'
      + '<div class="badge-icon-mp locked" style="background:#f4f6fa">' + b.icon + '</div>'
      + '<div class="badge-name-mp" style="color:#cbd5e1">' + b.name + '</div></div>';
  });
  if (lockedBadges.length > 8) {
    // Clickable chip that opens the full badges modal — previously a static
    // div with no handler, so tapping did nothing.
    html += '<div class="badge-item-mp" onclick="openAllBadgesModal()" role="button" tabindex="0"'
      + ' style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:54px;height:54px;cursor:pointer;border:1.5px dashed #cbd5e1;border-radius:50%;transition:all .15s"'
      + ' onmouseover="this.style.borderColor=\'#2563eb\';this.style.background=\'#eff6ff\'"'
      + ' onmouseout="this.style.borderColor=\'#cbd5e1\';this.style.background=\'transparent\'"'
      + ' title="Show all badges">'
      + '<div style="font-size:13px;font-weight:900;color:#2563eb;line-height:1">+' + (lockedBadges.length - 8) + '</div>'
      + '<div style="font-size:8px;font-weight:700;color:#64748b;margin-top:2px;text-transform:uppercase;letter-spacing:.05em">View all</div>'
      + '</div>';
  }
  html += '</div>';

  el.innerHTML = html;
}

// ── Full-badges modal ─────────────────────────────────────────
function openAllBadgesModal() {
  var existing = document.getElementById('all-badges-overlay');
  if (existing) existing.remove();
  var overlay = document.createElement('div');
  overlay.id = 'all-badges-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(5,12,24,.78);display:flex;align-items:center;justify-content:center;z-index:3500;padding:14px';
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });

  var modal = document.createElement('div');
  modal.style.cssText = 'background:#fff;border-radius:18px;width:min(760px,96vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden';
  modal.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #eef2f7;flex-shrink:0">'
    +   '<h3 style="margin:0;font-size:16px;font-weight:900;color:#0b1626;letter-spacing:.02em">All Badges</h3>'
    +   '<button onclick="document.getElementById(\'all-badges-overlay\').remove()" aria-label="Close" style="border:none;background:#f1f5f9;color:#475569;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1">&times;</button>'
    + '</div>'
    + '<div id="all-badges-body" style="flex:1;overflow-y:auto;padding:20px 22px"></div>';
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  var body = document.getElementById('all-badges-body');
  if (typeof renderBadgePage === 'function' && body) {
    try { renderBadgePage(body); } catch(e) { body.innerHTML = '<div style="text-align:center;padding:20px;color:#ef4444">Failed to load: ' + _escapeHtml(e && e.message) + '</div>'; }
  } else if (body) {
    body.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8">Badge system is still loading — try again in a moment.</div>';
  }
}

document.addEventListener('DOMContentLoaded', function() {
  function _startMyPage() { initMyPage(); loadRoomLayout(); }
  // supaUser가 이미 있으면 즉시 실행, 없으면 이벤트 대기
  if (window.supaUser) {
    _startMyPage();
  } else {
    window.addEventListener('kh-auth-signed-in', function() { _startMyPage(); }, { once: true });
    // 세션 체크 완료 후에도 미로그인이면 실행 (게스트 모드)
    var _fallback = setTimeout(function() { if (!window.supaUser) _startMyPage(); }, 3000);
    window.addEventListener('kh-auth-signed-in', function() { clearTimeout(_fallback); }, { once: true });
  }
});
