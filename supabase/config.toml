# Supabase per-function config. The CLI reads this on `supabase functions
# deploy` (and `supabase functions serve`) and propagates the per-function
# settings to the deployed function metadata.
#
# notify-signup must accept OPTIONS preflight without a JWT — the browser
# does the preflight before any session token is attached, and our gateway
# was returning 401 on that OPTIONS request, breaking CORS. The function
# itself does server-side auth: it ignores the caller's claims and uses
# the service role to look up the user by id, then checks `created_at`
# freshness (≤5min) to reject spoofed payloads. So gateway-level JWT
# verification adds nothing here and only breaks the signup-time call.
[functions.notify-signup]
verify_jwt = false

# daily-article-draft is called by pg_cron with CRON_SECRET (not a JWT) and
# by the admin CMS (browser preflight). The function does its own auth
# (service role / CRON_SECRET / admin email), so gateway JWT checks would
# only 401 the cron call.
[functions.daily-article-draft]
verify_jwt = false

# daily-content-gen is called by pg_cron with CRON_SECRET (not a JWT) and
# authenticates itself (service role / CRON_SECRET / admin email). Keep the
# gateway check off so a CLI redeploy doesn't 401 the nightly cron.
[functions.daily-content-gen]
verify_jwt = false

# article-analyze is called from the article reader with the user's JWT.
# Gateway check off so the browser's CORS preflight isn't 401'd; the
# function verifies the token itself (signed-in readers only).
[functions.article-analyze]
verify_jwt = false

# cache-write: readers' browsers save shared AI cache rows through it; it
# verifies the user's JWT itself (gateway check off for CORS preflight).
[functions.cache-write]
verify_jwt = false

# billing: called from the plans page with the user's JWT; verified in the
# function (gateway check off so CORS preflight passes).
[functions.billing]
verify_jwt = false

# billing-webhook: called by Stripe; authenticated by Stripe-Signature.
[functions.billing-webhook]
verify_jwt = false

# phone-call-gen: admin-only (checked in the function against the admin
# email); gateway check off so the admin CMS preflight passes.
[functions.phone-call-gen]
verify_jwt = false

# Cron-invoked with CRON_SECRET (not a user JWT) — auth is checked in the function.
[functions.content-qa]
verify_jwt = false

# topik-gen is called by pg_cron with CRON_SECRET and by the admin from the
# TOPIK page; it does its own auth (service role / CRON_SECRET / admin email).
[functions.topik-gen]
verify_jwt = false

# preview-login: owner's temporary preview link; the token is checked in the
# function (gateway check off so CORS preflight passes).
[functions.preview-login]
verify_jwt = false
